<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">

<!-- ✅ board-detail 전용 CSS는 pageStyles로 -->
<th:block layout:fragment="pageStyles">
    <link rel="stylesheet" th:href="@{/css/styles1.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ❌ :root, body는 layout.html이 담당(겹치면 전체 배경이 덮임) → 제거 권장
           기존 board-detail의 컨텐츠 스타일만 유지 */

        * {
            box-sizing: border-box;
        }

        .subbar-main {
            flex: 1;
            min-width: 0; /* 테이블/에디터 overflow 방지 */
            padding: 24px; /* meeting과 동일한 여백 */
        }

        h2 {
            margin: 0 0 14px;
            font-weight: 900;
            letter-spacing: -0.3px;
        }

        .card {
            background: var(--card, #ffffff);
            border: 1px solid rgba(17, 24, 39, .10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17, 24, 39, .06);
            overflow: hidden;
            margin-bottom: 14px;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .summary-table th,
        .summary-table td {
            border-top: 1px solid rgba(17, 24, 39, .08);
            padding: 14px 14px;
            vertical-align: middle;
        }

        .summary-table tr:first-child th,
        .summary-table tr:first-child td {
            border-top: 0;
        }

        .summary-table th {
            width: 160px;
            background: rgba(17, 24, 39, .02);
            font-weight: 900;
            color: #111827;
            text-align: center;
            letter-spacing: -0.2px;
        }

        .summary-table td {
            font-weight: 800;
            color: var(--text, #1f2937);
        }

        /* ===== Contents viewer card ===== */
        .contents-card {
            background: var(--card, #ffffff);
            border: 1px solid rgba(17, 24, 39, .10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17, 24, 39, .06);
            overflow: hidden;
            margin-bottom: 14px;
        }

        .contents-body {
            padding: 18px;
            background: #fff;
        }

        /* TipTap/HTML 공통 렌더 스타일 */
        #boardDescription {
            white-space: normal;
            line-height: 1.75;
        }

        #boardDescription .ProseMirror {
            outline: none;
            white-space: pre-wrap;
            line-height: 1.75;
        }

        #boardDescription h2 {
            margin: 12px 0 8px;
            font-size: 1.25rem;
            font-weight: 900;
        }

        #boardDescription p {
            margin: 8px 0;
        }

        #boardDescription ul, #boardDescription ol {
            padding-left: 22px;
            margin: 8px 0;
        }

        #boardDescription blockquote {
            margin: 10px 0;
            padding: 10px 12px;
            border-left: 4px solid rgba(59, 130, 246, .35);
            background: rgba(59, 130, 246, .06);
            border-radius: 10px;
        }

        #boardDescription pre {
            background: rgba(17, 24, 39, .06);
            padding: 12px;
            border-radius: 10px;
            overflow: auto;
        }

        #boardDescription code {
            background: rgba(17, 24, 39, .06);
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 800;
        }

        #boardDescription a {
            color: var(--primary2, #2563eb);
            font-weight: 900;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        #boardDescription table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
            margin: 10px 0;
        }

        #boardDescription th, #boardDescription td {
            border: 1px solid rgba(17, 24, 39, .18);
            padding: 10px;
            vertical-align: top;
            word-break: break-word;
            position: relative;
        }

        #boardDescription th {
            background: rgba(17, 24, 39, .03);
            font-weight: 900;
            color: var(--muted, #6b7280);
        }

        #boardDescription .selectedCell:after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(59, 130, 246, .08);
            pointer-events: none;
        }

        /* ===== Writer tooltip ===== */
        .writer-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
        }

        .writer-btn {
            appearance: none;
            border: 0;
            background: transparent;
            padding: 0;
            cursor: pointer;
            color: var(--primary2, #2563eb);
            font-weight: 900;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .writer-btn:focus {
            outline: none;
        }

        .tooltip-bubble {
            position: absolute;
            z-index: 50;
            min-width: 220px;
            max-width: 320px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #111827;
            color: #fff;
            box-shadow: 0 16px 36px rgba(0, 0, 0, .18);
            border: 1px solid rgba(255, 255, 255, .12);
            transform: translateY(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s ease, transform .15s ease;
        }

        .tooltip-bubble::before {
            content: "";
            position: absolute;
            top: -7px;
            left: 18px;
            width: 12px;
            height: 12px;
            background: #111827;
            transform: rotate(45deg);
            border-left: 1px solid rgba(255, 255, 255, .12);
            border-top: 1px solid rgba(255, 255, 255, .12);
        }

        .tooltip-title {
            font-weight: 1000;
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }

        .tooltip-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-weight: 800;
            font-size: 13px;
            color: rgba(255, 255, 255, .92);
        }

        .tooltip-row span:first-child {
            color: rgba(255, 255, 255, .70);
        }

        .tooltip-host {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .tooltip-host.show .tooltip-bubble {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* meta row */
        .meta-inline {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            color: var(--muted, #6b7280);
            font-weight: 900;
        }

        .meta-inline .meta-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .meta-inline .k {
            color: #111827;
            opacity: .65;
            font-weight: 900;
        }

        .meta-inline .v {
            color: #111827;
            font-weight: 1000;
        }

        /* ===== Attach card ===== */
        .attach-card {
            background: var(--card, #ffffff);
            border: 1px solid rgba(17, 24, 39, .10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17, 24, 39, .06);
            padding: 14px;
            margin-bottom: 14px;
        }

        .attach-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .attach-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: -0.2px;
        }

        #attachList {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 10px;
        }

        #attachList th {
            text-align: left;
            font-size: .9rem;
            color: var(--muted, #6b7280);
            background: rgba(17, 24, 39, .03);
            padding: 12px;
            border-bottom: 1px solid rgba(17, 24, 39, .08);
            font-weight: 900;
        }

        #attachList td {
            padding: 12px;
            border-bottom: 1px solid rgba(17, 24, 39, .06);
            font-size: .95rem;
            color: var(--text, #1f2937);
            font-weight: 700;
        }

        #attachList tr:hover td {
            background: rgba(59, 130, 246, .05);
        }

        .btn {
            appearance: none;
            border: 1px solid rgba(17, 24, 39, .12);
            background: #fff;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 900;
            color: var(--text, #1f2937);
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(17, 24, 39, .06);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(17, 24, 39, .10);
            border-color: rgba(59, 130, 246, .28);
            background: rgba(59, 130, 246, .05);
        }

        .btn-danger {
            background: linear-gradient(135deg, rgba(220, 38, 38, .14), rgba(255, 255, 255, 0));
            border-color: rgba(220, 38, 38, .25);
            color: #991b1b;
        }

        .btn-danger:hover {
            background: rgba(220, 38, 38, .06);
            border-color: rgba(220, 38, 38, .40);
        }

        .btn-sm {
            padding: 8px 10px;
            font-weight: 900;
            border-radius: 8px;
            font-size: 12px;
            box-shadow: 0 6px 14px rgba(17, 24, 39, .05);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        @media (max-width: 720px) {
            .summary-table th {
                width: 110px;
            }

            .tooltip-bubble {
                left: 0 !important;
                right: auto !important;
            }
        }

        /* ===== Comment editor (matches board-detail cards/buttons) ===== */
        .comment-editor{
            background: var(--card, #ffffff);
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            overflow: hidden;
            margin: 12px 0 14px;
        }

        /* textarea */
        .comment-editor textarea#commentContents{
            width: 100%;
            min-height: 120px; /* rows=5 느낌 유지 */
            resize: vertical;
            border: 0;
            outline: none;
            padding: 14px 14px;
            background: #fff;
            color: var(--text, #1f2937);
            font-weight: 700;
            line-height: 1.65;
        }

        /* placeholder 톤 */
        .comment-editor textarea#commentContents::placeholder{
            color: rgba(107,114,128,.9);
            font-weight: 800;
        }

        /* focus ring (board-form input 느낌) */
        .comment-editor:focus-within{
            border-color: rgba(59,130,246,.35);
            box-shadow: 0 10px 24px rgba(17,24,39,.06), 0 0 0 4px rgba(59,130,246,.12);
        }

        /* footer (counter + actions) */
        .comment-editor__footer{
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            border-top: 1px solid rgba(17,24,39,.10);
            background: rgba(17,24,39,.02);
        }

        .comment-editor__counter{
            font-weight: 900;
            color: var(--muted, #6b7280);
            letter-spacing: -0.1px;
            white-space: nowrap;
        }

        .comment-editor__counter #commentByte{
            color: #111827;
            font-weight: 1000;
        }

        /* over-limit 시 JS로 .over를 붙이면 경고색 (선택) */
        .comment-editor__counter.over,
        .comment-editor__counter.over #commentByte{
            color: #991b1b;
        }

        /* action buttons alignment */
        .comment-editor__actions{
            display: inline-flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* 버튼은 기존 .btn .btn-sm을 그대로 쓰되, 댓글 영역에서 조금 더 컴팩트하게 */
        .comment-editor__actions .btn.btn-sm{
            padding: 8px 12px;
            min-height: 34px;
        }

        /* 등록 버튼을 살짝 강조(톤 유지하면서) */
        .comment-editor__actions #commentSubmitBtn{
            border-color: rgba(59,130,246,.25);
        }
        .comment-editor__actions #commentSubmitBtn:hover{
            border-color: rgba(59,130,246,.40);
            background: rgba(59,130,246,.07);
        }

        /* 취소 버튼은 덜 강조 */
        .comment-editor__actions #commentCancelBtn{
            color: var(--muted, #6b7280);
        }

        /* mobile */
        @media (max-width: 720px){
            .comment-editor__footer{
                flex-direction: column;
                align-items: stretch;
            }
            .comment-editor__actions{
                width: 100%;
                justify-content: flex-end;
            }
        }

        /* ===== Comment list card/table (matches attachList tone) ===== */
        #comment{
            background: var(--card, #ffffff);
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            overflow: hidden;
            margin: 12px 0 14px;
        }

        /* table base */
        #commentList{
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
        }

        /* header */
        #commentList thead th{
            text-align: left;
            font-size: .9rem;
            color: var(--muted, #6b7280);
            background: rgba(17,24,39,.03);
            padding: 12px;
            border-bottom: 1px solid rgba(17,24,39,.08);
            font-weight: 900;
            letter-spacing: -0.1px;
            white-space: nowrap;
        }

        /* body cells */
        #commentList tbody td{
            padding: 12px;
            border-bottom: 1px solid rgba(17,24,39,.06);
            font-size: .95rem;
            color: var(--text, #1f2937);
            font-weight: 700;
            vertical-align: top;
        }

        /* hover row */
        #commentList tbody tr:hover td{
            background: rgba(59,130,246,.05);
        }

        /* empty row (when no comments) */
        #commentList td[colspan]{
            padding: 18px 12px;
            color: var(--muted, #6b7280);
            font-weight: 900;
            text-align: center;
        }

        /* column sizing */

        #commentList .comment-no{
            width: 64px;
            padding: 0;
        }

        #commentList .comment-no > span,
        #commentList .comment-no{
            display: flex;
            align-items: center;
            justify-content: center;  /* ✅ 진짜 시각적 중앙 */
        }




        #commentList .comment-date{
            width: 130px;
            white-space: nowrap;
            color: var(--muted, #6b7280);
            font-weight: 900;
        }

        /* content block */
        #commentList .comment-content{
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            font-weight: 700;
        }

        /* meta block (writer/dept) */
        #commentList .comment-meta{
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        #commentList .comment-meta .name{
            font-weight: 1000;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #commentList .comment-meta .dept{
            font-size: 12px;
            font-weight: 900;
            color: var(--muted, #6b7280);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* make header/body align nicely on small screens */
        @media (max-width: 900px){
            /* 좁은 화면에서는 부서 컬럼 숨겨서 내용 폭 확보 */
            #commentList thead th:nth-child(4),
            #commentList tbody td:nth-child(4){
                display: none;
            }
        }
        @media (max-width: 720px){
            /* 더 좁으면 등록일도 숨김 */
            #commentList thead th:nth-child(5),
            #commentList tbody td:nth-child(5){
                display: none;
            }
        }

        /* ===== Compact → Expandable comment textarea ===== */
        .comment-editor textarea#commentContents{
            width: 100%;
            height: 40px;              /* ✅ 기본 한 줄 */
            min-height: 40px;
            max-height: 240px;         /* 너무 커지지 않게 제한 */
            resize: none;              /* 사용자가 드래그하지 않게 */
            overflow: hidden;          /* 자동 확장용 */

            border: 0;
            outline: none;
            padding: 10px 14px;
            background: #fff;

            color: var(--text, #1f2937);
            font-weight: 700;
            line-height: 1.6;

            transition: height .18s ease, padding .18s ease;
        }

        /* 포커스되면 기본 높이 살짝 키움 */
        .comment-editor textarea#commentContents:focus{
            height: 96px;
        }



    </style>
</th:block>

<!-- ✅ layout content -->
<div layout:fragment="content">
    <div class="page-with-subbar">
        <!-- ✅ board-list와 동일하게 sidebar 도킹 -->
        <div th:replace="~{sidebar/board-sidebar :: boardSidebar('board')}"></div>
        <main class="subbar-main">
            <div class="container">
                <h2>자유게시판 상세</h2>

                <div class="card">
                    <table class="summary-table">
                        <tr>
                            <th>제목</th>
                            <td><span id="boardTitle"></span></td>
                        </tr>
                        <tr>
                            <th>카테고리</th>
                            <td><span id="boardCategory"></span></td>
                        </tr>
                    </table>
                </div>

                <div class="contents-card">
                    <div class="contents-body">
                        <div id="boardDescription"></div>
                    </div>
                </div>

                <div class="card">
                    <table class="summary-table">
                        <tr>
                            <th>작성자</th>
                            <td>
                          <span class="writer-wrap">
                            <span class="tooltip-host" id="writerTooltipHost">
                              <button type="button" class="writer-btn" id="boardWriterBtn">
                                <span id="boardWriter">-</span>
                              </button>

                              <div class="tooltip-bubble" id="writerTooltip">
                                <div class="tooltip-title">작성자 정보</div>
                                <div class="tooltip-row"><span>부서</span><span id="boardDepart">-</span></div>
                                <div class="tooltip-row" style="margin-top:6px;"><span>직번</span><span
                                        id="boardWriterId">-</span></div>
                              </div>
                            </span>
                          </span>
                            </td>
                        </tr>
                        <tr>
                            <th>정보</th>
                            <td>
                                <div class="meta-inline">
                              <span class="meta-item">
                                <span class="k">등록일</span><span class="v" id="boardCreated">-</span>
                              </span>
                                    <span class="meta-item">
                                <span class="k">조회</span><span class="v" id="boardRating">-</span>
                              </span>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="attach-card">
                    <div class="attach-head">
                        <h3 class="attach-title">첨부 파일</h3>
                    </div>
                    <table id="attachList"></table>
                </div>

                <h2>관련 댓글</h2>
                <div id="comment">
                    <table id="commentList"></table>
                </div>

                <!-- ✅ 댓글 등록 입력란 -->
                <div id="commentEditor" class="comment-editor">
                    <textarea id="commentContents"
                     placeholder="의견입력"
                     rows="5"></textarea>

                    <div class="comment-editor__footer">
                        <div class="comment-editor__counter">
                            <span id="commentByte">0</span>/600bytes
                        </div>

                        <div class="comment-editor__actions">
                            <button type="button" class="btn btn-sm" id="commentSubmitBtn">등록</button>
                            <button type="button" class="btn btn-sm" id="commentCancelBtn">취소</button>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <a href="/board/list" class="btn"><i class="fa-solid fa-list"></i> 목록</a>
                    <button id="delete-btn" class="btn btn-danger" type="button" onclick="deleteBoard()">
                        <i class="fa-solid fa-trash"></i> 삭제
                    </button>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- ✅ JS는 pageScripts로 (생략 X) -->
<th:block layout:fragment="pageScripts">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- ✅ TipTap viewer: JSON/HTML 자동 렌더 -->
    <script type="module">
        import {Editor} from "https://esm.sh/@tiptap/core@2.11.5";
        import StarterKit from "https://esm.sh/@tiptap/starter-kit@2.11.5";
        import Underline from "https://esm.sh/@tiptap/extension-underline@2.11.5";
        import TextAlign from "https://esm.sh/@tiptap/extension-text-align@2.11.5";
        import Table from "https://esm.sh/@tiptap/extension-table@2.11.5";
        import TableRow from "https://esm.sh/@tiptap/extension-table-row@2.11.5";
        import TableHeader from "https://esm.sh/@tiptap/extension-table-header@2.11.5";
        import TableCell from "https://esm.sh/@tiptap/extension-table-cell@2.11.5";

        let viewer = null;

        function ensureViewer() {
            if (viewer) return viewer;
            const host = document.querySelector("#boardDescription");
            viewer = new Editor({
                element: host,
                editable: false,
                extensions: [
                    StarterKit,
                    Underline,
                    TextAlign.configure({types: ["heading", "paragraph"]}),
                    Table.configure({resizable: true}),
                    TableRow, TableHeader, TableCell,
                ],
                content: {type: "doc", content: [{type: "paragraph"}]},
            });
            return viewer;
        }

        function isProbablyJson(str) {
            if (typeof str !== "string") return false;
            const s = str.trim();
            if (!s) return false;
            if (!(s.startsWith("{") || s.startsWith("["))) return false;
            try {
                const obj = JSON.parse(s);
                return !!obj && typeof obj === "object" && (obj.type === "doc" || obj.content);
            } catch {
                return false;
            }
        }

        function isProbablyHtml(str) {
            if (typeof str !== "string") return false;
            const s = str.trim();
            if (!s) return false;
            return /<\/?[a-z][\s\S]*>/i.test(s);
        }

        function escapeHtml(str) {
            return String(str ?? "")
                .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        }

        window.renderBoardContentsAuto = (contents) => {
            const host = document.querySelector("#boardDescription");

            if (contents == null) {
                host.innerHTML = "<p>-</p>";
                return;
            }

            if (typeof contents === "object") {
                const ed = ensureViewer();
                ed.commands.setContent(contents);
                return;
            }

            const raw = String(contents);

            if (isProbablyJson(raw)) {
                const ed = ensureViewer();
                ed.commands.setContent(JSON.parse(raw));
                return;
            }

            if (isProbablyHtml(raw)) {
                if (viewer) {
                    viewer.destroy();
                    viewer = null;
                    host.innerHTML = "";
                }
                host.innerHTML = raw; // ❗ 서버 sanitize 권장
                return;
            }

            if (viewer) {
                viewer.destroy();
                viewer = null;
                host.innerHTML = "";
            }
            host.innerHTML = `<p>${escapeHtml(raw).replaceAll("\n", "<br>")}</p>`;
        };
    </script>

    <script th:inline="javascript">
        const boardNo = [[${boardNo}]];
        const API_BASE = "http://localhost:8090";

        function setupWriterTooltip() {
            const host = document.getElementById("writerTooltipHost");
            const btn = document.getElementById("boardWriterBtn");

            function show() {
                host.classList.add("show");
            }

            function hide() {
                host.classList.remove("show");
            }

            function toggle() {
                host.classList.toggle("show");
            }

            host.addEventListener("mouseenter", show);
            host.addEventListener("mouseleave", hide);

            btn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggle();
            });

            document.addEventListener("click", (e) => {
                if (!host.contains(e.target)) hide();
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") hide();
            });
        }

        async function loadBoardDetail() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/board/${boardNo}`, {
                    method: 'GET',
                    credentials: "include",
                    headers: {'Content-Type': 'application/json'}
                });

                const result = await response.json();

                if (result.status === 200 && result.data) {
                    const board = result.data;

                    $('#boardTitle').text(board.title ?? "-");
                    $('#boardCategory').text(board.catDescript ?? "-");

                    if (window.renderBoardContentsAuto) window.renderBoardContentsAuto(board.contents);
                    else $('#boardDescription').text(board.contents ?? "");

                    $('#boardWriter').text(board.empName ?? "-");
                    $('#boardWriterId').text(board.empId ?? "-");
                    $('#boardDepart').text(board.depName ?? "-");

                    $('#boardCreated').text(board.createdAt ? String(board.createdAt).substring(0, 10) : "-");
                    $('#boardRating').text(board.rating ?? "-");

                    initAttach();
                    initComment();
                    setupWriterTooltip();
                }
            } catch (e) {
                console.error(e);
                alert("상세 로딩 중 오류가 발생했습니다.");
            }
        }

        function unwrapMaybeResponseDto(obj) {
            if (obj && typeof obj === "object" && "data" in obj) return obj.data;
            return obj;
        }

        async function initAttach() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/attachments?domain=BOARD&entityId=${boardNo}`, {
                    method: 'GET',
                    credentials: "include",
                    headers: {'Content-Type': 'application/json'}
                });

                const result = await response.json();
                const attachList = $('#attachList').empty();

                if (result.status === 200 && result.data?.length) {
                    const attachs = result.data;

                    attachList.append(`
                      <tr>
                        <th style="width:90px;">일련번호</th>
                        <th>파일명</th>
                        <th style="width:120px;">size</th>
                        <th style="width:110px;">미리보기</th>
                        <th style="width:110px;">다운로드</th>
                      </tr>
                    `);

                    attachs.forEach((r, index) => {
                        attachList.append(`
                          <tr>
                            <td>${index + 1}</td>
                            <td>${escapeHtml(r.originalName)}</td>
                            <td>${formatFileSize(r.size)}</td>
                            <td><button type="button" class="btn btn-sm" data-view="${r.attachmentId}">미리보기</button></td>
                            <td><button type="button" class="btn btn-sm" data-down="${r.attachmentId}">다운로드</button></td>
                          </tr>
                        `);
                    });

                    document.querySelectorAll("button[data-down]").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            const attachmentId = Number(e.currentTarget.getAttribute("data-down"));
                            await downAttachment(attachmentId);
                        });
                    });

                    document.querySelectorAll("button[data-view]").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            const attachmentId = Number(e.currentTarget.getAttribute("data-view"));
                            await viewAttachment(attachmentId);
                        });
                    });

                } else {
                    attachList.html('<tr><td colspan="5">관련 첨부파일이 없습니다.</td></tr>');
                }
            } catch (e) {
                console.error(e);
            }
        }

        function escapeHtml(str) {
            return String(str ?? "")
                .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        }

        function formatFileSize(bytes) {
            if (bytes == null || isNaN(bytes)) return "-";
            if (bytes < 1024) return `${bytes} B`;
            const kb = bytes / 1024;
            if (kb < 1024) return `${kb.toFixed(1)} KB`;
            const mb = kb / 1024;
            return `${mb.toFixed(1)} MB`;
        }

        async function fetchDownloadUrl(attachmentId) {
            const res = await fetch(`${API_BASE}/api/v1/attachments/${attachmentId}/download-url`, {
                method: "GET",
                credentials: "include",
                headers: {'Accept': 'application/json'}
            });
            if (!res.ok) throw new Error("download-url 호출 실패: " + await res.text());
            const raw = await res.json();
            const data = unwrapMaybeResponseDto(raw);
            const url = data.url;
            if (typeof url !== "string" || !url.startsWith("http")) throw new Error("응답에 url이 없습니다.");
            return {url, meta: data};
        }

        async function fetchPreviewUrl(attachmentId) {
            const res = await fetch(`${API_BASE}/api/v1/attachments/${attachmentId}/preview-url`, {
                method: "GET",
                credentials: "include",
                headers: {'Accept': 'application/json'}
            });
            if (!res.ok) throw new Error("preview-url 호출 실패: " + await res.text());
            const raw = await res.json();
            const data = unwrapMaybeResponseDto(raw);
            const url = data.url;
            if (typeof url !== "string" || !url.startsWith("http")) throw new Error("응답에 url이 없습니다.");
            return {url, meta: data};
        }

        async function downAttachment(attachmentId) {
            if (!attachmentId) return;
            if (!confirm(`attachmentId=${attachmentId} 파일을 다운로드 할까요?`)) return;

            try {
                const {url, meta} = await fetchDownloadUrl(attachmentId);
                const a = document.createElement("a");
                a.href = url;
                a.rel = "noopener";
                a.download = meta.originalName || "";
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) {
                console.error(e);
                alert("다운로드 중 오류: " + (e?.message ?? e));
            }
        }

        async function viewAttachment(attachmentId) {
            if (!attachmentId) return;
            try {
                const {url} = await fetchPreviewUrl(attachmentId);
                window.open(url, "_blank", "noopener");
            } catch (e) {
                console.error(e);
                alert("미리보기 중 오류: " + (e?.message ?? e));
            }
        }

        async function deleteBoard() {
            if (!confirm("정말 삭제하시겠습니까?")) return;

            try {
                const res = await fetch(`/api/v1/board/${boardNo}`, {
                    method: "DELETE",
                    credentials: "include"
                });

                if (res.ok) {
                    alert("게시글이 삭제되었습니다.");
                    window.location.href = "/board/list";
                } else {
                    alert("삭제 실패했습니다.");
                }
            } catch (e) {
                console.error(e);
                alert("삭제 중 오류 발생");
            }
        }

        async function initComment() {
            try {

                const response = await fetch(`http://localhost:8090/api/v1/boards/${boardNo}/comments`, {
                    method: 'GET',
                    credentials: "include"

                });
                console.log("comments status:", response.status);

                const result = await response.json();

                const commentList = $('#commentList').empty();

                if (!result.data || result.data.length === 0) {
                    commentList.html(`<tr><td colspan="5">등록된 댓글이 없습니다.</td></tr>`);
                    return;
                }

                if (result.status === 200 && result.data) {
                    const comments = result.data;
                    console.log(comments);
                    commentList.append(`
                    <thead>
                        <tr>
                          <th>일련번호</th>
                          <th>내용</th>
                          <th>작성자</th>
                          <th>부서</th>
                          <th>등록일자</th>
                        </tr>
                      </thead>
                      <tbody></tbody>
                `);

                    const tbody = commentList.find("tbody");
                    comments.forEach((r, index) => {

                        const createdAt = r.createdAt ? r.createdAt.substring(0, 10) : "-";
                        tbody.append(`
                        <tr>
                              <td class="comment-no">${index + 1}</td>
                              <td><div class="comment-content">${r.contents ?? ""}</div></td>
                              <td>
                                <div class="comment-meta">
                                  <div class="name">${r.empName ?? "-"}</div>
                                </div>
                              </td>
                              <td>
                                <div class="comment-meta">
                                  <div class="dept">${r.depName ?? "-"}</div>
                                </div>
                              </td>
                              <td class="comment-date">${createdAt}</td>
                        </tr>
                    `);
                    });

                } else {
                    commentList.html('<tr><td colspan="4">관련 댓글이 없습니다.</td></tr>');
                }
            } catch (error) {
                console.error('Failed to load board comments :', error);
            }
        }

        //=====================================================================================
        // ✅ UTF-8 기준 bytes 계산
        function getUtf8Bytes(str) {
            return new Blob([str ?? ""], {type: "text/plain; charset=UTF-8"}).size;
        }

        // ✅ 600 bytes 제한(초과 시 잘라내기)
        function enforceByteLimit(text, limitBytes = 600) {
            if (!text) return "";

            let lo = 0, hi = text.length;
            // 이진 탐색으로 limitBytes에 맞는 최대 길이 찾기
            while (lo < hi) {
                const mid = Math.ceil((lo + hi) / 2);
                const sliced = text.slice(0, mid);
                if (getUtf8Bytes(sliced) <= limitBytes) lo = mid;
                else hi = mid - 1;
            }
            return text.slice(0, lo);
        }

        function updateCommentByteCounter() {
            const ta = document.getElementById("commentContents");
            const counter = document.getElementById("commentByte");

            const limited = enforceByteLimit(ta.value, 600);
            if (limited !== ta.value) ta.value = limited;

            counter.textContent = String(getUtf8Bytes(ta.value));
        }

        // ✅ 댓글 등록
        async function submitComment() {

            const contentsEl = document.getElementById("commentContents");
            const contents = (contentsEl.value ?? "").trim();

            if (!contents) {
                alert("댓글 내용을 입력해주세요.");
                contentsEl.focus();
                return;
            }

            // FormData로 multipart/form-data 전송 (@ModelAttribute 매핑)
            const fd = new FormData();
            fd.append("boardNo", String(boardNo));
            fd.append("contents", contents);

            try {
                const res = await fetch(`${API_BASE}/api/v1/comment`, {
                    method: "POST",
                    credentials: "include",

                    body: fd
                });

                const json = await res.json().catch(() => null);

                if (!res.ok) {
                    console.error("댓글 등록 실패:", res.status, json);
                    alert("댓글 등록 실패: " + (json?.message ?? res.statusText));
                    return;
                }

                // 성공 처리
                alert(json?.message ?? "댓글 등록 성공");
                contentsEl.value = "";
                updateCommentByteCounter();

                // ✅ 댓글 목록 다시 불러오기
                await initComment();

            } catch (e) {
                console.error(e);
                alert("댓글 등록 중 오류: " + (e?.message ?? e));
            }
        }

        function cancelComment() {
            const contentsEl = document.getElementById("commentContents");
            contentsEl.value = "";
            updateCommentByteCounter();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadBoardDetail();
            const ta = document.getElementById("commentContents");
            const submitBtn = document.getElementById("commentSubmitBtn");
            const cancelBtn = document.getElementById("commentCancelBtn");

            if (ta) {
                ta.addEventListener("input", updateCommentByteCounter);
                updateCommentByteCounter();
            }
            if (submitBtn) submitBtn.addEventListener("click", submitComment);
            if (cancelBtn) cancelBtn.addEventListener("click", cancelComment);
        });

        (function autoGrowCommentTextarea(){
            const ta = document.getElementById("commentContents");
            if (!ta) return;

            const COLLAPSED = 40;   // 한 줄 높이
            const EXPANDED = 96;    // 포커스 시 기본 높이
            const MAX = 240;        // 최대 높이

            function resize(){
                ta.style.height = "auto";
                ta.style.height = Math.min(ta.scrollHeight, MAX) + "px";
            }

            ta.addEventListener("focus", () => {
                if (!ta.value.trim()) {
                    ta.style.height = EXPANDED + "px";
                }
            });

            ta.addEventListener("input", resize);

            ta.addEventListener("blur", () => {
                if (!ta.value.trim()) {
                    ta.style.height = COLLAPSED + "px";
                }
            });
        })();


        // document.addEventListener('DOMContentLoaded', loadBoardDetail);
    </script>
