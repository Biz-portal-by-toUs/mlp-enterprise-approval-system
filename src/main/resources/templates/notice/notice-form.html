<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">

<th:block layout:fragment="pageStyles">
    <!-- 기존 head의 css들 유지 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles1.css}">

    <style>
        *{box-sizing:border-box}

        .subbar-main{
            flex: 1;
            min-width: 0;
            padding: 24px;
        }

        h2{
            font-weight: 900;
            letter-spacing: -0.3px;
            margin: 0 0 14px;
        }

        /* ====== Summary table card (제목/팝업여부/팝업기간) ====== */
        .summary-card{
            background: var(--card, #ffffff);
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            overflow: hidden;
            margin-bottom: 14px;
        }
        .summary-table{
            width:100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .summary-table th,
        .summary-table td{
            border-top: 1px solid rgba(17,24,39,.08);
            border-right: 1px solid rgba(17,24,39,.08);
            padding: 14px 14px;
            vertical-align: middle;
        }
        .summary-table tr:first-child th,
        .summary-table tr:first-child td{ border-top: 0; }
        .summary-table th{
            width: 160px;
            background: rgba(17,24,39,.02);
            font-weight: 900;
            color: #111827;
            text-align: center;
            letter-spacing: -0.2px;
        }
        .summary-table td{ border-right: 0; }

        .summary-input{
            width: 100%;
            height: 42px;
            border-radius: 8px;
            border: 1px solid rgba(17,24,39,.14);
            padding: 0 12px;
            font-weight: 800;
            outline: none;
            background: #fff;
        }
        .summary-input:focus{
            border-color: rgba(59,130,246,.55);
            box-shadow: 0 0 0 4px rgba(59,130,246,.12);
        }
        .summary-select{
            width: 160px;
            height: 42px;
            border-radius: 8px;
            border: 1px solid rgba(17,24,39,.14);
            padding: 0 10px;
            font-weight: 900;
            outline: none;
            background: #fff;
        }
        .summary-select:focus{
            border-color: rgba(59,130,246,.55);
            box-shadow: 0 0 0 4px rgba(59,130,246,.12);
        }

        .period-inline{
            display:flex;
            align-items:center;
            gap:10px;
            flex-wrap: wrap;
        }
        .period-inline .sep{
            color: var(--muted, #6b7280);
            font-weight: 900;
            font-size: 12px;
            padding: 0 2px;
        }
        .summary-date{
            height: 42px;
            width: 180px;
            border-radius: 8px;
            border: 1px solid rgba(17,24,39,.14);
            padding: 0 10px;
            font-weight: 800;
            outline:none;
            background:#fff;
        }
        .summary-date:focus{
            border-color: rgba(59,130,246,.55);
            box-shadow: 0 0 0 4px rgba(59,130,246,.12);
        }
        .hint{
            color: var(--muted, #6b7280);
            font-weight: 800;
            font-size: 12px;
            margin-left: 6px;
        }

        /* ====== Editor (office style) ====== */
        .editor-wrap{
            background: var(--card, #ffffff);
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            overflow: hidden;
            margin-bottom: 14px;
        }

        .office-toolbar{
            display:flex;
            flex-wrap: nowrap;
            align-items:center;
            gap: 6px;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(17,24,39,.10);
            background:#fff;

            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .office-toolbar::-webkit-scrollbar{ height: 0; }
        .office-toolbar{ scrollbar-width: none; }

        .tb-select{
            height: 32px;
            min-width: 86px;
            border: 1px solid rgba(17,24,39,.14);
            border-radius: 4px;
            padding: 0 8px;
            font-weight: 900;
            font-size: 13px;
            background:#fff;
            flex: 0 0 auto;
        }

        .tb-btn{
            height: 32px;
            padding: 0 8px;
            border: 1px solid rgba(17,24,39,.14);
            border-radius: 4px;
            background:#fff;
            font-weight: 900;
            font-size: 13px;
            cursor:pointer;
            user-select:none;
            flex: 0 0 auto;
            letter-spacing: -0.2px;
        }
        .tb-btn:hover{
            background: rgba(59,130,246,.06);
            border-color: rgba(59,130,246,.35);
        }
        .tb-btn.is-active{
            background: #3b82f6;
            border-color:#3b82f6;
            color:#fff;
        }
        .tb-btn:disabled{ opacity:.55; cursor:not-allowed; }

        .tb-sep{
            width:1px;
            height:20px;
            background:rgba(17,24,39,.12);
            margin: 0 1px;
            flex: 0 0 auto;
        }

        .office-editor{
            min-height: 520px;
            padding: 18px;
            background:#fff;
        }
        .office-editor .ProseMirror{
            outline:none;
            min-height: 520px;
            line-height: 1.75;
            font-size: 1rem;
            color: var(--text, #1f2937);
            white-space: pre-wrap;
        }

        .office-editor .ProseMirror table{
            width:100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin: 10px 0;
        }
        .office-editor .ProseMirror td,
        .office-editor .ProseMirror th{
            border:1px solid rgba(17,24,39,.18);
            padding:10px;
            vertical-align: top;
            word-break: break-word;
        }
        .office-editor .ProseMirror th{
            background: rgba(17,24,39,.03);
            font-weight:900;
            color: var(--muted, #6b7280);
        }
        .office-editor .ProseMirror .selectedCell:after{
            content:"";
            position:absolute;
            inset:0;
            background: rgba(59,130,246,.10);
            pointer-events:none;
        }
        .office-editor .ProseMirror td,
        .office-editor .ProseMirror th{ position:relative; }

        .office-counter{
            padding: 8px 12px;
            border-top: 1px solid rgba(17,24,39,.10);
            text-align:right;
            font-weight: 900;
            color: var(--muted, #6b7280);
            background:#fff;
        }
        .office-counter.over{ color: var(--danger, #dc2626); }

        /* 파일 UI */
        .file-attach-section{
            background: var(--card, #ffffff);
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            padding: 16px;
            margin-bottom: 14px;
        }
        .file-attach-header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            flex-wrap:wrap;
            font-weight: 900;
            margin-bottom: 10px; }
        .file-attach-sub{
            color: var(--muted, #6b7280);
            font-weight: 800;
            font-size: 12px;
            margin-top: 2px;
        }
        .file-input-wrapper{ position: relative; display: inline-block; }
        .file-input-wrapper input[type="file"]{ position:absolute; opacity:0; width:0; height:0; }
        .file-upload-btn{
            display:inline-flex; align-items:center; gap:8px;
            padding: 10px 14px;
            border: 1px solid rgba(17,24,39,.14);
            border-radius: 8px;
            background:#fff;
            font-weight: 900;
            cursor:pointer;
            user-select:none;
            font-size: 13px;
        }

        /* ✅ 드래그&드롭 영역 */
        .dropzone{
            margin-top: 10px;
            padding: 18px 14px;
            border: 2px dashed rgba(17,24,39,.18);
            border-radius: 10px;
            background: rgba(59,130,246,.03);
            color: var(--muted, #6b7280);
            font-weight: 900;
            text-align: center;
            user-select: none;
        }
        .dropzone .dropzone-hint{
            margin-top: 6px;
            font-size: 12px;
            font-weight: 800;
            opacity: .9;
        }
        .dropzone.is-dragover{
            border-color: rgba(59,130,246,.55);
            background: rgba(59,130,246,.08);
            color: var(--text, #1f2937);
            box-shadow: 0 0 0 4px rgba(59,130,246,.10);
        }

        .file-list{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
        .file-item{
            display:flex; justify-content:space-between; align-items:center;
            padding: 10px 12px;
            border: 1px solid rgba(17,24,39,.12);
            border-radius: 8px;
            background:#fff;
            font-size: 13px;
        }
        .file-item-info{ display:flex; gap:10px; align-items:center; flex:1; }
        .file-item-name{ font-weight: 900; }
        .file-item-size{ font-size:12px; color: var(--muted, #6b7280); font-weight:800; margin-top:2px; }
        .file-remove-btn{
            color: var(--danger, #dc2626);
            cursor:pointer;
            font-weight: 1000;
            padding: 4px 10px;
            border-radius: 8px;
            user-select:none;
        }
        .file-remove-btn:hover{ background: rgba(220,38,38,.08); }

        .form-actions{
            display:flex;
            justify-content:flex-end;
            gap:10px;
            flex-wrap:wrap;
            margin-top: 10px;
        }
        .btn-submit{
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 900;
            border: 1px solid rgba(59,130,246,.25);
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color:#fff;
            box-shadow: 0 12px 24px rgba(59,130,246,.30);
            cursor:pointer;
        }
        .btn-submit:disabled{ opacity:.7; cursor:not-allowed; }
        .btn-cancel{
            display:inline-flex; align-items:center; justify-content:center;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 900;
            color: var(--muted, #6b7280);
            text-decoration:none;
            background: linear-gradient(180deg, #ffffff, #f9fafb);
            border: 1px solid rgba(17,24,39,.15);
            box-shadow: 0 8px 18px rgba(17,24,39,.06);
        }

        @media (max-width: 720px){
            .summary-table th{ width: 110px; }
            .summary-select{ width: 100%; }
            .summary-date{ width: 100%; }
            .period-inline{ width:100%; }
        }

        /* ✅ [notice-form 전용] bootstrap .badge 충돌 방지: 헤더 알림점만 복구 */
        header .topbar-right .icon-btn > .badge{
            position: absolute;
            right: 6px;
            top: 6px;
            width: 9px;
            height: 9px;

            background: #ef4444;
            border-radius: 50%;
            border: 2px solid var(--primary);

            padding: 0 !important;
            min-width: 0 !important;
            font-size: 0 !important;
            line-height: 0 !important;
            display: block !important;
        }
    </style>
</th:block>

<div layout:fragment="content">
    <div class="page-with-subbar">
        <div th:replace="~{sidebar/board-sidebar :: boardSidebar('noticeForm')}"></div>

        <main class="subbar-main">
            <div class="container">

                <form id="noticeForm" enctype="multipart/form-data">

                    <div class="summary-card">
                        <table class="summary-table">
                            <tr>
                                <th>제목</th>
                                <td>
                                    <input type="text" id="title" name="title" class="summary-input"
                                           placeholder="공지사항 제목을 입력하세요" required maxlength="100">
                                </td>
                            </tr>
                            <tr>
                                <th>팝업여부</th>
                                <td style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                                    <select id="isPopupSelect" name="isPopup" class="summary-select" required>
                                        <option value="true">사용</option>
                                        <option value="false" selected>미사용</option>
                                    </select>
                                    <span class="hint">사용 선택 시 아래 ‘팝업기간’ 입력</span>
                                </td>
                            </tr>
                            <tr>
                                <th>팝업기간</th>
                                <td>
                                    <div class="period-inline">
                                        <input type="date" id="startedAt" name="startedAt" class="summary-date">
                                        <span class="sep">~</span>
                                        <input type="date" id="endedAt" name="endedAt" class="summary-date">
                                        <span class="hint">(미사용이면 자동 비활성)</span>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <div class="editor-wrap">
                        <div class="office-toolbar" id="ttToolbar">
                            <select class="tb-select" id="headingSelect" title="서식">
                                <option value="h2" selected>제목2</option>
                                <option value="p">본문</option>
                            </select>

                            <button type="button" class="tb-btn" data-cmd="bold">굵게</button>
                            <button type="button" class="tb-btn" data-cmd="italic">기울임</button>
                            <button type="button" class="tb-btn" data-cmd="underline">밑줄</button>
                            <button type="button" class="tb-btn" data-cmd="strike">취소선</button>

                            <span class="tb-sep"></span>

                            <button type="button" class="tb-btn" data-cmd="alignLeft">왼쪽</button>
                            <button type="button" class="tb-btn" data-cmd="alignCenter">가운데</button>
                            <button type="button" class="tb-btn" data-cmd="alignRight">오른쪽</button>

                            <span class="tb-sep"></span>

                            <button type="button" class="tb-btn" data-cmd="bulletList">글머리</button>
                            <button type="button" class="tb-btn" data-cmd="orderedList">번호</button>

                            <span class="tb-sep"></span>

                            <button type="button" class="tb-btn" data-cmd="insertTable">표 삽입</button>
                            <button type="button" class="tb-btn" data-cmd="rowPlus">행 +</button>
                            <button type="button" class="tb-btn" data-cmd="colPlus">열 +</button>
                            <button type="button" class="tb-btn" data-cmd="rowMinus">행 -</button>
                            <button type="button" class="tb-btn" data-cmd="colMinus">열 -</button>
                            <button type="button" class="tb-btn" data-cmd="deleteTable">표 삭제</button>

                            <span class="tb-sep"></span>

                            <button type="button" class="tb-btn" data-cmd="undo">실행취소</button>
                            <button type="button" class="tb-btn" data-cmd="redo">다시실행</button>
                        </div>

                        <div id="contentsEditor" class="office-editor"></div>

                        <div class="office-counter">
                            <span id="charCount">0</span> / <span id="charLimit">1000</span>
                        </div>

                        <input type="hidden" id="contents" name="contents" required>
                    </div>

                    <div class="file-attach-section">

                        <div class="file-attach-header">
                            <div>
                                📎 첨부파일
                                <div class="file-attach-sub">최대 5개, 개당 10MB</div>
                            </div>

                            <div class="file-input-wrapper">
                                <input type="file" id="file-input" multiple accept="*/*" onchange="handleFileSelect(event)">
                                <label for="file-input" class="file-upload-btn">📁 파일 선택</label>
                            </div>
                        </div>

                        <!-- ✅ 드래그&드롭 추가 -->
                        <div class="dropzone" id="dropzone">
                            여기로 파일을 드래그해서 놓으세요
                            <div class="dropzone-hint">또는 “파일 선택”을 눌러 첨부</div>
                        </div>

                        <div class="file-list" id="file-list">
                            <div style="color:#adb5bd; font-size:12px; padding:10px;">첨부된 파일이 없습니다.</div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit" id="submitBtn">등록</button>
                        <a th:href="@{/notice/list}" class="btn-cancel">취소</a>
                    </div>

                </form>
            </div>
        </main>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <!-- ✅ TipTap (ESM) - 원본 그대로 -->
    <script type="module">
        const LIMIT = 1000;

        import { Editor } from "https://esm.sh/@tiptap/core@2.11.5";
        import StarterKit from "https://esm.sh/@tiptap/starter-kit@2.11.5";
        import Underline from "https://esm.sh/@tiptap/extension-underline@2.11.5";
        import TextAlign from "https://esm.sh/@tiptap/extension-text-align@2.11.5";
        import CharacterCount from "https://esm.sh/@tiptap/extension-character-count@2.11.5";

        import Table from "https://esm.sh/@tiptap/extension-table@2.11.5";
        import TableRow from "https://esm.sh/@tiptap/extension-table-row@2.11.5";
        import TableHeader from "https://esm.sh/@tiptap/extension-table-header@2.11.5";
        import TableCell from "https://esm.sh/@tiptap/extension-table-cell@2.11.5";

        const hidden = document.getElementById("contents");
        const editorEl = document.getElementById("contentsEditor");
        const toolbar = document.getElementById("ttToolbar");
        const headingSelect = document.getElementById("headingSelect");

        const charCountEl = document.getElementById("charCount");
        const charLimitEl = document.getElementById("charLimit");
        const counterWrap = document.querySelector(".office-counter");

        charLimitEl.textContent = String(LIMIT);

        const editor = new Editor({
            element: editorEl,
            extensions: [
                StarterKit,
                Underline,
                TextAlign.configure({ types: ["heading", "paragraph"] }),
                CharacterCount.configure({ limit: LIMIT }),

                Table.configure({ resizable: true }),
                TableRow,
                TableHeader,
                TableCell,
            ],
            content: { type: "doc", content: [{ type: "paragraph" }] },
            onCreate(){ syncHidden(); refreshToolbar(); refreshCount(); },
            onUpdate(){ syncHidden(); refreshToolbar(); refreshCount(); },
            onSelectionUpdate(){ refreshToolbar(); }
        });

        function syncHidden(){
            hidden.value = JSON.stringify(editor.getJSON());
        }

        function refreshCount(){
            const count = editor.storage.characterCount.characters();
            charCountEl.textContent = String(count);
            counterWrap.classList.toggle("over", count > LIMIT);
        }

        function setActive(btn, on){
            btn.classList.toggle("is-active", !!on);
        }

        function ensureTable(){
            if (editor.isActive("table")) return;
            editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run();
        }

        function refreshToolbar(){
            const inTable = editor.isActive("table");

            toolbar.querySelectorAll(".tb-btn").forEach(btn=>{
                const cmd = btn.dataset.cmd;
                if (!cmd) return;

                const activeMap = {
                    bold: editor.isActive("bold"),
                    italic: editor.isActive("italic"),
                    underline: editor.isActive("underline"),
                    strike: editor.isActive("strike"),
                    bulletList: editor.isActive("bulletList"),
                    orderedList: editor.isActive("orderedList"),
                    alignLeft: editor.isActive({ textAlign: "left" }) || (!editor.getAttributes("paragraph").textAlign && !editor.getAttributes("heading").textAlign),
                    alignCenter: editor.isActive({ textAlign: "center" }),
                    alignRight: editor.isActive({ textAlign: "right" }),
                };

                setActive(btn, activeMap[cmd]);

                if (cmd === "undo") btn.disabled = !editor.can().chain().focus().undo().run();
                if (cmd === "redo") btn.disabled = !editor.can().chain().focus().redo().run();

                if (cmd === "rowMinus") btn.disabled = !inTable;
                if (cmd === "colMinus") btn.disabled = !inTable;
                if (cmd === "deleteTable") btn.disabled = !inTable;
            });

            if (editor.isActive("heading", { level: 2 })) headingSelect.value = "h2";
            else headingSelect.value = "p";
        }

        headingSelect.addEventListener("change", ()=>{
            const v = headingSelect.value;
            const chain = editor.chain().focus();
            if (v === "h2") chain.setHeading({ level: 2 }).run();
            else chain.setParagraph().run();
            refreshToolbar(); syncHidden(); refreshCount();
        });

        toolbar.addEventListener("click", (e)=>{
            const btn = e.target.closest(".tb-btn");
            if (!btn) return;

            const cmd = btn.dataset.cmd;
            if (!cmd) return;

            const chain = editor.chain().focus();

            switch(cmd){
                case "bold": chain.toggleBold().run(); break;
                case "italic": chain.toggleItalic().run(); break;
                case "underline": chain.toggleUnderline().run(); break;
                case "strike": chain.toggleStrike().run(); break;

                case "alignLeft": chain.setTextAlign("left").run(); break;
                case "alignCenter": chain.setTextAlign("center").run(); break;
                case "alignRight": chain.setTextAlign("right").run(); break;

                case "bulletList": chain.toggleBulletList().run(); break;
                case "orderedList": chain.toggleOrderedList().run(); break;

                case "insertTable":
                    chain.insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run();
                    break;

                case "rowPlus":
                    ensureTable();
                    editor.chain().focus().addRowAfter().run();
                    break;

                case "colPlus":
                    ensureTable();
                    editor.chain().focus().addColumnAfter().run();
                    break;

                case "rowMinus":
                    chain.deleteRow().run();
                    break;

                case "colMinus":
                    chain.deleteColumn().run();
                    break;

                case "deleteTable":
                    chain.deleteTable().run();
                    break;

                case "undo": chain.undo().run(); break;
                case "redo": chain.redo().run(); break;

                default: break;
            }

            refreshToolbar();
            syncHidden();
            refreshCount();
        });

        window.__noticeEditorGetText = () => editor.getText();
        window.__noticeEditorGetCount = () => editor.storage.characterCount.characters();
    </script>

    <!-- ✅ 기존 로직 (팝업기간 토글/파일/등록) + ✅ 드래그&드롭 추가 -->
    <script>
        let attachedFiles = [];

        window.addEventListener("DOMContentLoaded", async () => {
            setupPopupToggle();
            setupDropzone(); // ✅ 추가
        });

        function setupPopupToggle() {
            const select = document.getElementById("isPopupSelect");
            const startAt = document.getElementById("startedAt");
            const endAt = document.getElementById("endedAt");

            function togglePopupDates(value) {
                const enabled = value === "true";
                startAt.disabled = !enabled;
                endAt.disabled = !enabled;
                startAt.required = enabled;
                endAt.required = enabled;
                if (!enabled) { startAt.value = ""; endAt.value = ""; }
            }

            select.addEventListener("change", (e) => togglePopupDates(e.target.value));
            togglePopupDates(select.value);
        }

        /* ✅ 파일 선택(탐색기)도 addFiles로 통일 */
        function handleFileSelect(event) {
            addFiles(Array.from(event.target.files || []));
            event.target.value = '';
        }

        /* ✅ 드래그&드롭 세팅 */
        function setupDropzone(){
            const dz = document.getElementById("dropzone");
            if (!dz) return;

            const prevent = (e) => { e.preventDefault(); e.stopPropagation(); };

            ["dragenter","dragover"].forEach(evt =>
                dz.addEventListener(evt, (e)=>{
                    prevent(e);
                    dz.classList.add("is-dragover");
                })
            );

            ["dragleave","dragend","drop"].forEach(evt =>
                dz.addEventListener(evt, (e)=>{
                    prevent(e);
                    dz.classList.remove("is-dragover");
                })
            );

            dz.addEventListener("drop", (e)=>{
                const files = Array.from(e.dataTransfer?.files || []);
                addFiles(files);
            });
        }

        /* ✅ 기존 검증(최대 5개 / 10MB / 중복방지) 로직을 공통 함수로 */
        function addFiles(files) {
            const maxSize = 10 * 1024 * 1024;
            const maxCount = 5;

            for (let file of files) {
                if (attachedFiles.length >= maxCount) {
                    alert(`최대 ${maxCount}개까지만 첨부할 수 있습니다.`);
                    break;
                }
                if (file.size > maxSize) {
                    alert(`${file.name}은(는) 10MB를 초과합니다.`);
                    continue;
                }
                if (attachedFiles.some(f => f.name === file.name && f.size === file.size)) {
                    alert(`${file.name}은(는) 이미 첨부되었습니다.`);
                    continue;
                }
                attachedFiles.push(file);
            }

            renderFileList();
        }

        function renderFileList() {
            const container = document.getElementById('file-list');

            if (attachedFiles.length === 0) {
                container.innerHTML = '<div style="color:#adb5bd; font-size:12px; padding:10px;">첨부된 파일이 없습니다.</div>';
                return;
            }

            container.innerHTML = attachedFiles.map((file, index) => `
              <div class="file-item">
                <div class="file-item-info">
                  <span style="font-size:18px;">📄</span>
                  <div style="min-width:0;">
                    <div class="file-item-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>
                    <div class="file-item-size">${formatFileSize(file.size)}</div>
                  </div>
                </div>
                <span class="file-remove-btn" onclick="removeFile(${index})">✕</span>
              </div>
            `).join('');
        }

        function removeFile(index) {
            attachedFiles.splice(index, 1);
            renderFileList();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function escapeHtml(str){
            return String(str || "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function getFileType(mimeType) {
            if ((mimeType || "").startsWith('image/')) return 'IMAGE';
            if ((mimeType || "").startsWith('audio/')) return 'AUDIO';
            return 'DOC';
        }

        async function uploadFiles(noticeNo) {
            if (attachedFiles.length === 0) return;

            for (const file of attachedFiles) {
                try {
                    const presignRes = await fetch('/api/v1/attachments/presign', {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            domain: 'NOTICE',
                            entityId: noticeNo,
                            fileType: getFileType(file.type),
                            originalName: file.name,
                            contentType: file.type || 'application/octet-stream',
                            size: file.size
                        })
                    });

                    if (!presignRes.ok) continue;
                    const presignData = await presignRes.json();
                    const { objectKey, uploadUrl } = presignData.data;

                    const uploadRes = await fetch(uploadUrl, {
                        method: 'PUT',
                        headers: { 'Content-Type': file.type || 'application/octet-stream' },
                        body: file
                    });
                    if (!uploadRes.ok) continue;

                    const etag = uploadRes.headers.get('ETag');

                    await fetch('/api/v1/attachments/complete', {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            domain: 'NOTICE',
                            entityId: noticeNo,
                            fileType: getFileType(file.type),
                            objectKey: objectKey,
                            originalName: file.name,
                            contentType: file.type || 'application/octet-stream',
                            size: file.size,
                            etag: etag ? etag.replace(/"/g, '') : null
                        })
                    });
                } catch (e) {
                    console.error(`[${file.name}] 업로드 오류:`, e);
                }
            }
        }

        document.getElementById('noticeForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const text = (window.__noticeEditorGetText ? window.__noticeEditorGetText() : "").trim();
            const count = window.__noticeEditorGetCount ? window.__noticeEditorGetCount() : 0;

            if (!text) {
                alert('공지 내용을 입력하세요');
                return;
            }
            if (count > 1000) {
                alert('공지 내용은 최대 1000자까지 입력 가능합니다.');
                return;
            }

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;

            const formData = new FormData(e.target);

            const isPopup = formData.get("isPopup");
            const startedDate = formData.get("startedAt");
            const endedDate = formData.get("endedAt");

            // ✅ [추가] 팝업 기간 validation
            if (isPopup === "true" && startedDate && endedDate) {
                if (startedDate > endedDate) {
                    alert("팝업 시작일은 종료일보다 클 수 없습니다.");
                    submitBtn.disabled = false;
                    return;
                }
            }

            if (isPopup === "true") {
                if (startedDate) formData.set("startedAt", `${startedDate}T00:00:00`);
                if (endedDate) formData.set("endedAt", `${endedDate}T23:59:59`);
            } else {
                formData.delete("startedAt");
                formData.delete("endedAt");
            }


            try {
                const response = await fetch('/api/v1/notice', {
                    method: 'POST',
                    credentials: "include",
                    body: formData
                });

                const result = await response.json().catch(()=> ({}));

                if (!response.ok) {
                    alert(result.message || '공지 등록 실패');
                    return;
                }

                const notice = result.data;

                alert('공지 등록 성공!');

                if (attachedFiles.length > 0 && notice && notice.noticeNo) {
                    await uploadFiles(notice.noticeNo);
                }

                window.location.href = "/notice/list";
            } catch (error) {
                console.error('공지사항 등록 중 오류 발생:', error);
                alert('공지사항 등록 중 오류가 발생했습니다.');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</th:block>

</html>
