<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>S3 Presigned Upload Test</title>
    <style>
        :root{
            --bg:#f3f5f9;
            --card:#ffffff;
            --text:#111;
            --muted:#6b7280;
            --line:#e5e7eb;
            --primary:#2f6fda;
            --danger:#dc2626;
            --ok:#16a34a;
        }
        *{box-sizing:border-box}
        body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text)}
        .wrap{max-width:920px;margin:32px auto;padding:0 16px}
        .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.05);padding:18px}
        .row{display:flex;gap:12px;flex-wrap:wrap}
        .field{display:flex;flex-direction:column;gap:6px;min-width:180px;flex:1}
        label{font-size:12px;color:var(--muted)}
        input,select{
            height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;outline:none;
            background:#fff;font-size:14px;
        }
        input:focus,select:focus{border-color:rgba(47,111,218,.55);box-shadow:0 0 0 3px rgba(47,111,218,.12)}
        .actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
        button{
            height:40px;border:0;border-radius:10px;padding:0 14px;background:var(--primary);color:#fff;
            font-weight:600;cursor:pointer;
        }
        button:disabled{opacity:.55;cursor:not-allowed}
        .ghost{
            background:#fff;color:var(--text);border:1px solid var(--line);
        }
        .hint{font-size:12px;color:var(--muted);margin-top:8px}
        .preview{
            margin-top:14px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap
        }
        img{
            width:220px;max-width:100%;border-radius:12px;border:1px solid var(--line);display:none
        }
        .log{
            margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#0b1020;color:#e5e7eb;
            padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;
            white-space:pre-wrap;min-height:120px;
        }
        .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
        .ok{background:rgba(22,163,74,.15);color:var(--ok);border:1px solid rgba(22,163,74,.35)}
        .bad{background:rgba(220,38,38,.15);color:var(--danger);border:1px solid rgba(220,38,38,.35)}
        .progress-wrap{margin-top:10px;display:flex;gap:10px;align-items:center}
        progress{width:260px;max-width:100%}
        .small{font-size:12px;color:var(--muted)}
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h2 style="margin:0 0 8px 0;">S3 Presigned Upload 테스트</h2>
        <div class="hint">
            1) 파일 선택 → 2) 업로드 클릭 → 3) 로그에서 presign/upload/complete 확인<br>
            (도메인 다르면 아래 API_BASE를 수정)
        </div>

        <div class="row" style="margin-top:14px;">
            <div class="field" style="min-width:260px;">
                <label>파일 선택 (이미지)</label>
                <input id="file" type="file" accept="image/*" />
            </div>

            <div class="field">
                <label>domain</label>
                <select id="domain">
                    <option value="NOTICE">NOTICE</option>
                    <option value="MAIL">MAIL</option>
                    <option value="BOARD">BOARD</option>
                    <option value="APPROVAL">APPROVAL</option>
                </select>
            </div>

            <div class="field">
                <label>entityId</label>
                <input id="entityId" type="number" value="88" min="1" />
            </div>

            <div class="field">
                <label>fileType</label>
                <select id="fileType">
                    <option value="IMAGE">IMAGE</option>
                    <option value="DOC">DOC</option>
                    <option value="AUDIO">AUDIO</option>
                </select>
            </div>
        </div>

        <div class="actions">
            <button id="uploadBtn" type="button">업로드</button>
            <button id="clearBtn" class="ghost" type="button">로그/미리보기 초기화</button>
            <span id="status" class="badge" style="display:none;"></span>
        </div>

        <div class="progress-wrap">
            <progress id="progress" value="0" max="100"></progress>
            <span id="progressText" class="small">0%</span>
        </div>

        <div class="preview">
            <img id="preview" alt="preview"/>
        </div>

        <div id="log" class="log"></div>
    </div>
</div>

<script>
    // 같은 도메인/포트에서 백엔드가 떠 있으면 "" 유지
    // 예: 백엔드가 http://localhost:8080 이면 API_BASE = "http://localhost:8080"
    const API_BASE = "";

    const $file = document.getElementById("file");
    const $domain = document.getElementById("domain");
    const $entityId = document.getElementById("entityId");
    const $fileType = document.getElementById("fileType");
    const $uploadBtn = document.getElementById("uploadBtn");
    const $clearBtn = document.getElementById("clearBtn");
    const $preview = document.getElementById("preview");
    const $log = document.getElementById("log");
    const $status = document.getElementById("status");
    const $progress = document.getElementById("progress");
    const $progressText = document.getElementById("progressText");

    function logLine(msg) {
        const ts = new Date().toLocaleTimeString();
        $log.textContent += `[${ts}] ${msg}\n`;
        $log.scrollTop = $log.scrollHeight;
    }

    function setStatus(type, text) {
        $status.style.display = "inline-block";
        $status.className = "badge " + (type === "ok" ? "ok" : "bad");
        $status.textContent = text;
    }

    function setProgress(pct) {
        const v = Math.max(0, Math.min(100, pct));
        $progress.value = v;
        $progressText.textContent = `${v}%`;
    }

    $clearBtn.addEventListener("click", () => {
        $log.textContent = "";
        $preview.style.display = "none";
        $preview.src = "";
        $status.style.display = "none";
        setProgress(0);
        logLine("초기화 완료");
    });

    $file.addEventListener("change", () => {
        const f = $file.files?.[0];
        if (!f) return;
        if (f.type.startsWith("image/")) {
            $preview.src = URL.createObjectURL(f);
            $preview.style.display = "block";
        } else {
            $preview.style.display = "none";
        }
        logLine(`선택됨: name=${f.name}, type=${f.type}, size=${f.size} bytes`);
    });

    async function uploadImageToS3(file, { domain, entityId, fileType }) {
        // 1) presign 요청
        logLine("1) presign 요청...");
        setProgress(10);

        const presignRes = await fetch(`${API_BASE}/api/v1/attachments/presign`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
                domain,
                entityId,
                fileType,
                originalName: file.name,
                contentType: file.type,
                size: file.size
            })
        });

        if (!presignRes.ok) throw new Error("presign 실패: " + (await presignRes.text()));
        const { objectKey, uploadUrl } = await presignRes.json();
        logLine(`presign OK: objectKey=${objectKey}`);
        setProgress(30);

        // 2) S3에 직접 PUT
        logLine("2) S3 PUT 업로드...");
        const s3Res = await fetch(uploadUrl, {
            method: "PUT",
            headers: { "Content-Type": file.type },
            body: file
        });
        if (!s3Res.ok) throw new Error("S3 업로드 실패: " + s3Res.status);
        logLine("S3 업로드 OK");
        setProgress(70);

        // 3) DB 저장 확정(complete)
        logLine("3) complete(DB 저장) 요청...");
        const completeRes = await fetch(`${API_BASE}/api/v1/attachments/complete`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
                domain,
                entityId,
                fileType,
                objectKey,
                originalName: file.name,
                contentType: file.type,
                size: file.size
            })
        });

        if (!completeRes.ok) throw new Error("complete 실패: " + (await completeRes.text()));
        const result = await completeRes.json();
        logLine(`complete OK: ${JSON.stringify(result)}`);
        setProgress(100);

        return result;
    }

    $uploadBtn.addEventListener("click", async () => {
        try {
            const f = $file.files?.[0];
            if (!f) {
                setStatus("bad", "파일을 선택해줘");
                logLine("에러: 파일 미선택");
                return;
            }

            // 이미지 업로드 테스트니까 간단히 이미지 제한
            if (!$fileType.value || $fileType.value === "IMAGE") {
                if (!f.type.startsWith("image/")) {
                    setStatus("bad", "이미지 파일만 테스트 가능");
                    logLine("에러: image/* 아님");
                    return;
                }
            }

            $uploadBtn.disabled = true;
            setStatus("ok", "진행 중...");
            setProgress(0);

            const payload = {
                domain: $domain.value,
                entityId: Number($entityId.value),
                fileType: $fileType.value
            };

            const saved = await uploadImageToS3(f, payload);
            setStatus("ok", "업로드 완료 (attachmentId=" + (saved.attachmentId ?? "?") + ")");
        } catch (e) {
            console.error(e);
            setStatus("bad", "실패");
            logLine("에러: " + (e.message || e));
            setProgress(0);
        } finally {
            $uploadBtn.disabled = false;
        }
    });

    // 초기 로그
    logLine("준비 완료");
</script>
</body>
</html>
