<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>부서 등록</title>

    <th:block layout:fragment="pageStyles">
        <style>

            /* ✅ SCOPE ROOT */
            .dept-create-page .wrap{
                width:100%;
                max-width: 980px;
                margin: 0 auto;
                padding: 6px 26px 24px;
            }

            .dept-create-page .card{
                background: var(--white);
                border: 1px solid var(--line);
                border-radius: 18px;
                box-shadow: var(--shadow2);
                padding: 18px;
            }

            .dept-create-page .panel{
                background:#fff;                 /* ✅ 회색 제거 */
                border:0;                        /* ✅ 패널 테두리 제거(원하면 유지해도 됨) */
                border-radius:18px;
                padding:0;
            }

            .dept-create-page .section-title{
                font-weight:950;
                font-size:14px;
                margin:0 0 12px;
                color:#111827;
                letter-spacing:-.2px;
            }

            .dept-create-page .form{
                display:grid;
                grid-template-columns: 1fr;
                gap:14px;
            }

            .dept-create-page .input{
                width:100%;
            }

            .dept-create-page .field{
                display:flex;
                flex-direction:column;
                gap:8px;
            }

            .dept-create-page .label{
                font-size:13px;
                font-weight:900;
                color:#111827;
            }

            .dept-create-page .hint{
                margin-top:-2px;
                font-size:12px;
                color:var(--muted);
                font-weight:800;
            }

            /* ✅ 전역 input 금지 */
            .dept-create-page .control{
                width:100%;
                height:42px;
                border-radius:12px;
                border:1px solid var(--line);
                padding:0 12px;
                outline:none;
                background:#fff;
                font-size:14px;
            }
            .dept-create-page .control:focus{
                border-color: rgba(59,130,246,.55);
                box-shadow: 0 0 0 4px rgba(59,130,246,.12);
            }

            .dept-create-page .actions{
                display:flex;
                justify-content:flex-end;
                gap:10px;
                margin-top:16px;
            }

            /* ✅ 버튼 스코프 */
            .dept-create-page .btn{
                height:42px;
                min-width:110px;
                border:0;
                border-radius:10px; /* 살짝 각지게 */
                cursor:pointer;
                font-weight:900;
                padding:0 14px;
            }

            .dept-create-page .btn.primary{
                background: var(--primary);
                color:#fff;
                box-shadow: 0 10px 22px rgba(59,130,246,.22);
            }
            .dept-create-page .btn.primary:hover{ filter:brightness(.98); }

            .dept-create-page .btn.ghost{
                background:#fff;
                color:#111;
                border:1px solid var(--line);
            }
            .dept-create-page .btn.ghost:hover{ background:#f8fafc; }

            .dept-create-page .msg{
                margin-top:12px;
                font-size:13px;
                display:none;
                font-weight:900;
                padding:12px 14px;
                border-radius:14px;
                border:1px solid var(--line);
                background:#fff;
            }
            .dept-create-page .msg.ok{
                display:block;
                border-color:rgba(34,197,94,.25);
                background:rgba(34,197,94,.07);
                color:#0f766e;
            }
            .dept-create-page .msg.err{
                display:block;
                border-color:rgba(239,68,68,.25);
                background:rgba(239,68,68,.07);
                color:#b91c1c;
            }

            @media (max-width: 980px){
                .dept-create-page .wrap{ padding: 6px 16px 24px; }
                .dept-create-page .form{ grid-template-columns: 1fr; }
            }
        </style>
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="page-with-subbar">

        <div th:replace="~{sidebar/admin-sidebar :: adminSidebar('dept')}"></div>

        <!-- ✅ 스코프 루트 -->
        <section class="dept-create-page">
            <div class="wrap">

                <section class="card">
                    <div class="panel">
                        <div class="section-title">부서 등록</div>

                        <div class="form">
                            <div class="field">
                                <div class="label">부서 코드</div>
                                <input class="control" id="depId" maxlength="3" placeholder="예) A01" />
                                <div class="hint">최대 3자</div>
                            </div>

                            <div class="field">
                                <div class="label">부서 이름</div>
                                <input class="control" id="depName" maxlength="10" placeholder="예) 인사팀" />
                                <div class="hint">최대 10자</div>
                            </div>
                        </div>

                        <div class="actions">
                            <button class="btn ghost" type="button" onclick="location.href='/admin/departments/list'">취소</button>
                            <button class="btn primary" id="submitBtn" type="button">등록</button>
                        </div>

                        <div id="resultMsg" class="msg"></div>
                    </div>
                </section>

            </div>
        </section>
    </div>
</th:block>

<th:block layout:fragment="pageScripts">
    <script>
        const $ = (id) => document.getElementById(id);

        function showMsg(text, ok) {
            const el = $("resultMsg");
            if (!el) return;
            el.className = "msg " + (ok ? "ok" : "err");
            el.textContent = text;
        }

        async function safeJson(res) {
            const ct = res.headers.get("content-type") || "";
            if (!ct.includes("application/json")) return {};
            try { return await res.json(); } catch { return {}; }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const btn = $("submitBtn");
            if (!btn) return;

            // ✅ [수정] async/await 패턴으로 일관성 있게 변경
            btn.addEventListener("click", async () => {
                const depId = $("depId")?.value?.trim() || "";
                const depName = $("depName")?.value?.trim() || "";

                // 유효성 검사 알림도 확인을 누를 때까지 기다리도록 처리 가능합니다.
                if (!depId) {
                    await Alert.warning("부서 코드를 입력해주세요.");
                    return;
                }
                if (!depName) {
                    await Alert.warning("부서 이름을 입력해주세요.");
                    return;
                }

                try {
                    const res = await fetch("/api/v1/admin/departments", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({ depId, depName })
                    });

                    if (res.ok) {
                        // ✅ [핵심] 알림창의 확인 버튼을 누를 때까지 기다린 후 목록으로 이동
                        await Alert.success("부서가 등록되었습니다.");
                        window.location.href = "/admin/departments/list";
                        return;
                    }

                    const data = await safeJson(res);
                    // 실패 알림도 await로 대기 처리
                    await Alert.error(data?.message || "등록 실패");

                } catch (e) {
                    console.error(e);
                    await Alert.error("서버 통신 오류가 발생했습니다.");
                }
            });
        });
    </script>
</th:block>

</body>
</html>
