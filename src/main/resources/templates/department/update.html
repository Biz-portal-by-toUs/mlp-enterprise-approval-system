<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bizportal - Edit Position</title>
    <style>
        :root{
            --bg:#f3f3f3;
            --card:#fff;
            --text:#111;
            --muted:#666;
            --border:#d7d7d7;
            --primary:#2563eb;
            --radius:14px;
            --shadow:0 8px 24px rgba(0,0,0,.06);
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
            background:var(--bg);
            color:var(--text);
        }
        .wrap{max-width:760px;margin:32px auto;padding:0 16px;}
        .top{
            display:flex; justify-content:space-between; align-items:flex-end;
            gap:12px; margin-bottom:16px; flex-wrap:wrap;
        }
        h1{margin:0;font-size:22px;letter-spacing:-.3px}
        .sub{margin:6px 0 0;color:var(--muted);font-size:13px}
        .btn{
            border:1px solid var(--border);
            background:#fff;
            color:var(--text);
            padding:10px 12px;
            border-radius:12px;
            cursor:pointer;
            font-size:13px;
            text-decoration:none;
            display:inline-flex; align-items:center; gap:8px;
        }
        .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
        .card{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:18px;
        }
        .grid{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:14px;
        }
        .field{display:flex; flex-direction:column; gap:8px;}
        .label{font-size:13px; font-weight:600;}
        .help{font-size:12px; color:var(--muted); margin-top:-4px;}
        input{
            width:100%;
            padding:11px 12px;
            border:1px solid var(--border);
            border-radius:12px;
            outline:none;
            font-size:13px;
            background:#fff;
        }
        input[readonly]{
            background:#fafafa;
            color:#555;
        }
        .row{
            display:flex;
            gap:10px;
            align-items:center;
            justify-content:flex-end;
            margin-top:16px;
            flex-wrap:wrap;
        }
        .msg{
            margin:0 0 14px;
            padding:12px 14px;
            border-radius:12px;
            border:1px solid var(--border);
            background:#fff;
            font-size:13px;
        }
        .msg.err{border-color:#fecaca;background:#fef2f2;color:#991b1b;}
        .msg.ok{border-color:#bbf7d0;background:#f0fdf4;color:#166534;}
        .invalid{
            border-color:#ef4444 !important;
        }
        .warn{
            margin-top:-4px;
            font-size:12px;
            color:#b91c1c;
            display:none;
        }
        .warn.show{display:block;}
        @media (max-width:720px){
            .grid{grid-template-columns:1fr;}
            .row{justify-content:stretch;}
            .row .btn{flex:1; justify-content:center;}
        }
    </style>
</head>

<body>
<div class="wrap">
    <div class="top">
        <div>
            <h1>직급 수정</h1>
            <p class="sub">
                직급 정보를 수정합니다. (경로: <b>/admin/positions/{posNo}/edit</b>)
            </p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <a class="btn" th:href="@{/admin/positions}">← 목록</a>
            <a class="btn" th:href="@{/admin}">관리자 홈</a>
        </div>
    </div>

    <!-- 서버에서 에러/메시지 내려줄 때 -->
    <div th:if="${error != null}" class="msg err" th:text="${error}"></div>
    <div th:if="${message != null}" class="msg ok" th:text="${message}"></div>

    <div class="card">
        <!-- position 객체를 model에 position 으로 내려준다고 가정 -->
        <form id="editForm"
              th:action="@{|/admin/positions/${position.posNo}|}"
              method="post"
              novalidate>

            <!-- PUT method override -->
            <input type="hidden" name="_method" value="PUT"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="grid">
                <div class="field">
                    <div class="label">직급 No</div>
                    <input type="text" th:value="${position.posNo}" readonly/>
                    <div class="help">식별자(수정 불가)</div>
                </div>

                <div class="field">
                    <div class="label">회사코드</div>
                    <input type="text" name="comId" th:value="${position.comId}" readonly/>
                    <div class="help">회사코드는 보통 고정값(수정 불가)</div>
                </div>

                <div class="field">
                    <div class="label">직급코드</div>
                    <input id="posId" type="text" name="posId" th:value="${position.posId}" readonly/>
                    <div class="help">직급코드는 보통 고정값(수정 불가)</div>
                </div>

                <div class="field">
                    <div class="label">직급명</div>
                    <input id="posName" type="text" name="posName"
                           th:value="${position.posName}"
                           maxlength="50"
                           placeholder="예) 대리, 과장, 매니저"/>
                    <div id="posNameWarn" class="warn">직급명은 1~50자여야 해요.</div>
                    <div class="help">1~50자</div>
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn primary">저장</button>
                <a class="btn" th:href="@{/admin/positions/list}">취소</a>
            </div>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById('editForm');
    const posName = document.getElementById('posName');
    const warn = document.getElementById('posNameWarn');

    function validPosName(){
        const v = (posName.value || '').trim();
        const ok = v.length >= 1 && v.length <= 50;
        posName.classList.toggle('invalid', !ok);
        warn.classList.toggle('show', !ok);
        return ok;
    }

    posName.addEventListener('input', validPosName);

    form.addEventListener('submit', (e) => {
        if(!validPosName()){
            e.preventDefault();
            posName.focus();
        }
    });
</script>
</body>
</html>
