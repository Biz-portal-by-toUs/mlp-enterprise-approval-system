<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Bizportal - 부서 수정</title>

    <!-- ✅ layout.html의 <th:block layout:fragment="pageStyles"> 로 주입됨 -->
    <th:block layout:fragment="pageStyles">
        <style>
            /* ✅ 이 페이지 전용(스코프) */
            .dept-edit-page{
                padding-top: 6px;
            }

            .dept-edit-page .page-kicker{
                font-size:14px;
                color:var(--muted);
                margin: 0 0 10px;
            }

            .dept-edit-page .page-title{
                font-size:34px;
                font-weight:900;
                margin: 0 0 22px;
                letter-spacing: -.2px;
            }

            .dept-edit-page .section-title{
                font-size:22px;
                font-weight:900;
                margin: 0 0 14px;
            }

            .dept-edit-page .card{
                background: var(--white);
                border: 1px solid var(--line);
                border-radius: 18px;
                padding: 26px;
                box-shadow: 0 10px 24px rgba(17,24,39,.06);
            }

            .dept-edit-page .form-wrap{
                background:#f3f4f6;
                border-radius: 18px;
                padding: 26px;
            }

            .dept-edit-page .field{ margin: 18px 0; }
            .dept-edit-page .label{
                font-weight: 800;
                margin-bottom: 10px;
            }

            .dept-edit-page .input{
                width:100%;
                height:48px;
                border-radius: 12px;
                border: 1px solid var(--line);
                padding: 0 14px;
                font-size: 14px;
                outline: none;
                background: #fff;
            }
            .dept-edit-page .input:focus{
                border-color: rgba(59,130,246,.55);
                box-shadow: 0 0 0 4px rgba(59,130,246,.12);
            }

            .dept-edit-page .hint{
                margin-top: 8px;
                font-size: 12px;
                color: var(--muted);
            }

            .dept-edit-page .actions{
                display:flex;
                justify-content:flex-end;
                gap:12px;
                margin-top: 22px;
            }

            .dept-edit-page .btn{
                height:50px;
                min-width:140px;
                border:none;
                border-radius: 14px;
                font-weight: 900;
                cursor:pointer;
                padding: 0 18px;
            }

            .dept-edit-page .btn-cancel{
                background:#e5e7eb;
                color:#374151;
            }
            .dept-edit-page .btn-cancel:hover{ filter: brightness(0.98); }

            .dept-edit-page .btn-primary{
                background: var(--primary);
                color:#fff;
                box-shadow: 0 10px 22px rgba(59,130,246,.22);
            }
            .dept-edit-page .btn-primary:hover{ filter: brightness(0.98); }
            .dept-edit-page .btn-primary:active{ transform: translateY(1px); }

            .dept-edit-page .msg{
                margin-top:14px;
                font-size:13px;
                display:none;
                font-weight:800;
            }
            .dept-edit-page .msg.ok{ color:#0f766e; }
            .dept-edit-page .msg.err{ color:#b91c1c; }
        </style>
    </th:block>
</head>

<body>

<!-- ✅ layout.html의 content 영역으로 들어감 -->
<th:block layout:fragment="content">

    <div class="page-with-subbar">

        <!-- ✅ 관리자 사이드바(fragment) -->
        <div th:replace="~{sidebar/admin-sidebar :: adminSidebar('dept')}"></div>

        <!-- ✅ 오른쪽 콘텐츠 -->
        <section class="dept-edit-page">
            <p class="page-kicker">부서 편성(수정)</p>
            <h1 class="page-title">부서 편성</h1>
            <h2 class="section-title">부서 수정</h2>

            <div class="card">
                <div class="form-wrap">

                    <!-- 서버에서 내려주는 값 -->
                    <input type="hidden" id="depNo" th:value="${depNo}" />

                    <div class="field">
                        <div class="label">부서 코드</div>
                        <input class="input"
                               id="depId"
                               maxlength="3"
                               placeholder="예) A01"
                               th:value="${depId}" />
                        <div class="hint">최대 3자</div>
                    </div>

                    <div class="field">
                        <div class="label">부서 이름</div>
                        <input class="input"
                               id="depName"
                               maxlength="10"
                               placeholder="예) 인사팀"
                               th:value="${depName}" />
                        <div class="hint">최대 10자</div>
                    </div>

                    <div class="actions">
                        <button class="btn btn-cancel" type="button"
                                onclick="location.href='/admin/departments/list'">
                            취소
                        </button>

                        <button class="btn btn-primary" id="submitBtn" type="button">
                            수정 완료
                        </button>
                    </div>

                    <div id="resultMsg" class="msg"></div>
                </div>
            </div>
        </section>
    </div>

</th:block>

<!-- ✅ layout.html의 pageScripts 영역으로 들어감 -->
<th:block layout:fragment="pageScripts">
    <script>
        const API_URL = "/api/v1/admin/departments";
        const $ = (id) => document.getElementById(id);

        function showMsg(text, ok) {
            const el = $("resultMsg");
            if (!el) return;
            el.style.display = "block";
            el.className = "msg " + (ok ? "ok" : "err");
            el.textContent = text;

            clearTimeout(window.__msgTimer);
            window.__msgTimer = setTimeout(() => {
                el.style.display = "none";
            }, 2800);
        }

        async function safeJson(res) {
            const ct = res.headers.get("content-type") || "";
            if (!ct.includes("application/json")) return {};
            try { return await res.json(); } catch { return {}; }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const btn = $("submitBtn");
            if (!btn) return;

            btn.addEventListener("click", async () => {
                const depNo = $("depNo")?.value;
                const depId = $("depId")?.value?.trim() || "";
                const depName = $("depName")?.value?.trim() || "";

                if (!depNo) return showMsg("잘못된 접근입니다. (depNo 없음)", false);
                if (!depId) return showMsg("부서 코드를 입력해주세요.", false);
                if (!depName) return showMsg("부서 이름을 입력해주세요.", false);
                if (depId.length > 3) return showMsg("부서 코드는 최대 3자입니다.", false);
                if (depName.length > 10) return showMsg("부서 이름은 최대 10자입니다.", false);

                try {
                    const res = await fetch(`${API_URL}/${encodeURIComponent(depNo)}`, {
                        method: "PUT",
                        credentials: "include",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({ depId, depName })
                    });

                    if (res.status === 401) return showMsg("로그인이 필요합니다. 다시 로그인 해주세요.", false);
                    if (res.status === 403) return showMsg("권한이 없습니다. (COM_ADMIN만 가능)", false);

                    if (res.ok) {
                        showMsg("부서 정보가 수정되었습니다.", true);
                        setTimeout(() => {
                            window.location.href = "/admin/departments/list";
                        }, 700);
                        return;
                    }

                    const data = await safeJson(res);
                    showMsg(data?.message || `수정 실패 (HTTP ${res.status})`, false);

                } catch (e) {
                    console.error(e);
                    showMsg("서버 통신 오류가 발생했습니다.", false);
                }
            });
        });
    </script>
</th:block>

</body>
</html>
