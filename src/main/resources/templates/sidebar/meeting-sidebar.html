<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="subbar" th:fragment="meetingSidebar(active)">
    <div class="subbar-title">회의</div>

    <nav class="subbar-nav" aria-label="회의 메뉴">
        <a class="subbar-item"
           th:href="@{/meeting(scope='ALL')}" href="/meeting?scope=ALL"
           th:classappend="${active}=='all' ? ' active' : ''">
            전체 회의
        </a>

        <a class="subbar-item"
           th:href="@{/meeting(scope='MY_DEPT')}" href="/meeting?scope=MY_DEPT"
           th:classappend="${active}=='dept' ? ' active' : ''">
            내 부서 회의
        </a>

        <a class="subbar-item"
           th:href="@{/meeting(scope='MY')}" href="/meeting?scope=MY"
           th:classappend="${active}=='my' ? ' active' : ''">
            내 회의
        </a>


        <a class="subbar-item"
           th:href="@{/meeting/create}" href="/meeting/create"
           th:classappend="${active}=='create' ? ' active' : ''">
            새 회의 생성
        </a>

    </nav>

</aside>
</body>
</html>
