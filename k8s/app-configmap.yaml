apiVersion: v1
kind: ConfigMap
metadata:
  name: bizportal-config
  namespace: bizportal
data:
  SPRING_PROFILES_ACTIVE: "prod"
  MONGODB_URI: "mongodb://root:changeme-root-password@mongodb.bizportal.svc.cluster.local:27017/bizchat?authSource=admin"
  REDIS_HOST: "redis.bizportal.svc.cluster.local"
  REDIS_PORT: "6379"
  ELASTIC_HOST: "http://elasticsearch.bizportal.svc.cluster.local:9200"
  WEAVIATE_URL: "http://weaviate.bizportal.svc.cluster.local:8080"