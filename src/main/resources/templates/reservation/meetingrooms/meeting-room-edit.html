<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>회의실 수정</title>

    <th:block layout:fragment="pageStyles">
        <style>
            .meeting-edit-page-wrapper {
                padding: 24px;
                background: #f4f6f8;
                min-height: calc(100vh - 64px);
                display: flex;
                justify-content: center;
                align-items: flex-start;
            }

            .meeting-edit-page-wrapper .card {
                width: 520px;
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.12);
                padding: 28px;
            }

            .meeting-edit-page-wrapper .form-inner {
                max-width: 420px;
                margin: 0 auto;
            }

            .meeting-edit-page-wrapper input,
            .meeting-edit-page-wrapper textarea {
                width: 100%;
                box-sizing: border-box;
            }

            .meeting-edit-page-wrapper .image-preview {
                width: 100%;
                height: 220px;
                background: #e5e7eb;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .meeting-edit-page-wrapper .image-preview img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }

            .meeting-edit-page-wrapper h2 {
                margin-top: 0;
                text-align: center;
            }

            .meeting-edit-page-wrapper .field {
                margin-bottom: 14px;
            }

            .meeting-edit-page-wrapper label {
                display: block;
                font-size: 13px;
                margin-bottom: 6px;
                color: #555;
            }

            .meeting-edit-page-wrapper input,
            .meeting-edit-page-wrapper textarea {
                width: 100%;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #ddd;
                font-size: 14px;
            }

            .meeting-edit-page-wrapper textarea {
                resize: none;
            }

            .meeting-edit-page-wrapper .btns {
                display: flex;
                gap: 10px;
                margin-top: 18px;
            }

            .meeting-edit-page-wrapper button {
                flex: 1;
                padding: 10px;
                border-radius: 8px;
                border: none;
                font-size: 14px;
                cursor: pointer;
            }

            .meeting-edit-page-wrapper .submit {
                background: #1677ff;
                color: #fff;
                cursor: pointer;
            }

            .meeting-edit-page-wrapper .submit.disabled {
                background: #a5c8ff;
                cursor: not-allowed;
            }

            .meeting-edit-page-wrapper .cancel {
                background: #e5e7eb;
            }

            .meeting-edit-page-wrapper .preview-box {
                width: 100%;
                height: 220px;
                background: #e5e7eb;
                border-radius: 12px;
                overflow: hidden;
                margin-top: 10px;
            }

            .meeting-edit-page-wrapper .preview-box img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: none;
            }

            /* ===== form hints / validation UI (등록 화면과 동일) ===== */
            .hint-row{
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-top:6px;
                gap:10px;
            }

            .hint{
                color:#6b7280;
                font-size:12px;
            }

            .counter{
                color:#6b7280;
                font-size:12px;
                font-variant-numeric: tabular-nums;
            }

            .error{
                display:block;
                margin-top:6px;
                color:#ef4444;
                font-size:12px;
                font-weight:600;
            }

            .input-invalid{
                border-color:#ef4444 !important;
                box-shadow: 0 0 0 3px rgba(239,68,68,.12);
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('meeting')"></aside>

        <div class="meeting-edit-page-wrapper">
            <div class="card">
                <h2>회의실 수정</h2>

                <form id="editForm" enctype="multipart/form-data">

                    <!-- 회의실명 -->
                    <div class="field">
                        <label>회의실명</label>
                        <input type="text" name="roomName" id="roomName" maxlength="20" required>
                        <div class="hint-row">
                            <small class="hint">최대 20자까지 입력 가능</small>
                            <small class="counter" id="nameCounter">0 / 20</small>
                        </div>
                        <small class="error" id="nameError" style="display:none;"></small>
                    </div>

                    <!-- 수용 인원 -->
                    <div class="field">
                        <label>수용 인원</label>
                        <input type="number" name="capacity" id="capacity" min="1" max="20" required>
                        <div class="hint-row">
                            <small class="hint">1~20명 입력 가능</small>
                        </div>
                        <small class="error" id="capError" style="display:none;"></small>
                    </div>

                    <div class="field">
                        <label>위치</label>
                        <input type="text" name="location" id="location" maxlength="50">
                    </div>

                    <div class="field">
                        <label>주요 장비</label>
                        <input type="text" name="equipList" id="equipList" maxlength="255">
                    </div>

                    <div class="field">
                        <label>특이사항</label>
                        <textarea name="note" id="note" rows="3" maxlength="255"></textarea>
                    </div>

                    <div class="field">
                        <label>회의실 이미지</label>
                        <input type="file"
                               name="imageFile"
                               id="imageFile"
                               accept="image/*"
                               onchange="previewImage(this)">
                    </div>

                    <div class="preview-box">
                        <img id="imagePreview" alt="미리보기 이미지" />
                    </div>

                    <div class="btns">
                        <button type="submit" class="submit disabled" disabled>수정</button>
                        <button type="button" class="cancel" onclick="history.back()">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>

<th:block layout:fragment="pageScripts">
    <script th:inline="javascript">
        /* ================== 공통 ================== */
        const roomNo = /*[[${roomNo}]]*/ null;
        let originalData = null;

        if (!roomNo) {
            alert("잘못된 접근입니다.");
            location.href = "/meeting-rooms";
        }

        /* ===== inline validation UI ===== */
        const roomNameInput = document.getElementById("roomName");
        const nameCounter = document.getElementById("nameCounter");
        const nameError = document.getElementById("nameError");

        const capInput = document.getElementById("capacity");
        const capError = document.getElementById("capError");

        const submitBtn = document.querySelector(".submit");

        function setError(inputEl, errorEl, msg) {
            if (!errorEl) return;

            if (msg) {
                errorEl.textContent = msg;
                errorEl.style.display = "block";
                inputEl?.classList.add("input-invalid");
            } else {
                errorEl.textContent = "";
                errorEl.style.display = "none";
                inputEl?.classList.remove("input-invalid");
            }
        }

        function updateNameUI() {
            if (!roomNameInput) return;

            const len = roomNameInput.value.length;
            if (nameCounter) nameCounter.textContent = `${len} / 20`;

            if (!roomNameInput.value.trim()) {
                // 비어있을 땐 경고 안 띄우고, submit 시에만 띄움(등록 화면과 동일한 느낌)
                setError(roomNameInput, nameError, "");
                return;
            }

            if (len > 20) setError(roomNameInput, nameError, "회의실명은 20자 이내여야 합니다.");
            else setError(roomNameInput, nameError, "");
        }

        function updateCapUI() {
            if (!capInput) return;

            const v = capInput.value;

            if (v === "") {
                setError(capInput, capError, "");
                return;
            }

            const n = Number(v);
            if (Number.isNaN(n)) {
                setError(capInput, capError, "숫자만 입력해주세요.");
                return;
            }

            if (n < 1 || n > 20) {
                setError(capInput, capError, "수용 인원은 1~20명 사이여야 합니다.");
                return;
            }

            setError(capInput, capError, "");
        }

        roomNameInput?.addEventListener("input", () => {
            updateNameUI();
            updateSubmitButton();
        });

        capInput?.addEventListener("input", () => {
            let value = capInput.value;

            if (value === "") {
                updateCapUI();
                updateSubmitButton();
                return;
            }

            const num = Number(value);

            if (Number.isNaN(num)) {
                capInput.value = "";
                updateCapUI();
                updateSubmitButton();
                return;
            }

            if (num < 1) capInput.value = 1;
            if (num > 20) capInput.value = 20;

            updateCapUI();
            updateSubmitButton();
        });

        /* ================== 회의실 상세 조회 ================== */
        async function loadRoom() {
            const res = await fetch(`/api/v1/meeting-rooms/${roomNo}`, {
                credentials: "include"
            });

            if (res.status === 401) {
                alert("로그인이 필요합니다.");
                location.href = "/login";
                return;
            }

            if (!res.ok) {
                alert("회의실 정보를 불러오지 못했습니다.");
                return;
            }

            const room = (await res.json()).data;

            roomNameInput.value = room.roomName ?? "";
            capInput.value = room.capacity ?? "";
            document.querySelector("[name=location]").value  = room.location ?? "";
            document.querySelector("[name=equipList]").value = room.equipList ?? "";
            document.querySelector("[name=note]").value      = room.note ?? "";

            originalData = {
                roomName: (room.roomName ?? "").trim(),
                capacity: Number(room.capacity ?? ""),
                location: (room.location ?? "").trim(),
                equipList: (room.equipList ?? "").trim(),
                note: (room.note ?? "").trim(),
                imageChanged: false
            };

            if (room.imageUrl) {
                const preview = document.getElementById("imagePreview");
                preview.src = room.imageUrl;
                preview.style.display = "block";
            }

            // 초기 UI 동기화
            updateNameUI();
            updateCapUI();
            updateSubmitButton();
        }

        /* ================== 이미지 미리보기 ================== */
        function previewImage(input) {
            const preview = document.getElementById("imagePreview");

            if (!input.files || !input.files[0]) {
                preview.style.display = "none";
                preview.src = "";
                // 이미지 취소했을 때도 변경감지에 영향 줄 수 있어서 버튼 상태 갱신
                updateSubmitButton();
                return;
            }

            const file = input.files[0];

            if (!file.type.startsWith("image/")) {
                alert("이미지 파일만 업로드 가능합니다.");
                input.value = "";
                updateSubmitButton();
                return;
            }

            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);

            if (originalData) originalData.imageChanged = true;
            updateSubmitButton();
        }

        /* ================== 유효성 검사(알럿 대신 small 에러도 같이) ================== */
        function validateEditForm() {
            const name = roomNameInput.value.trim();
            const capacity = Number(capInput.value);

            updateNameUI();
            updateCapUI();

            if (!name) {
                setError(roomNameInput, nameError, "회의실명을 입력해주세요.");
                roomNameInput.focus();
                return false;
            }

            if (name.length > 20) {
                setError(roomNameInput, nameError, "회의실명은 20자 이내여야 합니다.");
                roomNameInput.focus();
                return false;
            }

            if (!capacity || capacity < 1 || capacity > 20) {
                setError(capInput, capError, "수용 인원은 1~20명 사이여야 합니다.");
                capInput.focus();
                return false;
            }

            return true;
        }

        /* ================== 수정 요청 ================== */
        document.getElementById("editForm").addEventListener("submit", async e => {
            e.preventDefault();

            if (!validateEditForm()) return;

            const formData = new FormData(e.target);

            const res = await fetch(`/api/v1/meeting-rooms/${roomNo}`, {
                method: "PUT",
                credentials: "include",
                body: formData
            });

            if (res.status === 401) {
                alert("로그인이 만료되었습니다. 다시 로그인해주세요.");
                location.href = "/login";
                return;
            }

            if (!res.ok) {
                const msg = await res.text();
                alert("수정 실패: " + msg);
                return;
            }

            alert("회의실 정보가 수정되었습니다.");
            location.href = "/meeting-rooms";
        });

        /* ================== 변경 감지 ================== */
        function hasChanged() {
            if (!originalData) return false;

            const current = {
                roomName: roomNameInput.value.trim(),
                capacity: Number(capInput.value),
                location: document.querySelector("[name=location]").value.trim(),
                equipList: document.querySelector("[name=equipList]").value.trim(),
                note: document.querySelector("[name=note]").value.trim(),
                imageChanged: document.querySelector("[name=imageFile]").files.length > 0
            };

            return (
                current.roomName !== originalData.roomName ||
                current.capacity !== originalData.capacity ||
                current.location !== originalData.location ||
                current.equipList !== originalData.equipList ||
                current.note !== originalData.note ||
                current.imageChanged
            );
        }

        function updateSubmitButton() {
            if (!submitBtn) return;

            if (hasChanged()) {
                submitBtn.disabled = false;
                submitBtn.classList.remove("disabled");
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add("disabled");
            }
        }

        // 기존 변경감지 리스너 유지 (여기에 updateSubmitButton만 호출)
        document.querySelectorAll(
            "input[name=roomName], input[name=capacity], input[name=location], input[name=equipList], textarea[name=note]"
        ).forEach(el => el.addEventListener("input", updateSubmitButton));

        document.querySelector("[name=imageFile]")
            .addEventListener("change", updateSubmitButton);

        /* ================== 초기 실행 ================== */
        document.addEventListener("DOMContentLoaded", loadRoom);
    </script>
</th:block>

</body>
</html>
