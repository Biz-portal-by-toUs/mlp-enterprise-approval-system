<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bizportal - Employee Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="/css/alert.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/alert/alert.js"></script>
    <style>
        :root{
            --blue:#356fda;          /* 배경 블루 */
            --blue2:#2f66d7;         /* 포인트 블루 */
            --text:#ffffff;
            --muted:rgba(255,255,255,.75);
            --line:rgba(255,255,255,.35);
            --shadow:0 14px 30px rgba(0,0,0,.18);
            --danger:#ffd1d1;
            --dangerLine:rgba(255,255,255,.35);
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo",
            "Noto Sans KR", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:var(--blue); /* ✅ 바깥까지 파랑 */
            color:#111;
        }

        /* ✅ 페이지 테두리/마진 제거해서 파랑으로 꽉 채움 */
        .page{
            min-height:100vh;
            background:var(--blue);
            position:relative;
            overflow:hidden;
            margin:0;
            border:0;
        }

        /* ✅ 기존 header는 숨김 */
        header{ display:none; }

        main{
            min-height:100vh; /* ✅ 꽉 채우기 */
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }

        .card{
            width:min(520px, 92vw);
            text-align:center;
            color:var(--text);
        }

        .logoRow{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:14px;
            margin-bottom:22px;
        }
        .logoMark{
            font-family: Georgia, "Times New Roman", Times, serif;
            font-weight:900;
            font-size:56px;
            line-height:1;
            transform:skewX(-12deg);
            letter-spacing:-2px;
        }
        .brandText{
            font-weight:900;
            font-size:44px;
            letter-spacing:-1px;
        }

        .form{
            width:min(380px, 92vw);
            margin:0 auto;
            display:flex;
            flex-direction:column;
            gap:14px;
        }
        .input-wrap{
            display:flex;
            align-items:center;
            gap:10px;
            height:44px;
            padding:0 12px;
            border:1px solid var(--line);
            border-radius:3px;
            background:rgba(255,255,255,.06);
            backdrop-filter: blur(2px);
        }
        .icon{
            width:18px;height:18px;
            opacity:.85;
            flex:0 0 auto;
            color:#fff;
        }
        input{
            border:0;
            outline:none;
            width:100%;
            font-size:13px;
            background:transparent;
            color:var(--text);
        }
        input::placeholder{
            color:rgba(255,255,255,.78);
            letter-spacing:.5px;
            text-transform:uppercase;
            font-size:11px;
            font-weight:800;
        }

        /* ✅ 눈 버튼 */
        .eye-btn{
            width:38px;
            height:38px;
            border:0;
            background:transparent;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            opacity:.85;
            flex:0 0 auto;
            color:#fff;
        }
        .eye-btn:hover{opacity:1}
        .eye-btn svg{width:18px;height:18px}

        .login-btn{
            margin-top:10px;
            height:44px;
            border:0;
            background:#fff;
            color:var(--blue2);
            font-size:12px;
            font-weight:900;
            letter-spacing:.8px;
            border-radius:3px;
            cursor:pointer;
            box-shadow:var(--shadow);
        }

        .hint{
            margin-top:10px;
            font-size:13px;
            color:var(--muted);
        }
        .hint a{
            color:#fff;
            text-decoration:none;
            border-bottom:1px solid rgba(255,255,255,.55);
            padding-bottom:1px;
        }

        .error{
            display:none;
            color:#111;
            border:1px solid var(--dangerLine);
            background:rgba(255,255,255,.18);
            padding:10px 12px;
            margin:0 auto 12px;
            border-radius:6px;
            width:min(380px, 92vw);
            text-align:left;
            font-weight:900;
        }

        @media (max-width:768px){
            .logoMark{font-size:48px}
            .brandText{font-size:38px}
        }

        #empId {
            text-transform: uppercase;
        }
    </style>
</head>

<body>
<div class="page">
    <main>
        <section class="card">
            <div class="logoRow" aria-label="Bizportal">
                <div class="logoMark">B</div>
                <div class="brandText">Bizportal</div>
            </div>

            <div id="serverError" class="error"></div>

            <form id="employee-login-form" class="form">
                <div class="input-wrap">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21a8 8 0 0 0-16 0"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input id="empId" type="text" placeholder="USERNAME" autocomplete="username" required />
                </div>

                <div class="input-wrap">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                    </svg>

                    <input id="password" type="password" placeholder="PASSWORD" autocomplete="current-password" required />

                    <!-- ✅ 눈 버튼 추가 -->
                    <button class="eye-btn" type="button" aria-label="toggle password" data-target="password">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <button class="login-btn" type="submit">LOGIN</button>
            </form>

            <div class="hint">
                <a th:href="@{/auth/employee/verify}">비밀번호 변경하기</a>
            </div>
        </section>
    </main>
</div>

<script>

    const DEVICE_KEY = "deviceId";

    function uuidv4Fallback() {
        const bytes = new Uint8Array(16);

        if (window.crypto && crypto.getRandomValues) {
            crypto.getRandomValues(bytes);
        } else {
            // 최후 fallback (보안 약함, 그래도 동작은 하게)
            for (let i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
        }

        // RFC 4122 v4
        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;

        const hex = [...bytes].map(b => b.toString(16).padStart(2, "0")).join("");
        return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
    }

    function getDeviceId() {
        let id = localStorage.getItem(DEVICE_KEY);
        if (!id) {
            id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : uuidv4Fallback();
            localStorage.setItem(DEVICE_KEY, id);
        }
        return id;
    }
    document.addEventListener('DOMContentLoaded', () => {
        const empIdInput = document.getElementById('empId');

        // 입력이 일어날 때마다 대문자로 변환
        empIdInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });
    });
    // ✅ 비밀번호 보기/숨기기
    document.querySelectorAll('.eye-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-target');
            const input = document.getElementById(id);
            if (!input) return;
            input.type = (input.type === 'password') ? 'text' : 'password';
        });
    });

    const form = document.getElementById('employee-login-form');
    const serverError = document.getElementById('serverError');

    async function safeJson(res) {
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) return {};
        try { return await res.json(); } catch { return {}; }
    }

    function getMustChangePassword(result){
        // ✅ ResponseDto 형태(data 안에 있을 수도, 루트에 있을 수도 있어서 둘 다 대응)
        // 예) { message, data: { mustChangePassword: true, ... } }
        // 예) { mustChangePassword: true, ... }
        return Boolean(result?.data?.mustChangePassword ?? result?.mustChangePassword);
    }


    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        serverError.style.display = 'none';
        serverError.textContent = '';

        const empId = document.getElementById('empId').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/auth/employee/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ empId, password, deviceId: getDeviceId() })
            });

            const result = await safeJson(res);

            if (res.ok) {
                const mustChangePassword = getMustChangePassword(result);

                if (mustChangePassword) {
                    const confirmRes = await Alert.confirm('초기 비밀번호입니다. 보안을 위해 지금 비밀번호를 변경하시겠습니까?', '보안 알림');

                    if (confirmRes.isConfirmed) {
                        window.location.href = '/auth/employee/verify';
                    } else {
                        window.location.href = '/auth/employee/login';
                    }
                    return;
                }

                window.location.href = '/employees';

            } else {
                serverError.textContent = result?.message || `로그인에 실패했습니다. (${res.status})`;
                serverError.style.display = 'block';
            }
        } catch (err) {
            console.error(err);
            await Alert.error('서버와의 통신 중 오류가 발생했습니다.');
        }
    });

</script>
</body>
</html>
