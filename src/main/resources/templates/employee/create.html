<!-- templates/employee/create.html -->
<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>사원 등록</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* =========================================================
               ✅ SCOPE ROOT: 이 페이지에서만 스타일 적용
               ========================================================= */
            .emp-create-page .create-wrap{
                width:100%;
                max-width:1180px;
                margin:0 auto;
                padding:6px 26px 24px;
            }

            .emp-create-page .card{
                width:100%;
                background:var(--white);
                border:1px solid var(--line);
                border-radius:18px;
                box-shadow:var(--shadow2);
                padding:18px;
            }

            .emp-create-page .grid{
                display:grid;
                grid-template-columns:300px 1fr;
                gap:18px;
                align-items:start;
            }

            /* Upload */
            .emp-create-page .upload-label{
                font-size:13px;
                color:#374151;
                font-weight:900;
                margin:0 0 10px 0;
            }

            .emp-create-page .uploader{
                width:100%;
                background:#fff;
                border-radius:16px;
                padding:14px;
                border:1px solid var(--line);
            }

            .emp-create-page .drop{
                border:2px dashed rgba(59,130,246,.35);
                border-radius:16px;
                height:210px;
                display:grid;
                place-items:center;
                cursor:pointer;
                position:relative;
                overflow:hidden;
                background:#fff;
            }
            .emp-create-page .drop:hover{ background:rgba(59,130,246,.04); }

            .emp-create-page .drop .hint{
                text-align:center;
                color:#374151;
                display:flex;
                flex-direction:column;
                gap:8px;
                align-items:center;
                font-weight:900;
            }

            .emp-create-page .drop small{
                display:block;
                color:var(--muted);
                font-weight:700;
            }

            .emp-create-page .preview{
                position:absolute;
                inset:0;
                width:100%;
                height:100%;
                object-fit:cover;
                display:none;
            }

            .emp-create-page .file-meta{
                margin-top:10px;
                font-size:12px;
                color:var(--muted);
                font-weight:700;
            }
            .emp-create-page .file-meta b{ color:#111827; }

            .emp-create-page .remove-file{
                margin-top:10px;
                width:100%;
                height:38px;
                border-radius:12px;
                border:1px solid var(--line);
                background:#fff;
                cursor:pointer;
                font-weight:900;
            }

            /* Form */
            .emp-create-page .form{
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:14px 14px;
            }

            .emp-create-page .field{
                display:flex;
                flex-direction:column;
                gap:8px;
            }

            .emp-create-page .label{
                font-size:13px;
                color:#111827;
                font-weight:900;
            }

            .emp-create-page .req{ color:#ef4444; margin-left:4px; }

            /* ✅ 전역 input/select 금지: 반드시 스코프 */
            .emp-create-page input,
            .emp-create-page select{
                height:42px;
                border-radius:12px;
                border:1px solid var(--line);
                padding:0 12px;
                outline:none;
                background:#fff;
                font-size:14px;
            }

            .emp-create-page input:focus,
            .emp-create-page select:focus{
                border-color: rgba(59,130,246,.55);
                box-shadow: 0 0 0 4px rgba(59,130,246,.12);
            }

            .emp-create-page .full{ grid-column:1 / -1; }
            .emp-create-page .readonly{ background:#f8fafc; color:#475569; }
            .emp-create-page .help{ font-size:12px; color:var(--muted); margin-top:-4px; font-weight:700; }
            .emp-create-page .mono{ font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }

            .emp-create-page .actions{
                display:flex;
                justify-content:flex-end;
                gap:10px;
                margin-top:16px;
            }

            /* ✅ 전역 .btn 금지: 반드시 스코프 */
            .emp-create-page .btn{
                height:42px;
                min-width:110px;
                border-radius:12px;
                border:0;
                cursor:pointer;
                font-weight:900;
                padding:0 14px;
            }
            .emp-create-page .btn.primary{
                background:var(--primary2);
                color:#fff;
            }

            /* ✅ 취소 버튼: 하얀 배경 + 검은 글자 */
            .emp-create-page .btn.ghost{
                background:#fff;
                color:#111;
                border:1px solid var(--line);
            }
            .emp-create-page .btn.ghost:hover{ background:#f8fafc; }

            /* Toast */
            .emp-create-page .toast{
                margin-top:10px;
                padding:12px 14px;
                border-radius:14px;
                display:none;
                font-size:13px;
                border:1px solid var(--line);
                background:#fff;
                font-weight:900;
            }
            .emp-create-page .toast.ok{ display:block; border-color:rgba(34,197,94,.25); background:rgba(34,197,94,.07); }
            .emp-create-page .toast.bad{ display:block; border-color:rgba(239,68,68,.25); background:rgba(239,68,68,.07); }

            /* Modal */
            .emp-create-page .modal-backdrop{
                position:fixed;
                inset:0;
                background:rgba(17,24,39,.55);
                display:none;
                align-items:center;
                justify-content:center;
                z-index:9999;
            }

            .emp-create-page .modal{
                width:min(520px, calc(100vw - 40px));
                background:#fff;
                border-radius:18px;
                border:1px solid rgba(0,0,0,.08);
                box-shadow:0 20px 60px rgba(0,0,0,.25);
                overflow:hidden;
            }

            .emp-create-page .modal-head{
                padding:16px 18px;
                display:flex;
                align-items:center;
                justify-content:space-between;
                border-bottom:1px solid var(--line);
            }

            .emp-create-page .modal-title{
                font-weight:950;
                display:flex;
                align-items:center;
                gap:10px;
            }

            .emp-create-page .modal-close{
                width:38px;
                height:38px;
                border-radius:12px;
                border:1px solid var(--line);
                background:#fff;
                cursor:pointer;
                font-weight:900;
            }

            .emp-create-page .modal-body{ padding:18px; }
            .emp-create-page .modal-body p{ margin:0 0 12px; color:#111827; font-weight:900; }

            .emp-create-page .kv2{
                display:grid;
                grid-template-columns:120px 1fr;
                gap:10px 12px;
                align-items:center;
                padding:12px;
                background:#f8fafc;
                border:1px solid var(--line);
                border-radius:14px;
                font-weight:900;
            }
            .emp-create-page .kv2 .k{ color:#334155; }
            .emp-create-page .kv2 .v{ font-weight:950; }

            .emp-create-page .modal-actions{
                padding:16px 18px;
                border-top:1px solid var(--line);
                display:flex;
                justify-content:flex-end;
                gap:10px;
            }

            .emp-create-page .btn2{
                height:42px;
                min-width:110px;
                border-radius:14px;
                border:0;
                cursor:pointer;
                font-weight:950;
                padding:0 14px;
            }
            .emp-create-page .btn2.primary{ background:var(--primary); color:#fff; }
            .emp-create-page .btn2.ghost{ background:#eef2ff; color:#1f3b7a; }

            .emp-create-page .copy-btn{
                height:34px;
                border-radius:12px;
                border:1px solid var(--line);
                background:#fff;
                cursor:pointer;
                font-weight:900;
                padding:0 10px;
                margin-left:8px;
            }

            /* ✅ 주소 UI */
            .emp-create-page .addr-top{
                display:flex;
                gap:10px;
                align-items:stretch;
                flex-wrap:wrap;
            }
            .emp-create-page .addr-top .inline-btn{
                height:42px;
                border-radius:12px;
                border:0;
                cursor:pointer;
                font-weight:900;
                padding:0 14px;
                background:var(--primary);
                color:#fff;
                min-width:110px;
            }
            .emp-create-page .addr-top input{
                flex:1;
                min-width:140px;
            }

            @media (max-width: 980px){
                .emp-create-page .grid{ grid-template-columns:1fr; }
                .emp-create-page .create-wrap{ padding:6px 16px 24px; }
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content" class="emp-create-page">

    <section class="page-with-subbar">
        <aside th:replace="~{sidebar/admin-sidebar :: adminSidebar('emp')}"></aside>

        <div class="create-wrap">
            <section class="card" style="margin-top: 30px;">
                <div class="grid">
                    <!-- Upload -->
                    <div>
                        <div class="upload-label">사원 사진</div>

                        <div class="uploader">
                            <div class="drop" id="drop">
                                <img id="preview" class="preview" alt="preview"/>
                                <div class="hint" id="dropHint">
                                    <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
                                        <path d="M12 3v12" stroke="var(--primary2)" stroke-width="2" stroke-linecap="round"/>
                                        <path d="m7 8 5-5 5 5" stroke="var(--primary2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M5 21h14" stroke="var(--primary2)" stroke-width="2" stroke-linecap="round"/>
                                    </svg>
                                    클릭하여 업로드
                                    <small>JPG/PNG, 최대 5MB</small>
                                </div>
                                <input id="photo" type="file" accept="image/*" hidden />
                            </div>

                            <div class="file-meta" id="fileMeta">선택된 파일: <b>-</b></div>
                            <button class="remove-file" id="removeFile" type="button">사진 제거</button>
                        </div>

                        <div class="toast" id="toast"></div>
                    </div>

                    <!-- Form -->
                    <div>
                        <form id="empForm" autocomplete="off">
                            <div class="form">
                                <div class="field">
                                    <div class="label">이름<span class="req">*</span></div>
                                    <input id="empName" type="text" placeholder="예) 김지영" required />
                                </div>

                                <div class="field">
                                    <div class="label">사번(자동 생성)</div>
                                    <input id="empId" type="text" class="readonly mono" placeholder="등록 후 자동 생성" readonly />
                                    <div class="help">등록 완료 후 자동으로 표시</div>
                                </div>

                                <div class="field">
                                    <div class="label">생년월일<span class="req">*</span></div>
                                    <input id="birth" type="date" required />
                                </div>

                                <div class="field">
                                    <div class="label">입사일<span class="req">*</span></div>
                                    <input id="hireDate" type="date" required />
                                </div>

                                <!-- ✅ 주소: 도로명 API + 상세주소 -->
                                <div class="field full">
                                    <div class="label">주소<span class="req">*</span></div>

                                    <div class="addr-top">
                                        <input id="zipNo" type="text" placeholder="우편번호" class="readonly" readonly />
                                        <button class="inline-btn" id="addrSearchBtn" type="button">주소 검색</button>
                                    </div>

                                    <input id="roadAddr" type="text" placeholder="도로명 주소" class="readonly" readonly required />
                                    <input id="addrDetail" type="text" placeholder="상세 주소를 입력하세요" />

                                    <!-- ✅ 백엔드가 addr 하나만 받는다면: 합쳐서 담는 hidden -->
                                    <input id="addr" type="hidden" />
                                    <div class="help">주소 검색 후 상세주소를 입력하세요.</div>
                                </div>

                                <div class="field">
                                    <div class="label">이메일<span class="req">*</span></div>
                                    <input id="email"
                                           type="email"
                                           placeholder="예) user@corp.com"
                                           required
                                           pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$"
                                           title="이메일 형식이 올바르지 않습니다. (예: user@corp.com)" />
                                </div>

                                <div class="field">
                                    <div class="label">사내번호<span class="req">*</span></div>
                                    <input id="workPhone" type="text" placeholder="예) 1234" maxlength="10" required />
                                </div>

                                <div class="field">
                                    <div class="label">전화번호<span class="req">*</span></div>
                                    <input id="phone"
                                           type="tel"
                                           placeholder="예) 010-1234-5678"
                                           maxlength="13"
                                           required
                                           pattern="^01[0-9]-\d{3,4}-\d{4}$"
                                           title="전화번호 형식이 올바르지 않습니다. (예: 010-1234-5678)" />
                                    <div class="help">010-1234-5678 형식</div>
                                </div>

                                <div class="field">
                                    <div class="label">성별<span class="req">*</span></div>
                                    <select id="gen" required>
                                        <option value="" selected disabled>성별 선택</option>
                                        <option value="M">남</option>
                                        <option value="F">여</option>
                                    </select>
                                </div>

                                <div class="field">
                                    <div class="label">부서<span class="req">*</span></div>
                                    <select id="depNo" required>
                                        <option value="" selected disabled>부서 선택</option>
                                        <option th:each="d : ${departments}"
                                                th:value="${d.depNo}"
                                                th:text="${d.depName}">부서</option>
                                    </select>
                                </div>

                                <div class="field">
                                    <div class="label">직급<span class="req">*</span></div>
                                    <select id="posNo" required>
                                        <option value="" selected disabled>직급 선택</option>
                                        <option th:each="p : ${positions}"
                                                th:value="${p.posNo}"
                                                th:text="${p.posName}">직급</option>
                                    </select>
                                </div>

                                <div class="field full">
                                    <div class="label">권한<span class="req">*</span></div>
                                    <select id="role" required>
                                        <option value="" selected disabled>권한 선택</option>
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROLE</option>
                                    </select>
                                </div>
                            </div>

                            <div class="actions">
                                <button class="btn primary" id="submitBtn" type="submit">등록</button>
                                <button class="btn ghost" id="cancelBtn" type="button">취소</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

        </div>
    </section>

    <!-- ✅ 등록 성공 모달 -->
    <div class="modal-backdrop" id="successBackdrop" role="dialog" aria-modal="true" aria-labelledby="successTitle">
        <div class="modal">
            <div class="modal-head">
                <div class="modal-title" id="successTitle">✅ 등록 성공</div>
                <button class="modal-close" type="button" id="successCloseBtn">✕</button>
            </div>
            <div class="modal-body">
                <p>사원이 등록되었습니다. 아래 정보를 꼭 전달해주세요.</p>

                <div class="kv2">
                    <div class="k">사번</div>
                    <div class="v">
                        <span id="modalEmpId">-</span>
                        <button class="copy-btn" type="button" id="copyEmpId">복사</button>
                    </div>

                    <div class="k">초기 비밀번호</div>
                    <div class="v">
                        <span id="modalPwd">-</span>
                        <button class="copy-btn" type="button" id="copyPwd">복사</button>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn2 ghost" type="button" id="stayBtn">계속 등록</button>
                <button class="btn2 primary" type="button" id="goListBtn">목록으로</button>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="pageScripts">
    <script>
        const API_BASE = "";
        const LIST_URL = "/admin/employees/list";

        const $drop = document.getElementById("drop");
        const $photo = document.getElementById("photo");
        const $preview = document.getElementById("preview");
        const $dropHint = document.getElementById("dropHint");
        const $fileMeta = document.getElementById("fileMeta");
        const $removeFile = document.getElementById("removeFile");
        const $toast = document.getElementById("toast");

        const $form = document.getElementById("empForm");
        const $submitBtn = document.getElementById("submitBtn");
        const $cancelBtn = document.getElementById("cancelBtn");

        const $empId = document.getElementById("empId");
        const $email = document.getElementById("email");
        const $phone = document.getElementById("phone");

        // ✅ 입사일
        const $hireDate = document.getElementById("hireDate");

        // ✅ 생년월일
        const $birth = document.getElementById("birth");

        // ✅ 주소 요소
        const $addrSearchBtn = document.getElementById("addrSearchBtn");
        const $zipNo = document.getElementById("zipNo");
        const $roadAddr = document.getElementById("roadAddr");
        const $addrDetail = document.getElementById("addrDetail");
        const $addrHidden = document.getElementById("addr");

        // success modal
        const $successBackdrop = document.getElementById("successBackdrop");
        const $successCloseBtn = document.getElementById("successCloseBtn");
        const $goListBtn = document.getElementById("goListBtn");
        const $stayBtn = document.getElementById("stayBtn");
        const $modalEmpId = document.getElementById("modalEmpId");
        const $modalPwd = document.getElementById("modalPwd");
        const $copyEmpId = document.getElementById("copyEmpId");
        const $copyPwd = document.getElementById("copyPwd");

        function toast(type, msg){
            $toast.className = "toast " + (type === "ok" ? "ok" : "bad");
            $toast.textContent = msg;
            $toast.style.display = "block";
        }
        function clearToast(){
            $toast.style.display = "none";
            $toast.className = "toast";
            $toast.textContent = "";
        }

        function openSuccessModal(empId, pwd){
            $modalEmpId.textContent = empId || "-";
            $modalPwd.textContent = pwd || "-";
            $successBackdrop.style.display = "flex";
        }
        function closeSuccessModal(){ $successBackdrop.style.display = "none"; }

        async function copyText(t){
            try{
                await navigator.clipboard.writeText(String(t || ""));
                toast("ok", "복사 완료!");
            }catch(e){
                toast("bad", "복사 실패 (브라우저 권한 확인)");
            }
        }
        $copyEmpId.addEventListener("click", ()=> copyText($modalEmpId.textContent));
        $copyPwd.addEventListener("click", ()=> copyText($modalPwd.textContent));
        $goListBtn.addEventListener("click", ()=> window.location.href = LIST_URL);

        $stayBtn.addEventListener("click", ()=>{
            closeSuccessModal();
            $form.reset();
            $empId.value = "";

            // ✅ 주소 초기화
            $zipNo.value = "";
            $roadAddr.value = "";
            $addrDetail.value = "";
            $addrHidden.value = "";

            // ✅ 입사일 제약 다시 적용
            applyHireDateMin();

            $photo.value = "";
            $preview.src = "";
            $preview.style.display = "none";
            $dropHint.style.display = "flex";
            $fileMeta.innerHTML = `선택된 파일: <b>-</b>`;
            clearToast();
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
        $successCloseBtn.addEventListener("click", closeSuccessModal);
        $successBackdrop.addEventListener("click", (e)=>{ if(e.target === $successBackdrop) closeSuccessModal(); });

        // Upload UI
        $drop.addEventListener("click", () => $photo.click());

        $photo.addEventListener("change", () => {
            const file = ($photo.files && $photo.files[0]) ? $photo.files[0] : null;
            if (!file) return;

            if (!/^image\//.test(file.type)) {
                toast("bad", "이미지 파일만 업로드할 수 있어.");
                $photo.value = "";
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                toast("bad", "최대 5MB까지만 업로드 가능해.");
                $photo.value = "";
                return;
            }

            $fileMeta.innerHTML = `선택된 파일: <b>${file.name}</b>`;

            const url = URL.createObjectURL(file);
            $preview.src = url;
            $preview.style.display = "block";
            $dropHint.style.display = "none";
        });

        $removeFile.addEventListener("click", () => {
            $photo.value = "";
            $preview.src = "";
            $preview.style.display = "none";
            $dropHint.style.display = "flex";
            $fileMeta.innerHTML = `선택된 파일: <b>-</b>`;
        });

        // Validation helpers
        function isValidEmail(v){
            return /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(String(v||"").trim());
        }
        function isValidPhone(v){
            return /^01[0-9]-\d{3,4}-\d{4}$/.test(String(v||"").trim());
        }
        function formatKoreanMobile(raw){
            const digits = String(raw||"").replace(/\D/g, "").slice(0, 11);
            if (digits.length <= 3) return digits;
            if (digits.length <= 7) return `${digits.slice(0,3)}-${digits.slice(3)}`;
            return `${digits.slice(0,3)}-${digits.slice(3,7)}-${digits.slice(7)}`;
        }

        $email.addEventListener("input", () => { $email.value = $email.value.replace(/\s/g, ""); });
        $phone.addEventListener("input", () => { $phone.value = formatKoreanMobile($phone.value); });

        // ✅ YYYY-MM-DD 만들기(로컬 기준)
        function pad2(n){ return String(n).padStart(2, "0"); }
        function toDateStrLocal(d){
            return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
        }

        // ✅ 생년월일은 "오늘 이후" 선택 불가 (최대: 오늘)
        function applyBirthMax(){
            const today = new Date();
            const maxStr = toDateStrLocal(new Date(today.getFullYear(), today.getMonth(), today.getDate()));
            $birth.max = maxStr;

            // 이미 값이 있는데 max보다 크면 비움
            if ($birth.value && $birth.value > maxStr){
                $birth.value = "";
            }
        }

        function validateBirth(){
            const v = String($birth.value || "").trim();
            if (!v){
                toast("bad", "생년월일을 선택해주세요.");
                $birth.focus();
                return false;
            }
            const maxStr = String($birth.max || "").trim();
            if (maxStr && v > maxStr){
                toast("bad", `생년월일은 ${maxStr} 이후로 선택할 수 없어요.`);
                $birth.focus();
                return false;
            }
            return true;
        }

        // 입력 중에도 즉시 검증/정리
        $birth.addEventListener("change", () => {
            clearToast();
            applyBirthMax();
            const maxStr = String($birth.max || "").trim();
            if ($birth.value && maxStr && $birth.value > maxStr){
                toast("bad", `생년월일은 ${maxStr} 이후로 선택할 수 없어요.`);
                $birth.value = "";
            }
        });

        // ✅ 입사일은 "오늘 이후(=내일~)"만 허용
        function applyHireDateMin(){
            const now = new Date();
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const minStr = toDateStrLocal(tomorrow);

            $hireDate.min = minStr;

            // 이미 값이 있는데 min보다 작으면 비움
            if ($hireDate.value && $hireDate.value < minStr){
                $hireDate.value = "";
            }
        }

        function validateHireDate(){
            const v = String($hireDate.value || "").trim();
            if (!v){
                toast("bad", "입사일을 선택해주세요.");
                $hireDate.focus();
                return false;
            }

            const minStr = String($hireDate.min || "").trim();
            if (minStr && v < minStr){
                toast("bad", `입사일은 ${minStr} 이후만 가능해요.`);
                $hireDate.focus();
                return false;
            }
            return true;
        }

        // 입력 중에도 즉시 검증/정리
        $hireDate.addEventListener("change", () => {
            clearToast();
            // min 갱신 후, 규칙 위반이면 비움
            applyHireDateMin();
            const minStr = String($hireDate.min || "").trim();
            if ($hireDate.value && minStr && $hireDate.value < minStr){
                toast("bad", `입사일은 ${minStr} 이후만 가능해요.`);
                $hireDate.value = "";
            }
        });

        // ✅ 주소 합치기(백엔드가 addr 하나만 받을 때)
        function buildCombinedAddr(){
            const road = String($roadAddr.value || "").trim();
            const detail = String($addrDetail.value || "").trim();
            const combined = detail ? `${road} ${detail}` : road;
            $addrHidden.value = combined;
            return combined;
        }

        // ✅ 도로명 주소 팝업 연결 (/auth/juso/popup 재사용)
        $addrSearchBtn.addEventListener("click", () => {
            window.open('/auth/juso/popup', 'jusoPopup', 'width=570,height=420,scrollbars=yes,resizable=yes');
        });

        // ✅ 팝업에서 호출되는 콜백 (이 이름 중요)
        window.jusoCallBack = function(roadAddrPart1, addrDetail, zipNo){
            $zipNo.value = zipNo || "";
            $roadAddr.value = (roadAddrPart1 || "").trim();
            if (addrDetail) $addrDetail.value = addrDetail;
            buildCombinedAddr();
            $addrDetail.focus();
            toast("ok", "주소가 입력되었습니다.");
        };

        // 상세주소 수정 시에도 addr 갱신
        $addrDetail.addEventListener("input", buildCombinedAddr);

        // API helpers
        async function requestJson(method, path, body){
            const res = await fetch(`${API_BASE}${path}`, {
                method,
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: body ? JSON.stringify(body) : null
            });

            const text = await res.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch(e){}

            if (!res.ok) throw new Error(`HTTP ${res.status} ${text || ""}`.trim());
            return json;
        }
        const postJson = (p,b)=>requestJson("POST", p, b);
        const patchJson = (p,b)=>requestJson("PATCH", p, b);

        function unwrapResponseDto(maybe){
            if (maybe && typeof maybe === "object" && "data" in maybe) return maybe.data;
            return maybe;
        }

        // S3 upload flow
        async function presignForEmployee(empNo, file){
            const raw = await postJson("/api/v1/attachments/presign", {
                domain: "EMPLOYEE",
                entityId: empNo,
                fileType: "IMAGE",
                originalName: file.name,
                contentType: file.type || "application/octet-stream",
                size: file.size
            });
            const data = unwrapResponseDto(raw);
            if (!data?.objectKey || !data?.uploadUrl) throw new Error("presign 응답에 objectKey/uploadUrl 없음");
            return data;
        }

        async function uploadToS3(uploadUrl, file){
            const res = await fetch(uploadUrl, {
                method: "PUT",
                headers: { "Content-Type": file.type || "application/octet-stream" },
                body: file
            });
            if (!res.ok) throw new Error("S3 업로드 실패: " + res.status);
            return { etag: res.headers.get("ETag") };
        }

        async function completeEmployee(empNo, file, objectKey, etag){
            const raw = await postJson("/api/v1/attachments/complete", {
                domain: "EMPLOYEE",
                entityId: empNo,
                fileType: "IMAGE",
                objectKey,
                originalName: file.name,
                contentType: file.type || "application/octet-stream",
                size: file.size,
                etag: etag || null
            });
            return unwrapResponseDto(raw);
        }

        async function updateEmployeeObjectKey(empNo, objectKey){
            await patchJson(`/api/v1/admin/employees/${empNo}/object-key`, { objectKey });
        }

        async function createEmployee(){
            // ✅ 주소 검증 + 합치기
            const combinedAddr = buildCombinedAddr();
            if (!combinedAddr) {
                throw new Error("주소를 입력해주세요. (주소 검색 후 상세주소 입력)");
            }

            const body = {
                depNo: Number(document.getElementById("depNo").value),
                posNo: Number(document.getElementById("posNo").value),
                empName: document.getElementById("empName").value.trim(),
                birth: document.getElementById("birth").value,
                email: document.getElementById("email").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                workPhone: document.getElementById("workPhone").value.trim(),
                addr: combinedAddr,
                gen: document.getElementById("gen").value,
                role: document.getElementById("role").value,
                hireDate: document.getElementById("hireDate").value
            };
            const raw = await postJson("/api/v1/admin/employees", body);
            return unwrapResponseDto(raw);
        }

        $form.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearToast();

            if (!$form.checkValidity()) {
                $form.reportValidity();
                return;
            }

            const emailVal = $email.value.trim();
            const phoneVal = $phone.value.trim();

            if (!isValidEmail(emailVal)) { toast("bad", "이메일 형식이 올바르지 않아."); $email.focus(); return; }
            if (!isValidPhone(phoneVal)) { toast("bad", "전화번호 형식이 올바르지 않아."); $phone.focus(); return; }

            // ✅ 입사일 검증(오늘 이후만)
            if (!validateHireDate()) return;

            // ✅ 생년월일 검증(오늘 이후 선택 불가)
            if (!validateBirth()) return;

            // ✅ 주소 최소 체크(도로명 필수)
            if (!String($roadAddr.value || "").trim()) {
                toast("bad", "주소 검색을 통해 도로명 주소를 입력해주세요.");
                $addrSearchBtn.focus();
                return;
            }

            try{
                $submitBtn.disabled = true;
                toast("ok", "등록 중...");

                // 1) 사원 생성
                const created = await createEmployee();

                const empNo = created?.empNo ?? created?.id ?? null;
                const empId = created?.empId ?? null;
                const pwd  = created?.pwd ?? "1234";

                if (!empNo) throw new Error("사원 생성 응답에 empNo가 없음");

                if (empId) $empId.value = empId;

                // 2) 사진 업로드
                const file = ($photo.files && $photo.files[0]) ? $photo.files[0] : null;
                if (file){
                    toast("ok", "사진 업로드 중...");

                    const { objectKey, uploadUrl } = await presignForEmployee(empNo, file);
                    const { etag } = await uploadToS3(uploadUrl, file);
                    await completeEmployee(empNo, file, objectKey, etag);
                    await updateEmployeeObjectKey(empNo, objectKey);
                }

                clearToast();
                openSuccessModal(empId ?? "(확인 필요)", pwd);

            }catch(err){
                console.error(err);
                toast("bad", "등록 실패: " + (err.message || err));
            }finally{
                $submitBtn.disabled = false;
            }
        });

        $cancelBtn.addEventListener("click", () => { window.location.href = LIST_URL; });

        // ✅ 페이지 진입 시 바로 min 적용
        applyHireDateMin();
        // ✅ 페이지 진입 시 바로 max 적용
        applyBirthMax();
    </script>
</th:block>
</body>
</html>
