<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Cloud Trash</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* =========================================================
               0) LAYOUT (cloud 공통)
            ========================================================= */
            .content-wrap:has(.cloud-page){ padding:0; }
            .cloud-page{
                height: calc(100vh - var(--topbar-h) - var(--footer-h));
                background: var(--bg);
            }
            .cloud-page .page-with-subbar{
                display:grid;
                grid-template-columns: 220px 1fr;
                min-height: calc(100vh - var(--topbar-h) - var(--footer-h));
            }

            /* =========================================================
               1) SIDEBAR (tabs / tree / footer dock)
            ========================================================= */
            .cloud-page .subbar{ display:flex; flex-direction:column; }

            .cloud-subbar{
                display:flex;
                flex-direction:column;
                height:100%;
                min-height:0;
            }
            .cloud-tree-panel{
                flex:1;
                overflow:auto;
                min-height:0;
                padding: 10px 10px 12px;
            }
            .cloud-tree{ list-style:none; margin:0; padding:0; }

            .cloud-scope-tabs{
                display:grid;
                grid-template-columns: 1fr 1fr;
                gap:8px;
                padding: 10px 12px 12px;
                border-bottom: 1px solid rgba(59,130,246,.14);
                background: rgba(255,255,255,.30);
            }
            .cloud-scope-tab{
                height:34px;
                display:flex;
                align-items:center;
                justify-content:center;
                border-radius:10px;
                text-decoration:none;
                font-weight:900;
                font-size:13px;
                color:#1d4ed8;
                background: rgba(59,130,246,.12);
                border:1px solid rgba(59,130,246,.10);
            }
            .cloud-scope-tab:hover{ background: rgba(59,130,246,.18); }
            .cloud-scope-tab.active{
                background: var(--primary);
                color:#fff;
                border-color:transparent;
            }

            .cloud-sidebar-footer{
                flex: 0 0 auto;
                padding: 10px 12px 12px;
                border-top: 1px solid rgba(59, 130, 246, .14);
                background: rgba(255, 255, 255, .30);
            }
            .cloud-footer-link{
                display: grid;
                grid-template-columns: 18px 1fr 18px;
                align-items: center;
                height: 38px;
                padding: 0 12px;
                border-radius: 12px;
                text-decoration: none;
                font-weight: 900;
                font-size: 13px;
                color:#1d4ed8;
                background: rgba(59,130,246,.12);
                border: 1px solid rgba(59,130,246,.10);
            }
            .cloud-footer-link:hover{ background: rgba(59,130,246,.18); }
            .cloud-footer-ico{
                width: 18px;
                height: 18px;
                justify-self: start;
                display: inline-block;
                background: url("/images/icons/trash.png") center/contain no-repeat;
                opacity: .95;
            }
            .cloud-footer-text{
                justify-self: center;
                text-align: center;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .cloud-footer-spacer{
                width: 18px;
                height: 18px;
                justify-self: end;
            }
            .cloud-footer-link.active{
                background: var(--primary);
                color:#fff;
                border-color:transparent;
            }
            .cloud-footer-link.active .cloud-footer-ico{
                filter: brightness(0) invert(1);
                opacity:1;
            }

            /* =========================================================
               2) MAIN
            ========================================================= */
            .cloud-main{ display:flex; flex-direction:column; min-width:0; background: var(--bg); }

            .cloud-topbar{
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap:12px;
                padding:16px 18px;
                background:#fff;
                border-bottom:1px solid rgba(17,24,39,.08);
            }
            .cloud-title{
                font-size:24px;
                font-weight:900;
                margin:0;
                color: var(--text);
            }
            .cloud-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
            .cloud-body{ flex:1; overflow:auto; padding:18px; }

            /* 버튼 통일 */
            .cloud-page .btn{
                height:34px;
                padding: 0 12px;
                border-radius:10px;
                border: 1px solid rgba(17,24,39,.10);
                background:#fff;
                font-weight:900;
                cursor:pointer;
                color: var(--text);
            }
            .cloud-page .btn.primary{
                border:0;
                background: var(--primary);
                color:#fff;
            }
            .cloud-page .btn.primary:hover{ background: var(--primary2); }
            .cloud-page .btn:disabled{ opacity:.5; cursor:not-allowed; }

            /* =========================================================
               3) TRASH (grid)
            ========================================================= */
            .trash-wrap{ max-width:1080px; }
            .empty{
                color: rgba(17,24,39,.55);
                font-weight:900;
                padding: 18px 4px;
            }

            .file-grid{
                display:flex;
                flex-wrap:wrap;
                gap:10px;
                align-content:flex-start;
            }

            .folder-card, .file-card{
                width:110px;
                padding: 8px 6px;
                border: 1px solid transparent;
                border-radius:10px;
                background: transparent;
                text-align:center;
                cursor:pointer;
                position:relative;
                user-select:none;
            }
            .folder-card:hover, .file-card:hover{
                background: rgba(59,130,246,.10);
                border-color: rgba(59,130,246,.18);
            }
            .folder-card.selected, .file-card.selected{
                background: rgba(59,130,246,.16);
                border-color: rgba(59,130,246,.45);
            }

            .folder-ico-large, .file-ico{
                width:84px;
                height:84px;
                margin: 0 auto 6px;
                display:flex;
                align-items:center;
                justify-content:center;
            }
            .folder-ico-large{
                background: url("/images/icons/folder-large.png") center/contain no-repeat;
            }
            .file-ico img{
                width:180%;
                height:180%;
                object-fit:contain;
                display:block;
            }

            .folder-name, .file-name{
                font-size:12px;
                font-weight:800;
                color:#111827;
                white-space:nowrap;
                overflow:hidden;
                text-overflow:ellipsis;
            }
            .file-size{
                margin-top:2px;
                font-size:11px;
                color: var(--muted);
                font-weight:700;
            }
            .trash-meta{
                margin-top:2px;
                font-size:11px;
                color: rgba(17,24,39,.55);
                font-weight:700;
                white-space:nowrap;
                overflow:hidden;
                text-overflow:ellipsis;
            }

            .batch-badge{
                position:absolute;
                top:6px;
                right:6px;
                font-size:11px;
                font-weight:900;
                color: rgba(17,24,39,.70);
                background: rgba(255,255,255,.85);
                border: 1px solid rgba(17,24,39,.10);
                padding: 3px 7px;
                border-radius:999px;
                backdrop-filter: blur(6px);
            }

            /* ✅ 체크박스 UI (hover=네모, selected=체크) */
            .card-check{
                position:absolute;
                top:6px;
                left:6px;
                width:18px;
                height:18px;
                border-radius:6px;
                border:2px solid rgba(59,130,246,.55);
                background: rgba(255,255,255,.92);
                display:none;
                align-items:center;
                justify-content:center;
                box-shadow: 0 6px 14px rgba(0,0,0,.12);
                pointer-events:none;
            }
            .card-check::after{
                content:"✓";
                font-size:12px;
                font-weight:900;
                line-height:1;
                color:#fff;
                opacity:0;
            }
            .folder-card:hover .card-check,
            .file-card:hover .card-check{ display:flex; }

            .folder-card.selected .card-check,
            .file-card.selected .card-check{
                display:flex;
                background: var(--primary);
                border-color: transparent;
            }
            .folder-card.selected .card-check::after,
            .file-card.selected .card-check::after{ opacity:1; }

            /* =========================================================
               4) CONTEXT MENU
            ========================================================= */
            .trash-ctx{
                position: fixed;
                z-index: 9999;
                min-width: 220px;
                background: #fff;
                border: 1px solid rgba(17,24,39,.10);
                border-radius: 12px;
                box-shadow: 0 14px 30px rgba(0,0,0,.16);
                padding: 6px;
                max-width: min(520px, calc(100vw - 16px));
            }

            .trash-ctx .ctx-btn{
                width: 100%;
                border: 0;
                background: transparent;
                text-align: left;
                padding: 10px 10px;
                border-radius: 10px;
                font-weight: 900;
                cursor: pointer;
                color: #111827;
            }
            .trash-ctx .ctx-btn:hover{ background: rgba(59,130,246,.10); }
            .trash-ctx .ctx-btn:disabled{ opacity:.45; cursor:not-allowed; }

            .trash-ctx .sep{
                height: 1px;
                background: rgba(17,24,39,.08);
                margin: 6px 4px;
                border-radius: 999px;
            }

            .trash-ctx .ctx-info{ padding: 6px 8px 8px; }
            .trash-ctx .ctx-info-title{
                font-weight: 900;
                font-size: 12px;
                color: rgba(17,24,39,.65);
                margin-bottom: 6px;
            }

            .trash-ctx .ctx-row{
                display: grid;
                grid-template-columns: 74px 1fr;
                gap: 8px;
                align-items: start;
                padding: 4px 0;
                font-size: 12px;
            }
            .trash-ctx .ctx-row .k{ color: rgba(17,24,39,.55); font-weight: 800; }
            .trash-ctx .ctx-row .v{
                color: #111827;
                font-weight: 900;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .trash-ctx .ctx-row .v.wrap{
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                word-break: break-word;
                overflow-wrap: anywhere;
                line-height: 1.35;
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content" class="cloud-page">
    <div class="page-with-subbar">

        <!-- ✅ 왼쪽 sidebar 동일 -->
        <th:block th:replace="~{sidebar/cloud-sidebar :: cloudSidebar(${active})}"></th:block>

        <!-- ✅ 오른쪽: 휴지통 -->
        <section class="cloud-main">
            <div class="cloud-topbar">
                <h1 class="cloud-title">휴지통</h1>

                <div class="cloud-actions">
                    <!-- PRVT일 때만 비우기 -->
                    <button class="btn" id="btnPurgeSelected"
                            th:if="${trashScope != null and trashScope.name() == 'PRVT'}" disabled>선택 삭제</button>

                    <button class="btn" id="btnEmpty"
                            th:if="${trashScope != null and trashScope.name() == 'PRVT'}">휴지통 비우기</button>

                    <button class="btn" id="btnReload">새로고침</button>
                </div>
            </div>

            <div class="cloud-body">
                <div class="trash-wrap">

                    <div class="file-grid" id="trashGrid"></div>
                    <div class="empty" id="trashEmpty" style="display:none;">휴지통이 비어있습니다.</div>
                </div>
            </div>
        </section>
        <!-- ✅ 휴지통 우클릭 메뉴(기본은 숨김) -->
        <div class="trash-ctx" id="trashCtx" role="menu" aria-label="휴지통 메뉴" style="display:none;">
            <button type="button" class="ctx-btn" id="ctxRestore" role="menuitem">복구</button>
            <button type="button" class="ctx-btn" id="ctxPurgeDeptFile"
                    role="menuitem" style="display:none;" disabled
                    title="관리자 또는 파일 권한자만 영구삭제할 수 있습니다.">
                영구삭제
            </button>
            <button type="button" class="ctx-btn" id="ctxInfoToggle" role="menuitem">삭제 상세 정보</button>

            <div class="sep"></div>

            <!-- ✅ 상세 정보: 기본은 숨김 -->
            <div class="ctx-info" id="ctxInfo" aria-label="삭제 정보" style="display:none;">
                <div class="ctx-info-title">삭제 정보</div>

                <div class="ctx-row">
                    <span class="k">파일명</span>
                    <span class="v wrap" id="infoName">-</span>
                </div>
                <div class="ctx-row">
                    <span class="k">파일 크기</span>
                    <span class="v" id="infoSize">-</span>
                </div>
                <div class="ctx-row">
                    <span class="k">삭제 날짜</span>
                    <span class="v" id="infoDeletedAt">-</span>
                </div>
                <div class="ctx-row">
                    <span class="k">삭제한 사람</span>
                    <span class="v" id="infoDeletedBy">-</span>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:inline="javascript">
        /* =========================================================
           0) CONST / STATE
        ========================================================= */
        const IS_ADMIN = /*[[${#authorization.expression(
        "hasAnyAuthority(" +
        "'SYS_ADMIN','COM_ADMIN','SEC_ADMIN','THR_ADMIN'," +
        "'ROLE_SYS_ADMIN','ROLE_COM_ADMIN','ROLE_SEC_ADMIN','ROLE_THR_ADMIN'" +
        ")"
    )}]]*/ false;

        const CURRENT_USERNAME = /*[[${#authentication?.name}]]*/ "";
        const TRASH_SCOPE = /*[[${trashScope}]]*/ "DEPT"; // "DEPT" | "PRVT"
        const SCOPE = String(TRASH_SCOPE || "DEPT").toUpperCase();

        const PURGE_SELECTED_ENDPOINT = "/api/v1/cloud/trash/purge/prvt";

        const state = {
            selectedBatchId: null,
            selectedCardEl: null,

            // PRVT 멀티선택용
            selectedKeys: new Set(),
            lastClickedIndex: null,

            items: [],
            itemByKey: new Map(),
        };

        const el = {
            grid: document.getElementById("trashGrid"),
            empty: document.getElementById("trashEmpty"),

            btnReload: document.getElementById("btnReload"),
            btnEmpty: document.getElementById("btnEmpty"),
            btnPurgeSelected: document.getElementById("btnPurgeSelected"),
        };

        const ctx = {
            el: document.getElementById("trashCtx"),
            btnRestore: document.getElementById("ctxRestore"),
            btnPurgeDeptFile: document.getElementById("ctxPurgeDeptFile"),
            btnInfo: document.getElementById("ctxInfoToggle"),

            infoWrap: document.getElementById("ctxInfo"),
            infoName: document.getElementById("infoName"),
            infoSize: document.getElementById("infoSize"),
            infoDeletedAt: document.getElementById("infoDeletedAt"),
            infoDeletedBy: document.getElementById("infoDeletedBy"),

            currentBatchId: null,
            currentItem: null,
            isInfoOpen: false,
            openedAt: 0,
        };

        ctx.el?.addEventListener("contextmenu", (e) => e.preventDefault(), true);

        /* =========================================================
           1) UTILS
        ========================================================= */
        function safe(s) { return (s == null) ? "" : String(s); }

        function normUser(v) { return safe(v).trim().toLowerCase(); }
        function isSameUser(a, b) {
            const aa = normUser(a), bb = normUser(b);
            return aa.length > 0 && aa === bb;
        }

        function resolveOwnerId(it) {
            // ✅ ResTrashItemDto.ownerId 기준
            return safe(it?.ownerId);
        }

        function resolveDeletedBy(it) {
            // deletedBy가 서버에서 내려오는 필드면 그걸 쓰면 됨
            return safe(it?.deletedBy || it?.deletedByName || it?.deleterName || it?.deletedUserName || it?.deletedUser);
        }

        function fmtDate(dt) {
            if (!dt) return "";
            const d = new Date(dt);
            if (isNaN(d.getTime())) return String(dt);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            return `${yyyy}-${mm}-${dd}`;
        }

        function isFolder(it) {
            return String(it?.type || "").toUpperCase() === "FOLDER";
        }

        function getBatchId(it) {
            const raw =
                it?.deleteBatchId ??
                it?.batchId ??
                it?.deletedBatchId ??
                it?.delete_batch_id ??
                it?.batch ??
                it?.extra1;

            return raw == null ? "" : String(raw).trim();
        }

        function humanBytes(n) {
            if (n == null) return "";
            let v = Number(n);
            const units = ["B", "KB", "MB", "GB", "TB"];
            let i = 0;
            while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
            return `${v.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
        }

        function resolveFileIcon(it) {
            const ICONS = {
                word: "/images/icons/word.png",
                excel: "/images/icons/excel.png",
                ppt: "/images/icons/PPT.png",
                pdf: "/images/icons/PDF.png",
                image: "/images/icons/image-large.png",
                zip: "/images/icons/zip.png",
                code: "/images/icons/code.png",
                unknown: "/images/icons/unknown.png",
            };

            const EXT_GROUPS = {
                word: ["doc", "docx"],
                excel: ["xls", "xlsx", "csv"],
                ppt: ["ppt", "pptx"],
                pdf: ["pdf"],
                image: ["png", "jpg", "jpeg", "gif", "webp", "svg", "bmp", "tif", "tiff", "heic"],
                zip: ["zip", "rar", "7z", "tar", "gz", "bz2", "xz"],
                code: ["js", "ts", "jsx", "tsx", "html", "css", "scss", "less", "json", "xml", "yml", "yaml", "md", "py", "java", "c", "cpp", "go", "rs", "php", "rb", "kt", "swift", "sh", "sql"],
            };

            const name = safe(it?.originalName || it?.name || it?.title || "");
            let ext = safe(it?.ext || "").toLowerCase();
            if (!ext && name.includes(".")) ext = name.split(".").pop().toLowerCase();

            let type = "unknown";
            for (const [k, arr] of Object.entries(EXT_GROUPS)) {
                if (arr.includes(ext)) { type = k; break; }
            }
            return ICONS[type] || ICONS.unknown;
        }

        async function apiJson(url, opt = {}) {
            const res = await fetch(url, {
                credentials: "include",
                headers: { "Content-Type": "application/json", ...(opt.headers || {}) },
                ...opt,
            });

            const text = await res.text();
            let json = null;

            try { json = text ? JSON.parse(text) : null; }
            catch { throw new Error("서버 응답이 JSON이 아닙니다. (로그인 만료/에러 페이지일 수 있어요)"); }

            if (!res.ok) {
                const msg = json?.message || json?.error || res.statusText;
                throw new Error(msg);
            }
            return (json && typeof json === "object" && "data" in json) ? json.data : json;
        }

        /* =========================================================
           2) CONTEXT MENU
        ========================================================= */
        function closeTrashCtx() {
            if (!ctx.el) return;
            ctx.el.style.display = "none";
            ctx.currentBatchId = null;
            ctx.currentItem = null;
            ctx.isInfoOpen = false;
            if (ctx.infoWrap) ctx.infoWrap.style.display = "none";
            if (ctx.btnInfo) ctx.btnInfo.textContent = "삭제 상세 정보";
        }

        function positionCtx(x, y) {
            if (!ctx.el) return;
            ctx.el.style.left = x + "px";
            ctx.el.style.top = y + "px";
            ctx.el.style.display = "block";

            requestAnimationFrame(() => {
                const rect = ctx.el.getBoundingClientRect();
                const pad = 8;

                let left = x, top = y;
                const maxL = window.innerWidth - rect.width - pad;
                const maxT = window.innerHeight - rect.height - pad;

                if (left > maxL) left = maxL;
                if (top > maxT) top = maxT;

                ctx.el.style.left = Math.max(pad, left) + "px";
                ctx.el.style.top = Math.max(pad, top) + "px";
            });
        }

        function openTrashCtx(x, y, item, batchId) {
            if (!ctx.el) return;

            ctx.openedAt = Date.now();
            ctx.currentItem = item || {};
            ctx.currentBatchId = (String(batchId ?? "").trim() || null);

            const name = safe(item?.originalName || item?.name || item?.title || ("item-" + item?.id));
            const deletedAt = fmtDate(item?.deletedAt);
            const deletedBy = resolveDeletedBy(item) || "-";

            const folder = isFolder(item);
            const sizeText = folder ? "폴더" : (item?.size != null ? humanBytes(item.size) : "-");

            ctx.infoName && (ctx.infoName.textContent = name || "-");
            ctx.infoSize && (ctx.infoSize.textContent = sizeText || "-");
            ctx.infoDeletedAt && (ctx.infoDeletedAt.textContent = deletedAt || "-");
            ctx.infoDeletedBy && (ctx.infoDeletedBy.textContent = deletedBy || "-");

            // 복구 버튼: batchId 있으면 가능, 없으면 id 있을 때만(단건복구가 있는 경우 대비)
            const hasId = item && item.id != null;
            ctx.btnRestore && (ctx.btnRestore.disabled = (!ctx.currentBatchId && !hasId));

            // ✅ 영구삭제 버튼 정책(관리자 OR ownerId)
            const isDept = (SCOPE === "DEPT");
            const type = String(item?.type || "").toUpperCase();
            const isTarget = (type === "FILE" || type === "FOLDER");
            const isOwner = isSameUser(resolveOwnerId(item), CURRENT_USERNAME);

            const canPurge = isDept && isTarget && (IS_ADMIN || isOwner);

            if (ctx.btnPurgeDeptFile) {
                // DEPT에서만 노출 (FILE/FOLDER 둘 다)
                ctx.btnPurgeDeptFile.style.display = (isDept && isTarget) ? "block" : "none";
                ctx.btnPurgeDeptFile.disabled = !(canPurge && item?.id != null);

                ctx.btnPurgeDeptFile.title = canPurge
                    ? "영구삭제"
                    : "관리자 또는 소유자(ownerId)만 영구삭제할 수 있습니다.";
            }

            // 상세정보 닫힌 상태로 시작
            ctx.isInfoOpen = false;
            if (ctx.infoWrap) ctx.infoWrap.style.display = "none";
            if (ctx.btnInfo) ctx.btnInfo.textContent = "삭제 상세 정보";

            positionCtx(x, y);
        }

        // 상세정보 토글(한 번만 바인딩)
        ctx.btnInfo?.addEventListener("click", () => {
            if (!ctx.infoWrap || !ctx.el) return;

            ctx.isInfoOpen = !ctx.isInfoOpen;
            ctx.infoWrap.style.display = ctx.isInfoOpen ? "block" : "none";
            ctx.btnInfo.textContent = ctx.isInfoOpen ? "삭제 상세 정보 숨기기" : "삭제 상세 정보";

            // 아래로 튀어나오면 위로 올림
            const rect = ctx.el.getBoundingClientRect();
            const pad = 8;
            const overflowBottom = rect.bottom - (window.innerHeight - pad);
            if (overflowBottom > 0) {
                const newTop = Math.max(pad, rect.top - overflowBottom);
                ctx.el.style.top = newTop + "px";
            }
        });

        // 복구 클릭(한 번만 바인딩)
        ctx.btnRestore?.addEventListener("click", async () => {
            const batchId = ctx.currentBatchId;
            const item = ctx.currentItem;
            closeTrashCtx();

            if (batchId) {
                await restoreBatch(batchId);
                return;
            }

            // 단건 복구 API가 있으면 여기에서 호출
            if (item?.id != null && typeof restoreOne === "function") {
                await restoreOne(item.type, item.id);
            }
        });

        async function purgeDeptOne(item) {
            if (SCOPE !== "DEPT") return;

            const type = String(item?.type || "").toUpperCase();
            const id = item?.id;

            if (id == null) {
                return alert(type === "FOLDER" ? "삭제할 폴더 ID가 없습니다." : "삭제할 파일 ID가 없습니다.");
            }

            const label = (type === "FOLDER") ? "폴더" : "파일";
            if (!confirm(`${label}을(를) 영구삭제할까요?\n(되돌릴 수 없습니다)`)) return;

            const endpoint =
                (type === "FOLDER")
                    ? `/api/v1/cloud/trash/purge/dept/folder/${encodeURIComponent(id)}`
                    : `/api/v1/cloud/trash/purge/dept/file/${encodeURIComponent(id)}`;

            await apiJson(endpoint, { method: "POST" });
            await loadTrash();
            alert("영구삭제 완료!");
        }

        // 영구삭제 클릭(한 번만 바인딩)
        ctx.btnPurgeDeptFile?.addEventListener("click", async () => {
            const item = ctx.currentItem;
            closeTrashCtx();
            try { await purgeDeptOne(item); }
            catch (e) { alert(e.message); }
        });

        // 바깥 클릭/스크롤/ESC 닫기
        document.addEventListener("pointerdown", (e) => {
            if (!ctx.el || ctx.el.style.display !== "block") return;
            if (e.target.closest("#trashCtx")) return;
            if (e.button === 2 || e.ctrlKey) return;
            if (Date.now() - (ctx.openedAt || 0) < 150) return;
            closeTrashCtx();
        }, true);
        document.addEventListener("scroll", closeTrashCtx, true);
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeTrashCtx(); });

        /* =========================================================
           3) SELECT / RENDER
        ========================================================= */
        function getItemKey(it) {
            const t = String(it?.type || "ITEM").toUpperCase();
            const id = (it?.id != null) ? String(it.id) : "";
            const b = getBatchId(it);
            return id ? `${t}:${id}` : (b ? `BATCH:${b}` : `TMP:${Math.random().toString(36).slice(2)}`);
        }

        function updateTrashActionButtons() {
            if (SCOPE !== "PRVT") return;
            if (!el.btnPurgeSelected) return;
            el.btnPurgeSelected.disabled = (state.selectedKeys.size === 0);
        }

        function clearSelection() {
            state.selectedBatchId = null;
            if (state.selectedCardEl) state.selectedCardEl.classList.remove("selected");
            state.selectedCardEl = null;

            // PRVT 선택도 같이 정리
            state.selectedKeys.clear();
            state.lastClickedIndex = null;
            updateTrashActionButtons();
        }

        function selectCard(cardEl, batchId) {
            if (state.selectedCardEl) state.selectedCardEl.classList.remove("selected");
            cardEl.classList.add("selected");
            state.selectedCardEl = cardEl;

            const b = (batchId == null) ? "" : String(batchId).trim();
            state.selectedBatchId = b || null;
        }

        function render(items) {
            state.items = items || [];
            state.itemByKey.clear();
            clearSelection();

            el.grid.innerHTML = "";
            el.empty.style.display = (state.items.length === 0) ? "block" : "none";
            if (state.items.length === 0) return;

            // batch 개수 계산(배지용)
            const batchCount = new Map();
            for (const it of state.items) {
                const b = getBatchId(it);
                if (!b) continue;
                batchCount.set(b, (batchCount.get(b) || 0) + 1);
            }

            // 최신 삭제순
            const sorted = [...state.items].sort((a, b) => {
                const ta = new Date(a.deletedAt || 0).getTime();
                const tb = new Date(b.deletedAt || 0).getTime();
                return tb - ta;
            });

            sorted.forEach((it) => {
                const card = document.createElement("div");
                const batchId = getBatchId(it);
                const count = batchId ? (batchCount.get(batchId) || 1) : 1;
                const folder = isFolder(it);

                const key = getItemKey(it);
                state.itemByKey.set(key, it);

                card.dataset.key = key;
                card.dataset.batchId = batchId || "";
                card.dataset.itemId = safe(it?.id || "");
                card.className = folder ? "folder-card" : "file-card";

                // 체크 UI
                const check = document.createElement("div");
                check.className = "card-check";
                card.appendChild(check);

                // 배치 배지
                if (count > 1) {
                    const badge = document.createElement("div");
                    badge.className = "batch-badge";
                    badge.textContent = `${count}개`;
                    card.appendChild(badge);
                }

                if (folder) {
                    const ico = document.createElement("div");
                    ico.className = "folder-ico-large";

                    const name = document.createElement("div");
                    name.className = "folder-name";
                    name.textContent = safe(it.name || ("folder-" + it.id));

                    const meta = document.createElement("div");
                    meta.className = "trash-meta";
                    meta.textContent = `삭제됨 · ${fmtDate(it.deletedAt) || "-"}`;

                    card.appendChild(ico);
                    card.appendChild(name);
                    card.appendChild(meta);
                } else {
                    const ico = document.createElement("div");
                    ico.className = "file-ico";

                    const img = document.createElement("img");
                    img.src = resolveFileIcon(it);
                    img.alt = "파일";
                    ico.appendChild(img);

                    const name = document.createElement("div");
                    name.className = "file-name";
                    name.textContent = safe(it.name || ("file-" + it.id));

                    const size = document.createElement("div");
                    size.className = "file-size";
                    size.textContent = it.size != null ? humanBytes(it.size) : "";

                    const meta = document.createElement("div");
                    meta.className = "trash-meta";
                    meta.textContent = `삭제됨 · ${fmtDate(it.deletedAt) || "-"}`;

                    card.appendChild(ico);
                    card.appendChild(name);
                    card.appendChild(size);
                    card.appendChild(meta);
                }

                // 클릭: PRVT 멀티 / DEPT 단일(batch)
                card.addEventListener("click", (e) => {
                    e.stopPropagation();

                    if (SCOPE === "PRVT") {
                        const cards = Array.from(el.grid.querySelectorAll(".folder-card, .file-card"));
                        const myIdx = cards.indexOf(card);

                        const isToggle = e.ctrlKey || e.metaKey;
                        const isRange = e.shiftKey;

                        if (!isToggle && !isRange) {
                            state.selectedKeys.clear();
                            cards.forEach(c => c.classList.remove("selected"));
                        }

                        if (isRange && state.lastClickedIndex != null) {
                            const [a, b] = [state.lastClickedIndex, myIdx].sort((x, y) => x - y);
                            for (let i = a; i <= b; i++) {
                                const c = cards[i];
                                if (!c) continue;
                                c.classList.add("selected");
                                state.selectedKeys.add(c.dataset.key);
                            }
                        } else {
                            if (card.classList.contains("selected")) {
                                card.classList.remove("selected");
                                state.selectedKeys.delete(key);
                            } else {
                                card.classList.add("selected");
                                state.selectedKeys.add(key);
                            }
                        }

                        state.lastClickedIndex = myIdx;
                        updateTrashActionButtons();
                        return;
                    }

                    // DEPT: batch 단일 선택
                    selectCard(card, batchId);
                });

                // DEPT만 더블클릭 복구
                card.addEventListener("dblclick", async () => {
                    if (SCOPE === "PRVT") return;
                    if (!batchId) return;
                    await restoreBatch(batchId);
                });

                el.grid.appendChild(card);
            });

            updateTrashActionButtons();
        }

        /* =========================================================
           4) API ACTIONS
        ========================================================= */
        async function loadTrash() {
            const items = await apiJson(`/api/v1/cloud/trash?scope=${encodeURIComponent(SCOPE)}&limit=200&offset=0`);
            const arr =
                Array.isArray(items) ? items :
                    Array.isArray(items?.content) ? items.content :
                        Array.isArray(items?.list) ? items.list :
                            [];
            render(arr);
        }

        async function restoreBatch(batchId) {
            if (!batchId) return;
            if (!confirm("삭제한 파일을 복구할까요?")) return;

            await apiJson(`/api/v1/cloud/trash/restore/${encodeURIComponent(batchId)}?scope=${encodeURIComponent(SCOPE)}`, {
                method: "POST"
            });

            await loadTrash();
            alert("복구 완료!");
        }

        async function purgeSelectedPrvt() {
            if (SCOPE !== "PRVT") return;

            const keys = Array.from(state.selectedKeys);
            if (keys.length === 0) return alert("삭제할 항목을 선택해주세요.");

            const items = keys
                .map(k => state.itemByKey.get(k))
                .filter(Boolean)
                .map(it => ({ type: String(it.type || "").toUpperCase(), id: it.id }))
                .filter(x => x.id != null);

            if (items.length === 0) return alert("선택 항목의 id가 없어 삭제할 수 없습니다.");

            if (!confirm(`선택한 ${items.length}개를 영구 삭제할까요?\n(되돌릴 수 없습니다)`)) return;

            await apiJson(PURGE_SELECTED_ENDPOINT, {
                method: "POST",
                body: JSON.stringify({ items }),
            });

            await loadTrash();
            alert("선택 삭제 완료!");
        }

        /* =========================================================
           5) BINDINGS
        ========================================================= */
        el.btnPurgeSelected?.addEventListener("click", () => {
            purgeSelectedPrvt().catch(e => alert(e.message));
        });

        el.btnReload?.addEventListener("click", () => {
            loadTrash().catch(e => alert(e.message));
        });

        el.btnEmpty?.addEventListener("click", async () => {
            if (SCOPE !== "PRVT") return;
            if (!confirm("휴지통을 비울까요?")) return;

            try {
                await apiJson(`/api/v1/cloud/trash/empty/prvt`, { method: "POST" });
                await loadTrash();
                alert("휴지통 비우기 완료!");
            } catch (e) {
                alert(e.message);
            }
        });

        function bindTrashGridContextMenu() {
            el.grid?.addEventListener("contextmenu", (e) => {
                const cardEl = e.target.closest(".folder-card, .file-card");
                if (!cardEl || !el.grid.contains(cardEl)) return;

                e.preventDefault();
                e.stopPropagation();

                let batchId = (cardEl.dataset.batchId || "").trim();
                const item = state.itemByKey.get(cardEl.dataset.key) || null;

                if (!batchId && item) {
                    batchId = getBatchId(item);
                    cardEl.dataset.batchId = batchId || "";
                }

                if (SCOPE === "PRVT") {
                    // 우클릭한 항목만 단일 선택
                    state.selectedKeys.clear();
                    state.lastClickedIndex = null;
                    el.grid.querySelectorAll(".selected").forEach(x => x.classList.remove("selected"));

                    cardEl.classList.add("selected");
                    state.selectedKeys.add(cardEl.dataset.key);
                    updateTrashActionButtons();
                } else {
                    selectCard(cardEl, batchId);
                }

                openTrashCtx(e.clientX, e.clientY, item || {}, batchId);
            }, { capture: true });
        }

        window.addEventListener("DOMContentLoaded", () => {
            bindTrashGridContextMenu();
            loadTrash().catch(e => alert(e.message));
        });
    </script>
</th:block>
