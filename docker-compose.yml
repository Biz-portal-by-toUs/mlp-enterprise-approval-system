version: '3.8'

services:
  # MySQL 설정
  mysql:
    image: mysql:8.0
    container_name: my_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}  # 루트 비밀번호
      MYSQL_DATABASE: bizportal    # 초기 생성 데이터베이스
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  # MongoDB 설정
  mongodb:
    image: mongo:latest
    container_name: my_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db

  # Redis 설정
  redis:
    image: redis:latest
    container_name: my_redis
    restart: always
    ports:
      - "6379:6379"