<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Bizportal - 부서 수정</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* ✅ 페이지 스코프 */
            .dept-edit-page{
                width:min(1100px, 100%);
                margin:0 auto;
                padding: 0 26px;
            }

            .dept-edit-page .page-kicker{
                font-size:14px;
                color:var(--muted);
                margin: 6px 0 10px;
                font-weight:800;
            }
            .dept-edit-page .page-title{
                font-size:34px;
                font-weight:900;
                margin: 0 0 22px;
                letter-spacing:-.2px;
            }
            .dept-edit-page .section-title{
                font-size:22px;
                font-weight:900;
                margin: 0 0 14px;
            }

            .dept-edit-page .card{
                background: var(--white);
                border: 1px solid var(--line);
                border-radius: 18px;
                padding: 26px;
                box-shadow: 0 10px 24px rgba(17,24,39,.06);
            }

            /* ✅ 회색 바탕 제거 + 세로 1열 폼 */
            .dept-edit-page .form-grid{
                display:grid;
                grid-template-columns: 1fr;
                gap:18px;
            }

            .dept-edit-page .field{ margin:0; }
            .dept-edit-page .label{
                font-weight:900;
                margin-bottom:10px;
                font-size:14px;
            }

            .dept-edit-page .input{
                width:100%;
                height:48px;
                border-radius:12px;
                border:1px solid var(--line);
                padding:0 14px;
                font-size:14px;
                outline:none;
                background:#fff;
            }
            .dept-edit-page .input:focus{
                border-color: rgba(59,130,246,.55);
                box-shadow: 0 0 0 4px rgba(59,130,246,.12);
            }

            .dept-edit-page .hint{
                margin-top:8px;
                font-size:12px;
                color:var(--muted);
                font-weight:800;
            }

            .dept-edit-page .actions{
                display:flex;
                justify-content:flex-end;
                gap:10px;
                margin-top: 6px;
            }

            .dept-edit-page .btn{
                height:44px;
                min-width:110px;
                border:none;
                border-radius:12px;
                font-weight:900;
                cursor:pointer;
                padding:0 14px;
            }

            /* ✅ 취소: 흰색 + 검정 글자 */
            .dept-edit-page .btn.ghost{
                background:#fff;
                color:#111;
                border:1px solid rgba(17,24,39,.10);
                box-shadow:none;
            }

            /* ✅ 저장: 헤더색(= primary) */
            .dept-edit-page .btn.primary{
                background: var(--primary);
                color:#fff;
                box-shadow: 0 10px 22px rgba(59,130,246,.22);
            }
            .dept-edit-page .btn.primary:active{ transform: translateY(1px); }

            .dept-edit-page .msg{
                margin-top:14px;
                font-size:13px;
                display:none;
                font-weight:900;
            }
            .dept-edit-page .msg.ok{ color:#0f766e; }
            .dept-edit-page .msg.err{ color:#b91c1c; }
        </style>
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="page-with-subbar">
        <div th:replace="~{sidebar/admin-sidebar :: adminSidebar('dept')}"></div>

        <section class="dept-edit-page">

            <div class="card" style="margin-top: 30px">
                <div class="form-grid">
                    <input type="hidden" id="depNo" th:value="${depNo}" />

                    <div class="field">
                        <div class="label">부서 코드</div>
                        <input class="input" id="depId" maxlength="3" placeholder="예) A01" th:value="${depId}" />
                        <div class="hint">최대 3자</div>
                    </div>

                    <div class="field">
                        <div class="label">부서 이름</div>
                        <input class="input" id="depName" maxlength="10" placeholder="예) 인사팀" th:value="${depName}" />
                        <div class="hint">최대 10자</div>
                    </div>

                    <div class="actions">
                        <button class="btn ghost" type="button" onclick="location.href='/admin/departments/list'">취소</button>
                        <button class="btn primary" id="submitBtn" type="button">수정 완료</button>
                    </div>

                    <div id="resultMsg" class="msg"></div>
                </div>
            </div>
        </section>
    </div>
</th:block>

<th:block layout:fragment="pageScripts">
    <script>
        const API_URL = "/api/v1/admin/departments";
        const $ = (id) => document.getElementById(id);

        function showMsg(text, ok) {
            const el = $("resultMsg");
            if (!el) return;
            el.style.display = "block";
            el.className = "msg " + (ok ? "ok" : "err");
            el.textContent = text;

            clearTimeout(window.__msgTimer);
            window.__msgTimer = setTimeout(() => { el.style.display = "none"; }, 2800);
        }

        async function safeJson(res) {
            const ct = res.headers.get("content-type") || "";
            if (!ct.includes("application/json")) return {};
            try { return await res.json(); } catch { return {}; }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const btn = $("submitBtn");
            if (!btn) return;

            // ✅ [수정] async/await 패턴을 적용하여 일관성 있게 변경
            btn.addEventListener("click", async () => {
                const depNo = $("depNo")?.value;
                const depId = $("depId")?.value?.trim() || "";
                const depName = $("depName")?.value?.trim() || "";

                // 1. 유효성 검사 알림 (showMsg 대신 Alert.warning 사용)
                if (!depNo) {
                    await Alert.error("잘못된 접근입니다. (depNo 없음)");
                    return;
                }
                if (!depId) {
                    await Alert.warning("부서 코드를 입력해주세요.");
                    return;
                }
                if (depId.length > 3) {
                    await Alert.warning("부서 코드는 최대 3자입니다.");
                    return;
                }
                if (!depName) {
                    await Alert.warning("부서 이름을 입력해주세요.");
                    return;
                }
                if (depName.length > 10) {
                    await Alert.warning("부서 이름은 최대 10자입니다.");
                    return;
                }

                try {
                    const res = await fetch(`${API_URL}/${encodeURIComponent(depNo)}`, {
                        method: "PUT",
                        credentials: "include",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({ depId, depName })
                    });

                    if (res.status === 401) {
                        await Alert.error("로그인이 필요합니다. 다시 로그인 해주세요.");
                        return;
                    }
                    if (res.status === 403) {
                        await Alert.error("권한이 없습니다. (COM_ADMIN만 가능)");
                        return;
                    }

                    if (res.ok) {
                        // ✅ [핵심] 성공 알림창의 확인 버튼을 누를 때까지 기다린 후 목록 이동
                        await Alert.success("부서 정보가 수정되었습니다.");
                        window.location.href = "/admin/departments/list";
                        return;
                    }

                    const data = await safeJson(res);
                    await Alert.error(data?.message || "수정 실패");

                } catch (e) {
                    console.error(e);
                    await Alert.error("서버 통신 오류가 발생했습니다.");
                }
            });
        });
    </script>
</th:block>
</body>
</html>
