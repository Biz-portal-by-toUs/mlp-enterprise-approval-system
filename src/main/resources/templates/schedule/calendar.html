                    }

                    const start = new Date(info.date);
                    const end = new Date(start);
                    end.setMinutes(end.getMinutes() + 30);

                    openCreate({
                        anchorRect,
                        center:false,
                        prefill:{
                            allDay:false,
                            startAt: toDatetimeLocalValue(start),
                            endedAt: toDatetimeLocalValue(end),
                            scope:'PERSONAL'
                        }
                    });
                },

                eventClick: function(arg){
                    const ext = arg.event.extendedProps || {};
                    const anchorRect = arg.jsEvent ? rectFromMouseEvent(arg.jsEvent) : arg.el.getBoundingClientRect();
                    openDetail({ anchorRect, data: ext });
                },

                moreLinkClick: function(info){
                    info.jsEvent?.preventDefault?.();
                    const anchorRect =
                        info.moreEl?.getBoundingClientRect?.() ||
                        info.dayEl?.getBoundingClientRect?.() ||
                        rectFromMouseEvent(info.jsEvent);

                    const segs = info.allSegs || info.hiddenSegs || info.segs || [];
                    const items = segs.map(seg => {
                        const ev = seg.event;
                        const ext = ev.extendedProps || {};
                        const scope = ext.scope || 'PERSONAL';
                        const color = ext.color || scopeColor(scope);
                        return {
                            ...ext,
                            title: ev.title,
                            scope,
                            allDay: !!ev.allDay,
                            color,
                            timeText: seg.timeText || (ev.allDay ? 'all-day' : '')
                        };
                    });

                    const t = info.allDay ? '' : (' ' + pad(info.date.getHours()) + ':' + pad(info.date.getMinutes()));
                    openMore({ anchorRect, title: toDateKey(info.date) + t + ' 일정', items });
                    return 'none';
                },

                eventContent: function(arg) {
                    const ext = arg.event.extendedProps || {};
                    const isHoliday = !!ext.isHoliday;
                    const isMonthView = arg.view.type === 'dayGridMonth';

                    const color = '#ff0000'; // 빨간색 고정
                    const bgColor = isHoliday ? 'rgba(255, 0, 0, 0.1)' : hexToRgba(ext.color || '#f59e0b', 0.14);

                    // ✅ 공휴일이면 왼쪽 바 색상을 투명하게 처리
                    const barColor = isHoliday ? 'transparent' : (ext.color || '#f59e0b');

                    return {
                        html: `
            <div class="bp-event ${isHoliday ? 'holiday-label' : ''}"
                 style="--bpColor:${barColor}; --bpBg:${bgColor}; border:none;">
                <div class="bp-evt-title"
                     style="color:${isHoliday ? '#d32f2f' : 'inherit'}; font-weight:${isHoliday ? '900' : 'normal'}">
                    ${arg.event.title}
                </div>
            </div>`
                    };
                },

                eventDidMount: function(arg){
                    const ext = arg.event.extendedProps || {};
                    arg.el.setAttribute('data-event-id', String(ext.id || arg.event.id));
                }
            });

            mainCalendar.render();
            updateTitles();
        }

        /* =========================
           Save (create/edit)
        ========================= */

        let SAVE_IN_PROGRESS = false;

        function setSaveLoading(isLoading){
            const btn = document.getElementById('createSave');
            const cancel = document.getElementById('createCancel');
            const close = document.getElementById('createClose');

            btn.disabled = isLoading;
            cancel.disabled = isLoading;
            close.disabled = isLoading;

            btn.textContent = isLoading
                ? (editing ? '수정 중...' : '저장 중...')
                : (editing ? '수정' : 'Save');
        }

        async function onSave(){
            if (SAVE_IN_PROGRESS) return;

            SAVE_IN_PROGRESS = true;
            setSaveLoading(true);
            try {
                const title = titleInput.value.trim();

                if (!title) return alert('제목은 필수입니다.');
                if (title.length > TITLE_MAX){
                    toast(`제목은 최대 ${TITLE_MAX}자까지예요.`, 'warn');
                    return;
                }

                const contentTrim = (contentInput.value || '').trim();
                if (contentTrim.length > CONTENT_MAX){
                    toast(`내용 최대 ${CONTENT_MAX}자까지예요.`, 'warn');
                    return;
                }

                const scope = String(scopeSelect.value).toUpperCase();
                const allDay = allDaySelect.value === 'true';

                if (scope === 'COMPANY' && !isCompanyAdmin()){
                    return alert('회사 일정은 관리자만 등록/수정할 수 있어요.');
                }

                const payload = {
                    scope,
                    title,
                    content: (contentInput.value || '').trim() || null,
                    allDay
                };

                if (allDay){
                    const sd = startDateInput.value;
                    const ed = endDateInput.value || sd;
                    if (!sd) return alert('시작 일시는 필수입니다');
                    if (ed < sd) return alert('종료 일시는 시작 일시 이후여야 합니다');
                    payload.startDate = sd;
                    payload.endDate = ed;
                }else{
                    const sa = getDTValue(startDayInput, startHourSelect, startMinSelect);
                    const ea = getDTValue(endDayInput, endHourSelect, endMinSelect);

                    if (!sa || !ea) return alert('start/end 시간은 필수입니다');

                    // 최종 안전장치
                    const s = new Date(sa);
                    const e = new Date(ea);
                    if (e.getTime() <= s.getTime()) return alert('end는 start 이후만 가능합니다');

                    payload.startAt = sa;
                    payload.endedAt = ea;
                }

                try{
                    if (editing) await apiUpdate(editing.schNo, payload);
                    else await apiCreate(payload);

                    closeCreate();
                    mainCalendar.refetchEvents();
                    refreshMiniDots();
                }catch(e){
                    console.error(e);
                    alert(e.message);
                }
            }catch(e){
                console.error(e);
                alert(e.message);
            }finally{
                // ✅ 어떤 경우든 버튼/상태 복구
                SAVE_IN_PROGRESS = false;
                setSaveLoading(false);
            }
        }
        document.getElementById('createSave').addEventListener('click', safeClick(onSave));

        /* =========================
           Toolbar
        ========================= */
        document.getElementById('prevBtn').addEventListener('click', () => mainCalendar.prev());
        document.getElementById('nextBtn').addEventListener('click', () => mainCalendar.next());
        document.getElementById('todayBtn').addEventListener('click', () => mainCalendar.today());

        document.getElementById('viewGroup').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-view]');
            if (!btn) return;
            setActiveView(btn.dataset.view);
        });

        document.getElementById('weekStartSelect').addEventListener('change', (e) => {
            weekStart = e.target.value;
            mainCalendar.setOption('firstDay', weekStart === 'SUNDAY' ? 0 : 1);
            miniCalendar.setOption('firstDay', weekStart === 'SUNDAY' ? 0 : 1);
            mainCalendar.refetchEvents();
            refreshMiniDots();
        });

        document.getElementById('searchInput').addEventListener('input', () => mainCalendar.refetchEvents());

        // ✅ "+ 일정 추가하기"는 시간 자동 채움 X
        document.getElementById('openCreateBtn').addEventListener('click', () => {
            openCreate({
                center:true,
                prefill:{
                    allDay:false,
                    scope:'PERSONAL'
                }
            });
        });

        /* =========================
           Mini Calendar
        ========================= */
        function setMiniTitle(){
            const d = miniCalendar.getDate();
            const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
            document.getElementById('miniMonthTitle').textContent = monthNames[d.getMonth()] + ' ' + d.getFullYear();
        }

        async function refreshMiniDots(){
            if (!miniCalendar) return;

            const cur = miniCalendar.getDate();
            const baseDate = cur.getFullYear() + '-' + pad(cur.getMonth()+1) + '-01';
            const scopes = getSelectedScopes();

            const calls = scopes.map(s => apiGetItems({ scope:s, view:'MONTH', baseDate, weekStart }));
            const results = await Promise.allSettled(calls);

            const map = new Map();
            function mark(dateKey, scope){
                if (!map.has(dateKey)) map.set(dateKey, new Set());
                map.get(dateKey).add(scope);
            }

            results.forEach((r, idx) => {
                if (r.status !== 'fulfilled') return;
                const scope = scopes[idx];

                (r.value || []).forEach(it => {
                    const isAllDay = !!it.allDay;

                    if (isAllDay){
                        const sd = it.startDate || (it.startAt ? String(it.startAt).slice(0,10) : null);
                        const ed = it.endDate || (it.endedAt ? String(it.endedAt).slice(0,10) : sd);
                        if (!sd) return;

                        const start = new Date(sd);
                        const end = new Date(ed || sd);
                        for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
                            mark(toDateKey(d), scope);
                        }
                    }else{
                        const day = it.startAt ? String(it.startAt).slice(0,10) : null;
                        if (day) mark(day, scope);
                    }
                });
            });

            paintMiniDots(map);
        }

        function paintMiniDots(map){
            document.querySelectorAll('#miniCalendar .mini-dots').forEach(el => el.remove());

            const dayCells = document.querySelectorAll('#miniCalendar .fc-daygrid-day');
            dayCells.forEach(cell => {
                const dateStr = cell.getAttribute('data-date');
                if (!dateStr) return;

                const scopes = map.get(dateStr);
                if (!scopes || scopes.size === 0) return;

                const frame = cell.querySelector('.fc-daygrid-day-frame');
                if (!frame) return;

                const wrap = document.createElement('div');
                wrap.className = 'mini-dots';

                ['COMPANY','DEPARTMENT','PERSONAL'].forEach(sc => {
                    if (!scopes.has(sc)) return;
                    const dot = document.createElement('span');
                    dot.className = 'mini-dot';
                    dot.style.background = scopeColor(sc);
                    wrap.appendChild(dot);
                });

                frame.appendChild(wrap);
            });
        }

        function buildMiniCalendar(){
            miniCalendar = new FullCalendar.Calendar(document.getElementById('miniCalendar'), {
                initialView: 'dayGridMonth',
                headerToolbar: false,
                height: 'auto',
                fixedWeekCount: false,
                firstDay: (weekStart === 'SUNDAY') ? 0 : 1,

                dayHeaderFormat: { weekday: 'short' },

                datesSet: function(){
                    setMiniTitle();
                    refreshMiniDots();
                },

                dateClick: function(info){
                    mainCalendar.gotoDate(info.date);
                    mainCalendar.refetchEvents();
                }
            });

            miniCalendar.render();
            setMiniTitle();
        }

        document.getElementById('miniPrevBtn').addEventListener('click', () => miniCalendar.prev());
        document.getElementById('miniNextBtn').addEventListener('click', () => miniCalendar.next());

        /* =========================
           Toggles wiring
        ========================= */
        const tgCompany = document.getElementById('tgCompany');
        const tgDept = document.getElementById('tgDept');
        const tgPersonal = document.getElementById('tgPersonal');

        function bindToggle(el, scope){
            el.addEventListener('click', (e) => {
                e.preventDefault(); e.stopPropagation();
                const on = !el.classList.contains('on');
                setSwitch(el, on);
                toggleScope(scope, on);
            });
        }
        bindToggle(tgCompany, 'COMPANY');
        bindToggle(tgDept, 'DEPARTMENT');
        bindToggle(tgPersonal, 'PERSONAL');

        /* =========================
           Title click -> month picker
        ========================= */
        document.getElementById('mainTitle').addEventListener('click', (e) => {
            e.preventDefault(); e.stopPropagation();
            openMonthPicker('MAIN');
        });
        document.getElementById('miniMonthTitle').addEventListener('click', (e) => {
            e.preventDefault(); e.stopPropagation();
            openMonthPicker('MINI');
        });

        /* =========================
           Init
        ========================= */
        (async function init(){
            await loadMe();

            initTimeSelects();
            bindRangeControls(); // ✅ 중요: 시간/날짜 제한 이벤트 바인딩
            bindAllDayRangeControls();

            resetCreateForm();

            buildMainCalendar();
            setTimeout(() => {
                buildMiniCalendar();
            }, 200);
            buildMiniCalendar();

            setActiveView('WEEK');
// ✅ 첫 로딩 후 이벤트 받아온 다음 상세 오픈 시도 (몇 번 재시도)
            let tries = 0;
            const t = setInterval(() => {
                tries++;
                const ok = openDetailFromQueryWithGoto();
                if (ok || tries >= 10) clearInterval(t);
            }, 200);

            setSwitch(tgCompany, true);
            setSwitch(tgDept, true);
            setSwitch(tgPersonal, true);

            refreshMiniDots();

            try{
                bindTodoUI();
                await todoReload();
            }catch(e){
                console.warn('Todo init failed:', e);
            }
        })();
        // ✅ 현재 화면에서 events를 한 번 읽어서 schNo/scope 매칭되는 이벤트 찾아 상세 오픈
        function getQueryParams(){
            const p = new URLSearchParams(location.search);
            return {
                open: p.get('open'),
                schNo: p.get('schNo'),
                scope: (p.get('scope') || '').toUpperCase()
            };
        }

        function centerRect(){
            const x = window.innerWidth/2, y = window.innerHeight/2;
            return { left:x, right:x, top:y, bottom:y };
        }

        function getEventStartKey(ext){
            // allDay면 startDate 우선, 아니면 startAt
            const s = ext.allDay
                ? (ext.startDate || (ext.startAt ? String(ext.startAt).slice(0,10) : null))
                : (ext.startAt || null);

            if (!s) return null;
            // 'YYYY-MM-DD' 또는 'YYYY-MM-DDTHH:mm'
            return String(s).slice(0,10);
        }

        // ✅ schNo/scope 이벤트 찾기
        function findEventByQuery(q){
            const events = mainCalendar?.getEvents?.() || [];
            const targetScope = q.scope || null;

            return events.find(ev => {
                const ext = ev.extendedProps || {};
                const schNoOk = String(ext.schNo) === String(q.schNo);
                const scopeOk = !targetScope || String(ext.scope || '').toUpperCase() === targetScope;
                return schNoOk && scopeOk;
            }) || null;
        }

        // ✅ 날짜 이동 + 상세 열기 (1회 성공하면 URL 정리)
        function openDetailFromQueryWithGoto(){
            const q = getQueryParams();
            if (q.open !== '1' || !q.schNo) return false;

            const found = findEventByQuery(q);
            if (!found) return false;

            const ext = found.extendedProps || {};
            const dateKey = getEventStartKey(ext);

            // 1) 해당 날짜로 이동
            if (dateKey){
                mainCalendar.gotoDate(dateKey);
            }

            // 2) 이동 후 events가 바뀔 수 있으니 한 번 refetch하고 다시 찾아서 상세 오픈
            mainCalendar.refetchEvents();

            setTimeout(() => {
                const again = findEventByQuery(q) || found;
                const ext2 = again.extendedProps || ext;
                openDetail({ anchorRect: centerRect(), data: ext2 });

                // ✅ 새로고침 시 또 열리는 거 방지: 파라미터 제거
                const url = new URL(location.href);
                url.searchParams.delete('open');
                url.searchParams.delete('schNo');
                url.searchParams.delete('scope');
                history.replaceState({}, '', url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : ''));
            }, 250);

            return true;
        }
    </script>
