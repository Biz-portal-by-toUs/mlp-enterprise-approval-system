<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bizportal - Verify Company</title>
    <style>
        :root {
            --bg: #f3f3f3;
            --text: #111;
            --border: #d7d7d7;
            --primary: #2f66d7;
            --input-bg: #fff;
            --error: #e74c3c;
            --errorBg: #f8d7da;
            --success: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo",
            "Noto Sans KR", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* 공통 페이지 레이아웃: 검정 테두리 및 마진 */
        .page {
            min-height: 100vh;
            border: 2px solid #222;
            margin: 12px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .card {
            width: min(560px, 92vw);
            text-align: center;
            padding: 40px 24px;
        }

        .title {
            font-size: 52px;
            font-weight: 900;
            margin: 0 0 12px;
            letter-spacing: -0.5px;
        }

        .desc {
            margin: 0 0 32px;
            color: #555;
            font-weight: 600;
            font-size: 15px;
        }

        /* 폼 스타일 */
        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .label {
            font-size: 13px;
            font-weight: 800;
            color: #777;
            margin: 0 0 8px 10px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        /* 입력 박스 스타일 통일 */
        .input-wrap {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            transition: border-color 0.2s;
            min-height: 54px;
        }

        .input-wrap:focus-within {
            border-color: var(--primary);
        }

        input {
            border: 0;
            outline: none;
            width: 100%;
            font-size: 16px;
            background: transparent;
            font-weight: 500;
        }

        /* 버튼 스타일 */
        .btn-primary {
            appearance: none;
            border: 0;
            background: var(--primary);
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 17px;
            transition: opacity 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* 메시지 스타일 */
        .msg {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            display: none;
            text-align: left;
        }

        .msg.bad {
            display: block;
            color: var(--error);
            border: 1px solid rgba(231, 76, 60, 0.2);
            background-color: var(--errorBg);
        }

        .msg.ok {
            display: block;
            color: var(--success);
            border: 1px solid rgba(22, 163, 74, 0.2);
            background-color: #eaf7ef;
        }

        @media (max-width: 768px) {
            .title { font-size: 40px; }
        }
    </style>
</head>
<body>
<div class="page">
    <div th:replace="~{company/common/company-header :: companyHeader}"></div>

    <main>
        <section class="card">
            <h1 class="title">Verify</h1>
            <p class="desc">비밀번호 변경을 위해 회사 정보를 인증해 주세요.</p>

            <form id="verifyForm" class="form" autocomplete="off">
                <div class="field">
                    <div class="label">Email Address</div>
                    <div class="input-wrap">
                        <input id="email" name="email" type="email" placeholder="admin@company.com" maxlength="50" required />
                    </div>
                </div>

                <div class="field">
                    <div class="label">Business Registration Number (BRN)</div>
                    <div class="input-wrap">
                        <input id="brn" name="brn" type="text" placeholder="사업자등록번호 숫자 10자리" inputmode="numeric" maxlength="20" required />
                    </div>
                </div>

                <button id="verifyBtn" class="btn-primary" type="submit">인증하기</button>
            </form>

            <div id="msg" class="msg"></div>
        </section>
    </main>
</div>

<script>
    const VERIFY_URL = "/auth/verify/company";
    const SS_SUBJECT_ID_KEY = "companyPwSubjectId";
    const SS_SUBJECT_TYPE_KEY = "companyPwSubjectType";
    const COMPANY_TYPE = "COMPANY";

    function showMsg(text, ok) {
        const el = document.getElementById("msg");
        el.textContent = text;
        el.className = "msg " + (ok ? "ok" : "bad");
    }

    function isValidEmail(email){
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    document.getElementById("verifyForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const brn = document.getElementById("brn").value.trim();

        if (!email) return showMsg("이메일을 입력해주세요.", false);
        if (!isValidEmail(email)) return showMsg("이메일 형식이 올바르지 않습니다.", false);
        if (!brn) return showMsg("사업자등록번호를 입력해주세요.", false);

        try {
            const res = await fetch(VERIFY_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, brn })
            });

            if (!res.ok) {
                let err = "인증 실패";
                try {
                    const data = await res.json();
                    err = data.message || err;
                } catch(e) {}
                showMsg(err, false);
                return;
            }

            const data = await res.json();
            const subjectId =
                data?.subjectId ??
                data?.SubjectId ??
                data?.data?.subjectId ??
                data?.data?.SubjectId ??
                data?.result?.subjectId ??
                data?.result?.SubjectId ??
                data?.comNo ??
                data?.empNo;

            if (subjectId === null || subjectId === undefined) {
                showMsg("인증 응답에 식별 정보가 없습니다.", false);
                return;
            }

            // ✅ 인증 정보 저장
            sessionStorage.setItem(SS_SUBJECT_ID_KEY, String(subjectId));
            sessionStorage.setItem(SS_SUBJECT_TYPE_KEY, COMPANY_TYPE);

            showMsg("인증 성공! 비밀번호 변경 페이지로 이동합니다.", true);
            setTimeout(() => location.href = "/auth/companies/password", 800);

        } catch (e) {
            showMsg("요청 실패: " + e.message, false);
        }
    });
</script>
</body>
</html>
