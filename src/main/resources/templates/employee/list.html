<!-- templates/employee/list.html -->
<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>사원 관리</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* 페이지 타이틀 */
            .page-title{
                font-size:28px;
                font-weight:900;
                margin:4px 0 6px;
                letter-spacing:-.2px;
            }
            .page-sub{
                margin:0 0 16px;
                color:var(--muted);
                font-weight:700;
            }

            /* 컨텐츠 카드 */
            .card{
                background:var(--white);
                border:1px solid var(--line);
                border-radius:18px;
                box-shadow: var(--shadow2);
            }
            .card.pad{ padding:18px; }

            /* 관리자 서브바 레이아웃 */
            .admin-page{ display:block; }

            /* 필터 */
            .filter{
                padding:18px;
                display:grid;
                gap:14px;
            }
            .filter-grid{
                display:grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap:14px;
            }
            .field{ display:flex; flex-direction:column; gap:8px; }
            .label{ font-size:13px; font-weight:900; color:#111827; }
            .control{
                height:42px;
                border-radius:12px;
                border:1px solid var(--line);
                padding:0 12px;
                outline:none;
                background:#fff;
                font-size:14px;
            }
            .control:focus{
                border-color: rgba(59,130,246,.55);
                box-shadow: 0 0 0 4px rgba(59,130,246,.12);
            }

            .search-row{
                display:flex;
                gap:12px;
                align-items:flex-end;
            }
            .search-row .search-field{ flex:1; }

            .btns{
                display:flex;
                gap:10px;
                align-items:center;
                flex-wrap:wrap;
            }
            .btn{
                height:42px;
                min-width:110px;
                border:0;
                border-radius:12px;
                font-weight:900;
                cursor:pointer;
                padding:0 14px;
            }
            .btn.primary{
                background:var(--primary);
                color:#fff;
            }
            .btn.ghost{
                background: rgba(59,130,246,.10);
                color: var(--primary);
                border:1px solid rgba(59,130,246,.18);
            }

            /* ===== ✅ 테이블(회의 목록 느낌 + 상단 둥글게) ===== */
            .table-wrap{
                padding:0;           /* ✅ 기존 18px 제거 */
                border-radius:18px;  /* ✅ */
                overflow:hidden;     /* ✅ 헤더 배경도 같이 둥글게 */
            }

            table{
                width:100%;
                border-collapse:separate;
                border-spacing:0;
                table-layout:fixed;
                border-radius:18px;
                overflow:hidden;
            }
            thead th{
                text-align:center;
                font-size:13px;      /* ✅ 살짝 키움 */
                color:#374151;
                background:#f8fafc;
                padding:16px 12px;   /* ✅ 여백 키움 */
                border-bottom:1px solid rgba(17,24,39,.08);
                white-space:nowrap;
            }
            tbody td{
                text-align:center;
                padding:16px 12px;   /* ✅ 여백 키움 */
                border-bottom:1px solid rgba(17,24,39,.06);
                font-size:14px;
                overflow:hidden;
                text-overflow:ellipsis;
                white-space:nowrap;
            }
            tbody tr:hover td{
                background: rgba(59,130,246,.03);
            }

            .link{
                color: var(--primary2);
                font-weight:900;
                text-decoration:none;
            }

            /* ✅ 비어있을 때 테이블 안 가운데 문구 */
            tbody tr.empty-row td{
                border-bottom:0;
                padding:52px 12px;
                color:var(--muted);
                font-weight:900;
                text-align:center;
                background:#fff;
            }

            /* pager (slightly smaller) */
            .pager{
                display:flex;
                justify-content:center;
                align-items:center;
                gap:9px;
                padding:12px 0 6px;
                user-select:none;
            }

            .page-btn{
                width:40px;
                height:40px;

                display:flex;
                align-items:center;
                justify-content:center;

                border-radius:12px;
                border:1px solid rgba(17,24,39,.10);
                background:#fff;
                box-shadow: 0 5px 10px rgba(0,0,0,.06);

                font-weight:900;
                font-size:15px;
                cursor:pointer;

                transition: transform .08s ease, box-shadow .12s ease, background .12s ease;
            }

            .page-btn:hover{
                transform: translateY(-1px);
                box-shadow: 0 7px 12px rgba(0,0,0,.08);
            }

            .page-btn.active{
                background: var(--primary2);
                border-color: rgba(59,130,246,.35);
                color:#fff;
            }

            .page-btn.icon{
                font-size:17px; /* << < > >> */
                color:#9ca3af;
            }

            .page-btn.disabled{
                opacity:.45;
                cursor:not-allowed;
                pointer-events:none;
                box-shadow:none;
                transform:none;
            }

            @media (max-width: 600px){
                .pager{ gap:8px; }
                .page-btn{
                    width:36px;
                    height:36px;
                    border-radius:11px;
                    font-size:14px;
                }
                .page-btn.icon{ font-size:16px; }
            }

            /* toast */


            @media (max-width: 980px){
                .filter-grid{ grid-template-columns:1fr; }
                .search-row{ flex-direction:column; align-items:stretch; }
                .btns{ justify-content:flex-end; }
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <section class="page-with-subbar">
        <aside th:replace="~{sidebar/admin-sidebar :: adminSidebar('emp')}"></aside>

        <div class="admin-page">

            <!-- Filter card -->
            <div class="card" style="margin-top:30px;">
                <div class="filter">
                    <div class="filter-grid">
                        <div class="field">
                            <div class="label">부서</div>
                            <select id="depSelect" class="control">
                                <option value="">전체</option>
                            </select>
                        </div>

                        <div class="field">
                            <div class="label">직급</div>
                            <select id="posSelect" class="control">
                                <option value="">전체</option>
                            </select>
                        </div>

                        <div class="field">
                            <div class="label">상태</div>
                            <select id="statusSelect" class="control">
                                <option value="">전체</option>
                                <option value="active">재직</option>
                                <option value="retired">퇴직</option>
                            </select>
                        </div>
                    </div>

                    <div class="search-row">
                        <div class="field search-field">
                            <div class="label">검색</div>
                            <input id="keywordInput" class="control" type="text" placeholder="이름/사번 (키워드)" />
                        </div>

                        <div class="btns">
                            <button class="btn primary" type="button" onclick="onSearch()">조회</button>
                            <button class="btn ghost" type="button" onclick="location.href='/admin/employees/create'">사원 등록</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card" style="margin-top:14px;">
                <div class="table-wrap">
                    <table>
                        <colgroup>
                            <col style="width:14%;">
                            <col style="width:14%;">
                            <col style="width:14%;">
                            <col style="width:14%;">
                            <col style="width:12%;">
                            <col style="width:22%;">
                            <col style="width:10%;">
                        </colgroup>
                        <thead>
                        <tr>
                            <th>사번</th>
                            <th>이름</th>
                            <th>부서</th>
                            <th>직급</th>
                            <th>상태</th>
                            <th>이메일</th>
                            <th>관리</th>
                        </tr>
                        </thead>
                        <tbody id="empTbody"></tbody>
                    </table>

                    <div id="pager" class="pager"></div>
                </div>
            </div>

        </div>
    </section>

</div>

<th:block layout:fragment="pageScripts">
    <script>
        const API = {
            employees: "/api/v1/admin/employees",
            departments: "/api/v1/departments",
            positions: "/api/v1/positions"
        };

        const state = {
            allEmployees: [],
            page: 1,
            pageSize: 8
        };

        // ===== Toast =====
        let toastTimer = null;
        function showToast(text, isErr){
            const el = document.getElementById("toast");
            el.className = "toast" + (isErr ? " err" : "");
            el.textContent = text;
            el.classList.add("show");
            if(toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(()=> el.classList.remove("show"), 1800);
        }

        // ===== XSS escape =====
        function esc(s){
            return String(s ?? "")
                .replaceAll("&","&amp;")
                .replaceAll("<","&lt;")
                .replaceAll(">","&gt;")
                .replaceAll("\"","&quot;")
                .replaceAll("'","&#039;");
        }

        // ✅ empty-row 렌더
        function renderEmptyRow(message){
            const tbody = document.getElementById("empTbody");
            tbody.innerHTML = `<tr class="empty-row"><td colspan="7">${esc(message)}</td></tr>`;
        }

        // ===== API fetch helper (cookie auth) =====
        async function apiFetch(url, options={}){
            const res = await fetch(url, {
                ...options,
                credentials: "include",
                headers: {
                    "Accept": "application/json",
                    ...(options.headers || {})
                }
            });

            if(res.status === 401){
                showToast("인증이 만료되었습니다. 다시 로그인 해주세요.", true);
                throw new Error("UNAUTHORIZED");
            }
            if(res.status === 403){
                showToast("권한이 없습니다. (COM_ADMIN만 가능)", true);
                throw new Error("FORBIDDEN");
            }
            return res;
        }

        // ===== dropdown load =====
        async function loadDepartments(){
            try{
                const res = await apiFetch(API.departments, { method:"GET", credentials: "include" });
                if(!res.ok) return;
                const json = await res.json().catch(()=> ({}));
                const list = json.data || [];
                const sel = document.getElementById("depSelect");
                sel.innerHTML = `<option value="">전체</option>`;
                list.forEach(d => {
                    const depNo = d.depNo ?? d.id ?? d.no;
                    const depName = d.depName ?? d.name ?? "";
                    if(depNo == null) return;
                    const opt = document.createElement("option");
                    opt.value = String(depNo);
                    opt.textContent = depName || `부서 ${depNo}`;
                    sel.appendChild(opt);
                });
            }catch(e){}
        }

        async function loadPositions(){
            try{
                const res = await apiFetch(API.positions, { method:"GET", credentials: "include" });
                if(!res.ok) return;
                const json = await res.json().catch(()=> ({}));
                const list = json.data || [];
                const sel = document.getElementById("posSelect");
                sel.innerHTML = `<option value="">전체</option>`;
                list.forEach(p => {
                    const posNo = p.posNo ?? p.id ?? p.no;
                    const posName = p.posName ?? p.name ?? "";
                    if(posNo == null) return;
                    const opt = document.createElement("option");
                    opt.value = String(posNo);
                    opt.textContent = posName || `직급 ${posNo}`;
                    sel.appendChild(opt);
                });
            }catch(e){}
        }

        // ===== employees =====
        function buildQuery(){
            const depNo = document.getElementById("depSelect").value;
            const posNo = document.getElementById("posSelect").value;
            const status = document.getElementById("statusSelect").value;
            const keyword = document.getElementById("keywordInput").value.trim();

            const q = new URLSearchParams();
            if(depNo) q.set("depNo", depNo);
            if(posNo) q.set("posNo", posNo);
            if(status) q.set("status", status);
            if(keyword) q.set("keyword", keyword);
            return q.toString();
        }

        async function loadEmployees(){
            const tbody = document.getElementById("empTbody");
            const pager = document.getElementById("pager");

            tbody.innerHTML = "";
            pager.innerHTML = "";

            try{
                const qs = buildQuery();
                const url = qs ? `${API.employees}?${qs}` : API.employees;

                const res = await apiFetch(url, { method:"GET" });
                if(!res.ok){
                    renderEmptyRow(`조회 중 오류가 발생했습니다. (${res.status})`);
                    return;
                }

                const json = await res.json().catch(()=> ({}));
                const list = json.data || [];
                state.allEmployees = list;
                state.page = 1;

                renderEmployees();
            }catch(e){
                if(String(e.message).includes("UNAUTHORIZED") || String(e.message).includes("FORBIDDEN")) return;
                renderEmptyRow("조회 중 예외가 발생했습니다.");
            }
        }

        function renderEmployees(){
            const tbody = document.getElementById("empTbody");
            const pager = document.getElementById("pager");

            const all = state.allEmployees || [];
            if(!all.length){
                renderEmptyRow("조회 결과가 없습니다.");
                pager.innerHTML = "";
                return;
            }

            const totalPages = Math.max(1, Math.ceil(all.length / state.pageSize));
            if(state.page > totalPages) state.page = totalPages;

            const start = (state.page - 1) * state.pageSize;
            const pageItems = all.slice(start, start + state.pageSize);

            tbody.innerHTML = "";
            pageItems.forEach(e => {
                const empNo = e.empNo ?? "";
                const empId = e.empId ?? "";
                const empName = e.empName ?? "";
                const depName = e.depName ?? "";
                const posName = e.posName ?? "";
                const email = e.email ?? "";
                const deleted = e.deleted ?? e.isDeleted ?? false;
                const statusLabel = deleted ? "퇴직" : "재직";

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${esc(empId)}</td>
                    <td>${esc(empName)}</td>
                    <td>${esc(depName)}</td>
                    <td>${esc(posName)}</td>
                    <td>${esc(statusLabel)}</td>
                    <td>${esc(email)}</td>
                    <td>
                        <a class="link" href="/admin/employees/${encodeURIComponent(empNo)}">상세</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // ===== pager (new: 5개씩 + << < > >>) =====
            pager.innerHTML = "";

            const windowSize = 5;
            const windowStart = Math.floor((state.page - 1) / windowSize) * windowSize + 1;
            const windowEnd = Math.min(totalPages, windowStart + windowSize - 1);

            function makeBtn(label, onClick, { active=false, disabled=false, icon=false } = {}){
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "page-btn"
                    + (active ? " active" : "")
                    + (icon ? " icon" : "")
                    + (disabled ? " disabled" : "");
                btn.textContent = label;
                if(!disabled) btn.addEventListener("click", onClick);
                return btn;
            }

            pager.appendChild(
                makeBtn("<<", ()=> { state.page = 1; renderEmployees(); }, { icon:true, disabled: state.page === 1 })
            );
            pager.appendChild(
                makeBtn("<", ()=> { state.page = Math.max(1, state.page - 1); renderEmployees(); }, { icon:true, disabled: state.page === 1 })
            );

            for(let i = windowStart; i <= windowEnd; i++){
                pager.appendChild(
                    makeBtn(String(i), ()=> { state.page = i; renderEmployees(); }, { active: i === state.page })
                );
            }

            pager.appendChild(
                makeBtn(">", ()=> { state.page = Math.min(totalPages, state.page + 1); renderEmployees(); }, { icon:true, disabled: state.page === totalPages })
            );
            pager.appendChild(
                makeBtn(">>", ()=> { state.page = totalPages; renderEmployees(); }, { icon:true, disabled: state.page === totalPages })
            );
        }

        function onSearch(){
            loadEmployees();
        }

        // 엔터로 검색(키워드 입력에서)
        document.addEventListener("keydown", (e)=>{
            if(e.key === "Enter"){
                const active = document.activeElement?.id;
                if(active === "keywordInput"){
                    onSearch();
                }
            }
        });

        // init
        (async function init(){
            await Promise.all([loadDepartments(), loadPositions()]);
            await loadEmployees();
        })();
    </script>
</th:block>

</body>
</html>
