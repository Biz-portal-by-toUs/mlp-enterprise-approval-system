<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>자유 게시판 목록</title>
    <link rel="stylesheet" th:href="@{/css/styles1.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .notice-table {
            width: 100%;
            border-collapse: collapse;
        }
        .notice-table th, .notice-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        .notice-table th {
            background-color: #f5f5f5;
        }
        .notice-table td.title {
            text-align: left;
        }
        .pagination {
            margin-top: 20px;
            text-align: center;
        }
        .pagination button {
            margin: 0 3px;
            padding: 6px 12px;
            cursor: pointer;
        }
        .pagination button.active {
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container notice-container">
    <h2>자유 게시판 목록</h2>

    <table class="notice-table">
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>등록일</th>
        </tr>
        </thead>
        <tbody id="boardTbody"></tbody>

    </table>

    <div class="pagination" id="pagination"></div>
</div>

<script>
    async function loadboards(page) {
        try {
            const response = await fetch(`/api/v1/boards-all?page=${page}`);
            const result = await response.json();

            const tbody = document.getElementById('boardTbody');
            tbody.innerHTML = '';

            if (result.status !== 200 || !result.data) {
                tbody.innerHTML = '<tr><td colspan="4">데이터 오류</td></tr>';
                return;
            }

            const pageData = result.data;
            const boards = pageData.content;

            if (boards.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">자유 게시판이 없습니다.</td></tr>';
                return;
            }

            boards.forEach((board, index) => {

                const createdAt = board.createdAt.substring(0, 10);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                <td>${board.boardNo}</td>
                <td class="title">
                    <a href="/boards/${board.boardNo}">
                        ${board.title}
                    </a>
                </td>
                <td>${board.empId}</td>
                <td>${createdAt}</td>
            `;
                tbody.appendChild(tr);
            });

            renderPagination(pageData);

        } catch (e) {
            document.getElementById('boardTbody').innerHTML =
                '<tr><td colspan="4">서버 오류가 발생했습니다.</td></tr>';
        }
    }

    function renderPagination(page) {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        // 이전
        if (page.number > 0) {
            const prev = document.createElement('button');
            prev.textContent = '이전';
            prev.onclick = () => loadboards(page.number - 1);
            pagination.appendChild(prev);
        }

        // 페이지 번호
        for (let i = 0; i < page.totalPages; i++) {
            const btn = document.createElement('button');
            btn.textContent = i + 1;

            if (i === page.number) {
                btn.classList.add('active');
            }

            btn.onclick = () => loadboards(i);
            pagination.appendChild(btn);
        }

        // 다음
        if (page.number < page.totalPages - 1 ) {
            const next = document.createElement('button');
            next.textContent = '다음';
            next.onclick = () => loadboards(page.number + 1);
            pagination.appendChild(next);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadboards(0);
    });

</script>

</body>
</html>
