<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bizportal - Main</title>
    <style>
        :root{
            --bg:#f3f3f3;
            --text:#111;
            --border:#d7d7d7;
            --primary:#2f66d7;
            --success:#16a34a;
            --successBorder: rgba(22,163,74,.35);
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo",
            "Noto Sans KR", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:var(--bg);
            color:var(--text);
        }
        .page{
            min-height:100vh;
            border:2px solid #222;
            margin:12px;
            background:var(--bg);
            display:flex;
            flex-direction:column;
        }

        /* 메인 영역 스타일 */
        main{
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }
        .card{
            width:min(720px, 92vw);
            text-align:center;
            padding:40px 24px;
        }
        .title{
            font-size:54px;
            font-weight:900;
            margin:0 0 12px;
            letter-spacing:-0.5px;
        }
        .desc{
            margin:0 0 28px;
            color:#555;
            font-weight:600;
        }
        .actions{
            display:flex;
            gap:12px;
            justify-content:center;
            flex-wrap:wrap;
        }
        .actions .btn{
            min-width:220px;
            padding:14px 18px;
            border-radius:12px;
        }

        /* 공통 버튼 스타일 (헤더와 공유) */
        .btn{
            appearance:none;
            border:1px solid var(--border);
            background:#fff;
            padding:10px 18px;
            border-radius:10px;
            font-weight:800;
            cursor:pointer;
            color:#222;
            transition: all 0.2s;
        }
        .btn.primary{
            border-color:var(--primary);
            background:var(--primary);
            color:#fff;
        }
        .who{
            font-weight:900;
            color:#333;
            padding:10px 14px;
            border:1px solid var(--border);
            background:#fff;
            border-radius:10px;
        }

        /* 토스트 알림 */
        .toast{
            position:fixed;
            left:50%;
            bottom:22px;
            transform:translateX(-50%);
            background:#fff;
            border:1px solid var(--border);
            color:#111;
            padding:12px 14px 12px 12px;
            border-radius:12px;
            font-weight:900;
            box-shadow: 0 10px 22px rgba(0,0,0,.10);
            z-index:9999;
            opacity:0;
            pointer-events:none;
            transition:opacity .15s ease, transform .15s ease;
            display:flex;
            align-items:center;
            gap:10px;
        }
        .toast::before{
            content:"";
            width:4px;
            height:18px;
            border-radius:999px;
            background:#bbb;
            flex:0 0 auto;
        }
        .toast.show{
            opacity:1;
            transform:translateX(-50%) translateY(-4px);
        }
        .toast.success{
            border-color: var(--successBorder);
            color: var(--success);
        }
        .toast.success::before{
            background: var(--success);
        }

        @media (max-width:768px){
            .title{font-size:40px}
        }
    </style>
</head>
<body>
<div class="page">
    <div th:replace="~{company/common/company-header :: companyHeader}"></div>

    <main>
        <section class="card">
            <h1 class="title" id="mainTitle">Welcome</h1>
            <p class="desc" id="mainDesc">Bizportal에 오신 것을 환영합니다. 로그인 유형을 선택해 주세요.</p>
            <div class="actions" id="mainActions"></div>
        </section>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
    // 전역 요소 참조 (헤더 navRight는 프래그먼트 내부에서 제어하므로 제외)
    const mainActions = document.getElementById('mainActions');
    const mainTitle = document.getElementById('mainTitle');
    const mainDesc = document.getElementById('mainDesc');
    const toastEl = document.getElementById('toast');

    // 이동 함수들
    function goCompanyLogin()  { window.location.href = '/auth/companies/login'; }
    function goEmployeeLogin() { window.location.href = '/auth/employee/login'; }
    function goCompanySignup() { window.location.href = '/auth/companies/signup'; }
    function goCompanyDashboard(){ window.location.href = '/company'; }

    // 토스트 표시 함수
    function showToast(message, type = 'success', ms = 1000) {
        toastEl.textContent = message;
        toastEl.classList.remove('success');
        if (type) toastEl.classList.add(type);
        toastEl.classList.add('show');
        window.setTimeout(() => toastEl.classList.remove('show'), ms);
    }

    // 로그아웃 처리
    async function doLogout() {
        try {
            await fetch('/auth/logout', { method: 'POST', credentials: 'include', cache: 'no-store' });
        } catch (e) {
            console.warn('logout request failed:', e);
        } finally {
            showToast('로그아웃 성공', 'success', 900);
            setTimeout(() => window.location.href = '/', 900);
        }
    }

    // 데이터 파싱 유틸리티
    function toStr(v){ return (v == null) ? '' : String(v).trim(); }
    function toUpper(v){ return toStr(v).toUpperCase(); }

    function parseBoolean(v){
        if (v === true) return true;
        if (v === false || v == null) return false;
        const s = toUpper(v);
        return s === 'TRUE' || s === '1' || s === 'Y' || s === 'YES';
    }

    function isCompanySubjectType(st){
        const t = toUpper(st);
        return t === 'COMPANY' || t.includes('COMPANY') || t.startsWith('COM');
    }

    // ✅ 로그아웃 상태일 때 메인 카드 렌더링
    function renderLoggedOut() {
        mainTitle.textContent = 'Welcome';
        mainDesc.textContent = 'Bizportal에 오신 것을 환영합니다. 로그인 유형을 선택해 주세요.';
        mainActions.innerHTML = `
            <button class="btn primary" type="button" id="btnCompanyMain">회사(기업) 로그인</button>
            <button class="btn" type="button" id="btnEmployeeMain">사원 로그인</button>
            <button class="btn" type="button" id="btnCompanySignupMain">회사 회원가입</button>
        `;
        document.getElementById('btnCompanyMain').addEventListener('click', goCompanyLogin);
        document.getElementById('btnEmployeeMain').addEventListener('click', goEmployeeLogin);
        document.getElementById('btnCompanySignupMain').addEventListener('click', goCompanySignup);
    }

    // ✅ 회사 로그인 상태일 때 메인 카드 렌더링
    function renderCompanyLoggedIn(username) {
        const whoLine = username ? `${username}이 로그인했습니다.` : '회사 계정이 로그인했습니다.';

        mainTitle.textContent = 'Hello';
        mainDesc.textContent = whoLine + ' 계속 진행해 주세요.';
        mainActions.innerHTML = `
            <button class="btn primary" type="button" id="btnDashboardMain">회사 대시보드로 이동</button>
            <button class="btn" type="button" id="btnEmployeeMain">사원 로그인 페이지로</button>
            <button class="btn" type="button" id="btnLogoutMain">로그아웃</button>
        `;
        document.getElementById('btnDashboardMain').addEventListener('click', goCompanyDashboard);
        document.getElementById('btnEmployeeMain').addEventListener('click', goEmployeeLogin);
        document.getElementById('btnLogoutMain').addEventListener('click', doLogout);
    }

    // API 응답 데이터 추출
    function extractData(json){
        if (!json || typeof json !== 'object') return null;
        return json.data ?? json.result ?? json.body ?? json.response ?? null;
    }

    // 내 정보 조회 API 호출
    async function fetchMe() {
        try {
            const res = await fetch('/auth/me', {
                method: 'GET',
                credentials: 'include',
                cache: 'no-store'
            });
            if (!res.ok) return null;

            const ct = res.headers.get('content-type') || '';
            if (!ct.includes('application/json')) return null;

            const json = await res.json().catch(() => null);
            return extractData(json);
        } catch (e) {
            return null;
        }
    }

    // 초기 구동 함수
    async function boot() {
        try {
            const me = await fetchMe();
            const authenticated = parseBoolean(me?.authenticated);
            const subjectType = me?.subjectType;
            const username = me?.username;

            // 회사 타입의 로그인인 경우에만 로그인 상태 UI 적용
            if (authenticated && isCompanySubjectType(subjectType)) {
                renderCompanyLoggedIn(username);
            } else {
                renderLoggedOut();
            }
        } catch (e) {
            console.warn('boot failed:', e);
            renderLoggedOut();
        }
    }

    // DOM 로드 완료 후 실행
    document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
