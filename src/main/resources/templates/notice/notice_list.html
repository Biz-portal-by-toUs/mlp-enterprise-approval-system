<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 목록</title>
    <link rel="stylesheet" th:href="@{/css/styles1.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .notice-container { padding: 16px; }
        .notice-table { width: 100%; border-collapse: collapse; }
        .notice-table th, .notice-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .notice-table th { background-color: #f5f5f5; }
        .notice-table td.title { text-align: left; }
        .pagination { margin-top: 20px; text-align: center; }
        .pagination button { margin: 0 3px; padding: 6px 12px; cursor: pointer; }
        .pagination button.active { background-color: #333; color: #fff; }

        .search-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin: 12px 0 16px;
            padding: 12px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            background: #fafafa;
        }
        .search-bar select,
        .search-bar input {
            padding: 8px;
            border: 1px solid #d6d6d6;
            border-radius: 8px;
            outline: none;
        }
        .search-bar button {
            padding: 8px 12px;
            border: 1px solid #d6d6d6;
            border-radius: 8px;
            cursor: pointer;
            background: #fff;
        }
        .search-hint { font-size: 12px; color: #666; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container notice-container">
    <h2>공지사항 목록</h2>
    <div class="top-bar">
        <a href="/reviews/form" class="btn btn-create">공지사항등록</a>
    </div>
    <!-- 검색창 -->
    <div class="search-bar">
        <select id="searchType">
            <option value="">전체</option>
            <option value="title">제목</option>
            <option value="writer">작성자</option>
            <option value="date">작성일</option>
        </select>

        <input id="keyword" type="text" placeholder="제목/작성자 검색어" />

        <input id="fromDate" type="date" class="hidden" />
        <span id="dateTilde" class="hidden">~</span>
        <input id="toDate" type="date" class="hidden" />

        <button type="button" onclick="applySearch()">검색</button>
        <button type="button" onclick="resetSearch()">초기화</button>

        <span class="search-hint" id="searchHint"></span>
    </div>

    <table class="notice-table">
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>등록일</th>
        </tr>
        </thead>
        <tbody id="noticeTbody"></tbody>
    </table>

    <div class="pagination" id="pagination"></div>
</div>

<script>
    const API_URL = "/api/v1/notices";
    const PAGE_SIZE = 10;

    // 현재 검색 상태(페이징 이동 시 유지)
    let currentQuery = {
        type: "",
        keyword: "",
        from: "",
        to: ""
    };

    function setDateInputsVisible(visible) {
        const from = document.getElementById("fromDate");
        const to = document.getElementById("toDate");
        const tilde = document.getElementById("dateTilde");
        const keyword = document.getElementById("keyword");

        if (visible) {
            from.classList.remove("hidden");
            to.classList.remove("hidden");
            tilde.classList.remove("hidden");
            keyword.classList.add("hidden");
        } else {
            from.classList.add("hidden");
            to.classList.add("hidden");
            tilde.classList.add("hidden");
            keyword.classList.remove("hidden");
        }
    }

    function updateHint() {
        const hint = document.getElementById("searchHint");
        if (!currentQuery.type) {
            hint.textContent = "전체 공지사항을 조회합니다.";
            return;
        }
        if (currentQuery.type === "title") hint.textContent = "제목에 포함된 키워드로 검색합니다.";
        if (currentQuery.type === "writer") hint.textContent = "작성자(empId)에 포함된 키워드로 검색합니다.";
        if (currentQuery.type === "date") hint.textContent = "작성일 범위(from~to)로 검색합니다.";
    }

    function buildUrl(page) {
        const params = new URLSearchParams();
        params.set("page", String(page));
        params.set("size", String(PAGE_SIZE));

        if (currentQuery.type) params.set("type", currentQuery.type);

        if (currentQuery.type === "title" || currentQuery.type === "writer") {
            if (currentQuery.keyword) params.set("keyword", currentQuery.keyword);
        }

        if (currentQuery.type === "date") {
            if (currentQuery.from) params.set("from", currentQuery.from);
            if (currentQuery.to) params.set("to", currentQuery.to);
        }

        return `${API_URL}?${params.toString()}`;
    }

    function applySearch() {
        const type = document.getElementById("searchType").value;
        const keyword = document.getElementById("keyword").value.trim();
        const from = document.getElementById("fromDate").value;
        const to = document.getElementById("toDate").value;

        currentQuery.type = type;
        currentQuery.keyword = keyword;
        currentQuery.from = from;
        currentQuery.to = to;

        updateHint();
        loadNotices(0);
    }

    function resetSearch() {
        document.getElementById("searchType").value = "";
        document.getElementById("keyword").value = "";
        document.getElementById("fromDate").value = "";
        document.getElementById("toDate").value = "";
        currentQuery = { type: "", keyword: "", from: "", to: "" };

        setDateInputsVisible(false);
        updateHint();
        loadNotices(0);
    }

    async function loadNotices(page) {
        const tbody = document.getElementById("noticeTbody");
        tbody.innerHTML = "";

        try {
            const url = buildUrl(page);
            const response = await fetch(url);
            const result = await response.json();

            // ResponseDto 형식: { status, message, data }
            if (!result || result.status !== 200 || !result.data) {
                tbody.innerHTML = `<tr><td colspan="4">데이터 오류</td></tr>`;
                document.getElementById("pagination").innerHTML = "";
                return;
            }

            const pageData = result.data;
            const notices = pageData.content || [];

            if (notices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4">공지사항이 없습니다.</td></tr>`;
                renderPagination(pageData);
                return;
            }

            notices.forEach((notice) => {
                const createdAt = notice.createdAt ? notice.createdAt.substring(0, 10) : "-";

                const tr = document.createElement("tr");
                tr.innerHTML = `
          <td>${notice.noticeNo}</td>
          <td class="title">
            <a href="/notice/${notice.noticeNo}">${notice.title}</a>
          </td>
          <td>${notice.empId ?? ""}</td>
          <td>${createdAt}</td>
        `;
                tbody.appendChild(tr);
            });

            renderPagination(pageData);

        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="4">서버 오류</td></tr>`;
            document.getElementById("pagination").innerHTML = "";
        }
    }

    function renderPagination(page) {
        const pagination = document.getElementById("pagination");
        pagination.innerHTML = "";

        if (!page) return;

        // 이전
        if (page.number > 0) {
            const prev = document.createElement("button");
            prev.textContent = "이전";
            prev.onclick = () => loadNotices(page.number - 1);
            pagination.appendChild(prev);
        }

        // 페이지 번호
        for (let i = 0; i < page.totalPages; i++) {
            const btn = document.createElement("button");
            btn.textContent = i + 1;
            if (i === page.number) btn.classList.add("active");
            btn.onclick = () => loadNotices(i);
            pagination.appendChild(btn);
        }

        // 다음
        if (page.number < page.totalPages - 1) {
            const next = document.createElement("button");
            next.textContent = "다음";
            next.onclick = () => loadNotices(page.number + 1);
            pagination.appendChild(next);
        }
    }

    // 검색 타입 변경 시 입력 UI 전환
    document.getElementById("searchType").addEventListener("change", (e) => {
        const type = e.target.value;

        // UI 초기화
        document.getElementById("keyword").value = "";
        document.getElementById("fromDate").value = "";
        document.getElementById("toDate").value = "";

        if (type === "date") {
            setDateInputsVisible(true);
        } else {
            setDateInputsVisible(false);
        }
    });

    // Enter 키로 검색
    document.getElementById("keyword").addEventListener("keydown", (e) => {
        if (e.key === "Enter") applySearch();
    });

    document.addEventListener("DOMContentLoaded", () => {
        setDateInputsVisible(false);
        updateHint();
        loadNotices(0);
    });
</script>

</body>
</html>
