<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Cloud</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* ✅ subbar 도킹 페이지처럼 padding 제거 */
            .content-wrap:has(.cloud-page) {
                padding: 0;
            }

            .cloud-page {
                height: calc(100vh - var(--topbar-h) - var(--footer-h));
                background: var(--bg);
            }

            .cloud-page .page-with-subbar {
                display: grid;
                grid-template-columns: 220px 1fr;
                min-height: calc(100vh - var(--topbar-h) - var(--footer-h));
            }

            /* ✅ subbar를 cloud 페이지에서만 flex column으로 */
            .cloud-page .subbar {
                display: flex;
                flex-direction: column;
            }

            .cloud-page .page-with-subbar > .subbar + * {
                padding: 0;
                min-width: 0;
            }

            /* ====== sidebar: 탭 ====== */
            .cloud-scope-tabs {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                padding: 10px 12px 12px;
                border-bottom: 1px solid rgba(59, 130, 246, .14);
                background: rgba(255, 255, 255, .30);
            }

            .cloud-scope-tab {
                height: 34px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 10px;
                text-decoration: none;
                font-weight: 900;
                font-size: 13px;
                color: #1d4ed8;
                background: rgba(59, 130, 246, .12);
                border: 1px solid rgba(59, 130, 246, .10);
            }

            .cloud-scope-tab:hover {
                background: rgba(59, 130, 246, .18);
            }

            .cloud-scope-tab.active {
                background: var(--primary);
                color: #fff;
                border-color: transparent;
            }

            .cloud-page .label {
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                min-width: 0;
            }

            .cloud-page .node,
            .cloud-page .file-node {
                min-width: 0;
            }

            /* ====== ✅ sidebar footer(휴지통) 고정 ====== */
            .cloud-subbar {
                display: flex;
                flex-direction: column;
                height: 100%;
                min-height: 0;
            }

            .cloud-tree-panel {
                flex: 1;
                overflow: auto;
                min-height: 0;
                padding: 10px 10px 12px;
            }

            .cloud-sidebar-footer {
                flex: 0 0 auto;
                padding: 10px 12px 12px;
                border-top: 1px solid rgba(59, 130, 246, .14);
                background: rgba(255, 255, 255, .30);
            }

            .cloud-footer-link {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 36px;
                border-radius: 10px;
                text-decoration: none;
                font-weight: 900;
                font-size: 13px;
                color: #1d4ed8;
                background: rgba(59, 130, 246, .12);
                border: 1px solid rgba(59, 130, 246, .10);
            }

            .cloud-footer-link:hover {
                background: rgba(59, 130, 246, .18);
            }

            /* ====== sidebar: 트리 ====== */
            .cloud-tree {
                list-style: none;
                margin: 0;
                padding: 0;
            }

            .cloud-tree li {
                list-style: none;
                margin: 0;
            }

            .cloud-tree .children {
                padding-left: 14px;
                margin: 0;
            }

            .cloud-page .node {
                display: grid;
                grid-template-columns: 12px 26px 1fr;
                align-items: center;
                gap: 1px;
                padding: 5px 5px;
                border-radius: 10px;
                cursor: pointer;
                color: rgba(31, 41, 55, .88);
                font-weight: 800;
                user-select: none;
            }

            .cloud-page .node > :nth-child(3) {
                margin-left: 3px;
            }

            .cloud-page .node:hover {
                background: rgba(59, 130, 246, .10);
            }

            .cloud-page .node.selected {
                background: rgba(59, 130, 246, .16);
                color: #1d4ed8;
            }

            .cloud-page .caret {
                font-size: 10px;
                opacity: .85;
            }

            .cloud-page .folder-ico {
                width: 30px;
                height: 30px;
                background: url("/images/icons/folder-small.png") center/contain no-repeat;
            }

            /* ====== 오른쪽(상단 바 + 본문) ====== */
            .cloud-main {
                display: flex;
                flex-direction: column;
                min-width: 0;
                background: var(--bg);
            }

            .cloud-topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 16px 18px;
                background: #fff;
                border-bottom: 1px solid rgba(17, 24, 39, .08);
            }

            .cloud-title {
                font-size: 24px;
                font-weight: 900;
                color: var(--text);
                margin: 0;
            }

            .cloud-actions {
                display: flex;
                gap: 10px;
                align-items: center;
            }

            .cloud-actions .btn {
                height: 34px;
                padding: 0 12px;
                border-radius: 10px;
                border: 1px solid rgba(17, 24, 39, .10);
                background: #fff;
                font-weight: 900;
                cursor: pointer;
                color: var(--text);
            }

            .cloud-actions .btn.primary {
                border: 0;
                background: var(--primary);
                color: #fff;
            }

            .cloud-actions .btn.primary:hover {
                background: var(--primary2);
            }

            .cloud-actions .btn:disabled {
                opacity: .5;
                cursor: not-allowed;
            }

            .cloud-body {
                flex: 1;
                overflow: auto;
                padding: 18px;
            }

            /* ====== 파일/폴더 영역 ====== */
            .file-grid {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-content: flex-start;
            }

            .folder-card, .file-card {
                width: 110px;
                padding: 8px 6px;
                border: 1px solid transparent;
                border-radius: 10px;
                background: transparent;
                text-align: center;
                cursor: pointer;
            }

            .folder-card:hover, .file-card:hover {
                background: rgba(59, 130, 246, .10);
                border-color: rgba(59, 130, 246, .18);
            }

            .file-card.selected {
                background: rgba(59, 130, 246, .16);
                border-color: rgba(59, 130, 246, .45);
            }

            .folder-card.drop {
                background: rgba(59, 130, 246, .10);
                border-color: rgba(59, 130, 246, .35);
            }

            .folder-ico-large, .file-ico {
                width: 84px;
                height: 84px;
                margin: 0 auto 6px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .folder-ico-large {
                background: url("/images/icons/folder-large.png") center/contain no-repeat;
            }

            .file-ico img {
                width: 180%;
                height: 180%;
                object-fit: contain;
                display: block;
            }

            .folder-name, .file-name {
                font-size: 12px;
                font-weight: 800;
                color: #111827;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .file-size {
                margin-top: 2px;
                font-size: 11px;
                color: var(--muted);
                font-weight: 700;
            }

            .file-name-edit {
                width: 100%;
                margin-top: 6px;
                font-size: 12px;
                padding: 5px 6px;
                border-radius: 8px;
                border: 1px solid rgba(17, 24, 39, .14);
                outline: none;
                background: #fff;
            }

            .empty {
                color: var(--muted);
                font-weight: 800;
                padding: 10px 0;
            }

            /* ====== ✅ 우클릭 컨텍스트 메뉴 ====== */
            .cloud-ctx {
                position: fixed;
                z-index: 9999;
                min-width: 170px;
                background: #fff;
                border: 1px solid rgba(17, 24, 39, .10);
                border-radius: 12px;
                box-shadow: 0 14px 30px rgba(0, 0, 0, .16);
                padding: 6px;
                display: none;
            }

            .cloud-ctx.open {
                display: block;
            }

            .cloud-ctx button {
                width: 100%;
                border: 0;
                background: transparent;
                text-align: left;
                padding: 10px 10px;
                border-radius: 10px;
                font-weight: 900;
                cursor: pointer;
                color: #111827;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
            }

            .cloud-ctx button:hover {
                background: rgba(59, 130, 246, .10);
            }

            .cloud-ctx button:disabled {
                opacity: .45;
                cursor: not-allowed;
            }

            .cloud-ctx .danger {
                color: #b91c1c;
            }

            .cloud-ctx .sep {
                height: 1px;
                background: rgba(17, 24, 39, .08);
                margin: 6px 4px;
                border-radius: 999px;
            }

            /* ✅ 트리 안 파일 노드 */
            .cloud-page .file-node {
                display: grid;
                grid-template-columns: 12px 26px 1fr;
                align-items: center;
                gap: 1px;
                padding: 5px 5px;
                border-radius: 10px;
                cursor: pointer;
                color: rgba(31, 41, 55, .88);
                font-weight: 800;
                user-select: none;
            }

            .cloud-page .file-node:hover {
                background: rgba(59, 130, 246, .10);
            }

            .cloud-page .file-node.selected {
                background: rgba(59, 130, 246, .16);
                color: #1d4ed8;
            }

            .cloud-page .file-ico-small {
                width: 22px;
                height: 22px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .cloud-page .file-ico-small img {
                width: 44px;
                height: 44px;
                object-fit: contain;
                display: block;
            }

            .cloud-page .node.drop {
                background: rgba(59, 130, 246, .10);
                border: 1px solid rgba(59, 130, 246, .35);
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content" class="cloud-page">
    <div class="page-with-subbar">

        <!-- ✅ 왼쪽 sidebar -->
        <th:block th:replace="~{sidebar/cloud-sidebar :: cloudSidebar(${active})}"></th:block>

        <!-- ✅ 오른쪽 -->
        <section class="cloud-main">
            <div class="cloud-topbar">
                <h1 class="cloud-title" id="breadcrumb"
                    th:text="${active}=='prvt' ? '개인함' : '공유함'">공유함</h1>

                <div class="cloud-actions">
                    <button class="btn primary" id="btnUpload">파일 업로드</button>
                    <button class="btn" id="btnDownload" disabled>파일 다운로드</button>
                    <button class="btn" id="btnDeleteFile" disabled>파일 삭제</button>
                    <input type="file" id="fileInput" multiple style="display:none"/>
                </div>
            </div>

            <div class="cloud-body">
                <div class="file-grid" id="fileGrid"></div>
            </div>
        </section>

    </div>

    <!-- ✅ 우클릭 메뉴 DOM -->
    <div class="cloud-ctx" id="cloudCtx" role="menu" aria-label="폴더 메뉴">
        <button type="button" id="ctxCreate" role="menuitem">
            <span id="ctxCreateLabel">폴더 생성</span>
            <span style="opacity:.6;font-weight:800;">+</span>
        </button>
        <div class="sep"></div>
        <button type="button" id="ctxRename" role="menuitem">이름 변경</button>
        <button type="button" id="ctxDelete" role="menuitem" class="danger">삭제</button>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:inline="javascript">
        /** ====== 상태 ====== */
        const state = {
            scope: /*[[${scope}]]*/ "dept",
            selectedFolderNo: null,
            selectedFolderName: null,
            selectedAttachmentId: null,

            ctxFolderNo: null,
            ctxFolderName: null,

            treeIndex: {
                nodeById: new Map(),
                caretById: new Map(),
                childrenById: new Map(),
                parentById: new Map(),
            },
        };

        /** ====== 엘리먼트 ====== */
        const el = {
            treeRoot: document.getElementById("treeRoot"),

            breadcrumb: document.getElementById("breadcrumb"),
            btnUpload: document.getElementById("btnUpload"),
            btnDownload: document.getElementById("btnDownload"),
            btnDeleteFile: document.getElementById("btnDeleteFile"),
            fileInput: document.getElementById("fileInput"),
            fileGrid: document.getElementById("fileGrid"),

            ctx: document.getElementById("cloudCtx"),
            ctxCreate: document.getElementById("ctxCreate"),
            ctxCreateLabel: document.getElementById("ctxCreateLabel"),
            ctxRename: document.getElementById("ctxRename"),
            ctxDelete: document.getElementById("ctxDelete"),
        };

        /** ====== fetch helper ====== */
        async function apiJson(url, opt = {}) {
            const res = await fetch(url, {
                credentials: "include",
                headers: {"Content-Type": "application/json", ...(opt.headers || {})},
                ...opt,
            });

            const text = await res.text();
            const json = text ? JSON.parse(text) : null;

            if (!res.ok) {
                const msg = json?.message || json?.error || res.statusText;
                throw new Error(msg);
            }
            return json && "data" in json ? json.data : json;
        }

        /** ====== URL helpers ====== */
        function folderBase() {
            return state.scope === "dept" ? "/api/v1/folders/dept" : "/api/v1/folders/prvt";
        }
        function folderListUrl(parentId) {
            const qs = parentId == null ? "" : `?parentId=${encodeURIComponent(parentId)}`;
            return folderBase() + qs;
        }
        function attachmentListUrl(folderNo) {
            return `/api/v1/attachments?domain=CLOUD&entityId=${encodeURIComponent(folderNo)}`;
        }

        const UPLOAD = {
            presign: "/api/v1/attachments/presign",
            complete: "/api/v1/attachments/complete",
        };

        /** ====== 유틸 ====== */
        function short20(name) {
            const s = String(name ?? "");
            return s.length > 20 ? s.slice(0, 20) + "…" : s;
        }
        function humanBytes(n) {
            if (n == null) return "";
            let v = Number(n);
            const units = ["B", "KB", "MB", "GB", "TB"];
            let i = 0;
            while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
            return `${v.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
        }
        function clearFileSelection() {
            state.selectedAttachmentId = null;
            document.querySelectorAll(".file-card.selected").forEach(x => x.classList.remove("selected"));
            el.btnDownload.disabled = true;
            el.btnDeleteFile.disabled = true;
        }

        /** ====== breadcrumb ====== */
        function setBreadcrumbFromNode(nodeEl) {
            const rootLabel = state.scope === "dept" ? "공유함" : "개인함";
            const folders = [];
            let cur = nodeEl;

            while (cur && cur.classList.contains("node")) {
                const name = cur.dataset.folderName;
                if (name) folders.push(name);
                cur = cur.parentElement?.parentElement?.parentElement?.querySelector(":scope > .node");
            }

            folders.reverse();
            el.breadcrumb.textContent = [rootLabel, ...folders].join(" > ");
        }

        /** ====== 오른쪽: 폴더/파일 렌더 ====== */
        async function loadFolderContent(folderNo) {
            el.fileGrid.innerHTML = "";
            clearFileSelection();
            if (!folderNo) return;

            const [folders, files] = await Promise.all([
                apiJson(folderListUrl(folderNo)),
                apiJson(attachmentListUrl(folderNo)),
            ]);

            const hasFolders = folders && folders.length > 0;
            const hasFiles = files && files.length > 0;

            if (!hasFolders && !hasFiles) {
                const div = document.createElement("div");
                div.className = "empty";
                div.textContent = "파일이 없습니다.";
                el.fileGrid.appendChild(div);
                return;
            }

            if (hasFolders) renderFolderCards(folders);
            if (hasFiles) renderFileCards(files);
        }

        function renderFolderCards(folders) {
            folders.forEach(f => {
                const card = document.createElement("div");
                card.className = "folder-card";
                card.dataset.folderNo = f.folderNo;

                const ico = document.createElement("div");
                ico.className = "folder-ico-large";

                const name = document.createElement("div");
                name.className = "folder-name";
                name.textContent = f.folderName;

                card.appendChild(ico);
                card.appendChild(name);

                card.addEventListener("click", async () => {
                    state.treeIndex.parentById.set(f.folderNo, state.selectedFolderNo);

                    state.selectedFolderNo = f.folderNo;
                    state.selectedFolderName = f.folderName;

                    await loadFolderContent(f.folderNo);
                    await syncTreeToFolder(f.folderNo);
                });

                card.addEventListener("dragover", (e) => { e.preventDefault(); card.classList.add("drop"); });
                card.addEventListener("dragleave", () => card.classList.remove("drop"));

                card.addEventListener("drop", async (e) => {
                    e.preventDefault();
                    card.classList.remove("drop");

                    const attachmentId = Number(e.dataTransfer.getData("text/plain"));
                    const dragScope = e.dataTransfer.getData("cloud-scope");
                    const fromFolderNoRaw = e.dataTransfer.getData("fromFolderNo");
                    const fromFolderNo = fromFolderNoRaw ? Number(fromFolderNoRaw) : null;

                    if (!attachmentId) return;

                    if (dragScope && dragScope !== state.scope) {
                        alert("공유함 파일은 공유함에서만, 개인함 파일은 개인함에서만 이동 가능합니다.");
                        return;
                    }

                    const toFolderNo = f.folderNo;

                    try {
                        await apiJson(`/api/v1/attachments/${attachmentId}/move?toFolderNo=${toFolderNo}`, {method: "POST"});
                        if (state.selectedFolderNo) await loadFolderContent(state.selectedFolderNo);
                        if (fromFolderNo != null) await refreshTreeChildren(fromFolderNo);
                        await refreshTreeChildren(toFolderNo);
                    } catch (err) {
                        alert(err.message);
                    }
                });

                el.fileGrid.appendChild(card);
            });
        }

        function renderFileCards(files) {
            files.forEach(a => {
                const card = document.createElement("div");
                card.className = "file-card";
                card.draggable = true;
                card.dataset.attachmentId = a.attachmentId;

                const fullName = a.originalName || ("file-" + a.attachmentId);

                const ico = document.createElement("div");
                ico.className = "file-ico";

                const img = document.createElement("img");
                img.src = resolveFileIcon(a);
                img.alt = "파일 아이콘";
                ico.appendChild(img);

                const nm = document.createElement("div");
                nm.className = "file-name";
                nm.textContent = short20(fullName);
                nm.addEventListener("click", (e) => {
                    e.stopPropagation();
                    alert(fullName);
                });

                const size = document.createElement("div");
                size.className = "file-size";
                size.textContent = humanBytes(a.size);

                card.appendChild(ico);
                card.appendChild(nm);
                card.appendChild(size);

                card.addEventListener("click", () => {
                    clearFileSelection();
                    card.classList.add("selected");
                    state.selectedAttachmentId = a.attachmentId;
                    el.btnDownload.disabled = false;
                    el.btnDeleteFile.disabled = false;
                });

                card.addEventListener("dragstart", (e) => {
                    e.dataTransfer.setData("text/plain", String(a.attachmentId));
                    e.dataTransfer.setData("cloud-scope", state.scope);
                    e.dataTransfer.setData("fromFolderNo", String(state.selectedFolderNo ?? ""));
                });

                el.fileGrid.appendChild(card);
            });
        }

        /** ====== 왼쪽 트리 로딩 ====== */
        async function loadChildren(parentId, containerUl) {
            const [folders, files] = await Promise.all([
                apiJson(folderListUrl(parentId)),
                (parentId == null ? Promise.resolve([]) : apiJson(attachmentListUrl(parentId)))
            ]);

            containerUl.innerHTML = "";

            const hasFolders = folders && folders.length > 0;
            const hasFiles = files && files.length > 0;

            if (!hasFolders && !hasFiles) {
                const li = document.createElement("li");
                li.className = "empty";
                li.textContent = parentId == null ? "폴더가 없습니다." : "파일이 없습니다.";
                containerUl.appendChild(li);
                return;
            }

            if (hasFolders) {
                for (const f of folders) {
                    const li = document.createElement("li");

                    const node = document.createElement("div");
                    node.className = "node";
                    node.dataset.folderNo = f.folderNo;
                    node.dataset.folderName = f.folderName;

                    const caret = document.createElement("div");
                    caret.className = "caret";
                    caret.textContent = "▸";

                    const ico = document.createElement("div");
                    ico.className = "folder-ico";

                    const label = document.createElement("div");
                    label.className = "label";
                    label.textContent = f.folderName;

                    node.appendChild(caret);
                    node.appendChild(ico);
                    node.appendChild(label);

                    const children = document.createElement("ul");
                    children.className = "children";
                    children.style.display = "none";

                    state.treeIndex.nodeById.set(f.folderNo, node);
                    state.treeIndex.caretById.set(f.folderNo, caret);
                    state.treeIndex.childrenById.set(f.folderNo, children);
                    state.treeIndex.parentById.set(f.folderNo, parentId);

                    node.addEventListener("click", async (e) => {
                        e.stopPropagation();
                        closeCtxMenu();

                        document.querySelectorAll(".node.selected, .file-node.selected").forEach(x => x.classList.remove("selected"));
                        node.classList.add("selected");

                        state.selectedFolderNo = f.folderNo;
                        state.selectedFolderName = f.folderName;

                        setBreadcrumbFromNode(node);
                        await loadFolderContent(f.folderNo);

                        const opened = children.style.display === "block";
                        if (opened) {
                            children.style.display = "none";
                            caret.textContent = "▸";
                        } else {
                            await loadChildren(f.folderNo, children);
                            children.style.display = "block";
                            caret.textContent = "▾";
                        }
                    });

                    node.addEventListener("contextmenu", async (e) => {
                        e.preventDefault();
                        e.stopPropagation();

                        document.querySelectorAll(".node.selected, .file-node.selected").forEach(x => x.classList.remove("selected"));
                        node.classList.add("selected");

                        state.selectedFolderNo = f.folderNo;
                        state.selectedFolderName = f.folderName;

                        setBreadcrumbFromNode(node);
                        await loadFolderContent(f.folderNo);

                        openCtxMenu(e.clientX, e.clientY, {
                            kind: "folder",
                            folderNo: f.folderNo,
                            folderName: f.folderName,
                        });
                    });

                    node.addEventListener("dragover", (e) => { e.preventDefault(); node.classList.add("drop"); });
                    node.addEventListener("dragleave", () => node.classList.remove("drop"));
                    node.addEventListener("drop", async (e) => {
                        e.preventDefault();
                        node.classList.remove("drop");

                        const attachmentId = Number(e.dataTransfer.getData("text/plain"));
                        const dragScope = e.dataTransfer.getData("cloud-scope");
                        const fromFolderNoRaw = e.dataTransfer.getData("fromFolderNo");
                        const fromFolderNo = fromFolderNoRaw ? Number(fromFolderNoRaw) : null;

                        if (!attachmentId) return;

                        if (dragScope && dragScope !== state.scope) {
                            alert("공유함 파일은 공유함에서만, 개인함 파일은 개인함에서만 이동 가능합니다.");
                            return;
                        }

                        const toFolderNo = f.folderNo;

                        try {
                            await apiJson(`/api/v1/attachments/${attachmentId}/move?toFolderNo=${toFolderNo}`, {method: "POST"});
                            if (state.selectedFolderNo) await loadFolderContent(state.selectedFolderNo);
                            if (fromFolderNo != null) await refreshTreeChildren(fromFolderNo);
                            await refreshTreeChildren(toFolderNo);
                        } catch (err) {
                            alert(err.message);
                        }
                    });

                    li.appendChild(node);
                    li.appendChild(children);
                    containerUl.appendChild(li);
                }
            }

            if (hasFiles) {
                for (const a of files) {
                    const li = document.createElement("li");
                    const fileNode = document.createElement("div");
                    fileNode.className = "file-node";
                    fileNode.draggable = true;
                    fileNode.dataset.attachmentId = a.attachmentId;

                    const blank = document.createElement("div");
                    blank.className = "caret";
                    blank.textContent = "";

                    const ico = document.createElement("div");
                    ico.className = "file-ico-small";
                    const img = document.createElement("img");
                    img.src = resolveFileIcon(a);
                    img.alt = "파일";
                    ico.appendChild(img);

                    const fullName = a.originalName || ("file-" + a.attachmentId);
                    const label = document.createElement("div");
                    label.className = "label";
                    label.textContent = short20(fullName);

                    fileNode.addEventListener("click", (e) => {
                        e.stopPropagation();
                        document.querySelectorAll(".node.selected, .file-node.selected").forEach(x => x.classList.remove("selected"));
                        fileNode.classList.add("selected");

                        state.selectedAttachmentId = a.attachmentId;
                        el.btnDownload.disabled = false;
                        el.btnDeleteFile.disabled = false;

                        if (parentId != null) state.selectedFolderNo = parentId;
                        alert(fullName);
                    });

                    fileNode.addEventListener("dragstart", (e) => {
                        e.dataTransfer.setData("text/plain", String(a.attachmentId));
                        e.dataTransfer.setData("cloud-scope", state.scope);
                        e.dataTransfer.setData("fromFolderNo", String(parentId ?? ""));
                    });

                    fileNode.appendChild(blank);
                    fileNode.appendChild(ico);
                    fileNode.appendChild(label);

                    li.appendChild(fileNode);
                    containerUl.appendChild(li);
                }
            }
        }

        async function initTree() {
            state.selectedFolderNo = null;
            state.selectedFolderName = null;
            state.treeIndex.nodeById.clear();
            state.treeIndex.caretById.clear();
            state.treeIndex.childrenById.clear();
            state.treeIndex.parentById.clear();

            el.breadcrumb.textContent = state.scope === "dept" ? "공유함" : "개인함";
            clearFileSelection();
            el.fileGrid.innerHTML = "";
            await loadChildren(null, el.treeRoot);
        }

        async function refreshTreeChildren(folderNo) {
            if (folderNo == null) {
                await refreshRootPreserveOpen();
                return;
            }
            const childrenUl = state.treeIndex.childrenById.get(folderNo);
            if (!childrenUl) return;
            const caret = state.treeIndex.caretById.get(folderNo);
            await loadChildren(folderNo, childrenUl);
            if (childrenUl.style.display === "block" && caret) caret.textContent = "▾";
        }

        /** ====== 폴더 CRUD ====== */
        async function createFolder() {
            const name = prompt("폴더 이름");
            if (!name) return;

            const parent = state.selectedFolderNo;

            await apiJson(folderBase(), {
                method: "POST",
                body: JSON.stringify({ parentId: parent, folderName: name.trim() }),
            });

            await refreshTreeChildren(parent);
            if (parent != null) await loadFolderContent(parent);
        }

        async function renameFolder() {
            if (!state.selectedFolderNo) return alert("수정할 폴더를 선택해주세요.");
            const newName = prompt("새 폴더명", state.selectedFolderName || "");
            if (!newName) return;

            const folderNo = state.selectedFolderNo;
            const parent = state.treeIndex.parentById.get(folderNo);

            await apiJson(`/api/v1/folders/${state.selectedFolderNo}/rename`, {
                method: "PATCH",
                body: JSON.stringify({folderName: newName.trim()}),
            });

            state.selectedFolderName = newName.trim();

            const node = state.treeIndex.nodeById.get(folderNo);
            if (node) {
                node.dataset.folderName = state.selectedFolderName;
                const label = node.querySelector(".label");
                if (label) label.textContent = state.selectedFolderName;
                setBreadcrumbFromNode(node);
                await refreshTreeChildren(parent);
                if (state.selectedFolderNo === folderNo) await loadFolderContent(folderNo);
            }
        }

        async function deleteFolder() {
            if (!state.selectedFolderNo) return alert("삭제할 폴더를 선택해주세요.");
            if (!confirm("정말 삭제하시겠습니까?")) return;

            await apiJson(`/api/v1/folders/${state.selectedFolderNo}`, {method: "DELETE"});
            await initTree();
        }

        /** ====== 파일 삭제/다운로드 ====== */
        async function deleteSelectedFile() {
            if (!state.selectedAttachmentId) return alert("삭제할 파일을 선택해주세요.");
            if (!confirm("파일을 삭제하시겠습니까?")) return;

            await apiJson(`/api/v1/attachments/${state.selectedAttachmentId}`, {method: "DELETE"});
            await loadFolderContent(state.selectedFolderNo);
        }

        async function downloadSelectedFile() {
            if (!state.selectedAttachmentId) return alert("다운로드할 파일을 선택해주세요.");
            const res = await apiJson(`/api/v1/attachments/${state.selectedAttachmentId}/download-url`);
            window.open(res.url, "_blank");
        }

        /** ====== 업로드 ====== */
        function openUploadPicker() {
            if (!state.selectedFolderNo) return alert("업로드할 폴더를 먼저 선택해주세요.");
            el.fileInput.click();
        }

        async function uploadOneFile(file) {
            const fileType = file.type && file.type.startsWith("image") ? "IMAGE" : "DOC";

            const presign = await apiJson(UPLOAD.presign, {
                method: "POST",
                body: JSON.stringify({
                    domain: "CLOUD",
                    entityId: state.selectedFolderNo,
                    originalName: file.name,
                    contentType: file.type || "application/octet-stream",
                    size: file.size,
                    fileType,
                }),
            });

            const putRes = await fetch(presign.uploadUrl, {
                method: "PUT",
                headers: {"Content-Type": file.type || "application/octet-stream"},
                body: file,
            });
            if (!putRes.ok) throw new Error("S3 업로드 실패");

            await apiJson(UPLOAD.complete, {
                method: "POST",
                body: JSON.stringify({
                    domain: "CLOUD",
                    entityId: state.selectedFolderNo,
                    fileType,
                    objectKey: presign.objectKey,
                    originalName: file.name,
                    contentType: file.type || "application/octet-stream",
                    size: file.size,
                    etag: null,
                }),
            });
        }

        /** ====== 아이콘 결정 ====== */
        function resolveFileIcon(a) {
            const ICONS = {
                word: "/images/icons/word.png",
                excel: "/images/icons/excel.png",
                ppt: "/images/icons/PPT.png",
                pdf: "/images/icons/PDF.png",
                image: "/images/icons/image-large.png",
                zip: "/images/icons/zip.png",
                code: "/images/icons/code.png",
                unknown: "/images/icons/unknown.png",
            };

            const EXT_GROUPS = {
                word: ["doc", "docx"],
                excel: ["xls", "xlsx", "csv"],
                ppt: ["ppt", "pptx"],
                pdf: ["pdf"],
                image: ["png", "jpg", "jpeg", "gif", "webp", "svg", "bmp", "tif", "tiff", "heic"],
                zip: ["zip", "rar", "7z", "tar", "gz", "bz2", "xz"],
                code: ["js", "ts", "jsx", "tsx", "html", "css", "scss", "less", "json", "xml", "yml", "yaml", "md",
                    "py", "java", "c", "cpp", "h", "hpp", "go", "rs", "php", "rb", "kt", "swift", "sh", "ps1", "sql"],
            };

            const name = (a?.originalName || "").trim();
            let ext = (a?.ext || "").toLowerCase();
            if (!ext && name.includes(".")) ext = name.split("?")[0].split("#")[0].split(".").pop().toLowerCase();

            let type = "unknown";
            for (const [k, arr] of Object.entries(EXT_GROUPS)) {
                if (arr.includes(ext)) { type = k; break; }
            }
            return ICONS[type] || ICONS.unknown;
        }

        /** ====== 컨텍스트 메뉴 ====== */
        function openCtxMenu(x, y, opt) {
            state.ctxFolderNo = opt?.folderNo ?? null;
            state.ctxFolderName = opt?.folderName ?? null;

            if (opt?.kind === "folder") {
                el.ctxCreateLabel.textContent = "하위 폴더 생성";
                el.ctxRename.disabled = false;
                el.ctxDelete.disabled = false;
            } else {
                el.ctxCreateLabel.textContent = "폴더 생성";
                el.ctxRename.disabled = true;
                el.ctxDelete.disabled = true;
            }

            el.ctx.classList.add("open");

            const menuW = 190;
            const menuH = 150;
            const pad = 8;
            let left = x;
            let top = y;

            const maxL = window.innerWidth - menuW - pad;
            const maxT = window.innerHeight - menuH - pad;
            if (left > maxL) left = maxL;
            if (top > maxT) top = maxT;

            el.ctx.style.left = left + "px";
            el.ctx.style.top = top + "px";
        }

        function closeCtxMenu() {
            el.ctx.classList.remove("open");
        }

        el.treeRoot?.addEventListener("contextmenu", (e) => {
            const onNode = e.target.closest?.(".node");
            if (onNode) return;
            e.preventDefault();
            e.stopPropagation();
            openCtxMenu(e.clientX, e.clientY, {kind: "blank"});
        });

        el.ctxCreate?.addEventListener("click", () => {
            closeCtxMenu();
            createFolder().catch(e => alert(e.message));
        });

        el.ctxRename?.addEventListener("click", () => {
            closeCtxMenu();
            renameFolder().catch(e => alert(e.message));
        });

        el.ctxDelete?.addEventListener("click", () => {
            closeCtxMenu();
            deleteFolder().catch(e => alert(e.message));
        });

        document.addEventListener("click", (e) => {
            if (el.ctx.classList.contains("open")) {
                if (!e.target.closest("#cloudCtx")) closeCtxMenu();
            }
        });
        document.addEventListener("scroll", () => closeCtxMenu(), true);
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeCtxMenu();
        });

        /** ====== 이벤트 ====== */
        el.btnUpload?.addEventListener("click", openUploadPicker);
        el.btnDeleteFile?.addEventListener("click", () => deleteSelectedFile().catch(e => alert(e.message)));
        el.btnDownload?.addEventListener("click", () => downloadSelectedFile().catch(e => alert(e.message)));

        el.fileInput?.addEventListener("change", async (e) => {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;

            if (!state.selectedFolderNo) {
                alert("업로드할 폴더를 먼저 선택해주세요.");
                el.fileInput.value = "";
                return;
            }

            try {
                for (const file of files) await uploadOneFile(file);
                await loadFolderContent(state.selectedFolderNo);
                alert("업로드 완료!");
            } catch (err) {
                alert(err.message);
            } finally {
                el.fileInput.value = "";
            }
        });

        async function ensureExpanded(folderNo) {
            const childrenUl = state.treeIndex.childrenById.get(folderNo);
            const caret = state.treeIndex.caretById.get(folderNo);
            if (!childrenUl || !caret) return;
            if (childrenUl.style.display === "block") return;
            await loadChildren(folderNo, childrenUl);
            childrenUl.style.display = "block";
            caret.textContent = "▾";
        }

        async function syncTreeToFolder(targetFolderNo) {
            if (!targetFolderNo) return;

            const path = [];
            let cur = targetFolderNo;
            const seen = new Set();

            while (cur != null && !seen.has(cur)) {
                seen.add(cur);
                path.push(cur);
                cur = state.treeIndex.parentById.get(cur);
            }
            path.reverse();

            for (let i = 0; i < path.length - 1; i++) {
                await ensureExpanded(path[i]);
            }

            document.querySelectorAll(".node.selected, .file-node.selected")
                .forEach(x => x.classList.remove("selected"));

            const node = state.treeIndex.nodeById.get(targetFolderNo);
            if (node) {
                await ensureExpanded(targetFolderNo);
                node.classList.add("selected");
                node.scrollIntoView({block: "nearest"});
                setBreadcrumbFromNode(node);
            }
        }

        function snapshotExpanded() {
            const expanded = [];
            for (const [id, ul] of state.treeIndex.childrenById.entries()) {
                if (ul && ul.style.display === "block") expanded.push(id);
            }
            return expanded;
        }

        async function restoreExpanded(expanded) {
            for (const id of expanded) {
                await ensureExpanded(id);
            }
        }

        async function refreshRootPreserveOpen() {
            const expanded = snapshotExpanded();
            const selected = state.selectedFolderNo;

            await loadChildren(null, el.treeRoot);

            await restoreExpanded(expanded);
            if (selected) await syncTreeToFolder(selected);
        }

        /** ====== 초기화 ====== */
        window.addEventListener("DOMContentLoaded", () => {
            initTree().catch(e => alert(e.message));
        });
    </script>
