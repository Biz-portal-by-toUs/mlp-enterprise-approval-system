<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<!-- ✅ 이 페이지 전용 스타일: layout의 :root / .badge / .card 등 절대 건드리지 않음 -->
<th:block layout:fragment="pageStyles">
    <div class="notice-popup-scope">

        <!-- ✅ 여기부터 팝업 코드 "그대로" (JS/HTML 구조 유지) -->
        <style>
            /* ⚠️ :root 삭제 (전역 변수 덮어쓰기 방지) */

            /* ===== Modal Overlay ===== */
            .popup-overlay{
                position: fixed;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 9999;

                background:
                        radial-gradient(900px 600px at 20% 10%, rgba(59,130,246,.18), transparent 60%),
                        radial-gradient(800px 500px at 85% 0%, rgba(16,185,129,.14), transparent 60%),
                        rgba(255, 255, 255, 0.72);

                backdrop-filter: blur(6px);
                -webkit-backdrop-filter: blur(6px);

                padding: 18px;
            }

            /* ===== Modal Card ===== */
            .popup-modal{
                width: min(640px, 92vw);
                background: #ffffff; /* ✅ 더 확실한 화이트 */
                border-radius: 18px;

                /* ✅ 그림자도 조금 덜 무겁게 */
                box-shadow: 0 24px 60px rgba(17,24,39,.18);

                /* ✅ 밝은 테두리 */
                border: 1px solid rgba(17,24,39,.10);

                overflow: hidden;
                transform: translateY(6px);
                animation: popupIn .18s ease-out forwards;
                font-family: 'Noto Sans KR', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            }


            @keyframes popupIn{
                from { opacity: 0; transform: translateY(14px) scale(.98); }
                to   { opacity: 1; transform: translateY(0) scale(1); }
            }

            /* ===== Header ===== */
            .popup-header{
                padding: 14px 16px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;

                background: linear-gradient(135deg, rgba(59,130,246,.14), rgba(255,255,255,0));
                border-bottom: 1px solid var(--line);
            }

            .popup-title{
                margin: 0;
                font-size: 1.05rem;
                font-weight: 900;
                letter-spacing: -0.2px;
                color: var(--text);
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .popup-title::before{
                content:"";
                width: 10px;
                height: 10px;
                border-radius: 999px;
                background: rgba(59,130,246,.65);
                box-shadow: 0 0 0 4px rgba(59,130,246,.15);
            }

            /* ===== Body ===== */
            .popup-body{
                padding: 16px;
                max-height: 56vh;
                overflow: auto;

                color: var(--text);
                line-height: 1.7;
                white-space: normal; /* TipTap/HTML 렌더 대응 */
                /* ✅ 더 밝게 */
                background: rgba(255,255,255,.92);
                border-top: 1px solid rgba(17,24,39,.06);

            }

            .popup-body::-webkit-scrollbar{ width: 10px; }
            .popup-body::-webkit-scrollbar-thumb{
                background: rgba(31,41,55,.18);
                border-radius: 999px;
                border: 3px solid rgba(255,255,255,.65);
            }
            .popup-body::-webkit-scrollbar-track{ background: transparent; }

            /* ===== Footer ===== */
            .popup-footer{
                padding: 12px 16px;
                border-top: 1px solid var(--line);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                background: var(--card);
            }

            .popup-meta{
                font-size: 12px;
                font-weight: 900;
                color: var(--muted);
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }

            #popupCounter{
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 7px 10px;
                border-radius: 999px;
                background: rgba(59,130,246,.08);
                border: 1px solid rgba(59,130,246,.18);
                color: rgba(31,41,55,.85);
            }

            /* ===== Buttons ===== */
            .popup-actions{
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .btn{
                appearance: none;
                border: 1px solid rgba(17,24,39,.10);
                background: #fff;
                padding: 10px 12px;
                border-radius: 12px;
                cursor: pointer;
                font-size: 13px;
                font-weight: 900;
                color: var(--text);
                box-shadow: 0 10px 20px rgba(17,24,39,.06);
                transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
            }

            .btn:hover{
                transform: translateY(-1px);
                box-shadow: var(--shadow2);
                border-color: rgba(59,130,246,.25);
                background: rgba(59,130,246,.05);
            }

            .btn.primary{
                border-color: rgba(59,130,246,.35);
                background: linear-gradient(135deg, rgba(59,130,246,.18), rgba(255,255,255,0));
            }

            .btn.close-x{
                border: 1px solid rgba(17,24,39,.10);
                background: rgba(255,255,255,.85);
                width: 38px;
                height: 38px;
                padding: 0;
                border-radius: 12px;
                font-size: 20px;
                line-height: 1;
                display: grid;
                place-items: center;
                color: rgba(31,41,55,.85);
            }

            .btn.close-x:hover{
                border-color: rgba(239,68,68,.30);
                background: rgba(239,68,68,.06);
            }

            @media (max-width: 520px){
                .popup-modal{ width: min(560px, 94vw); }
                .popup-footer{
                    flex-direction: column;
                    align-items: stretch;
                }
                .popup-actions{
                    width: 100%;
                    justify-content: stretch;
                }
                .popup-actions .btn{
                    flex: 1 1 auto;
                    justify-content: center;
                }
                #popupCounter{
                    width: 100%;
                    justify-content: center;
                }
            }

            .btn.danger{
                border-color: rgba(239,68,68,.25);
                background: linear-gradient(135deg, rgba(239,68,68,.12), rgba(255,255,255,0));
            }
            .btn.danger:hover{
                border-color: rgba(239,68,68,.40);
                background: rgba(239,68,68,.06);
            }

            /* =========================
               ✅ TipTap/HTML 렌더 스타일 (팝업용)
            ========================== */
            #popupBody .ProseMirror{
                outline: none;
                white-space: pre-wrap;
                line-height: 1.75;
            }
            #popupBody h2{ margin: 12px 0 8px; font-size: 1.15rem; font-weight: 900; }
            #popupBody p{ margin: 8px 0; }
            #popupBody ul, #popupBody ol{ padding-left: 22px; margin: 8px 0; }
            #popupBody blockquote{
                margin: 10px 0;
                padding: 10px 12px;
                border-left: 4px solid rgba(59,130,246,.35);
                background: rgba(59,130,246,.06);
                border-radius: 12px;
            }
            #popupBody pre{
                background: rgba(17,24,39,.06);
                padding: 12px;
                border-radius: 14px;
                overflow: auto;
            }
            #popupBody code{
                background: rgba(17,24,39,.06);
                padding: 2px 6px;
                border-radius: 8px;
                font-weight: 800;
            }
            #popupBody table{
                border-collapse: collapse;
                width: 100%;
                table-layout: fixed;
                margin: 10px 0;
                border: 1px solid rgba(17,24,39,.10);
                border-radius: 12px;
                overflow: hidden;
            }
            #popupBody th, #popupBody td{
                border: 1px solid rgba(17,24,39,.10);
                padding: 10px 12px;
                vertical-align: top;
                word-break: break-word;
                position: relative;
            }
            #popupBody th{
                background: rgba(17,24,39,.03);
                font-weight: 900;
                color: var(--muted);
            }
            #popupBody .selectedCell:after{
                content:"";
                position:absolute;
                inset:0;
                background: rgba(59,130,246,.08);
                pointer-events:none;
            }
        </style>

        <div id="popupOverlay" class="popup-overlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
            <div class="popup-modal">
                <div class="popup-header">
                    <h3 id="popupTitle" class="popup-title">공지</h3>
                    <button class="btn close-x" type="button" aria-label="Close" onclick="closePopup()">×</button>
                </div>

                <div id="popupBody" class="popup-body">
                    <!-- contents -->
                </div>

                <div class="popup-footer">
                    <div class="popup-meta">
                        <span id="popupCounter"></span>
                    </div>

                    <div class="popup-actions">
                        <button class="btn danger" type="button" onclick="hideToday()">오늘 하루 보지 않기</button>

                        <!-- ✅ 추가 -->
                        <button class="btn" id="btnPrev" type="button" onclick="prevPopup()">이전</button>
                        <button class="btn" id="btnNext" type="button" onclick="nextPopup()">다음</button>
                        <button class="btn primary" type="button" onclick="closePopup()">닫기</button>
                    </div>

                </div>
            </div>
        </div>


        <!-- ✅ TipTap viewer (JSON 렌더용) -->
        <script type="module">
            import { Editor } from "https://esm.sh/@tiptap/core@2.11.5";
            import StarterKit from "https://esm.sh/@tiptap/starter-kit@2.11.5";
            import Underline from "https://esm.sh/@tiptap/extension-underline@2.11.5";

            import TextStyle from "https://esm.sh/@tiptap/extension-text-style@2.11.5";
            import Color from "https://esm.sh/@tiptap/extension-color@2.11.5";
            import Highlight from "https://esm.sh/@tiptap/extension-highlight@2.11.5";

            import Table from "https://esm.sh/@tiptap/extension-table@2.11.5";
            import TableRow from "https://esm.sh/@tiptap/extension-table-row@2.11.5";
            import TableHeader from "https://esm.sh/@tiptap/extension-table-header@2.11.5";
            import TableCell from "https://esm.sh/@tiptap/extension-table-cell@2.11.5";

            let popupViewer = null;

            function ensurePopupViewer() {
                if (popupViewer) return popupViewer;

                const host = document.querySelector("#popupBody");
                popupViewer = new Editor({
                    element: host,
                    editable: false,
                    extensions: [
                        StarterKit,
                        Underline,

                        // JSON에 color/highlight/table이 들어있다면 렌더를 위해 확장은 있어야 함
                        TextStyle,
                        Color,
                        Highlight.configure({ multicolor: true }),

                        Table.configure({ resizable: true }),
                        TableRow,
                        TableHeader,
                        TableCell,
                    ],
                    content: "<p></p>",
                });

                return popupViewer;
            }


            function parseJsonSafely(str) {
                try { return JSON.parse(str); } catch { return null; }
            }

            function isTipTapDoc(obj) {
                return !!obj && typeof obj === "object" && (obj.type === "doc" || Array.isArray(obj.content));
            }

            function isTextEnvelope(obj) {
                // {"text":"..."} 또는 {"text": "...", ...}
                return !!obj && typeof obj === "object" && typeof obj.text === "string";
            }

            function isProbablyJson(str) {
                if (typeof str !== "string") return false;
                const s = str.trim();
                if (!s) return false;
                if (!(s.startsWith("{") || s.startsWith("["))) return false;
                return parseJsonSafely(s) !== null;
            }

            function escapeHtml(str) {
                return String(str ?? "")
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }


            window.renderPopupContentsAuto = (contents) => {
                const host = document.querySelector("#popupBody");

                const _escape = (typeof escapeHtml === "function")
                    ? escapeHtml
                    : (s) => String(s ?? "");

                if (contents == null) {
                    if (popupViewer) { popupViewer.destroy(); popupViewer = null; }
                    host.innerHTML = "<p>-</p>";
                    return;
                }

                // 1) object로 이미 들어온 경우
                if (typeof contents === "object") {
                    // TipTap doc
                    if (isTipTapDoc(contents)) {
                        const ed = ensurePopupViewer();
                        ed.commands.setContent(contents);
                        return;
                    }
                    // {"text": "..."} 형태
                    if (isTextEnvelope(contents)) {
                        if (popupViewer) { popupViewer.destroy(); popupViewer = null; host.innerHTML = ""; }
                        host.innerHTML = `<p>${escapeHtml(contents.text).replaceAll("\n","<br>")}</p>`;
                        return;
                    }
                    // 기타 object -> 텍스트로
                    if (popupViewer) { popupViewer.destroy(); popupViewer = null; host.innerHTML = ""; }
                    host.innerHTML = `<p>${escapeHtml(JSON.stringify(contents)).replaceAll("\n","<br>")}</p>`;
                    return;
                }

                // 2) string 처리
                const raw = String(contents).trim();

                // JSON 문자열
                if (isProbablyJson(raw)) {
                    const obj = parseJsonSafely(raw);

                    // TipTap doc JSON
                    if (isTipTapDoc(obj)) {
                        const ed = ensurePopupViewer();
                        ed.commands.setContent(obj);
                        return;
                    }

                    // {"text":"..."} JSON
                    if (isTextEnvelope(obj)) {
                        if (popupViewer) { popupViewer.destroy(); popupViewer = null; host.innerHTML = ""; }
                        host.innerHTML = `<p>${escapeHtml(obj.text).replaceAll("\n","<br>")}</p>`;
                        return;
                    }

                    // 기타 JSON -> 보기 좋게 텍스트로
                    if (popupViewer) { popupViewer.destroy(); popupViewer = null; host.innerHTML = ""; }
                    host.innerHTML = `<p>${escapeHtml(raw).replaceAll("\n","<br>")}</p>`;
                    return;
                }

                // HTML 문자열
                if (isProbablyHtml(raw)) {
                    if (popupViewer) { popupViewer.destroy(); popupViewer = null; host.innerHTML = ""; }
                    host.innerHTML = raw; // ❗ 서버 sanitize 권장
                    return;
                }

                // plain text
                if (popupViewer) { popupViewer.destroy(); popupViewer = null; host.innerHTML = ""; }
                host.innerHTML = `<p>${escapeHtml(raw).replaceAll("\n","<br>")}</p>`;
            };

        </script>

        <script>
            // ====== config ======
            const API_URL = "http://localhost:8090/api/v1/notices-popup";

            // ====== state ======
            let popupList = [];
            let currentIndex = 0;

            function endOfTodayMs() {
                const now = new Date();
                const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
                return end.getTime();
            }

            function isHiddenToday(noticeNo) {
                const key = `popup_notice_${noticeNo}_hide_until`;
                const until = Number(localStorage.getItem(key) || "0");
                return Date.now() < until;
            }

            function safeTime(v){
                if (!v) return NaN;
                // "YYYY-MM-DD HH:mm:ss" → "YYYY-MM-DDTHH:mm:ss"
                const s = String(v).replace(" ", "T");
                const t = Date.parse(s);
                return Number.isFinite(t) ? t : NaN;
            }

            function isWithinPeriod(item){
                if (!item.startedAt || !item.endedAt) return true;
                const start = safeTime(item.startedAt);
                const end   = safeTime(item.endedAt);

                // 날짜 파싱 실패하면(=NaN) 필터로 죽이지 말고 "표시" 쪽으로
                if (!Number.isFinite(start) || !Number.isFinite(end)) return true;

                const now = Date.now();
                return now >= start && now <= end;
            }


            function openPopup() {
                document.getElementById("popupOverlay").style.display = "flex";
            }

            function closePopup() {
                document.getElementById("popupOverlay").style.display = "none";
            }

            function renderPopup(index) {

                const btnPrev = document.getElementById("btnPrev");
                const btnNext = document.getElementById("btnNext");
                if (btnPrev) btnPrev.disabled = (currentIndex <= 0);
                if (btnNext) btnNext.disabled = (currentIndex >= popupList.length - 1);

                if (!popupList.length) { closePopup(); return; }
                if (index < 0 || index >= popupList.length) { closePopup(); return; }

                const item = popupList[index];

                document.getElementById("popupTitle").textContent = item.title ?? `공지 #${item.noticeNo}`;

                // ✅ 핵심 변경: JSON이 보이지 않게 상세 화면처럼 렌더
                if (window.renderPopupContentsAuto) {
                    window.renderPopupContentsAuto(item.contents);
                } else {
                    // fallback
                    document.getElementById("popupBody").textContent = String(item.contents ?? "");
                }

                document.getElementById("popupCounter").textContent =
                    `${index + 1} / ${popupList.length} (noticeNo: ${item.noticeNo})`;

                openPopup();
            }

            function prevPopup() {
                if (!popupList.length) {
                    closePopup();
                    return;
                }

                // 이전 보여줄 항목 찾기
                for (let i = currentIndex - 1; i >= 0; i--) {
                    currentIndex = i;
                    renderPopup(currentIndex);
                    return;
                }

                // 맨 처음이면 그대로 유지(원하면 닫기/알림 등으로 변경 가능)
                // alert("첫 번째 공지입니다.");
                renderPopup(currentIndex);
            }


            function nextPopup() {
                for (let i = currentIndex + 1; i < popupList.length; i++) {
                    currentIndex = i;
                    renderPopup(currentIndex);
                    return;
                }
                closePopup();
            }

            function hideToday() {
                const item = popupList[currentIndex];
                if (!item) return;

                const key = `popup_notice_${item.noticeNo}_hide_until`;
                localStorage.setItem(key, String(endOfTodayMs()));
                nextPopup();
            }

            function isPopupTrue(v){
                return v === true || v === "true" || v === 1 || v === "1";
            }


            async function loadPopups() {
                try {
                    const res = await fetch(API_URL, {
                        method: "GET",
                        credentials: "include",
                        headers: { "Accept": "application/json" }
                    });

                    if (!res.ok) {
                        console.error("API error:", res.status);
                        return;
                    }

                    const json = await res.json();
                    const data = Array.isArray(json.data) ? json.data : [];

                    popupList = data
                        .filter(item => item && isPopupTrue(item.isPopup))
                        .filter(isWithinPeriod)
                        .filter(item => !isHiddenToday(item.noticeNo));

                    if (!popupList.length) return;

                    currentIndex = 0;
                    renderPopup(currentIndex);

                } catch (err) {
                    console.error("Failed to load popups:", err);
                }
            }

            window.addEventListener("DOMContentLoaded", loadPopups);

            document.getElementById("popupOverlay").addEventListener("click", (e) => {
                if (e.target.id === "popupOverlay") closePopup();
            });

            window.addEventListener("keydown", (e) => {
                if (e.key === "Escape") closePopup();
            });
        </script>


    </div>
    <style>

<!-- ✅ 이 페이지 전용 스크립트: layout의 공통 팝업/알림/프로필 JS와 충돌 없음 -->
<th:block layout:fragment="pageScripts">
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            startClientClock();
            loadDashboard();
        });

        async function loadDashboard() {
            try {
                const res = await fetch("/api/dashboard", { credentials: "include" });
                if (!res.ok) throw new Error("dashboard api failed: " + res.status);
                const d = await res.json();
                renderDashboard(d);
            } catch (e) {
                console.error(e);
                setText("needApprove", "-");
                setText("rejectedApprove", "-");
                setText("sentApprove", "-");
                setListFallback("todoList", "데이터를 불러오지 못했습니다.");
                setListFallback("todaySchedules", "데이터를 불러오지 못했습니다.");
                setListFallback("noticeList", "데이터를 불러오지 못했습니다.");
                setListFallback("boardList", "데이터를 불러오지 못했습니다.");
            }
        }

        function renderDashboard(d) {
            setText("needApprove", d?.approvals?.needCount ?? 0);
            setText("rejectedApprove", d?.approvals?.rejectedCount ?? 0);
            setText("sentApprove", d?.approvals?.sentCount ?? 0);

            const totalTodo = d?.todo?.total ?? 0;
            setText("todoCount", totalTodo);

            const percent = d?.todo?.progressPercent ?? 0;
            setDonutPercent("todoDonut", percent);
            setText("todoPercent", percent + "%");

            renderSimpleList("todoList", d?.todo?.items ?? [], (it) => ({
                text: (it.done ? "✅ " : "☐ ") + it.title,
                href: "/todo"
            }));

            // 백엔드 키에 맞춰 사용 (todaySchedules or todayItems)
            const today = d?.todaySchedules ?? d?.todayItems ?? [];
            renderSimpleList("todaySchedules", today, (it) => ({
                text: formatTime(it.startAt) + " " + (it.title ?? ""),
                href: "/calendar"
            }));

            renderSimpleList("noticeList", d?.notices ?? [], (it) => ({
                text: it.title,
                href: "/notice/" + it.id
            }));
            renderSimpleList("boardList", d?.boards ?? [], (it) => ({
                text: it.title,
                href: "/board/" + it.id
            }));
        }

        function renderSimpleList(ulId, items, mapper) {
            const ul = document.getElementById(ulId);
            if (!ul) return;
            ul.innerHTML = "";

            if (!items || items.length === 0) {
                const li = document.createElement("li");
                li.className = "md-sub";
                li.textContent = "표시할 항목이 없습니다.";
                ul.appendChild(li);
                return;
            }

            items.forEach(it => {
                const m = mapper(it);
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = m.href;
                a.textContent = m.text;
                li.appendChild(a);
                ul.appendChild(li);
            });
        }

        function setText(id, value) {
            const el = document.getElementById(id);
            if (el) el.textContent = value;
        }

        function setListFallback(id, msg) {
            const ul = document.getElementById(id);
            if (!ul) return;
            ul.innerHTML = "";
            const li = document.createElement("li");
            li.className = "md-sub";
            li.textContent = msg;
            ul.appendChild(li);
        }

        function setDonutPercent(elId, percent) {
            const el = document.getElementById(elId);
            if (!el) return;
            const p = Math.max(0, Math.min(100, percent || 0));
            el.style.background = `conic-gradient(#ffffff ${p}%, rgba(255,255,255,0.25) 0)`;
        }

        function startClientClock() {
            const tick = () => {
                const now = new Date();
                const dateEl = document.getElementById("todayDate");
                const timeEl = document.getElementById("todayTime");
                if (dateEl) dateEl.textContent = formatDate(now);
                if (timeEl) timeEl.textContent = formatHHmm(now);
            };
            tick();
            setInterval(tick, 1000);
        }

        function formatDate(d) {
            const yy = String(d.getFullYear()).slice(2);
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            const day = ["일","월","화","수","목","금","토"][d.getDay()];
            return `${yy}${mm}${dd} ${day}`;
        }
        function formatHHmm(d) {
            const hh = String(d.getHours()).padStart(2, "0");
            const mi = String(d.getMinutes()).padStart(2, "0");
            return `${hh}:${mi}`;
        }
        function formatTime(iso) {
            if (!iso) return "";
            const d = new Date(iso);
            return formatHHmm(d);
        }
    </script>
</th:block>

</html>
