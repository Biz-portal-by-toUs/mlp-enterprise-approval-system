<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="subbar"
       th:fragment="reservationSidebar(active)"
       th:with="facilityActive=${active=='meeting' or active=='car' or active=='equipment'}">

  <!-- ✅ fragment 안에 style을 넣어야 th:replace로 가져올 때도 적용됨 -->
  <style>
    /* details 기본 마커(삼각형) 제거 - 크롬/사파리 */
    .subbar-details > summary::-webkit-details-marker { display: none; }

    /* 파이어폭스 포함 표준 marker 제거 */
    .subbar-details > summary::marker { content: ""; }

    /* summary를 a처럼 보이게 + 오른쪽 화살표 자리 확보 */
    summary.subbar-summary {
      cursor: pointer;
      user-select: none;
      width: 100%;
      box-sizing: border-box;

      /* ✅ 토글 표시를 위한 레이아웃 */
      display: flex !important;   /* subbar-item 쪽 display 규칙을 이김 */
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* ✅ 커스텀 화살표(chevron) */
    summary.subbar-summary::after{
      content: "";
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      margin-left: auto;

      /* 테두리로 꺾쇠 만들기 */
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;

      /* 기본: 아래(▾) 느낌 */
      transform: rotate(45deg);
      transition: transform 0.15s ease;
      opacity: 0.9;
    }

    /* ✅ 열렸을 때: 위(▴)로 회전 */
    .subbar-details[open] > summary.subbar-summary::after{
      transform: rotate(-135deg);
    }

    /* 하위 메뉴 레이아웃 */
    .subbar-submenu { display: grid; gap: 4px; margin-top: 4px; }
    .subbar-subitem { padding-left: 24px; }
  </style>

  <div class="subbar-title">예약</div>

  <nav class="subbar-nav" aria-label="예약 메뉴">
    <!-- 회의실 예약 -->
    <a class="subbar-item"
       th:href="@{/meeting-rooms/reservation}"
       th:classappend="${active}=='meeting-reservation' ? ' active' : ''">
      회의실 예약
    </a>

    <!-- 법인 차량 예약 -->
    <a class="subbar-item"
       th:href="@{/corporate-cars/reservation}"
       th:classappend="${active}=='car-reservation' ? ' active' : ''">
      법인 차량 예약
    </a>

    <!-- 공유 설비 예약 -->
    <a class="subbar-item"
       th:href="@{/shared-equipment/reservation}"
       th:classappend="${active}=='equipment-reservation' ? ' active' : ''">
      공유 설비 예약
    </a>

    <!-- 내 예약 조회 -->
    <a class="subbar-item"
       th:href="@{/my-reservations}"
       th:classappend="${active}=='my' ? ' active' : ''">
      내 예약 조회
    </a>

    <!-- ✅ 공유 시설 조회 (토글) -->
    <details class="subbar-details" id="facilityDetails">
      <summary class="subbar-item subbar-summary">
        공유 시설 조회
      </summary>

      <div class="subbar-submenu">
        <a class="subbar-item subbar-subitem"
           th:href="@{/meeting-rooms}"
           th:classappend="${active}=='meeting' ? ' active' : ''">
          회의실 조회
        </a>

        <a class="subbar-item subbar-subitem"
           th:href="@{/corporate-cars}"
           th:classappend="${active}=='car' ? ' active' : ''">
          법인 차량 조회
        </a>

        <a class="subbar-item subbar-subitem"
           th:href="@{/shared-equipment}"
           th:classappend="${active}=='equipment' ? ' active' : ''">
          공유 설비 조회
        </a>
      </div>
    </details>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const details = document.getElementById("facilityDetails");
      if (!details) return;

      const KEY = "subbar:facilityDetailsOpen";

      // 1) 저장된 값이 있으면 그걸로 복원
      const saved = localStorage.getItem(KEY);
      if (saved !== null) {
        if (saved === "true") details.setAttribute("open", "");
        else details.removeAttribute("open");
      }

      // 2) 사용자가 열고/닫을 때마다 저장
      details.addEventListener("toggle", () => {
        localStorage.setItem(KEY, String(details.open));
      });
    });
  </script>

</aside>

</body>
</html>
