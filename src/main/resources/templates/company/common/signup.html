<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bizportal - Company Sign Up</title>
    <style>
        :root{
            --bg:#f3f3f3;
            --text:#111;
            --border:#d7d7d7;
            --primary:#2f66d7;
            --input-bg:#fff;
            --disabled:#9fb2e6;
            --success:#27ae60;
            --error:#e74c3c;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo",
            "Noto Sans KR", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:var(--bg);
            color:var(--text);
        }
        .page{
            min-height:100vh;
            border:2px solid #222;
            margin:12px;
            background:var(--bg);
        }
        header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:26px 28px;
            gap:12px;
            flex-wrap:wrap;
        }
        .brand{
            font-family: Georgia, "Times New Roman", Times, serif;
            font-weight:700;
            font-size:40px;
            letter-spacing:-0.5px;
        }
        .nav-right{ display:flex; gap:14px; align-items:center; }
        .btn{
            appearance:none;
            border:1px solid #cfcfcf;
            background:#f7f7f7;
            padding:10px 18px;
            border-radius:10px;
            font-weight:700;
            cursor:pointer;
            color:#222;
        }

        main{
            min-height:calc(100vh - 110px);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }
        .card{
            width:min(760px, 92vw);
            text-align:center;
        }
        .title{
            font-size:52px;
            font-weight:900;
            margin:0 0 18px;
            letter-spacing:-0.5px;
        }
        .form{
            width:min(680px, 92vw);
            margin:0 auto;
            display:flex;
            flex-direction:column;
            gap:16px;
        }
        .field{ text-align:left; }
        .label{
            font-size:13px;
            font-weight:800;
            color:#777;
            margin:0 0 6px 10px;
            letter-spacing:0.6px;
        }
        .req{
            color:var(--error);
            font-weight:900;
            margin-left:2px;
        }

        /* 통일된 입력 박스 */
        .input-wrap{
            background:var(--input-bg);
            border:1px solid var(--border);
            border-radius:12px;
            padding:8px 12px;
            display:flex;
            align-items:center;
            gap:10px;
            min-height:56px;
        }
        input{
            border:0;
            outline:none;
            width:100%;
            min-width:0;
            font-size:16px;
            background:transparent;
            font-weight:400;
        }
        input::placeholder{ color:#aaa; }
        input[type="file"]{ font-size:14px; }
        input[readonly]{ font-weight:400; }

        .inline-btn{
            border:0;
            background:var(--primary);
            color:#fff;
            font-weight:800;
            padding:0 16px;
            height:40px;
            border-radius:12px;
            cursor:pointer;
            white-space:nowrap;
            font-size:15px;
            flex:0 0 auto;
        }
        .inline-btn:disabled{
            cursor:not-allowed;
            opacity:0.7;
        }

        .primary-btn{
            margin-top:6px;
            border:0;
            background:var(--primary);
            color:#fff;
            font-size:18px;
            font-weight:800;
            padding:16px 18px;
            border-radius:12px;
            cursor:pointer;
            transition: opacity .15s ease;
        }
        .primary-btn:disabled{
            background:var(--disabled);
            cursor:not-allowed;
            opacity:0.85;
        }

        .error{
            display:none;
            color:var(--error);
            border:1px solid #f5c6cb;
            background-color:#f8d7da;
            padding:10px;
            margin:0 auto 14px;
            border-radius:12px;
            width:min(680px, 92vw);
            text-align:left;
            font-weight:700;
        }

        .note{
            margin:8px 0 0 10px;
            font-size:13px;
            color:#666;
            min-height:18px;
        }
        .note-success{
            color: var(--success);
            font-weight: 800;
        }

        /* password rules */
        .pwd-rules{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin:10px 0 0 6px;
        }
        .pwd-rule{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:8px 12px;
            border-radius:12px;
            font-size:14px;
            font-weight:800;
            line-height:1;
            background:#fdecec;
            color:var(--error);
        }
        .pwd-rule.ok{
            background:#eaf7ef;
            color:var(--success);
        }
        .pwd-icon{
            width:18px;height:18px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border-radius:6px;
            font-weight:900;
        }

        /* eye toggle */
        .icon-btn{
            border:0;
            background:transparent;
            cursor:pointer;
            padding:6px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border-radius:10px;
        }
        .icon-btn:hover{ background:#f2f2f2; }
        .icon-btn svg{ width:22px;height:22px;opacity:.55; }

        #pwdMatchMsg{
            font-size:12px;
            margin:6px 0 0 10px;
            font-weight:700;
            min-height:15px;
        }
        .match-success { color: var(--success); }
        .match-error { color: var(--error); }

        /* 사업자등록번호 */
        .brn-wrap{
            display:flex;
            align-items:center;
            gap:12px;
            flex-wrap:wrap;
        }
        .brn-segs{
            display:flex;
            align-items:center;
            gap:10px;
            flex:0 0 auto;
        }
        .dash{
            font-weight:900;
            color:#888;
            user-select:none;
        }
        .seg-wrap{ justify-content:center; }
        #brn1wrap{ width:130px; }
        #brn2wrap{ width:110px; }
        #brn3wrap{ width:150px; }
        .brn-segs input{
            text-align:center;
            font-variant-numeric:tabular-nums;
        }

        /* 주소 */
        .addr-top{
            display:flex;
            gap:12px;
            align-items:stretch;
            flex-wrap:wrap;
        }
        .addr-top .input-wrap{
            flex:1;
            min-width:260px;
        }

        @media (max-width: 640px){
            #brn1wrap{ width:110px; }
            #brn2wrap{ width:90px; }
            #brn3wrap{ width:120px; }
        }

        /* =====================
         * ✅ Admin Credential Modal
         * ===================== */
        .modal-overlay{
            position:fixed; inset:0;
            background:rgba(0,0,0,.45);
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
            z-index:9999;
        }
        .modal-overlay.show{ display:flex; }

        .modal{
            width:min(520px, 92vw);
            background:#fff;
            border-radius:16px;
            border:1px solid #e5e7eb;
            box-shadow:0 20px 60px rgba(0,0,0,.20);
            padding:18px;
            text-align:left;
        }
        .modal-head{
            display:flex;
            justify-content:space-between;
            gap:12px;
            align-items:flex-start;
            margin-bottom:12px;
        }
        .modal-title{ font-size:20px; font-weight:900; letter-spacing:-0.2px; }
        .modal-sub{ font-size:13px; color:#666; margin-top:4px; line-height:1.4; }
        .modal-x{
            border:0;
            background:transparent;
            cursor:pointer;
            font-size:18px;
            padding:6px 10px;
            border-radius:10px;
        }
        .modal-x:hover{ background:#f2f2f2; }

        .modal-body{ display:flex; flex-direction:column; gap:14px; }
        .cred-row{ display:flex; flex-direction:column; gap:6px; }
        .cred-label{ font-size:13px; font-weight:900; color:#777; }
        .cred-box{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            padding:12px 12px;
            border:1px solid var(--border);
            border-radius:12px;
            background:#fafafa;
        }
        .cred-box code{
            font-size:16px;
            font-weight:900;
            color:#111;
        }

        /* ✅ Copy icon button */
        .copy-btn{
            border:0;
            background:var(--primary);
            color:#fff;
            font-weight:900;
            padding:8px 12px;
            border-radius:10px;
            cursor:pointer;
            white-space:nowrap;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:6px;
            transition: transform .08s ease, opacity .12s ease;
        }
        .copy-btn:active{ transform: translateY(1px); }
        .copy-btn.icon-only{
            width:40px;
            height:36px;
            padding:0;
        }
        .copy-btn.icon-only svg{
            width:18px;
            height:18px;
            color:#fff;
        }
        .copy-btn.copied{
            opacity:.95;
        }

        .copy-msg{ font-size:12px; min-height:14px; color:var(--success); font-weight:800; }

        .modal-actions{
            display:flex;
            justify-content:flex-end;
            margin-top:6px;
        }
    </style>
</head>

<body>
<div class="page">
    <header>
        <div class="brand">Bizportal</div>
        <div class="nav-right">
            <button class="btn" type="button" th:onclick="|location.href='@{/}'|">메인</button>
            <button class="btn" type="button" th:onclick="|location.href='@{/auth/companies/login}'|">로그인</button>
        </div>
    </header>

    <main>
        <section class="card">
            <h1 class="title">Sign Up</h1>

            <div id="serverError" class="error"></div>

            <form id="company-signup-form" class="form" enctype="multipart/form-data">

                <div class="field">
                    <div class="label">기업 이름<span class="req">*</span></div>
                    <div class="input-wrap">
                        <input name="comName" id="comName" type="text" placeholder="예) Samsung" maxlength="50" required />
                    </div>
                    <div id="comNameWarn" class="note"></div>
                </div>

                <div class="field">
                    <div class="label">회사코드 (3글자)<span class="req">*</span></div>
                    <div class="input-wrap">
                        <input name="comId" id="comId" type="text" placeholder="예) SAM" maxlength="3" required />
                        <button class="inline-btn" id="comIdCheckBtn" type="button">중복확인</button>
                    </div>
                    <div id="comIdMsg" class="note"></div>
                    <div id="comIdWarn" class="note"></div>
                </div>

                <div class="field">
                    <div class="label">사업자 등록번호<span class="req">*</span></div>

                    <div class="brn-wrap">
                        <div class="brn-segs">
                            <div class="input-wrap seg-wrap" id="brn1wrap">
                                <input id="brn1" type="text" inputmode="numeric" placeholder="101" maxlength="3" required />
                            </div>
                            <span class="dash">-</span>
                            <div class="input-wrap seg-wrap" id="brn2wrap">
                                <input id="brn2" type="text" inputmode="numeric" placeholder="20" maxlength="2" required />
                            </div>
                            <span class="dash">-</span>
                            <div class="input-wrap seg-wrap" id="brn3wrap">
                                <input id="brn3" type="text" inputmode="numeric" placeholder="03030" maxlength="5" required />
                            </div>

                            <input name="brn" id="brn" type="hidden" />
                        </div>

                        <button class="inline-btn" id="brnVerifyBtn" type="button">인증하기</button>
                    </div>

                    <div id="brnMsg" class="note"></div>
                </div>

                <div class="field">
                    <div class="label">회사 이메일<span class="req">*</span></div>
                    <div class="input-wrap">
                        <input name="email" id="email" type="email" placeholder="예) admin@company.com" maxlength="50" required />
                        <button class="inline-btn" id="emailCheckBtn" type="button">중복확인</button>
                    </div>
                    <div id="emailMsg" class="note"></div>
                </div>

                <div class="field">
                    <div class="label">비밀번호<span class="req">*</span></div>
                    <div class="input-wrap">
                        <input name="pwd" id="pwd" type="password" placeholder="••••••••" autocomplete="new-password" required />
                        <button class="icon-btn" id="togglePwdBtn" type="button" aria-label="비밀번호 보기/숨기기">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <div class="pwd-rules" id="pwdRules">
                        <span class="pwd-rule" id="ruleUpper"><span class="pwd-icon">✗</span>영어 대문자</span>
                        <span class="pwd-rule" id="ruleLower"><span class="pwd-icon">✗</span>영어 소문자</span>
                        <span class="pwd-rule" id="ruleNumber"><span class="pwd-icon">✗</span>숫자</span>
                        <span class="pwd-rule" id="ruleSpecial"><span class="pwd-icon">✗</span>특수문자</span>
                        <span class="pwd-rule" id="ruleLen"><span class="pwd-icon">✗</span>8자 이상 20자 이내</span>
                    </div>
                </div>

                <div class="field">
                    <div class="label">비밀번호 확인<span class="req">*</span></div>
                    <div class="input-wrap">
                        <input id="pwdConfirm" type="password" placeholder="••••••••" autocomplete="new-password" required />
                        <button class="icon-btn" id="togglePwdConfirmBtn" type="button" aria-label="비밀번호 확인 보기/숨기기">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div id="pwdMatchMsg"></div>
                </div>

                <div class="field">
                    <div class="label">주소<span class="req">*</span></div>

                    <div class="addr-top">
                        <div class="input-wrap">
                            <input id="zipNo" name="zipNo" type="text" placeholder="우편번호" readonly />
                        </div>
                        <button class="inline-btn" id="addrSearchBtn" type="button">주소 검색</button>
                    </div>

                    <div style="height:12px;"></div>

                    <div class="input-wrap">
                        <input name="addr" id="addr" type="text" placeholder="도로명 주소" readonly required />
                    </div>

                    <div style="height:12px;"></div>

                    <div class="input-wrap">
                        <input name="addrDetail" id="addrDetail" type="text" placeholder="상세 주소를 입력하세요" />
                    </div>

                    <div id="addrMsg" class="note"></div>
                </div>

                <div class="field">
                    <div class="label">로고 파일 첨부</div>
                    <div class="input-wrap">
                        <input name="logo" id="logo" type="file" accept="image/*" />
                    </div>

                    <div id="logoPreview" style="display:none; margin-top:10px; border:1px dashed #bbb; border-radius:12px; padding:10px; background:#fff; align-items:center; gap:12px;">
                        <img id="logoImg" alt="logo preview" style="width:54px;height:54px;object-fit:cover;border-radius:12px;border:1px solid #ddd;"/>
                        <div id="logoMeta" style="font-size:13px;color:#555;font-weight:700;"></div>
                    </div>
                </div>

                <button class="primary-btn" id="signupBtn" type="submit" disabled>Create Account</button>

                <div class="note" id="brnNote" style="margin-left:0;">
                    * 기업 이름, 비밀번호 조건/일치, 주소 입력 + 사업자등록번호 인증 + 회사코드 중복확인 + 이메일 중복확인이 모두 완료되어야 회원가입 버튼이 활성화됩니다.
                </div>

            </form>
        </section>
    </main>
</div>

<!-- ✅ 관리자 계정 팝업(모달) -->
<div id="adminModal" class="modal-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
        <div class="modal-head">
            <div>
                <div id="adminModalTitle" class="modal-title">관리자 계정 발급 완료</div>
                <div class="modal-sub">아래 정보를 복사해 보관하세요. (최초 로그인 후 비밀번호 변경 권장)</div>
            </div>
            <button type="button" class="modal-x" id="adminModalClose" aria-label="닫기">✕</button>
        </div>

        <div class="modal-body">
            <div class="cred-row">
                <div class="cred-label">관리자 사번</div>
                <div class="cred-box">
                    <code id="adminEmpIdText">-</code>
                    <button type="button" class="copy-btn icon-only" id="copyEmpIdBtn" aria-label="사번 복사" data-mode="copy">
                        <!-- clipboard icon -->
                        <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <!-- check icon (hidden by default) -->
                        <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
                            <path d="M20 6 9 17l-5-5"></path>
                        </svg>
                    </button>
                </div>
                <div class="copy-msg" id="copyEmpIdMsg"></div>
            </div>

            <div class="cred-row">
                <div class="cred-label">임시 비밀번호</div>
                <div class="cred-box">
                    <code id="adminPwdText">-</code>
                    <button type="button" class="copy-btn icon-only" id="copyPwdBtn" aria-label="비밀번호 복사" data-mode="copy">
                        <!-- clipboard icon -->
                        <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <!-- check icon -->
                        <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
                            <path d="M20 6 9 17l-5-5"></path>
                        </svg>
                    </button>
                </div>
                <div class="copy-msg" id="copyPwdMsg"></div>
            </div>

            <div class="modal-actions">
                <button type="button" class="primary-btn" id="goLoginBtn" style="margin:0;">로그인하러 가기</button>
            </div>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('company-signup-form');
    const serverError = document.getElementById('serverError');

    const signupBtn = document.getElementById('signupBtn');
    const brnNote = document.getElementById('brnNote');

    const comNameInput = document.getElementById('comName');
    const comNameWarn = document.getElementById('comNameWarn');

    const comIdInput = document.getElementById('comId');
    const comIdCheckBtn = document.getElementById('comIdCheckBtn');
    const comIdMsg = document.getElementById('comIdMsg');
    const comIdWarn = document.getElementById('comIdWarn');

    const emailInput = document.getElementById('email');
    const emailCheckBtn = document.getElementById('emailCheckBtn');
    const emailMsg = document.getElementById('emailMsg');

    const pwdInput = document.getElementById('pwd');
    const pwdConfirmInput = document.getElementById('pwdConfirm');
    const pwdMatchMsg = document.getElementById('pwdMatchMsg');

    const togglePwdBtn = document.getElementById('togglePwdBtn');
    const togglePwdConfirmBtn = document.getElementById('togglePwdConfirmBtn');

    const ruleUpper = document.getElementById('ruleUpper');
    const ruleLower = document.getElementById('ruleLower');
    const ruleNumber = document.getElementById('ruleNumber');
    const ruleSpecial = document.getElementById('ruleSpecial');
    const ruleLen = document.getElementById('ruleLen');

    const brn1Input = document.getElementById('brn1');
    const brn2Input = document.getElementById('brn2');
    const brn3Input = document.getElementById('brn3');
    const brnHidden = document.getElementById('brn');
    const brnVerifyBtn = document.getElementById('brnVerifyBtn');
    const brnMsg = document.getElementById('brnMsg');

    const zipNoInput = document.getElementById('zipNo');
    const addrInput = document.getElementById('addr');
    const addrDetailInput = document.getElementById('addrDetail');
    const addrSearchBtn = document.getElementById('addrSearchBtn');
    const addrMsg = document.getElementById('addrMsg');

    const logoInput = document.getElementById('logo');
    const logoPreview = document.getElementById('logoPreview');
    const logoImg = document.getElementById('logoImg');
    const logoMeta = document.getElementById('logoMeta');

    let brnVerified = false;
    let comIdChecked = false;
    let emailChecked = false;

    function showError(msg) {
        serverError.textContent = msg || '요청 처리 중 오류가 발생했습니다.';
        serverError.style.display = 'block';
    }

    async function readJsonSafely(res) {
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) return await res.json();
        const text = await res.text();
        try { return JSON.parse(text); } catch { return { message: text }; }
    }

    function setNote(el, msg, ok) {
        el.textContent = msg || '';
        el.classList.remove('note-success');
        el.style.color = ok ? 'var(--success)' : 'var(--error)';
        if (ok) el.classList.add('note-success');
    }

    function isFilled(v) { return (v || '').trim().length > 0; }

    function normalizeComId() {
        return (comIdInput.value || '').trim().toUpperCase();
    }

    function normalizeBrn() {
        const b1 = (brn1Input.value || '').replace(/\D/g, '');
        const b2 = (brn2Input.value || '').replace(/\D/g, '');
        const b3 = (brn3Input.value || '').replace(/\D/g, '');
        const combined = (b1 + b2 + b3).trim();
        brnHidden.value = combined;
        return combined;
    }

    function setBrnMsg(msg, ok) {
        brnMsg.textContent = msg || '';
        brnMsg.style.color = ok ? 'var(--success)' : 'var(--error)';
    }

    function resetBrnVerifyState() {
        if (!brnVerified) return;
        brnVerified = false;
        brnVerifyBtn.disabled = false;
        brnVerifyBtn.textContent = '인증하기';
        brnMsg.textContent = '';
        brnMsg.style.color = '';
        updateSignupButtonState();
    }

    function handleBrnInput(current, next, maxLen) {
        current.addEventListener('input', () => {
            current.value = (current.value || '').replace(/\D/g, '').slice(0, maxLen);
            normalizeBrn();
            resetBrnVerifyState();
            if (current.value.length === maxLen && next) next.focus();
        });

        current.addEventListener('beforeinput', (e) => {
            if (!e.inputType || !e.inputType.startsWith('insert')) return;
            const data = e.data ?? '';
            if (data && /\D/.test(data)) {
                e.preventDefault();
                setBrnMsg('사업자등록번호는 숫자만 입력 가능합니다.', false);
            }
        });
    }

    handleBrnInput(brn1Input, brn2Input, 3);
    handleBrnInput(brn2Input, brn3Input, 2);
    handleBrnInput(brn3Input, null, 5);

    function isValidEmailFormat(v) {
        const email = (v || '').trim();
        return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
    }

    function setRule(el, ok){
        el.classList.toggle('ok', ok);
        const icon = el.querySelector('.pwd-icon');
        if (icon) icon.textContent = ok ? '✓' : '✗';
    }

    function checkPwdRules(pwd){
        const hasUpper = /[A-Z]/.test(pwd);
        const hasLower = /[a-z]/.test(pwd);
        const hasNumber = /[0-9]/.test(pwd);
        const hasSpecial = /[^A-Za-z0-9]/.test(pwd);
        const len = (pwd || '').length;
        const hasLen = len >= 8 && len <= 20;

        setRule(ruleUpper, hasUpper);
        setRule(ruleLower, hasLower);
        setRule(ruleNumber, hasNumber);
        setRule(ruleSpecial, hasSpecial);
        setRule(ruleLen, hasLen);

        return hasUpper && hasLower && hasNumber && hasSpecial && hasLen;
    }

    function isBasicFieldsReady() {
        const comNameOk = isFilled(comNameInput.value);
        const addrOk = isFilled(addrInput.value);
        const pwdOk = isFilled(pwdInput.value);
        const pwdConfirmOk = isFilled(pwdConfirmInput.value);

        const pwdMatch = pwdOk && pwdConfirmOk && (pwdInput.value === pwdConfirmInput.value);
        const rulesOk = checkPwdRules(pwdInput.value);

        return comNameOk && addrOk && pwdOk && pwdConfirmOk && pwdMatch && rulesOk;
    }

    function updateSignupButtonState() {
        const basicReady = isBasicFieldsReady();
        const ready = basicReady && brnVerified && comIdChecked && emailChecked;
        signupBtn.disabled = !ready;

        if (!ready) {
            brnNote.classList.remove('note-success');
            const missing = [];

            if (!isFilled(comNameInput.value)) missing.push('기업 이름');
            if (!isFilled(pwdInput.value)) missing.push('비밀번호');
            if (!isFilled(addrInput.value)) missing.push('주소');
            if (!comIdChecked) missing.push('회사코드 중복확인');
            if (!emailChecked) missing.push('이메일 중복확인');
            if (!brnVerified) missing.push('사업자등록번호 인증');

            const pwd = pwdInput.value || '';
            if (pwd) {
                if (!/[A-Z]/.test(pwd)) missing.push('영어 대문자');
                if (!/[a-z]/.test(pwd)) missing.push('영어 소문자');
                if (!/[0-9]/.test(pwd)) missing.push('숫자');
                if (!/[^A-Za-z0-9]/.test(pwd)) missing.push('특수문자');
                if (pwd.length < 8 || pwd.length > 20) missing.push('8자 이상 20자 이내');
            } else {
                missing.push('비밀번호 조건');
            }

            if (!isFilled(pwdConfirmInput.value)) missing.push('비밀번호 확인');
            if (isFilled(pwdInput.value) && isFilled(pwdConfirmInput.value) && pwdInput.value !== pwdConfirmInput.value) {
                missing.push('비밀번호 일치');

            brnNote.textContent = '* 다음 항목을 완료해야 회원가입 버튼이 활성화됩니다: ' + missing.join(', ');

    }

       * ===================== */
    const SKIP_BRN_VERIFY_FOR_LOCAL = true;
    /* =====================
     * 사업자 인증
     * ===================== */
    brnVerifyBtn.addEventListener('click', async () => {
        serverError.style.display = 'none';
        serverError.textContent = '';
        brnMsg.textContent = '';
        brnMsg.style.color = '';

        const brn = normalizeBrn();

        if (brn.length !== 10) {
            setBrnMsg('사업자등록번호를 3-2-5 자리로 모두 입력해주세요.', false);
            if (brn1Input.value.length < 3) brn1Input.focus();
            else if (brn2Input.value.length < 2) brn2Input.focus();
            else brn3Input.focus();
            return;
        }

        // :흰색_확인_표시: 로컬 테스트용: 버튼 누르면 바로 인증완료 처리
        if (SKIP_BRN_VERIFY_FOR_LOCAL) {
            brnVerified = true;
            brnVerifyBtn.textContent = '인증완료';
            brnVerifyBtn.disabled = true;
            setBrnMsg('✓ (로컬 테스트) 사업자등록번호 인증이 완료되었습니다.', true);
            updateSignupButtonState();
            return;
        }

        try {
            brnVerifyBtn.disabled = true;
            brnVerifyBtn.textContent = '인증중...';

            const fd = new FormData();
            fd.set('brn', brn);

            const comId = normalizeComId();
            if (comId) fd.set('comId', comId);

            const res = await fetch('/auth/companies/verify-brn', { method: 'POST', body: fd });
            const result = await readJsonSafely(res);

            if (!res.ok) {
                brnVerified = false;
                setBrnMsg(result?.message || '✗ 사업자 인증에 실패했습니다.', false);
                brnVerifyBtn.disabled = false;
                brnVerifyBtn.textContent = '인증하기';
                updateSignupButtonState();
                return;
            }

            const verified = (typeof result === 'boolean')
                ? result
                : (result?.verified !== undefined ? !!result.verified : true);

            if (!verified) {
                brnVerified = false;
                setBrnMsg(result?.message || '✗ 사업자 인증에 실패했습니다.', false);
                brnVerifyBtn.disabled = false;
                brnVerifyBtn.textContent = '인증하기';
                updateSignupButtonState();
                return;
            }

            brnVerified = true;
            brnVerifyBtn.textContent = '인증완료';
            brnVerifyBtn.disabled = true;

            setBrnMsg(result?.message || '✓ 사업자등록번호 인증이 완료되었습니다.', true);
            updateSignupButtonState();
        } catch (err) {
            console.error(err);
            brnVerified = false;
            setBrnMsg('✗ 사업자 인증 요청 중 오류가 발생했습니다.', false);
            brnVerifyBtn.disabled = false;
            brnVerifyBtn.textContent = '인증하기';
            updateSignupButtonState();
        }
    });

    async function copyTextWithFeedback(text, btn, msgEl){
        try{
            await navigator.clipboard.writeText(text);
            setCopiedUI(btn, msgEl);
        }catch(err){
            // fallback
            try{
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                setCopiedUI(btn, msgEl);
            }catch(e){
                msgEl.textContent = '복사에 실패했습니다.';
                setTimeout(() => msgEl.textContent = '', 1200);
            }
        }
    }

    copyEmpIdBtn.addEventListener('click', () => {
        const v = adminEmpIdText.textContent || '';
        if (v && v !== '-') copyTextWithFeedback(v, copyEmpIdBtn, copyEmpIdMsg);
    });

    copyPwdBtn.addEventListener('click', () => {
        const v = adminPwdText.textContent || '';
        if (v && v !== '-') copyTextWithFeedback(v, copyPwdBtn, copyPwdMsg);
    });

    goLoginBtn.addEventListener('click', () => {
        window.location.href = '/auth/companies/login';
    });

    /* =====================
     * submit
     * ===================== */
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        serverError.style.display = 'none';
        serverError.textContent = '';

        if (!isBasicFieldsReady()) {
            showError('기업 이름, 비밀번호 조건/일치, 주소를 모두 입력해주세요.');
            return;
        }

        if (!(brnVerified && comIdChecked && emailChecked)) {
            showError('사업자 인증, 회사코드 중복확인, 이메일 중복확인을 모두 완료해주세요.');
            return;
        }

        const fd = new FormData(form);
        fd.set('comId', normalizeComId());
        fd.set('brn', normalizeBrn());

        const road = (addrInput.value || '').trim();
        const detail = (addrDetailInput.value || '').trim();
        fd.set('addr', detail ? `${road} ${detail}` : road);

        try {
            signupBtn.disabled = true;

            const res = await fetch('/auth/companies/signup', { method: 'POST', body: fd });
            const result = await readJsonSafely(res);

            if (res.ok) {
                // ✅ 응답: new ResponseDto<>(HttpStatus.CREATED, "회사 회원가입 성공", createEmployee)
                const admin = result?.data ?? null;
                const empId = admin?.empId;
                const pwd = admin?.pwd;

                if (!empId || !pwd) {
                    alert((result?.message || '회사 회원가입 성공') + '\n(관리자 계정 정보가 응답에 없습니다. ResponseDto의 data 필드를 확인해주세요.)');
                    window.location.href = '/auth/employee/login';
                    return;
                }

                openAdminModal(empId, pwd);
                // 모달에서 복사 후 로그인 이동
            } else {
                showError(result?.message || '회원가입에 실패했습니다.');
                signupBtn.disabled = false;
            }
        } catch (err) {
            console.error(err);
            showError('회원가입 요청 중 오류가 발생했습니다.');
            signupBtn.disabled = false;
        }
    });

    // 최초 렌더
    checkPwdRules(pwdInput.value || '');
    updateSignupButtonState();
</script>
</body>
</html>
