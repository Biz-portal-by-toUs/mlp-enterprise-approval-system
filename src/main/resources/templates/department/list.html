<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>부서 편성</title>

    <!-- ✅ layout.html의 <th:block layout:fragment="pageStyles">로 들어감 -->
    <th:block layout:fragment="pageStyles">
        <style>

            .admin-page .page-title{font-size:34px;font-weight:900;margin:10px 0 8px}
            .admin-page .page-sub{font-size:18px;font-weight:800;margin:0 0 20px;color:#111}
            .admin-page .actions{display:flex;justify-content:flex-end;margin:0 0 14px}

            .admin-page .btn{
                border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;
                background:var(--primary);color:#fff;box-shadow:0 10px 20px rgba(47,111,218,.25);
            }

            .admin-page .card{
                background:#f1f3f6; border-radius:18px; padding:22px; min-height:520px;
            }

            .admin-page .table{
                width:100%; border-collapse:separate; border-spacing:0 14px;
            }
            .admin-page .thead{background:#fff;border-radius:14px;}
            .admin-page .thead th{ text-align:left; padding:14px 18px; font-size:14px; color:#111; }

            .admin-page .row{background:#fff;border-radius:14px;}
            .admin-page .row td{ padding:18px; font-size:14px; color:#111; }
            .admin-page .row td:first-child{border-top-left-radius:14px;border-bottom-left-radius:14px}
            .admin-page .row td:last-child{border-top-right-radius:14px;border-bottom-right-radius:14px}

            .admin-page .pill-btn{
                padding:8px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:800;font-size:13px;
            }
            .admin-page .pill-edit{background:#eaf2ff;color:#2b5db8}
            .admin-page .pill-del{background:#fdecec;color:#c62828;margin-left:10px}

            .admin-page .empty{
                padding:40px 10px;text-align:center;color:var(--muted);font-weight:700
            }

            .admin-page .toast{
                display:none;
                margin-top:14px;
                padding:12px 14px;
                border-radius:12px;
                background:#fff;
                border:1px solid var(--line);
                font-weight:800;
            }
            .admin-page .toast.ok{color:#1b7f3a;border-color:#bfe7c9;background:#f3fff6}
            .admin-page .toast.err{color:#b42318;border-color:#ffd0cc;background:#fff5f4}
        </style>
    </th:block>
</head>

<body>
<!-- ✅ layout.html의 content 영역으로 들어감 -->
<div layout:fragment="content" class="admin-page">

    <div class="page-with-subbar">
        <!-- ✅ 관리자 사이드바(fragment) -->
        <div th:replace="~{sidebar/admin-sidebar :: adminSidebar('dept')}"></div>

        <!-- ✅ 페이지 본문 -->
        <main class="page-content">
            <div class="page-title">부서 편성</div>
            <div class="page-sub">부서 조회</div>

            <div class="actions">
                <button class="btn" type="button"
                        onclick="location.href='/admin/departments/create'">부서 등록</button>
            </div>

            <section class="card">
                <table class="table">
                    <thead class="thead">
                    <tr>
                        <th style="width:28%;">부서 코드</th>
                        <th style="width:34%;">부서명</th>
                        <th style="width:18%;">사원 수</th>
                        <th style="width:20%;">관리</th>
                    </tr>
                    </thead>
                    <tbody id="deptTbody"></tbody>
                </table>

                <div id="emptyBox" class="empty" style="display:none;">등록된 부서가 없습니다.</div>
                <div id="toast" class="toast"></div>
            </section>
        </main>
    </div>

</div>

<!-- ✅ layout.html의 <th:block layout:fragment="pageScripts">로 들어감 -->
<th:block layout:fragment="pageScripts">
    <script>
        function showToast(msg, type) {
            const toast = document.getElementById("toast");
            toast.className = "toast " + (type || "");
            toast.textContent = msg;
            toast.style.display = "block";
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => toast.style.display = "none", 2500);
        }

        async function safeJson(res) {
            const ct = res.headers.get("content-type") || "";
            if (!ct.includes("application/json")) return {};
            try { return await res.json(); } catch { return {}; }
        }

        async function loadDepartments() {
            const tbody = document.getElementById("deptTbody");
            const emptyBox = document.getElementById("emptyBox");
            tbody.innerHTML = "";
            emptyBox.style.display = "none";

            const res = await fetch("/api/v1/admin/departments", {
                method: "GET",
                credentials: "include",
                headers: { "Accept": "application/json" }
            });

            if (res.status === 401) { emptyBox.style.display="block"; emptyBox.textContent="로그인이 필요합니다. 다시 로그인 해주세요."; return; }
            if (res.status === 403) { emptyBox.style.display="block"; emptyBox.textContent="권한이 없습니다. (COM_ADMIN만 가능)"; return; }
            if (!res.ok) { emptyBox.style.display="block"; emptyBox.textContent="부서 조회 중 오류가 발생했습니다. ("+res.status+")"; return; }

            const json = await safeJson(res);
            const list = json.data || [];
            if (!list.length) { emptyBox.style.display="block"; emptyBox.textContent="등록된 부서가 없습니다."; return; }

            list.forEach(d => {
                const depNo = d.depNo;
                const depId = d.depId ?? "";
                const depName = d.depName ?? "";
                const empCount = Number(d.empCount ?? 0).toLocaleString();

                const tr = document.createElement("tr");
                tr.className = "row";
                tr.innerHTML = `
            <td>${escapeHtml(depId)}</td>
            <td>${escapeHtml(depName)}</td>
            <td>${empCount}</td>
            <td>
              <button class="pill-btn pill-edit" type="button" onclick="onEdit(${depNo})">수정</button>
              <button class="pill-btn pill-del" type="button" onclick="onDelete(${depNo}, '${escapeJs(depName)}')">삭제</button>
            </td>
          `;
                tbody.appendChild(tr);
            });
        }

        function onEdit(depNo) { location.href = `/admin/departments/${depNo}/edit`; }

        async function onDelete(depNo, depName) {
            const ok = confirm(`정말로 '${depName}' 부서를 삭제할까요?\n(삭제 후 복구 불가)`);
            if (!ok) return;

            try {
                const res = await fetch(`/api/v1/admin/departments/${depNo}`, {
                    method: "DELETE",
                    credentials: "include",
                    headers: { "Accept": "application/json" }
                });

                if (res.status === 401) return showToast("로그인이 필요합니다. 다시 로그인 해주세요.", "err");
                if (res.status === 403) return showToast("권한이 없습니다. (COM_ADMIN만 가능)", "err");

                if (!res.ok) {
                    let msg = `삭제 실패 (${res.status})`;
                    const json = await safeJson(res);
                    if (json && (json.message || json.error)) msg = json.message || json.error;
                    return showToast(msg, "err");
                }

                showToast("삭제되었습니다.", "ok");
                await loadDepartments();
            } catch (e) {
                console.error(e);
                showToast("삭제 중 예외가 발생했습니다.", "err");
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&","&amp;")
                .replaceAll("<","&lt;")
                .replaceAll(">","&gt;")
                .replaceAll("\"","&quot;")
                .replaceAll("'","&#039;");
        }
        function escapeJs(str) { return String(str).replaceAll("\\","\\\\").replaceAll("'","\\'"); }

        window.addEventListener("DOMContentLoaded", () => {
            loadDepartments().catch(err => {
                console.error(err);
                const emptyBox = document.getElementById("emptyBox");
                emptyBox.style.display = "block";
                emptyBox.textContent = "부서 조회 중 예외가 발생했습니다.";
            });
        });
    </script>
</th:block>
</body>
</html>
