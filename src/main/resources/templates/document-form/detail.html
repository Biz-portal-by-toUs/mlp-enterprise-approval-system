<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:classappend="${perm_isEmployee == true} ? 'role-employee' : ''"
      th:attr="
        data-is-employee=${perm_isEmployee == true ? 'true' : 'false'},
        data-can-edit=${perm_canEdit == true ? 'true' : 'false'},
        data-can-delete=${perm_canDelete == true ? 'true' : 'false'},
        data-can-approve=${perm_canApprove == true ? 'true' : 'false'}
      ">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 서버에서 docfoNo 주입 -->
    <meta name="template-id" th:content="${docfoNo}" />
    <title>문서양식 상세</title>

    <link rel="stylesheet" href="/css/editor-preset-header.css" />

    <style>
        .tpl-header{max-width:980px;margin:0 auto 18px}
        .tpl-titleLine{display:flex;justify-content:center;margin:6px 0 18px}
        .tpl-title{margin:0;font-size:36px;font-weight:900;line-height:1.2;text-align:center;white-space:nowrap}

        .tpl-presetHeader{max-width:980px;margin:0 auto 18px;display:grid;grid-template-columns:1fr 1.6fr;gap:28px;align-items:flex-start}
        .tpl-presetRight{justify-self:end}
        .tpl-presetHeader table{width:100%;border-collapse:collapse;border:1px solid #d7dbe3}
        .tpl-presetHeader td,.tpl-presetHeader th{border:1px solid #d7dbe3;padding:8px 10px;vertical-align:top}

        .tpl-presetLeft td:first-child{width:30%;white-space:nowrap}
        .tpl-presetLeft td:last-child{width:70%}

        .tpl-presetRight tr:first-child th{background:#f4f6fb;font-weight:600;padding:10px 8px;text-align:center}
        .tpl-presetRight tr:nth-child(2) th,.tpl-presetRight tr:nth-child(2) td{height:100px;vertical-align:middle}
        .tpl-presetRight tr:nth-child(2) th{background:#f4f6fb;font-weight:600;text-align:center}

        .tpl-catsBox{margin-top:12px;border:1px solid #e6e6e6;border-radius:14px;background:#fff;padding:10px 12px}
        .tpl-cats{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
        .tpl-catRadio{pointer-events:none}
        .tpl-catItem{display:inline-flex;align-items:center;gap:8px;padding:4px 2px}
        .tpl-catItem input[type="radio"]{transform:translateY(1px)}
        .tpl-pill{border:0;border-radius:0;padding:0;background:transparent;font-size:13px}
        .tpl-muted{color:#777;font-size:13px;font-weight:700}

        #templateMount{max-width:980px;margin:0 auto}
        #templateMount .tpl-bodyBox{background:#fff;border:1px solid #e1e3ea;border-radius:14px;padding:24px 28px;overflow-x:auto;font-family:inherit}
        #templateMount .tpl-bodyBox [data-ta="left"]{text-align:left !important}
        #templateMount .tpl-bodyBox [data-ta="center"]{text-align:center !important}
        #templateMount .tpl-bodyBox [data-ta="right"]{text-align:right !important}

        .tpl-bodyBox p,.tpl-bodyBox h1,.tpl-bodyBox h2,.tpl-bodyBox h3{margin:8px 0}
        .tpl-bodyBox h1{font-size:28px;line-height:1.25}
        .tpl-bodyBox h2{font-size:22px;line-height:1.28}
        .tpl-bodyBox h3{font-size:18px;line-height:1.3}

        .tpl-bodyBox table{border-collapse:collapse;width:100%;table-layout:fixed;border:1px solid #d7dbe3}
        .tpl-bodyBox td,.tpl-bodyBox th{border:1px solid #d7dbe3;padding:8px 10px;vertical-align:top}
        .tpl-bodyBox th{background:#f4f6fb;font-weight:700;text-align:center}

        /* TipTap InputField 보호 */
        .tpl-bodyBox input[data-input-field]{pointer-events:none;background-color:#f5f5f5;border:1px dashed #bbb;padding:4px 6px;border-radius:6px}

        body{padding-bottom:92px}

        .tpl-footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(6px);border-top:1px solid #e6e6e6;padding:12px 0;z-index:9999}
        .tpl-footerInner{max-width:980px;margin:0 auto;padding:0 16px;display:flex;justify-content:flex-end;gap:10px}
        .tpl-footerBtn{padding:10px 16px;border-radius:12px;border:1px solid #e6e6e6;background:#fff;cursor:pointer;font-size:14px;font-weight:700}

        .tpl-danger{background:#fff;border-color:#ff4d4f;color:#ff4d4f}
        .tpl-danger:hover{background:#ff4d4f;color:#fff}

        #tplEditBtn{background:#2c5cff;border-color:#2c5cff;color:#fff}
        #tplEditBtn:hover{filter:brightness(0.95)}

        #tplApproveBtn{background:#2c5cff;border-color:#2c5cff;color:#fff}
        #tplApproveBtn:hover{filter:brightness(0.95)}

        /* 서버에서 role-employee 붙이면 자동 hide */
        .role-employee #tplEditBtn,
        .role-employee #tplDeleteBtn{
            display:none !important;
        }
    </style>
</head>

<body>
<div id="tplHeaderRoot" class="tpl-header">
    <div class="tpl-titleLine">
        <h1 class="tpl-title" id="tplTitle">-</h1>
    </div>

    <div class="tpl-catsBox">
        <div class="tpl-cats" id="tplCats">
            <span class="tpl-muted">카테고리 없음</span>
        </div>
    </div>
</div>

<div id="templateMount">로딩 중...</div>

<div id="tplFooterRoot" class="tpl-footer">
    <div class="tpl-footerInner">
        <!-- DOM은 유지, JS가 권한에 따라 표시/비활성 처리 -->
        <button type="button" class="tpl-footerBtn" id="tplApproveBtn">결재</button>
        <button type="button" class="tpl-footerBtn" id="tplEditBtn">수정</button>
        <button type="button" class="tpl-footerBtn tpl-danger" id="tplDeleteBtn">삭제</button>
        <button type="button" class="tpl-footerBtn" id="tplCloseBtn">닫기</button>
    </div>
</div>

<script type="importmap">
    {
      "imports": {
        "@tiptap/core": "https://esm.sh/@tiptap/core@2.11.2?target=es2020",
        "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@2.11.2?target=es2020",

        "@tiptap/extension-table": "https://esm.sh/@tiptap/extension-table@2.11.2?target=es2020",
        "@tiptap/extension-table-row": "https://esm.sh/@tiptap/extension-table-row@2.11.2?target=es2020",
        "@tiptap/extension-table-cell": "https://esm.sh/@tiptap/extension-table-cell@2.11.2?target=es2020",
        "@tiptap/extension-table-header": "https://esm.sh/@tiptap/extension-table-header@2.11.2?target=es2020",

        "@tiptap/extension-underline": "https://esm.sh/@tiptap/extension-underline@2.11.2?target=es2020",
        "@tiptap/extension-text-align": "https://esm.sh/@tiptap/extension-text-align@2.11.2?target=es2020",
        "@tiptap/extension-text-style": "https://esm.sh/@tiptap/extension-text-style@2.11.2?target=es2020"
      }
    }
</script>

<script type="module" src="/js/document-form/detail-form.js"></script>
</body>
</html>
