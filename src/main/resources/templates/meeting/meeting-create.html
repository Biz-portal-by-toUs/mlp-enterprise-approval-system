<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>새 회의 생성 - Bizportal</title>
    <style>
        .container-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: stretch; }
        .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; height: 100%; }
        .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 18px; font-weight: 800; color: var(--primary2); }
        .field { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
        input, select { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #f8fafc; padding: 10px 14px; font-size: 14px; transition: 0.2s; outline: none; }
        input:focus, select:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px var(--blueSoft); }
        .recording-section { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line); }
        .rec-controls { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
        #recTimer { font-family: 'Pretendard', sans-serif; font-size: 22px; font-weight: 200; color: #000; min-width: 90px; }
        .btn-group { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .btn { height: 38px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s ease; }
        .btn:hover:not(:disabled) { filter: brightness(0.92); }
        .btn.success { background: var(--success); color: #fff; border: none; }
        .btn.warning { background: var(--warn); color: #fff; border: none; }
        .btn.danger { background: var(--danger); color: #fff; border: none; }
        .btn.primary { background: var(--primary); color: #fff; border: none; width: 100%; height: 52px; font-size: 15px; margin-top: 15px; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .selected-box { min-height: 52px; padding: 8px; background: #f8fafc; border: 1px dashed var(--line); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .pill { background: #fff; border: 1px solid var(--primary); color: var(--primary); padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
        .pill button { border: none; background: none; color: var(--danger); cursor: pointer; font-size: 14px; }
        .list-container {
            flex: 1 1 0;           /* grow:1, shrink:1, basis:0 적용 */
            min-height: 200px;     /* 최소 높이는 유지 */
            overflow-y: auto;      /* 넘치면 내부 스크롤 생성 */
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
        }

        /* 추가로 오른쪽 카드가 무한정 커지지 않도록 설정 */
        .container-grid > .card:last-child {
            min-height: 0;         /* 그리드 아이템이 내용물에 의해 강제로 커지는 것 방지 */
        }
        .emp-row { padding: 10px 16px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        progress { width: 100%; height: 4px; border-radius: 2px; overflow: hidden; margin-top: 10px; appearance: none; }
        progress::-webkit-progress-bar { background: var(--line); }
        progress::-webkit-progress-value { background: var(--primary); }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="page-with-subbar">
        <div th:replace="~{sidebar/meeting-sidebar :: meetingSidebar('create')}"></div>

        <main style="padding: 24px; min-width: 0; flex: 1;">
            <div style="margin-bottom: 20px;"><h1 style="margin: 0; font-size: 25px; font-weight: 800;">새 회의 생성</h1></div>

            <div class="container-grid">
                <div class="card">
                    <div class="card-header">회의 정보 및 등록</div>
                    <div class="field">
                        <label>회의 제목 (최대 30자)</label>
                        <input id="title" placeholder="회의 주제를 입력하세요 (30자 이내)" maxlength="30" />
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px">
                        <div class="field">
                            <label>공개 여부</label>
                            <select id="status">
                                <option value="true">전체 공개</option>
                                <option value="false">비공개</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>회의 시간 (<span id="todayLabel">오늘</span>)</label>
                            <input id="startedAtTime" type="time" style="font-weight: 700; color: var(--primary);" />
                        </div>
                    </div>
                    <div class="field">
                        <label>관련 부서 선택</label>
                        <select id="depSelect"><option value="">부서를 선택하세요</option></select>
                        <div id="selectedDepBox" class="selected-box" style="margin-top: 10px;">
                            <div style="color:var(--muted); font-size:12px; width:100%; text-align:center">부서를 추가하세요.</div>
                        </div>
                    </div>
                    <div class="recording-section">
                        <div class="rec-controls">
                            <div id="recTimer">00:00:00</div>
                            <div class="btn-group">
                                <button id="recStartBtn" class="btn success">시작</button>
                                <button id="recPauseBtn" class="btn warning" disabled>일시 중지</button>
                                <button id="recEndBtn" class="btn danger" disabled>종료</button>
                            </div>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:8px 12px; border-radius:8px; border:1px solid var(--line); margin-bottom:8px;">
                            <span style="font-size:12px; font-weight:700; color:var(--muted)">상태: <b id="recState" style="color:var(--primary)">대기</b></span>
                            <button id="clearAudioBtn" class="btn" style="height:26px; font-size:11px; border:none; background:none; color:var(--danger)">초기화</button>
                        </div>
                        <audio id="audioPreview" controls style="width:100%; display:none; height:34px"></audio>
                        <div id="fileInfo" style="font-size:11px; color:var(--muted); text-align:center; margin-top:5px;">선택된 파일 없음</div>
                    </div>
                    <button id="createBtn" class="btn primary">🚀 회의 생성 및 분석 요청</button>
                    <progress id="progress" value="0" max="100" style="display:none"></progress>
                    <div id="statusMsg" style="font-size:12px; font-weight:700; color:var(--primary); margin-top:8px; text-align:center"></div>
                </div>

                <div class="card">
                    <div class="card-header">참석자 선택</div>
                    <label>선택된 멤버</label>
                    <div id="selectedBox" class="selected-box">
                        <div style="color:var(--muted); font-size:12px; width:100%; text-align:center">사원을 추가하세요.</div>
                    </div>
                    <label>사원 검색</label>
                    <input id="empSearchKeyword" placeholder="이름 또는 부서명 입력..." style="margin-bottom:12px;" />
                    <div id="empList" class="list-container"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:inline="javascript">
        // [기존 meeting-create.html의 JS 로직 전체 복사]
        const $ = (id) => document.getElementById(id);
        const progEl = $("progress");
        const statusMsg = $("statusMsg");
        const API_BASE = "http://localhost:8090";

        function updateStatus(msg) { statusMsg.textContent = msg; }
        function unwrapMaybeResponseDto(resJson) { return (resJson && resJson.data) ? resJson.data : resJson; }
        const fetchOptions = (method, body) => ({ method, headers: { "Content-Type": "application/json" }, credentials: 'include', body: body ? JSON.stringify(body) : null });

        // 부서 관리
        const selectedDepartments = new Map();
        async function loadDepartments() {
            try {
                const res = await fetch(`${API_BASE}/api/v1/departments`, { credentials: 'include' });
                const data = unwrapMaybeResponseDto(await res.json());
                const sel = $("depSelect");
                data.forEach(d => { const opt = document.createElement("option"); opt.value = d.depNo; opt.textContent = d.depName; sel.appendChild(opt); });
            } catch (e) { console.error(e); }
        }
        $("depSelect").onchange = function() {
            const val = this.value; const opt = this.options[this.selectedIndex];
            if (!val || selectedDepartments.has(val)) return;
            selectedDepartments.set(val, opt.text); opt.disabled = true; renderSelectedDeps(); this.value = "";
        };
        function renderSelectedDeps() {
            const box = $("selectedDepBox"); box.innerHTML = "";
            if (selectedDepartments.size === 0) { box.innerHTML = `<div style="color:var(--muted); font-size:12px; width:100%; text-align:center">부서를 추가하세요.</div>`; return; }
            [...selectedDepartments.entries()].forEach(([id, name]) => {
                const pill = document.createElement("div"); pill.className = "pill";
                pill.innerHTML = `<span>${name}</span><button type="button" onclick="removeSelectedDep('${id}')">×</button>`;
                box.appendChild(pill);
            });
        }
        window.removeSelectedDep = (depNo) => {
            selectedDepartments.delete(depNo);
            const sel = $("depSelect");
            for (let i = 0; i < sel.options.length; i++) { if (sel.options[i].value === String(depNo)) { sel.options[i].disabled = false; break; } }
            renderSelectedDeps();
        };

        // 참석자 관리
        const selectedEmployees = new Map();
        function renderSelected() {
            const box = $("selectedBox"); box.innerHTML = "";
            if (selectedEmployees.size === 0) { box.innerHTML = `<div style="color:var(--muted); font-size:12px; width:100%; text-align:center">사원을 추가하세요.</div>`; return; }
            [...selectedEmployees.values()].forEach(e => {
                const pill = document.createElement("div"); pill.className = "pill";
                pill.innerHTML = `<span>${e.empName}</span><button onclick="removeSelected('${e.empId}')">×</button>`;
                box.appendChild(pill);
            });
        }
        function addSelected(empId, empName) { if (!empId || selectedEmployees.has(empId)) return; selectedEmployees.set(empId, { empId, empName }); renderSelected(); }
        window.removeSelected = (empId) => { selectedEmployees.delete(empId); renderSelected(); };

        let cursor = null, hasNext = true, loading = false, kwTimer = null;
        async function loadMoreEmp() {
            if (loading || !hasNext) return;
            loading = true;
            const kw = $("empSearchKeyword").value.trim();
            const qs = new URLSearchParams({ size: "20", excludeMe: "true" });
            if (kw) qs.set("keyword", kw); if (cursor) qs.set("cursor", cursor);
            try {
                const res = await fetch(`${API_BASE}/api/v1/employees?${qs.toString()}`, { credentials: 'include' });
                const payload = unwrapMaybeResponseDto(await res.json());
                cursor = payload.nextCursor; hasNext = !!payload.hasNext;
                payload.items.forEach(e => {
                    const row = document.createElement("div"); row.className = "emp-row";
                    row.innerHTML = `<div style="font-size:13px"><b>${e.empName}</b> <small>${e.depName || ''}</small></div>
                                     <button class="btn" style="height:30px; padding:0 10px; font-size:11px" onclick="addSelected('${e.empId}', '${e.empName}')">추가</button>`;
                    $("empList").appendChild(row);
                });
            } catch (err) { console.error(err); } finally { loading = false; }
        }

        // 녹음/타이머
        let mediaRecorder = null, chunks = [], audioFile = null, audioBlobUrl = null, timerInterval = null, seconds = 0;
        function formatTimer(s) { const h = String(Math.floor(s/3600)).padStart(2,'0'); const m = String(Math.floor((s%3600)/60)).padStart(2,'0'); const sc = String(s%60).padStart(2,'0'); return `${h}:${m}:${sc}`; }
        function resetRecordingUI() { clearInterval(timerInterval); seconds = 0; $("recTimer").textContent = "00:00:00"; $("recState").textContent = "대기"; $("recState").style.color = "var(--primary)"; $("recStartBtn").textContent = "시작"; $("recStartBtn").disabled = false; $("recPauseBtn").disabled = true; $("recPauseBtn").textContent = "일시 중지"; $("recEndBtn").disabled = true; }
        $("recStartBtn").onclick = async () => {
            try {
                if (mediaRecorder && mediaRecorder.state === "paused") { mediaRecorder.resume(); timerInterval = setInterval(() => { seconds++; $("recTimer").textContent = formatTimer(seconds); }, 1000); $("recState").textContent = "녹음중"; }
                else {
                    chunks = []; const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
                    mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) chunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: "audio/webm" }); audioFile = new File([blob], `rec_${Date.now()}.webm`, { type: "audio/webm" });
                        if (audioBlobUrl) URL.revokeObjectURL(audioBlobUrl); audioBlobUrl = URL.createObjectURL(blob);
                        $("audioPreview").src = audioBlobUrl; $("audioPreview").style.display = "block"; $("fileInfo").textContent = `준비됨: ${(audioFile.size/1024).toFixed(1)} KB`; resetRecordingUI();
                    };
                    mediaRecorder.start(); timerInterval = setInterval(() => { seconds++; $("recTimer").textContent = formatTimer(seconds); }, 1000); $("recState").textContent = "녹음중";
                }
                $("recState").style.color = "var(--danger)"; $("recStartBtn").disabled = true; $("recPauseBtn").disabled = false; $("recEndBtn").disabled = false;
            } catch (e) { alert("마이크 권한이 필요합니다."); }
        };
        $("recPauseBtn").onclick = () => { if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.pause(); clearInterval(timerInterval); $("recState").textContent = "일시중지"; $("recState").style.color = "var(--muted)"; $("recStartBtn").textContent = "다시 시작"; $("recStartBtn").disabled = false; $("recPauseBtn").disabled = true; } };
        $("recEndBtn").onclick = () => { if (mediaRecorder) mediaRecorder.stop(); };
        $("clearAudioBtn").onclick = () => { audioFile = null; chunks = []; if (audioBlobUrl) URL.revokeObjectURL(audioBlobUrl); $("audioPreview").style.display = "none"; $("fileInfo").textContent = "선택된 파일 없음"; resetRecordingUI(); };

        // 생성 요청
        $("createBtn").onclick = async () => {
            const today = new Date().toISOString().split('T')[0];
            const selectedTime = $("startedAtTime").value;
            const combinedStartedAt = selectedTime ? `${today}T${selectedTime}:00` : null;
            const titleValue = $("title").value.trim();
            if (!titleValue) return alert("회의 제목을 입력하세요.");
            if (titleValue.length > 30) return alert("회의 제목은 30글자 이내로 입력해주세요.");

            if (selectedDepartments.size === 0) return alert("부서를 선택하세요.");
            if (selectedEmployees.size === 0) return alert("참석자를 선택하세요.");
            try {
                $("createBtn").disabled = true; progEl.style.display = "block"; progEl.value = 10; updateStatus("🚀 회의 정보 등록 중...");
                const res = await fetch(`${API_BASE}/api/v1/meetings`, fetchOptions("POST", { title: $("title").value.trim(), startedAt: combinedStartedAt, status: $("status").value === "true", depNos: [...selectedDepartments.keys()].map(Number), participantEmpIds: [...selectedEmployees.keys()] }));
                const result = await res.json(); const meetNo = (typeof result.data === 'number') ? result.data : result.data.meetNo;
                progEl.value = 40;
                if (audioFile) {
                    updateStatus("📦 분석 요청 중...");
                    const pRes = await fetch(`${API_BASE}/api/v1/attachments/presign`, fetchOptions("POST", { domain: "MEETING", entityId: meetNo, fileType: "AUDIO", originalName: audioFile.name, contentType: audioFile.type, size: audioFile.size }));
                    const { objectKey, uploadUrl } = (await pRes.json()).data;
                    await fetch(uploadUrl, { method: "PUT", body: audioFile, headers: { "Content-Type": audioFile.type } });
                    await fetch(`${API_BASE}/api/v1/attachments/complete`, fetchOptions("POST", { domain: "MEETING", entityId: meetNo, fileType: "AUDIO", objectKey, originalName: audioFile.name, contentType: audioFile.type, size: audioFile.size }));
                    await fetch(`${API_BASE}/api/v1/meetings/${meetNo}/ai-request`, fetchOptions("POST", { objectKey, size: audioFile.size, contentType: audioFile.type, originalName: audioFile.name, title: $("title").value.trim() }));
                }
                progEl.value = 100; updateStatus("🎉 완료되었습니다!");
                setTimeout(() => { if(confirm("등록 완료! 목록으로 이동할까요?")) location.href = "/meeting"; }, 500);
            } catch (e) { alert("오류: " + e.message); $("createBtn").disabled = false; }
        };

        $("empSearchKeyword").oninput = () => { clearTimeout(kwTimer); kwTimer = setTimeout(() => { cursor = null; hasNext = true; $("empList").innerHTML = ""; loadMoreEmp(); }, 300); };
        $("empList").onscroll = (e) => { if (e.target.scrollTop + e.target.clientHeight >= e.target.scrollHeight - 50) loadMoreEmp(); };

        window.onload = () => {
            const now = new Date();
            $("todayLabel").textContent = now.toISOString().split('T')[0];
            $("startedAtTime").value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            loadDepartments(); loadMoreEmp();
        };
    </script>
</th:block>
</body>
</html>
