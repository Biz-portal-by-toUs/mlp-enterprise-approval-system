<div class="chat-room-list">

    <div class="chat-room"
         th:each="room : ${rooms}"
         hx-get="/chat/rooms/{{room.roomNo}}"
         hx-target="#chat-body"
         hx-swap="innerHTML">

        <div class="room-name"
             th:text="${room.displayName}">
        </div>

        <div class="last-message"
             th:text="${room.lastMessage}">
        </div>
    </div>

</div>
