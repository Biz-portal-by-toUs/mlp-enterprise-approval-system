<!-- templates/sidebar/cloud-sidebar.html -->
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside class="subbar"
       sec:authorize="isAuthenticated()"
       th:fragment="cloudSidebar(active)">
    <div class="subbar-title">파일함</div>

    <!-- 공유함 / 개인함 탭 영역 -->
    <nav class="subbar-nav" aria-label="파일함 메뉴">
        <a class="subbar-item"
           th:href="@{/cloud/dept}" href="/cloud/dept"
           th:classappend="${active}=='dept' ? ' active' : ''">
            공유함
        </a>

        <a class="subbar-item"
           th:href="@{/cloud/prvt}" href="/cloud/prvt"
           th:classappend="${active}=='prvt' ? ' active' : ''">
            개인함
        </a>
    </nav>

    <!-- 위 스샷처럼 파란 버튼 3개 (생성/수정/삭제) -->
    <div class="subbar-actions">
        <button type="button" class="subbar-btn" id="btnFolderCreate">
            생성
        </button>
        <button type="button" class="subbar-btn" id="btnFolderRename">
            수정
        </button>
        <button type="button" class="subbar-btn danger" id="btnFolderDelete">
            삭제
        </button>
    </div>
</aside>
</body>
</html>
