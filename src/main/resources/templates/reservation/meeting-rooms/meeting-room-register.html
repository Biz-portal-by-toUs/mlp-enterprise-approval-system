<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>회의실 등록</title>

    <!-- 이 페이지 전용 CSS -->
    <th:block layout:fragment="pageStyles">
        <style>
            .meeting-room-register-page {
                padding: 24px 26px;
                background: #f4f6f8;
                min-height: 100%;
                display: flex;
                justify-content: center;
                align-items: flex-start;
            }

            .meeting-room-register-page .card {
                width: 520px;
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.12);
                padding: 28px;
            }

            .meeting-room-register-page .form-inner {
                max-width: 420px;          /* 입력칸 최대 폭 제한 */
                margin: 0 auto;            /* 가운데 정렬 */
            }

            .meeting-room-register-page input,
            .meeting-room-register-page textarea {
                width: 100%;
                box-sizing: border-box;    /* 삐져나오는 거 방지 */
            }

            .meeting-room-register-page .image-preview {
                width: 100%;
                height: 220px;
                background: #e5e7eb;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .meeting-room-register-page .image-preview img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }

            .meeting-room-register-page h2 {
                margin-top: 0;
                text-align: center;
            }

            .meeting-room-register-page .field {
                margin-bottom: 14px;
            }

            .meeting-room-register-page label {
                display: block;
                font-size: 13px;
                margin-bottom: 6px;
                color: #555;
            }

            .meeting-room-register-page input,
            .meeting-room-register-page textarea {
                width: 100%;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #ddd;
                font-size: 14px;
            }

            .meeting-room-register-page textarea {
                resize: none;
            }

            .meeting-room-register-page .btns {
                display: flex;
                gap: 10px;
                margin-top: 18px;
            }

            .meeting-room-register-page button {
                flex: 1;
                padding: 10px;
                border-radius: 8px;
                border: none;
                font-size: 14px;
                cursor: pointer;
            }

            .meeting-room-register-page .submit {
                background: #1677ff;
                color: #fff;
            }

            .meeting-room-register-page .cancel {
                background: #e5e7eb;
            }

            .meeting-room-register-page .preview-box {
                width: 100%;
                height: 220px;
                background: #e5e7eb;
                border-radius: 12px;
                overflow: hidden;
                margin-top: 10px;
            }

            .meeting-room-register-page .preview-box img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: none;
            }

            /* ===== form hints / validation UI ===== */
            .hint-row{
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-top:6px;
                gap:10px;
            }

            .hint{
                color:#6b7280;
                font-size:12px;
            }

            .counter{
                color:#6b7280;
                font-size:12px;
                font-variant-numeric: tabular-nums;
            }

            .error{
                display:block;
                margin-top:6px;
                color:#ef4444;
                font-size:12px;
                font-weight:600;
            }

            .input-invalid{
                border-color:#ef4444 !important;
                box-shadow: 0 0 0 3px rgba(239,68,68,.12);
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <!-- 🔹 왼쪽: 예약 서브 사이드바 (회의실 예약 active) -->
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('meeting')"></aside>

        <!-- 🔹 오른쪽: 방금 회의실 등록 화면 그대로 -->
        <div class="meeting-room-register-page">
            <div class="card">
                <h2>회의실 등록</h2>

                <form id="roomForm" enctype="multipart/form-data">

                    <div class="field">
                        <label>회의실명</label>
                        <input type="text" name="roomName" id="roomName" maxlength="20" required>
                        <div class="hint-row">
                            <small class="hint">최대 20자까지 입력 가능</small>
                            <small class="counter" id="nameCounter">0 / 20</small>
                        </div>
                        <small class="error" id="nameError" style="display:none;"></small>
                    </div>

                    <div class="field">
                        <label>수용 인원</label>
                        <input type="number" name="capacity" id="capacity" min="1" max="20" required>
                        <div class="hint-row">
                            <small class="hint">1~20명 입력 가능</small>
                        </div>
                        <small class="error" id="capError" style="display:none;"></small>
                    </div>

                    <div class="field">
                        <label>위치</label>
                        <input type="text" name="location" maxlength="50">
                    </div>

                    <div class="field">
                        <label>주요 장비</label>
                        <input type="text" name="equipList" maxlength="255">
                    </div>

                    <div class="field">
                        <label>특이사항</label>
                        <textarea name="note" rows="3" maxlength="255"></textarea>
                    </div>

                    <div class="field">
                        <label>회의실 이미지</label>
                        <input
                                type="file"
                                name="imageFile"
                                id="imageFile"
                                accept="image/*"
                                onchange="previewImage(this)"
                        >
                    </div>

                    <div class="preview-box">
                        <img id="imagePreview" alt="미리보기 이미지" />
                    </div>

                    <div class="btns">
                        <button type="submit" class="submit">등록</button>
                        <button type="button" class="cancel" onclick="history.back()">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>

<!-- 이 페이지 전용 JS -->
<th:block layout:fragment="pageScripts">
    <script>
        /* ---------- image preview ---------- */
        function previewImage(input) {
            const preview = document.getElementById("imagePreview");

            if (!input.files || !input.files[0]) {
                preview.style.display = "none";
                preview.src = "";
                return;
            }

            const file = input.files[0];

            if (!file.type.startsWith("image/")) {
                alert("이미지 파일만 업로드 가능합니다.");
                input.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.style.display = "block";
            };

            reader.readAsDataURL(file);
        }

        /* ===== inline validation UI ===== */
        const roomNameInput = document.getElementById("roomName");
        const nameCounter = document.getElementById("nameCounter");
        const nameError = document.getElementById("nameError");

        const capInput = document.getElementById("capacity");
        const capError = document.getElementById("capError");

        function setError(inputEl, errorEl, msg) {
            if (!errorEl) return;

            if (msg) {
                errorEl.textContent = msg;
                errorEl.style.display = "block";
                inputEl?.classList.add("input-invalid");
            } else {
                errorEl.textContent = "";
                errorEl.style.display = "none";
                inputEl?.classList.remove("input-invalid");
            }
        }

        function updateNameUI() {
            if (!roomNameInput) return;

            const len = roomNameInput.value.length;
            if (nameCounter) nameCounter.textContent = `${len} / 20`;

            if (!roomNameInput.value.trim()) {
                setError(roomNameInput, nameError, "");
                return;
            }

            if (len > 20) setError(roomNameInput, nameError, "회의실명은 20자 이내여야 합니다.");
            else setError(roomNameInput, nameError, "");
        }

        function updateCapUI() {
            if (!capInput) return;

            const v = capInput.value;

            if (v === "") {
                setError(capInput, capError, "");
                return;
            }

            const n = Number(v);
            if (Number.isNaN(n)) {
                setError(capInput, capError, "숫자만 입력해주세요.");
                return;
            }

            if (n < 1 || n > 20) {
                setError(capInput, capError, "수용 인원은 1~20명 사이여야 합니다.");
                return;
            }

            setError(capInput, capError, "");
        }

        roomNameInput?.addEventListener("input", updateNameUI);

        /* ---------- capacity guard + UI ---------- */
        capInput?.addEventListener("input", () => {
            let value = capInput.value;

            if (value === "") {
                updateCapUI();
                return;
            }

            const num = Number(value);

            if (Number.isNaN(num)) {
                capInput.value = "";
                updateCapUI();
                return;
            }

            if (num < 1) capInput.value = 1;
            if (num > 20) capInput.value = 20;

            updateCapUI();
        });

        /* 초기 표시 */
        updateNameUI();
        updateCapUI();

        /* ---------- submit ---------- */
        async function submitMeetingRoomForm(e) {
            e.preventDefault();

            const name = document.querySelector("[name=roomName]").value.trim();
            const capacity = Number(document.querySelector("[name=capacity]").value);
            const form = document.getElementById("roomForm");
            const formData = new FormData(form);

            updateNameUI();
            updateCapUI();

            if (!name) {
                setError(roomNameInput, nameError, "회의실명을 입력해주세요.");
                roomNameInput.focus();
                return;
            }

            if (name.length > 20) {
                setError(roomNameInput, nameError, "회의실명은 20자 이내여야 합니다.");
                roomNameInput.focus();
                return;
            }

            if (!capacity || capacity < 1 || capacity > 20) {
                setError(capInput, capError, "수용 인원은 1~20명 사이여야 합니다.");
                capInput.focus();
                return;
            }

            try {
                const res = await fetch("/api/v1/meeting-rooms", {
                    method: "POST",
                    credentials: "include",
                    body: formData
                });

                if (res.status === 401) {
                    alert("로그인이 필요합니다.");
                    location.href = "/login";
                    return;
                }

                const result = await res.json();

                if (!res.ok) {
                    console.error(result);
                    alert(result.message || "등록 실패");
                    return;
                }

                alert("회의실 등록 성공!");
                location.href = "/meeting-rooms";
            } catch (err) {
                console.error(err);
                alert("서버 오류가 발생했습니다.");
            }
        }

        document.getElementById("roomForm")?.addEventListener("submit", submitMeetingRoomForm);
    </script>

</th:block>

</body>
</html>
