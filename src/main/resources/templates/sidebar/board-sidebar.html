<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="subbar" th:fragment="boardSidebar(active)">
    <div class="subbar-title">게시판</div>

    <nav class="subbar-nav" aria-label="게시판 메뉴">
        <a class="subbar-item"
           th:href="@{/notice/list}" href="/notice/list"
           th:classappend="${active}=='notice' ? ' active' : ''">
            공지사항
        </a>

        <!-- ✅ 공지사항 등록 -->
        <a class="subbar-item"
           th:href="@{/notice/form}" href="/notice/form"
           th:classappend="${active}=='noticeForm' ? ' active' : ''">
            공지사항등록
        </a>

        <a class="subbar-item"
           th:href="@{/board/list}" href="/board/list"
           th:classappend="${active}=='board' ? ' active' : ''">
            자유게시판
        </a>

        <!-- ✅ 게시판 등록 -->
        <a class="subbar-item"
           th:href="@{/board/form}" href="/board/form"
           th:classappend="${active}=='boardForm' ? ' active' : ''">
            게시판등록
        </a>
    </nav>
</aside>
</body>
</html>
