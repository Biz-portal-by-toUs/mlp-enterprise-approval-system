<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>직급 수정</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* ✅ 페이지 스코프 */
            .pos-edit-page{
                width:min(1100px, 100%);
                margin:0 auto;
                padding: 0 26px;
            }

            .pos-edit-page .page-kicker{
                font-size:14px;
                color:var(--muted);
                margin: 6px 0 10px;
                font-weight:800;
            }
            .pos-edit-page .page-title{
                font-size:34px;
                font-weight:900;
                margin: 0 0 22px;
                letter-spacing:-.2px;
            }
            .pos-edit-page .section-title{
                font-size:22px;
                font-weight:900;
                margin: 0 0 14px;
            }

            .pos-edit-page .card{
                background: var(--white);
                border: 1px solid var(--line);
                border-radius: 18px;
                padding: 26px;
                box-shadow: 0 10px 24px rgba(17,24,39,.06);
            }

            /* ✅ 회색 바탕 제거 + 1열 폼 */
            .pos-edit-page .form-grid{
                display:grid;
                grid-template-columns: 1fr;
                gap:18px;
            }

            .pos-edit-page .label{
                font-weight:900;
                margin-bottom:10px;
                font-size:14px;
            }

            .pos-edit-page .input{
                width:100%;
                height:48px;
                border-radius:12px;
                border:1px solid var(--line);
                padding:0 14px;
                font-size:14px;
                outline:none;
                background:#fff;
            }
            .pos-edit-page .input:focus{
                border-color: rgba(59,130,246,.55);
                box-shadow: 0 0 0 4px rgba(59,130,246,.12);
            }

            .pos-edit-page .hint{
                margin-top:8px;
                font-size:12px;
                color:var(--muted);
                font-weight:800;
            }

            .pos-edit-page .actions{
                display:flex;
                justify-content:flex-end;
                gap:10px;
                margin-top: 6px;
            }

            .pos-edit-page .btn{
                height:44px;
                min-width:110px;
                border:none;
                border-radius:12px;
                font-weight:900;
                cursor:pointer;
                padding:0 14px;
            }

            /* ✅ 취소: 흰색 + 검정 글자 */
            .pos-edit-page .btn.ghost{
                background:#fff;
                color:#111;
                border:1px solid rgba(17,24,39,.10);
                box-shadow:none;
            }

            /* ✅ 저장: 헤더색 */
            .pos-edit-page .btn.primary{
                background: var(--primary);
                color:#fff;
                box-shadow: 0 10px 22px rgba(59,130,246,.22);
            }
            .pos-edit-page .btn.primary:active{ transform: translateY(1px); }

            .pos-edit-page .msg{
                margin-top:14px;
                font-size:13px;
                display:none;
                font-weight:900;
                padding:12px 14px;
                border-radius:12px;
                border:1px solid var(--line);
                background:#fff;
            }
            .pos-edit-page .msg.ok{ background:#f3fff6; border-color:#bfe7c9; color:#1b7f3a; display:block; }
            .pos-edit-page .msg.err{ background:#fff5f4; border-color:#ffd0cc; color:#b42318; display:block; }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="page-with-subbar">
        <div th:replace="~{sidebar/admin-sidebar :: adminSidebar('pos')}"></div>

        <section class="pos-edit-page">

            <div class="card" style="margin-top: 30px">
                <div class="form-grid">
                    <input type="hidden" id="posNo" th:value="${posNo}"/>

                    <div>
                        <div class="label">직급명</div>
                        <input type="text" id="posName" class="input"
                               th:value="${posName}" placeholder="예) 대리, 과장, 팀장" maxlength="30" />
                        <div class="hint">최대 30자</div>
                    </div>

                    <div>
                        <div class="label">직급 순서</div>
                        <select id="posOrder" class="input" aria-label="직급 순서">
                            <option th:each="i : ${#numbers.sequence(1, 50)}"
                                    th:value="${i}"
                                    th:text="${i}"
                                    th:selected="${i == posOrder}"></option>
                        </select>
                        <div class="hint">1 ~ 50</div>
                    </div>

                    <div class="actions">
                        <button class="btn ghost" type="button" onclick="location.href='/admin/positions/list'">취소</button>
                        <button class="btn primary" type="button" id="saveBtn">수정 완료</button>
                    </div>

                    <div id="statusMsg" class="msg"></div>
                </div>
            </div>
        </section>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:inline="javascript">
        const API_BASE = "/api/v1/admin/positions";

        function showStatus(isOk, text) {
            const el = document.getElementById("statusMsg");
            el.textContent = text;
            el.className = "msg " + (isOk ? "ok" : "err");
            clearTimeout(window.__posStatusTimer);
            window.__posStatusTimer = setTimeout(() => {
                el.className = "msg";
                el.textContent = "";
            }, 2500);
        }

        async function safeJson(res) {
            const ct = res.headers.get("content-type") || "";
            if (!ct.includes("application/json")) return {};
            try { return await res.json(); } catch { return {}; }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("saveBtn");
            if (!btn) return;

            btn.addEventListener("click", async () => {
                const posNo = document.getElementById("posNo")?.value;
                const posName = document.getElementById("posName")?.value?.trim() || "";
                const posOrder = parseInt(document.getElementById("posOrder")?.value || "0", 10);

                if (!posNo) return showStatus(false, "직급 번호를 찾을 수 없습니다.");
                if (!posName) return showStatus(false, "직급명을 입력해주세요.");
                if (!Number.isInteger(posOrder) || posOrder < 1 || posOrder > 50) return showStatus(false, "직급 순서는 1~50 사이로 선택해주세요.");

                try {
                    const response = await fetch(`${API_BASE}/${encodeURIComponent(posNo)}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json", "Accept":"application/json" },
                        credentials: "include",
                        body: JSON.stringify({ posName, posOrder })
                    });

                    if (response.ok) {
                        showStatus(true, "성공적으로 반영되었습니다. 목록으로 이동합니다.");
                        setTimeout(() => location.href = "/admin/positions/list", 800);
                        return;
                    }

                    if (response.status === 401) return showStatus(false, "로그인이 필요합니다. 다시 로그인 해주세요.");
                    if (response.status === 403) return showStatus(false, "수정 권한이 없습니다 (관리자 전용).");

                    const data = await safeJson(response);
                    showStatus(false, data.message || data.msg || `수정 실패 (HTTP ${response.status})`);

                } catch (error) {
                    console.error(error);
                    showStatus(false, "서버 연결 실패. 네트워크를 확인하세요.");
                }
            });
        });
    </script>
</th:block>
</body>
</html>
