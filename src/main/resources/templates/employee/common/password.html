<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>비밀번호 변경 페이지</title>
    <style>
        :root{
            --bg:#f3f3f3;
            --text:#111;
            --muted:#8a8a8a;
            --border:#e5e5e5;
            --primary:#2f66d7;
            --danger:#ef4444;
            --ok:#22c55e;

            /* chips */
            --chipBadBg:#ffecec;
            --chipBadText:#d94a3a;
            --chipOkBg:#eafaf0;
            --chipOkText:#16a34a;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo",
            "Noto Sans KR", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:var(--bg);
            color:var(--text);
        }
        .page{
            min-height:100vh;
            border:2px solid #222;
            margin:12px;
            background:#fff;
            display:flex;
            flex-direction:column;
        }
        header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:26px 28px;
        }
        .brand{
            font-family: Georgia, "Times New Roman", Times, serif;
            font-weight:700;
            font-size:40px;
            letter-spacing:-0.5px;
        }
        main{
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }
        .card{
            width:min(560px, 92vw);
            text-align:center;
        }
        .title{
            font-size:44px;
            font-weight:900;
            margin:0 0 18px;
            letter-spacing:-0.6px;
        }
        .sub{
            margin:0 0 22px;
            font-size:13px;
            font-weight:800;
            color:#666;
        }

        /* ✅ policy chips */
        .chips{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            justify-content:center;
            margin:0 0 18px;
        }
        .chip{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:10px 14px;
            border-radius:999px;
            background:var(--chipBadBg);
            color:var(--chipBadText);
            font-weight:900;
            font-size:13px;
        }
        .chip.ok{
            background:var(--chipOkBg);
            color:var(--chipOkText);
        }
        .chip .x{font-weight:900}

        .form{
            width:min(460px, 92vw);
            margin:0 auto;
            display:flex;
            flex-direction:column;
            gap:16px;
        }
        .field{ text-align:left; }
        .label{
            font-size:11px;
            font-weight:900;
            color:var(--muted);
            margin:0 0 8px 2px;
            letter-spacing:0.4px;
        }

        /* ✅ input with eye button */
        .input-wrap{
            display:flex;
            align-items:center;
            width:100%;
            height:46px;
            border:1px solid var(--border);
            border-radius:4px;
            overflow:hidden;
            background:#fff;
        }
        .input{
            flex:1;
            height:46px;
            border:0;
            outline:none;
            padding:0 12px;
            font-size:15px;
            background:transparent;
        }
        .eye{
            width:52px;
            height:46px;
            border:0;
            border-left:1px solid var(--border);
            background:#fff;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .input-wrap:focus-within{
            border-color:#c7d6fb;
            box-shadow:0 0 0 4px rgba(47,102,215,.10);
        }
        svg{width:20px;height:20px;opacity:.72}

        .match{
            margin-top:10px;
            font-size:13px;
            font-weight:900;
            min-height:16px;
        }
        .match.ok{color:var(--ok)}
        .match.bad{color:var(--danger)}

        .btn-primary{
            width:220px;
            height:50px;
            border:0;
            border-radius:4px;
            background:var(--primary);
            color:#fff;
            font-weight:900;
            cursor:pointer;
            margin:12px auto 0;
        }

        .msg{
            margin-top:18px;
            font-size:14px;
            font-weight:900;
            text-align:center;
            min-height:18px;
        }
        .msg.ok{color:var(--ok)}
        .msg.bad{color:var(--danger)}

        @media (max-width:768px){
            .brand{font-size:32px}
            .title{font-size:36px}
        }
    </style>
</head>
<body>
<div class="page">
    <header>
        <div class="brand">Bizportal</div>
        <div></div>
    </header>

    <main>
        <section class="card">
            <h1 class="title">비밀번호 변경</h1>
            <p class="sub">사원 인증 완료 후 비밀번호를 변경하세요.</p>

            <!-- ✅ 비밀번호 정책 표시(새 비밀번호 기준) -->
            <div class="chips">
                <div id="cUpper" class="chip"><span class="x">✕</span> 영어 대문자</div>
                <div id="cLower" class="chip"><span class="x">✕</span> 영어 소문자</div>
                <div id="cNum"   class="chip"><span class="x">✕</span> 숫자</div>
                <div id="cSp"    class="chip"><span class="x">✕</span> 특수문자</div>
                <div id="cLen"   class="chip"><span class="x">✕</span> 8자 이상 20자 이내</div>
            </div>

            <form id="pwForm" class="form" autocomplete="off">

                <!-- ✅ 현재 비밀번호 (필수) -->
                <div class="field">
                    <div class="label">CURRENT PASSWORD</div>
                    <div class="input-wrap">
                        <input id="currentPassword" class="input" type="password" placeholder="현재 비밀번호" maxlength="20" required />
                        <button class="eye" type="button" data-target="currentPassword" aria-label="toggle password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <div class="label">NEW PASSWORD</div>
                    <div class="input-wrap">
                        <input id="newPassword" class="input" type="password" placeholder="새 비밀번호" maxlength="20" required />
                        <button class="eye" type="button" data-target="newPassword" aria-label="toggle password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <div class="label">CONFIRM PASSWORD</div>
                    <div class="input-wrap">
                        <input id="newPasswordConfirm" class="input" type="password" placeholder="새 비밀번호 확인" maxlength="20" required />
                        <button class="eye" type="button" data-target="newPasswordConfirm" aria-label="toggle password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div id="match" class="match"></div>
                </div>

                <button id="submitBtn" class="btn-primary" type="submit">변경하기</button>
                <div id="msg" class="msg"></div>
            </form>
        </section>
    </main>
</div>

<script>
    const CHANGE_URL = "/auth/password";   // PATCH
    const SUBJECT_TYPE = "EMPLOYEE";

    function getSubjectId(){
        const v = sessionStorage.getItem("employeePwSubjectId");
        return v ? Number(v) : null;
    }

    function showMsg(text, ok){
        const el = document.getElementById("msg");
        el.textContent = text;
        el.className = "msg " + (ok ? "ok" : "bad");
    }

    // ✅ chips
    function setChip(el, ok){
        const label = el.textContent.replace(/^✕\s|^✓\s/, "").trim();
        el.classList.toggle("ok", ok);
        el.innerHTML = (ok ? '<span class="x">✓</span> ' : '<span class="x">✕</span> ') + label;
    }

    const cUpper = document.getElementById("cUpper");
    const cLower = document.getElementById("cLower");
    const cNum   = document.getElementById("cNum");
    const cSp    = document.getElementById("cSp");
    const cLen   = document.getElementById("cLen");

    function validatePwd(pwd){
        const upper = /[A-Z]/.test(pwd);
        const lower = /[a-z]/.test(pwd);
        const num   = /[0-9]/.test(pwd);
        const sp    = /[^A-Za-z0-9]/.test(pwd);
        const len   = pwd.length >= 8 && pwd.length <= 20;

        setChip(cUpper, upper);
        setChip(cLower, lower);
        setChip(cNum,   num);
        setChip(cSp,    sp);
        setChip(cLen,   len);

        return upper && lower && num && sp && len;
    }

    // ✅ 실시간 일치 체크
    const matchEl = document.getElementById("match");
    function updateMatch(){
        const a = document.getElementById("newPassword").value;
        const b = document.getElementById("newPasswordConfirm").value;

        if (!a && !b) {
            matchEl.textContent = "";
            matchEl.className = "match";
            return;
        }
        if (a && !b) {
            matchEl.textContent = "비밀번호 확인을 입력해주세요.";
            matchEl.className = "match bad";
            return;
        }
        if (a === b) {
            matchEl.textContent = "✅ 비밀번호가 일치합니다.";
            matchEl.className = "match ok";
        } else {
            matchEl.textContent = "❌ 비밀번호가 일치하지 않습니다.";
            matchEl.className = "match bad";
        }
    }

    // 새 비밀번호 입력 시 정책 + 일치 둘 다 갱신
    document.getElementById("newPassword").addEventListener("input", (e) => {
        validatePwd(e.target.value);
        updateMatch();
    });
    document.getElementById("newPasswordConfirm").addEventListener("input", updateMatch);

    // ✅ 눈 버튼(3개 모두)
    document.querySelectorAll(".eye").forEach(btn => {
        btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-target");
            const input = document.getElementById(id);
            input.type = (input.type === "password") ? "text" : "password";
        });
    });

    document.getElementById("pwForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const subjectId = getSubjectId();
        if (!subjectId) {
            showMsg("인증 정보가 없습니다. 사원 인증부터 다시 진행해주세요.", false);
            setTimeout(() => location.href = "/auth/employee/verify", 700);
            return;
        }

        const currentPassword = document.getElementById("currentPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const newPasswordConfirm = document.getElementById("newPasswordConfirm").value;

        if (!currentPassword) return showMsg("현재 비밀번호를 입력해주세요.", false);
        if (!validatePwd(newPassword)) return showMsg("비밀번호 정책을 만족해주세요.", false);
        if (newPassword !== newPasswordConfirm) return showMsg("비밀번호 확인이 일치하지 않습니다.", false);

        try {
            const res = await fetch(CHANGE_URL, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    subjectId,
                    subjectType: SUBJECT_TYPE,
                    currentPassword,
                    newPassword,
                    newPasswordConfirm
                })
            });

            if (!res.ok) {
                // ✅ 서버 validation map을 예쁘게 보여주기
                let err = `변경 실패 (${res.status})`;
                try {
                    const j = await res.json();
                    if (j?.validations) {
                        const firstKey = Object.keys(j.validations)[0];
                        err = j.validations[firstKey] || j.message || err;
                    } else {
                        err = j?.message || err;
                    }
                } catch(e) {}
                showMsg(err, false);
                return;
            }

            showMsg("비밀번호 변경 완료! 사원 로그인 페이지로 이동합니다.", true);

            // 한 번 쓰고 삭제
            sessionStorage.removeItem("employeePwSubjectId");
            sessionStorage.removeItem("employeePwSubjectType");

            setTimeout(() => location.href = "/auth/employee/login", 700);

        } catch (e2) {
            showMsg("요청 실패: " + e2.message, false);
        }
    });
</script>
</body>
</html>
