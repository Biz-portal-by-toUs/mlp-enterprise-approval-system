<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>직급 등록</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* ✅ SCOPE ROOT */
            .pos-create-page .wrap{
                width:100%;
                max-width: 980px;
                margin: 0 auto;
                padding: 6px 26px 24px;
            }

            .pos-create-page .card{
                background: var(--white);
                border: 1px solid var(--line);
                border-radius: 18px;
                box-shadow: var(--shadow2);
                padding: 18px;
            }

            .pos-create-page .panel{
                background:#fff;                 /* ✅ 회색 제거 */
                border:0;                        /* ✅ 패널 테두리 제거(원하면 유지해도 됨) */
                border-radius:18px;
                padding:0;
            }

            .pos-create-page .section-title{
                font-weight:950;
                font-size:14px;
                margin:0 0 12px;
                color:#111827;
                letter-spacing:-.2px;
            }

            .pos-create-page .form{
                display:grid;
                grid-template-columns: 1fr;
                gap:14px;
            }

            .pos-create-page .input{
                width:100%;
            }

            .pos-create-page .field{
                display:flex;
                flex-direction:column;
                gap:8px;
            }

            .pos-create-page .label{
                font-size:13px;
                font-weight:900;
                color:#111827;
            }

            .pos-create-page .hint{
                margin-top:-2px;
                font-size:12px;
                color:var(--muted);
                font-weight:800;
            }

            /* ✅ 전역 input/select 금지 */
            .pos-create-page .control{
                width:100%;
                height:42px;
                border-radius:12px;
                border:1px solid var(--line);
                padding:0 12px;
                outline:none;
                background:#fff;
                font-size:14px;
            }
            .pos-create-page .control:focus{
                border-color: rgba(59,130,246,.55);
                box-shadow: 0 0 0 4px rgba(59,130,246,.12);
            }

            .pos-create-page .actions{
                display:flex;
                justify-content:flex-end;
                gap:10px;
                margin-top:16px;
            }

            /* ✅ 버튼 스코프 */
            .pos-create-page .btn{
                height:42px;
                min-width:110px;
                border:0;
                border-radius:10px; /* 살짝 각지게 */
                cursor:pointer;
                font-weight:900;
                padding:0 14px;
            }

            .pos-create-page .btn.primary{
                background: var(--primary);
                color:#fff;
                box-shadow: 0 10px 22px rgba(59,130,246,.22);
            }
            .pos-create-page .btn.primary:hover{ filter:brightness(.98); }

            .pos-create-page .btn.ghost{
                background:#fff;
                color:#111;
                border:1px solid var(--line);
            }
            .pos-create-page .btn.ghost:hover{ background:#f8fafc; }

            .pos-create-page .msg{
                margin-top:12px;
                font-size:13px;
                display:none;
                font-weight:900;
                padding:12px 14px;
                border-radius:14px;
                border:1px solid var(--line);
                background:#fff;
            }
            .pos-create-page .msg.ok{
                display:block;
                border-color:rgba(34,197,94,.25);
                background:rgba(34,197,94,.07);
                color:#0f766e;
            }
            .pos-create-page .msg.err{
                display:block;
                border-color:rgba(239,68,68,.25);
                background:rgba(239,68,68,.07);
                color:#b91c1c;
            }

            @media (max-width: 980px){
                .pos-create-page .wrap{ padding: 6px 16px 24px; }
                .pos-create-page .form{ grid-template-columns: 1fr; }
            }
        </style>
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="page-with-subbar">

        <div th:replace="~{sidebar/admin-sidebar :: adminSidebar('pos')}"></div>

        <!-- ✅ 스코프 루트 -->
        <section class="pos-create-page">
            <div class="wrap">

                <section class="card">
                    <div class="panel">
                        <div class="section-title">직급 등록</div>

                        <div class="form">
                            <div class="field">
                                <div class="label">직급명</div>
                                <input class="control" id="posName" maxlength="30" placeholder="예) 대리, 과장, 팀장" />
                                <div class="hint">최대 30자</div>
                            </div>

                            <div class="field">
                                <div class="label">직급 순서</div>
                                <select class="control" id="posOrder" aria-label="직급 순서"></select>
                                <div class="hint">1 ~ 50</div>
                            </div>
                        </div>

                        <div class="actions">
                            <button class="btn ghost" type="button" onclick="location.href='/admin/positions/list'">취소</button>
                            <button class="btn primary" id="submitBtn" type="button">등록</button>
                        </div>

                        <div id="resultMsg" class="msg"></div>
                    </div>
                </section>

            </div>
        </section>
    </div>
</th:block>

<th:block layout:fragment="pageScripts">
    <script>
        const $ = (id) => document.getElementById(id);

        function showMsg(text, ok) {
            const el = $("resultMsg");
            if (!el) return;
            el.className = "msg " + (ok ? "ok" : "err");
            el.textContent = text;
        }

        async function safeJson(res) {
            const ct = res.headers.get("content-type") || "";
            if (!ct.includes("application/json")) return {};
            try { return await res.json(); } catch { return {}; }
        }

        function initPosOrder() {
            const select = $("posOrder");
            if (!select) return;
            select.innerHTML = "";
            for (let i = 1; i <= 50; i++) {
                const opt = document.createElement("option");
                opt.value = String(i);
                opt.textContent = String(i);
                select.appendChild(opt);
            }
            select.value = "1";
        }

        window.addEventListener("DOMContentLoaded", () => {
            initPosOrder();

            const btn = $("submitBtn");
            if (!btn) return;

            btn.addEventListener("click", async () => {
                const posName = $("posName")?.value?.trim() || "";
                const posOrder = parseInt($("posOrder")?.value || "0", 10);

                if (!posName) return showMsg("직급명을 입력해주세요.", false);
                if (!Number.isInteger(posOrder) || posOrder < 1 || posOrder > 50)
                    return showMsg("직급 순서는 1~50 사이로 선택해주세요.", false);

                try {
                    const res = await fetch("/api/v1/admin/positions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Accept": "application/json" },
                        credentials: "include",
                        body: JSON.stringify({ posName, posOrder })
                    });

                    if (res.status === 401) return showMsg("로그인이 필요합니다. 다시 로그인 해주세요.", false);
                    if (res.status === 403) return showMsg("권한이 없습니다. (COM_ADMIN만 가능)", false);

                    if (res.ok) {
                        Alert.success("직급이 등록되었습니다.").then(() => {
                            window.location.href = "/admin/positions/list";
                        });
                        return;
                    }

                    const data = await safeJson(res);
                    showMsg(data?.message || `요청 처리에 실패했습니다. (HTTP ${res.status})`, false);

                } catch (e) {
                    console.error(e);
                    showMsg("서버 통신 오류가 발생했습니다.", false);
                }
            });
        });
    </script>
</th:block>
</body>
</html>
