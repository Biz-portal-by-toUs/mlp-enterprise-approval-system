<!-- templates/sidebar/admin-sidebar.html -->
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside class="subbar"
       sec:authorize="hasRole('COM_ADMIN')"
       th:fragment="adminSidebar(active)">
    <div class="subbar-title">관리자</div>

    <!-- ✅ subnav -> subbar-nav -->
    <nav class="subbar-nav" aria-label="관리자 메뉴">
        <!-- ✅ subnav-item -> subbar-item -->
        <a class="subbar-item"
           th:href="@{/admin/departments/list}" href="/admin/departments/list"
           th:classappend="${active}=='dept' ? ' active' : ''">
            부서 편성
        </a>

        <a class="subbar-item"
           th:href="@{/admin/positions/list}" href="/admin/positions/list"
           th:classappend="${active}=='pos' ? ' active' : ''">
            직급 편성
        </a>

        <a class="subbar-item"
           th:href="@{/admin/employees/list}" href="/admin/employees/list"
           th:classappend="${active}=='emp' ? ' active' : ''">
            사원 관리
        </a>

        <a class="subbar-item"
           th:href="@{/admin/rules/list}" href="/admin/rules/list"
           th:classappend="${active}=='rule' ? ' active' : ''">
            사내 규정 관리
        </a>
    </nav>
</aside>
</body>
</html>
