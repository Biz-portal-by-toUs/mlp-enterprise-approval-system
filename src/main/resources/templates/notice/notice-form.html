<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공지 사항 등록</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles1.css}">
    <style>
        :root{
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: rgba(17, 24, 39, 0.08);
            --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            --shadow2: 0 6px 18px rgba(17, 24, 39, 0.10);

            --primary: #3b82f6;      /* blue */
            --primary2: #2563eb;
            --danger: #ef4444;
            --danger2: #dc2626;
            --chip: rgba(59, 130, 246, 0.10);
            --success: #10b981;
            --warn: #f59e0b;
        }

        * { box-sizing: border-box; }

        body{
            margin: 0;
            background: radial-gradient(1200px 600px at 15% -10%, rgba(59,130,246,.15), transparent 55%),
            radial-gradient(900px 500px at 90% 0%, rgba(16,185,129,.12), transparent 55%),
            var(--bg);
            font-family: 'Noto Sans KR', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            color: var(--text);
        }

        /* 컨테이너: 가운데 카드 느낌 */
        .container{
            max-width: 920px;
            margin: 64px auto;
            padding: 0;
            background: transparent;
            box-shadow: none;
            border: none;
        }

        /* 상단 타이틀 영역(헤더 카드) */
        .notice-detail{
            background: linear-gradient(135deg, rgba(59,130,246,.10), rgba(255,255,255,0));
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* 실제 정보 카드 */
        .notice-info{
            background: var(--card);
            padding: 28px 28px 22px;
            border-radius: 18px;
        }

        /* 제목/내용 영역 정리 */
        .notice-info p{
            margin: 0;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(17,24,39,.12);
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 14px;
            align-items: start;
        }

        .notice-info p strong{
            color: var(--muted);
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        #noticeTitle{
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text);
        }

        #noticeDescription{
            margin: 0;
            padding: 12px 0;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        /* 내용 줄은 기존에 <p><strong>내용:</strong><p id="noticeDescription"> 구조가 살짝 깨져있어서
           #noticeDescription을 카드처럼 보이게 강화 */
        #noticeDescription{
            background: rgba(17,24,39,.03);
            border: 1px solid rgba(17,24,39,.06);
            border-radius: 12px;
            padding: 14px 14px;
        }

        /* 메타 영역을 2열로 보이게 */
        .notice-info{
            position: relative;
        }
        .notice-info::after{
            content:"";
            display:block;
            margin-top: 14px;
        }

        /* 팝업 여부 배지 느낌 */
        #noticePopup{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: 800;
            font-size: .9rem;
            border: 1px solid rgba(17,24,39,.10);
            background: rgba(17,24,39,.03);
        }

        /* JS 값이 true/false로 그대로 보이면 아쉬우니,
           true면 초록/false면 회색으로 보이게 하려면 JS에서 텍스트를 Y/N로 바꾸면 베스트.
           CSS만으로도 기본 배지 제공 */
        .notice-info p:last-child{ border-bottom: none; }

        /* 탭 버튼 영역 */
        .tab-buttons{
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }

        .tab-btn{
            border: 1px solid var(--line);
            background: var(--card);
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 800;
            color: var(--muted);
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(17,24,39,.04);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
        }

        .tab-btn.active{
            background: linear-gradient(135deg, rgba(59,130,246,.12), rgba(255,255,255,0));
            color: var(--text);
            border-color: rgba(59,130,246,.25);
        }

        .tab-btn:hover{
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(17,24,39,.08);
        }

        /* 첨부파일 카드 */
        #attach.tab-content{
            margin-top: 12px;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            padding: 14px;
        }

        /* 첨부파일 테이블 */
        #attachList{
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 12px;
        }

        #attachList th{
            text-align: left;
            font-size: .9rem;
            color: var(--muted);
            background: rgba(17,24,39,.03);
            padding: 12px 12px;
            border-bottom: 1px solid rgba(17,24,39,.08);
            font-weight: 800;
        }

        #attachList td{
            padding: 12px 12px;
            border-bottom: 1px solid rgba(17,24,39,.06);
            font-size: .95rem;
            color: var(--text);
        }

        #attachList tr:hover td{
            background: rgba(59,130,246,.05);
        }

        /* 페이지네이션 */
        #pagination{
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #pagination button{
            border: 1px solid rgba(17,24,39,.10);
            background: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            color: var(--muted);
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }

        #pagination button:hover{
            transform: translateY(-1px);
            border-color: rgba(59,130,246,.35);
            background: rgba(59,130,246,.06);
        }

        #pagination button.active{
            background: rgba(59,130,246,.12);
            border-color: rgba(59,130,246,.40);
            color: var(--text);
        }

        /* 하단 버튼 그룹 */
        .mt-4{
            margin-top: 16px !important;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn{
            appearance: none;
            border: 1px solid rgba(17,24,39,.10);
            background: var(--card);
            padding: 11px 14px;
            border-radius: 12px;
            font-weight: 900;
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(17,24,39,.06);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
        }

        .btn:hover{
            transform: translateY(-1px);
            box-shadow: var(--shadow2);
            border-color: rgba(59,130,246,.25);
            background: rgba(59,130,246,.05);
        }

        /* 수정/삭제 강조 */
        #update-btn.btn{
            background: linear-gradient(135deg, rgba(59,130,246,.14), rgba(255,255,255,0));
            border-color: rgba(59,130,246,.25);
        }

        #delete-btn.btn{
            background: linear-gradient(135deg, rgba(239,68,68,.12), rgba(255,255,255,0));
            border-color: rgba(239,68,68,.25);
        }

        #delete-btn.btn:hover{
            border-color: rgba(239,68,68,.40);
            background: rgba(239,68,68,.06);
        }

        /* 홈 링크 */
        .home-link{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            color: var(--primary2);
            text-decoration: none;
            font-weight: 900;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(59,130,246,.18);
            background: rgba(59,130,246,.06);
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }

        .home-link:hover{
            transform: translateY(-1px);
            border-color: rgba(59,130,246,.35);
            background: rgba(59,130,246,.10);
        }

    </style>
</head>
<body>
<!----
<div th:replace="~{common/header :: header}"></div>
--->
<div class="container">
    <h2>공지사항등록 </h2>

    <div class="author-box">
        작성자 : <span id="authorEmail">확인 중...</span>
    </div>

    <form id="noticeForm" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" placeholder="공지사항 제목을 입력하세요" required>
        </div>

        <div class="mb-3">
            <label for="contents">내용</label>
            <textarea id="contents" name="contents" placeholder="공지 내용을 입력하세요" required></textarea>
        </div>

        <div class="mb-3">
            <label >팝업여부</label><br>
            <label>
                <input type="radio"  name="isPopup" value="true" required> Y
            </label>
            &nbsp;&nbsp;
            <label>
                <input type="radio"  name="isPopup" value="false"> N
            </label>
        </div>

        <div class="mb-3">
            <label for="startedAt">팝업시작일</label>
            <input type="datetime-local" id="startedAt" name="startedAt" min="1" max="5" value="5" required>
        </div>

        <div class="mb-3">
            <label for="endedAt">팝업종료일</label>
            <input type="datetime-local" id="endedAt" name="endedAt" required>
        </div>

        <button type="submit" class="btn-submit">공지 등록</button>
        <a th:href="@{/notice/list}" class="btn-cancel">취소</a>
    </form>
</div>

<script>
    // ✅ 페이지 진입 시 accessToken 유효성 검증 및 사용자 정보 표시
    window.addEventListener("DOMContentLoaded", async () => {
        const token = localStorage.getItem("accessToken");

        if (!token) {
            // Spring Security에서 자동 리다이렉트 설정이 되어 있으면 여긴 안탐
            alert("로그인 후 이용해주세요.");
            window.location.href = "/auth/login";
            return;
        }

        // try {
        //     const response = await fetch("/api/v1/members/me", {
        //         method: "GET",
        //         headers: {
        //             "Authorization": `Bearer ${token}`
        //         }
        //     });
        //
        //     if (!response.ok) {
        //         alert("세션이 만료되었습니다. 다시 로그인해주세요.");
        //         localStorage.removeItem("accessToken");
        //         window.location.href = "/auth/login";
        //         return;
        //     }
        //
        //     const data = await response.json();
        //     document.getElementById("authorEmail").innerText = data.email || "(알 수 없음)";
        //
        // } catch (err) {
        //     console.error("사용자 정보 불러오기 실패:", err);
        //     alert("로그인 정보 확인 중 오류가 발생했습니다.");
        //     window.location.href = "/auth/login";
        // }

        setupPopupToggle();
    });

    function setupPopupToggle() {
        const radios = document.querySelectorAll('input[name="isPopup"]');
        const startAt = document.getElementById('startedAt');
        const endAt = document.getElementById('endedAt');

        function togglePopupDates(value) {
            const enabled = value === 'true';

            startAt.disabled = !enabled;
            endAt.disabled = !enabled;

            // Y일 때만 필수
            startAt.required = enabled;
            endAt.required = enabled;

            // N이면 값 제거(전송 방지)
            if (!enabled) {
                startAt.value = '';
                endAt.value = '';
            }
        }

        radios.forEach(r => {
            r.addEventListener('change', (e) => togglePopupDates(e.target.value));
        });

        // 현재 체크값 기준 반영
        const checked = document.querySelector('input[name="idPopup"]:checked');
        if (checked) togglePopupDates(checked.value);
    }


    // ✅ 공지 등록 fetch
    document.getElementById('noticeForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const token = localStorage.getItem("accessToken");
        if (!token) {
            alert("로그인 후 이용해주세요.");
            window.location.href = "/auth/login";
            return;
        }

        const formData = new FormData(e.target);

        try {


            const response = await fetch('/api/v1/notice', {
                method: 'POST',
                headers: {
                    "Authorization": `Bearer ${token}`
                },
                body: formData
            });

            const result = await response.json();

            if (response.ok) {
                alert('공지 등록 성공!');
                window.location.href = '/notice/list';
            } else {
                alert(result.message || '리뷰 등록 실패');
            }

        } catch (error) {
            console.error('공지사항 등록 중 오류 발생:', error);
            alert('공지사항 등록 중 오류가 발생했습니다.');
        }
    });
</script>
</body>
</html>
