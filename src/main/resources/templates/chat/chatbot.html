<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비즈포탈 어시스턴트</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --bot-bubble: #f3f4f6;
            --user-bubble: #4f46e5;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
        }

        .wrap {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        .top {
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .title { display: flex; align-items: center; gap: 12px; }
        .bot-logo {
            width: 32px; height: 32px;
            background: var(--primary-color);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 18px;
        }
        .title-text h1 { margin: 0; font-size: 18px; font-weight: 700; }

        .status-area { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; }
        .status-dot.on { background: #10b981; box-shadow: 0 0 8px #10b981; }

        .msgs {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .msg-group {
            display: flex;
            gap: 14px;
            max-width: 85%;
            animation: fadeInUp 0.3s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-group.me { flex-direction: row-reverse; align-self: flex-end; }

        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #eef2ff;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 18px;
            transition: all 0.3s ease;
        }

        /* 아바타 펄스 애니메이션 (유지) */
        .avatar.thinking {
            position: relative;
            z-index: 1;
            background: var(--primary-color) !important;
            color: white !important;
        }

        .avatar.thinking::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: var(--primary-color);
            opacity: 0.6;
            z-index: -1;
            animation: avatar-pulse 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .avatar.thinking::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: var(--primary-color);
            opacity: 0.4;
            z-index: -1;
            animation: avatar-pulse 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) 0.6s infinite;
        }

        @keyframes avatar-pulse {
            0% { transform: scale(1); opacity: 0.6; }
            80%, 100% { transform: scale(2.2); opacity: 0; }
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            position: relative;
        }

        /* ✅ [수정] 깜빡임 없는 정적 "..." */
        .thinking-dots {
            font-weight: bold;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        .msg-group.bot .bubble { background-color: var(--bot-bubble); border-top-left-radius: 2px; }
        .msg-group.me .bubble { background-color: var(--user-bubble); color: white; border-top-right-radius: 2px; }

        .action-area { margin-top: 14px; display: flex; justify-content: flex-start; }
        .action-btn {
            background: #ffffff; border: 1px solid var(--primary-color); color: var(--primary-color);
            padding: 10px 16px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 2px 6px rgba(79, 70, 229, 0.1);
            white-space: nowrap; line-height: 1;
        }

        .action-btn:hover {
            background: var(--primary-color); color: white;
            transform: translateY(-2px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .time-info { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: block; }
        .me .time-info { text-align: right; }

        .bottom-area { padding: 24px; background: white; border-top: 1px solid var(--border-color); }

        .input-wrapper {
            background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 10px 16px; display: flex; align-items: flex-end; gap: 12px;
            transition: opacity 0.3s ease;
        }
        .input-wrapper.loading { opacity: 0.6; cursor: not-allowed; }
        .input-wrapper.loading textarea { cursor: not-allowed; }

        textarea { flex: 1; border: none; background: transparent; outline: none; font-size: 15px; padding: 8px 0; resize: none; max-height: 150px; }
        .send-btn {
            background: var(--primary-color); color: white; border: none;
            width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .send-btn:disabled { background: #d1d5db; cursor: not-allowed; }
        /* 에러 메시지 전용 버블 스타일 */
        /* 에러 메시지 스타일 */
        .msg-group.bot.error-msg .bubble {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            font-weight: 500;
        }

        /* 에러 발생 시 입력창을 완전히 막는 스타일 */
        .input-wrapper.fatal-error {
            opacity: 0.5;
            pointer-events: none; /* 클릭 불가 */
            background-color: #f3f4f6;
        }
    </style>
</head>

<body>
<div class="wrap">
    <div class="top">
        <div class="title">
            <div class="bot-logo">AI</div>
            <div class="title-text">
                <h1>비즈포탈 어시스턴트</h1>
                <div class="status-area">
                    <span id="connDot" class="status-dot"></span>
                    <span id="statusText">연결 대기 중</span>
                </div>
            </div>
        </div>
        <div class="actions">
            <button style="border:none; background:none; color:var(--text-muted); font-size:12px; cursor:pointer;" onclick="location.reload()">새로고침</button>
        </div>
    </div>

    <div class="msgs" id="messages"></div>

    <div class="bottom-area">
        <div id="inputWrapper" class="input-wrapper">
            <textarea id="messageInput" placeholder="궁금한 규정에 대해 물어보세요..." rows="1" autocomplete="off"></textarea>
            <button id="sendBtn" class="send-btn" onclick="sendQuestion()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:11px; color:#9ca3af; padding: 0 4px;">
            <span id="byteInfo">0 / 61440 bytes</span>
            <span>사내 규정 및 회사 데이터 기반 답변입니다.</span>
        </div>
    </div>
</div>

<script>
    const msgDomMap = new Map();
    let isProcessing = false;

    function getSessionId() {
        let sessionId = sessionStorage.getItem("CHAT_SESSION_ID");
        if (!sessionId) {
            sessionId = crypto.randomUUID();
            sessionStorage.setItem("CHAT_SESSION_ID", sessionId);
        }
        return sessionId;
    }

    function authHeaders() { return { 'Content-Type': 'application/json', 'X-Session-Id': getSessionId() }; }
    function escapeHtml(str) { return String(str ?? "").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[s])); }
    function linkify(text) { return text.replace(/(https?:\/\/[^\s]+)/g, url => `<a href="${url}" target="_blank" style="color:inherit; font-weight:600;">${url}</a>`); }
    function nowTime() { return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

    function setIsUpdating(loading) {
        isProcessing = loading;
        const input = document.getElementById("messageInput");
        const btn = document.getElementById("sendBtn");
        const wrapper = document.getElementById("inputWrapper");

        input.disabled = loading;
        btn.disabled = loading;

        if (loading) {
            wrapper.classList.add("loading");
            input.placeholder = "답변을 생성하고 있습니다...";
        } else {
            wrapper.classList.remove("loading");
            input.placeholder = "궁금한 규정에 대해 물어보세요...";
            input.focus();
        }
    }

    function moveToParent(url) {
        if (window.opener && !window.opener.closed) {
            window.opener.location.href = url;
            window.opener.focus();
        } else { window.location.href = url; }
    }

    function appendBubble({ role, senderLabel, content, messageId, createdAt }) {
        const box = document.getElementById("messages");
        const group = document.createElement("div");
        const isBot = role !== "USER";
        group.className = isBot ? "msg-group bot" : "msg-group me";

        const isThinking = (isBot && !content && senderLabel !== "시스템 가이드");
        const avatarClass = isThinking ? "avatar thinking" : "avatar";

        // ✅ 정적 "..." 텍스트 삽입
        const displayContent = isThinking ? `<span class="thinking-dots">...</span>` : linkify(escapeHtml(content ?? ""));

        let html = isBot ? `<div class="${avatarClass}">🤖</div>` : "";
        const time = createdAt ? new Date(createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : nowTime();

        html += `<div class="msg-content"><div class="bubble">${displayContent}</div><span class="time-info">${time}</span></div>`;
        group.innerHTML = html;
        box.appendChild(group);

        if (messageId) {
            msgDomMap.set(messageId, {
                bubbleEl: group.querySelector(".bubble"),
                timeEl: group.querySelector(".time-info"),
                avatarEl: group.querySelector(".avatar"),
                isThinking: isThinking
            });
        }
        box.scrollTop = box.scrollHeight;
        return group;
    }

    async function showDocumentGuide() {
        try {
            const res = await fetch("/api/v1/prov-documents/chatbot?size=100", { method: "GET", headers: authHeaders() });
            if (!res.ok) return;
            const raw = await res.json();
            const docs = raw?.data?.content ?? [];
            if (docs.length > 0) {
                const listText = docs.map(d => `• ${d.docTitle}`).join("\n");
                appendBubble({ role: "ASSISTANT", senderLabel: "시스템 가이드", content: `안녕하세요! 😊 질문하실 수 있는 규정 목록입니다.\n\n${listText}` });
            }
        } catch (e) { console.error("가이드 로드 실패:", e); }
    }

    async function sendQuestion() {
        if (isProcessing) return;
        const input = document.getElementById("messageInput");
        const question = input.value.trim();
        if (!question) return;

        setIsUpdating(true);
        appendBubble({ role: "USER", content: question });
        input.value = "";
        input.style.height = "auto";

        try {
            const res = await fetch("/api/v1/chatbot/messages", {
                method: "POST",
                headers: authHeaders(),
                body: JSON.stringify({ question })
            });
            const raw = await res.json();
            if(raw.data?.assistantMessageId) {
                appendBubble({ role: "ASSISTANT", messageId: raw.data.assistantMessageId, content: "" });
            }
        } catch (e) {
            console.error("전송 오류:", e);
            setIsUpdating(false);
        }
    }

    function connectSse() {
        const sId = getSessionId();
        const es = new EventSource(`/api/v1/chatbot/stream?sessionId=${sId}`, { withCredentials: true });

        es.addEventListener("connected", () => {
            document.getElementById("statusText").innerText = "온라인";
            document.getElementById("connDot").classList.add("on");
        });

        const chunkBuffer = new Map(); // messageId -> Map(seq -> chunk)

        es.addEventListener("chunk", (e) => {
            const data = JSON.parse(e.data);
            const ref = msgDomMap.get(data.messageId);
            if (!ref) return;

            if (!chunkBuffer.has(data.messageId)) {
                chunkBuffer.set(data.messageId, new Map());
            }
            chunkBuffer.get(data.messageId).set(data.seq, data.delta);

            // seq 순서대로 재조립
            const ordered = Array.from(chunkBuffer.get(data.messageId).entries())
                .sort((a,b) => a[0]-b[0])
                .map(([,v]) => v)
                .join("");

            if (ref.isThinking) { ref.avatarEl?.classList.remove("thinking"); ref.bubbleEl.innerHTML = ""; ref.isThinking = false; }
            ref.bubbleEl.textContent = ordered;
            document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
        });
        // 서버에서 보낸 에러 이벤트 처리
        es.addEventListener("error", (e) => {
            try {
                const data = JSON.parse(e.data);
                const ref = msgDomMap.get(data.messageId);

                if (ref) {
                    if (ref.avatarEl) ref.avatarEl.classList.remove("thinking");

                    // 1. 에러 메시지 표시
                    ref.bubbleEl.parentElement.parentElement.classList.add("error-msg");
                    ref.bubbleEl.innerText = data.message || "AI 서버와 연결할 수 없습니다.";

                    // 2. 입력창 영구 차단
                    const input = document.getElementById("messageInput");
                    const wrapper = document.getElementById("inputWrapper");

                    input.disabled = true;
                    input.placeholder = "서비스 점검 중입니다. 페이지를 새로고침 해주세요.";
                    wrapper.classList.add("fatal-error");

                    // 3. 버튼을 '새로고침' 용도로 변경하거나 별도 버튼 표시
                    const actionArea = document.createElement("div");
                    actionArea.className = "action-area";
                    actionArea.innerHTML = `
                <button class="action-btn" onclick="location.reload()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    <span>새로고침하여 다시 시도하기</span>
                </button>`;
                    ref.bubbleEl.appendChild(actionArea);
                }
            } catch (err) {
                console.error("에러 처리 중 오류:", err);
            }
            // setIsUpdating(false); // ✅ 이 줄을 삭제하거나 주석 처리하여 입력창 활성화를 막습니다!
        });

        es.addEventListener("action", (e) => {
            const data = JSON.parse(e.data);
            const ref = msgDomMap.get(data.messageId);
            if (ref && data.url) {
                if (ref.bubbleEl.querySelector(".action-area")) return;
                const actionArea = document.createElement("div");
                actionArea.className = "action-area";
                actionArea.innerHTML = `
                    <button class="action-btn" onclick="moveToParent('${data.url}')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        <span>${escapeHtml(data.label || '페이지로 이동')}</span>
                    </button>`;
                ref.bubbleEl.appendChild(actionArea);
                document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
            }
        });

        es.addEventListener("done", (e) => {
            const data = JSON.parse(e.data);
            const ref = msgDomMap.get(data.messageId);
            if (ref && data.fullText) {
                ref.bubbleEl.textContent = data.fullText; // 최종 보정
            }
            if (ref) ref.timeEl.innerText = nowTime();
            setIsUpdating(false);
        });

        es.onerror = () => { setIsUpdating(false);
            document.getElementById("statusText").innerText = "오프라인";
            document.getElementById("connDot").classList.remove("on");};
    }

    window.addEventListener("load", () => {
        connectSse();
        showDocumentGuide();
        const input = document.getElementById("messageInput");
        input.addEventListener("input", function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            document.getElementById("byteInfo").innerText = `${new TextEncoder().encode(this.value).length} / 61440 bytes`;
        });
        input.addEventListener("keydown", e => {
            if (e.isComposing || isProcessing) return;
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuestion();
            }
        });
    });
</script>
</body>
</html>
