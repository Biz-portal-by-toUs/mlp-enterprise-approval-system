apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizportal-api
  namespace: bizportal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bizportal-api
  template:
    metadata:
      labels:
        app: bizportal-api
    spec:
      containers:
        - name: api
          # ✅ Jenkins envsubst 로 실제 값이 치환됨
          image: ${ECR_REPO_URI}:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8090

          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: bizportal-config
                  key: SPRING_PROFILES_ACTIVE

            # ✅ RDS
            - name: DB_PROD_URL
              valueFrom:
                secretKeyRef:
                  name: bizportal-secrets
                  key: DB_PROD_URL
            - name: DB_PROD_USER
              valueFrom:
                secretKeyRef:
                  name: bizportal-secrets
                  key: DB_PROD_USER
            - name: DB_PROD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bizportal-secrets
                  key: DB_PROD_PASSWORD

            # ✅ Mongo Atlas URI (ConfigMap)
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: bizportal-config
                  key: MONGODB_URI

            # ✅ ElastiCache Redis (ConfigMap)
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: bizportal-config
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: bizportal-config
                  key: REDIS_PORT

            # ✅ Elasticsearch / Weaviate (ConfigMap)
            - name: ELASTIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: bizportal-config
                  key: ELASTIC_HOST
            - name: WEAVIATE_HTTP_URL
              valueFrom:
                configMapKeyRef:
                  name: bizportal-config
                  key: WEAVIATE_HTTP_URL

            - name: JUSO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bizportal-secrets
                  key: JUSO_API_KEY

            - name: HOLIDAY_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: bizportal-secrets
                  key: HOLIDAY_SERVICE_KEY

            - name: NTS_API_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: bizportal-secrets
                  key: NTS_API_SERVICE_KEY

            - name: JWT_SECRET
              valueFrom:
                  secretKeyRef:
                    name: bizportal-secrets
                    key: JWT_SECRET

            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: bizportal-secrets
                  key: JWT_ISSUER


          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 25
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 45
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: bizportal-api-svc
  namespace: bizportal
spec:
  selector:
    app: bizportal-api
  ports:
    - name: http
      port: 80
      targetPort: 8090
  type: ClusterIP