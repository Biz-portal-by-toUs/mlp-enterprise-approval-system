<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="subbar form-subbar" th:fragment="mailSidebar(active)">
    <style>
        .subbar.form-subbar{
            height: 100%;
            min-height: 100%;
            background: rgba(59,130,246,.08) !important;
            border-right: 1px solid rgba(59,130,246,.14) !important;
            box-shadow: 10px 0 24px rgba(17,24,39,.10) !important;
            border-radius: 0 !important;
            overflow: hidden !important;
            align-self: stretch;
        }

        .subbar.form-subbar .subbar-title{
            font-weight:700;
            font-size:12px;
            color: rgba(31,41,55,.72);
            padding: 12px 14px 10px;
            margin:0;
            border-bottom: 1px solid rgba(59,130,246,.14);
            background: rgba(255,255,255,.30);
        }

        .subbar.form-subbar .subbar-nav{
            display:flex;
            flex-direction:column;
            gap:0;
            padding: 10px 0;
        }

        .subbar.form-subbar .subbar-item{
            position:relative;
            display:flex;
            align-items:center;
            height:44px;
            padding: 0 14px 0 20px;
            text-decoration:none;
            font-size:13px;
            font-weight:600;
            color: var(--primary2);
            transition: background .12s ease, color .12s ease;
        }

        .subbar.form-subbar .subbar-item:hover{
            background: rgba(59,130,246,.08);
        }

        .subbar.form-subbar .subbar-item.active{
            background: rgba(59,130,246,.14);
            color:#1d4ed8;
        }

        .subbar.form-subbar .subbar-item.active::before{
            content:"";
            position:absolute;
            left:10px;
            top:50%;
            transform:translateY(-50%);
            width:3px;
            height:26px;
            border-radius:999px;
            background: var(--primary);
        }
        .subbar.form-subbar .subbar-badge{
            margin-left:6px;
            font-size:11px;
            font-weight:800;
            color: rgba(31,41,55,.65);
        }
        .subbar.form-subbar .subbar-item.active .subbar-badge{
            color:#1d4ed8;
        }
    </style>

    <h3 class="subbar-title">메일</h3>

    <nav class="subbar-nav" id="mailNav" th:attr="data-active=${active}">
        <a class="subbar-item" data-key="received"
           th:href="@{/mail/received}"
           th:classappend="${active} == 'received' ? ' active' : ''">받은 메일함
            <span class="subbar-badge"
                  th:if="${unreadInboxCount != null and unreadInboxCount > 0}"
                  th:text="'(' + ${unreadInboxCount} + ')'">(0)</span>
        </a>

        <a class="subbar-item" data-key="sent"
           th:href="@{/mail/sent}"
           th:classappend="${active} == 'sent' ? ' active' : ''">보낸 메일함</a>

        <a class="subbar-item" data-key="self"
           th:href="@{/mail/self}"
           th:classappend="${active} == 'self' ? ' active' : ''">내게 쓴 메일함</a>

        <a class="subbar-item" data-key="drafts"
           th:href="@{/mail/drafts}"
           th:classappend="${active} == 'drafts' ? ' active' : ''">임시보관함</a>

        <a class="subbar-item" data-key="trash"
           th:href="@{/mail/trash}"
           th:classappend="${active} == 'trash' ? ' active' : ''">휴지통</a>
    </nav>
</aside>

</body>
</html>
