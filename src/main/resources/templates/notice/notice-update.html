<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지 사항 변경</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles1.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: rgba(17, 24, 39, 0.08);
            --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            --shadow2: 0 6px 18px rgba(17, 24, 39, 0.10);

            --primary: #3b82f6;
            --primary2: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --warn: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: radial-gradient(1200px 600px at 15% -10%, rgba(59, 130, 246, .15), transparent 55%),
            radial-gradient(900px 500px at 90% 0%, rgba(16, 185, 129, .12), transparent 55%),
            var(--bg);
            font-family: 'Noto Sans KR', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            color: var(--text);
        }

        /* 페이지 카드 */
        .container {
            max-width: 920px;
            margin: 64px auto;
            padding: 0;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        /* 폼 카드 */
        .container > h2 {
            margin: 0 0 14px;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -0.3px;
            text-align: left;
        }

        #updateForm {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 22px;
        }

        /* 섹션 느낌: label */
        #updateForm label {
            display: inline-block;
            margin: 10px 0 6px;
            font-weight: 900;
            color: rgba(31, 41, 55, .85);
            letter-spacing: -0.2px;
        }

        /* input/textarea/select 공통 */
        #updateForm input[type="text"],
        #updateForm input[type="datetime-local"],
        #updateForm textarea,
        #updateForm select {
            width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(17, 24, 39, .10);
            padding: 11px 12px;
            background: #fff;
            color: var(--text);
            font-weight: 700;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
        }

        /* textarea */
        #updateForm textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.6;
        }

        /* focus */
        #updateForm input:focus,
        #updateForm textarea:focus,
        #updateForm select:focus {
            border-color: rgba(59, 130, 246, .45);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, .12);
        }

        /* disabled */
        #updateForm input:disabled {
            background: rgba(17, 24, 39, .03);
            color: rgba(31, 41, 55, .50);
        }

        /* 라디오 영역을 “칩”처럼 */
        #updateForm .mb-3:has(input[type="radio"]) {
            margin-top: 8px;
        }

        #updateForm input[type="radio"] {
            accent-color: var(--primary2);
            transform: translateY(1px);
        }

        #updateForm .mb-3 label {
            margin-right: 10px;
        }

        #updateForm .mb-3 label:has(input[type="radio"]) {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 999px;
            border: 1px solid rgba(17, 24, 39, .10);
            background: rgba(17, 24, 39, .02);
            cursor: pointer;
            user-select: none;
            transition: transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
        }

        #updateForm .mb-3 label:has(input[type="radio"]):hover {
            transform: translateY(-1px);
            border-color: rgba(59, 130, 246, .25);
            background: rgba(59, 130, 246, .06);
            box-shadow: 0 10px 20px rgba(17, 24, 39, .06);
        }

        /* 버튼: 상세/목록과 동일 톤 */
        #updateForm button[type="submit"] {
            width: 100%;
            margin-top: 10px;
            border: 1px solid rgba(59, 130, 246, .25);
            background: linear-gradient(135deg, rgba(59, 130, 246, .14), rgba(255, 255, 255, 0));
            padding: 12px 14px;
            border-radius: 12px;
            font-weight: 900;
            color: var(--text);
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(17, 24, 39, .06);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
        }

        #updateForm button[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow2);
            border-color: rgba(59, 130, 246, .40);
            background: rgba(59, 130, 246, .10);
        }

        /* 홈으로 돌아가기 링크 버튼화 */
        .container > a[href="/main"] {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            text-decoration: none;
            font-weight: 900;
            color: var(--primary2);
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(59, 130, 246, .18);
            background: rgba(59, 130, 246, .06);
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }

        .container > a[href="/main"]:hover {
            transform: translateY(-1px);
            border-color: rgba(59, 130, 246, .35);
            background: rgba(59, 130, 246, .10);
        }

        /* 간격 정리 (Bootstrap mb-3랑 같이 써도 OK) */
        #updateForm .mb-3 {
            margin-bottom: 14px !important;
        }

        /* 모바일 */
        @media (max-width: 760px) {
            .container {
                padding: 0 14px;
            }

            #updateForm {
                padding: 16px;
            }
        }

        /* 첨부파일 테이블 */
        #attachList {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 12px;
        }

        #attachList th {
            text-align: left;
            font-size: .9rem;
            color: var(--muted);
            background: rgba(17, 24, 39, .03);
            padding: 12px 12px;
            border-bottom: 1px solid rgba(17, 24, 39, .08);
            font-weight: 800;
        }

        #attachList td {
            padding: 12px 12px;
            border-bottom: 1px solid rgba(17, 24, 39, .06);
            font-size: .95rem;
            color: var(--text);
        }

        #attachList tr:hover td {
            background: rgba(59, 130, 246, .05);
        }

        /* 탭 버튼 영역 */
        .tab-buttons {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }

        /* 등록 버튼도 살짝 고급스럽게 */
        .btn-submit {
            padding: 14px 22px;
            border-radius: 14px;
            font-weight: 900;
            border: 1px solid rgba(59, 130, 246, .25);
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            box-shadow: 0 12px 24px rgba(59, 130, 246, .35);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 32px rgba(59, 130, 246, .45);
        }

        /* 폼 하단 버튼 영역: 오른쪽 정렬 */
        #updateForm .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
        }

        /* submit 기본(기존) 100% 규칙 무력화 + 일반 버튼 크기 */
        #updateForm button[type="submit"].btn-submit--sm {
            width: auto !important;
            margin-top: 0;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: .95rem;
            box-shadow: 0 10px 20px rgba(17, 24, 39, .08);
        }

        /* hover 살짝만 */
        #updateForm button[type="submit"].btn-submit--sm:hover {
            transform: translateY(-1px);
        }

        /* 첨부파일 섹션: 폼 안 카드 느낌 */
        .attach-section{
            margin-top: 18px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 14px;
        }

        .attach-head{
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .attach-title{
            margin: 0;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: -0.2px;
        }

        .attach-link{
            display: inline-flex;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(59,130,246,.18);
            background: rgba(59,130,246,.06);
            color: var(--primary2);
            font-weight: 900;
            text-decoration: none;
        }

        .attach-link:hover{
            transform: translateY(-1px);
            background: rgba(59,130,246,.10);
            border-color: rgba(59,130,246,.35);
        }

        /* 오른쪽 액션 영역 */
        .attach-actions{
            margin-left: auto;                 /* ✅ 오른쪽 끝으로 밀기 */
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        /* 새로고침 아이콘 버튼 */
        .attach-refresh{
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid rgba(59,130,246,.18);
            background: rgba(59,130,246,.06);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
            position: relative;
        }

        /* 아이콘(문자 대신 CSS로) */
        .attach-refresh::before{
            content: "⟳";                      /* ✅ 새로고침 느낌 */
            font-size: 18px;
            font-weight: 900;
            color: var(--primary2);
            line-height: 1;
        }

        .attach-refresh:hover{
            transform: translateY(-1px);
            background: rgba(59,130,246,.10);
            border-color: rgba(59,130,246,.35);
        }



    </style>

</head>
<body>
<div class="header">
    <!----
    <th:block th:replace="~{common/header :: header}"/>
    --->
</div>
<div class="container">
    <h2>공지 사항 수정</h2>
    <form id="updateForm" enctype="multipart/form-data">
        <!-- 공지 사항 코드 -->
        <input type="hidden" id="noticeNo" name="noticeNo" th:value="${noticeNo}">

        <!-- 제목 -->
        <div>
            <label for="title">제목:</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="mb-3">
            <label for="contents">내용</label>
            <textarea id="contents" name="contents" placeholder="공지 내용을 입력하세요" required></textarea>
        </div>

        <div class="mb-3">
            <label>팝업여부</label><br>
            <label>
                <input type="radio" id="isPopup" name="isPopup" value="true" required> Y
            </label>
            &nbsp;&nbsp;
            <label>
                <input type="radio" name="isPopup" value="false"> N
            </label>
        </div>

        <div class="mb-3">
            <label for="startedAt">팝업시작일</label>
            <input type="datetime-local" id="startedAt" name="startedAt" required>
        </div>

        <div class="mb-3">
            <label for="endedAt">팝업종료일</label>
            <input type="datetime-local" id="endedAt" name="endedAt" required>
        </div>

        <!-- ✅ 첨부파일 섹션 (항상 노출) -->
        <section class="attach-section">
            <div class="attach-head">
                <h3 class="attach-title">첨부 파일</h3>

                <!-- 오른쪽 버튼 그룹 -->
                <div class="attach-actions">
                    <button type="button" class="attach-refresh" id="refreshAttachBtn" aria-label="새로고침"></button>

                    <a class="attach-link"
                       th:href="@{/notice/Attachment-notice/{noticeNo}(noticeNo=${noticeNo})}"
                       target="_blank">
                        첨부파일등록
                    </a>
                </div>

            </div>

            <div class="attach-body">
                <table id="attachList" class="table table-striped"></table>
            </div>
        </section>

        <div class="form-actions">
            <button type="submit" class="btn-submit btn-submit--sm">수정하기</button>
        </div>

    </form>

</div>
<div class="footer">
    <!--
    <th:block th:replace="~{common/footer :: footer}"/>
    --->
</div>

<script th:inline="javascript">
    const noticeNo = [[${noticeNo}]];
    const API_BASE = "http://localhost:8090";

    function toDatetimeLocal(value) {
        if (!value) return "";
        // 예: 2025-12-23T10:30:00 -> 2025-12-23T10:30
        if (value.includes("T")) return value.substring(0, 16);
        // 예: 2025-12-23 10:30:00 -> 2025-12-23T10:30
        return value.replace(" ", "T").substring(0, 16);
    }

    function setupPopupToggle() {
        const radios = document.querySelectorAll('input[name="isPopup"]');
        const startAt = document.getElementById('startedAt');
        const endAt = document.getElementById('endedAt');

        function togglePopupDates(value) {
            const enabled = value === 'true';

            startAt.disabled = !enabled;
            endAt.disabled = !enabled;

            // Y일 때만 필수
            startAt.required = enabled;
            endAt.required = enabled;

            // N이면 값 제거(전송 방지)
            if (!enabled) {
                startAt.value = '';
                endAt.value = '';
            }
        }

        radios.forEach(r => {
            r.addEventListener('change', (e) => togglePopupDates(e.target.value));
        });

        // 현재 체크값 기준 반영
        const checked = document.querySelector('input[name="isPopup"]:checked');
        if (checked) togglePopupDates(checked.value);
    }

    // 수정 화면 초기 데이터 로드
    async function loadNoticeDetails() {

        try {
            const token = localStorage.getItem('accessToken');
            const response = await fetch(`${API_BASE}/api/v1/notice/${noticeNo}`, {
                method: 'GET',
                headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'}
            });

            const result = await response.json();

            if (result.status === 200 && result.data) {
                const notice = result.data;

                // 필드에 초기값 설정

                document.getElementById('title').value = notice.title ?? "";
                document.getElementById('contents').value = notice.contents ?? "";

                // 라디오 checked 처리
                const popupValue = String(notice.isPopup); // "true" / "false"
                const radio = document.querySelector(`input[name="isPopup"][value="${popupValue}"]`);
                if (radio) radio.checked = true;

                document.getElementById('startedAt').value = toDatetimeLocal(notice.startedAt);
                document.getElementById('endedAt').value = toDatetimeLocal(notice.endedAt);
                setupPopupToggle();

                initAttach();
            } else {
                alert('공지사항을 불러오는 데 실패했습니다.');
            }
        } catch (error) {
            console.error('Error loading notice details:', error);
            alert('공지사항을 불러오는 중 오류가 발생했습니다.');
        }

    }

    // 폼 제출 처리
    document.getElementById('updateForm').onsubmit = async function (event) {
        event.preventDefault();

        const formData = new FormData(this);

        try {
            const token = localStorage.getItem('accessToken');
            const response = await fetch(`${API_BASE}/api/v1/notice/${noticeNo}`, {
                method: 'PUT',
                headers: {
                    "Authorization": `Bearer ${token}`
                },
                body: formData,
            });

            const result = await response.json();

            if (response.ok) {
                alert('공지사항이 수정되었습니다.!');
                window.location.href = '/notice/list';
            } else {
                alert(result.message || '공지사항 수정 실패');
            }

        } catch (error) {
            console.error('Error updating notice:', error);
            alert('공지사항 수정 중 오류가 발생했습니다.');
        }
    };


    async function initAttach() {
        try {
            const token = localStorage.getItem('accessToken');
            const response = await fetch(`${API_BASE}/api/v1/attachments?domain=NOTICE&entityId=${noticeNo}`, {
                method: 'GET',
                headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'}
            });

            const result = await response.json();
            const attachList = document.getElementById('attachList');
            attachList.innerHTML = "";

            if (result.status === 200 && result.data?.length) {
                const attachs = result.data;

                attachList.insertAdjacentHTML("beforeend", `
        <tr>
          <th>일련번호</th>
          <th>파일명</th>
          <th>attachmentId</th>
          <th>displayOrder</th>
          <th>size</th>
          <th>삭제</th>
        </tr>
      `);

                attachs.forEach((r,index) => {
                    attachList.insertAdjacentHTML("beforeend", `
                              <tr>
                                <td>${index+1}</td>
                                <td>${r.originalName}</td>
                                <td>${r.attachmentId}</td>
                                <td>${r.displayOrder}</td>
                                <td>${formatFileSize(r.size)}</td>
                                <td><button type="button" data-attachment-id="${r.attachmentId}">삭제</button></td>
                              </tr>
                            `);
                });

                attachList.querySelectorAll("button[data-attachment-id]").forEach(btn => {
                    btn.addEventListener("click", async (e) => {
                        const attachmentId = Number(e.currentTarget.getAttribute("data-attachment-id"));
                        await deleteAttachment(attachmentId);
                    });
                });

            } else {
                attachList.innerHTML = `<tr><td colspan="5">관련 첨부파일이 없습니다.</td></tr>`;
            }

        } catch (error) {
            console.error('Failed to load attachment file:', error);
        }
    }

    function formatFileSize(bytes) {
        if (bytes == null || isNaN(bytes)) return "-";
        if (bytes < 1024) return `${bytes} B`;

        const kb = bytes / 1024;
        if (kb < 1024) return `${kb.toFixed(1)} KB`;

        const mb = kb / 1024;
        return `${mb.toFixed(1)} MB`;
    }


    document.getElementById("refreshAttachBtn")
        ?.addEventListener("click", () => {
            console.log("첨부파일 목록 새로고침");
            initAttach();
        });


    window.initAttach = initAttach;

    window.addEventListener('message', (event) => {
        // 필요하면 보안 체크(권장): 첨부 등록 페이지 origin으로 제한
        // 예: if (event.origin !== "http://localhost:8080") return;
        console.log("message from:", event.origin, event.data);
       // if (event.origin !== "http://localhost:8090") return;
        if (event.data && event.data.type === 'ATTACH_UPDATED') {
            window.initAttach();
        }
    });

    function unwrapMaybeResponseDto(obj) {
        if (obj && typeof obj === "object" && "data" in obj) return obj.data;
        return obj;
    }

    async function deleteAttachment(attachmentId) {
        if (!attachmentId) return;
        if (!confirm(`attachmentId=${attachmentId} 파일을 삭제 할까요?`)) return;

        try {
            const token = localStorage.getItem('accessToken');
            const res = await fetch(`${API_BASE}/api/v1/attachments/${attachmentId}`, {
                method: "DELETE",
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                credentials: "include"
            });

            if (!res.ok) throw new Error("삭제 실패: " + await res.text());
            const raw = await res.json();
            const data = unwrapMaybeResponseDto(raw);
            initAttach();

        } catch (e) {
            console.error(e);

        }
    }

    // 페이지 로드 시 초기 데이터 로드
    document.addEventListener('DOMContentLoaded', loadNoticeDetails);
</script>

</body>
</html>
