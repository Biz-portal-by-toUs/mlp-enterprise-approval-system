<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- active: 'list' | 'pending' -->
<aside class="subbar" th:fragment="formSidebar(active)">
    <h3 class="subbar-title">문서양식</h3>

    <nav class="subbar-nav">
        <a class="subbar-item"
           th:href="@{/form/forms}"
           th:classappend="${active} == 'list' ? ' active' : ''">
            전체 양식
        </a>

        <a class="subbar-item"
           th:href="@{/form/pending}"
           th:classappend="${active} == 'pending' ? ' active' : ''">
            승인 대기 문서 양식
        </a>
    </nav>
</aside>
</body>
</html>
