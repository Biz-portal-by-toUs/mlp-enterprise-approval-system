<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<head>
    <meta charset="utf-8" />
    <title>Bizportal - 공유 설비 조회</title>

    <!-- 이 페이지 전용 CSS -->
    <th:block layout:fragment="pageStyles">
        <style>
            .shared-eq-page {
                padding: 22px 26px;
            }

            .page-title {
                font-size: 20px;
                font-weight: 800;
                margin: 2px 0 14px;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 16px;
            }

            @media (max-width: 1100px){
                .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
            }
            @media (max-width: 720px){
                .grid { grid-template-columns: 1fr; }
            }

            .card {
                background: #ffffff;
                border: 1px solid rgba(17,24,39,0.08);
                border-radius: 14px;
                overflow: hidden;
                box-shadow: 0 6px 18px rgba(0,0,0,.08);
                display: flex;
                flex-direction: column;
                min-height: 320px;
            }

            .thumb {
                height: 160px;
                background: #e5e7eb;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .thumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .thumb .ph {
                color: #6b7280;
                font-size: 12px;
            }

            .card-body {
                padding: 12px 14px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .eq-name {
                font-weight: 800;
            }

            .meta {
                font-size: 12px;
                color: #6b7280;
                line-height: 1.45;
            }

            .meta b {
                color: #111827;
                font-weight: 700;
            }

            .divider {
                height: 1px;
                background: rgba(17,24,39,0.08);
                margin: 2px 0;
            }

            .paging {
                margin-top: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                flex-wrap: wrap;
            }

            .page-btn {
                min-width: 36px;
                height: 36px;
                border-radius: 10px;
                border: 1px solid rgba(17,24,39,0.08);
                background: #ffffff;
                cursor: pointer;
                font-size: 13px;
            }

            .page-btn.active {
                background: #3b82f6;
                border-color: #3b82f6;
                color: #fff;
                font-weight: 700;
            }

            .error {
                margin: 12px 0;
                padding: 10px 12px;
                border: 1px solid #fecaca;
                background: #fff1f2;
                color: #991b1b;
                border-radius: 12px;
                display: none;
                font-size: 13px;
            }

            /* 카드 선택 */
            .card.selectable {
                cursor: pointer;
            }
            .card.selected {
                outline: 3px solid #3b82f6;
            }
            .card.selectable:hover {
                box-shadow: 0 0 0 2px rgba(22,119,255,.4);
            }

            /* 관리자 액션 바 (등록/수정/삭제 버튼) */
            .action-bar {
                display: none;               /* JS에서 제어 */
                justify-content: flex-end;   /* 오른쪽 정렬 */
                align-items: center;
                gap: 10px;

                margin-top: 12px;
                margin-bottom: 12px;
                padding-right: 4px;
            }

            .action-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;

                padding: 8px 14px;
                border-radius: 8px;
                border: none;
                font-size: 14px;
                cursor: pointer;

                background-color: #1677ff;
                color: #fff;
                transition: background-color 0.2s ease;
            }

            .action-btn:hover:not(:disabled) {
                background-color: #4096ff;
            }

            .action-btn:disabled {
                background-color: #e5e7eb;
                color: #9ca3af;
                cursor: not-allowed;
            }

            .action-btn.danger:not(:disabled) {
                background-color: #ef4444;
            }

            /* 삭제 확인 모달 */
            .modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000;
            }

            .hidden {
                display: none;
            }

            .modal-content {
                background: #fff;
                padding: 24px;
                border-radius: 10px;
                width: 360px;
                text-align: center;
            }

            .modal-title {
                margin-bottom: 12px;
                color: #d32f2f;
            }

            .modal-text {
                margin-bottom: 20px;
                font-size: 14px;
                line-height: 1.5;
            }

            .modal-actions {
                display: flex;
                justify-content: space-between;
                gap: 12px;
            }

            .modal .btn {
                flex: 1;
                padding: 10px 0;
                border-radius: 6px;
                font-size: 14px;
                cursor: pointer;
                border: none;
                transition: background 0.2s, transform 0.1s;
            }

            .modal .btn.cancel {
                background: #e0e0e0;
                color: #333;
            }

            .modal .btn.cancel:hover {
                background: #cfcfcf;
            }

            .modal .btn.delete {
                background: #d32f2f;
                color: #fff;
            }

            .modal .btn.delete:hover {
                background: #b71c1c;
            }

            .modal .btn:hover {
                transform: translateY(-1px);
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <!-- 🔹 왼쪽: 예약 서브 사이드바 (공유 설비 예약 active) -->
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('equipment')"></aside>

        <!-- 🔹 오른쪽: 공유 설비 조회 화면 -->
        <main class="shared-eq-page">
            <div class="page-title">공유 설비</div>

            <div class="error" id="errBox"></div>

            <section class="grid" id="grid"></section>

            <!-- 관리자일 때만 JS에서 보이게 -->
            <div id="actionBar" class="action-bar">
                <button id="btnCreate" class="action-btn">등록</button>
                <button id="btnEdit" class="action-btn" disabled>선택 수정</button>
                <button id="btnDelete" class="action-btn danger" disabled>선택 삭제</button>
            </div>

            <div class="paging" id="paging"></div>
        </main>
    </section>

    <!-- 삭제 확인 모달 -->
    <div id="deleteModal" class="modal hidden">
        <div class="modal-content">
            <h3 class="modal-title">⚠️ 공유 설비 삭제</h3>
            <p class="modal-text">
                공유 설비 삭제하면 <b>되돌릴 수 없습니다.</b><br>
                정말 삭제하시겠습니까?
            </p>

            <div class="modal-actions">
                <button id="confirmDeleteBtn" class="btn delete">삭제</button>
                <button id="cancelDeleteBtn" class="btn cancel">취소</button>
            </div>
        </div>
    </div>
</div>

<!-- 이 페이지 전용 JS -->
<th:block layout:fragment="pageScripts">
    <script>
        let selectedEqNo = null;
        let isAdmin = false;

        // 이미지 없을 때 띄워줄 이미지
        const NO_IMAGE_URL = "/images/no-image.png";

        // httpOnly cookie 방식: 같은 오리진이면 origin 쓰는 게 제일 안전
        const API_BASE = window.location.origin;

        const grid   = document.getElementById("grid");
        const paging = document.getElementById("paging");
        const errBox = document.getElementById("errBox");

        let state = {
            page: 0,      // 0부터 시작 (Spring PageRequest)
            size: 6,
            totalPages: 0
        };

        function showError(msg){
            errBox.style.display = "block";
            errBox.textContent = msg;
        }
        function clearError(){
            errBox.style.display = "none";
            errBox.textContent = "";
        }

        // 쿠키 자동 포함 fetch
        async function apiFetch(path, options = {}) {
            const url = API_BASE + path;

            const res = await fetch(url, {
                ...options,
                credentials: "include", // httpOnly 쿠키 자동 포함
                headers: {
                    ...(options.headers || {})
                }
            });

            // 인증 만료/미로그인
            if (res.status === 401 || res.status === 403) {
                alert("로그인이 필요합니다. 다시 로그인 해주세요.");
                location.href = "/login";
                throw new Error("UNAUTHORIZED");
            }
            return res;
        }

        // JSON 응답 안전 파싱
        async function apiFetchJson(path, options = {}) {
            const res = await apiFetch(path, options);

            if (!res.ok) {
                const text = await res.text();
                throw new Error(text || `HTTP ${res.status}`);
            }
            return res.json();
        }

        function cardTemplate(eq){
            const safe = (v) => (v === null || v === undefined || v === "") ? "-" : v;

            return `
        <article class="card ${isAdmin ? "selectable" : ""}" data-eq-no="${eq.eqNo}">
          <div class="thumb">
            <img
              src="${eq.imageUrl || NO_IMAGE_URL}"
              onerror="this.src='${NO_IMAGE_URL}'"
              alt="공유 설비 이미지"
            />
          </div>
          <div class="card-body">
            <div class="eq-name">설비명: ${safe(eq.eqName)}</div>
            <div class="divider"></div>
            <div class="meta"><b>설비번호:</b> ${safe(eq.eqId)}</div>
            <div class="meta"><b>모델명:</b> ${safe(eq.modelName)}</div>
            <div class="meta"><b>보관위치:</b> ${safe(eq.location)}</div>
          </div>
        </article>
      `;
        }

        function renderGrid(content){
            grid.innerHTML = content.map(cardTemplate).join("");
        }

        function enableSelection(){
            if (!isAdmin) return;

            document.querySelectorAll(".card.selectable").forEach(card => {
                card.addEventListener("click", () => {
                    document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
                    card.classList.add("selected");

                    selectedEqNo = card.dataset.eqNo;

                    document.getElementById("btnEdit").disabled = false;
                    document.getElementById("btnDelete").disabled = false;
                });
            });
        }

        function renderPaging(current, total){
            paging.innerHTML = "";
            if (total <= 1) return;

            const mkBtn = (label, onClick, disabled=false, active=false) => {
                const b = document.createElement("button");
                b.className = "page-btn" + (active ? " active" : "");
                b.textContent = label;
                b.disabled = disabled;
                b.addEventListener("click", onClick);
                return b;
            };

            paging.appendChild(mkBtn("‹", () => loadEq(current - 1), current === 0));

            const windowSize = 5;
            const start = Math.max(0, current - Math.floor(windowSize/2));
            const end = Math.min(total - 1, start + windowSize - 1);
            const realStart = Math.max(0, end - windowSize + 1);

            for(let p = realStart; p <= end; p++){
                paging.appendChild(mkBtn(String(p+1), () => loadEq(p), false, p === current));
            }

            paging.appendChild(mkBtn("›", () => loadEq(current + 1), current >= total - 1));
        }

        async function loadEq(page){
            clearError();

            state.page = page;
            selectedEqNo = null;
            document.getElementById("btnEdit").disabled = true;
            document.getElementById("btnDelete").disabled = true;

            try {
                const json = await apiFetchJson(`/api/v1/shared-equipment?page=${page}&size=${state.size}`, {
                    method: "GET"
                });

                // ResponseDto 구조: { data: { isAdmin, data: Page } }
                isAdmin = json?.data?.isAdmin === true;

                // 관리자면 하단 액션 보이기
                document.getElementById("actionBar").style.display = isAdmin ? "flex" : "none";

                const pageData = json?.data?.data;
                const content = pageData?.content || [];

                renderGrid(content);
                enableSelection();

                state.totalPages = pageData?.totalPages || 0;
                renderPaging(pageData?.number ?? page, state.totalPages);

            } catch (e) {
                console.error(e);
                if (String(e.message || "").includes("UNAUTHORIZED")) return;
                showError("조회에 실패했습니다. (서버/쿠키/권한 확인)");
                grid.innerHTML = "";
                paging.innerHTML = "";
            }
        }

        // 등록/수정 이동
        document.getElementById("btnCreate").onclick = () => {
            location.href = "/shared-equipment/register";
        };

        document.getElementById("btnEdit").onclick = () => {
            if (!selectedEqNo) return;
            location.href = `/shared-equipment/${selectedEqNo}/edit`;
        };

        // 삭제 모달
        const deleteModal      = document.getElementById("deleteModal");
        const cancelDeleteBtn  = document.getElementById("cancelDeleteBtn");
        const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

        function openDeleteModal() {
            deleteModal.classList.remove("hidden");
        }

        document.getElementById("btnDelete").onclick = () => {
            if (!selectedEqNo) return;
            openDeleteModal();
        };

        cancelDeleteBtn.addEventListener("click", () => {
            deleteModal.classList.add("hidden");
        });

        confirmDeleteBtn.addEventListener("click", async () => {
            try {
                const res = await apiFetch(`/api/v1/shared-equipment/${selectedEqNo}`, {
                    method: "DELETE"
                });

                if (!res.ok) {
                    const text = await res.text();
                    console.error("[delete fail]", res.status, text);
                    alert("삭제에 실패했습니다.");
                    return;
                }

                alert("공유 설비가 삭제되었습니다.");
                deleteModal.classList.add("hidden");

                selectedEqNo = null;
                document.getElementById("btnEdit").disabled = true;
                document.getElementById("btnDelete").disabled = true;

                loadEq(state.page); // 현재 페이지 다시 조회
            } catch (e) {
                console.error(e);
                if (String(e.message || "").includes("UNAUTHORIZED")) return;
                alert("삭제 중 오류가 발생했습니다.");
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                deleteModal.classList.add("hidden");
            }
        });

        // 처음 로드
        document.addEventListener("DOMContentLoaded", () => {
            loadEq(0);
        });
    </script>
</th:block>

</body>
</html>
