<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<th:block layout:fragment="pageStyles">
    <style>
        /* ===== Layout (✅ 원래 크기 유지) ===== */
        .cal-wrap{
            display:grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap:16px;
            align-items:stretch;
        }
        .cal-left{
            background: rgba(59,130,246,.14);
            border:1px solid rgba(59,130,246,.18);
            border-radius: var(--radius);
            box-shadow: var(--shadow2);
            padding:16px;
            min-height: 760px;
        }
        .mini-box{
            background: rgba(255,255,255,.40);
            border:1px solid rgba(255,255,255,.35);
            border-radius: 12px;
            padding:10px;
            margin-bottom:12px;
        }

        .cal-main{
            background:#fff;
            border:1px solid rgba(17,24,39,.08);
            border-radius: var(--radius);
            box-shadow: var(--shadow2);
            padding:14px;
            min-height: 760px;
            min-width: 0;
        }

        .cal-toolbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            margin-bottom:10px;
        }
        .toolbar-left{ display:flex; align-items:center; gap:12px; min-width:0; }
        .main-title{
            font-size:28px; font-weight:900; margin:0; white-space:nowrap;
            cursor:pointer; user-select:none;
        }
        .main-title:hover{ text-decoration: underline; text-underline-offset: 6px; }

        .nav-group{
            display:flex;
            gap:6px;
            background:#f3f4f6;
            border:1px solid #e5e7eb;
            border-radius: 999px;
            padding:4px;
        }
        .nav-btn{
            border:0;
            background:transparent;
            padding:8px 12px;
            border-radius:999px;
            font-weight:900;
            cursor:pointer;
        }
        .nav-btn:hover{ background:#e5e7eb; }

        .toolbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
        .pill-group{
            display:flex;
            gap:6px;
            background:#f3f4f6;
            border:1px solid #e5e7eb;
            border-radius: 999px;
            padding:4px;
        }
        .pill{
            border:0;
            background:transparent;
            padding:8px 14px;
            border-radius: 999px;
            font-weight:900;
            cursor:pointer;
            color:#334155;
        }
        .pill.active{ background:#2563eb; color:#fff; }

        .weekstart-select{
            border:1px solid #e5e7eb;
            background:#fff;
            border-radius: 12px;
            padding:8px 10px;
            font-weight:800;
            cursor:pointer;
        }
        .local-search{
            border:1px solid #e5e7eb;
            border-radius: 999px;
            padding:10px 14px;
            min-width:240px;
            outline:none;
            font-weight:700;
        }

        .add-btn{
            width:100%;
            height:44px;
            border:1px solid rgba(17,24,39,.10);
            border-radius: 12px;
            background: rgba(255,255,255,.55);
            font-weight:900;
            cursor:pointer;
        }
        .add-btn:hover{ background: rgba(255,255,255,.75); }

        /* ===== Mini header ===== */
        .mini-head{
            display:flex; align-items:center; justify-content:space-between;
            gap:10px;
            margin:0 0 10px;
        }
        .mini-month{
            font-weight:900; color:#1f3b7a;
            cursor:pointer; user-select:none;
        }
        .mini-month:hover{ text-decoration: underline; text-underline-offset: 6px; }
        .mini-nav{ display:flex; gap:6px; }
        .mini-nav button{
            width:34px; height:34px;
            border:1px solid rgba(17,24,39,.10);
            background:rgba(255,255,255,.55);
            border-radius:10px;
            cursor:pointer;
            font-weight:900;
        }
        .mini-nav button:hover{ background:rgba(255,255,255,.75); }

        /* ===== Left toggles ===== */
        .mycal{
            margin-top:14px;
            background: rgba(255,255,255,.40);
            border:1px solid rgba(255,255,255,.35);
            border-radius: 12px;
            padding:12px;
        }
        .mycal-title{ font-weight:900; color:#1f3b7a; margin-bottom:8px; }
        .toggle-row{
            display:flex; align-items:center; justify-content:space-between;
            padding:10px 6px;
            border-top:1px solid rgba(17,24,39,.08);
            gap:10px;
        }
        .tag{ display:flex; align-items:center; gap:10px; font-weight:900; color:#0f172a; }
        .dot{ width:10px; height:10px; border-radius:999px; display:inline-block; }

        .switch{
            position:relative;
            width:44px; height:24px;
            background:#cbd5e1;
            border-radius:999px;
            cursor:pointer;
            transition:.15s;
        }
        .switch::after{
            content:"";
            position:absolute;
            top:3px; left:3px;
            width:18px; height:18px;
            background:#fff;
            border-radius:999px;
            transition:.15s;
            box-shadow:0 3px 10px rgba(0,0,0,.15);
        }
        .switch.on{ background:#2563eb; }
        .switch.on::after{ left:23px; }

        /* ===== FullCalendar base ===== */
        .fc .fc-header-toolbar{ display:none; }
        .fc .fc-timegrid-slot{ height:46px; }
        .fc .fc-day-today{ background:rgba(59,130,246,.08) !important; }

        /* ===== 이벤트 디자인(배경/바 통일) ===== */
        .fc .fc-event,
        .fc .fc-event-main,
        .fc .fc-timegrid-event,
        .fc .fc-daygrid-event{
            border:none !important;
            border-radius:0 !important;
            background:transparent !important;
            box-shadow:none !important;
        }
        .bp-event{
            height:100%;
            padding:6px 8px 6px 10px;
            color:#0f172a;
            background: var(--bpBg);
            box-shadow: inset 4px 0 0 var(--bpColor);
            overflow:hidden;
            border-radius:0;
        }
        .bp-evt-title{
            font-size:12px;
            font-weight:900;
            white-space:normal;
            word-break:break-word;
            line-height:1.2;
        }
        .bp-evt-time{ display:none; }

        /* +n more 링크 */
        #calendar .fc-daygrid-day-frame{ position:relative; }
        #calendar .fc-daygrid .fc-more-link,
        #calendar .fc-daygrid .fc-daygrid-more-link{
            position:absolute;
            right:8px;
            bottom:6px;
            background:transparent !important;
            padding:0 !important;
            border-radius:0 !important;
            border:0 !important;
        }
        .fc .fc-more-link{
            display:inline-block;
            padding:2px 6px;
            font-size:12px;
            font-weight:900;
            border-radius:10px;
            background:rgba(15,23,42,.06);
            color:#0f172a;
            text-decoration:none;
        }
        .fc-timegrid .fc-more-link{
            position: relative;
            z-index: 5;
            margin-left: 6px;
            padding: 0 !important;
            background: transparent !important;
        }
        .fc-timegrid .fc-timegrid-col-frame{ position: relative; }
        .fc-timegrid .fc-timegrid-more-link{
            position: absolute !important;
            right: 6px;
            bottom: 2px;
            left: auto !important;
            top: auto !important;
        }

        /* ===== Mini calendar dots (✅ scope별 dot 1개씩) ===== */
        #miniCalendar .fc-daygrid-day-frame{ position:relative; }
        #miniCalendar .mini-dots{
            position:absolute;
            left:50%;
            bottom:4px;
            transform:translateX(-50%);
            display:flex;
            gap:4px;
            align-items:center;
            justify-content:center;
            height:10px;
            pointer-events:none;
        }
        #miniCalendar .mini-dot{
            width:6px; height:6px;
            border-radius:999px;
            display:inline-block;
            opacity:.95;
        }

        /* ===== Popover ===== */
        .pop-mask{
            position:fixed; inset:0;
            background:transparent;
            display:none;
            z-index:9998;
        }
        .pop{
            position:fixed;
            z-index:9999;
            width:min(420px, 92vw);
            background:rgba(255,255,255,.92);
            backdrop-filter: blur(10px);
            border:1px solid rgba(15,23,42,.10);
            box-shadow:0 18px 50px rgba(0,0,0,.18);
            border-radius:18px;
            overflow:hidden;
            display:none;
        }
        .pop.center{
            left:50% !important;
            top:50% !important;
            transform:translate(-50%,-50%) !important;
        }
        .pop-head{
            padding:12px 14px;
            display:flex; align-items:center; justify-content:space-between;
            border-bottom:1px solid rgba(15,23,42,.08);
            background:rgba(248,250,252,.75);
        }
        .pop-title{ display:flex; align-items:center; gap:8px; font-weight:900; color:#0f172a; }
        .pop-badge{ width:10px; height:10px; border-radius:999px; background:#f59e0b; }
        .pop-body{
            padding:14px;
            display:grid;
            gap:10px;
            max-height: min(62vh, 520px);
            overflow:auto;
        }
        .field{ display:grid; gap:6px; }
        .field label{ font-size:12px; font-weight:900; color:#334155; }
        .field input, .field textarea, .field select{
            border:1px solid rgba(17,24,39,.12);
            border-radius:12px;
            padding:10px 12px;
            font-size:14px;
            outline:none;
            background:rgba(255,255,255,.9);
        }
        textarea{ min-height:90px; resize:vertical; }
        .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .pop-foot{
            padding:12px 14px;
            border-top:1px solid rgba(15,23,42,.08);
            display:flex;
            justify-content:flex-end;
            gap:8px;
            background:rgba(255,255,255,.75);
        }
        .btn{
            border:1px solid rgba(17,24,39,.12);
            background:#fff;
            padding:10px 14px;
            border-radius:12px;
            cursor:pointer;
            font-weight:900;
        }
        .btn.primary{ background:#2563eb; border-color:#2563eb; color:#fff; }
        .btn.danger{ background:#ef4444; border-color:#ef4444; color:#fff; }
        .btn.ghost{ background:transparent; }
        .readonly{ background:rgba(248,250,252,.9) !important; }
        .hidden{ display:none !important; }

        .more-list{ display:grid; gap:8px; }
        .more-item{
            display:flex; align-items:flex-start; gap:10px;
            padding:10px 10px;
            border-radius:12px;
            background:rgba(15,23,42,.04);
            cursor:pointer;
            border:1px solid rgba(15,23,42,.06);
        }
        .more-item:hover{ background:rgba(15,23,42,.06); }
        .more-color{ width:10px; height:10px; border-radius:999px; margin-top:3px; flex:0 0 auto; }
        .more-meta{ display:grid; gap:2px; min-width:0; }
        .more-time{ font-size:12px; font-weight:900; color:#0f172a; }
        .more-title{ font-size:13px; font-weight:900; color:#0f172a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        /* =========================
           ✅ Pretty Month Picker Modal
        ========================= */
        .mp-mask{
            position:fixed; inset:0;
            background:rgba(15,23,42,.18);
            display:none;
            z-index:10020;
        }
        .mp{
            position:fixed;
            z-index:10021;
            width:min(380px, 92vw);
            background:rgba(255,255,255,.92);
            backdrop-filter: blur(10px);
            border:1px solid rgba(15,23,42,.10);
            box-shadow:0 18px 50px rgba(0,0,0,.18);
            border-radius:18px;
            overflow:hidden;
            display:none;
        }
        .mp.center{
            left:50%; top:50%;
            transform:translate(-50%,-50%);
        }
        .mp-head{
            padding:12px 14px;
            display:flex; align-items:center; justify-content:space-between;
            border-bottom:1px solid rgba(15,23,42,.08);
            background:rgba(248,250,252,.75);
        }
        .mp-title{
            display:flex; align-items:center; gap:10px;
            font-weight:900; color:#0f172a;
        }
        .mp-chip{
            font-size:12px;
            padding:4px 10px;
            border-radius:999px;
            background:rgba(37,99,235,.10);
            border:1px solid rgba(37,99,235,.18);
            color:#1f3b7a;
            font-weight:900;
        }
        .mp-year{
            display:flex; align-items:center; gap:8px;
            font-weight:900;
        }
        .mp-year button{
            width:34px; height:34px;
            border:1px solid rgba(17,24,39,.10);
            background:rgba(255,255,255,.55);
            border-radius:10px;
            cursor:pointer;
            font-weight:900;
        }
        .mp-year button:hover{ background:rgba(255,255,255,.75); }
        .mp-body{ padding:14px; }
        .mp-grid{
            display:grid;
            grid-template-columns: repeat(3, 1fr);
            gap:10px;
        }
        .mp-mon{
            border:1px solid rgba(17,24,39,.10);
            background:rgba(255,255,255,.65);
            border-radius:14px;
            padding:12px 10px;
            cursor:pointer;
            font-weight:900;
            color:#0f172a;
            text-align:center;
            transition:.12s;
        }
        .mp-mon:hover{ transform:translateY(-1px); background:rgba(255,255,255,.85); }
        .mp-mon.active{
            background:#2563eb;
            border-color:#2563eb;
            color:#fff;
        }
        .mp-foot{
            padding:12px 14px;
            border-top:1px solid rgba(15,23,42,.08);
            display:flex;
            justify-content:space-between;
            gap:8px;
            background:rgba(255,255,255,.75);
        }
        .mp-foot .btn{ padding:10px 12px; }
        .mp-foot .left{ display:flex; gap:8px; }
        .mp-foot .right{ display:flex; gap:8px; }

        @media (max-width: 1100px){
            .cal-wrap{ grid-template-columns: 1fr; }
            .cal-left{ min-height:auto; }
        }

        /* ✅ 일정 추가/수정 모달(createPop)만 크게 */
        #createPop{
            width: min(720px, 94vw);
        }
        #createPop .pop-body{
            max-height: min(72vh, 720px);
        }
        #createPop textarea{
            min-height: 140px;
        }

        /* =========================
           ✅ ToDo List UI (LEFT)  (✅ 날짜 제거 버전)
        ========================= */
        .todo-card{
            margin-top:14px;
            background: rgba(255,255,255,.40);
            border:1px solid rgba(255,255,255,.35);
            border-radius: 12px;
            padding:12px;
        }
        .todo-top{
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:10px;
            margin-bottom:10px;
        }
        .todo-title{
            font-weight:900;
            color:#1f3b7a;
            display:flex; align-items:center; gap:8px;
        }
        .todo-title .badge{
            width:10px; height:10px; border-radius:999px;
            background:#334155;
            display:inline-block;
        }
        .todo-count{
            font-size:12px;
            font-weight:800;
            color:#64748b;
            margin-top:4px;
        }

        .todo-list{
            display:grid;
            gap:8px;
            margin-bottom:10px;
            max-height: 380px; /* ✅ 더 길게 */
            overflow:auto;
            padding-right:4px;
        }
        .todo-item{
            display:flex; align-items:center; justify-content:space-between;
            gap:10px;
            padding:10px 10px;
            border-radius:12px;
            background:rgba(15,23,42,.04);
            border:1px solid rgba(15,23,42,.06);
        }
        .todo-left{
            display:flex; align-items:flex-start;
            gap:10px;
            min-width:0;
            flex:1;
        }

        .todo-check{
            appearance:none;
            -webkit-appearance:none;
            width:18px; height:18px;
            border-radius:999px;
            border:2px solid rgba(15,23,42,.35);
            background:transparent;
            margin-top:2px;
            cursor:pointer;
            position:relative;
            flex:0 0 auto;
        }
        .todo-check:checked{
            border-color:#2563eb;
            background:#2563eb;
        }
        .todo-check:checked::after{
            content:"";
            position:absolute;
            left:5px; top:2px;
            width:4px; height:8px;
            border:2px solid #fff;
            border-top:0; border-left:0;
            transform:rotate(45deg);
        }

        /* ✅ bold 줄임 */
        .todo-text{
            font-weight:700;
            font-size:14px;
            color:#0f172a;
            line-height:1.25;
            word-break:break-word;
            overflow:hidden;
            cursor:default;
        }
        .todo-text.done{
            color:#64748b;
            text-decoration: line-through;
            text-decoration-thickness: 2px;
            text-decoration-color: rgba(100,116,139,.55);
        }

        .todo-actions{
            display:flex; align-items:center; gap:6px;
            flex:0 0 auto;
        }
        .todo-del{
            width:32px; height:32px;
            border:1px solid rgba(17,24,39,.10);
            background:rgba(255,255,255,.55);
            border-radius:10px;
            cursor:pointer;
            font-weight:900;
        }
        .todo-del:hover{ background:rgba(255,255,255,.75); }
        .todo-empty{
            padding:14px 10px;
            text-align:center;
            color:#64748b;
            font-weight:800;
            background:rgba(255,255,255,.35);
            border:1px dashed rgba(15,23,42,.14);
            border-radius:12px;
        }

        /* ✅ 입력/추가 버튼 작게 + 넘침 방지 */
        .todo-add{
            display:flex;
            gap:8px;
            align-items:center;
            width:100%;
        }
        .todo-input{
            flex:1;
            min-width:0;              /* ✅ flex overflow 방지 핵심 */
            height:36px;
            border:1px solid rgba(17,24,39,.12);
            border-radius:12px;
            padding:0 12px;
            font-weight:800;
            outline:none;
            background:rgba(255,255,255,.85);
        }
        .todo-create{
            flex:0 0 auto;
            height:36px;
            padding:0 14px;
            border:1px solid rgba(17,24,39,.10);
            border-radius:12px;
            background:rgba(255,255,255,.55);
            font-weight:900;
            cursor:pointer;
            white-space:nowrap;
        }
        .todo-create:hover{ background:rgba(255,255,255,.75); }

        /* ✅ 인라인 편집 input */
        .todo-edit{
            width:100%;
            border:1px solid rgba(17,24,39,.12);
            border-radius:10px;
            padding:8px 10px;
            font-weight:700;
            font-size:14px;
            outline:none;
            background:#fff;
        }
    </style>
</th:block>

<body>
<div layout:fragment="content">

    <div class="cal-wrap">
        <!-- LEFT -->
        <aside class="cal-left">
            <div class="mini-head">
                <div class="mini-month" id="miniMonthTitle">December 2025</div>
                <div class="mini-nav">
                    <button type="button" id="miniPrevBtn">‹</button>
                    <button type="button" id="miniNextBtn">›</button>
                </div>
            </div>

            <div class="mini-box">
                <div id="miniCalendar"></div>
            </div>

            <button type="button" class="add-btn" id="openCreateBtn">+ 일정 추가하기</button>

            <div class="mycal">
                <div class="mycal-title">내 캘린더</div>

                <div class="toggle-row">
                    <div class="tag"><span class="dot" style="background:#2563EB"></span><span>회사</span></div>
                    <div class="switch on" id="tgCompany" role="switch" aria-checked="true"></div>
                </div>

                <div class="toggle-row">
                    <div class="tag"><span class="dot" style="background:#16A34A"></span><span>부서</span></div>
                    <div class="switch on" id="tgDept" role="switch" aria-checked="true"></div>
                </div>

                <div class="toggle-row">
                    <div class="tag"><span class="dot" style="background:#f59e0b"></span><span>개인</span></div>
                    <div class="switch on" id="tgPersonal" role="switch" aria-checked="true"></div>
                </div>
            </div>

            <!-- ✅ ToDo List (날짜 제거, +버튼 제거) -->
            <div class="todo-card" id="todoCard">
                <div class="todo-top">
                    <div>
                        <div class="todo-title">
                            <span class="badge"></span>
                            <span>ToDo List</span>
                        </div>
                        <div class="todo-count" id="todoCountLabel">0개</div>
                    </div>
                </div>

                <div class="todo-list" id="todoList">
                    <div class="todo-empty">할 일이 없어요 🙂</div>
                </div>

                <div class="todo-add">
                    <input class="todo-input" id="todoNewInput" type="text" placeholder="할 일 추가..." maxlength="200" />
                    <button class="todo-create" type="button" id="todoCreateBtn">추가</button>
                </div>
            </div>
        </aside>

        <!-- MAIN -->
        <section class="cal-main">
            <div class="cal-toolbar">
                <div class="toolbar-left">
                    <h2 class="main-title" id="mainTitle"></h2>
                    <div class="nav-group">
                        <button class="nav-btn" type="button" id="prevBtn">‹</button>
                        <button class="nav-btn" type="button" id="todayBtn">Today</button>
                        <button class="nav-btn" type="button" id="nextBtn">›</button>
                    </div>
                </div>

                <div class="toolbar-right">
                    <div class="pill-group" id="viewGroup">
                        <button class="pill active" type="button" data-view="WEEK">Week</button>
                        <button class="pill" type="button" data-view="MONTH">Month</button>
                    </div>

                    <select class="weekstart-select" id="weekStartSelect">
                        <option value="MONDAY" selected>MONDAY</option>
                        <option value="SUNDAY">SUNDAY</option>
                    </select>

                    <input class="local-search" id="searchInput" type="text" placeholder="Search"/>
                </div>
            </div>

            <div id="calendar"></div>
        </section>
    </div>

    <div class="pop-mask" id="popMask"></div>

    <!-- ✅ Month Picker Mask + Modal (공용, 모드로 main/mini 분기) -->
    <div class="mp-mask" id="mpMask"></div>
    <div class="mp center" id="monthPickerPop" role="dialog" aria-modal="true" aria-label="월 선택">
        <div class="mp-head">
            <div class="mp-title">
                <span class="mp-chip" id="mpModeChip">MAIN</span>

<th:block layout:fragment="pageScripts">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <script>
        /* =========================
           API
        ========================= */
        const API_BASE = '/api/v1/calendar';
        const API_DELETE = (schNo, scope) => {
            const params = new URLSearchParams();
            params.set('scope', String(scope || 'PERSONAL').toUpperCase());
            return `${API_BASE}/${schNo}?${params.toString()}`;
        };
        const API_UPDATE = (schNo) => API_BASE + '/' + schNo;

        /* =========================
           ✅ ToDo API (날짜 없는 버전)
        ========================= */
        const TODO_API_BASE = '/api/v1/todos';
        const TODO_API_DONE   = (todoNo) => `${TODO_API_BASE}/${todoNo}/done`;
        const TODO_API_ONE    = (todoNo) => `${TODO_API_BASE}/${todoNo}`;
        const TODO_API_UPDATE = (todoNo) => `${TODO_API_BASE}/${todoNo}`;

        /* =========================
           ✅ 현재 로그인 사용자(me) - 백엔드 API로만 결정
        ========================= */
        let CURRENT_ME = null;

        async function loadMe(){
            try{
                const res = await fetch('/api/v1/employees/me', {
                    method:'GET',
                    credentials:'include'
                });

                if (res.status === 401){
                    CURRENT_ME = null;
                    console.warn('ME 401 (unauthorized)');
                    return null;
                }
                if (!res.ok){
                    CURRENT_ME = null;
                    console.warn('ME failed:', res.status, await res.text());
                    return null;
                }

                const json = await res.json();
                CURRENT_ME = (json?.data ?? json);
                console.log('ME=', CURRENT_ME);
                return CURRENT_ME;
            }catch(e){
                CURRENT_ME = null;
                console.warn('ME error:', e);
                return null;
            }
        }

        function getMyRole(){
            return String(CURRENT_ME?.role || '').toUpperCase();
        }
        function isCompanyAdmin(){
            const r = getMyRole();
            return ['COM_ADMIN','SEC_ADMIN','THR_ADMIN'].includes(r);
        }

        /* =========================
           scope 고정색
        ========================= */
        const SCOPE_COLOR = {
            COMPANY: '#2563EB',
            DEPARTMENT: '#16A34A',
            PERSONAL: '#f59e0b'
        };
        function scopeColor(scope){
            const s = String(scope || '').toUpperCase();
            return SCOPE_COLOR[s] || '#f59e0b';
        }

        /* =========================
           색 -> 투명 배경(rgba)
        ========================= */
        function hexToRgba(hex, a){
            const h = String(hex || '').replace('#','');
            if (!/^[0-9a-fA-F]{6}$/.test(h)) return `rgba(124,58,237,${a})`;
            const r = parseInt(h.slice(0,2), 16);
            const g = parseInt(h.slice(2,4), 16);
            const b = parseInt(h.slice(4,6), 16);
            return `rgba(${r},${g},${b},${a})`;
        }

        /* =========================
           토글(회사/부서/개인)
        ========================= */
        const selectedScopes = new Set(['COMPANY','DEPARTMENT','PERSONAL']);
        function getSelectedScopes(){ return Array.from(selectedScopes); }

        function setSwitch(el, on){
            el.classList.toggle('on', !!on);
            el.setAttribute('aria-checked', String(!!on));
        }
        function toggleScope(scope, on){
            scope = scope.toUpperCase();
            if (on) selectedScopes.add(scope);
            else selectedScopes.delete(scope);

            if (selectedScopes.size === 0){
                selectedScopes.add(scope);
                setSwitch(scope === 'COMPANY' ? tgCompany : scope === 'DEPARTMENT' ? tgDept : tgPersonal, true);
                return;
            }

            mainCalendar && mainCalendar.refetchEvents();
            refreshMiniDots();
        }

        /* =========================
           날짜 유틸
        ========================= */
        function normalizeApiDatetime(v){
            if (!v) return v;
            const s = String(v).trim();
            return s.replace(/(\.\d+)?(Z|[+-]\d\d:\d\d)$/, '');
        }
        const pad = (n) => String(n).padStart(2, '0');
        function toDateKey(d){
            const dt = (d instanceof Date) ? d : new Date(d);
            return dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate());
        }
        function toDatetimeLocalValue(d) {
            return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        function addDays(date, days) {
            const d = new Date(date);
            d.setDate(d.getDate() + days);
            return d;
        }
        function formatNice(dtStr){
            if (!dtStr) return '';
            return String(dtStr).replace('T',' ').replace(/(\.\d+)?Z?$/,'');
        }

        /* =========================
           ✅ ToDo List state (날짜 없음)
        ========================= */
        const todoEls = {
            list: document.getElementById('todoList'),
            countLabel: document.getElementById('todoCountLabel'),
            input: document.getElementById('todoNewInput'),
            createBtn: document.getElementById('todoCreateBtn'),
        };

        let TODO_ITEMS = []; // [{todoNo, title, isDone}]

        function safeData(json){
            return (json && typeof json === 'object' && 'data' in json) ? json.data : json;
        }

        function normalizeTodo(it){
            return {
                todoNo: it.todoNo ?? it.id ?? it.todo_id,
                title: it.title ?? it.todoTitle ?? it.content ?? '',
                isDone: !!(it.isDone ?? it.done ?? it.completed),
            };
        }

        async function todoFetchAll(){
            const res = await fetch(TODO_API_BASE, { method:'GET', credentials:'include' });
            if (res.status === 401) throw new Error('로그인이 필요해요.');
            if (!res.ok) throw new Error('투두 조회 실패: ' + res.status);
            const json = await res.json();
            const payload = safeData(json);
            return Array.isArray(payload) ? payload.map(normalizeTodo) : [];
        }

        function renderTodo(){
            const items = TODO_ITEMS;

            todoEls.countLabel.textContent = `${items.length}개`;
            todoEls.list.innerHTML = '';

            if (!items || items.length === 0){
                const empty = document.createElement('div');
                empty.className = 'todo-empty';
                empty.textContent = '할 일이 없어요 🙂';
                todoEls.list.appendChild(empty);
                return;
            }

            items.forEach(it => {
                const todoNo = it.todoNo;
                const title = it.title ?? '';
                const isDone = !!it.isDone;

                const row = document.createElement('div');
                row.className = 'todo-item';
                row.dataset.todoNo = String(todoNo);

                const left = document.createElement('div');
                left.className = 'todo-left';

                const ck = document.createElement('input');
                ck.type = 'checkbox';
                ck.className = 'todo-check';
                ck.checked = isDone;

                const text = document.createElement('div');
                text.className = 'todo-text' + (isDone ? ' done' : '');
                text.textContent = title;

                ck.addEventListener('change', async () => {
                    try{
                        await todoSetDone(todoNo, ck.checked);
                        // 상태만 로컬 반영
                        it.isDone = ck.checked;
                        text.classList.toggle('done', ck.checked);
                    }catch(e){
                        ck.checked = !ck.checked; // 롤백
                        alert(e.message);
                    }
                });

                // ✅ 더블클릭 인라인 수정
                text.addEventListener('dblclick', () => {
                    if (!todoNo) return;

                    const original = it.title ?? '';
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'todo-edit';
                    input.value = original;

                    // 교체
                    text.replaceWith(input);
                    input.focus();
                    input.select();

                    const finish = async (mode) => {
                        const next = (input.value || '').trim();

                        // 취소
                        if (mode === 'cancel'){
                            input.replaceWith(text);
                            return;
                        }

                        // 빈값이면 저장 안 하고 복구
                        if (!next){
                            input.value = original;
                            input.replaceWith(text);
                            return;
                        }

                        // 변경 없으면 복구
                        if (next === original){
                            input.replaceWith(text);
                            return;
                        }

                        try{
                            await todoUpdateTitle(todoNo, next);
                            it.title = next;
                            text.textContent = next;
                            input.replaceWith(text);
                        }catch(e){
                            alert(e.message);
                            input.value = original;
                            input.replaceWith(text);
                        }
                    };

                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter'){
                            e.preventDefault();
                            finish('save');
                        } else if (e.key === 'Escape'){
                            e.preventDefault();
                            finish('cancel');
                        }
                    });
                    input.addEventListener('blur', () => finish('save'));
                });

                left.appendChild(ck);
                left.appendChild(text);

                const actions = document.createElement('div');
                actions.className = 'todo-actions';

                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'todo-del';
                del.textContent = '🗑';
                del.title = '삭제';
                del.addEventListener('click', async () => {
                    if (!confirm('이 투두를 삭제할까?')) return;
                    try{
                        await todoDelete(todoNo);
                        await todoReload();
                    }catch(e){
                        alert(e.message);
                    }
                });

                actions.appendChild(del);

                row.appendChild(left);
                row.appendChild(actions);

                todoEls.list.appendChild(row);
            });
        }

        async function todoCreate(title){
            const res = await fetch(TODO_API_BASE, {
                method:'POST',
                headers:{ 'Content-Type':'application/json' },
                credentials:'include',
                body: JSON.stringify({ title })
            });
            if (!res.ok) throw new Error('투두 생성 실패: ' + res.status);
            return await res.json();
        }

        async function todoSetDone(todoNo, isDone){
            const res = await fetch(TODO_API_DONE(todoNo), {
                method:'PATCH',
                headers:{ 'Content-Type':'application/json' },
                credentials:'include',
                body: JSON.stringify({ isDone: !!isDone })
            });
            if (!res.ok) throw new Error('완료 상태 변경 실패: ' + res.status);
            return await res.json();
        }

        async function todoUpdateTitle(todoNo, title){
            const res = await fetch(TODO_API_UPDATE(todoNo), {
                method:'PATCH',
                headers:{ 'Content-Type':'application/json' },
                credentials:'include',
                body: JSON.stringify({ title })
            });
            if (!res.ok) throw new Error('투두 수정 실패: ' + res.status);
            return await res.json();
        }

        async function todoDelete(todoNo){
            const res = await fetch(TODO_API_ONE(todoNo), {
                method:'DELETE',
                credentials:'include'
            });
            if (!res.ok) throw new Error('투두 삭제 실패: ' + res.status);
            return true;
        }

        async function todoReload(){
            try{
                const items = await todoFetchAll();
                // 정렬(원하면): 최신이 위로 오게 todoNo desc
                items.sort((a,b) => (b.todoNo||0) - (a.todoNo||0));
                TODO_ITEMS = items;
                renderTodo();
            }catch(e){
                console.warn('todoReload failed:', e);
                // 실패해도 캘린더는 살아있게
                TODO_ITEMS = [];
                renderTodo();
            }
        }

        function bindTodoUI(){
            // ✅ 중복 바인딩 방지(혹시 init이 여러 번 도는 환경이면 필수)
            if (todoEls.input.dataset.bound === '1') return;
            todoEls.input.dataset.bound = '1';

            let creating = false;

            async function doCreate(){
                const title = (todoEls.input.value || '').trim();
                if (!title) return;

                // ✅ 연타/중복 호출 방지
                if (creating) return;
                creating = true;

                // ✅ UX: 처리 중 잠깐 잠금
                todoEls.createBtn.disabled = true;
                todoEls.input.disabled = true;

                try{
                    await todoCreate(title);
                    todoEls.input.value = '';
                    await todoReload();
                    todoEls.input.focus();
                }catch(e){
                    alert(e.message);
                }finally{
                    creating = false;
                    todoEls.createBtn.disabled = false;
                    todoEls.input.disabled = false;
                }
            }

            todoEls.createBtn.addEventListener('click', (e) => {
                e.preventDefault();
                doCreate();
            });

            todoEls.input.addEventListener('keydown', (e) => {
                if (e.key !== 'Enter') return;

                // ✅ 한글 입력(IME) 조합 중 Enter면 무시
                if (e.isComposing) return;

                // ✅ Enter 누르고 있는 동안 keydown 반복 발생 방지
                if (e.repeat) return;

                e.preventDefault();
                doCreate();
            });
        }

        /* =========================
           권한 체크
        ========================= */
        function canEditDelete(scope){
            scope = String(scope || '').toUpperCase();
            if (scope === 'PERSONAL') return true;
            if (scope === 'DEPARTMENT') return true;
            if (scope === 'COMPANY') return isCompanyAdmin();
            return false;
        }

        /* =========================
           Popover (기존)
        ========================= */
        const popMask = document.getElementById('popMask');
        const createPop = document.getElementById('createPop');
        const detailPop = document.getElementById('detailPop');
        const morePop = document.getElementById('morePop');

        function showMask(){ popMask.style.display = 'block'; }
        function hideMaskIfNone(){
            const anyOpen = [createPop, detailPop, morePop].some(p => p.style.display === 'block');
            if (!anyOpen) popMask.style.display = 'none';
        }
        function openPop(popEl, { anchorRect=null, center=false } = {}){
            showMask();
            popEl.classList.toggle('center', !!center);
            popEl.style.display = 'block';

            if (center){
                popEl.style.left = '50%';
                popEl.style.top = '50%';
                popEl.style.transform = 'translate(-50%,-50%)';
                return;
            }

            const vw = window.innerWidth, vh = window.innerHeight;
            const rect = anchorRect || { left: vw/2, top: vh/2, right: vw/2, bottom: vh/2 };
            const popRect = popEl.getBoundingClientRect();
            const popW = popRect.width || 420;
            const popH = popRect.height || 360;

            let left = rect.right + 12;
            let top  = rect.top;

            if (left + popW > vw - 12) left = rect.left - popW - 12;
            if (left < 12) left = 12;

            if (top + popH > vh - 12) top = vh - popH - 12;
            if (top < 12) top = 12;

            popEl.style.left = left + 'px';
            popEl.style.top = top + 'px';
            popEl.style.transform = 'none';
        }
        function closePop(popEl){
            popEl.style.display = 'none';
            popEl.classList.remove('center');
            hideMaskIfNone();
        }
        function closeAllPops(){
            closePop(createPop);
            closePop(detailPop);
            closePop(morePop);
        }
        popMask.addEventListener('click', (e) => { e.stopPropagation(); closeAllPops(); });
        [createPop, detailPop, morePop].forEach(p => p.addEventListener('click', (e)=> e.stopPropagation()));
        function safeClick(handler){
            return (e) => { e.preventDefault(); e.stopPropagation(); handler(e); };
        }
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeAllPops(); closeMonthPicker(); } });

        function rectFromMouseEvent(e){
            if (!e) return null;
            const x = e.clientX, y = e.clientY;
            return { left:x, right:x, top:y, bottom:y };
        }

        /* =========================
           ✅ Month Picker Modal (MAIN/MINI 분리)
        ========================= */
        const mpMask = document.getElementById('mpMask');
        const monthPickerPop = document.getElementById('monthPickerPop');
        const mpModeChip = document.getElementById('mpModeChip');
        const mpPrevYear = document.getElementById('mpPrevYear');
        const mpNextYear = document.getElementById('mpNextYear');
        const mpYearText = document.getElementById('mpYearText');
        const mpGrid = document.getElementById('mpGrid');
        const mpClose = document.getElementById('mpClose');
        const mpCancel = document.getElementById('mpCancel');
        const mpToday = document.getElementById('mpToday');

        let mpMode = 'MAIN'; // 'MAIN' | 'MINI'
        let mpYear = new Date().getFullYear();
        let mpMonthIdx = new Date().getMonth(); // 0~11

        const MONTH_LABELS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

        function showMonthPicker(){
            mpMask.style.display = 'block';
            monthPickerPop.style.display = 'block';
            monthPickerPop.classList.add('center');
        }
        function closeMonthPicker(){
            monthPickerPop.style.display = 'none';
            mpMask.style.display = 'none';
        }

        function getCurrentDateByMode(mode){
            if (mode === 'MINI' && miniCalendar) return miniCalendar.getDate();
            return mainCalendar ? mainCalendar.getDate() : new Date();
        }

        function gotoMonthByMode(mode, year, monthIdx){
            const d = new Date(year, monthIdx, 1);

            if (mode === 'MINI'){
                miniCalendar.gotoDate(d);
                refreshMiniDots();
            }else{
                mainCalendar.gotoDate(d);
                mainCalendar.refetchEvents();
            }
        }

        function renderMonthPicker(){
            mpModeChip.textContent = mpMode;
            mpYearText.textContent = String(mpYear);

            mpGrid.innerHTML = '';
            for (let i=0; i<12; i++){
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'mp-mon' + ((i === mpMonthIdx) ? ' active' : '');
                btn.textContent = MONTH_LABELS[i];
                btn.addEventListener('click', () => {
                    mpMonthIdx = i;
                    gotoMonthByMode(mpMode, mpYear, mpMonthIdx);
                    closeMonthPicker();
                });
                mpGrid.appendChild(btn);
            }
        }

        function openMonthPicker(mode){
            mpMode = mode;

            const cur = getCurrentDateByMode(mode);
            mpYear = cur.getFullYear();
            mpMonthIdx = cur.getMonth();

            renderMonthPicker();
            showMonthPicker();
        }

        mpMask.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); closeMonthPicker(); });
        monthPickerPop.addEventListener('click', (e)=> e.stopPropagation());

        /* =========================

        ========================= */
        async function apiGetItems({ scope, view, baseDate, weekStart }){
            const params = new URLSearchParams();
            params.set('scope', scope);
            params.set('view', view);
            params.set('baseDate', baseDate);
            params.set('weekStart', weekStart);
            params.set('includeAdjacentInMonth', 'true');

            const res = await fetch(API_BASE + '?' + params.toString(), {
                method: 'GET',
                credentials: 'include'
            });
            if (!res.ok) throw new Error('GET failed: ' + res.status);
            const json = await res.json();
            return (json?.data?.items ?? []);
        }

        async function apiCreate(payload){
            const res = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(payload)
            });
            if (res.status === 403) throw new Error('권한이 없습니다.');
            if (!res.ok) throw new Error('Create failed: ' + res.status + ' ' + await res.text());
            return await res.json();
        }

        async function apiDelete(schNo, scope){
            const res = await fetch(API_DELETE(schNo, scope), {
                method: 'DELETE',
                credentials: 'include'
            });
            if (res.status === 403) throw new Error('권한이 없습니다.');
            if (!res.ok) throw new Error('Delete failed: ' + res.status + ' ' + await res.text());
            return true;
        }

        async function apiUpdate(schNo, payload){
            const res = await fetch(API_UPDATE(schNo), {
                method:'PATCH',
                headers:{ 'Content-Type':'application/json' },
                credentials:'include',
                body: JSON.stringify(payload)
            });
            if (res.status === 403) throw new Error('권한이 없습니다.');
            if (!res.ok) throw new Error('Update failed: ' + res.status + ' ' + await res.text());
            return await res.json();
        }

        /* =========================
           Fetch events
        ========================= */
        async function fetchEvents(info, success, fail){
            try{
                const baseDate = toDateKey(mainCalendar.getDate());
                const scopes = getSelectedScopes();
                const view = currentViewType;

                const calls = scopes.map(s => apiGetItems({ scope:s, view, baseDate, weekStart }));
                const results = await Promise.all(calls);
                const raw = results.flat();

                const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();

                const events = raw
                    .filter(it => !q
                        || (it.title || '').toLowerCase().includes(q)
                        || (it.content || '').toLowerCase().includes(q)
                    )
                    .map(it => {
                        const scope = String(it.scope || 'PERSONAL').toUpperCase();
                        const id = scope + '-' + String(it.schNo);

                        const color = it.color || scopeColor(scope);

                        const startAtNorm = normalizeApiDatetime(it.startAt);
                        const endedAtNorm = normalizeApiDatetime(it.endedAt);

                        let start = startAtNorm;
                        let end = endedAtNorm;
                        let allDay = !!it.allDay;

                        if (allDay){
                            const sd = it.startDate || (it.startAt ? String(it.startAt).slice(0,10) : null);
                            const ed = it.endDate || (it.endedAt ? String(it.endedAt).slice(0,10) : sd);
                            start = sd;
                            end = ed ? toDateKey(addDays(ed, 1)) : (sd ? toDateKey(addDays(sd, 1)) : null);
                        }

                        return {
                            id,
                            title: it.title,
                            start,
                            end,
                            allDay,
                            extendedProps: {
                                id,
                                schNo: it.schNo,
                                scope,
                                title: it.title,
                                content: it.content,
                                startAt: startAtNorm,
                                endedAt: endedAtNorm,
                                allDay,
                                startDate: it.startDate,
                                endDate: it.endDate,
                                color
                            }
                        };
                    });

                success(events);
            }catch(e){
                console.error(e);
                fail(e);
            }
        }

        async function refreshMiniDots(){
            if (!miniCalendar) return;

            const cur = miniCalendar.getDate();
            const baseDate = cur.getFullYear() + '-' + pad(cur.getMonth()+1) + '-01';
            const scopes = getSelectedScopes();

            const calls = scopes.map(s => apiGetItems({ scope:s, view:'MONTH', baseDate, weekStart }));
            const results = await Promise.allSettled(calls);

            const map = new Map(); // dateKey -> Set(scopes)
            function mark(dateKey, scope){
                if (!map.has(dateKey)) map.set(dateKey, new Set());
                map.get(dateKey).add(scope);
            }

            results.forEach((r, idx) => {
                if (r.status !== 'fulfilled') return;
                const scope = scopes[idx];

                (r.value || []).forEach(it => {
                    const isAllDay = !!it.allDay;

                    if (isAllDay){
                        const sd = it.startDate || (it.startAt ? String(it.startAt).slice(0,10) : null);
                        const ed = it.endDate || (it.endedAt ? String(it.endedAt).slice(0,10) : sd);
                        if (!sd) return;

                        const start = new Date(sd);
                        const end = new Date(ed || sd);
                        for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
                            mark(toDateKey(d), scope);
                        }
                    }else{
                        const day = it.startAt ? String(it.startAt).slice(0,10) : null;
                        if (day) mark(day, scope);
                    }
                });
            });

            paintMiniDots(map);
        }

        function paintMiniDots(map){
            document.querySelectorAll('#miniCalendar .mini-dots').forEach(el => el.remove());

            const dayCells = document.querySelectorAll('#miniCalendar .fc-daygrid-day');
            dayCells.forEach(cell => {
                const dateStr = cell.getAttribute('data-date');
                if (!dateStr) return;

                const scopes = map.get(dateStr);
                if (!scopes || scopes.size === 0) return;

                const frame = cell.querySelector('.fc-daygrid-day-frame');
                if (!frame) return;

                const wrap = document.createElement('div');
                wrap.className = 'mini-dots';

                ['COMPANY','DEPARTMENT','PERSONAL'].forEach(sc => {
                    if (!scopes.has(sc)) return;
                    const dot = document.createElement('span');
                    dot.className = 'mini-dot';
                    dot.style.background = scopeColor(sc);
                    wrap.appendChild(dot);
                });

                frame.appendChild(wrap);
            });
        }
