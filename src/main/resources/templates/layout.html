<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bizportal</title>

    <style>
        :root{
            --bg: #f6f7fb;
            --white:#fff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: rgba(17, 24, 39, 0.08);

            --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            --shadow2: 0 6px 18px rgba(17, 24, 39, 0.10);

            --primary: #3b82f6;
            --primary2: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --warn: #f59e0b;
            --gray: #9ca3af;

            --sidebar-w:72px;
            --topbar-h:64px;
            --footer-h:76px;
            --radius:14px;
            --radius-sq: 10px;
        }

        *{box-sizing:border-box}
        html,body{height:100%}
        body{
            margin:0;
            font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
            background:var(--bg);
            color:var(--text);
        }

        .app{
            min-height:100vh;
            display:grid;
            grid-template-rows: var(--topbar-h) 1fr auto;
        }

        /* ====== 상단 헤더 ====== */
        .topbar{
            height:var(--topbar-h);
            background:var(--primary);
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 16px;
            gap:12px;
        }

        .topbar-left{
            display:flex;
            align-items:center;
            gap:12px;
            min-width:220px;
        }
        .launcher-btn{
            width:36px;height:36px;
            border:0;
            border-radius:10px;
            background:rgba(255,255,255,.16);
            color:#fff;
            cursor:pointer;
            display:grid;
            place-items:center;
        }
        .launcher-btn:hover{ background:rgba(255,255,255,.22); }

        .brand{
            display:flex;
            align-items:center;
            gap:10px;
            font-weight:900;
            letter-spacing:.2px;
            user-select:none;
        }
        .brand .logo-box{
            width:30px;height:30px;
            border-radius:10px;
            background:#fff;
            color:var(--primary);
            display:grid;
            place-items:center;
            font-weight:900;
        }
        .brand a{
            color:#fff;
            text-decoration:none;
            font-size:20px;
            line-height:1;
        }

        .topbar-center{
            flex:1;
            display:flex;
            justify-content:flex-start;
        }

        .search{
            width:min(520px, 100%);
            margin-left:10px;
            display:flex;
            align-items:center;
            background:#fff;
            border-radius: var(--radius-sq);
            padding:6px 10px;
            gap:8px;
            box-shadow:0 6px 16px rgba(0,0,0,.14);
        }
        .search .scope{
            border:0;
            background:#f3f4f6;
            border-radius: 8px;
            padding:7px 10px;
            font-size:12px;
            color:#374151;
            outline:none;
        }
        .search input{
            border:0;
            outline:none;
            flex:1;
            font-size:13px;
            padding:7px 6px;
        }
        .search .icon{ width:18px;height:18px; opacity:.7; }

        .topbar-right{
            display:flex;
            align-items:center;
            gap:10px;
            min-width:220px;
            justify-content:flex-end;
        }

        .icon-btn{
            width:38px;height:38px;
            border:0;
            border-radius:999px;
            background:rgba(255,255,255,.16);
            color:#fff;
            cursor:pointer;
            display:grid;
            place-items:center;
            position:relative;
        }

        /* ✅ 수정: 알림 배지 숫자용 스타일 */
        .badge{
            position:absolute;
            right:2px; top:2px;
            min-width:16px; height:16px;
            background:var(--danger);
            color: #fff;
            border-radius:999px;
            border:2px solid var(--primary);
            font-size: 10px;
            font-weight: 800;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .avatar{
            width:38px;height:38px;
            border-radius:999px;
            background:rgba(255,255,255,.16);
            border:0;
            padding:0;
            cursor:pointer;
            user-select:none;
            overflow:hidden;
            display:grid;
            place-items:center;
            position:relative;

            color: #fff;
        }
        .avatar-img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:none;
        }
        .avatar-fallback{
            display:grid;
            place-items:center;
            width:100%;
            height:100%;
        }
        .avatar-fallback svg{ width:18px; height:18px; opacity:.95; }

        .logout{
            border:0;
            border-radius: var(--radius-sq);
            padding:10px 14px;
            background:rgba(255,255,255,.16);
            color:#fff;
            cursor:pointer;
            font-weight:700;
        }
        .logout:hover{ background:rgba(255,255,255,.22); }

        /* ====== ✅ 메시지 상태 드롭다운 (각지게) ====== */
        .status-dd{
            position: relative;
        }
        .status-btn{
            height:38px;
            border:0;
            border-radius: 10px;           /* ✅ 더 각지게 */
            padding:0 12px;
            background: rgba(255,255,255,.18);
            color:#fff;
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:10px;
            box-shadow:none;
            font-weight:900;
        }
        .status-btn:hover{ background: rgba(255,255,255,.24); }
        .status-dot{
            width:12px;height:12px;
            border-radius: 50%;            /* ✅ 원형 말고 살짝 각진 점 */
            background: rgba(255,255,255,.8);
            box-shadow: 0 0 0 3px rgba(255,255,255,.08);
            flex:0 0 auto;
        }
        .status-label{
            font-size: 13px;
            letter-spacing: .2px;
            line-height:1;
            white-space:nowrap;
        }
        .status-caret{
            width:14px;height:14px;
            opacity:.95;
            flex:0 0 auto;
        }

        .status-menu{
            position:absolute;
            right:0;
            top:44px;
            width: 190px;
            background:#fff;
            color:var(--text);
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 12px;          /* ✅ 패널도 각지게 */
            box-shadow: var(--shadow2);
            overflow:hidden;
            display:none;
            z-index: 1200;
        }
        .status-menu.open{ display:block; }

        .status-item{
            width:100%;
            border:0;
            background:#fff;
            cursor:pointer;
            padding: 10px 12px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            font-weight: 800;
        }
        .status-item:hover{ background:#f8fafc; }
        .status-item:disabled{
            cursor:not-allowed;
            opacity:.55;
            background:#fff;
        }
        .status-left{
            display:flex;
            align-items:center;
            gap:10px;
        }
        .status-dot.sm{
            width:10px;height:10px;
            border-radius: 50%;
            box-shadow:none;
        }
        .status-code{
            font-size:11px;
            color: var(--muted);
            font-weight:800;
        }

        .dot-C{ background: var(--success) !important; }
        .dot-M{ background: var(--gray) !important; }
        .dot-D{ background: var(--warn) !important; }
        .dot-X{ background: var(--danger) !important; }
        .dot-H{ background: #64748b !important; } /* 출근 안함(비활성/강제) */

        /* ====== 알림 전용 패널 & 토스트 스타일 추가 ====== */
        .noti-panel {
            position: fixed;
            right: 18px;
            top: 70px;
            width: 320px;
            height: 450px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: none;
            z-index: 1000;
            flex-direction: column;
        }
        .noti-panel.open { display: flex; }
        .noti-head {
            padding: 14px 18px;
            background: #f8fafc;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 800;
        }

        .noti-head-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .read-all-btn, .chatbot-btn {
            font-size: 11px;
            font-weight: 800;
            color: #3b82f6;
            background: #eff6ff;
            border: 1px solid #dbeafe;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .read-all-btn:hover, .chatbot-btn:hover { background: #dbeafe; }

        .delete-all-btn {
            font-size: 11px;
            font-weight: 800;
            color: #ef4444;
            background: #fef2f2;
            border: 1px solid #fee2e2;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-all-btn:hover {
            background: #fee2e2;
            border-color: #fecaca;
        }

        .noti-body { flex: 1; overflow: hidden; }
        .noti-iframe { width: 100%; height: 100%; border: none; }
        .noti-close-btn { border:0; background:transparent; cursor:pointer; font-size:20px; color:#6b7280; }

        .toast-container { position: fixed; top: calc(var(--topbar-h) + 16px); right: 20px; z-index: 9999; }
        .toast {
            background: #fff; border-left: 4px solid var(--primary); box-shadow: var(--shadow);
            padding: 12px 20px; margin-bottom: 10px; border-radius: 8px; font-size: 14px;
            font-weight: 600; display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease-out;
            /* ✅ 넓이 제한 설정 */
            width: 320px;           /* 고정 넓이를 원할 때 */

            /* ✅ 긴 텍스트 줄바꿈 설정 */
            white-space: normal;    /* 기본 줄바꿈 허용 */
            word-break: break-all;  /* 단어가 길어도 강제 줄바꿈 */
            line-height: 1.4;       /* 줄 간격 살짝 넓혀서 가독성 확보 */
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ====== ✅ 프로필(마이페이지) 패널 ====== */
        .profile-menu{
            position: fixed;
            right: 18px;
            top: 70px;
            width: 320px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: none;
            z-index: 1001;
        }
        .profile-menu.open{ display:block; }

        .profile-menu-top{
            padding: 14px 18px;
            background: #f8fafc;
            border-bottom: 1px solid var(--line);
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
        }
        .profile-tenant{
            font-weight: 900;
            font-size: 13px;
            color: #111827;
        }
        .profile-close-btn{
            border:0;
            background:transparent;
            cursor:pointer;
            font-size:20px;
            color:#6b7280;
        }

        .profile-menu-body{
            padding: 16px 18px 18px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:10px;
        }
        .profile-big{
            width:72px;height:72px;
            border-radius:999px;
            background:#eef2ff;
            overflow:hidden;
            display:grid;
            place-items:center;
        }
        .profile-big img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:none;
        }
        .profile-big .fallback{
            display:grid;
            place-items:center;
            width:100%;
            height:100%;
        }
        .profile-name{
            font-weight: 900;
            font-size: 16px;
            color:#111827;
        }
        .profile-email{
            font-size: 12px;
            color: var(--muted);
            margin-top:-6px;
        }

        /* ✅ 추가: 프로필 패널 간단 정보 */
        .profile-mini{
            width:100%;
            margin-top: 6px;
            padding: 10px 12px;
            border: 1px solid rgba(17,24,39,.08);
            background: #fff;
            border-radius: 14px;
        }
        .mini-row{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(17,24,39,.06);
        }
        .mini-row:last-child{ border-bottom:0; }
        .mini-k{
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
        }
        .mini-v{
            font-size: 12px;
            color:#111827;
            font-weight: 700;
        }

        .profile-actions{
            width:100%;
            display:flex;
            gap:10px;
            margin-top:8px;
        }
        .profile-action{
            flex:1;
            height:40px;
            border-radius: 12px;
            border: 1px solid #dbeafe;
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: 900;
            cursor:pointer;
        }
        .profile-action:hover{ background:#dbeafe; }

        /* ====== 기존 본문 구조 ====== */
        .body{
            display:grid;
            grid-template-columns: var(--sidebar-w) 1fr;
            min-height: calc(100vh - var(--topbar-h));
        }

        .iconbar{
            width:var(--sidebar-w);
            background:#fff;
            border-right:1px solid var(--line);
            padding:10px 0;
            display:flex;
            flex-direction:column;
            align-items:stretch;
            gap:6px;
            overflow:visible;
            position:relative;
            z-index:40;
        }

        .nav-item{
            position:relative;
            width:100%;
            min-height:56px;
            padding:8px 0;
            text-decoration:none;
            color:var(--text);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            user-select:none;
            transition: background .12s ease;
        }
        .nav-item:hover{ background:rgba(17,24,39,.04); }

        .nav-item .nav-ico{
            width:26px; height:26px;
            border-radius:8px;
            background:transparent;
            display:grid;
            place-items:center;
            font-weight:900;
            font-size:20px;
            color:var(--text);
        }

        .nav-item.active::before{
            content:"";
            position:absolute;
            left:0;
            top:50%;
            transform:translateY(-50%);
            width:3px;
            height:26px;
            border-radius:999px;
            background:var(--primary);
        }

        .nav-item::after{
            content: attr(data-tip);
            position:absolute;
            left: calc(100% + 12px);
            top: 50%;
            transform: translateY(-50%) translateX(-4px);
            background: rgba(17,24,39,.92);
            color:#fff;
            font-size:12px;
            font-weight:900;
            padding:7px 10px;
            border-radius:10px;
            white-space:nowrap;
            opacity:0;
            pointer-events:none;
            transition: opacity .12s ease, transform .12s ease;
            z-index:9999;
            box-shadow: 0 14px 30px rgba(0,0,0,.18);
        }
        .nav-item:hover::after{
            opacity:1;
            transform: translateY(-50%) translateX(0);
        }

        .sr-only{
            position:absolute;
            width:1px;height:1px;
            padding:0;margin:-1px;
            overflow:hidden;
            clip:rect(0,0,0,0);
            white-space:nowrap;
            border:0;
        }

        .content-wrap{ padding:22px 26px; position:relative; }
        .content-surface{ min-height: calc(100vh - var(--topbar-h) - var(--footer-h) - 44px); }
        .content-wrap:has(.page-with-subbar){ padding: 0; }

        .footer{ background:#fff; border-top:1px solid var(--line); padding:14px 18px; }
        .footer-inner{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
        .banners{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-left:70px; }
        .banner-btn{ display:inline-flex; align-items:center; justify-content:center; width: min(240px); height:64px; padding:6px; background:#fff; border:1px solid #d1d5db; border-radius:18px; box-shadow:0 8px 18px rgba(0,0,0,.06); text-decoration:none; transition:transform .15s ease, box-shadow .15s ease; }
        .banner-btn:hover{ transform:translateY(-1px); box-shadow:0 12px 24px rgba(0,0,0,.10); }
        .banner-img{ width:100%; height:100%; object-fit:contain; display:block; border-radius:14px; }
        .footer-links{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; flex-wrap:wrap; }
        .footer-links a{ color:var(--muted); text-decoration:none; }
        .footer-links a:hover{text-decoration:underline;}

        /* ====== 챗봇 ====== */
        .chat-fab{ position:fixed; right:18px; bottom:18px; width:52px;height:52px; border-radius:999px; border:0; background:#e8f0ff; color:var(--primary); box-shadow:var(--shadow); cursor:pointer; display:grid; place-items:center; z-index:50; }
        .chat-panel { position: fixed; right: 18px; bottom: 80px; width: 350px; height: 500px; background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; display: none; z-index: 50; flex-direction: column; }
        .chat-panel.open { display: flex; }
        .chat-head { padding: 12px 14px; background: #f8fafc; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; font-weight: 800; flex-shrink: 0; }
        .chat-body { flex: 1; padding: 0 !important; overflow: hidden; }
        .chat-iframe { width: 100%; height: 100%; border: none; }
        .chat-close{ border:0; background:transparent; cursor:pointer; font-size:18px; color:#6b7280; }

        @media (max-width: 860px){
            .topbar-left,.topbar-right{min-width:auto}
            .search{box-shadow:none; width:min(420px, 100%); margin-left:8px;}
            .brand a{font-size:18px;}
            .status-btn{ padding:0 10px; }
            .status-label{ display:none; } /* 좁으면 글자 숨김 */
        }

        /* ====== 서브 사이드바 ====== */
        .page-with-subbar{ display:grid; grid-template-columns: 220px 1fr; gap:0; align-items: stretch; min-height: calc(100vh - var(--topbar-h) - var(--footer-h) - 44px); transition: grid-template-columns .18s ease; }
        .subbar{ height:100%; background: rgba(59,130,246,.08); border-right: 1px solid rgba(59,130,246,.14); box-shadow: 10px 0 24px rgba(17,24,39,.10); overflow:hidden; transition: opacity .18s ease; }
        .subbar-title{ font-weight:700; font-size:12px; color: rgba(31,41,55,.72); padding: 12px 14px 10px; border-bottom: 1px solid rgba(59,130,246,.14); background: rgba(255,255,255,.30); }
        .subbar-nav{ display:flex; flex-direction:column; padding: 10px 0; }
        .subbar-item{ position:relative; display:flex; align-items:center; height:44px; padding: 0 14px 0 20px; text-decoration:none; font-size:13px; font-weight:600; color: var(--primary2); transition: background .12s ease, color .12s ease; }
        .subbar-item:hover{ background: rgba(59,130,246,.08); }
        .subbar-item.active{ background: rgba(59,130,246,.14); color:#1d4ed8; }
        .subbar-item.active::before{ content:""; position:absolute; left:10px; top:50%; transform:translateY(-50%); width:3px; height:26px; border-radius:999px; background: var(--primary); }

        html.subbar-collapsed .page-with-subbar{ grid-template-columns: 0 minmax(0, 1fr); }
        html.subbar-collapsed .page-with-subbar > .subbar{ overflow: hidden; opacity: 0; pointer-events: none; border-right: 0; box-shadow: none; }

        /* ✅ FIX: 서브바 페이지 “붙어보임” 해결 (오른쪽 영역 여백 복구) */
        .page-with-subbar{ gap: 18px; }
        .page-with-subbar > :not(.subbar){
            padding: 22px 26px;
        }
    </style>

    <th:block layout:fragment="pageStyles"></th:block>
</head>

<body>

<div id="me"
     style="display:none"
     th:attr="data-emp-no=${(#authentication != null and #authentication.principal != null) ? #authentication.principal.subjectId : ''}">
</div>

<div class="app">

    <header class="topbar">
        <div class="topbar-left">
            <button class="launcher-btn" type="button" id="launcherBtn" aria-label="사이드바 토글" aria-pressed="false">
                <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/>
                    <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
                    <circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
                </svg>
            </button>

            <div class="brand">
                <div class="logo-box">B</div>
                <a th:href="@{/employees}" href="/employees">Bizportal</a>
            </div>
        </div>

        <div class="topbar-center">
            <form class="search" action="#" method="get">
                <select class="scope" name="scope" aria-label="검색 범위">
                    <option value="label">Label</option>
                    <option value="all">All</option>
                </select>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="7" stroke-width="2"/>
                    <path d="M20 20L17 17" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" name="q" placeholder="Search" autocomplete="off"/>
            </form>
        </div>

        <!-- ✅ 순서 변경: (msgStat) (알림) (마이페이지) (로그아웃) -->
        <div class="topbar-right">

<script>
    /* ====== ✅ 공통: CSRF 헤더 얻기 ====== */
    function getCsrfHeader(){
        const csrfParamEl = document.getElementById('csrfParam');
        const csrfHeaderEl = document.getElementById('csrfHeader');
        if (csrfParamEl && csrfHeaderEl) {
            return { [csrfHeaderEl.value]: csrfParamEl.value };
        }
        return {};
    }

    /* ✅ 1. 알림 관련 로직 */
    function updateNotiBadge(count) {
        const badge = document.getElementById('notiBadge');
        if (!badge) return;
        if (count > 0) {
            badge.innerText = count > 99 ? '99+' : count;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }

    function showNotiToast(message) {
        let container = document.querySelector('.toast-container');
        if (!container) {
            container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<span>🔔</span> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 500);
        }, 4000);
    }

    function toggleNoti(force) {
        const panel = document.getElementById('notiPanel');
        const isVisible = typeof force === 'boolean' ? force : !panel.classList.contains('open');
        panel.classList.toggle('open', isVisible);
        if (isVisible) {
            toggleChat(false);
            toggleProfile(false);
            toggleStatusMenu(false);
            document.getElementById('notiIframe').contentWindow.location.reload();
        }
    }

    async function readAllInIframe() {
        const iframe = document.getElementById('notiIframe');
        if (iframe && iframe.contentWindow.readAllNotifications) {
            await iframe.contentWindow.readAllNotifications();
        }
    }

    async function deleteAllInIframe() {
        const iframe = document.getElementById('notiIframe');
        if (iframe && iframe.contentWindow.deleteAllNotifications) {
            await iframe.contentWindow.deleteAllNotifications();
        }
    }



    async function initNotificationSystem() {
        const empId = document.getElementById('me')?.dataset?.empNo;
        if (!empId) return;

        try {
            const res = await fetch('/api/v1/notifications/unread-count');
            if (res.ok) {
                const result = await res.json();
                updateNotiBadge(result.data);
            }
        } catch (e) { console.error("초기 알림 카운트 로드 실패", e); }

        const eventSource = new EventSource('/api/v1/notifications/stream', {
            withCredentials: true
        });

        eventSource.addEventListener('notification', (e) => {
            const data = JSON.parse(e.data);
            updateNotiBadge(data.unreadCount);
            showNotiToast(data.notification.content);

            const iframe = document.getElementById('notiIframe');
            if (iframe && iframe.contentWindow && typeof iframe.contentWindow.appendRealtimeNoti === 'function') {
                iframe.contentWindow.appendRealtimeNoti(data.notification);
            }
        });

        eventSource.onerror = () => { console.warn("SSE 연결 끊김, 재연결 시도 중..."); };
    }

    /* ✅ 2. 기존 로직 */
    function toggleChat(force) {
        const panel = document.getElementById('chatPanel');
        const open = typeof force === 'boolean' ? force : !panel.classList.contains('open');
        panel.classList.toggle('open', open);
        if (open) {
            toggleNoti(false);
            toggleProfile(false);
            toggleStatusMenu(false);
        }
    }

    const SUBBAR_KEY = 'bizportal_subbar_collapsed';

    function setSubbarCollapsed(collapsed){
        document.documentElement.classList.toggle('subbar-collapsed', collapsed);
        const btn = document.getElementById('launcherBtn');
        if (btn) btn.setAttribute('aria-pressed', String(!collapsed));
        try { localStorage.setItem(SUBBAR_KEY, collapsed ? '1' : '0'); } catch (e) {}
    }

    function toggleSubbar(){
        const collapsed = document.documentElement.classList.contains('subbar-collapsed');
        setSubbarCollapsed(!collapsed);
    }

    document.getElementById('launcherBtn')?.addEventListener('click', toggleSubbar);

    document.getElementById('logoutForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        const url = form.getAttribute('action') || '/auth/logout';
        const headers = { 'Accept': 'application/json', ...getCsrfHeader() };
        try { await fetch(url, { method: 'POST', credentials: 'include', headers }); }
        finally { location.href = '/auth/employee/login'; }
    });

    async function loadProfilePhoto() {
        const meEl = document.getElementById('me');
        const empNo = meEl?.dataset?.empNo;
        if (!empNo) return;
        const BASE = '/api/v1/attachments';
        const img = document.getElementById('profileImg');
        const fallback = document.getElementById('profileFallback');
        if (!img || !fallback) return;

        function showFallback() { img.style.display = 'none'; fallback.style.display = 'grid'; }
        function showImg(url) {
            img.onload = () => { img.style.display = 'block'; fallback.style.display = 'none'; };
            img.onerror = () => showFallback();
            img.src = url;
        }
        try {
            const listRes = await fetch(`${BASE}?domain=EMPLOYEE&entityId=${encodeURIComponent(empNo)}`, { credentials: 'include' });
            if (!listRes.ok) return showFallback();
            const listJson = await listRes.json();
            const items = listJson?.data || [];
            if (!items.length) return showFallback();
            const main = items.find(it => it.isMain === true);
            const pickedId = main ? (main.attachmentId || main.id) : (items[0].attachmentId || items[0].id);
            if (!pickedId) return showFallback();
            const previewRes = await fetch(`${BASE}/${pickedId}/preview-url`, { credentials: 'include' });
            if (!previewRes.ok) return showFallback();
            const previewJson = await previewRes.json();
            const url = previewJson?.data?.url || previewJson?.data?.previewUrl;
            if (url) showImg(url); else showFallback();
        } catch (e) { showFallback(); }
    }

    function normalizePath(p){
        if (!p) return '/';
        return (p.length > 1 && p.endsWith('/')) ? p.slice(0, -1) : p;
    }

    function pathMatches(current, candidate){
        current = normalizePath(current);
        candidate = normalizePath(candidate);
        return current === candidate || (candidate !== '/' && current.startsWith(candidate + '/'));
    }

    function setActiveIconbarMenu() {
        const currentPath = normalizePath(window.location.pathname);
        const links = Array.from(document.querySelectorAll('.iconbar a.nav-item'));
        links.forEach(a => a.classList.remove('active'));
        let best = null;
        let bestLen = -1;
        links.forEach(a => {
            const candidates = [];
            try { candidates.push(new URL(a.href, window.location.origin).pathname); } catch (e) {}
            const pref = a.getAttribute('data-active-prefix');
            if (pref) pref.split(',').forEach(p => candidates.push(p.trim()));
            candidates.forEach(c => {
                if (pathMatches(currentPath, c)) {
                    const len = normalizePath(c).length;
                    if (len > bestLen) { bestLen = len; best = a; }
                }
            });
        });
        if (best) best.classList.add('active');
    }

    /* ✅ 3. 프로필(마이페이지) 패널 로직 */
    let _profileLoaded = false;

    function toggleProfile(force){
        const menu = document.getElementById('profileMenu');
        const btn = document.getElementById('profileBtn');
        if (!menu || !btn) return;

        const open = typeof force === 'boolean' ? force : !menu.classList.contains('open');

        menu.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', String(open));

        if (open) {
            toggleNoti(false);
            toggleChat(false);
            toggleStatusMenu(false);
            if (!_profileLoaded) loadMyProfileMenu();
            syncProfileImageToMenu();
        }
    }

    function syncProfileImageToMenu(){
        const headerImg = document.getElementById('profileImg');
        const menuImg = document.getElementById('profileMenuImg');
        const fallback = document.getElementById('profileMenuFallback');
        if (!menuImg || !fallback) return;

        const url = headerImg?.src;
        if (url) {
            menuImg.onload = () => { menuImg.style.display='block'; fallback.style.display='none'; };
            menuImg.onerror = () => { menuImg.style.display='none'; fallback.style.display='grid'; };
            menuImg.src = url;
        } else {
            menuImg.style.display='none';
            fallback.style.display='grid';
        }
    }

    async function loadMyProfileMenu(){
        try {
            const res = await fetch('/api/v1/employees/me', {
                credentials:'include',
                headers:{ 'Accept':'application/json' }
            });
            if (!res.ok) return;

            const json = await res.json();
            const me = json?.data ?? json;
            if (!me) return;

            document.getElementById('profileComName').innerText = me.comName || 'Bizportal';
            document.getElementById('profileName').innerText = me.empName || me.empId || '내 계정';
            document.getElementById('profileEmail').innerText = me.email || '';

            document.getElementById('miniDep').innerText = me.depName || '-';
            document.getElementById('miniPos').innerText = me.posName || '-';
            document.getElementById('miniWorkPhone').innerText = me.workPhone || '-';

            _profileLoaded = true;
        } catch (e) {
            console.warn('프로필 메뉴 정보 로드 실패', e);
        }
    }

    /* ====== ✅ 4. 메시지 상태 드롭다운 로직 ====== */
    const MSGSTAT_LABEL = {
        C: '근무 중',
        M: '회의 중',
        D: '업무 집중',
        X: '자리 비움',
        H: '출근 안함'
    };

    function applyStatusUI(code){
        const dot = document.getElementById('statusDot');
        const label = document.getElementById('statusLabel');
        if (!dot || !label) return;

        const safe = code && MSGSTAT_LABEL[code] ? code : 'C';

        dot.classList.remove('dot-C','dot-M','dot-D','dot-X','dot-H');
        dot.classList.add('dot-' + safe);
        label.textContent = MSGSTAT_LABEL[safe] || '근무 중';
    }

    function toggleStatusMenu(force){
        const menu = document.getElementById('statusMenu');
        const btn = document.getElementById('statusBtn');
        if (!menu || !btn) return;

        const open = typeof force === 'boolean' ? force : !menu.classList.contains('open');
        menu.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', String(open));

        if (open){
            toggleNoti(false);
            toggleChat(false);
            toggleProfile(false);
        }
    }

    async function loadMyStatus(){
        try{
            const res = await fetch('/api/v1/employees/me', { credentials:'include', headers:{'Accept':'application/json'} });
            if(!res.ok) return;
            const json = await res.json();
            const me = json?.data ?? json;

            // atte가 휴가/출장이면 강제 H로 보여주고, 메뉴 비활성 처리(선택은 막음)
            const atte = me?.atte;   // 예: V/B/C...
            let code = me?.msgStat;  // 예: C/M/D/X/H

            const mustOff = (atte === 'V' || atte === 'B');
            if (mustOff) code = 'H';

            applyStatusUI(code);

            // 강제 H면 드롭다운 선택 막기
            const menu = document.getElementById('statusMenu');
            if (menu){
                const items = Array.from(menu.querySelectorAll('button.status-item'));
                items.forEach(b => b.disabled = !!mustOff);
            }
        }catch(e){
            console.warn('msgStat 로드 실패', e);
        }
    }

    async function setMsgStat(code){
        // H는 로그인 후 선택 불가
        if (code === 'H') return;

        // UI 먼저 반영(낙관적)
        applyStatusUI(code);
        toggleStatusMenu(false);

        // ✅ 너희 실제 API로 바꾸기
        const url = '/api/v1/employees/me/msg-stat';

        try{
            const headers = {
                'Content-Type':'application/json',
                'Accept':'application/json',
                ...getCsrfHeader()
            };

            const res = await fetch(url, {
                method:'PATCH',
                credentials:'include',
                headers,
                body: JSON.stringify({ code })
            });

            if (!res.ok){
                // 실패하면 서버 값으로 재동기화
                await loadMyStatus();
            }
        }catch(e){
            await loadMyStatus();
        }
    }

    let chatbotWindow = null; // 열린 창을 저장할 변수

    function openChatbot() {
        let sessionId = sessionStorage.getItem("MAIN_CHAT_SESSION_ID");
        if (!sessionId) {
            sessionId = crypto.randomUUID();
            sessionStorage.setItem("MAIN_CHAT_SESSION_ID", sessionId);
        }

        const chatUrl = "/chatbot?sessionId=" + sessionId;

        // 이미 창이 열려 있고 닫히지 않았다면?
        if (chatbotWindow && !chatbotWindow.closed) {
            chatbotWindow.focus(); // 새로고침 하지 않고 포커스만 줌 (대화 내용 유지)
        } else {
            // 창이 없거나 닫혔다면 새로 엶
            chatbotWindow = window.open(chatUrl, "ChatbotPopup", "width=420,height=740");
        }
    }

    window.addEventListener('click', (e) => {
        // profile
        const menu = document.getElementById('profileMenu');
        const btn = document.getElementById('profileBtn');
        if (menu && btn && menu.classList.contains('open')) {
            const inside = menu.contains(e.target) || btn.contains(e.target);
            if (!inside) toggleProfile(false);
        }

        // status
        const sMenu = document.getElementById('statusMenu');
        const sBtn = document.getElementById('statusBtn');
        const sDd = document.getElementById('statusDd');
        if (sMenu && sDd && sMenu.classList.contains('open')){
            const inside = sDd.contains(e.target) || (sBtn && sBtn.contains(e.target));
            if (!inside) toggleStatusMenu(false);
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape'){
            toggleProfile(false);
            toggleStatusMenu(false);
            toggleNoti(false);
            toggleChat(false);
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        try { if (localStorage.getItem(SUBBAR_KEY) === '1') setSubbarCollapsed(true); } catch (e) {}
        loadProfilePhoto();
        setActiveIconbarMenu();
        initNotificationSystem();
        loadMyStatus();  // ✅ 상태는 헤더에 바로 표시
    });


</script>

<th:block layout:fragment="pageScripts"></th:block>
</body>
</html>
