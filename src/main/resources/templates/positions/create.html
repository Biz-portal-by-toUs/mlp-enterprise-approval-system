<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>직급 등록</title>
    <style>
        :root{
            --primary:#2f6fda;
            --bg:#f3f5f9;
            --card:#f1f3f6;
            --text:#111;
            --muted:#6b7280;
            --line:#e5e7eb;
            --white:#fff;
            --danger:#c62828;
            --ok:#1b7f3a;
        }
        *{box-sizing:border-box}
        body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text)}
        .topbar{
            height:64px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;
            padding:0 20px; box-shadow:0 10px 25px rgba(0,0,0,.12);
        }
        .brand{font-weight:800;font-size:24px;letter-spacing:.3px}
        .wrap{display:flex;min-height:calc(100vh - 64px)}
        .sidenav{width:84px;background:#fff;border-right:1px solid var(--line);padding:14px 10px}
        .sidenav .item{height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:8px 0;color:var(--muted);font-size:12px}
        .sidenav .item.active{background:#eef4ff;color:var(--primary);font-weight:700}
        .subnav{width:220px;background:#fbfcfe;border-right:1px solid var(--line);padding:18px}
        .subnav .title{font-weight:800;margin:10px 0 18px 0}
        .subnav a{display:block;padding:12px 10px;border-radius:10px;color:#2b5db8;text-decoration:none;margin:6px 0}
        .subnav a.active{background:#eef4ff;font-weight:700}
        .content{flex:1;padding:30px 32px}
        .page-title{font-size:34px;font-weight:900;margin:10px 0 8px}
        .page-sub{font-size:18px;font-weight:800;margin:0 0 20px;color:#111}
        .card{ background:var(--card); border-radius:18px; padding:22px; }
        .form-card{ background:#fff;border-radius:16px;padding:22px;border:1px solid var(--line); }
        .field{margin-bottom:16px}
        .label{font-weight:900;margin-bottom:10px}
        .input{
            width:100%;height:46px;border-radius:12px;border:1px solid var(--line);
            padding:0 14px;font-size:14px;outline:none;background:#fff;
        }
        .help{margin-top:8px;font-size:13px;color:var(--muted);font-weight:700}
        .msg{margin-top:10px;font-size:13px;font-weight:900;display:none}
        .msg.ok{color:var(--ok)}
        .msg.err{color:var(--danger)}
        .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
        .btn{
            border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer;
            background:var(--primary);color:#fff;box-shadow:0 10px 20px rgba(47,111,218,.25);
        }
        .btn.ghost{
            background:#eef4ff;color:#2b5db8;box-shadow:none;border:1px solid #d9e6ff;
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="brand">Bizportal</div>
    <div class="muted" style="color:#eaf2ff;font-weight:700;">직급 등록</div>
</header>

<div class="wrap">
    <aside class="sidenav">
        <div class="item">결재</div>
        <div class="item">회의</div>
        <div class="item">메일</div>
        <div class="item">문서함</div>
        <div class="item">공유함</div>
        <div class="item">캘린더</div>
        <div class="item">게시판</div>
        <div class="item">예약</div>
        <div class="item">근태</div>
        <div class="item">조직도</div>
        <div class="item active">관리자</div>
    </aside>

    <aside class="subnav">
        <div class="title">직급 편성</div>
        <a href="/admin/departments">부서 편성</a>
        <a class="active" href="/admin/positions/list">직급 편성</a>
        <a href="/admin/employees">사원 관리</a>
        <a href="/admin/rules">사내 규정 관리</a>
    </aside>

    <main class="content">
        <div class="page-title">직급 등록</div>
        <div class="page-sub">직급 정보 입력</div>

        <section class="card">
            <div class="form-card">
                <div class="field">
                    <div class="label">직급명</div>
                    <input id="posName" class="input" type="text" placeholder="예) 대리, 과장, 팀장" maxlength="30" />
                    <div class="help">직급명을 입력하세요. (최대 30자)</div>
                </div>

                <!-- ✅ 드롭다운으로 변경 (1~50) -->
                <div class="field">
                    <div class="label">직급 순서</div>
                    <select id="posOrder" class="input" aria-label="직급 순서 선택">
                        <!-- JS로 1~50 생성 -->
                    </select>
                    <div class="help">직급 순서를 선택하세요. (1 ~ 50)</div>
                    <div id="msg" class="msg"></div>
                </div>

                <div class="actions">
                    <button class="btn ghost" type="button" onclick="location.href='/admin/positions/list'">취소</button>
                    <button class="btn" type="button" onclick="submitCreate()">등록</button>
                </div>
            </div>
        </section>
    </main>
</div>

<script>
    // ✅ 드롭다운 옵션(1~50) 생성
    (function initPosOrder() {
        const select = document.getElementById("posOrder");
        for (let i = 1; i <= 50; i++) {
            const opt = document.createElement("option");
            opt.value = String(i);
            opt.textContent = String(i);
            select.appendChild(opt);
        }
        select.value = "1"; // 기본값
    })();

    function getAccessToken() {
        return (
            localStorage.getItem("accessToken") ||
            localStorage.getItem("jwt") ||
            sessionStorage.getItem("accessToken") ||
            sessionStorage.getItem("jwt")
        );
    }

    function showMsg(type, text) {
        const el = document.getElementById("msg");
        el.style.display = "block";
        el.className = "msg " + (type === "ok" ? "ok" : "err");
        el.textContent = text;
    }

    async function submitCreate() {
        const token = getAccessToken();
        const posName = document.getElementById("posName").value.trim();
        const posOrder = parseInt(document.getElementById("posOrder").value, 10);

        if (!token) {
            showMsg("err", "로그인이 필요합니다. (토큰 없음)");
            return;
        }
        if (!posName) {
            showMsg("err", "직급명을 입력하세요.");
            return;
        }
        if (!Number.isInteger(posOrder) || posOrder < 1 || posOrder > 50) {
            showMsg("err", "직급 순서를 올바르게 선택하세요. (1 ~ 50)");
            return;
        }

        const res = await fetch("/api/v1/admin/positions", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({ posName, posOrder })
        });

        if (res.status === 401) {
            showMsg("err", "인증이 만료되었습니다. 다시 로그인 해주세요.");
            return;
        }
        if (res.status === 403) {
            showMsg("err", "권한이 없습니다. (COM_ADMIN만 가능)");
            return;
        }

        if (!res.ok) {
            let msg = "직급 등록 중 오류가 발생했습니다. (" + res.status + ")";
            try {
                const json = await res.json();
                if (json && (json.message || json.msg)) msg = json.message || json.msg;
            } catch(e) {}
            showMsg("err", msg);
            return;
        }

        showMsg("ok", "직급이 등록되었습니다.");
        setTimeout(() => location.href = "/admin/positions/list", 300);
    }
</script>
</body>
</html>
