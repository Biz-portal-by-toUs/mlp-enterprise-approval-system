<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8"/>
    <title>회의실 예약</title>

    <th:block layout:fragment="pageStyles">
        <style>
            h2 { margin-bottom: 16px; }

            /* ===== 기준 덩어리 ===== */
            .timetable-section { padding: 20px 20px 32px; }

            /* ===== 상단 ===== */
            .timetable-header {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                margin-bottom: 10px;
            }

            /* 범례 */
            .legend {
                display: flex;
                flex-direction: column;
                gap: 6px;
                font-size: 13px;
                list-style: none;
                padding: 0;
                margin: 0;
            }
            .legend-row { display: flex; align-items: center; gap: 6px; }

            .legend-box {
                display: inline-block;
                width: 12px;
                height: 12px;
                margin-right: 6px;
                border-radius: 3px;
            }

            .legend-box.legend-selected { background: #4f8fe3; }
            .legend-box.legend-mine { background: #9c27b0; }
            .legend-box.legend-other { background: #8bc34a; }

            /* 선택/예약 색상 */
            .time-cell.selected { background: #4f8fe3; }
            .time-cell.reserved-mine { background: #9c27b0; }
            .time-cell.reserved-other { background: #8bc34a; }

            /* 과거 */
            .time-cell.disabled { pointer-events: none; }
            .time-cell.past { position: relative; }
            .time-cell.past::after {
                content: "";
                position: absolute;
                inset: 0;
                background: rgba(200, 200, 200, 0.55);
                z-index: 2;
                pointer-events: none;
            }

            /* 날짜 */
            .date-nav {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 22px;
                font-weight: bold;
                justify-content: center;
            }
            .date-nav button {
                border: none;
                background: none;
                font-size: 22px;
                cursor: pointer;
            }

            /* 상단 예약 버튼(기억한 버튼 스타일) */
            .reserve-action-btn{
                height: 40px;
                padding: 0 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                border: none;
                background: var(--primary);
                color: #fff;
                white-space: nowrap;
                transition: 0.15s;
                justify-self: end;
            }
            .reserve-action-btn:hover{ filter: brightness(0.9); }

            /* 페이지 래퍼 */
            .meeting-reservation-page {
                font-family: Pretendard, Arial, sans-serif;
                background: #f7f8fa;
                width: 100%;
            }

            /* 타임테이블 */
            .timetable-wrapper { width: 100%; overflow-x: auto; }
            .timetable {
                width: 100%;
                min-width: 1100px;
                border: 1px solid #ddd;
                background: white;
            }
            .time-header, .room-row {
                display: grid;
                grid-template-columns: 180px repeat(18, minmax(48px, 1fr));
            }
            .time-header div, .room-row div {
                border-bottom: 1px solid #e0e0e0;
                border-right: 1px solid #e0e0e0;
                text-align: center;

                /* ✅ 높이 살짝 업(너무 뚱뚱 X) */
                min-height: 44px;     /* 기존엔 padding으로만 높이 결정 */
                padding: 10px 0;      /* 기존 8px 0 -> 10px 0 */

                font-size: 13px;

                /* ✅ 텍스트 세로 가운데 정렬 */
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .time-header { background: #f0f2f5; font-weight: bold; }
            .room-name { background: #fafafa; font-weight: bold; }

            .time-header div:not(:first-child){
                display: flex;
                align-items: center;
                justify-content: flex-start;
                padding-left: 8px;
            }

            /* ===== 모달 ===== */
            .modal-card {
                width: 420px;
                border-radius: 20px;
                padding: 22px;
                background: #fff;
                box-shadow: 0 16px 40px rgba(0, 0, 0, .15);
                margin: 0 auto;
            }
            .room-img {
                width: 100%;
                height: 180px;
                border-radius: 15px;
                object-fit: cover;
                margin-bottom: 14px;
                display:none;
            }
            .info-table > div { margin: 8px 0; }

            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin: 6px 0 10px;
            }
            .chip {
                background: #f1f5ff;
                border-radius: 20px;
                padding: 4px 10px;
                border: 1px solid #cdd9ff;
                font-size: 13px;
            }
            .chip button {
                border: none;
                background: none;
                margin-left: 4px;
                cursor: pointer;
            }

            input, select {
                width: 100%;
                border-radius: 8px;
                padding: 6px 10px;
                border: 1px solid #ccc;
                box-sizing: border-box;
            }

            #employeeSearch, #employeeList, #purpose {
                width: 100%;
                box-sizing: border-box;
            }
            .form-block { width: 100%; }

            /* =============================
               [FINAL MODAL] 제목 가운데 + 버튼만 가운데(가로)
               ============================= */

            /* 모달 제목만 가운데 */
            #reserveModal .modal-card > h2{
                text-align: center;
                margin: 0 0 16px;
            }

            /* 본문 텍스트는 왼쪽 유지 */
            #reserveModal .info-table,
            #reserveModal .info-table > div{
                text-align: left;
            }

            /* 버튼 줄: 가운데 + 가로 정렬 */
            #reserveModal .modal-actions{
                display: flex;
                justify-content: center;
                gap: 12px;
                margin-top: 14px;
            }

            /* 버튼 공통 크기(동일 사이즈) */
            #reserveModal .modal-actions button{
                min-width: 110px;
                height: 36px;
                padding: 0 14px;
                border-radius: 8px;
                font-size: 13px;
                font-weight: 700;
                border: none;
                cursor: pointer;
                white-space: nowrap;
                transition: 0.15s;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            /* 예약 버튼(블루) */
            #reserveModal #reserveBtn{
                background: var(--primary);
                color: #fff;
            }
            #reserveModal #reserveBtn:hover{ filter: brightness(0.9); }

            /* 취소/닫기 버튼(회색) */
            #reserveModal #cancelBtn{
                background: #9ca3af;
                color: #fff;
            }
            #reserveModal #cancelBtn:hover{ filter: brightness(0.95); }

            /* 예약 취소 버튼(빨강) */
            #reserveModal #deleteBtn{
                background: #ff4d4f;
                color: #fff;
            }

            /* SweetAlert가 reserveModal(999999)보다 위에 뜨도록 */
            .swal2-container{
                z-index: 3000000 !important;
            }

            #reserveModal #deleteBtn:hover{ filter: brightness(0.95); }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('meeting-reservation')"></aside>

        <div class="meeting-reservation-page">
            <div class="timetable-section">
                <h2>회의실 예약</h2>
                <br><br>

                <div class="timetable-header">
                    <ul class="legend">
                        <li class="legend-row"><span class="legend-box legend-selected"></span> 선택한 예약</li>
                        <li class="legend-row"><span class="legend-box legend-mine"></span> 내 예약</li>
                        <li class="legend-row"><span class="legend-box legend-other"></span> 다른 사용자 예약</li>
                    </ul>

                    <div class="date-nav">
                        <button id="prevDate">◀</button>
                        <span id="currentDate"></span>
                        <input type="date" id="hiddenDate" style="display:none"/>
                        <button id="nextDate">▶</button>
                    </div>

                    <button class="reserve-action-btn" id="openReserve">예약</button>
                </div>

                <div class="timetable-wrapper">
                    <div class="timetable" id="timetable"></div>
                </div>

                <!-- 예약/취소 모달 -->
                <div id="reserveModal" style="
                  display:none;
                  position:fixed; inset:0;
                  background: rgba(0,0,0,.35);
                  align-items:center; justify-content:center;
                  z-index: 999999;">

                    <div class="modal-card" style="position:relative; z-index:1000000;">
                        <h2>회의실 예약</h2>

                        <img id="roomImage" class="room-img">

                        <div class="info-table">
                            <div><b>회의실명:</b> <span id="roomName"></span></div>
                            <div><b>예약일자:</b> <span id="resvDate"></span></div>
                            <div><b>예약시간:</b> <span id="resvTime"></span></div>
                            <div><b>예약자:</b> <span id="reserver"></span></div>

                            <div class="form-block reserve-only">
                                <b>참석자:</b>
                                <div id="attendeeChips" class="chips"></div>
                                <input id="employeeSearch" placeholder="이름 검색">
                                <select id="employeeList" size="4"></select>
                            </div>

                            <div class="form-block reserve-only">
                                <b>예약목적:</b>
                                <input id="purpose">
                            </div>

                            <!-- ✅ 버튼은 항상 3개가 존재하지만 모드에 따라 2개만 보이게 -->
                            <div class="modal-actions">
                                <!-- 취소 모드에서만 보임 -->
                                <button id="deleteBtn" style="display:none;">예약 취소</button>

                                <!-- 예약 모드에서만 보임 -->
                                <button class="reserve-only" id="reserveBtn">예약</button>

                                <!-- 예약 모드: '취소' / 취소 모드: '닫기' -->
                                <button id="cancelBtn">취소</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>
</div>

<th:block layout:fragment="pageScripts">
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const START_HOUR = 9;
        const END_HOUR = 18;

        let myEmpId = null;
        let selectedAttendees = [];
        let currentDate = dayjs();
        let firstClickCell = null;

        let dragCells = [];
        let isDragging = false;
        let dragRow = null;

        let ROOMS = [];
        let RESERVATIONS = [];

        const timetable = document.getElementById("timetable");
        const currentDateEl = document.getElementById("currentDate");
        const hiddenDate = document.getElementById("hiddenDate");

        const reserverEl = document.getElementById("reserver");
        const reserveBtn = document.getElementById("reserveBtn");
        const deleteBtn = document.getElementById("deleteBtn");
        const cancelBtn = document.getElementById("cancelBtn");

        const modal = document.getElementById("reserveModal");
        const mRoomName = document.getElementById("roomName");
        const mRoomImage = document.getElementById("roomImage");
        const mDate = document.getElementById("resvDate");
        const mTime = document.getElementById("resvTime");

        const API_BASE = window.location.origin;

        async function apiFetch(path, options = {}) {
            const url = API_BASE + path;
            const res = await fetch(url, {
                ...options,
                credentials: "include",
                headers: {...(options.headers || {})}
            });

            if (res.status === 401 || res.status === 403) {
                await swalWarn("로그인이 만료되었어요. 다시 로그인해 주세요.", "로그인 만료");
                throw new Error("UNAUTHORIZED");
            }
            return res;
        }

        function hmToMin(hm){
            const [h,m] = String(hm).split(":").map(Number);
            return (h*60) + (m||0);
        }

        function getResvDate(r){
            return r.resvDate ?? (r.startedAt ? String(r.startedAt).substring(0,10) : null);
        }
        function getResvStartHM(r){
            return r.startTime ? String(r.startTime).substring(0,5)
                : (r.startedAt ? String(r.startedAt).substring(11,16) : null);
        }
        function getResvEndHM(r){
            return r.endTime ? String(r.endTime).substring(0,5)
                : (r.endedAt ? String(r.endedAt).substring(11,16) : null);
        }

        function hasConflict({ roomNo, dateStr, startTime, endTime }){
            const s = hmToMin(startTime);
            const e = hmToMin(endTime);

            return (RESERVATIONS || []).some(r => {
                if (String(r.roomNo) !== String(roomNo)) return false;
                if (getResvDate(r) !== dateStr) return false;

                const rs = getResvStartHM(r);
                const re = getResvEndHM(r);
                if (!rs || !re) return false;

                const rS = hmToMin(rs);
                const rE = hmToMin(re);

                // 겹침 조건: !(내끝 <= 상대시작 || 내시작 >= 상대끝)
                return !(e <= rS || s >= rE);
            });
        }

        function get(obj, path) {
            return path.split(".").reduce((o, k) => o?.[k], obj);
        }

        function pick(obj, paths, fallback = "-") {
            for (const p of paths) {
                const v = get(obj, p);
                if (v !== undefined && v !== null && String(v).trim() !== "") return v;
            }
            return fallback;
        }

        function setReserverToMe() {
            if (!reserverEl) return;
            const emp = ME?.empName ?? ME?.employeeName ?? "-";
            const dep = ME?.depName ?? ME?.departmentName ?? "-";
            reserverEl.innerText = `${emp} (${dep})`;
        }

        function isPastCell(cellIdx) {
            const now = dayjs();

            if (currentDate.isBefore(now, "day")) return true;

            if (currentDate.isSame(now, "day")) {
                const cellHour = START_HOUR + Math.floor(cellIdx / 2);
                const cellMinute = cellIdx % 2 === 0 ? 0 : 30;

                const cellTime = currentDate.hour(cellHour).minute(cellMinute).second(0);
                if (cellTime.isBefore(now)) return true;
            }
            return false;
        }

        async function changeDate(diff) {
            currentDate = currentDate.add(diff, "day");
            renderDate();
            clearSelection();
            buildTable();
            await loadReservations();
        }

        function renderDate() {
            const ymd = currentDate.format("YYYY-MM-DD");
            if (currentDateEl) currentDateEl.textContent = ymd;
            if (hiddenDate) hiddenDate.value = ymd;
        }

        document.getElementById("prevDate").onclick = async () => changeDate(-1);
        document.getElementById("nextDate").onclick = async () => changeDate(1);

        currentDateEl.onclick = () => {
            hiddenDate.value = currentDate.format("YYYY-MM-DD");
            hiddenDate.showPicker?.();
        };

        hiddenDate.addEventListener("change", async () => {
            if (!hiddenDate.value) hiddenDate.value = dayjs().format("YYYY-MM-DD");
            currentDate = dayjs(hiddenDate.value);
            renderDate();
            clearSelection();
            buildTable();
            await loadReservations();
        });

        async function loadRooms() {
            const res = await apiFetch("/api/v1/meeting-rooms");
            const json = await res.json();

            const raw = json?.data?.data ?? json?.data ?? json;
            ROOMS = Array.isArray(raw) ? raw : (raw?.content ?? []);
            buildTable();
        }

        async function loadReservations() {
            const dateStr = currentDate.format("YYYY-MM-DD");
            const res = await apiFetch(`/api/v1/meeting-room-reservations?date=${dateStr}`);
            const json = await res.json();

            const raw = json?.data?.data ?? json?.data ?? json ?? [];
            const list =
                Array.isArray(raw) ? raw :
                    Array.isArray(raw?.content) ? raw.content :
                        Array.isArray(raw?.items) ? raw.items :
                            Array.isArray(raw?.data) ? raw.data : [];

            RESERVATIONS = list;
            paintReservations();
        }

        function buildTable() {
            timetable.innerHTML = "";

            if (ROOMS.length === 0) {
                timetable.innerHTML = `<div style="padding:20px;color:#888">등록된 회의실이 없습니다.</div>`;
                return;
            }

            const header = document.createElement("div");
            header.className = "time-header";
            header.innerHTML = "<div>회의실</div>";

            for (let h = START_HOUR; h < END_HOUR; h++) {
                header.innerHTML += `<div>${h}:00</div><div>${h}:30</div>`;
            }
            timetable.appendChild(header);

            ROOMS.forEach(room => {
                const row = document.createElement("div");
                row.className = "room-row";
                row.dataset.roomNo = room.roomNo;
                row.innerHTML = `<div class="room-name">${room.roomName}</div>`;

                for (let i = 0; i < 18; i++) {
                    const cell = document.createElement("div");
                    cell.className = "time-cell";

                    if (isPastCell(i)) cell.classList.add("disabled", "past");
                    if (!cell.classList.contains("disabled")) bindSelectable(cell);

                    row.appendChild(cell);
                }
                timetable.appendChild(row);
            });

            paintReservations();
        }

        function bindSelectable(cell) {
            cell.onclick = async () => {
                if (cell.classList.contains("disabled")) return;

                const row = cell.closest(".room-row");
                const cells = [...row.querySelectorAll(".time-cell")];

                if (!firstClickCell) {
                    clearSelection();
                    firstClickCell = cell;
                    selectCell(cell);
                    return;
                }

                if (row !== firstClickCell.closest(".room-row")) {
                    await swalWarn("같은 회의실에서만 선택할 수 있어요.");
                    clearSelection();
                    firstClickCell = null;
                    return;
                }

                const startIdx = cells.indexOf(firstClickCell);
                const endIdx = cells.indexOf(cell);
                let s = Math.min(startIdx, endIdx);
                let e = Math.max(startIdx, endIdx);

                for (let i = s; i <= e; i++) {
                    if (
                        cells[i].classList.contains("reserved-other") ||
                        cells[i].classList.contains("reserved-mine")
                    ) {
                        await swalWarn("중간에 이미 예약된 시간이 있어서 선택할 수 없어요.");
                        clearSelection();
                        firstClickCell = null;
                        return;
                    }
                }

                clearSelection();
                for (let i = s; i <= e; i++) selectCell(cells[i]);
                firstClickCell = null;
            };
        }

        function paintReservations() {
            const fmtHM = (t) => {
                if (!t) return "-";
                if (typeof t === "string") return String(t).substring(0, 5); // "15:00:00" -> "15:00"
                const hh = String(t.h ?? t.hour ?? "").padStart(2, "0");
                const mm = String(t.m ?? t.minute ?? "").padStart(2, "0");
                return `${hh}:${mm}`;
            };

            document.querySelectorAll(".time-cell").forEach(cell => {
                cell.classList.remove("reserved-other", "reserved-mine");
                cell.title = "";
                delete cell.dataset.resvNo;
                delete cell.dataset.empName;
                delete cell.dataset.depName;

                cell.style.cursor = "";
                if (!cell.classList.contains("disabled")) bindSelectable(cell);
                else cell.onclick = null;
            });

            const dateStr = currentDate.format("YYYY-MM-DD");

            const parseHM = (t) => {
                if (!t) return null;
                if (typeof t === "string") {
                    const [h, m] = t.split(":");
                    return {h: Number(h), m: Number(m)};
                }
                return {h: t.hour, m: t.minute};
            };

            RESERVATIONS.forEach(resv => {
                const resvDate = resv.resvDate ?? (resv.startedAt ? String(resv.startedAt).substring(0, 10) : null);
                if (resvDate !== dateStr) return;
                if (!resv.roomNo) return;

                const row = document.querySelector(`.room-row[data-room-no="${resv.roomNo}"]`);
                if (!row) return;

                const st = parseHM(resv.startTime || (resv.startedAt ? String(resv.startedAt).substring(11, 16) : null));
                const et = parseHM(resv.endTime   || (resv.endedAt   ? String(resv.endedAt).substring(11, 16)   : null));
                const timeLabel = `${fmtHM(st)} ~ ${fmtHM(et)}`;
                if (!st || !et) return;

                const startIdx = ((st.h - START_HOUR) * 2) + (st.m >= 30 ? 1 : 0);
                const endIdx   = ((et.h - START_HOUR) * 2) + (et.m >= 30 ? 1 : 0);

                const cells = Array.from(row.querySelectorAll(".time-cell"));
                const isMine = (myEmpId != null) && (String(resv.resvEmpId) === String(myEmpId));

                const empName =
                    resv.reservedByName ??
                    resv.resvEmpName ?? resv.empName ?? resv.reserverName ?? resv.employeeName ?? resv.resvEmp?.empName ?? "-";
                let depName =
                    resv.reservedByDepName ??
                    resv.depName ?? resv.resvDepName ?? resv.departmentName ?? resv.deptName ?? resv.resvEmp?.depName ?? "-";

                if (depName === "-" && resv.resvEmpId && Array.isArray(ALL_EMPLOYEES)) {
                    const emp = ALL_EMPLOYEES.find(e => String(e.empId) === String(resv.resvEmpId));
                    depName = emp?.depName ?? "-";
                }

                for (let i = startIdx; i < endIdx; i++) {
                    const cell = cells[i];
                    if (!cell) continue;

                    cell.classList.add(isMine ? "reserved-mine" : "reserved-other");

                    const who = (depName === "-" ? `${empName}` : `${empName} / ${depName}`);
                    cell.title = `${who} / ${timeLabel}`;
                    cell.dataset.resvNo  = resv.resvNo;
                    cell.dataset.empName = empName;
                    cell.dataset.depName = depName;

                    if (isMine) {
                        cell.onclick = () => openCancelModal(resv, empName, depName);
                        cell.style.cursor = "pointer";
                    } else {
                        cell.onclick = async () => {
                            clearSelection(); // 선택 남아있으면 지워주기
                            await swalInfo(
                                "다른 사용자가 예약한 시간입니다.\n다른 시간을 선택해주세요.",
                                "예약 불가"
                            );
                        };
                        cell.style.cursor = "not-allowed";
                    }
                }
            });
        }

        function selectCell(cell) {
            if (!dragCells.includes(cell)) {
                cell.classList.add("selected");
                dragCells.push(cell);
            }
        }

        function clearSelection() {
            dragCells.forEach(c => c.classList.remove("selected"));
            dragCells = [];
            firstClickCell = null;
        }

        /* ===== 모달 모드 전환 ===== */
        function showReserveMode() {
            document.querySelectorAll(".reserve-only").forEach(el => el.style.display = "block");
            reserveBtn.style.display = "inline-flex";
            deleteBtn.style.display = "none";

            // ✅ 예약 모드 라벨
            cancelBtn.innerText = "취소";

            setReserverToMe();
        }

        function setRoomImageByRoomNo(roomNo) {
            const room = ROOMS.find(r => String(r.roomNo) === String(roomNo));
            const url  = room?.imageUrl || room?.imgUrl || room?.image || null;

            if (url) {
                mRoomImage.src = url;
                mRoomImage.style.display = "block";
            } else {
                mRoomImage.removeAttribute("src");
                mRoomImage.style.display = "none";
            }
        }

        function openCancelModal(resv, empNameFromCell, depNameFromCell) {
            modal.style.display = "flex";

            // 취소 모드: 예약 관련 입력 숨김
            document.querySelectorAll(".reserve-only").forEach(el => el.style.display = "none");
            reserveBtn.style.display = "none";
            deleteBtn.style.display  = "inline-flex";

            // ✅ 취소 모드 라벨
            cancelBtn.innerText = "닫기";

            const roomName = pick(resv, ["roomName", "meetingRoomName", "room.roomName"], "-");
            const resvDate = pick(resv, ["resvDate", "date"], resv.startedAt ? String(resv.startedAt).substring(0, 10) : "-");

            const startRaw = pick(resv, ["startTime"], resv.startedAt ? String(resv.startedAt).substring(11, 19) : null);
            const endRaw   = pick(resv, ["endTime"],   resv.endedAt   ? String(resv.endedAt).substring(11, 19)   : null);
            const toHM = (t) => t ? String(t).substring(0, 5) : "-";

            const meName = ME?.empName ?? ME?.employeeName;
            const meDep  = ME?.depName ?? ME?.departmentName;

            const empName = meName ?? empNameFromCell ?? pick(resv, [
                "resvEmpName", "empName", "reserverName", "employeeName",
                "resvEmp.empName", "employee.empName", "user.empName"
            ], "-");

            const depName = meDep ?? depNameFromCell ?? pick(resv, [
                "depName", "resvDepName", "departmentName", "deptName",
                "resvEmp.depName", "employee.depName", "user.depName"
            ], "-");

            document.getElementById("roomName").innerText = roomName;
            document.getElementById("resvDate").innerText = resvDate;
            document.getElementById("resvTime").innerText = `${toHM(startRaw)} ~ ${toHM(endRaw)}`;
            reserverEl.innerText = `${empName} (${depName})`;

            setRoomImageByRoomNo(pick(resv, ["roomNo", "meetingRoomNo", "room.roomNo"], null));
            modal.dataset.resvNo = pick(resv, ["resvNo", "reservationNo", "id"], "");
        }

        /* ===== 모달 버튼 ===== */
        cancelBtn.onclick = () => { modal.style.display = "none"; };

        reserveBtn.onclick = async () => {
            if (selectedAttendees.length === 0) {
                await swalWarn("참가자를 1명 이상 선택하세요.");
                return;
            }

            const roomNo = Number(modal.dataset.roomNo);
            const dateStr = currentDate.format("YYYY-MM-DD");
            const startTime = modal.dataset.start; // "HH:mm"
            const endTime   = modal.dataset.end;   // "HH:mm"

            // 로딩 표시
            swalLoading("예약 확인 중...", "예약 가능 여부를 확인하고 있어요.");

            // 1) 예약 직전 최신 데이터로 갱신
            await loadReservations();

            // 2) 최신 데이터 기준으로 충돌 체크
            if (hasConflict({ roomNo, dateStr, startTime, endTime })) {
                Swal.close();
                await swalError("이미 다른 사용자가 해당 시간에 예약했습니다.\n새로고침 후 다른 시간을 선택해주세요.", "예약 불가");
                clearSelection();
                modal.style.display = "none";
                return;
            }

            const body = {
                roomNo,
                resvDate: dateStr,
                startTime,
                endTime,
                purp: document.getElementById("purpose").value,
                attendeeIds: selectedAttendees.map(a => a.empId)
            };

            const res = await apiFetch("/api/v1/meeting-room-reservations", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                Swal.close();
                let err = null;
                try { err = await res.json(); } catch { err = { message: await res.text() }; }

                const msg = err?.message || "예약 실패";
                await swalError(
                    msg.includes("예약")
                        ? msg
                        : "예약에 실패했습니다. (이미 예약되었을 수 있어요)\n새로고침 후 다시 시도해주세요.",
                    "예약 실패"
                );

                // 실패 시 최신화
                await loadReservations();
                return;
            }

            Swal.close();
            await Swal.fire({
                icon: "success",
                title: "예약 완료",
                text: "회의실 예약이 완료되었습니다.",
                timer: 1200,
                showConfirmButton: false
            });

            modal.style.display = "none";
            clearSelection();
            await loadReservations();
        };

        // 30초마다 예약만 갱신 (원하면 15~60초로)
        setInterval(() => {
            loadReservations().catch(()=>{});
        }, 30000);

        // 탭 다시 활성화되면 갱신
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) loadReservations().catch(()=>{});
        });

        deleteBtn.onclick = async () => {
            const resvNo = modal.dataset.resvNo;

            const ok = await swalConfirm({
                title: "예약 취소",
                text: "정말 예약을 취소할까요?",
                icon: "warning",
                confirmText: "취소",
                cancelText: "닫기",
                confirmColor: SWAL_RED
            });
            if (!ok) return;

            swalLoading("취소 처리 중...", "잠시만 기다려 주세요.");

            const res = await apiFetch(`/api/v1/meeting-room-reservations/${resvNo}`, { method: "DELETE" });
            if (!res.ok) {
                Swal.close();
                await swalError("취소에 실패했습니다. 잠시 후 다시 시도해주세요.", "취소 실패");
                return;
            }

            Swal.close();
            await Swal.fire({
                icon: "success",
                title: "취소 완료",
                text: "예약이 취소되었습니다.",
                timer: 1000,
                showConfirmButton: false
            });

            modal.style.display = "none";
            await loadReservations();
        };

        /* ===== 직원 검색 ===== */
        let ALL_EMPLOYEES = [];

        function renderEmployeeList(list) {
            const employeeList = document.getElementById("employeeList");
            employeeList.innerHTML = "";
            list.forEach(emp => {
                const opt = document.createElement("option");
                opt.value = emp.empId;
                opt.textContent = `${emp.empName} (${emp.depName})`;
                employeeList.appendChild(opt);
            });
        }

        async function loadEmployees() {
            const res = await apiFetch("/api/v1/employees?size=50&excludeMe=true");
            const json = await res.json();

            const raw = json?.data?.items ?? json?.data?.data ?? json?.data ?? json ?? [];
            const list = Array.isArray(raw) ? raw : (raw?.content ?? raw?.items ?? []);

            ALL_EMPLOYEES = list;
            renderEmployeeList(ALL_EMPLOYEES);
        }

        document.getElementById("employeeSearch").addEventListener("input", e => {
            const keyword = e.target.value.toLowerCase();
            const filtered = ALL_EMPLOYEES.filter(emp => {
                const name = (emp.empName || "").toLowerCase();
                const dep = (emp.depName || "").toLowerCase();
                return name.includes(keyword) || dep.includes(keyword);
            });
            renderEmployeeList(filtered);
        });

        document.getElementById("employeeList").addEventListener("change", e => {
            const empId = e.target.value;
            const empName = e.target.options[e.target.selectedIndex].text;
            if (selectedAttendees.find(a => a.empId === empId)) return;
            selectedAttendees.push({empId, empName});
            renderChips();
        });

        function renderChips() {
            const area = document.getElementById("attendeeChips");
            area.innerHTML = "";
            selectedAttendees.forEach(a => {
                const chip = document.createElement("div");
                chip.className = "chip";
                chip.innerHTML = `${a.empName} <button onclick="removeChip('${a.empId}')">×</button>`;
                area.appendChild(chip);
            });
        }

        function removeChip(empId) {
            selectedAttendees = selectedAttendees.filter(a => a.empId !== empId);
            renderChips();
        }

        window.removeChip = removeChip;

        /* ===== 예약 버튼(상단) ===== */
        document.getElementById("openReserve").onclick = async () => {
            showReserveMode();

            selectedAttendees = [];
            renderChips();
            document.getElementById("purpose").value = "";

            if (dragCells.length === 0) {
                await swalWarn("예약할 시간을 선택하세요.");
                return;
            }

            const row = dragCells[0].closest(".room-row");
            const roomNo = row.dataset.roomNo;
            const roomName = row.querySelector(".room-name").innerText;

            const allCells = [...row.querySelectorAll(".time-cell")];
            const startIdx = allCells.indexOf(dragCells[0]);
            const endIdx = allCells.indexOf(dragCells.at(-1)) + 1;

            const idxToTime = (idx) => {
                const h = START_HOUR + Math.floor(idx / 2);
                const m = idx % 2 === 0 ? "00" : "30";
                return `${String(h).padStart(2, "0")}:${m}`;
            };

            mRoomName.innerText = roomName;
            mDate.innerText = currentDate.format("YYYY-MM-DD");
            mTime.innerText = `${idxToTime(startIdx)} ~ ${idxToTime(endIdx)}`;

            setRoomImageByRoomNo(roomNo);

            await loadEmployees();

            modal.style.display = "flex";
            modal.dataset.roomNo = roomNo;
            modal.dataset.start = idxToTime(startIdx);
            modal.dataset.end = idxToTime(endIdx);
        };

        async function loadMe() {
            const res = await apiFetch("/api/v1/employees/me");
            const json = await res.json();
            return json?.data?.data ?? json?.data ?? json;
        }

        let ME = null;

        async function init() {
            renderDate();
            ME = await loadMe();
            myEmpId = pick(ME, ["empId", "employeeId", "id"], null);

            setReserverToMe();

            await loadRooms();
            await loadEmployees();
            await loadReservations();
        }

        const SWAL_PRIMARY = getComputedStyle(document.documentElement)
            .getPropertyValue("--primary")
            .trim() || "#4f8fe3";

        const SWAL_GRAY = "#9ca3af";
        const SWAL_RED  = "#ff4d4f";

        function swalAlert({ icon="info", title="알림", text="" }) {
            return Swal.fire({
                icon, title, text,
                confirmButtonColor: SWAL_PRIMARY
            });
        }

        function swalSuccess(text, title="완료") {
            return swalAlert({ icon: "success", title, text });
        }

        function swalError(text, title="오류") {
            return swalAlert({ icon: "error", title, text });
        }

        function swalWarn(text, title="확인") {
            return swalAlert({ icon: "warning", title, text });
        }

        function swalInfo(text, title="알림") {
            return swalAlert({ icon: "info", title, text });
        }

        async function swalConfirm({
                                       title="확인",
                                       text="진행할까요?",
                                       icon="question",
                                       confirmText="확인",
                                       cancelText="취소",
                                       confirmColor=SWAL_PRIMARY
                                   }){
            const result = await Swal.fire({
                title, text, icon,
                showCancelButton: true,
                confirmButtonText: confirmText,
                cancelButtonText: cancelText,
                confirmButtonColor: confirmColor,
                cancelButtonColor: SWAL_GRAY,
                reverseButtons: true
            });
            return result.isConfirmed;
        }

        function swalLoading(title="처리 중...", text="잠시만 기다려 주세요.") {
            return Swal.fire({
                title,
                text,
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
        }

        window.addEventListener("DOMContentLoaded", init);
    </script>
</th:block>

</body>
</html>
