<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>법인 차량 등록</title>

    <th:block layout:fragment="pageStyles">
        <style>
            .corpcar-register-page {
                padding: 24px 0;
                display: flex;
                justify-content: center;
                background: #f4f6f8;
                min-height: 100%;
            }

            .corpcar-register-page .card {
                width: 520px;
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
                padding: 28px;
            }

            .corpcar-register-page h2 {
                margin-top: 0;
                text-align: center;
            }

            .corpcar-register-page .form-inner {
                max-width: 420px;
                margin: 0 auto;
            }

            .corpcar-register-page .field {
                margin-bottom: 14px;
            }

            .corpcar-register-page label {
                display: block;
                font-size: 13px;
                margin-bottom: 6px;
                color: #555;
            }

            .corpcar-register-page input,
            .corpcar-register-page textarea {
                width: 100%;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #ddd;
                font-size: 14px;
                box-sizing: border-box;
            }

            .corpcar-register-page textarea {
                resize: none;
            }

            .corpcar-register-page .preview-box {
                width: 100%;
                height: 220px;
                background: #e5e7eb;
                border-radius: 12px;
                overflow: hidden;
                margin-top: 10px;
            }

            .corpcar-register-page .preview-box img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: none;
            }

            .corpcar-register-page .btns {
                display: flex;
                gap: 10px;
                margin-top: 18px;
            }

            .corpcar-register-page .btns button {
                flex: 1;
                padding: 10px;
                border-radius: 8px;
                border: none;
                font-size: 14px;
                cursor: pointer;
            }

            .corpcar-register-page .btns .submit {
                background: #1677ff;
                color: #fff;
            }

            .corpcar-register-page .btns .cancel {
                background: #e5e7eb;
            }

            /* ===== hints / validation UI ===== */
            .hint-row{
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-top:6px;
                gap:10px;
            }

            .hint{
                color:#6b7280;
                font-size:12px;
            }

            .counter{
                color:#6b7280;
                font-size:12px;
                font-variant-numeric: tabular-nums;
            }

            .error{
                display:block;
                margin-top:6px;
                color:#ef4444;
                font-size:12px;
                font-weight:600;
            }

            .input-invalid{
                border-color:#ef4444 !important;
                box-shadow: 0 0 0 3px rgba(239,68,68,.12);
            }

            /* ✅ SweetAlert가 다른 레이어보다 위에 뜨도록 */
            .swal2-container{
                z-index: 3000000 !important;
            }

            /* (선택) 버튼 톤 통일: var(--primary) 사용 */
            .corpcar-register-page .btns .submit{
                background: var(--primary);
                color:#fff;
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('car')"></aside>

        <div class="corpcar-register-page">
            <div class="card">
                <h2>법인 차량 등록</h2>

                <form id="carForm" enctype="multipart/form-data" class="form-inner">

                    <!-- 차량명 -->
                    <div class="field">
                        <label>차량명</label>
                        <input type="text" name="carName" id="carName" maxlength="20" required>
                        <div class="hint-row">
                            <small class="hint">최대 20자까지 입력 가능</small>
                            <small class="counter" id="nameCounter">0 / 20</small>
                        </div>
                        <small class="error" id="nameError" style="display:none;"></small>
                    </div>

                    <!-- 차량번호(번호판) -->
                    <div class="field">
                        <label>차량번호(번호판)</label>
                        <input
                                type="text"
                                name="plateNo"
                                id="plateNo"
                                maxlength="8"
                                required
                                placeholder="예) 12가3456 / 123가4567"
                        >
                        <div class="hint-row">
                            <small class="hint">형식: 숫자 2~3자리 + 한글 1자 + 숫자 4자리 (예: 12가3456)</small>
                            <small class="counter" id="plateCounter">0 / 8</small>
                        </div>
                        <small class="error" id="plateError" style="display:none;"></small>
                    </div>

                    <!-- 수용인원 -->
                    <div class="field">
                        <label>수용 인원</label>
                        <input type="number" name="capacity" id="capacity" min="1" max="8" required>
                        <div class="hint-row">
                            <small class="hint">1~8명 입력 가능</small>
                        </div>
                        <small class="error" id="capError" style="display:none;"></small>
                    </div>

                    <div class="field">
                        <label>차종</label>
                        <input type="text" name="carType" maxlength="20">
                    </div>

                    <div class="field">
                        <label>연료</label>
                        <input type="text" name="fuel" maxlength="10">
                    </div>

                    <div class="field">
                        <label>법인 차량 이미지</label>
                        <input
                                type="file"
                                name="imageFile"
                                id="imageFile"
                                accept="image/*"
                                onchange="previewImage(this)"
                        >
                    </div>

                    <div class="preview-box">
                        <img id="imagePreview" alt="미리보기 이미지"/>
                    </div>

                    <div class="btns">
                        <button type="submit" class="submit">등록</button>
                        <button type="button" class="cancel" onclick="history.back()">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>

<th:block layout:fragment="pageScripts">
    <!-- ✅ SweetAlert2 추가 (회의실 등록과 동일) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        /* =========================
           SweetAlert2 helpers (회의실 등록과 동일 톤)
           ========================= */
        const SWAL_PRIMARY = getComputedStyle(document.documentElement)
            .getPropertyValue("--primary")
            .trim() || "#4f8fe3";

        const SWAL_GRAY = "#9ca3af";
        const SWAL_RED  = "#ff4d4f";

        function swalAlert({ icon="info", title="알림", text="" }) {
            return Swal.fire({
                icon, title, text,
                confirmButtonColor: SWAL_PRIMARY
            });
        }

        function swalSuccess(text, title="완료") {
            return swalAlert({ icon: "success", title, text });
        }

        function swalError(text, title="오류") {
            return swalAlert({ icon: "error", title, text });
        }

        function swalWarn(text, title="확인") {
            return swalAlert({ icon: "warning", title, text });
        }

        function swalInfo(text, title="알림") {
            return swalAlert({ icon: "info", title, text });
        }

        async function swalConfirm({
                                       title="확인",
                                       text="진행할까요?",
                                       icon="question",
                                       confirmText="확인",
                                       cancelText="취소",
                                       confirmColor=SWAL_PRIMARY
                                   }){
            const result = await Swal.fire({
                title, text, icon,
                showCancelButton: true,
                confirmButtonText: confirmText,
                cancelButtonText: cancelText,
                confirmButtonColor: confirmColor,
                cancelButtonColor: SWAL_GRAY,
                reverseButtons: true
            });
            return result.isConfirmed;
        }

        function swalLoading(title="처리 중...", text="잠시만 기다려 주세요.") {
            return Swal.fire({
                title,
                text,
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
        }

        /* =========================
           apiFetch (alert -> SweetAlert)
           ========================= */
        async function apiFetch(path, options = {}) {
            const res = await fetch(path, {
                ...options,
                credentials: "include",
                headers: {...(options.headers || {})},
            });

            if (res.status === 401 || res.status === 403) {
                await swalWarn("로그인이 만료되었습니다. 다시 로그인해주세요.", "로그인 필요");
                location.href = "/auth/employee/login";
                throw new Error("UNAUTHORIZED");
            }
            return res;
        }

        /* ---------- image preview (alert -> SweetAlert) ---------- */
        function previewImage(input) {
            const preview = document.getElementById("imagePreview");

            if (!input.files || !input.files[0]) {
                preview.style.display = "none";
                preview.src = "";
                return;
            }

            const file = input.files[0];

            if (!file.type.startsWith("image/")) {
                swalWarn("이미지 파일만 업로드 가능합니다.");
                input.value = "";
                preview.style.display = "none";
                preview.src = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        }

        /* ===== inline validation UI ===== */
        const carNameInput = document.getElementById("carName");
        const nameCounter = document.getElementById("nameCounter");
        const nameError = document.getElementById("nameError");

        const plateInput = document.getElementById("plateNo");
        const plateCounter = document.getElementById("plateCounter");
        const plateError = document.getElementById("plateError");

        const capInput = document.getElementById("capacity");
        const capError = document.getElementById("capError");

        function setError(inputEl, errorEl, msg) {
            if (!errorEl) return;

            if (msg) {
                errorEl.textContent = msg;
                errorEl.style.display = "block";
                inputEl?.classList.add("input-invalid");
            } else {
                errorEl.textContent = "";
                errorEl.style.display = "none";
                inputEl?.classList.remove("input-invalid");
            }
        }

        function updateNameUI() {
            if (!carNameInput) return;

            const len = carNameInput.value.length;
            if (nameCounter) nameCounter.textContent = `${len} / 20`;

            if (!carNameInput.value.trim()) {
                setError(carNameInput, nameError, "");
                return;
            }

            if (len > 20) setError(carNameInput, nameError, "차량명은 20자 이내여야 합니다.");
            else setError(carNameInput, nameError, "");
        }

        /* ===== 번호판: IME 안전 + 형식 강제 ===== */
        const PLATE_REGEX = /^\d{2,3}[가-힣]\d{4}$/;

        function formatPlate(raw) {
            if (!raw) return "";

            // 공백/하이픈 제거 + 숫자/한글만
            const cleaned = raw.replace(/[\s-]/g, "").replace(/[^0-9가-힣]/g, "");

            let front = "";
            let mid = "";
            let back = "";

            for (const ch of cleaned) {
                const isDigit = ch >= "0" && ch <= "9";
                const isHangul = /[가-힣]/.test(ch);

                // 앞 숫자(2~3자리)
                if (!mid) {
                    if (isDigit) {
                        if (front.length < 3) front += ch;
                        continue;
                    }
                    if (isHangul) {
                        // 앞 숫자 2자리 이상일 때만 한글 1자 허용
                        if (front.length >= 2) mid = ch;
                        continue;
                    }
                    continue;
                }

                // 뒤 숫자(4자리)
                if (isDigit && back.length < 4) back += ch;
            }

            return (front + mid + back).slice(0, 8);
        }

        function splitPlate(v) {
            const m = (v || "").match(/^(\d{0,3})([가-힣]?)(\d{0,4})$/);
            return { front: m?.[1] ?? "", mid: m?.[2] ?? "", back: m?.[3] ?? "" };
        }

        let plateIsComposing = false;

        plateInput?.addEventListener("compositionstart", () => {
            plateIsComposing = true;
        });

        plateInput?.addEventListener("compositionend", () => {
            plateIsComposing = false;

            const after = formatPlate(plateInput.value);
            if (plateInput.value !== after) plateInput.value = after;

            updatePlateUI();
        });

        plateInput?.addEventListener("input", (e) => {
            // ✅ 조합 중엔 value 수정 금지(맨 뒷자리 숫자 사라지는 현상 방지)
            if (plateIsComposing || e.isComposing) return;

            const after = formatPlate(plateInput.value);
            if (plateInput.value !== after) plateInput.value = after;

            updatePlateUI();
        });

        function updatePlateUI() {
            if (!plateInput) return;

            const v = plateInput.value;
            if (plateCounter) plateCounter.textContent = `${v.length} / 8`;

            if (!v.trim()) {
                setError(plateInput, plateError, "");
                return;
            }

            if (PLATE_REGEX.test(v)) {
                setError(plateInput, plateError, "");
                return;
            }

            // 입력 중 단계별 안내
            const p = splitPlate(v);
            if (p.front.length < 2) {
                setError(plateInput, plateError, "앞 숫자 2~3자리를 먼저 입력해주세요. 예) 12가3456");
                return;
            }
            if (!p.mid) {
                setError(plateInput, plateError, "숫자 뒤에 한글 1자를 입력해주세요. 예) 12가3456");
                return;
            }
            if (p.back.length < 4) {
                setError(plateInput, plateError, "마지막 숫자 4자리를 입력해주세요. 예) 12가3456");
                return;
            }

            setError(plateInput, plateError, "번호판 형식이 올바르지 않습니다. 예) 12가3456 / 123가4567");
        }

        function updateCapUI() {
            if (!capInput) return;

            const v = capInput.value;

            if (v === "") {
                setError(capInput, capError, "");
                return;
            }

            const n = Number(v);
            if (Number.isNaN(n)) {
                setError(capInput, capError, "숫자만 입력해주세요.");
                return;
            }

            if (n < 1 || n > 8) {
                setError(capInput, capError, "수용 인원은 1~8명 사이여야 합니다.");
                return;
            }

            setError(capInput, capError, "");
        }

        carNameInput?.addEventListener("input", updateNameUI);

        capInput?.addEventListener("input", () => {
            let value = capInput.value;

            if (value === "") {
                updateCapUI();
                return;
            }

            const num = Number(value);

            if (Number.isNaN(num)) {
                capInput.value = "";
                updateCapUI();
                return;
            }

            if (num < 1) capInput.value = 1;
            if (num > 8) capInput.value = 8;

            updateCapUI();
        });

        // 초기 표시
        updateNameUI();
        updatePlateUI();
        updateCapUI();

        /* ---------- submit (alert -> SweetAlert + 로딩/성공/실패) ---------- */
        async function submitCorporateCarForm(e) {
            e.preventDefault();

            const name = document.querySelector("[name=carName]").value.trim();
            const plate = document.querySelector("[name=plateNo]").value.trim();
            const capacity = Number(document.querySelector("[name=capacity]").value);

            updateNameUI();
            updatePlateUI();
            updateCapUI();

            if (!name) {
                setError(carNameInput, nameError, "차량명을 입력해주세요.");
                carNameInput.focus();
                return;
            }
            if (name.length > 20) {
                setError(carNameInput, nameError, "차량명은 20자 이내여야 합니다.");
                carNameInput.focus();
                return;
            }

            if (!plate) {
                setError(plateInput, plateError, "차량번호(번호판)를 입력해주세요.");
                plateInput.focus();
                return;
            }

            // ✅ 최종 형식 검증
            if (!PLATE_REGEX.test(plate)) {
                setError(plateInput, plateError, "번호판 형식이 올바르지 않습니다. 예) 12가3456 / 123가4567");
                plateInput.focus();
                return;
            }

            if (!capacity || capacity < 1 || capacity > 8) {
                setError(capInput, capError, "수용 인원은 1~8명 사이여야 합니다.");
                capInput.focus();
                return;
            }

            const form = document.getElementById("carForm");
            const formData = new FormData(form);

            try {
                // ✅ 로딩 표시
                swalLoading("등록 중...", "법인 차량을 등록하고 있어요.");

                const res = await apiFetch("/api/v1/corporate-cars", {
                    method: "POST",
                    body: formData
                });

                let result = null;
                try { result = await res.json(); } catch { result = { message: await res.text() }; }

                if (!res.ok) {
                    Swal.close();
                    console.error(result);
                    await swalError(result?.message || "등록에 실패했습니다.", "등록 실패");
                    return;
                }

                Swal.close();
                await Swal.fire({
                    icon: "success",
                    title: "등록 완료",
                    text: "법인 차량 등록이 완료되었습니다.",
                    timer: 1200,
                    showConfirmButton: false,
                    confirmButtonColor: SWAL_PRIMARY
                });

                location.href = "/corporate-cars";

            } catch (err) {
                Swal.close();
                if (err.message !== "UNAUTHORIZED") {
                    console.error(err);
                    await swalError("서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.", "오류");
                }
            }
        }

        document
            .getElementById("carForm")
            .addEventListener("submit", submitCorporateCarForm);
    </script>
</th:block>

</body>
</html>
