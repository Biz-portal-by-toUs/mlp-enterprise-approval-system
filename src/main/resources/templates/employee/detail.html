<!-- templates/employee/detail.html -->
<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>사원 상세 조회</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* ===== Layout / Container ===== */
            .detail-wrap{
                width:100%;
                max-width: 1220px;            /* ✅ 더 넓게 */
                margin: 0 auto;               /* ✅ 중앙 */
                padding: 6px 26px 24px;
            }

            .card{
                background: var(--white);
                border:1px solid var(--line);
                border-radius:18px;
                box-shadow: var(--shadow2);
                padding:22px;
            }

            /* ===== Top header inside card ===== */
            .card-head{
                display:flex;
                align-items:flex-start;
                justify-content:space-between;
                gap:14px;
                margin-bottom:16px;
            }
            .head-left{
                display:flex;
                flex-direction:column;
                gap:6px;
                min-width:0;
            }
            .head-title{
                font-size:18px;
                font-weight:950;
                letter-spacing:-.2px;
                color:#111827;
                white-space:nowrap;
                overflow:hidden;
                text-overflow:ellipsis;
            }
            .head-sub{
                display:flex;
                align-items:center;
                gap:10px;
                color:var(--muted);
                font-weight:800;
                font-size:13px;
            }

            /* ===== Actions (top-right) ===== */
            .head-actions{
                display:flex;
                gap:10px;
                flex-wrap:wrap;
                justify-content:flex-end;
            }
            .btn{
                height:36px;
                min-width:96px;
                padding:0 12px;
                border:0;
                border-radius:10px;
                font-weight:900;
                cursor:pointer;
            }
            /* 수정 버튼(연한 하늘 + 파란 글자) */
            .btn.primary{
                background: rgba(59,130,246,.10);
                color: var(--primary2);
                box-shadow: none;
            }
            .btn.primary:hover{
                filter: none;
                transform: translateY(-1px);
            }
            .btn.danger{
                background: rgba(198,40,40,.10);
                color:#c62828;
            }

            /* ===== Body Grid ===== */
            .detail-grid{
                display:grid;
                grid-template-columns: 240px 1fr; /* ✅ 더 컴팩트하게 */
                gap:22px;
                align-items:start;
            }

            /* Photo */
            .photo-box{
                width:100%;
                height:240px;
                border-radius:16px;
                background:#f3f4f6;
                border:1px solid rgba(17,24,39,.08);
                display:grid;
                place-items:center;
                overflow:hidden;
                position:relative;
            }
            .photo-box img{ width:100%; height:100%; object-fit:cover; display:none; }
            .photo-placeholder{
                position:absolute; inset:0;
                display:grid; place-items:center;
                font-weight:900; color:#9ca3af;
            }

            /* Right content sections (2-column on wide screens) */
            .right{
                min-width:0;
            }
            .blocks{
                display:grid;
                grid-template-columns: 1fr 1fr;   /* ✅ 화면 꽉 차게 쓰기 */
                gap:14px;
            }
            .block{
                border:1px solid rgba(17,24,39,.08);
                border-radius:16px;
                background:#fff;
                padding:16px;
            }
            .block-title{
                font-weight:950;
                font-size:13px;
                color:#111827;
                margin:0 0 12px;
                display:flex;
                align-items:center;
                gap:10px;
            }

            .kv{
                display:grid;
                grid-template-columns: 140px 1fr;
                row-gap:10px;
                column-gap:14px;
            }
            .k{ color:#111827; font-weight:900; font-size:13px; }
            .v{ color:#334155; font-weight:850; font-size:13px; }
            .v.muted{ color:var(--muted); }

            /* pill */
            .pill{
                display:inline-flex;
                align-items:center;
                justify-content:center;
                padding:6px 10px;
                border-radius:999px;
                font-size:12px;
                font-weight:900;
                border:1px solid rgba(17,24,39,.08);
                background:#fff;
                color:#111;
            }
            .pill.ok{ background:#eafbf0; border-color:#bfe7c9; color:#0f6b2f; }
            .pill.danger{ background:#fdecec; border-color:#ffd0cc; color:#b42318; }

            /* Footer actions (optional) */
            .actions-bottom{
                display:flex;
                justify-content:flex-end;
                gap:10px;
                margin-top:16px;
            }

            /* toast */
            .toast{
                position:fixed;
                left:50%;
                bottom:22px;
                transform:translateX(-50%);
                background:#111;
                color:#fff;
                padding:12px 14px;
                border-radius:12px;
                font-weight:900;
                font-size:14px;
                box-shadow:0 14px 28px rgba(0,0,0,.18);
                opacity:0;
                pointer-events:none;
                transition:opacity .18s ease, transform .18s ease;
                z-index:9999;
            }
            .toast.show{ opacity:1; transform:translateX(-50%) translateY(-2px); }
            .toast.ok{ background:#0f6b2f; }
            .toast.err{ background:#c62828; }

            @media (max-width: 1100px){
                .blocks{ grid-template-columns:1fr; }
            }
            @media (max-width: 980px){
                .detail-wrap{ padding: 6px 16px 24px; }
                .detail-grid{ grid-template-columns:1fr; }
                .photo-box{ height:200px; }
                .card-head{ flex-direction:column; align-items:stretch; }
                .head-actions{ justify-content:flex-start; }
                .actions-bottom{ justify-content:flex-start; }
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <section class="page-with-subbar">
        <aside th:replace="~{sidebar/admin-sidebar :: adminSidebar('emp')}"></aside>

        <!-- ✅ 중앙 + 넓게 -->
        <div class="detail-wrap">

            <section class="card">

                <!-- ✅ 상단: 사원관리 글자 대신, 현재 사원 이름/사번만 간단히 -->
                <div class="card-head">
                    <div class="head-left">
                        <div class="head-title" id="headName">사원 상세</div>
                        <div class="head-sub">
                            <span id="headEmpId">-</span>
                            <span id="headStatus"></span>
                        </div>
                    </div>

                    <div class="head-actions">
                        <button class="btn primary" type="button" onclick="goEdit()">수정</button>
                        <button class="btn danger" type="button" onclick="retireEmployee()">퇴사</button>
                    </div>
                </div>

                <div class="detail-grid">
                    <!-- Photo -->
                    <div>
                        <div class="photo-box">
                            <img id="empPhoto" alt="사원 사진"/>
                            <div class="photo-placeholder" id="photoPlaceholder">사진</div>
                        </div>
                    </div>

                    <!-- Details -->
                    <div class="right">
                        <div class="blocks">

                            <section class="block">
                                <div class="block-title">기본 정보</div>
                                <div class="kv">
                                    <div class="k">이름</div><div class="v" id="empName">-</div>
                                    <div class="k">사번</div><div class="v" id="empId">-</div>
                                    <div class="k">성별</div><div class="v" id="gen">-</div>
                                    <div class="k">권한(Role)</div><div class="v" id="role">-</div>
                                    <div class="k">생년월일</div><div class="v" id="birth">-</div>
                                    <div class="k">나이</div><div class="v" id="age">-</div>
                                </div>
                            </section>

                            <section class="block">
                                <div class="block-title">조직 정보</div>
                                <div class="kv">
                                    <div class="k">회사</div><div class="v" id="company">-</div>
                                    <div class="k">회사코드</div><div class="v muted" id="comId">-</div>
                                    <div class="k">부서</div><div class="v" id="department">-</div>
                                    <div class="k">직급</div><div class="v" id="position">-</div>
                                </div>
                            </section>

                            <section class="block">
                                <div class="block-title">연락처</div>
                                <div class="kv">
                                    <div class="k">이메일</div><div class="v" id="email">-</div>
                                    <div class="k">전화번호</div><div class="v" id="phone">-</div>
                                    <div class="k">사내번호</div><div class="v" id="workPhone">-</div>
                                    <div class="k">주소</div><div class="v" id="addr">-</div>
                                </div>
                            </section>

                            <section class="block">
                                <div class="block-title">상태</div>
                                <div class="kv">
                                    <div class="k">입사일</div><div class="v" id="hireDate">-</div>
                                    <div class="k">퇴사일</div><div class="v" id="retDate">-</div>
                                    <div class="k">재직 상태</div><div class="v" id="employmentStatus">-</div>
                                    <div class="k">근태</div><div class="v" id="atte">-</div>
                                    <div class="k">메신저 상태</div><div class="v" id="msgStat">-</div>
                                </div>
                            </section>

                            <section class="block">
                                <div class="block-title">대직자</div>
                                <div class="kv">
                                    <div class="k">대직자 사번</div><div class="v" id="delegateEmpId">-</div>
                                    <div class="k">대직자 이름</div><div class="v" id="delegateName">-</div>
                                </div>
                            </section>

                            <section class="block">
                                <div class="block-title">시스템 정보</div>
                                <div class="kv">
                                    <div class="k">empNo</div><div class="v muted" id="empNo">-</div>
                                    <div class="k">createdAt</div><div class="v muted" id="createdAt">-</div>
                                    <div class="k">updatedAt</div><div class="v muted" id="updatedAt">-</div>
                                </div>
                            </section>

                        </div>

                        <!-- (원하면 유지) 하단 버튼도 필요하면 살려둬 -->
                        <!--
                        <div class="actions-bottom">
                            <button class="btn primary" type="button" onclick="goEdit()">수정</button>
                            <button class="btn danger" type="button" onclick="retireEmployee()">퇴사</button>
                        </div>
                        -->
                    </div>
                </div>
            </section>

        </div>
    </section>

    <div id="toast" class="toast" aria-live="polite"></div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:inline="javascript">
        const EMP_NO = /*[[${empNo}]]*/ 0;

        const API_DETAIL = `/api/v1/admin/employees/${EMP_NO}`;
        const API_ATTACH_LIST = (empNo) => `/api/v1/attachments?domain=EMPLOYEE&entityId=${empNo}`;
        const API_PREVIEW_URL = (attachmentId) => `/api/v1/attachments/${attachmentId}/preview-url`;

        let toastTimer = null;
        function showToast(type, text){
            const el = document.getElementById("toast");
            el.className = "toast " + (type === "ok" ? "ok" : "err");
            el.textContent = text;
            el.classList.add("show");
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(()=> el.classList.remove("show"), 1800);
        }

        function fmtDate(v){
            if(!v) return "-";
            const s = String(v);
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
            return s.slice(0, 10);
        }
        function fmtDateTime(v){
            if(!v) return "-";
            return String(v).replace("T", " ").slice(0, 19);
        }
        function safe(v){ return (v === null || v === undefined || v === "") ? "-" : String(v); }

        function mapGen(v){
            if(!v) return "-";
            const s = String(v).toUpperCase();
            if(s === "M") return "남";
            if(s === "F") return "여";
            return v;
        }
        function mapAtte(v){
            if(!v) return "-";
            const s = String(v).toUpperCase();
            if(s === "B") return "출장";
            if(s === "V") return "휴가";
            if(s === "C") return "출근";
            return v;
        }
        function mapMsgStat(v){
            if(!v) return "-";
            const s = String(v).toUpperCase();
            if(s === "C") return "근무 중";
            if(s === "M") return "회의 중";
            if(s === "D") return "업무 집중";
            if(s === "X") return "자리 비움";
            if(s === "H") return "출근 안함";
            return v;
        }

        function setText(id, v){
            const el = document.getElementById(id);
            if(!el) return;
            el.textContent = safe(v);
        }

        function setEmploymentStatus(isDeleted){
            const el = document.getElementById("employmentStatus");
            el.innerHTML = "";
            const pill = document.createElement("span");
            pill.className = "pill " + (isDeleted ? "danger" : "ok");
            pill.textContent = isDeleted ? "퇴사" : "재직";
            el.appendChild(pill);

            // ✅ 상단 헤더에도 표시
            const head = document.getElementById("headStatus");
            if(head){
                head.innerHTML = "";
                const p2 = pill.cloneNode(true);
                head.appendChild(p2);
            }
        }

        function unwrap(maybe){
            if(maybe && typeof maybe === "object" && "data" in maybe) return maybe.data;
            return maybe;
        }

        function extractUrl(raw){
            const unwrapped = unwrap(raw);
            if(!unwrapped) return null;
            if(typeof unwrapped === "object"){
                if (unwrapped.url) return unwrapped.url;
                if (unwrapped.previewUrl) return unwrapped.previewUrl;
                if (unwrapped.presignedUrl) return unwrapped.presignedUrl;
                if (unwrapped.data && typeof unwrapped.data === "object"){
                    if (unwrapped.data.url) return unwrapped.data.url;
                    if (unwrapped.data.previewUrl) return unwrapped.data.previewUrl;
                    if (unwrapped.data.presignedUrl) return unwrapped.data.presignedUrl;
                }
            }
            return null;
        }

        async function loadPhoto(){
            const img = document.getElementById("empPhoto");
            const ph  = document.getElementById("photoPlaceholder");

            img.style.display = "none";
            img.removeAttribute("src");
            ph.style.display = "grid";
            ph.textContent = "사진";

            try{
                const listRes = await fetch(API_ATTACH_LIST(EMP_NO), {
                    method:"GET",
                    credentials:"include",
                    headers:{ "Accept":"application/json" }
                });
                if(!listRes.ok) return;

                const listRaw = await listRes.json();
                const listJson = unwrap(listRaw);
                const items = Array.isArray(listJson) ? listJson : [];

                const photoItem =
                    items.find(x => String(x.fileType || "").toUpperCase() === "IMAGE") ||
                    items.find(x => String(x.contentType || "").startsWith("image/")) ||
                    items[0];

                if(!photoItem || !photoItem.attachmentId){
                    ph.textContent = "사진 없음";
                    return;
                }

                const prevRes = await fetch(API_PREVIEW_URL(photoItem.attachmentId), {
                    method:"GET",
                    credentials:"include",
                    headers:{ "Accept":"application/json" }
                });
                if(!prevRes.ok){ ph.textContent = "사진 불러오기 실패"; return; }

                const prevRaw = await prevRes.json();
                const url = extractUrl(prevRaw);
                if(!url){ ph.textContent = "사진 URL 없음"; return; }

                img.onload = () => { img.style.display = "block"; ph.style.display = "none"; };
                img.onerror = () => { img.style.display = "none"; ph.style.display = "grid"; ph.textContent = "사진 로드 실패"; };

                img.crossOrigin = "anonymous";
                img.referrerPolicy = "no-referrer";
                img.src = url;

            }catch(e){
                console.error(e);
                ph.textContent = "사진 로드 실패";
            }
        }

        async function loadDetail(){
            if(!EMP_NO){
                showToast("err", "empNo가 없습니다.");
                return;
            }

            const res = await fetch(API_DETAIL, {
                method: "GET",
                credentials: "include",
                headers: { "Accept":"application/json" }
            });

            if(res.status === 401){ showToast("err", "인증이 필요합니다. 다시 로그인해주세요."); return; }
            if(res.status === 403){ showToast("err", "권한이 없습니다. (COM_ADMIN)"); return; }
            if(!res.ok){ showToast("err", `상세 조회 실패 (HTTP ${res.status})`); return; }

            const json = await res.json();
            const d = unwrap(json);

            setText("empNo", d.empNo);
            setText("empId", d.empId);
            setText("empName", d.empName);
            setText("gen", mapGen(d.gen));
            setText("role", d.role);

            setText("birth", fmtDate(d.birth));
            setText("age", (d.age === null || d.age === undefined || d.age === 0) ? "-" : `${d.age}세`);

            setText("comId", d.comId);
            setText("company", `${safe(d.comName)} (${safe(d.comId)})`);

            setText("department", safe(d.depName));
            setText("position", safe(d.posName));

            setText("email", d.email);
            setText("phone", d.phone);
            setText("workPhone", d.workPhone);
            setText("addr", d.addr);

            setText("hireDate", fmtDate(d.hireDate));
            setText("retDate", fmtDate(d.retDate));

            setEmploymentStatus(d.isDeleted);

            setText("atte", mapAtte(d.atte));
            setText("msgStat", mapMsgStat(d.msgStat));

            setText("delegateEmpId", d.delegateEmpId);
            setText("delegateName", d.delegateName);

            setText("createdAt", fmtDateTime(d.createdAt));
            setText("updatedAt", fmtDateTime(d.updatedAt));

            // ✅ 상단 헤더에 이름/사번도 표시
            const hn = document.getElementById("headName");
            const hi = document.getElementById("headEmpId");
            if(hn) hn.textContent = `${safe(d.empName)} 님`;
            if(hi) hi.textContent = safe(d.empId);

            loadPhoto().catch(console.error);
        }

        function goEdit(){
            location.href = `/admin/employees/${EMP_NO}/edit`;
        }

        async function retireEmployee(){
            const ok = confirm("해당 사원을 퇴사 처리할까요?");
            if(!ok) return;

            try{
                const res = await fetch(`/api/v1/admin/employees/${EMP_NO}/retire`, {
                    method: "PATCH",
                    credentials: "include",
                    headers: {"Accept":"application/json"}
                });
                if(res.ok){
                    showToast("ok", "퇴사 처리되었습니다.");
                    await loadDetail();
                    return;
                }
                showToast("err", `퇴사 처리 실패 (HTTP ${res.status})`);
            }catch(e){
                console.error(e);
                showToast("err", "퇴사 처리 중 오류");
            }
        }

        loadDetail().catch(e=>{
            console.error(e);
            showToast("err", "상세 조회 중 예외 발생");
        });
    </script>
</th:block>
</body>
</html>
