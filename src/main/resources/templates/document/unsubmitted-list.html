<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>임시저장 문서 목록 - 기업용 전자결재시스템</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* [페이지 헤더] */
            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                margin-bottom: 25px;
                border-bottom: 2px solid #339af0;
                padding-bottom: 15px;
            }
            .page-title { font-size: 24px; font-weight: bold; color: #333; margin: 0; }
            .doc-count { font-size: 14px; color: #666; }

            /* [테이블 디자인] */
            .doc-table { width: 100%; border-collapse: collapse; table-layout: auto; }
            .doc-table th { background-color: #f8f9fa; color: #495057; font-size: 14px; padding: 15px 12px; border-bottom: 1px solid #dee2e6; white-space: nowrap; }
            .doc-table td { padding: 15px 12px; text-align: center; border-bottom: 1px solid #eee; font-size: 14px; color: #333; vertical-align: middle; line-height: 1.4; }

            /* 제목 셀 스타일 */
            .title-cell {
                text-align: left !important;
                padding-left: 20px !important;
                cursor: pointer;
                font-weight: 500;
                word-break: break-all;
                transition: color 0.2s;
            }
            .title-cell:hover { color: #339af0; text-decoration: underline; }

            /* ✅ 레이아웃 충돌 방지를 위해 doc-badge 클래스 사용 */
            .doc-table .doc-badge { display: inline-block !important; padding: 4px 10px !important; border-radius: 4px !important; font-size: 12px !important; font-weight: bold !important; position: static !important; width: auto !important; border: none !important; }
            .doc-table .doc-badge-US { background: #f1f3f5 !important; color: #495057 !important; }

            /* [페이지네이션 - 개선형] */
            .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 40px; }
            .page-btn-nav { padding: 6px 18px; border: 1px solid #dee2e6; border-radius: 20px; background: #fff; cursor: pointer; font-size: 13px; transition: all 0.2s; }
            .page-btn-nav:disabled { background: #f1f3f5 !important; color: #adb5bd !important; cursor: not-allowed !important; border-color: #e9ecef !important; }
            .page-btn-num { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; border: 1px solid #dee2e6; border-radius: 50%; background: #fff; cursor: pointer; font-size: 13px; text-decoration: none; color: inherit; }
            .page-btn-num.active { background-color: #339af0; color: #fff; border-color: #339af0; font-weight: bold; }

            /* 로딩/공백 상태 */
            .empty-msg { padding: 80px 0; color: #adb5bd; font-size: 15px; }
            .page-with-subbar > div:last-child { background: #fff; padding: 22px 26px; }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <section class="page-with-subbar">
        <aside th:replace="~{sidebar/document-sidebar :: documentSidebar('unsubmitted')}"></aside>

        <div>
            <div class="page-header">
                <h1 class="page-title">임시저장 문서함</h1>
                <div class="doc-count" id="total-count">조회된 문서: 0건</div>
            </div>

            <table class="doc-table">
                <thead>
                <tr>
                    <th style="width: 60px;">NO</th>
                    <th style="width: 150px;">카테고리</th>
                    <th>제목</th>
                    <th style="width: 150px;">작성자</th>
                    <th style="width: 100px;">상태</th>
                    <th style="width: 180px;">마지막 저장일</th>
                </tr>
                </thead>
                <tbody id="document-list">
                <tr><td colspan="6" class="empty-msg">데이터를 불러오는 중입니다...</td></tr>
                </tbody>
            </table>

            <div id="pagination-nav" class="pagination"></div>
        </div>
    </section>
</div>

<th:block layout:fragment="pageScripts">
    <script th:inline="javascript">
        const API_URL = '/api/v1/documents/me?status=UNSUBMITTED';
        let currentPage = 0;

        document.addEventListener('DOMContentLoaded', () => {
            loadData(0);
        });

        async function loadData(page) {
            currentPage = page;
            try {
                const response = await fetch(`${API_URL}&page=${page}`, {
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();

                if (result.status === 200) {
                    document.getElementById('total-count').textContent = `조회된 문서: ${result.data.totalElements}건`;
                    renderTable(result.data.content, page, result.data.size);
                    renderPagination(result.data.totalPages, page);
                }
            } catch (error) {
                console.error('조회 실패:', error);
                document.getElementById('document-list').innerHTML = '<tr><td colspan="6" class="empty-msg" style="color:#fa5252;">데이터 로드 중 오류가 발생했습니다.</td></tr>';
            }
        }

        function renderTable(docs, page, size) {
            const tbody = document.getElementById('document-list');
            tbody.innerHTML = '';

            if (!docs || docs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">임시저장된 문서가 없습니다.</td></tr>';
                return;
            }

            docs.forEach((doc, index) => {
                const no = (page * size) + index + 1;
                const tr = document.createElement('tr');
                const editUrl = `/documents/${doc.docNo}?status=UNSUBMITTED`;

                tr.innerHTML = `
                    <td>${no}</td>
                    <td>${doc.docFormCatName || '-'}</td>
                    <td class="title-cell" onclick="location.href='${editUrl}'">${doc.title || '(제목 없음)'}</td>
                    <td>${doc.writer}<br><small style="color:#868e96;">${doc.writerId}</small></td>
                    <td><span class="doc-badge doc-badge-US">임시저장</span></td>
                    <td>${formatDate(doc.updatedAt)}</td>
                `;
                tbody.appendChild(tr);
            });

            // 10줄 고정 디자인 유지
            for (let i = docs.length; i < 10; i++) {
                tbody.innerHTML += '<tr style="height: 57px;"><td colspan="6"></td></tr>';
            }
        }

        /**
         * ✅ [개선된 페이지네이션] 슬라이딩 윈도우 방식 반영
         */
        function renderPagination(totalPages, currentPage) {
            const nav = document.getElementById('pagination-nav');
            if (!nav || totalPages <= 1) { if(nav) nav.innerHTML = ''; return; }
            nav.innerHTML = '';

            const addBtn = (idx, text, className = '', disabled = false) => {
                const btn = document.createElement('button');
                btn.className = className;
                btn.innerText = text;
                btn.disabled = disabled;
                if (!disabled) btn.onclick = () => loadData(idx);
                nav.appendChild(btn);
            };

            // [이전] 버튼
            addBtn(currentPage - 1, '이전', 'page-btn-nav', currentPage === 0);

            const range = 2; // 현재 페이지 앞뒤 표시 범위
            for (let i = 0; i < totalPages; i++) {
                // 첫/끝 페이지 및 현재 페이지 주변만 표시
                if (i === 0 || i === totalPages - 1 || (i >= currentPage - range && i <= currentPage + range)) {

                    if (i === currentPage - range && i > 1) {
                        const span = document.createElement('span');
                        span.innerText = '...'; span.style.margin = '0 5px'; span.style.color = '#ccc';
                        nav.appendChild(span);
                    }

                    addBtn(i, i + 1, `page-btn-num ${i === currentPage ? 'active' : ''}`);

                    if (i === currentPage + range && i < totalPages - 2) {
                        const span = document.createElement('span');
                        span.innerText = '...'; span.style.margin = '0 5px'; span.style.color = '#ccc';
                        nav.appendChild(span);
                    }
                }
            }

            // [다음] 버튼
            addBtn(currentPage + 1, '다음', 'page-btn-nav', currentPage === totalPages - 1);
        }

        function formatDate(str) {
            if (!str) return '-';
            const d = new Date(str);
            return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
    </script>
</th:block>
</body>
</html>
