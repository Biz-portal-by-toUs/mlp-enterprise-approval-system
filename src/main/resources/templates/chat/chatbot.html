<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 규정 어시스턴트</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f9fafb;
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --bot-bubble: #f3f4f6;
            --user-bubble: #4f46e5;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
        }

        .wrap {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        .top {
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .title { display: flex; align-items: center; gap: 12px; }
        .bot-logo {
            width: 32px; height: 32px;
            background: var(--primary-color);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 18px;
        }
        .title-text h1 { margin: 0; font-size: 18px; font-weight: 700; }

        .status-area { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; }
        .status-dot.on { background: #10b981; box-shadow: 0 0 8px #10b981; }

        /* 토글 버튼 스타일 */
        .history-toggle-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: white;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .history-toggle-btn:hover { background: #f3f4f6; border-color: #bbb; }
        .history-toggle-btn.active { background: #e0e7ff; color: var(--primary-color); border-color: var(--primary-color); }

        .msgs {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        /* 이전 대화 컨테이너 (토글 대상) */
        #historyArea {
            display: none; /* 기본 숨김 */
            flex-direction: column;
            gap: 24px;
            padding-bottom: 24px;
            border-bottom: 1px dashed var(--border-color);
        }

        /* 구분선 스타일 */
        .history-divider {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin: 10px 0;
        }

        .msg-group {
            display: flex;
            gap: 14px;
            max-width: 85%;
            animation: fadeInUp 0.3s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-group.me { flex-direction: row-reverse; align-self: flex-end; }

        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #eef2ff;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 18px;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .msg-group.bot .bubble { background-color: var(--bot-bubble); border-top-left-radius: 2px; }
        .msg-group.me .bubble { background-color: var(--user-bubble); color: white; border-top-right-radius: 2px; }

        .msg-group.guide .bubble {
            background: linear-gradient(135deg, #f5f7ff 0%, #ffffff 100%);
            border: 1px solid #e0e7ff;
            color: var(--primary-color);
            font-weight: 500;
        }

        .time-info { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: block; }
        .me .time-info { text-align: right; }

        .bottom-area { padding: 24px; background: white; border-top: 1px solid var(--border-color); }
        .input-wrapper {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex; align-items: flex-end; gap: 12px;
        }
        textarea { flex: 1; border: none; background: transparent; outline: none; font-size: 15px; padding: 8px 0; resize: none; max-height: 150px; }
        .send-btn {
            background: var(--primary-color); color: white; border: none;
            width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .system-msg { align-self: center; font-size: 12px; color: var(--text-muted); background: #f3f4f6; padding: 4px 12px; border-radius: 99px; margin: 10px 0; }
    </style>
</head>

<body>
<div class="wrap">
    <div class="top">
        <div class="title">
            <div class="bot-logo">AI</div>
            <div class="title-text">
                <h1>사내 규정 어시스턴트</h1>
                <div class="status-area">
                    <span id="connDot" class="status-dot"></span>
                    <span id="statusText">연결 확인 중...</span>
                </div>
            </div>
        </div>
        <div class="actions">
            <button id="historyToggleBtn" class="history-toggle-btn" onclick="toggleHistory()">이전 대화 보기</button>
        </div>
    </div>

    <div class="msgs" id="messages">
        <div id="guideArea"></div>

        <div id="historyArea"></div>

        <div id="currentArea"></div>
    </div>

    <div class="bottom-area">
        <div class="input-wrapper">
            <textarea id="messageInput" placeholder="궁금한 규정에 대해 물어보세요..." rows="1" autocomplete="off"></textarea>
            <button id="sendBtn" class="send-btn" onclick="sendQuestion()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:11px; color:#9ca3af; padding: 0 4px;">
            <span id="byteInfo">0 / 61440 bytes</span>
            <span>AI는 실수를 할 수 있으니 중요 정보는 다시 확인하세요.</span>
        </div>
    </div>
</div>

<script>
    function authHeaders() { return { 'Content-Type': 'application/json' }; }
    function escapeHtml(str) { return String(str ?? "").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[s])); }
    function linkify(text) { return text.replace(/(https?:\/\/[^\s]+)/g, url => `<a href="${url}" target="_blank" style="color:inherit; font-weight:600;">${url}</a>`); }
    function nowTime() { return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

    const msgDomMap = new Map();

    // 메시지 추가 위치를 지정할 수 있도록 수정
    function appendBubble({ role, senderLabel, content, messageId, createdAt, targetId = "currentArea" }) {
        const box = document.getElementById(targetId);
        const group = document.createElement("div");
        const isGuide = senderLabel === "시스템 가이드";
        group.className = (role === "USER") ? "msg-group me" : (isGuide ? "msg-group bot guide" : "msg-group bot");

        let html = "";
        if (role !== "USER") {
            html += `<div class="avatar">${isGuide ? '📍' : '🤖'}</div>`;
        }

        const safeContent = linkify(escapeHtml(content ?? ""));
        const time = createdAt ? new Date(createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : nowTime();

        html += `
            <div class="msg-content">
                <div class="bubble">${safeContent}</div>
                <span class="time-info">${time}</span>
            </div>
        `;

        group.innerHTML = html;
        box.appendChild(group);

        if (messageId) {
            msgDomMap.set(messageId, { bubbleEl: group.querySelector(".bubble"), timeEl: group.querySelector(".time-info") });
        }

        const msgsContainer = document.getElementById("messages");
        msgsContainer.scrollTop = msgsContainer.scrollHeight;
        return group;
    }

    // [토글 기능] 이전 대화 보기/숨기기
    function toggleHistory() {
        const historyArea = document.getElementById("historyArea");
        const btn = document.getElementById("historyToggleBtn");

        if (historyArea.style.display === "none" || historyArea.style.display === "") {
            historyArea.style.display = "flex";
            btn.innerText = "이전 대화 숨기기";
            btn.classList.add("active");
        } else {
            historyArea.style.display = "none";
            btn.innerText = "이전 대화 보기";
            btn.classList.remove("active");
        }
    }

    // [1번 방식: 실시간 가이드] - 항상 최상단 guideArea에 렌더링
    async function showDocumentGuide() {
        try {
            const res = await fetch("/api/v1/prov-documents/chatbot?size=100", { method: "GET", headers: authHeaders() });
            if (!res.ok) return;
            const raw = await res.json();
            const docs = raw?.data?.content ?? [];
            if (docs.length > 0) {
                document.getElementById("guideArea").innerHTML = ""; // 초기화
                appendBubble({
                    role: "ASSISTANT",
                    senderLabel: "시스템 가이드",
                    content: `반갑습니다! 현재 아래 규정들에 대해 답변이 가능합니다.\n\n${docs.map(d => `• ${d.docTitle}`).join("\n")}`,
                    targetId: "guideArea"
                });
            }
        } catch (e) { console.error(e); }
    }

    // [이전 대화 로드] - historyArea에 렌더링
    async function loadRecent() {
        const res = await fetch("/api/v1/chatbot/messages?limit=50", { method: "GET", headers: authHeaders() });
        const raw = await res.json();
        const msgs = (raw?.data ?? []).reverse();

        const historyArea = document.getElementById("historyArea");
        historyArea.innerHTML = `<div class="history-divider">여기까지 이전 대화 내용입니다</div>`;

        msgs.forEach(m => appendBubble({
            role: m.role,
            content: m.content,
            messageId: m.id,
            createdAt: m.createdAt,
            targetId: "historyArea"
        }));
    }

    async function sendQuestion() {
        const input = document.getElementById("messageInput");
        const question = input.value.trim();
        if (!question) return;

        appendBubble({ role: "USER", content: question, targetId: "currentArea" });
        input.value = "";
        input.style.height = "auto";

        const res = await fetch("/api/v1/chatbot/messages", { method: "POST", headers: authHeaders(), body: JSON.stringify({ question }) });
        const raw = await res.json();
        if(raw.data?.assistantMessageId) {
            msgDomMap.set(raw.data.assistantMessageId, { bubbleEl: appendBubble({role:"ASSISTANT", messageId:raw.data.assistantMessageId, content:"", targetId: "currentArea"}).querySelector(".bubble") });
        }
    }

    // SSE 및 연결 상태 처리 (생략 없이 포함)
    let es = null;
    function connectSse() {
        es = new EventSource("/api/v1/chatbot/stream", { withCredentials: true });
        es.addEventListener("connected", () => {
            document.getElementById("statusText").innerText = "온라인";
            document.getElementById("connDot").classList.add("on");
        });
        es.addEventListener("chunk", (e) => {
            const data = JSON.parse(e.data);
            const ref = msgDomMap.get(data.messageId);
            if(ref) {
                ref.bubbleEl.innerText += data.delta;
                const msgsContainer = document.getElementById("messages");
                msgsContainer.scrollTop = msgsContainer.scrollHeight;
            }
        });
        es.addEventListener("done", (e) => {
            const data = JSON.parse(e.data);
            const ref = msgDomMap.get(data.messageId);
            if(ref) ref.timeEl.innerText = nowTime();
        });
    }

    window.addEventListener("load", () => {
        connectSse();
        showDocumentGuide(); // 1. 가이드 먼저 호출 (최상단)
        loadRecent();        // 2. 기록 호출 (가이드 아래, 숨김 상태)

        const input = document.getElementById("messageInput");
        input.addEventListener("input", function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            document.getElementById("byteInfo").innerText = `${new TextEncoder().encode(this.value).length} / 61440 bytes`;
        });
        input.addEventListener("keydown", e => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    });
</script>
</body>
</html>
