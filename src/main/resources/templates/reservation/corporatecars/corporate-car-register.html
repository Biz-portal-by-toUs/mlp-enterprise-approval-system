<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>법인 차량 등록</title>

    <th:block layout:fragment="pageStyles">
        <style>
            .corpcar-register-page {
                padding: 24px 0;
                display: flex;
                justify-content: center;
                background: #f4f6f8;
                min-height: 100%;
            }

            .corpcar-register-page .card {
                width: 520px;
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
                padding: 28px;
            }

            .corpcar-register-page h2 {
                margin-top: 0;
                text-align: center;
            }

            .corpcar-register-page .form-inner {
                max-width: 420px;
                margin: 0 auto;
            }

            .corpcar-register-page .field {
                margin-bottom: 14px;
            }

            .corpcar-register-page label {
                display: block;
                font-size: 13px;
                margin-bottom: 6px;
                color: #555;
            }

            .corpcar-register-page input,
            .corpcar-register-page textarea {
                width: 100%;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #ddd;
                font-size: 14px;
                box-sizing: border-box;
            }

            .corpcar-register-page textarea {
                resize: none;
            }

            .corpcar-register-page .preview-box {
                width: 100%;
                height: 220px;
                background: #e5e7eb;
                border-radius: 12px;
                overflow: hidden;
                margin-top: 10px;
            }

            .corpcar-register-page .preview-box img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: none;
            }

            .corpcar-register-page .btns {
                display: flex;
                gap: 10px;
                margin-top: 18px;
            }

            .corpcar-register-page .btns button {
                flex: 1;
                padding: 10px;
                border-radius: 8px;
                border: none;
                font-size: 14px;
                cursor: pointer;
            }

            .corpcar-register-page .btns .submit {
                background: #1677ff;
                color: #fff;
            }

            .corpcar-register-page .btns .cancel {
                background: #e5e7eb;
            }

            /* ===== hints / validation UI ===== */
            .hint-row{
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-top:6px;
                gap:10px;
            }

            .hint{
                color:#6b7280;
                font-size:12px;
            }

            .counter{
                color:#6b7280;
                font-size:12px;
                font-variant-numeric: tabular-nums;
            }

            .error{
                display:block;
                margin-top:6px;
                color:#ef4444;
                font-size:12px;
                font-weight:600;
            }

            .input-invalid{
                border-color:#ef4444 !important;
                box-shadow: 0 0 0 3px rgba(239,68,68,.12);
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('car')"></aside>

        <div class="corpcar-register-page">
            <div class="card">
                <h2>법인 차량 등록</h2>

                <form id="carForm" enctype="multipart/form-data" class="form-inner">

                    <!-- 차량명 -->
                    <div class="field">
                        <label>차량명</label>
                        <input type="text" name="carName" id="carName" maxlength="20" required>
                        <div class="hint-row">
                            <small class="hint">최대 20자까지 입력 가능</small>
                            <small class="counter" id="nameCounter">0 / 20</small>
                        </div>
                        <small class="error" id="nameError" style="display:none;"></small>
                    </div>

                    <!-- 차량번호(번호판) -->
                    <div class="field">
                        <label>차량번호(번호판)</label>
                        <input type="text" name="plateNo" id="plateNo" maxlength="20" required>
                        <div class="hint-row">
                            <small class="hint">최대 20자까지 입력 가능</small>
                            <small class="counter" id="plateCounter">0 / 20</small>
                        </div>
                        <small class="error" id="plateError" style="display:none;"></small>
                    </div>

                    <!-- 수용인원 -->
                    <div class="field">
                        <label>수용 인원</label>
                        <input type="number" name="capacity" id="capacity" min="1" max="8" required>
                        <div class="hint-row">
                            <small class="hint">1~8명 입력 가능</small>
                        </div>
                        <small class="error" id="capError" style="display:none;"></small>
                    </div>

                    <div class="field">
                        <label>차종</label>
                        <input type="text" name="carType" maxlength="20">
                    </div>

                    <div class="field">
                        <label>연료</label>
                        <input type="text" name="fuel" maxlength="10">
                    </div>


                    <div class="field">
                        <label>법인 차량 이미지</label>
                        <input
                                type="file"
                                name="imageFile"
                                id="imageFile"
                                accept="image/*"
                                onchange="previewImage(this)"
                        >
                    </div>

                    <div class="preview-box">
                        <img id="imagePreview" alt="미리보기 이미지"/>
                    </div>

                    <div class="btns">
                        <button type="submit" class="submit">등록</button>
                        <button type="button" class="cancel" onclick="history.back()">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>

<th:block layout:fragment="pageScripts">
    <script>
        async function apiFetch(path, options = {}) {
            const res = await fetch(path, {
                ...options,
                credentials: "include",
                headers: {...(options.headers || {})},
            });

            if (res.status === 401 || res.status === 403) {
                alert("로그인이 필요합니다.");
                location.href = "/login";
                throw new Error("UNAUTHORIZED");
            }
            return res;
        }

        /* ---------- image preview ---------- */
        function previewImage(input) {
            const preview = document.getElementById("imagePreview");

            if (!input.files || !input.files[0]) {
                preview.style.display = "none";
                preview.src = "";
                return;
            }

            const file = input.files[0];

            if (!file.type.startsWith("image/")) {
                alert("이미지 파일만 업로드 가능합니다.");
                input.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        }

        /* ===== inline validation UI ===== */
        const carNameInput = document.getElementById("carName");
        const nameCounter = document.getElementById("nameCounter");
        const nameError = document.getElementById("nameError");

        const plateInput = document.getElementById("plateNo");
        const plateCounter = document.getElementById("plateCounter");
        const plateError = document.getElementById("plateError");

        const capInput = document.getElementById("capacity");
        const capError = document.getElementById("capError");

        function setError(inputEl, errorEl, msg) {
            if (!errorEl) return;

            if (msg) {
                errorEl.textContent = msg;
                errorEl.style.display = "block";
                inputEl?.classList.add("input-invalid");
            } else {
                errorEl.textContent = "";
                errorEl.style.display = "none";
                inputEl?.classList.remove("input-invalid");
            }
        }

        function updateNameUI() {
            if (!carNameInput) return;

            const len = carNameInput.value.length;
            if (nameCounter) nameCounter.textContent = `${len} / 20`;

            if (!carNameInput.value.trim()) {
                setError(carNameInput, nameError, "");
                return;
            }

            if (len > 20) setError(carNameInput, nameError, "차량명은 20자 이내여야 합니다.");
            else setError(carNameInput, nameError, "");
        }

        function updatePlateUI() {
            if (!plateInput) return;

            const len = plateInput.value.length;
            if (plateCounter) plateCounter.textContent = `${len} / 20`;

            if (!plateInput.value.trim()) {
                setError(plateInput, plateError, "");
                return;
            }

            if (len > 20) setError(plateInput, plateError, "차량번호(번호판)는 20자 이내여야 합니다.");
            else setError(plateInput, plateError, "");
        }

        function updateCapUI() {
            if (!capInput) return;

            const v = capInput.value;

            if (v === "") {
                setError(capInput, capError, "");
                return;
            }

            const n = Number(v);
            if (Number.isNaN(n)) {
                setError(capInput, capError, "숫자만 입력해주세요.");
                return;
            }

            if (n < 1 || n > 8) {
                setError(capInput, capError, "수용 인원은 1~8명 사이여야 합니다.");
                return;
            }

            setError(capInput, capError, "");
        }

        carNameInput?.addEventListener("input", updateNameUI);
        plateInput?.addEventListener("input", updatePlateUI);

        capInput?.addEventListener("input", () => {
            let value = capInput.value;

            if (value === "") {
                updateCapUI();
                return;
            }

            const num = Number(value);

            if (Number.isNaN(num)) {
                capInput.value = "";
                updateCapUI();
                return;
            }

            if (num < 1) capInput.value = 1;
            if (num > 8) capInput.value = 8;

            updateCapUI();
        });

        // 초기 표시
        updateNameUI();
        updatePlateUI();
        updateCapUI();

        /* ---------- submit ---------- */
        async function submitCorporateCarForm(e) {
            e.preventDefault();

            const name = document.querySelector("[name=carName]").value.trim();
            const plate = document.querySelector("[name=plateNo]").value.trim();
            const capacity = Number(document.querySelector("[name=capacity]").value);

            updateNameUI();
            updatePlateUI();
            updateCapUI();

            if (!name) {
                setError(carNameInput, nameError, "차량명을 입력해주세요.");
                carNameInput.focus();
                return;
            }
            if (name.length > 20) {
                setError(carNameInput, nameError, "차량명은 20자 이내여야 합니다.");
                carNameInput.focus();
                return;
            }

            if (!plate) {
                setError(plateInput, plateError, "차량번호(번호판)를 입력해주세요.");
                plateInput.focus();
                return;
            }
            if (plate.length > 20) {
                setError(plateInput, plateError, "차량번호(번호판)는 20자 이내여야 합니다.");
                plateInput.focus();
                return;
            }

            if (!capacity || capacity < 1 || capacity > 8) {
                setError(capInput, capError, "수용 인원은 1~8명 사이여야 합니다.");
                capInput.focus();
                return;
            }

            const form = document.getElementById("carForm");
            const formData = new FormData(form);

            try {
                const res = await apiFetch("/api/v1/corporate-cars", {
                    method: "POST",
                    body: formData
                });

                let result = null;
                const ct = res.headers.get("content-type") || "";
                if (ct.includes("application/json")) result = await res.json();

                if (!res.ok) {
                    console.error(result);
                    alert(result?.message || "등록 실패");
                    return;
                }

                alert("법인 차량 등록 성공!");
                location.href = "/corporate-cars";

            } catch (err) {
                if (err.message !== "UNAUTHORIZED") {
                    console.error(err);
                    alert("서버 오류가 발생했습니다.");
                }
            }
        }

        document
            .getElementById("carForm")
            .addEventListener("submit", submitCorporateCarForm);
    </script>
</th:block>

</body>
</html>
