<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="/css/alert.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/alert/alert.js"></script>
    <style>
        body { margin: 0; font-family: system-ui; background: #fff; overflow-x: hidden; }
        body::-webkit-scrollbar { display: none; }

        /* ✅ 탭 메뉴 */
        .noti-tabs {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid rgba(17,24,39,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 0 5px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .noti-tabs::-webkit-scrollbar { display: none; }

        .tab-item {
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .tab-item.active { color: #3b82f6; border-bottom-color: #3b82f6; }

        /* ✅ 알림 리스트 */
        .noti-list { height: calc(100vh - 45px); overflow-y: auto; }
        .noti-list::-webkit-scrollbar { display: none; }

        .noti-card {
            display: flex;
            align-items: flex-start;
            padding: 16px;
            border-bottom: 1px solid rgba(17,24,39,0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: #ffffff;
            border-left: 4px solid transparent;
        }
        .noti-card:hover { background: #f9fafb; }
        .noti-card.unread { background: #f0f9ff; border-left: 4px solid #3b82f6; }
        .noti-card.unread:hover { background: #e0f2fe; }

        .noti-icon {
            width: 32px; height: 32px; border-radius: 50%; background: #fff;
            border: 1px solid #e2e8f0; display: grid; place-items: center;
            margin-right: 12px; flex-shrink: 0; font-size: 16px;
        }

        .noti-info { flex: 1; min-width: 0; }
        .noti-title { font-size: 14.5px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.2s; }
        .noti-card.unread .noti-title { font-weight: 800; color: #0f172a; }
        .noti-card:not(.unread) .noti-title { font-weight: 600; color: #334155; }

        .noti-content { font-size: 13.5px; line-height: 1.5; font-weight: 500; color: #475569; }
        .noti-card:not(.unread) .noti-content { color: #64748b; }
        .noti-date { font-size: 11px; color: #94a3b8; margin-top: 8px; }

        .noti-close {
            background: none; border: none; font-size: 20px; color: #cbd5e1;
            cursor: pointer; padding: 4px; position: absolute; right: 12px; top: 14px;
            line-height: 1;
        }
        .noti-close:hover { color: #ef4444; }

        #sentinel { height: 20px; }
        .empty-msg { text-align: center; padding: 60px; color: #94a3b8; font-size: 13px; }

        /* ✅ 위젯용 초소형 SweetAlert2 커스텀 스타일 */
        .mini-swal-popup {
            width: 280px !important;
            padding: 15px !important;
            border-radius: 12px !important;
        }
        .mini-swal-title {
            font-size: 16px !important;
            font-weight: 700 !important;
            margin-top: 10px !important;
        }
        .mini-swal-text {
            font-size: 13px !important;
            color: #64748b !important;
            margin: 5px 0 !important;
        }
        .mini-swal-button {
            padding: 6px 18px !important;
            font-size: 12px !important;
            border-radius: 6px !important;
        }

        /* ✅ 아이콘(원) 크기는 적절하게 유지하고 물음표만 조정 */
        .mini-swal-icon {
            width: 42px !important;
            height: 42px !important;
            margin: 10px auto 5px auto !important;
        }
        /* ✅ 물음표(?) 텍스트 크기만 별도로 축소 */
        .mini-swal-icon .swal2-icon-content {
            font-size: 22px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .mini-swal-icon::before, .mini-swal-icon::after {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="noti-tabs">
    <div class="tab-item active" data-type="ALL">전체</div>
    <div class="tab-item" data-type="APPROVAL">결재</div>
    <div class="tab-item" data-type="MAIL">메일</div>
    <div class="tab-item" data-type="MEETING">회의</div>
    <div class="tab-item" data-type="CALENDER">일정</div>
    <div class="tab-item" data-type="OTHER">기타</div>
</div>

<div id="notiList" class="noti-list">
    <div id="sentinel" style="height: 10px;"></div>
</div>

<script>
    let lastAt = null, lastId = null, isLast = false, isLoading = false, type = 'ALL';
    const iconMap = { 'APPROVAL': '📑', 'MAIL': '📧', 'MEETING': '💬', 'CALENDER': '📅', 'OTHER': '🔔' };

    const MiniAlert = {
        confirm: (msg, title = '확인') => {
            return Swal.fire({
                title: title,
                text: msg,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: '확인',
                cancelButtonText: '취소',
                confirmButtonColor: '#356fda',
                cancelButtonColor: '#aaa',
                reverseButtons: true,
                customClass: {
                    popup: 'mini-swal-popup',
                    title: 'mini-swal-title',
                    htmlContainer: 'mini-swal-text',
                    confirmButton: 'mini-swal-button',
                    cancelButton: 'mini-swal-button',
                    icon: 'mini-swal-icon'
                }
            });
        },
        error: (msg) => {
            return Swal.fire({
                icon: 'error',
                title: '오류',
                text: msg,
                confirmButtonColor: '#356fda',
                customClass: {
                    popup: 'mini-swal-popup',
                    title: 'mini-swal-title',
                    htmlContainer: 'mini-swal-text',
                    confirmButton: 'mini-swal-button',
                    icon: 'mini-swal-icon'
                }
            });
        }
    };

    async function load() {
        if (isLoading || isLast) return;
        isLoading = true;

        let url = `/api/v1/notifications?size=15`;
        if (type !== 'ALL') url += `&type=${type}`;
        if (lastAt && lastId) url += `&lastNotifiedAt=${encodeURIComponent(lastAt)}&lastNotiNo=${lastId}`;

        try {
            const res = await fetch(url);
            const result = await res.json();
            const items = result.data;

            if (!items || !items.length) {
                isLast = true;
                if(!lastId) document.getElementById('notiList').innerHTML='<div class="empty-msg">알림이 없습니다.</div>';
                return;
            }

            items.forEach(it => {
                const card = document.createElement('div');
                card.id = `noti-${it.notiNo}`;
                card.className = `noti-card ${it.read ? '' : 'unread'}`;
                card.innerHTML = `
                        <div class="noti-icon">${iconMap[it.type] || '🔔'}</div>
                        <div class="noti-info" onclick="handleRead(${it.notiNo}, '${it.url}')">
                            <div class="noti-title">${it.title}</div>
                            <div class="noti-content">${it.content}</div>
                            <div class="noti-date">${new Date(it.createdAt).toLocaleString()}</div>
                        </div>
                        <button class="noti-close" onclick="event.stopPropagation(); deleteNoti(${it.notiNo}, this)">×</button>
                    `;
                document.getElementById('sentinel').before(card);
            });

            const last = items[items.length - 1];
            lastAt = last.createdAt;
            lastId = last.notiNo;
        } catch (error) {
            console.error("데이터 로드 중 오류:", error);
        } finally {
            isLoading = false;
        }
    }

    async function handleRead(id, url) {
        const targetCard = document.getElementById(`noti-${id}`);
        if(targetCard) targetCard.classList.remove('unread');

        try {
            await fetch(`/api/v1/notifications/${id}/read`, { method: 'PATCH' });
            if(window.parent && window.parent.initNotificationSystem) {
                window.parent.initNotificationSystem();
            }
            if(url && url !== 'null') window.parent.location.href = url;
        } catch(e) {
            console.error("읽음 처리 실패", e);
        }
    }

    window.readAllNotifications = async function() {
        const result = await MiniAlert.confirm("모든 알림을 읽음 처리하시겠습니까?");
        if(!result.isConfirmed) return;

        try {
            const res = await fetch(`/api/v1/notifications/read-all`, { method: 'PATCH' });
            if (res.ok) {
                location.reload();
                if(window.parent && window.parent.initNotificationSystem) {
                    window.parent.initNotificationSystem();
                }
            }
        } catch (e) {
            console.error("전체 읽음 처리 실패", e);
            MiniAlert.error("처리 중 오류가 발생했습니다.");
        }
    };

    window.deleteAllNotifications = async function() {
        const result = await MiniAlert.confirm("모든 알림을 삭제하시겠습니까?");
        if(!result.isConfirmed) return;

        try {
            const res = await fetch(`/api/v1/notifications/delete-all`, { method: 'DELETE' });
            if (res.ok) {
                location.reload();
                if(window.parent && window.parent.initNotificationSystem) {
                    window.parent.initNotificationSystem();
                }
            }
        } catch (e) {
            console.error("전체 삭제 처리 실패", e);
            MiniAlert.error("삭제 중 오류가 발생했습니다.");
        }
    };

    window.appendRealtimeNoti = function(it) {
        const notiList = document.getElementById('notiList');
        if (!notiList) return;
        if (type !== 'ALL' && type !== it.type) return;

        const emptyMsg = notiList.querySelector('.empty-msg');
        if (emptyMsg) emptyMsg.remove();

        const card = document.createElement('div');
        card.id = `noti-${it.notiNo}`;
        card.className = `noti-card ${it.read ? '' : 'unread'}`;
        card.innerHTML = `
            <div class="noti-icon">${iconMap[it.type] || '🔔'}</div>
            <div class="noti-info" onclick="handleRead(${it.notiNo}, '${it.url}')">
                <div class="noti-title">${it.title}</div>
                <div class="noti-content">${it.content}</div>
                <div class="noti-date">${new Date(it.createdAt).toLocaleString()}</div>
            </div>
            <button class="noti-close" onclick="event.stopPropagation(); deleteNoti(${it.notiNo}, this)">×</button>
        `;
        notiList.prepend(card);
    };

    /* ✅ 개별 삭제 시 확인창 없이 바로 삭제되도록 수정 */
    async function deleteNoti(id, btn) {
        try {
            const res = await fetch(`/api/v1/notifications/${id}`, { method: 'DELETE' });
            const resData = await res.json();

            if (res.ok) {
                const card = btn.closest('.noti-card');
                card.style.opacity = '0';
                card.style.transform = 'translateX(20px)';

                setTimeout(() => {
                    card.remove();
                    if (document.getElementById('notiList').querySelectorAll('.noti-card').length === 0) {
                        document.getElementById('notiList').innerHTML = '<div class="empty-msg">알림이 없습니다.</div>';
                    }
                }, 300);

                if(window.parent && window.parent.initNotificationSystem) {
                    window.parent.initNotificationSystem();
                }
            } else {
                MiniAlert.error(resData.message || "삭제 오류가 발생했습니다.");
            }
        } catch (e) {
            console.error("삭제 통신 오류:", e);
            MiniAlert.error("서버와 통신 중 오류가 발생했습니다.");
        }
    }

    const observer = new IntersectionObserver(e => {
        if(e[0].isIntersecting && !isLoading && !isLast) load();
    }, { threshold: 0.1 });

    const initialSentinel = document.getElementById('sentinel');
    if (initialSentinel) observer.observe(initialSentinel);

    document.querySelectorAll('.tab-item').forEach(tab => {
        tab.onclick = () => {
            if (tab.classList.contains('active')) return;
            document.querySelector('.tab-item.active').classList.remove('active');
            tab.classList.add('active');

            type = tab.dataset.type;
            document.getElementById('notiList').innerHTML = '<div id="sentinel" style="height: 10px;"></div>';
            const newSentinel = document.getElementById('sentinel');
            observer.observe(newSentinel);

            lastAt = null; lastId = null; isLast = false;
            load();
        };
    });

    load();
</script>
</body>
</html>
