<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<th:block layout:fragment="pageStyles">
    <style>
        /* ===== Layout (✅ 원래 크기 유지) ===== */
        .cal-wrap{
            display:grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap:16px;
            align-items:stretch;
        }
        .cal-left{
            background: rgba(59,130,246,.14);
            border:1px solid rgba(59,130,246,.18);
            border-radius: var(--radius);
            box-shadow: var(--shadow2);
            padding:16px;
            min-height: 760px;
        }
        .mini-box{
            background: rgba(255,255,255,.40);
            border:1px solid rgba(255,255,255,.35);
            border-radius: 12px;
            padding:10px;
            margin-bottom:12px;
        }

        .cal-main{
            background:#fff;
            border:1px solid rgba(17,24,39,.08);
            border-radius: var(--radius);
            box-shadow: var(--shadow2);
            padding:14px;
            min-height: 760px;
            min-width: 0;
        }

        .cal-toolbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            margin-bottom:10px;
        }
        .toolbar-left{ display:flex; align-items:center; gap:12px; min-width:0; }
        .main-title{
            font-size:28px; font-weight:800; margin:0; white-space:nowrap;
            cursor:pointer; user-select:none;
        }
        .main-title:hover{ text-decoration: underline; text-underline-offset: 6px; }

        .nav-group{
            display:flex;
            gap:6px;
            background:#f3f4f6;
            border:1px solid #e5e7eb;
            border-radius: 999px;
            padding:4px;
        }
        .nav-btn{
            border:0;
            background:transparent;
            padding:8px 12px;
            border-radius:999px;
            font-weight:900;
            cursor:pointer;
        }
        .nav-btn:hover{ background:#e5e7eb; }

        .toolbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
        .pill-group{
            display:flex;
            gap:6px;
            background:#f3f4f6;
            border:1px solid #e5e7eb;
            border-radius: 999px;
            padding:4px;
        }
        .pill{
            border:0;
            background:transparent;
            padding:8px 14px;
            border-radius: 999px;
            font-weight:900;
            cursor:pointer;
            color:#334155;
        }
        .pill.active{ background:#2563eb; color:#fff; }

        .weekstart-select{
            border:1px solid #e5e7eb;
            background:#fff;
            border-radius: 12px;
            padding:8px 10px;
            font-weight:800;
            cursor:pointer;
        }
        .local-search{
            border:1px solid #e5e7eb;
            border-radius: 999px;
            padding:10px 14px;
            min-width:240px;
            outline:none;
            font-weight:700;
        }

        .add-btn{
            width:100%;
            height:44px;
            border:1px solid rgba(17,24,39,.10);
            border-radius: 12px;
            background: rgba(255,255,255,.55);
            font-weight:900;
            cursor:pointer;
        }
        .add-btn:hover{ background: rgba(255,255,255,.75); }

        /* ===== Mini header ===== */
        .mini-head{
            display:flex; align-items:center; justify-content:space-between;
            gap:10px;
            margin:0 0 10px;
        }
        .mini-month{
            font-weight:900; color:#1f3b7a;
            cursor:pointer; user-select:none;
        }
        .mini-month:hover{ text-decoration: underline; text-underline-offset: 6px; }
        .mini-nav{ display:flex; gap:6px; }
        .mini-nav button{
            width:34px; height:34px;
            border:1px solid rgba(17,24,39,.10);
            background:rgba(255,255,255,.55);
            border-radius:10px;
            cursor:pointer;
            font-weight:900;
        }
        .mini-nav button:hover{ background:rgba(255,255,255,.75); }

        /* ===== Left toggles ===== */
        .mycal{
            margin-top:14px;
            background: rgba(255,255,255,.40);
            border:1px solid rgba(255,255,255,.35);
            border-radius: 12px;
            padding:12px;
        }
        .mycal-title{ font-weight:900; color:#1f3b7a; margin-bottom:8px; }
        .toggle-row{
            display:flex; align-items:center; justify-content:space-between;
            padding:10px 6px;
            border-top:1px solid rgba(17,24,39,.08);
            gap:10px;
        }
        .tag{ display:flex; align-items:center; gap:10px; font-weight:700; color:#0f172a; }
        .dot{ width:10px; height:10px; border-radius:999px; display:inline-block; }

        .switch{
            position:relative;
            width:44px; height:24px;
            background:#cbd5e1;
            border-radius:999px;
            cursor:pointer;
            transition:.15s;
        }
        .switch::after{
            content:"";
            position:absolute;
            top:3px; left:3px;
            width:18px; height:18px;
            background:#fff;
            border-radius:999px;
            transition:.15s;
            box-shadow:0 3px 10px rgba(0,0,0,.15);
        }
        .switch.on{ background:#2563eb; }
        .switch.on::after{ left:23px; }

        /* ===== FullCalendar base ===== */
        .fc .fc-header-toolbar{ display:none; }
        .fc .fc-timegrid-slot{ height:46px; }
        .fc .fc-day-today{ background:rgba(59,130,246,.08) !important; }


        /* ===== 이벤트 디자인(배경/바 통일) ===== */
        .fc .fc-event,
        .fc .fc-event-main,
        .fc .fc-timegrid-event,
        .fc .fc-daygrid-event{
            border:none !important;
            border-radius:0 !important;
            background:transparent !important;
            box-shadow:none !important;
            margin-left: 1px !important;
            margin-right: 1px !important;
        }
        .bp-event{
            height:100%;
            padding:6px 8px 6px 10px;
            color:#0f172a;
            --bpBg: rgba(59,130,246,0.12);
            --bpColor: #3b82f6;
            background: var(--bpBg);
            box-shadow: inset 4px 0 0 var(--bpColor);
            overflow:hidden;
            border-radius:0;
        }
        .bp-evt-title{
            font-size:12px;
            font-weight:900;
            white-space:normal;
            word-break:break-word;
            line-height:1.2;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bp-evt-time{ display:none; }
        /* ✅ 5분 같은 "짧은 일정" 글자 잘림 방지 (timeGrid만 적용) */
        /* ✅ 메인 달력 요일 헤더 (Mon, Tue...) 색상 */
        #calendar .fc-day-sun .fc-col-header-cell-cushion {
            color: #ef4444 !important; /* 일요일 빨간색 */
        }
        #calendar .fc-day-sat .fc-col-header-cell-cushion {
            color: #3b82f6 !important; /* 토요일 파란색 */
        }

        /* ✅ 요일 헤더 밑줄 제거 및 폰트 설정 */
        #calendar .fc-col-header-cell-cushion {
            text-decoration: none !important;
            font-weight: 800;
        }

        /* ✅ 월간 뷰(Monthly) 날짜 숫자 색상 */
        #calendar .fc-day-sun .fc-daygrid-day-top {
            color: #ef4444;
        }
        #calendar .fc-day-sat .fc-daygrid-day-top {
            color: #3b82f6;
        }

        /* ✅ 주간 뷰(Weekly) 날짜 숫자 색상 */
        #calendar .fc-timegrid-col.fc-day-sun .fc-timegrid-col-frame {
            /* 필요시 주간 뷰 배경색 등 추가 */
        }

        /*#calendar .fc-timegrid-event-harness{*/
        /*    min-height: 18px; !* 너무 작으면 20~22로 올려도 됨 *!*/
        /*    margin: 0px;*/
        /*}*/
        /* 1. 타임그리드 이벤트 컨테이너가 오른쪽 끝까지 가도록 설정 */
        #calendar .fc-timegrid-event-harness {
            right: 0 !important; /* 오른쪽 여백 강제 제거 */
            margin-right: 0 !important;
        }

        /* 2. 이벤트 바 자체의 마진과 너비 조정 */
        #calendar .fc-timegrid-event {
            margin: 0 !important;      /* 기본 마진 제거 */
            width: 100% !important;    /* 너비를 100%로 확장 */
            left: 0 !important;        /* 왼쪽 밀착 */
            right: 0 !important;       /* 오른쪽 밀착 */
        }
        /* 3. 내부 커스텀 요소(.bp-event)가 꽉 차도록 확인 */
        #calendar .bp-event {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            /* 만약 테두리가 필요 없다면 border-radius를 0으로 주면 더 꽉 차 보입니다 */
            border-radius: 0 !important;
        }


        #calendar .fc-timegrid-event .bp-event{
            padding: 2px 8px 2px 10px;   /* 기존 6px → 2px로 줄여서 안 잘리게 */
            display: flex;
            align-items: center;          /* 글자를 세로 가운데로 */
        }

        #calendar .fc-timegrid-event .bp-evt-title{
            white-space: nowrap;          /* timeGrid는 1줄로 */
            overflow: hidden;
            text-overflow: ellipsis;      /* 길면 ... */
            line-height: 1.1;
        }

        /* +n more 링크 */
        #calendar .fc-scroller-harness,
        #calendar .fc-scroller{
            overflow: auto !important;
        }
        #calendar .fc-daygrid-day-frame{ position:relative; min-height: 100%;}
        .fc-daygrid-day-events {
            padding-bottom: 20px !important; /* ✅ 링크가 들어갈 공간 확보 */
        }
        #calendar .fc-daygrid .fc-more-link,
        #calendar .fc-daygrid .fc-daygrid-more-link{
            display: block;      /* 한 줄을 다 차지하게 함 */
            text-align: right;   /* 오른쪽 정렬 */
            margin-top: 2px;     /* 일정 바와의 간격 */
            margin-right: 8px;
            z-index: 100 !important;         /* ✅ 클릭 우선순위 확보 */
            position: relative;  /* 다른 요소보다 위에 오도록 설정 */
        }
        .fc .fc-more-link{
            display:inline-block;
            padding:2px 6px;
            font-size:12px;
            font-weight:900;
            border-radius:10px;
            background:rgba(15,23,42,.06);
            color:#0f172a;
            text-decoration:none;
        }
        .fc-timegrid .fc-more-link{
            position: relative;
            z-index: 5;
            margin-left: 6px;
            padding: 0 !important;
            background: transparent !important;
        }
        .fc-timegrid .fc-timegrid-col-frame{ position: relative; }
        .fc-timegrid .fc-timegrid-more-link{
            position: absolute !important;
            right: 6px;
            bottom: 2px;
            left: auto !important;
            top: auto !important;
        }

        /* ===== Mini calendar dots (✅ scope별 dot 1개씩) ===== */
        #miniCalendar .fc-daygrid-day-frame{
            position:relative;
            min-height: 70px !important; /* 기존보다 훨씬 짧게 설정 */
            height: 70px !important;
            display: flex;
            flex-direction: column;
            justify-content: center; }
        #miniCalendar .fc-daygrid-day-top {
            justify-content: right !important;
            flex-direction: row !important;
        }
        /* 미니 달력 요일 헤더 정렬 */
        #miniCalendar .fc-col-header-cell {
            border: none !important;
            /*padding: 10px 0 6px !important; !* 위아래 여백 조절 *!*/
        }

        /* 요일 텍스트 스타일 (Mon, Tue, Wed...) */
        #miniCalendar .fc-col-header-cell-cushion {
            display: block !important;
            text-align: center !important;
            width: 100%;
            font-size: 10px; /* 3글자이므로 크기를 살짝 줄임 */
            font-weight: 800;
            letter-spacing: 0.5px; /* 가독성을 위해 자간 추가 */
            color: #64748b; /* 조금 더 선명한 회색 */
            text-transform: uppercase;
            text-decoration: none !important;
        }

        /* 주말 색상 포인트 (기존 스타일 유지 및 보정) */
        #miniCalendar .fc-day-sun .fc-col-header-cell-cushion { color: #ef4444; } /* 일요일 빨강 */
        #miniCalendar .fc-day-sat .fc-col-header-cell-cushion { color: #3b82f6; } /* 토요일 파랑 */


        #miniCalendar .mini-dots{
            position:absolute;
            left:50%;
            bottom:4px;
            transform:translateX(-50%);
            display:flex;
            gap:4px;
            align-items:center;
            justify-content:center;
            height:10px;
            pointer-events:none;
        }
        #miniCalendar .mini-dot{
            width:6px; height:6px;
            border-radius:999px;
            display:inline-block;
            opacity:.95;
        }

        /* ===== Popover ===== */
        .pop-mask{
            position:fixed; inset:0;
            background:transparent;
            display:none;
            z-index:9998;
            pointer-events:none; /* ✅ 중요: 네이티브 select 옵션 클릭을 막지 않게 */
        }
        .pop{
            position:fixed;
            z-index:9999;
            width:min(420px, 92vw);
            background:rgba(255,255,255,.92);
            backdrop-filter: blur(10px);
            border:1px solid rgba(15,23,42,.10);
            box-shadow:0 18px 50px rgba(0,0,0,.18);
            border-radius:18px;
            overflow:hidden;
            display:none;
        }
        .pop.center{
            left:50% !important;
            top:50% !important;
            transform:translate(-50%,-50%) !important;
        }
        .pop-head{
            padding:12px 14px;
            display:flex; align-items:center; justify-content:space-between;
            border-bottom:1px solid rgba(15,23,42,.08);
            background:rgba(248,250,252,.75);
        }
        .pop-title{ display:flex; align-items:center; gap:8px; font-weight:900; color:#0f172a; }
        .pop-badge{ width:10px; height:10px; border-radius:999px; background:#f59e0b; }
        .pop-body{
            padding:14px;
            display:grid;
            gap:10px;
            max-height: min(62vh, 520px);
            overflow:auto;
        }
        .field{ display:grid; gap:6px; }
        .field label{ font-size:12px; font-weight:900; color:#334155; }
        .field input, .field textarea, .field select{
            border:1px solid rgba(17,24,39,.12);
            border-radius:12px;
            padding:10px 12px;
            font-size:14px;
            outline:none;
            background:rgba(255,255,255,.9);
        }
        textarea{ min-height:90px; resize:vertical; }
        .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .pop-foot{
            padding:12px 14px;
            border-top:1px solid rgba(15,23,42,.08);
            display:flex;
            justify-content:flex-end;
            gap:8px;
            background:rgba(255,255,255,.75);
        }
        .btn{
            border:1px solid rgba(17,24,39,.12);
            background:#fff;
            padding:10px 14px;
            border-radius:12px;
            cursor:pointer;
            font-weight:900;
        }
        .btn.primary{ background:#2563eb; border-color:#2563eb; color:#fff; }
        .btn.danger{ background:#ef4444; border-color:#ef4444; color:#fff; }
        .btn.ghost{ background:transparent; }
        .readonly{ background:rgba(248,250,252,.9) !important; }
        .hidden{ display:none !important; }

        .more-list{ display:grid; gap:8px; }
        .more-item{
            display:flex; align-items:flex-start; gap:10px;
            padding:10px 10px;
            border-radius:12px;
            background:rgba(15,23,42,.04);
            cursor:pointer;
            border:1px solid rgba(15,23,42,.06);
        }
        .more-item:hover{ background:rgba(15,23,42,.06); }
        .more-color{ width:10px; height:10px; border-radius:999px; margin-top:3px; flex:0 0 auto; }
        .more-meta{ display:grid; gap:2px; min-width:0; }
        .more-time{ font-size:12px; font-weight:900; color:#0f172a; }
        .more-title{ font-size:13px; font-weight:900; color:#0f172a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        /* =========================
           ✅ Pretty Month Picker Modal
        ========================= */
        .mp-mask{
            position:fixed; inset:0;
            background:rgba(15,23,42,.18);
            display:none;
            z-index:10020;
        }
        .mp{
            position:fixed;
            z-index:10021;
            width:min(380px, 92vw);
            background:rgba(255,255,255,.92);
            backdrop-filter: blur(10px);
            border:1px solid rgba(15,23,42,.10);
            box-shadow:0 18px 50px rgba(0,0,0,.18);
            border-radius:18px;
            overflow:hidden;
            display:none;
        }
        .mp.center{
            left:50%; top:50%;
            transform:translate(-50%,-50%);
        }
        .mp-head{
            padding:12px 14px;
            display:flex; align-items:center; justify-content:space-between;
            border-bottom:1px solid rgba(15,23,42,.08);
            background:rgba(248,250,252,.75);
        }
        .mp-title{
            display:flex; align-items:center; gap:10px;
            font-weight:900; color:#0f172a;
        }
        .mp-chip{
            font-size:12px;
            padding:4px 10px;
            border-radius:999px;
            background:rgba(37,99,235,.10);
            border:1px solid rgba(37,99,235,.18);
            color:#1f3b7a;
            font-weight:900;
        }
        .mp-year{
            display:flex; align-items:center; gap:8px;
            font-weight:900;
        }
        .mp-year button{
            width:34px; height:34px;
            border:1px solid rgba(17,24,39,.10);
            background:rgba(255,255,255,.55);
            border-radius:10px;
            cursor:pointer;
            font-weight:900;
        }
        .mp-year button:hover{ background:rgba(255,255,255,.75); }
        .mp-body{ padding:14px; }
        .mp-grid{
            display:grid;
            grid-template-columns: repeat(3, 1fr);
            gap:10px;
        }
        .mp-mon{
            border:1px solid rgba(17,24,39,.10);
            background:rgba(255,255,255,.65);
            border-radius:14px;
            padding:12px 10px;
            cursor:pointer;
            font-weight:900;
            color:#0f172a;
            text-align:center;
            transition:.12s;
        }
        .mp-mon:hover{ transform:translateY(-1px); background:rgba(255,255,255,.85); }
        .mp-mon.active{
            background:#2563eb;
            border-color:#2563eb;
            color:#fff;
        }
        .mp-foot{
            padding:12px 14px;
            border-top:1px solid rgba(15,23,42,.08);
            display:flex;
            justify-content:space-between;
            gap:8px;
            background:rgba(255,255,255,.75);
        }
        .mp-foot .btn{ padding:10px 12px; }
        .mp-foot .left{ display:flex; gap:8px; }
        .mp-foot .right{ display:flex; gap:8px; }

        @media (max-width: 1100px){
            .cal-wrap{ grid-template-columns: 1fr; }
            .cal-left{ min-height:auto; }
        }

        /* ✅ 일정 추가/수정 모달(createPop)만 크게 */
        #createPop{
            width: min(720px, 94vw);
        }
        #createPop .pop-body{
            max-height: min(72vh, 720px);
        }
        #createPop textarea{
            min-height: 140px;
        }

        /* =========================
           ✅ ToDo List UI (LEFT)  (✅ 날짜 제거 버전)
        ========================= */
        .todo-card{
            margin-top:14px;
            background: rgba(255,255,255,.40);
            border:1px solid rgba(255,255,255,.35);
            border-radius: 12px;
            padding:12px;
        }
        .todo-top{
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:10px;
            margin-bottom:10px;
        }
        .todo-title{
            font-weight:900;
            color:#1f3b7a;
            display:flex; align-items:center; gap:8px;
        }
        .todo-title .todo-title-badge{
            width:10px; height:10px; border-radius:999px;
            background:#334155;
            display:inline-block;
        }
        .todo-count{
            font-size:12px;
            font-weight:800;
            color:#64748b;
            margin-top:4px;
        }

        .todo-list{
            display:grid;
            gap:8px;
            margin-bottom:10px;
            max-height: 380px;
            overflow:auto;
            padding-right:4px;
        }
        .todo-item{
            display:flex; align-items:center; justify-content:space-between;
            gap:10px;
            padding:10px 10px;
            border-radius:12px;
            background:rgba(15,23,42,.04);
            border:1px solid rgba(15,23,42,.06);
        }
        .todo-left{
            display:flex; align-items:flex-start;
            gap:10px;
            min-width:0;
            flex:1;
        }

        .todo-check{
            appearance:none;
            -webkit-appearance:none;
            width:18px; height:18px;
            border-radius:999px;
            border:2px solid rgba(15,23,42,.35);
            background:transparent;
            margin-top:2px;
            cursor:pointer;
            position:relative;
            flex:0 0 auto;
        }
        .todo-check:checked{
            border-color:#2563eb;
            background:#2563eb;
        }
        .todo-check:checked::after{
            content:"";
            position:absolute;
            left:5px; top:2px;
            width:4px; height:8px;
            border:2px solid #fff;
            border-top:0; border-left:0;
            transform:rotate(45deg);
        }

        .todo-text{
            font-weight:600;
            font-size:14px;
            color:#0f172a;
            line-height:1.25;
            word-break:break-word;
            overflow:hidden;
            cursor:default;
        }
        .todo-text.done{
            color:#64748b;
            text-decoration: line-through;
            text-decoration-thickness: 2px;
            text-decoration-color: rgba(100,116,139,.55);
        }

        .todo-actions{
            display:flex; align-items:center; gap:6px;
            flex:0 0 auto;
        }
        .todo-del{
            width:32px; height:32px;
            border:1px solid rgba(17,24,39,.10);
            background:rgba(255,255,255,.55);
            border-radius:10px;
            cursor:pointer;
            font-weight:900;
        }
        .todo-del:hover{ background:rgba(255,255,255,.75); }
        .todo-empty{
            padding:14px 10px;
            text-align:center;
            color:#64748b;
            font-weight:800;
            background:rgba(255,255,255,.35);
            border:1px dashed rgba(15,23,42,.14);
            border-radius:12px;
        }

        .todo-add{
            display:flex;
            gap:8px;
            align-items:center;
            width:100%;
        }
        .todo-input{
            flex:1;
            min-width:0;
            height:36px;
            border:1px solid rgba(17,24,39,.12);
            border-radius:12px;
            padding:0 12px;
            font-weight:800;
            outline:none;
            background:rgba(255,255,255,.85);
        }
        .todo-create{
            flex:0 0 auto;
            height:36px;
            padding:0 14px;
            border:1px solid rgba(17,24,39,.10);
            border-radius:12px;
            background:rgba(255,255,255,.55);
            font-weight:900;
            cursor:pointer;
            white-space:nowrap;
        }
        .todo-create:hover{ background:rgba(255,255,255,.75); }

        .todo-edit{
            width:100%;
            border:1px solid rgba(17,24,39,.12);
            border-radius:10px;
            padding:8px 10px;
            font-weight:700;
            font-size:14px;
            outline:none;
            background:#fff;
        }

        .dt-line{ display:flex; gap:8px; align-items:center; }
        .dt-line select, .dt-line input[type="date"]{ width:100%; }

        /* =========================
   ✅ Toast
========================= */
        .toast-wrap{
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 20000;
            display: grid;
            gap: 10px;
        }

        .toast{
            width: min(360px, 92vw);
            background: rgba(255,255,255,.92);          /* ✅ 흰색 */
            color: #0f172a;                              /* ✅ 글자 검정 */
            border: 1px solid rgba(15,23,42,.10);
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 18px 50px rgba(0,0,0,.16);
            backdrop-filter: blur(10px);
            font-weight: 900;
            display:flex;
            align-items:flex-start;
            gap:10px;
            transform: translateY(8px);
            opacity: 0;
            transition: .18s ease;
        }
        .toast.show{
            transform: translateY(0);
            opacity: 1;
        }

        .toast .ico{
            width: 18px; height: 18px;
            border-radius: 999px;
            background: rgba(37,99,235,.12);            /* ✅ 아이콘 배경만 살짝 */
            color: #2563eb;                              /* ✅ 아이콘 컬러 */
            display:inline-flex;
            align-items:center;
            justify-content:center;
            flex:0 0 auto;
            font-size: 12px;
            margin-top: 2px;
        }

        .toast .msg{
            font-weight: 800;
            line-height: 1.35;
            word-break: break-word;
        }

        /* ✅ 타입별 색상 무시하고 전부 흰색 유지 */
        .toast.info,
        .toast.warn,
        .toast.error{
            background: rgba(255,255,255,.92);
            color: #0f172a;
        }
        /* 공휴일 배경 이벤트에서 혹시 모를 모든 테두리(바) 제거 */
        .fc-bg-event.fc-holiday-event,
        .fc-bg-event[data-event-id*="HOLIDAY"] {
            border: none !important;
            border-left: none !important;
            opacity: 1; /* 색상을 진하게 보고 싶다면 1, 투명하게는 0.3 등 조절 */
        }

        /* 칸 전체 배경색을 더 진하게 하고 싶다면 아래 색상을 수정하세요 */
        .fc-day-holiday {
            background-color: #ffe3e3 !important;
        }

        /* ✅ 공휴일 라벨: 왼쪽 바 제거 및 배경 꽉 채우기 */
        .holiday-label {
            border-left: none !important;
            padding-left: 8px !important;
            /*margin: 1px 2px !important;*/
        }

        /* 주간 뷰 상단 올데이 칸 내부의 일정 간격 조정 */
        .fc-timegrid-event-harness > .fc-timegrid-event {
            border: none !important;
            box-shadow: none !important;
        }

        /* 월간 뷰 배경으로 나올 때의 투명도 */
        .fc-bg-event[data-event-id*="HOLIDAY"] {
            background-color: #ff0000 !important;
            opacity: 0.15 !important;
        }

        /* ✅ timeGrid 이벤트 좌/우 여백(인셋) 제거: all-day처럼 1px만 */

        }

            margin: 0 !important;
        }

        .req{ color:#ef4444; font-weight:900; margin-left:4px; }

        #fixedColorField{ display:none !important; }
    </style>
</th:block>

<th:block layout:fragment="pageScripts">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <script>
        const toastWrap = document.getElementById('toastWrap');

        function toast(message, type='warn', ms=2200){
            if (!toastWrap) return;

            const el = document.createElement('div');
            el.className = `toast ${type}`;

            const ico = document.createElement('div');
            ico.className = 'ico';
            ico.textContent = type === 'error' ? '!' : type === 'info' ? 'i' : '⚠';

            const msg = document.createElement('div');
            msg.className = 'msg';
            msg.textContent = String(message || '');

            el.appendChild(ico);
            el.appendChild(msg);

            toastWrap.appendChild(el);

            // next tick show
            requestAnimationFrame(() => el.classList.add('show'));

            const remove = () => {
                el.classList.remove('show');
                setTimeout(() => el.remove(), 180);
            };

            const t = setTimeout(remove, ms);
            el.addEventListener('click', () => { clearTimeout(t); remove(); });
        }
        // ✅ 스티키(1개만 유지) 토스트 (lazy toastWrap)
        const STICKY = new Map();

        function getToastWrapEl(){
            return document.getElementById('toastWrap'); // ✅ lazy
        }

        function showStickyToast(key, message, type='warn'){
            const wrap = getToastWrapEl();
            if (!wrap) return false;

            let el = STICKY.get(key);
            if (!el){
                el = document.createElement('div');
                el.className = `toast ${type}`;

                const ico = document.createElement('div');
                ico.className = 'ico';

                const msg = document.createElement('div');
                msg.className = 'msg';

                el.appendChild(ico);
                el.appendChild(msg);

                wrap.appendChild(el);
                requestAnimationFrame(() => el.classList.add('show'));

                el.addEventListener('click', () => hideStickyToast(key));
                STICKY.set(key, el);
            }

            el.className = `toast ${type} show`;
            const ico = el.querySelector('.ico');
            const msg = el.querySelector('.msg');
            if (ico) ico.textContent = type === 'error' ? '!' : type === 'info' ? 'i' : '⚠';
            if (msg) msg.textContent = String(message || '');

            return true;
        }

        function hideStickyToast(key){
            const el = STICKY.get(key);
            if (!el) return;
            el.classList.remove('show');
            setTimeout(() => el.remove(), 180);
            STICKY.delete(key);
        }
        /* =========================
           API
        ========================= */
        const API_BASE = '/api/v1/calendar';
        /* =========================
   ✅ Holiday API (공휴일)
========================= */
        const HOLIDAY_API = (year, month) => `${API_BASE}/holidays?year=${year}&month=${month}`;
        const API_DELETE = (schNo, scope) => {
            const params = new URLSearchParams();
            params.set('scope', String(scope || 'PERSONAL').toUpperCase());
            return `${API_BASE}/${schNo}?${params.toString()}`;
        };
        const API_UPDATE = (schNo) => API_BASE + '/' + schNo;

        /* =========================
           ✅ ToDo API (날짜 없는 버전)
        ========================= */
        const TODO_API_BASE = '/api/v1/todos';
        const TODO_API_DONE   = (todoNo) => `${TODO_API_BASE}/${todoNo}/done`;
        const TODO_API_ONE    = (todoNo) => `${TODO_API_BASE}/${todoNo}`;
        const TODO_API_UPDATE = (todoNo) => `${TODO_API_BASE}/${todoNo}`;

        /* =========================
           ✅ 현재 로그인 사용자(me)
        ========================= */
        let CURRENT_ME = null;

        async function loadMe(){
            try{
                const res = await fetch('/api/v1/employees/me', {
                    method:'GET',
                    credentials:'include'
                });

                if (res.status === 401){
                    CURRENT_ME = null;
                    console.warn('ME 401 (unauthorized)');
                    return null;
                }
                if (!res.ok){
                    CURRENT_ME = null;
                    console.warn('ME failed:', res.status, await res.text());
                    return null;
                }

                const json = await res.json();
                CURRENT_ME = (json?.data ?? json);
                console.log('ME=', CURRENT_ME);
                return CURRENT_ME;
            }catch(e){
                CURRENT_ME = null;
                console.warn('ME error:', e);
                return null;
            }
        }

        function getMyRole(){
            return String(CURRENT_ME?.role || '').toUpperCase();
        }
        function isCompanyAdmin(){
            const r = getMyRole();
            return ['COM_ADMIN','SEC_ADMIN','THR_ADMIN'].includes(r);
        }

        /* =========================
           scope 고정색
        ========================= */
        const SCOPE_COLOR = {
            COMPANY: '#2563EB',
            DEPARTMENT: '#16A34A',
            PERSONAL: '#f59e0b',
            HOLIDAY: '#ff0000'
        };
        function scopeColor(scope){
            const s = String(scope || '').toUpperCase();
            return SCOPE_COLOR[s] || '#f59e0b';
        }

        /* =========================
           색 -> 투명 배경(rgba)
        ========================= */
        function hexToRgba(hex, a){
            const h = String(hex || '').replace('#','');
            if (!/^[0-9a-fA-F]{6}$/.test(h)) return `rgba(124,58,237,${a})`;
            const r = parseInt(h.slice(0,2), 16);
            const g = parseInt(h.slice(2,4), 16);
            const b = parseInt(h.slice(4,6), 16);
            return `rgba(${r},${g},${b},${a})`;
        }

        /* =========================
           토글(회사/부서/개인)
        ========================= */
        const selectedScopes = new Set(['COMPANY','DEPARTMENT','PERSONAL']);
        function getSelectedScopes(){ return Array.from(selectedScopes); }

        function setSwitch(el, on){
            el.classList.toggle('on', !!on);
            el.setAttribute('aria-checked', String(!!on));
        }
        function toggleScope(scope, on){
            scope = scope.toUpperCase();
            if (on) selectedScopes.add(scope);
            else selectedScopes.delete(scope);

            if (selectedScopes.size === 0){
                selectedScopes.add(scope);
                setSwitch(scope === 'COMPANY' ? tgCompany : scope === 'DEPARTMENT' ? tgDept : tgPersonal, true);
                return;
            }

            mainCalendar && mainCalendar.refetchEvents();
            refreshMiniDots();
        }

        /* =========================
           날짜 유틸
        ========================= */
        function normalizeApiDatetime(v){
            if (!v) return v;
            const s = String(v).trim();
            return s.replace(/(\.\d+)?(Z|[+-]\d\d:\d\d)$/, '');
        }
        const pad = (n) => String(n).padStart(2, '0');
        function toDateKey(d){
            const dt = (d instanceof Date) ? d : new Date(d);
            return dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate());
        }
        function toDatetimeLocalValue(d) {
            return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        function addDays(input, days){
            // input: Date or "YYYY-MM-DD"
            const d = (input instanceof Date)
                ? new Date(input.getTime())
                : new Date(String(input) + "T00:00:00");

            if (Number.isNaN(d.getTime())) {
                throw new Error("addDays: invalid date input = " + input);
            }

            d.setDate(d.getDate() + days);
            return d.toISOString().slice(0,10); // 항상 YYYY-MM-DD로 반환
        }
        function formatNice(dtStr){
            if (!dtStr) return '';
            return String(dtStr).replace('T',' ').replace(/(\.\d+)?Z?$/,'');
        }

        // ✅ 5분 단위로 바꿀 기준
        const STEP_MINUTES = 5;
        /* =========================
           ✅ ToDo List state
        ========================= */
        const todoEls = {
            list: document.getElementById('todoList'),
            countLabel: document.getElementById('todoCountLabel'),
            input: document.getElementById('todoNewInput'),
            createBtn: document.getElementById('todoCreateBtn'),
        };

        let TODO_ITEMS = [];

        function safeData(json){
            return (json && typeof json === 'object' && 'data' in json) ? json.data : json;
        }

        function normalizeTodo(it){
            return {
                todoNo: it.todoNo ?? it.id ?? it.todo_id,
                title: it.title ?? it.todoTitle ?? it.content ?? '',
                isDone: !!(it.isDone ?? it.done ?? it.completed),
            };
        }

        async function todoFetchAll(){
            const res = await fetch(TODO_API_BASE, { method:'GET', credentials:'include' });
            if (res.status === 401) throw new Error('로그인이 필요해요.');
            if (!res.ok) throw new Error('투두 조회 실패: ' + res.status);
            const json = await res.json();
            const payload = safeData(json);
            return Array.isArray(payload) ? payload.map(normalizeTodo) : [];
        }

        function renderTodo(){
            const items = TODO_ITEMS;

            todoEls.countLabel.textContent = `${items.length}개`;
            todoEls.list.innerHTML = '';

            if (!items || items.length === 0){
                const empty = document.createElement('div');
                empty.className = 'todo-empty';
                empty.textContent = '할 일이 없어요 🙂';
                todoEls.list.appendChild(empty);
                return;
            }

            items.forEach(it => {
                const todoNo = it.todoNo;
                const title = it.title ?? '';
                const isDone = !!it.isDone;

                const row = document.createElement('div');
                row.className = 'todo-item';
                row.dataset.todoNo = String(todoNo);

                const left = document.createElement('div');
                left.className = 'todo-left';

                const ck = document.createElement('input');
                ck.type = 'checkbox';
                ck.className = 'todo-check';
                ck.checked = isDone;

                const text = document.createElement('div');
                text.className = 'todo-text' + (isDone ? ' done' : '');
                text.textContent = title;

                ck.addEventListener('change', async () => {
                    try{
                        await todoSetDone(todoNo, ck.checked);
                        it.isDone = ck.checked;
                        text.classList.toggle('done', ck.checked);
                    }catch(e){
                        ck.checked = !ck.checked;
                        alert(e.message);
                    }
                });

                text.addEventListener('dblclick', () => {
                    if (!todoNo) return;

                    const original = it.title ?? '';
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'todo-edit';
                    input.value = original;

                    text.replaceWith(input);
                    input.focus();
                    input.select();

                    const finish = async (mode) => {
                        const next = (input.value || '').trim();

                        if (mode === 'cancel'){
                            input.replaceWith(text);
                            return;
                        }
                        if (!next){
                            input.value = original;
                            input.replaceWith(text);
                            return;
                        }
                        if (next === original){
                            input.replaceWith(text);
                            return;
                        }

                        try{
                            await todoUpdateTitle(todoNo, next);
                            it.title = next;
                            text.textContent = next;
                            input.replaceWith(text);
                        }catch(e){
                            alert(e.message);
                            input.value = original;
                            input.replaceWith(text);
                        }
                    };

                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter'){
                            e.preventDefault();
                            finish('save');
                        } else if (e.key === 'Escape'){
                            e.preventDefault();
                            finish('cancel');
                        }
                    });
                    input.addEventListener('blur', () => finish('save'));
                });

                left.appendChild(ck);
                left.appendChild(text);

                const actions = document.createElement('div');
                actions.className = 'todo-actions';

                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'todo-del';
                del.textContent = '🗑';
                del.title = '삭제';
                del.addEventListener('click', async () => {
                    if (!confirm('이 투두를 삭제할까?')) return;
                    try{
                        await todoDelete(todoNo);
                        await todoReload();
                    }catch(e){
                        alert(e.message);
                    }
                });

                actions.appendChild(del);

                row.appendChild(left);
                row.appendChild(actions);

                todoEls.list.appendChild(row);
            });
        }

        function openPop(popEl, { anchorRect=null, center=false } = {}){
            showMask();
            popEl.classList.toggle('center', !!center);
            popEl.style.display = 'block';

            if (center){
                popEl.style.left = '50%';
                popEl.style.top = '50%';
                popEl.style.transform = 'translate(-50%,-50%)';
                return;
            }

            const vw = window.innerWidth, vh = window.innerHeight;
            const rect = anchorRect || { left: vw/2, top: vh/2, right: vw/2, bottom: vh/2 };
            const popRect = popEl.getBoundingClientRect();
            const popW = popRect.width || 420;
            const popH = popRect.height || 360;

            let left = rect.right + 12;
            let top  = rect.top;

            if (left + popW > vw - 12) left = rect.left - popW - 12;
            if (left < 12) left = 12;

            if (top + popH > vh - 12) top = vh - popH - 12;
            if (top < 12) top = 12;

            popEl.style.left = left + 'px';
            popEl.style.top = top + 'px';
            popEl.style.transform = 'none';
        }

            popEl.style.display = 'none';
            popEl.classList.remove('center');

        // ✅ 붙여넣기 등으로 넘어가는 케이스 방지(초과 시 잘라내기)
        function clampLen(el, max, key, label){
            if (!el) return;
            el.dataset.overMax = '0';

            const willInsert = (e) => String(e.inputType || '').startsWith('insert');

            // ✅ maxlength가 있어도 "넘기려는 시도"를 잡아냄
            el.addEventListener('beforeinput', (e) => {
                if (!willInsert(e)) return;

                const cur = el.value ?? '';
                const s = (el.selectionStart ?? cur.length);
                const t = (el.selectionEnd ?? cur.length);
                const replacing = Math.max(0, t - s);

                // 선택 영역을 대체하는 경우는 그만큼 길이가 줄어드는 효과
                const effectiveLen = cur.length - replacing;

                if (effectiveLen >= max){
                    // ✅ 토스트 1개만 유지
                    showStickyToast(key, `${label}은(는) 최대 ${max}자까지 입력 가능해요.`, 'warn');
                    el.dataset.overMax = '1';
                }
            });

            // ✅ 정상 길이로 돌아오면 토스트 숨김
            el.addEventListener('input', () => {
                const v = el.value ?? '';
                if (v.length < max){
                    hideStickyToast(key);
                    el.dataset.overMax = '0';
                }
            });
        }

        function initTimeSelects(){
            const hours = Array.from({length:24}, (_,i)=> String(i).padStart(2,'0'));
            const mins = Array.from({length: 60/STEP_MINUTES}, (_,k)=> String(k*STEP_MINUTES).padStart(2,'0')); // ✅ 00,05,10...

            fillSelect(startHourSelect, hours, '시');

        function toLocalDateFromParts(day, hh, mm){
            if (!day || !hh || !mm) return null;
            const s = `${day}T${hh}:${mm}`;
            const d = new Date(s);
            if (Number.isNaN(d.getTime())) return null;
            return d;
        }

        function getDTValue(dayEl, hourEl, minEl){
            const d = dayEl.value;
            const h = hourEl.value;
            const m = minEl.value;
            if (!d || !h || !m) return null;
            return `${d}T${h}:${m}`;
        }

        function setControlsFromDate(dt, dayEl, hourEl, minEl){
            const d = new Date(dt);
            const day = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
            dayEl.value = day;
            hourEl.value = pad(d.getHours());

            // ✅ 5분 단위로 맞추기 (가까운 5분)
            const m = d.getMinutes();
            const rounded = Math.round(m / STEP_MINUTES) * STEP_MINUTES;

            if (rounded >= 60){
                d.setHours(d.getHours() + 1);
                d.setMinutes(0,0,0);
                hourEl.value = pad(d.getHours());
                minEl.value = '00';
            } else {
                minEl.value = pad(rounded);
            }
        }

        function setDTValue(str, dayEl, hourEl, minEl){
            if (!str) return;
            const d = new Date(String(str));
            if (Number.isNaN(d.getTime())) return;

            d.setSeconds(0,0);

            const m = d.getMinutes();
            const rounded = Math.round(m / STEP_MINUTES) * STEP_MINUTES;

            if (rounded >= 60){
                d.setHours(d.getHours()+1);
                d.setMinutes(0,0,0);
            }else{
                d.setMinutes(rounded,0,0);
            }

            setControlsFromDate(d, dayEl, hourEl, minEl);
        }

        /* =========================
           ✅ start/end "서로 제한" (min/max + 옵션 제한)
        ========================= */
        function syncDayMinMax(){
            const sDay = startDayInput.value;
            const eDay = endDayInput.value;

            // 날짜 입력 상호 제한
            endDayInput.min = sDay || '';
            startDayInput.max = eDay || '';
        }

        function syncAllDayMinMax(){
            const sd = startDateInput.value;
            const ed = endDateInput.value;

            // endDate는 startDate 이후만 선택 가능
            endDateInput.min = sd || '';

            // startDate는 endDate 이전만 선택 가능
            startDateInput.max = ed || '';
        }

        let lastAllDayChanged = null; // 'startDate' | 'endDate'

        function enforceAllDayRange(){
            syncAllDayMinMax();

            const sd = startDateInput.value;
            const ed = endDateInput.value;

            // 둘 중 하나라도 없으면 여기까지만
            if (!sd || !ed) return;

            // 문자열(YYYY-MM-DD)은 사전식 비교가 날짜 비교와 동일
            if (ed < sd){
                if (lastAllDayChanged === 'endDate'){
                    // endDate를 바꿨는데 startDate보다 앞이면 startDate를 endDate로 끌어내림
                    startDateInput.value = ed;
                }else{
                    // startDate를 바꿨는데 endDate가 앞이면 endDate를 startDate로 밀어줌
                    endDateInput.value = sd;
                }
                syncAllDayMinMax();
            }
        }

        function resetOptionDisabled(selectEl){
            Array.from(selectEl.options).forEach((opt) => {
                if (opt.value === '') return; // placeholder는 그대로
                opt.disabled = false;

        function disableHoursBefore(selectEl, hh){ // hh 미만 비활성
            Array.from(selectEl.options).forEach(opt => {
                if (!opt.value) return;
                if (Number(opt.value) < hh) opt.disabled = true;
            });
        }
        function disableHoursAfter(selectEl, hh){ // hh 초과 비활성
            Array.from(selectEl.options).forEach(opt => {
                if (!opt.value) return;
                if (Number(opt.value) > hh) opt.disabled = true;
            });
        }
        function disableMinsBefore(selectEl, mm){ // mm 미만 비활성
            Array.from(selectEl.options).forEach(opt => {
                if (!opt.value) return;
                if (Number(opt.value) < mm) opt.disabled = true;
            });
        }
        function disableMinsAfter(selectEl, mm){ // mm 초과 비활성
            Array.from(selectEl.options).forEach(opt => {
                if (!opt.value) return;
                if (Number(opt.value) > mm) opt.disabled = true;
            });
        }

        function updateTimeOptionConstraints(){
            // 기본: 모두 풀기
            resetOptionDisabled(startHourSelect);
            resetOptionDisabled(startMinSelect);
            resetOptionDisabled(endHourSelect);
            resetOptionDisabled(endMinSelect);

            const s = toLocalDateFromParts(startDayInput.value, startHourSelect.value, startMinSelect.value);
            const e = toLocalDateFromParts(endDayInput.value, endHourSelect.value, endMinSelect.value);

            // start가 완성된 경우: end는 start+30분 이후만(같은 날짜일 때 시간 옵션 제한)
            if (s && endDayInput.value){
                const earliest = new Date(s.getTime() + STEP_MINUTES*60*1000);

                if (endDayInput.value === startDayInput.value){
                    const eh = earliest.getHours();
                    const em = earliest.getMinutes();

                    // endHour는 eh 미만 불가
                    disableHoursBefore(endHourSelect, eh);

                    // endHour가 eh면 endMin은 em 미만 불가
                    if (endHourSelect.value === pad(eh)){
                        disableMinsBefore(endMinSelect, em);
                    }

                    // start가 23:30이면 earliest는 다음날 00:00 → 같은날이면 전부 막힐 수 있으니,
                    // 그런 경우는 day 선택이 잘못된거라 enforceRange가 날짜를 밀어줘야 함.
                }
            }

            // end가 완성된 경우: start는 end-30분 이전만(같은 날짜일 때 시간 옵션 제한)
            if (e && startDayInput.value){
                const latest = new Date(e.getTime() - STEP_MINUTES*60*1000);

                if (endDayInput.value === startDayInput.value){
                    const lh = latest.getHours();
                    const lm = latest.getMinutes();

                    // startHour는 lh 초과 불가
                    disableHoursAfter(startHourSelect, lh);

                    // startHour가 lh면 startMin은 lm 초과 불가
                    if (startHourSelect.value === pad(lh)){
                        disableMinsAfter(startMinSelect, lm);
                    }
                }
            }
        }

        // ✅ start/end 서로 앞뒤 못 뒤집게 자동 보정 (30분 최소)
        let lastChanged = null; // 'start' | 'end'
        let lastValidRange = null;

        function captureRange(){
            return {
                sDay: startDayInput.value,
                sH: startHourSelect.value,
                sM: startMinSelect.value,
                eDay: endDayInput.value,
                eH: endHourSelect.value,
                eM: endMinSelect.value
            };
        }

        function restoreRange(side, snap){
            if (!snap) return;

            if (side === 'start'){
                startDayInput.value = snap.sDay || '';
                startHourSelect.value = snap.sH || '';
                startMinSelect.value = snap.sM || '';
            } else {
                endDayInput.value = snap.eDay || '';
                endHourSelect.value = snap.eH || '';
                endMinSelect.value = snap.eM || '';
            }

            syncDayMinMax();
            updateTimeOptionConstraints();
        }
        function enforceRange(){
            syncDayMinMax();
            updateTimeOptionConstraints();

            const s = toLocalDateFromParts(startDayInput.value, startHourSelect.value, startMinSelect.value);
            const e = toLocalDateFromParts(endDayInput.value, endHourSelect.value, endMinSelect.value);

            // 아직 start/end가 완성 전이면 저장만 하지 말고 종료
            if (!s || !e){
                // 둘 다 완성된 상태에서만 lastValidRange를 업데이트하는게 안전
                return;
            }

            // ✅ 규칙: end는 start보다 최소 STEP_MINUTES 이후
            const minEnd = new Date(s.getTime() + STEP_MINUTES * 60 * 1000);

            // ❌ invalid면: 사용자가 바꾼 쪽을 "이전 정상값"으로 되돌림
            if (e.getTime() < minEnd.getTime()){
                // end를 바꾸다가 문제가 생기는 케이스가 많으니 기본은 end 되돌림
                const side = (lastChanged === 'start') ? 'start' : 'end';

                if (lastValidRange){
                    restoreRange(side, lastValidRange);
                    toast(`종료는 시작보다 최소 ${STEP_MINUTES}분 이후여야 해요.`, 'warn');
                } else {
                    // 예외: 정상값이 없으면(거의 없음) end를 최소값으로 보정
                    setControlsFromDate(minEnd, endDayInput, endHourSelect, endMinSelect);
                    syncDayMinMax();
                    updateTimeOptionConstraints();
                    lastValidRange = captureRange();
                    toast(`종료는 시작보다 최소 ${STEP_MINUTES}분 이후여야 해요.`, 'warn');
                }
                return;
            }

            // ✅ valid면 마지막 정상값 업데이트
            lastValidRange = captureRange();
        }

        function bindRangeControls(){
            const onStartChanged = () => { lastChanged = 'start'; enforceRange(); };
            const onEndChanged   = () => { lastChanged = 'end'; enforceRange(); };

            // ✅ change + input 둘 다 (브라우저마다 이벤트 타이밍 차이 보정)
            [startDayInput, startHourSelect, startMinSelect].forEach(el => {
                el.addEventListener('change', onStartChanged);
                el.addEventListener('input', onStartChanged);
            });
            [endDayInput, endHourSelect, endMinSelect].forEach(el => {
                el.addEventListener('change', onEndChanged);
                el.addEventListener('input', onEndChanged);
            });
        }

        function bindAllDayRangeControls(){
            const onStart = () => { lastAllDayChanged = 'startDate'; enforceAllDayRange(); };
            const onEnd   = () => { lastAllDayChanged = 'endDate';  enforceAllDayRange(); };

            [startDateInput].forEach(el => {

        function assertWorkHours(payload){
            if (payload.allDay) return;

            const startStr = payload.startAt;
            const endStr   = payload.endedAt;
            if (!startStr || !endStr) throw new Error("시작/종료 시간이 비어있어요.");

            const start = new Date(startStr);
            const end   = new Date(endStr);

            if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) {
                throw new Error("날짜/시간 형식이 올바르지 않아요.");
            }

            if (end.getTime() <= start.getTime()) {
                throw new Error("종료 시간이 시작 시간보다 빠르거나 같아요.");
            }
        }

        async function apiGetItems({ scope, view, baseDate, weekStart }){
            const params = new URLSearchParams();
            params.set('scope', scope);
            params.set('view', view);
            params.set('baseDate', baseDate);
            params.set('weekStart', weekStart);
            params.set('includeAdjacentInMonth', 'true');

            const res = await fetch(API_BASE + '?' + params.toString(), {
                method: 'GET',
                credentials: 'include'
            });
            if (!res.ok) throw new Error('GET failed: ' + res.status);
            const json = await res.json();
            return (json?.data?.items ?? []);
        }

        async function apiCreate(payload){
            assertWorkHours(payload);
            const res = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(payload)
            });
            if (res.status === 403) throw new Error('권한이 없습니다.');
            if (!res.ok) throw new Error('Create failed: ' + res.status + ' ' + await res.text());
            return await res.json();
        }

        async function apiDelete(schNo, scope){
            const res = await fetch(API_DELETE(schNo, scope), {
                method: 'DELETE',
                credentials: 'include'
            });
            if (res.status === 403) throw new Error('권한이 없습니다.');
            if (!res.ok) throw new Error('Delete failed: ' + res.status + ' ' + await res.text());
            return true;
        }

        async function apiUpdate(schNo, payload){
            assertWorkHours(payload);
            const res = await fetch(API_UPDATE(schNo), {
                method:'PATCH',
                headers:{ 'Content-Type':'application/json' },
                credentials:'include',
                body: JSON.stringify(payload)
            });
            if (res.status === 403) throw new Error('권한이 없습니다.');
            if (!res.ok) throw new Error('Update failed: ' + res.status + ' ' + await res.text());
            return await res.json();
        }

        function ymListBetween(start, end){
            // start/end는 Date
            const out = [];
            const cur = new Date(start.getFullYear(), start.getMonth(), 1);
            const last = new Date(end.getFullYear(), end.getMonth(), 1);
            while (cur <= last){
                out.push({ y: cur.getFullYear(), m: cur.getMonth()+1 });
                cur.setMonth(cur.getMonth()+1);
            }
            return out;
        }
        /* =========================
   ✅ Holiday fetch (FullCalendar event source)
========================= */

        // Date 객체에 days 더하기 (네 addDays는 문자열용이라 별도)
        function addDaysDate(dateObj, days){
            const d = new Date(dateObj);
            d.setDate(d.getDate() + days);
            return d;
        }

        // 'YYYYMMDD' 또는 'YYYY-MM-DD' → 'YYYY-MM-DD'
        function normalizeHolidayDate(v){
            const s = String(v || '').trim();
            if (/^\d{8}$/.test(s)){
                return s.slice(0,4) + '-' + s.slice(4,6) + '-' + s.slice(6,8);
            }
            return s.slice(0,10);
        }

        async function fetchHolidays(info, success, fail) {
            console.log('[HOLIDAY] fetchHolidays called', info.startStr, info.endStr);
            try {
                const months = ymListBetween(info.start, addDaysDate(info.end, -1));
                const results = await Promise.allSettled(
                    months.map(({y,m}) =>
                        fetch(HOLIDAY_API(y, m), { method:'GET', credentials:'include' })
                            .then(res => res.json())
                            .then(json => safeData(json) || [])
                    )
                );

                const items = results
                    .filter(r => r.status === 'fulfilled')
                    .flatMap(r => Array.isArray(r.value) ? r.value : []);

                // ✅ 현재 뷰가 월간인지 확인
                const isMonthView = currentViewType === 'MONTH';

                const events = items.map(h => {
                    const title = h.name ?? h.title ?? h.holidayName ?? '공휴일';
                    const date  = h.date ?? h.locdate ?? h.holidayDate;
                    const yyyyMmDd = normalizeHolidayDate(date);

                    return {
                        id: `HOLIDAY-${yyyyMmDd}`,
                        title: title,
                        start: yyyyMmDd,
                        allDay: true,
                        // ✅ 월간이면 'background', 주간이면 'auto'(일반 일정 형태)
                        display: isMonthView ? 'background' : 'auto',
                        extendedProps: {
                            isHoliday: true,
                            scope: 'HOLIDAY',
                            color: SCOPE_COLOR.HOLIDAY // '#ff0000'
                        }
                    };
                });
                success(events);
            } catch(e) { fail(e); }
        }

        /* =========================
           Fetch events
        ========================= */
        async function fetchEvents(info, success, fail) {
            try {
                let baseDate;

                // ✅ info.view.type 대신 이미 선언된 currentViewType을 사용합니다.
                // currentViewType은 'WEEK' 또는 'MONTH' 값을 가집니다.
                if (currentViewType === 'MONTH') {
                    // ✅ 월간 뷰: info.start 기준 10일 뒤 날짜로 baseDate 설정 (현재 월 보장)
                    const midDate = new Date(info.start);
                    midDate.setDate(midDate.getDate() + 10);
                    baseDate = toDateKey(midDate);
                } else {
                    // ✅ 주간 뷰: 시작일 그대로 사용
                    baseDate = toDateKey(info.start);
                }

                // 2. 현재 뷰 정보 (API 파라미터용)
                // 위에서 분기처리를 했으므로 그대로 사용하거나, 기존처럼 logic 유지
                const view = (currentViewType === 'MONTH') ? 'MONTH' : 'WEEK';
                const scopes = getSelectedScopes();

                console.log(`[API 요청] baseDate: ${baseDate}, view: ${view}`);

                // API 호출
                const calls = scopes.map(s => apiGetItems({
                    scope: s,
                    view: view,
                    baseDate: baseDate,
                    weekStart: weekStart
                }));

                const results = await Promise.all(calls);
                const raw = results.flat();

                const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();

                const events = raw
                    .filter(it => !q
                        || (it.title || '').toLowerCase().includes(q)
                        || (it.content || '').toLowerCase().includes(q)
                    )
                    .map(it => {
                        const scope = String(it.scope || 'PERSONAL').toUpperCase();
                        const id = scope + '-' + String(it.schNo);
                        const color = it.color || scopeColor(scope);

                        const startAtNorm = normalizeApiDatetime(it.startAt);
                        const endedAtNorm = normalizeApiDatetime(it.endedAt);

                        let start = startAtNorm;
                        let end = endedAtNorm;
                        let allDay = !!it.allDay;

                        if (allDay) {
                            const sd = it.startDate || (it.startAt ? String(it.startAt).slice(0, 10) : null);
                            const ed = it.endDate || (it.endedAt ? String(it.endedAt).slice(0, 10) : sd);
                            start = sd;
                            end = ed ? addDays(ed, 1) : (sd ? addDays(sd, 1) : null);
                        }

                        return {
                            id,
                            title: it.title,
                            start,
                            end,
                            allDay,
                            extendedProps: {
                                ...it,
                                id,
                                startAt: startAtNorm,
                                endedAt: endedAtNorm,
                                color
                            }
                        };
                    });

                success(events);
            } catch (e) {
                console.error(e);
                fail(e);
            }
        }

                selectMirror: true,

                // ✅ 클릭도 30분짜리로 바로 모달
                dateClick: function(info){

                        openCreate({ anchorRect, center:false, prefill:{ allDay:true, startDate:d, endDate:d, scope:'PERSONAL' } });
