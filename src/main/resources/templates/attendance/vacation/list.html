<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>내 휴가 관리 - 기업용 전자결재시스템</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* 컨테이너 및 헤더 스타일 */
            .detail-content-area {
                background: white;
                padding: 40px;
                min-height: 850px;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            }

            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 30px;
                border-bottom: 2px solid #339af0;
                padding-bottom: 15px;
            }

            .page-title { font-size: 24px; font-weight: bold; color: #333; margin: 0; }

            /* 휴가 신청 버튼 스타일 */
            .btn-apply {
                background: #339af0;
                color: white;
                padding: 10px 18px;
                border-radius: 6px;
                border: none;
                font-weight: bold;
                font-size: 14px;
                cursor: pointer;
                transition: background 0.2s;
            }
            .btn-apply:hover {
                background: #228be6;
            }

            /* 테이블 공통 스타일 */
            .doc-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
            .doc-table th { background-color: #f8f9fa; color: #495057; font-size: 14px; padding: 15px 12px; border-bottom: 1px solid #dee2e6; white-space: nowrap; }
            /* 모든 td 중앙 정렬 및 여백 최적화 */
            .doc-table td { padding: 18px 8px; text-align: center; border-bottom: 1px solid #eee; font-size: 14px; color: #333; vertical-align: middle; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; }

            /* 버튼 스타일 최적화 (깨짐 방지) */
            .btn-view, .btn-modify, .btn-cancel {
                padding: 8px 12px;
                border: none;
                border-radius: 4px;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
                text-align: center;
                white-space: nowrap;
            }

            .btn-view { background: #339af0; color: white; }
            .btn-view:hover { background: #228be6; }

            .btn-modify { background: #fd7e14; color: white; }
            .btn-modify:hover { background: #e8590c; }

            .btn-cancel { background: #fa5252; color: white; }
            .btn-cancel:hover { background: #e03131; }

            .action-buttons { display: flex; gap: 6px; justify-content: center; align-items: center; }
            .loading { text-align: center; padding: 100px; color: #868e96; font-size: 16px; }

            /* 레이아웃 상속 패딩 정의 */
            .page-with-subbar > div:last-child { background: #f6f7fb; padding: 22px 26px; }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <section class="page-with-subbar">
        <aside th:replace="~{sidebar/attendance-sidebar :: attendanceSidebar('vacations')}"></aside>

        <div>
            <div id="vacation-container" class="detail-content-area">
                <div class="page-header">
                    <h1 class="page-title">내 휴가 관리</h1>
                    <button class="btn-apply" onclick="goToVacationApply()">휴가 신청</button>
                </div>

                <div id="loading" class="loading">휴가 정보를 불러오는 중...</div>

                <table class="doc-table" id="attendance-table" style="display: table;">
                    <thead>
                    <tr>
                        <th style="width: 50px;">NO</th>
                        <th style="width: 130px;">시작일</th>
                        <th style="width: 130px;">종료일</th>
                        <th style="width: 60px;">일수</th>
                        <th style="width: 110px;">대직자</th>
                        <th style="width: 140px;">문서번호</th>
                        <th>문서제목</th>
                        <th style="width: 80px;">문서보기</th>
                        <th style="width: 150px;">관리</th>
                    </tr>
                    </thead>
                    <tbody id="attendance-list">
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</div>

<th:block layout:fragment="pageScripts">
    <script th:inline="javascript">
        let vacationFormDocfoNo = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadVacationFormDocfoNo();
            loadMyVacations();
        });

        async function loadVacationFormDocfoNo() {
            try {
                const response = await fetch('/api/v1/temp/documentForms', { credentials: 'include' });
                const result = await response.json();
                if (response.ok && result.data) {
                    const vacationForm = result.data.find(form => {
                        const normalizedName = form.docfoName.replace(/\s+/g, '').toLowerCase();
                        return normalizedName.includes('휴가신청서');
                    });
                    if (vacationForm) { vacationFormDocfoNo = vacationForm.docfoNo; }
                }
            } catch (error) { console.error('양식 조회 실패:', error); }
        }

        async function loadMyVacations() {
            try {
                const response = await fetch('/api/v1/attendances/me/vacations', { credentials: 'include' });
                const result = await response.json();

                document.getElementById('loading').style.display = 'none';
                renderAttendances(result.data || []);

            } catch (error) {
                console.error('휴가 조회 실패:', error);
                document.getElementById('loading').textContent = '데이터를 불러오는 중 오류가 발생했습니다.';
            }
        }

        function renderAttendances(attendances) {
            const tbody = document.getElementById('attendance-list');
            tbody.innerHTML = '';
            const today = new Date(); today.setHours(0, 0, 0, 0);

            // ✅ 데이터가 없을 때 처리 (헤더 고정)
            if (attendances.length === 0) {
                const emptyTr = document.createElement('tr');
                emptyTr.innerHTML = `
                    <td colspan="9" style="padding: 100px; color: #adb5bd; font-size: 16px;">
                        휴가 정보가 없습니다.
                    </td>
                `;
                tbody.appendChild(emptyTr);
                return;
            }

            attendances.forEach((att, index) => {
                const startDate = new Date(att.startAt); startDate.setHours(0, 0, 0, 0);
                const endDate = new Date(att.endAt); endDate.setHours(0, 0, 0, 0);

                const showModifyButton = (startDate >= today) || (startDate < today && endDate >= today);
                const showCancelButton = startDate >= today;

                let actionButtons = '';
                if (showModifyButton || showCancelButton) {
                    actionButtons = '<div class="action-buttons">';
                    if (showModifyButton) actionButtons += `<button class="btn-modify" onclick="modifyVacation(${att.atteNo})">수정</button>`;
                    if (showCancelButton) actionButtons += `<button class="btn-cancel" onclick="cancelVacation(${att.atteNo})">취소</button>`;
                    actionButtons += '</div>';
                } else {
                    actionButtons = '<span style="color: #adb5bd;">-</span>';
                }

                const tr = document.createElement('tr');
                // ✅ 타입 열을 빼고 대직자 정보를 포함하여 렌더링
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${formatDate(att.startAt)}</td>
                    <td>${formatDate(att.endAt)}</td>
                    <td>${att.day}일</td>
                    <td>${att.delegateEmpName ? `<strong>${att.delegateEmpName}</strong><br><small>${att.delegateEmpId}</small>` : '-'}</td>
                    <td>${att.docId || '-'}</td>
                    <td>${att.docTitle || '-'}</td>
                    <td>${att.docNo ? `<button class="btn-view" onclick="viewDocument(${att.docNo})">보기</button>` : '-'}</td>
                    <td>${actionButtons}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function goToVacationApply() {
            if (!vacationFormDocfoNo) {
                alert('휴가 신청서 양식을 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
                return;
            }
            location.href = `/documents/create?docfoNo=${vacationFormDocfoNo}`;
        }

        function modifyVacation(atteNo) {
            if (!vacationFormDocfoNo) { alert('휴가 신청서 양식을 찾을 수 없습니다.'); return; }
            location.href = `/documents/create?docfoNo=${vacationFormDocfoNo}&atteNo=${atteNo}&category=휴가수정신청`;
        }

        function cancelVacation(atteNo) {
            if (!vacationFormDocfoNo) { alert('휴가 신청서 양식을 찾을 수 없습니다.'); return; }
            location.href = `/documents/create?docfoNo=${vacationFormDocfoNo}&atteNo=${atteNo}&category=휴가취소신청`;
        }

        function viewDocument(docNo) { location.href = `/documents/${docNo}?status=SUBMITTED`; }

        function formatDate(str) {
            if (!str) return '-';
            const d = new Date(str);
            return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}<br><small>${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}</small>`;
        }
    </script>
</th:block>
</body>
</html>
