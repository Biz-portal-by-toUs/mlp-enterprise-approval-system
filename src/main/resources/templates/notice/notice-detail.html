<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">

<th:block layout:fragment="pageStyles">
    <link rel="stylesheet" th:href="@{/css/styles1.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        *{ box-sizing:border-box; }

        .subbar-main{
            flex: 1;
            min-width: 0;
            padding: 24px;
        }

        .notice-detail-wrap{
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 0;
        }

        h2{
            margin: 0 0 14px;
            font-weight: 900;
            letter-spacing: -0.3px;
        }

        .card{
            background: var(--white, #fff);
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            overflow: hidden;
            margin-bottom: 14px;
        }

        .summary-table{
            width:100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .summary-table th,
        .summary-table td{
            border-top: 1px solid rgba(17,24,39,.08);
            padding: 14px 14px;
            vertical-align: middle;
        }
        .summary-table tr:first-child th,
        .summary-table tr:first-child td{ border-top: 0; }
        .summary-table th{
            width: 160px;
            background: rgba(17,24,39,.02);
            font-weight: 900;
            color: #111827;
            text-align: center;
            letter-spacing: -0.2px;
        }
        .summary-table td{
            font-weight: 800;
            color: var(--text, #1f2937);
        }

        .period-inline{
            display:flex;
            align-items:center;
            gap:10px;
            flex-wrap: wrap;
            color: var(--muted, #6b7280);
            font-weight: 900;
        }
        .period-inline .sep{ color: var(--muted, #6b7280); }

        .contents-card{
            background: var(--white, #fff);
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            overflow: hidden;
            margin-bottom: 14px;
        }
        .contents-body{
            padding: 18px;
            background:#fff;
        }

        #noticeDescription{
            white-space: normal;
            line-height: 1.75;
        }
        #noticeDescription .ProseMirror{
            outline:none;
            white-space: pre-wrap;
            line-height: 1.75;
        }
        #noticeDescription h2{
            margin: 12px 0 8px;
            font-size: 1.25rem;
            font-weight: 900;
        }
        #noticeDescription p{ margin: 8px 0; }
        #noticeDescription ul,
        #noticeDescription ol{ padding-left: 22px; margin: 8px 0; }
        #noticeDescription blockquote{
            margin: 10px 0;
            padding: 10px 12px;
            border-left: 4px solid rgba(59,130,246,.35);
            background: rgba(59,130,246,.06);
            border-radius: 10px;
        }
        #noticeDescription pre{
            background: rgba(17,24,39,.06);
            padding: 12px;
            border-radius: 10px;
            overflow:auto;
        }
        #noticeDescription code{
            background: rgba(17,24,39,.06);
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 800;
        }
        #noticeDescription a{
            color: var(--primary2, #2563eb);
            font-weight: 900;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        #noticeDescription table{
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
            margin: 10px 0;
        }
        #noticeDescription th,
        #noticeDescription td{
            border: 1px solid rgba(17,24,39,.18);
            padding: 10px;
            vertical-align: top;
            word-break: break-word;
            position: relative;
        }
        #noticeDescription th{
            background: rgba(17,24,39,.03);
            font-weight: 900;
            color: var(--muted, #6b7280);
        }
        #noticeDescription .selectedCell:after{
            content:"";
            position:absolute;
            inset:0;
            background: rgba(59,130,246,.08);
            pointer-events:none;
        }

        .writer-wrap{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
        }
        .writer-btn{
            appearance:none;
            border: 0;
            background: transparent;
            padding: 0;
            cursor: pointer;
            color: var(--primary2, #2563eb);
            font-weight: 900;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .writer-btn:focus{ outline: none; }

        .tooltip-bubble{
            position: absolute;
            z-index: 50;
            min-width: 220px;
            max-width: 320px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #111827;
            color: #fff;
            box-shadow: 0 16px 36px rgba(0,0,0,.18);
            border: 1px solid rgba(255,255,255,.12);
            transform: translateY(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s ease, transform .15s ease;
        }
        .tooltip-bubble::before{
            content:"";
            position:absolute;
            top: -7px;
            left: 18px;
            width: 12px;
            height: 12px;
            background: #111827;
            transform: rotate(45deg);
            border-left: 1px solid rgba(255,255,255,.12);
            border-top: 1px solid rgba(255,255,255,.12);
        }
        .tooltip-title{
            font-weight: 1000;
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }
        .tooltip-row{
            display:flex;
            justify-content: space-between;
            gap: 10px;
            font-weight: 800;
            font-size: 13px;
            color: rgba(255,255,255,.92);
        }
        .tooltip-row span:first-child{ color: rgba(255,255,255,.70); }

        .tooltip-host{
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .tooltip-host.show .tooltip-bubble{
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .meta-inline{
            display:flex;
            align-items:center;
            gap: 14px;
            flex-wrap: wrap;
            color: var(--muted, #6b7280);
            font-weight: 900;
        }
        .meta-inline .meta-item{
            display:inline-flex;
            align-items:center;
            gap:8px;
        }
        .meta-inline .k{
            color: #111827;
            opacity: .65;
            font-weight: 900;
        }
        .meta-inline .v{
            color: #111827;
            font-weight: 1000;
        }

        .attach-card{
            background: var(--white, #fff);
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            padding: 14px;
            margin-bottom: 14px;
        }
        .attach-head{
            display:flex;
            align-items:center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .attach-title{
            margin:0;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: -0.2px;
        }

        #attachList{
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 10px;
        }
        #attachList th{
            text-align:left;
            font-size: .9rem;
            color: var(--muted, #6b7280);
            background: rgba(17,24,39,.03);
            padding: 12px;
            border-bottom: 1px solid rgba(17,24,39,.08);
            font-weight: 900;
        }
        #attachList td{
            padding: 12px;
            border-bottom: 1px solid rgba(17,24,39,.06);
            font-size: .95rem;
            color: var(--text, #1f2937);
            font-weight: 700;
        }
        #attachList tr:hover td{ background: rgba(59,130,246,.05); }

        .btn{
            appearance:none;
            border: 1px solid rgba(17,24,39,.12);
            background: #fff;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 900;
            color: var(--text, #1f2937);
            text-decoration:none;
            cursor:pointer;
            box-shadow: 0 8px 18px rgba(17,24,39,.06);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
            display:inline-flex;
            align-items:center;
            gap:8px;
        }
        .btn:hover{
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(17,24,39,.10);
            border-color: rgba(59,130,246,.28);
            background: rgba(59,130,246,.05);
        }
        .btn-primary{
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-color: rgba(59,130,246,.25);
            color:#fff;
            box-shadow: 0 12px 24px rgba(59,130,246,.28);
        }
        .btn-primary:hover{
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-color: rgba(59,130,246,.35);
        }
        .btn-danger{
            background: linear-gradient(135deg, rgba(220,38,38,.14), rgba(255,255,255,0));
            border-color: rgba(220,38,38,.25);
            color: #991b1b;
        }
        .btn-danger:hover{
            background: rgba(220,38,38,.06);
            border-color: rgba(220,38,38,.40);
        }
        .btn-sm{
            padding: 8px 10px;
            font-weight: 900;
            border-radius: 8px;
            font-size: 12px;
            box-shadow: 0 6px 14px rgba(17,24,39,.05);
        }

        .actions{
            display:flex;
            justify-content:flex-end;
            gap:10px;
            flex-wrap:wrap;
            margin-top: 10px;
        }

        @media (max-width: 720px){
            .summary-table th{ width: 110px; }
            .tooltip-bubble{ left: 0 !important; right: auto !important; }
        }

        .card.card--overflow-visible{ overflow: visible; }

        .popup-flag{
            display:inline-block;
            padding:4px 10px;
            border-radius:999px;
            font-size:12px;
            font-weight:900;
            color:#fff;
        }
        .popup-flag.on{ background:#16a34a; }
        .popup-flag.off{ background:#9ca3af; }

        #update-btn{ display:none; }
        #delete-btn{ display:none; }

        /* ============================================================
           ✅ PRINT: "공지 상세 영역만" 용지 폭을 강제로 꽉 채우기
           - layout의 max-width/패딩/그리드 영향 완전 차단(visibility + fixed)
           ============================================================ */
        @page{
            size: auto;
            margin: 3mm;
        }

        @media print{
            *{
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            html, body{
                background:#fff !important;
                margin:0 !important;
                padding:0 !important;
                width:100% !important;
            }

            /* ✅ 1) 인쇄 시에는 일단 전부 숨기고(레이아웃 영향 제거) */
            body *{
                visibility: hidden !important;
            }

            /* ✅ 2) print-area만 보이게(그리고 용지 기준으로 고정 배치) */
            #print-area,
            #print-area *{
                visibility: visible !important;
            }

            /* print-area를 페이지 기준으로 고정해서 부모 컨테이너 폭 제한을 무력화 */
            #print-area{
                position: fixed !important;
                left: 0 !important;
                top: 0 !important;
                right: 0 !important;
                width: 100vw !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
            }

            #print-area h2 {
                display: none !important;
            }

            /* ✅ 3) 기존 요청: sidebar/헤더/푸터/네비는 인쇄에 안 나오게(혹시 visibility 누락 대비) */
            header, nav, footer, aside{ display:none !important; }
            [class*="sidebar" i],
            [class*="side-bar" i],
            [class*="sidenav" i],
            [class*="lnb" i],
            [class*="gnb" i],
            [id*="sidebar" i],
            [id*="side" i],
            .subbar-sidebar, .subbar-aside, .subbar-nav{
                display:none !important;
            }

            /* ✅ 4) notice-detail 내부 요소는 폭 100% 강제 */
            .page-with-subbar,
            .subbar-main,
            .notice-detail-wrap{
                width:100% !important;
                max-width:none !important;
                margin:0 !important;
                padding:0 !important;
                float:none !important;
                display:block !important;
            }

            /* 카드: 인쇄에서 꽉 차게 + 깔끔하게 */
            .card, .contents-card, .attach-card{
                width:100% !important;
                max-width:none !important;
                box-shadow:none !important;
                border:1px solid #d1d5db !important;
                border-radius:0 !important;
                margin:0 0 4mm 0 !important;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            .contents-body{ padding:4mm !important; }
            .attach-card{ padding:4mm !important; }

            .summary-table,
            #attachList,
            #noticeDescription table{
                width:100% !important;
                max-width:none !important;
                table-layout:fixed !important;
            }

            .summary-table th, .summary-table td,
            #attachList th, #attachList td,
            #noticeDescription th, #noticeDescription td{
                word-break:break-word !important;
                overflow-wrap:anywhere !important;
            }

            /* 툴팁 숨기고 작성자 클릭 비활성(텍스트만) */
            .tooltip-bubble{ display:none !important; }
            .writer-btn{
                color:#111827 !important;
                text-decoration:none !important;
                cursor:default !important;
                pointer-events:none !important;
            }

            /* ✅ 작성자 이름이 세로로(한 글자씩 줄바꿈) 되는 현상 방지 */
            #noticeWriter,
            #noticeWriterBtn,
            .writer-btn {
                display: inline-block !important;
                writing-mode: horizontal-tb !important; /* 혹시라도 writing-mode 영향 있으면 차단 */
                white-space: nowrap !important;         /* 줄바꿈 금지 */
                word-break: keep-all !important;        /* 한글 글자 단위 쪼개기 방지 */
                letter-spacing: normal !important;
            }

            /* (옵션) 작성자 셀이 너무 좁아지는 경우 대비 */
            .summary-table td {
                overflow: visible !important;
            }

            /* 액션 버튼 인쇄 제외 */
            .actions{ display:none !important; }

            /* 첨부파일 표: 인쇄 시 미리보기/다운로드 컬럼 숨김 */
            #attachList th:nth-child(4),
            #attachList td:nth-child(4),
            #attachList th:nth-child(5),
            #attachList td:nth-child(5){
                display:none !important;
            }

            #noticeDescription .selectedCell:after{ background:transparent !important; }

            #noticeDescription a{
                color:#111827 !important;
                text-decoration:underline !important;
            }
        }
    </style>
</th:block>

<th:block layout:fragment="pageScripts">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- TipTap viewer (원본 그대로) -->
    <script type="module">
        import { Editor } from "https://esm.sh/@tiptap/core@2.11.5";
        import StarterKit from "https://esm.sh/@tiptap/starter-kit@2.11.5";
        import Underline from "https://esm.sh/@tiptap/extension-underline@2.11.5";
        import TextAlign from "https://esm.sh/@tiptap/extension-text-align@2.11.5";
        import Table from "https://esm.sh/@tiptap/extension-table@2.11.5";
        import TableRow from "https://esm.sh/@tiptap/extension-table-row@2.11.5";
        import TableHeader from "https://esm.sh/@tiptap/extension-table-header@2.11.5";
        import TableCell from "https://esm.sh/@tiptap/extension-table-cell@2.11.5";

        let viewer = null;

        function ensureViewer(){
            if (viewer) return viewer;
            const host = document.querySelector("#noticeDescription");
            viewer = new Editor({
                element: host,
                editable: false,
                extensions: [
                    StarterKit,
                    Underline,
                    TextAlign.configure({ types: ["heading","paragraph"] }),
                    Table.configure({ resizable: true }),
                    TableRow, TableHeader, TableCell,
                ],
                content: { type:"doc", content:[{ type:"paragraph" }] },
            });
            return viewer;
        }

        function isProbablyJson(str){
            if (typeof str !== "string") return false;
            const s = str.trim();
            if (!s) return false;
            if (!(s.startsWith("{") || s.startsWith("["))) return false;
            try{
                const obj = JSON.parse(s);
                return !!obj && typeof obj === "object" && (obj.type === "doc" || obj.content);
            }catch{ return false; }
        }

        function isProbablyHtml(str){
            if (typeof str !== "string") return false;
            const s = str.trim();
            if (!s) return false;
            return /<\/?[a-z][\s\S]*>/i.test(s);
        }

        function escapeHtml(str){
            return String(str ?? "")
                .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
                .replaceAll('"',"&quot;").replaceAll("'","&#039;");
        }

        window.renderNoticeContentsAuto = (contents)=>{
            const host = document.querySelector("#noticeDescription");

            if (contents == null) {
                host.innerHTML = "<p>-</p>";
                return;
            }

            if (typeof contents === "object") {
                const ed = ensureViewer();
                ed.commands.setContent(contents);
                return;
            }

            const raw = String(contents);

            if (isProbablyJson(raw)) {
                const ed = ensureViewer();
                ed.commands.setContent(JSON.parse(raw));
                return;
            }

            if (isProbablyHtml(raw)) {
                if (viewer) { viewer.destroy(); viewer = null; host.innerHTML = ""; }
                host.innerHTML = raw;
                return;
            }

            if (viewer) { viewer.destroy(); viewer = null; host.innerHTML = ""; }
            host.innerHTML = `<p>${escapeHtml(raw).replaceAll("\n","<br>")}</p>`;
        };
    </script>

        function setupWriterTooltip() {
            const host = document.getElementById("writerTooltipHost");
            const btn = document.getElementById("noticeWriterBtn");

            function show() { host.classList.add("show"); }
            function hide() { host.classList.remove("show"); }
            function toggle() { host.classList.toggle("show"); }

            host.addEventListener("mouseenter", show);
            host.addEventListener("mouseleave", hide);

            btn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggle();
            });

            document.addEventListener("click", (e) => {
                if (!host.contains(e.target)) hide();
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") hide();
            });
        }

        async function loadPlaceDetail(){
            try{
                const response = await fetch(`${API_BASE}/api/v1/notice/${noticeNo}`, {
                    method: 'GET',
                    credentials: "include",
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (result.status === 200 && result.data) {
                    const notice = result.data;

                    $('#noticeTitle').text(notice.title ?? "-");

                    if (window.renderNoticeContentsAuto) window.renderNoticeContentsAuto(notice.contents);
                    else $('#noticeDescription').text(notice.contents ?? "");

                    const isPopup = notice.isPopup === true || notice.isPopup === 'true';
                    $('#noticePopup').html(
                        isPopup
                            ? `<span class="popup-flag on">사용</span>`
                            : `<span class="popup-flag off">미사용</span>`
                    );

                    $('#noticeStarted').text(notice.startedAt ? notice.startedAt.substring(0,10) : "-");
                    $('#noticeEnded').text(notice.endedAt ? notice.endedAt.substring(0,10) : "-");

                    $('#noticeWriter').text(notice.empName ?? "-");
                    $('#noticeWriterId').text(notice.empId ?? "-");
                    $('#noticeDepart').text(notice.depName ?? "-");

                    $('#noticeCreated').text(notice.createdAt ? notice.createdAt.substring(0,10) : "-");
                    $('#noticeUpdated').text(notice.updatedAt ? notice.updatedAt.substring(0,10) : "-");
                    $('#noticeRating').text(notice.rating ?? "-");

                    initAttach();
                    setupWriterTooltip();
                    updateDeleteButtonVisibility(notice);
                }
            }catch(e){
                console.error(e);
                alert("상세 로딩 중 오류가 발생했습니다.");
            }
        }

        function updateDeleteButtonVisibility(notice) {
            const updateBtn = document.getElementById("update-btn");
            const deleteBtn = document.getElementById("delete-btn");
            if (!updateBtn) return;
            if (!deleteBtn) return;

            const isWriter =
                currentEmpId != null &&
                String(notice.empId) === String(currentEmpId);

            if (isAdmin === true || isWriter) {
                updateBtn.style.display = "inline-flex";
                deleteBtn.style.display = "inline-flex";
            } else {
                updateBtn.style.display = "none";
                deleteBtn.style.display = "none";
            }
        }

        document.getElementById('update-btn').onclick = () => {
            location.href = `/notice/update/${noticeNo}`;
        };

        function unwrapMaybeResponseDto(obj) {
            if (obj && typeof obj === "object" && "data" in obj) return obj.data;
            return obj;
        }

        async function initAttach(){
            try{
                const response = await fetch(`${API_BASE}/api/v1/attachments?domain=NOTICE&entityId=${noticeNo}`, {
                    method:'GET',
                    credentials:"include",
                    headers:{ 'Content-Type': 'application/json' }
                });

                const result = await response.json();
                const attachList = $('#attachList').empty();

                if (result.status === 200 && result.data?.length) {
                    const attachs = result.data;

                    attachList.append(`
            <tr>
              <th style="width:90px;">번호</th>
              <th>파일명</th>
              <th style="width:120px;">size</th>
              <th style="width:110px;">미리보기</th>
              <th style="width:110px;">다운로드</th>
            </tr>
          `);

                    attachs.forEach((r, index) => {
                        attachList.append(`
              <tr>
                <td>${index+1}</td>
                <td>${r.originalName}</td>
                <td>${formatFileSize(r.size)}</td>
                <td><button type="button" class="btn btn-sm" data-view="${r.attachmentId}">미리보기</button></td>
                <td><button type="button" class="btn btn-sm" data-down="${r.attachmentId}">다운로드</button></td>
              </tr>
            `);
                    });

                    document.querySelectorAll("button[data-down]").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            const attachmentId = Number(e.currentTarget.getAttribute("data-down"));
                            await downAttachment(attachmentId);
                        });
                    });

                    document.querySelectorAll("button[data-view]").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            const attachmentId = Number(e.currentTarget.getAttribute("data-view"));
                            await viewAttachment(attachmentId);
                        });
                    });

                } else {
                    attachList.html('<tr><td colspan="5">관련 첨부파일이 없습니다.</td></tr>');
                }
            }catch(e){
                console.error(e);
            }
        }

        function formatFileSize(bytes) {
            if (bytes == null || isNaN(bytes)) return "-";
            if (bytes < 1024) return `${bytes} B`;
            const kb = bytes / 1024;
            if (kb < 1024) return `${kb.toFixed(1)} KB`;
            const mb = kb / 1024;
            return `${mb.toFixed(1)} MB`;
        }

        async function fetchDownloadUrl(attachmentId) {
            const res = await fetch(`${API_BASE}/api/v1/attachments/${attachmentId}/download-url`, {
                method:"GET",
                credentials:"include",
                headers:{ 'Accept': 'application/json' }
            });
            if (!res.ok) throw new Error("download-url 호출 실패: " + await res.text());
            const raw = await res.json();
            const data = unwrapMaybeResponseDto(raw);
            const url = data.url;
            if (typeof url !== "string" || !url.startsWith("http")) throw new Error("응답에 url이 없습니다.");
            return { url, meta: data };
        }

        async function fetchPreviewUrl(attachmentId) {
            const res = await fetch(`${API_BASE}/api/v1/attachments/${attachmentId}/preview-url`, {
                method:"GET",
                credentials:"include",
                headers:{ 'Accept': 'application/json' }
            });
            if (!res.ok) throw new Error("preview-url 호출 실패: " + await res.text());
            const raw = await res.json();
            const data = unwrapMaybeResponseDto(raw);
            const url = data.url;
            if (typeof url !== "string" || !url.startsWith("http")) throw new Error("응답에 url이 없습니다.");
            return { url, meta: data };
        }

        async function downAttachment(attachmentId){
            if (!attachmentId) return;
           // if (!confirm(`attachmentId=${attachmentId} 파일을 다운로드 할까요?`)) return;

            const result = await Swal.fire({
                title: '첨부 파일',
                text: '파일을 다운로드 하시겠습니까?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#339af0',
                cancelButtonColor: '#adb5bd',
                confirmButtonText: '확인',
                cancelButtonText: '취소',
                reverseButtons: true
            });

            // 🔴 취소 / ESC / 바깥 클릭 → 즉시 종료
            if (!result.isConfirmed) return;

            try{
                const { url, meta } = await fetchDownloadUrl(attachmentId);
                const a = document.createElement("a");
                a.href = url;
                a.rel = "noopener";
                a.download = meta.originalName || "";
                document.body.appendChild(a);
                a.click();
                a.remove();
            }catch(e){
                console.error(e);
                alert("다운로드 중 오류: " + (e?.message ?? e));
            }
        }

        async function viewAttachment(attachmentId){
            if (!attachmentId) return;
            try{
                const { url } = await fetchPreviewUrl(attachmentId);
                window.open(url, "_blank", "noopener");
            }catch(e){
                console.error(e);
                alert("미리보기 중 오류: " + (e?.message ?? e));
            }
        }

        async function deleteNotice(){
           // if (!confirm("정말 삭제하시겠습니까?")) return;

            const result = await Swal.fire({
                title: '공지사항 삭제 ',
                text: '정말 삭제하시겠습니까?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#339af0',
                cancelButtonColor: '#adb5bd',
                confirmButtonText: '삭제',
                cancelButtonText: '취소',
                reverseButtons: true

            });

            // 🔴 취소 / ESC / 바깥 클릭 → 즉시 종료
            console.log("result1", result);
            if (!result.isConfirmed) return;
            console.log("result2", result);

            try{
                const res = await fetch(`/api/v1/notice/${noticeNo}`, {
                    method:"DELETE",
                    credentials:"include"
                });

                if (res.ok) {
                    //alert("공지사항이 삭제되었습니다.");
                    await Swal.fire({
                        icon: 'success',
                        title: '완료',
                        text: '공지사항이 삭제되었습니다.',
                        confirmButtonColor: '#339af0',
                        //timer: 1000,
                        showConfirmButton: true
                    });
                    window.location.href = "/notice/list";
                } else {
                    alert("삭제 실패했습니다.");
                }
            }catch(e){
                console.error(e);
                alert("삭제 중 오류 발생");
            }
        }

        function setupPrintButton(){
            const btn = document.getElementById("print-btn");
            if (!btn) return;
            btn.addEventListener("click", () => window.print());
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadPlaceDetail();
            setupPrintButton();
        });
    </script>
</th:block>
