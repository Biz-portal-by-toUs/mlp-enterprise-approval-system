<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>주소 검색중...</title></head>
<body onload="init();">

<form id="form" name="form" method="post">
    <input type="hidden" name="confmKey" th:value="${apiKey}"/>
    <input type="hidden" name="returnUrl" id="returnUrl" value=""/>
    <input type="hidden" name="resultType" value="4"/>
</form>

<script th:inline="javascript">
    function init(){
        const inputData = [[${inputData}]]; // Map이 JS 객체로 인라인됨
        const returnUrlFromServer = [[${returnUrl}]];

        const isEmpty =
            (inputData == null) ||
            (typeof inputData === 'object' && Object.keys(inputData).length === 0);

        if(isEmpty){
            console.log(returnUrlFromServer);
            document.getElementById("returnUrl").value = returnUrlFromServer;
            document.form.action = "https://business.juso.go.kr/addrlink/addrLinkUrl.do";
            document.form.submit();
        } else {
            window.opener.jusoCallBack(
                inputData.roadAddrPart1[0],
                inputData.addrDetail[0],
                inputData.zipNo[0]
            );
            window.close();
        }
    }
</script>

</body>
</html>
