<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>문서양식 목록</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
            background: #fff;
        }
        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 24px;
        }
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        button, select {
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 14px;
            border: 1px solid #e6e6e6;
            background: #fff;
            cursor: pointer;
        }
        button:hover { background: #f7f7f7; }

        .filters {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .filters .hint { font-size: 12px; color: #777; }

        .list {
            display: grid;
            gap: 10px;
        }
        .item {
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 12px 14px;
            cursor: pointer;
        }
        .item:hover { background: #fafafa; }
        .title { font-weight: 700; }
        .meta { margin-top: 4px; font-size: 12px; color: #777; display: flex; gap: 10px; flex-wrap: wrap; }
        .empty { color: #777; padding: 18px 0; }

        .pager {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            gap: 10px;
        }
        .pager .info { font-size: 12px; color: #777; }
        .pager .btns { display:flex; gap:8px; }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid #eaeaea;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>

<body>
<div class="wrap">
    <div class="top">
        <h2 style="margin:0;">문서양식 목록</h2>
        <button id="openEditor">양식 생성하기</button>
    </div>

    <div class="filters">
        <select id="stat">
            <option value="A">승인(A)</option>
            <option value="P">대기(P)</option>
            <option value="T">임시(T)</option>
            <option value="R">반려(R)</option>
            <option value="D">삭제(D)</option>
            <option value="">전체(서버 기본)</option>
        </select>

        <select id="size">
            <option value="15" selected>15개</option>
            <option value="30">30개</option>
            <option value="50">50개</option>
        </select>

        <button id="refresh">새로고침</button>
        <span class="hint">※ 목록 데이터는 GET /forms 로 조회합니다.</span>
    </div>

    <div id="list" class="list"></div>

    <div class="pager">
        <div class="info" id="pageInfo">-</div>
        <div class="btns">
            <button id="prev">이전</button>
            <button id="next">다음</button>
        </div>
    </div>
</div>

<script>
    // ====== 라우팅/엔드포인트 설정 ======
    const API_LIST = '/forms'; // GET /forms?stat=A&page=0&size=15

    // 상세 화면 라우팅은 프로젝트에 맞게 1줄만 바꾸면 됨.
    // 예시1) FrontController가 /document-form/manager/forms/{docfoNo} 를 받는 경우:
    // const DETAIL_URL = (docfoNo) => `/document-form/manager/forms/${encodeURIComponent(docfoNo)}`;

    // 예시2) detail.html 라우팅을 /document-form/manager/form/detail?docfoNo= 로 받는 경우:
    const DETAIL_URL = (docfoNo) => `/document-form/manager/form/detail?docfoNo=${encodeURIComponent(docfoNo)}`;

    // make-form 팝업 라우팅
    const MAKE_FORM_URL = '/document-form/manager/form/make-form';

    // ====== 상태 ======
    let currentPage = 0;
    let totalPages = 0;

    // ====== 이벤트 ======
    document.getElementById('openEditor').addEventListener('click', () => {
        const w = Math.floor(window.screen.width * 0.8);
        const h = Math.floor(window.screen.height * 0.8);
        const l = Math.floor((window.screen.width - w) / 2);
        const t = Math.floor((window.screen.height - h) / 2);

        window.open(
            MAKE_FORM_URL,
            'templateEditor',
            `width=${w},height=${h},left=${l},top=${t},resizable=yes,scrollbars=yes`
        );
    });

    document.getElementById('refresh').addEventListener('click', () => {
        currentPage = 0;
        loadForms();
    });

    document.getElementById('stat').addEventListener('change', () => {
        currentPage = 0;
        loadForms();
    });

    document.getElementById('size').addEventListener('change', () => {
        currentPage = 0;
        loadForms();
    });

    document.getElementById('prev').addEventListener('click', () => {
        if (currentPage <= 0) return;
        currentPage -= 1;
        loadForms();
    });

    document.getElementById('next').addEventListener('click', () => {
        if (currentPage >= totalPages - 1) return;
        currentPage += 1;
        loadForms();
    });

    // ====== 동작 ======
    function openForm(docfoNo) {
        window.open(
            DETAIL_URL(docfoNo),
            '_blank',
            'width=1100,height=800,resizable=yes,scrollbars=yes'
        );
    }

    async function loadForms() {
        const listEl = document.getElementById('list');
        const pageInfoEl = document.getElementById('pageInfo');

        listEl.innerHTML = '';
        pageInfoEl.textContent = '로딩 중...';

        const stat = document.getElementById('stat').value;
        const size = document.getElementById('size').value;

        const qs = new URLSearchParams();
        if (stat !== '') qs.set('stat', stat);
        qs.set('page', String(currentPage));
        qs.set('size', String(size));

        const res = await fetch(`${API_LIST}?${qs.toString()}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                // 인증 필요하면 여기 추가:
                // 'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
            }
        });

        if (!res.ok) {
            const txt = await res.text();
            listEl.innerHTML = `<div class="empty">목록 조회 실패: ${res.status}<br/>${escapeHtml(txt)}</div>`;
            pageInfoEl.textContent = '-';
            return;
        }

        const page = await res.json(); // Spring Page 형태 기대
        const items = page.content || [];
        currentPage = page.number ?? currentPage;
        totalPages = page.totalPages ?? 0;

        pageInfoEl.textContent =
            `페이지 ${currentPage + 1} / ${Math.max(totalPages, 1)} · 총 ${page.totalElements ?? items.length}건`;

        if (!items || items.length === 0) {
            listEl.innerHTML = `<div class="empty">조회 결과가 없습니다.</div>`;
            return;
        }

        // ⚠️ 필드명은 네 ListResDto에 맞게 조정하면 됨.
        // 여기서는 흔히 쓰는 이름들(docfoNo/docfoName/writerId/docfoStat/createdAt)을 우선 사용.
        listEl.innerHTML = items.map(x => {
            const id = x.docfoNo ?? x.id ?? '';
            const title = (x.docfoName && String(x.docfoName).trim()) ? x.docfoName : `양식 #${id}`;
            const writer = x.writerId ?? '';
            const statBadge = x.docfoStat ?? x.stat ?? '';
            const createdAt = x.createdAt ?? x.savedAt ?? '';

            return `
        <div class="item" onclick="openForm('${escapeJs(id)}')">
          <div class="title">${escapeHtml(title)}</div>
          <div class="meta">
            ${statBadge ? `<span class="badge">상태: ${escapeHtml(statBadge)}</span>` : ''}
            ${writer ? `<span>작성자: ${escapeHtml(writer)}</span>` : ''}
            ${createdAt ? `<span>일자: ${escapeHtml(createdAt)}</span>` : ''}
            <span>ID: ${escapeHtml(id)}</span>
          </div>
        </div>
      `;
        }).join('');
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (m) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[m]));
    }

    function escapeJs(str) {
        // onclick에 안전하게 넣기 위한 최소 처리
        return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    // 초기 로드
    loadForms();
</script>
</body>
</html>
