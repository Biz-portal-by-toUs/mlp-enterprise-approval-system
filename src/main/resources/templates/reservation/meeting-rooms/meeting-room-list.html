<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8" />
    <title>회의실 조회</title>

    <!-- 이 페이지 전용 CSS -->
    <th:block layout:fragment="pageStyles">
        <style>
            :root {
                --blue: #1677ff; /* 이 페이지에서만 사용할 파랑 */
            }

            .facility-page {
                padding: 18px 20px;
            }

            .page-title{
                font-size:20px;
                font-weight:800;
                margin:2px 0 14px;
            }

            .field label{font-size:12px;color:#6b7280}
            .field input{
                border:none;outline:none;font-size:13px;width:110px;
            }

            .btn{
                border:1px solid #e5e7eb;
                background:#fff;
                border-radius:12px;
                padding:9px 12px;
                cursor:pointer;
                font-size:13px;
            }
            .btn.primary{
                background:var(--blue);
                border-color:var(--blue);
                color:#fff;
            }
            .btn:disabled{opacity:.5;cursor:not-allowed}

            .grid{
                display:grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap:16px;
            }
            @media (max-width: 1100px){
                .grid{grid-template-columns: repeat(2, minmax(0,1fr));}
            }
            @media (max-width: 720px){
                .grid{grid-template-columns: 1fr;}
            }

            .card{
                background:#ffffff;
                border:1px solid #e5e7eb;
                border-radius:14px;
                overflow:hidden;
                box-shadow:0 6px 18px rgba(0,0,0,.08);
                display:flex;
                flex-direction:column;
                min-height:320px;
            }
            .thumb{
                height:160px;
                background:#e5e7eb;
                display:flex;
                align-items:center;
                justify-content:center;
            }
            .thumb img{width:100%;height:100%;object-fit:cover;display:block}
            .thumb .ph{color:#6b7280;font-size:12px}
            .card-body{
                padding:12px 14px;
                display:flex;
                flex-direction:column;
                gap:8px;
            }
            .room-name{font-weight:800}
            .meta{
                font-size:12px;
                color:#6b7280;
                line-height:1.45;
            }
            .meta b{color:#111827;font-weight:700}
            .divider{height:1px;background:#e5e7eb;margin:2px 0}

            .paging{
                margin-top:16px;
                display:flex;
                align-items:center;
                justify-content:center;
                gap:8px;
                flex-wrap:wrap;
            }
            .page-btn{
                min-width:36px;
                height:36px;
                border-radius:10px;
                border:1px solid #e5e7eb;
                background:#fff;
                cursor:pointer;
                font-size:13px;
            }
            .page-btn.active{
                background:var(--blue);
                border-color:var(--blue);
                color:#fff;
                font-weight:700;
            }

            .error{
                margin:12px 0;
                padding:10px 12px;
                border:1px solid #fecaca;
                background:#fff1f2;
                color:#991b1b;
                border-radius:12px;
                display:none;
            }

            /* 카드 선택 */
            .card.selectable {
                cursor: pointer;
            }
            .card.selected {
                outline: 3px solid var(--blue);
            }
            .card.selectable:hover {
                box-shadow: 0 0 0 2px rgba(22,119,255,.4);
            }

            /* 관리자 액션 바 */
            .action-bar {
                display: none;                 /* JS에서 제어 */
                justify-content: flex-end;     /* 오른쪽 정렬 */
                align-items: center;
                gap: 10px;
                margin-top: 12px;
                margin-bottom: 12px;
                padding-right: 4px;
            }

            .action-bar .action-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 8px 14px;
                border-radius: 8px;
                border: none;
                font-size: 14px;
                cursor: pointer;
                background-color: var(--blue);
                color: #fff;
                transition: background-color 0.2s ease;
            }
            .action-bar .action-btn:hover:not(:disabled) {
                background-color: #4096ff;
            }
            .action-bar .action-btn:disabled {
                background-color: #e5e7eb;
                color: #9ca3af;
                cursor: not-allowed;
            }
            .action-bar .action-btn.danger:not(:disabled) {
                background-color: #ef4444;
            }

            /* 모달 배경 */
            .modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000;
            }
            .hidden {
                display: none;
            }

            .modal-content {
                background: #fff;
                padding: 24px;
                border-radius: 10px;
                width: 360px;
                text-align: center;
            }
            .modal-title {
                margin-bottom: 12px;
                color: #d32f2f;
            }
            .modal-text {
                margin-bottom: 20px;
                font-size: 14px;
                line-height: 1.5;
            }
            .modal-actions {
                display: flex;
                justify-content: space-between;
                gap: 12px;
            }
            .btn.cancel {
                background: #e0e0e0;
                color: #333;
            }
            .btn.cancel:hover {
                background: #cfcfcf;
            }
            .btn.delete {
                background: #d32f2f;
                color: #fff;
            }
            .btn.delete:hover {
                background: #b71c1c;
            }
            .btn:hover {
                transform: translateY(-1px);
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <!-- 🔹 왼쪽: 예약 서브 사이드바 (공유 시설 조회 active) -->
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('facility')"></aside>

        <!-- 🔹 오른쪽: 회의실 조회 화면 -->
        <div class="facility-page">
            <div class="page-title">회의실</div>

            <div class="error" id="errBox"></div>

            <section class="grid" id="grid"></section>

            <div id="actionBar" class="action-bar">
                <button id="btnCreate" class="action-btn primary">등록</button>
                <button id="btnEdit" class="action-btn primary" disabled>선택 수정</button>
                <button id="btnDelete" class="action-btn danger" disabled>선택 삭제</button>
            </div>

            <div class="paging" id="paging"></div>
        </div>
    </section>

    <!-- 삭제 확인 모달 -->
    <div id="deleteModal" class="modal hidden">
        <div class="modal-content">
            <h3 class="modal-title">⚠️ 회의실 삭제</h3>
            <p class="modal-text">
                회의실을 삭제하면 <b>되돌릴 수 없습니다.</b><br>
                정말 삭제하시겠습니까?
            </p>

            <div class="modal-actions">
                <button id="confirmDeleteBtn" class="btn delete">삭제</button>
                <button id="cancelDeleteBtn" class="btn cancel">취소</button>
            </div>
        </div>
    </div>
</div>

<!-- 이 페이지 전용 JS (조회 화면 그대로) -->
<th:block layout:fragment="pageScripts">
    <script>
        let selectedRoomNo = null;
        let isAdmin = false;

        const NO_IMAGE_URL = "/images/no-image.png";
        const API_BASE = "";   // 같은 서버면 "" 사용, 필요하면 "http://localhost:8090"

        const grid   = document.getElementById("grid");
        const paging = document.getElementById("paging");
        const errBox = document.getElementById("errBox");

        let state = {
            page: 0,
            size: 6,
            totalPages: 0
        };

        function showError(msg){
            errBox.style.display = "block";
            errBox.textContent = msg;
        }
        function clearError(){
            errBox.style.display = "none";
            errBox.textContent = "";
        }

        function cardTemplate(room){
            const safe = (v) => (v ?? "") === "" ? "-" : v;

            return `
      <article class="card ${isAdmin ? "selectable" : ""}" data-room-no="${room.roomNo}">
        <div class="thumb">
          <img
            src="${room.imageUrl || NO_IMAGE_URL}"
            onerror="this.src='${NO_IMAGE_URL}'"
            alt="회의실 이미지"
          />
        </div>
        <div class="card-body">
          <div class="room-name">회의실명: ${safe(room.roomName)}</div>
          <div class="divider"></div>
          <div class="meta"><b>위치:</b> ${safe(room.location)}</div>
          <div class="meta"><b>수용인원:</b> ${safe(room.capacity)}명</div>
          <div class="meta"><b>주요 장비:</b> ${safe(room.equipList)}</div>
          <div class="meta"><b>특이사항:</b> ${safe(room.note)}</div>
        </div>
      </article>
    `;
        }

        function renderGrid(content){
            grid.innerHTML = content.map(cardTemplate).join("");
        }

        function enableSelection(){
            if (!isAdmin) return;

            document.querySelectorAll(".card.selectable").forEach(card => {
                card.addEventListener("click", () => {
                    document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
                    card.classList.add("selected");

                    selectedRoomNo = card.dataset.roomNo;

                    document.getElementById("btnEdit").disabled   = false;
                    document.getElementById("btnDelete").disabled = false;
                });
            });
        }

        function renderPaging(current, total){
            paging.innerHTML = "";
            if (total <= 1) return;

            const mkBtn = (label, onClick, disabled=false, active=false) => {
                const b = document.createElement("button");
                b.className = "page-btn" + (active ? " active" : "");
                b.textContent = label;
                b.disabled = disabled;
                b.addEventListener("click", onClick);
                return b;
            };

            paging.appendChild(mkBtn("‹", () => loadRooms(current - 1), current === 0));

            const windowSize = 5;
            const start = Math.max(0, current - Math.floor(windowSize/2));
            const end   = Math.min(total - 1, start + windowSize - 1);
            const realStart = Math.max(0, end - windowSize + 1);

            for(let p = realStart; p <= end; p++){
                paging.appendChild(
                    mkBtn(String(p+1), () => loadRooms(p), false, p === current)
                );
            }

            paging.appendChild(mkBtn("›", () => loadRooms(current + 1), current >= total - 1));
        }

        async function loadRooms(page){
            clearError();

            selectedRoomNo = null;
            document.getElementById("btnEdit").disabled   = true;
            document.getElementById("btnDelete").disabled = true;

            const url = `${API_BASE}/api/v1/meeting-rooms?page=${page}&size=${state.size}`;

            try{
                const res = await fetch(url, {
                    method: "GET",
                    credentials: "include"       // 쿠키 자동 전송
                });

                if (res.status === 401) {
                    showError("로그인이 필요합니다.");
                    return;
                }

                if (!res.ok) {
                    showError(`조회 실패 (${res.status})`);
                    return;
                }

                const json = await res.json();

                isAdmin = json.data.isAdmin === true;
                document.getElementById("actionBar").style.display =
                    isAdmin ? "flex" : "none";

                const pageData = json.data.data;
                const content  = pageData.content ?? [];

                renderGrid(content);
                enableSelection();

                state.totalPages = pageData.totalPages ?? 0;
                renderPaging(pageData.number ?? page, state.totalPages);

            }catch(e){
                showError("서버 연결 실패. (네트워크 / 쿠키 / 포트 확인)");
            }
        }

        document.getElementById("btnCreate").onclick = () => {
            location.href = "/meeting-rooms/register";
        };

        document.getElementById("btnEdit").onclick = () => {
            if (!selectedRoomNo) return;
            location.href = `/meeting-rooms/${selectedRoomNo}/edit`;
        };

        /* ---------------- 삭제 모달 ---------------- */

        const deleteModal       = document.getElementById("deleteModal");
        const cancelDeleteBtn   = document.getElementById("cancelDeleteBtn");
        const confirmDeleteBtn  = document.getElementById("confirmDeleteBtn");

        function openDeleteModal() {
            deleteModal.classList.remove("hidden");
        }

        document.getElementById("btnDelete").onclick = () => {
            if (!selectedRoomNo) return;
            openDeleteModal();
        };

        cancelDeleteBtn.addEventListener("click", () => {
            deleteModal.classList.add("hidden");
        });

        confirmDeleteBtn.addEventListener("click", async () => {
            try {
                const res = await fetch(`${API_BASE}/api/v1/meeting-rooms/${selectedRoomNo}`, {
                    method: "DELETE",
                    credentials: "include"
                });

                if (res.status === 401) {
                    alert("로그인이 필요합니다.");
                    location.href = "/login";
                    return;
                }

                if (!res.ok) {
                    alert("삭제에 실패했습니다.");
                    return;
                }

                alert("회의실이 삭제되었습니다.");
                deleteModal.classList.add("hidden");

                selectedRoomNo = null;
                document.getElementById("btnEdit").disabled   = true;
                document.getElementById("btnDelete").disabled = true;

                loadRooms(state.page);

            } catch (e) {
                alert("삭제 중 오류가 발생했습니다.");
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                deleteModal.classList.add("hidden");
            }
        });

        loadRooms(0);
    </script>
</th:block>

</body>
</html>
