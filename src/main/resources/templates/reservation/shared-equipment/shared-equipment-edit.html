<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>공유 설비 수정</title>

    <!-- 이 페이지 전용 CSS -->
    <th:block layout:fragment="pageStyles">
        <style>
            .shared-eq-edit-page {
                padding: 24px 26px;
                background: #f4f6f8;
                min-height: 100%;
                display: flex;
                justify-content: center;
                align-items: flex-start;
            }

            .shared-eq-edit-page .card {
                width: 520px;
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.12);
                padding: 28px;
            }

            .shared-eq-edit-page .form-inner {
                max-width: 420px;
                margin: 0 auto;
            }

            .shared-eq-edit-page input,
            .shared-eq-edit-page textarea {
                width: 100%;
                box-sizing: border-box;
            }

            .shared-eq-edit-page .image-preview {
                width: 100%;
                height: 220px;
                background: #e5e7eb;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .shared-eq-edit-page .image-preview img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }

            .shared-eq-edit-page h2 {
                margin-top: 0;
                text-align: center;
            }

            .shared-eq-edit-page .field {
                margin-bottom: 14px;
            }

            .shared-eq-edit-page label {
                display: block;
                font-size: 13px;
                margin-bottom: 6px;
                color: #555;
            }

            .shared-eq-edit-page input,
            .shared-eq-edit-page textarea {
                width: 100%;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #ddd;
                font-size: 14px;
            }

            .shared-eq-edit-page textarea { resize: none; }

            .shared-eq-edit-page .btns {
                display: flex;
                gap: 10px;
                margin-top: 18px;
            }

            .shared-eq-edit-page button {
                flex: 1;
                padding: 10px;
                border-radius: 8px;
                border: none;
                font-size: 14px;
                cursor: pointer;
            }

            .shared-eq-edit-page .submit {
                background: #1677ff;
                color: #fff;
                cursor: pointer;
            }

            .shared-eq-edit-page .submit.disabled {
                background: #a5c8ff;
                cursor: not-allowed;
            }

            .shared-eq-edit-page .cancel {
                background: #e5e7eb;
            }

            .shared-eq-edit-page .preview-box {
                width: 100%;
                height: 220px;
                background: #e5e7eb;
                border-radius: 12px;
                overflow: hidden;
                margin-top: 10px;
            }

            .shared-eq-edit-page .preview-box img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: none;
            }

            /* ===== 설비명/설비번호만: 힌트/카운터/에러/UI ===== */
            .hint-row{
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-top:6px;
                gap:10px;
            }

            .hint{
                color:#6b7280;
                font-size:12px;
            }

            .counter{
                color:#6b7280;
                font-size:12px;
                font-variant-numeric: tabular-nums;
            }

            .error{
                display:block;
                margin-top:6px;
                color:#ef4444;
                font-size:12px;
                font-weight:600;
            }

            .input-invalid{
                border-color:#ef4444 !important;
                box-shadow: 0 0 0 3px rgba(239,68,68,.12);
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <!-- 🔹 왼쪽: 예약 서브 사이드바 (공유 설비 예약 active) -->
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('equipment')"></aside>

        <!-- 🔹 오른쪽: 공유 설비 수정 화면 -->
        <div class="shared-eq-edit-page">
            <div class="card">
                <h2>공유 설비 수정</h2>

                <form id="editForm" enctype="multipart/form-data">
                    <!-- ✅ 설비명: 카운터+에러 적용 -->
                    <div class="field">
                        <label>설비명</label>
                        <input type="text" name="eqName" id="eqName" maxlength="20" required>
                        <div class="hint-row">
                            <small class="hint">최대 20자까지 입력 가능</small>
                            <small class="counter" id="eqNameCounter">0 / 20</small>
                        </div>
                        <small class="error" id="eqNameError" style="display:none;"></small>
                    </div>

                    <!-- ✅ 설비번호: 카운터+에러 적용 -->
                    <div class="field">
                        <label>설비번호</label>
                        <input type="text" name="eqId" id="eqId" maxlength="20">
                        <div class="hint-row">
                            <small class="hint">최대 20자까지 입력 가능</small>
                            <small class="counter" id="eqIdCounter">0 / 20</small>
                        </div>
                        <small class="error" id="eqIdError" style="display:none;"></small>
                    </div>

                    <div class="field">
                        <label>모델명</label>
                        <input type="text" name="modelName" maxlength="20">
                    </div>

                    <div class="field">
                        <label>보관위치</label>
                        <input type="text" name="location" maxlength="50">
                    </div>

                    <div class="field">
                        <label>공유 설비 이미지</label>
                        <input type="file"
                               name="imageFile"
                               id="imageFile"
                               accept="image/*"
                               onchange="previewImage(this)">
                    </div>

                    <div class="preview-box">
                        <img id="imagePreview" alt="미리보기 이미지" />
                    </div>

                    <div class="btns">
                        <button type="submit" class="submit disabled" disabled>수정</button>
                        <button type="button" class="cancel" onclick="history.back()">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>

<!-- 이 페이지 전용 JS -->
<th:block layout:fragment="pageScripts">
    <script th:inline="javascript">
        /* ================== 공통 변수 ================== */
        const eqNo = /*[[${eqNo}]]*/ null;

        // ✅ httpOnly cookie 기반 공통 fetch
        const API_BASE = window.location.origin;

        async function apiFetch(path, options = {}) {
            const url = API_BASE + path;

            const res = await fetch(url, {
                ...options,
                credentials: "include",
                headers: { ...(options.headers || {}) }
            });

            if (res.status === 401 || res.status === 403) {
                alert("로그인이 필요합니다. 다시 로그인 해주세요.");
                location.href = "/login";
                throw new Error("UNAUTHORIZED");
            }
            return res;
        }

        if (!eqNo) {
            alert("잘못된 접근입니다.");
            location.href = "/shared-equipment";
        }

        /* ================== 이미지 미리보기 ================== */
        function previewImage(input) {
            const preview = document.getElementById("imagePreview");

            if (!input.files || !input.files[0]) {
                preview.style.display = "none";
                preview.src = "";
                return;
            }

            const file = input.files[0];

            if (!file.type.startsWith("image/")) {
                alert("이미지 파일만 업로드 가능합니다.");
                input.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        }

        /* ================== 설비명/설비번호: 카운터/에러 UI ================== */
        const eqNameInput   = document.getElementById("eqName");
        const eqNameCounter = document.getElementById("eqNameCounter");
        const eqNameError   = document.getElementById("eqNameError");

        const eqIdInput   = document.getElementById("eqId");
        const eqIdCounter = document.getElementById("eqIdCounter");
        const eqIdError   = document.getElementById("eqIdError");

        function setError(inputEl, errorEl, msg) {
            if (!errorEl) return;

            if (msg) {
                errorEl.textContent = msg;
                errorEl.style.display = "block";
                inputEl?.classList.add("input-invalid");
            } else {
                errorEl.textContent = "";
                errorEl.style.display = "none";
                inputEl?.classList.remove("input-invalid");
            }
        }

        function updateEqNameUI() {
            if (!eqNameInput) return;

            const len = eqNameInput.value.length;
            if (eqNameCounter) eqNameCounter.textContent = `${len} / 20`;

            if (!eqNameInput.value.trim()) {
                setError(eqNameInput, eqNameError, "");
                return;
            }

            if (len > 20) setError(eqNameInput, eqNameError, "설비명은 20자 이내여야 합니다.");
            else setError(eqNameInput, eqNameError, "");
        }

        function updateEqIdUI() {
            if (!eqIdInput) return;

            const len = eqIdInput.value.length;
            if (eqIdCounter) eqIdCounter.textContent = `${len} / 20`;

            if (!eqIdInput.value.trim()) {
                setError(eqIdInput, eqIdError, "");
                return;
            }

            if (len > 20) setError(eqIdInput, eqIdError, "설비번호는 20자 이내여야 합니다.");
            else setError(eqIdInput, eqIdError, "");
        }

        eqNameInput?.addEventListener("input", updateEqNameUI);
        eqIdInput?.addEventListener("input", updateEqIdUI);

        /* ================== 유효성 검사 (알럿 -> 인라인 에러로) ================== */
        function validateEditForm() {
            const name = eqNameInput.value.trim();
            const id   = eqIdInput.value.trim();

            updateEqNameUI();
            updateEqIdUI();

            if (!name) {
                setError(eqNameInput, eqNameError, "설비명을 입력해주세요.");
                eqNameInput.focus();
                return false;
            }
            if (name.length > 20) {
                setError(eqNameInput, eqNameError, "설비명은 20자 이내여야 합니다.");
                eqNameInput.focus();
                return false;
            }
            if (id.length > 20) {
                setError(eqIdInput, eqIdError, "설비번호는 20자 이내여야 합니다.");
                eqIdInput.focus();
                return false;
            }
            return true;
        }

        /* ================== 페이지 로드시 데이터 조회 ================== */
        let originalData = null;

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await apiFetch(`/api/v1/shared-equipment/${eqNo}`, { method: "GET" });

                if (!res.ok) {
                    const text = await res.text();
                    console.error("[load fail]", res.status, text);
                    alert("공유 설비 정보를 불러오지 못했습니다.");
                    return;
                }

                const json = await res.json();
                const eq = json.data ?? json;

                eqNameInput.value = eq.eqName ?? "";
                eqIdInput.value   = eq.eqId ?? "";
                document.querySelector("[name=modelName]").value = eq.modelName ?? "";
                document.querySelector("[name=location]").value  = eq.location ?? "";

                // ✅ 초기 카운터/에러 UI 반영
                updateEqNameUI();
                updateEqIdUI();

                originalData = {
                    eqName: (eq.eqName ?? ""),
                    eqId: (eq.eqId ?? ""),
                    modelName: (eq.modelName ?? ""),
                    location: (eq.location ?? ""),
                    imageChanged: false
                };

                if (eq.imageUrl) {
                    const preview = document.getElementById("imagePreview");
                    preview.src = eq.imageUrl;
                    preview.style.display = "block";
                }

            } catch (e) {
                console.error(e);
                alert("서버 오류가 발생했습니다.");
            }
        });

        /* ================== 수정 submit ================== */
        document.getElementById("editForm").addEventListener("submit", async e => {
            e.preventDefault();
            if (!validateEditForm()) return;

            const formData = new FormData(e.target);

            try {
                const res = await apiFetch(`/api/v1/shared-equipment/${eqNo}`, {
                    method: "PUT",
                    body: formData
                });

                if (!res.ok) {
                    const text = await res.text();
                    console.error("[update fail]", res.status, text);
                    alert("공유 설비 수정 실패했습니다.");
                    return;
                }

                alert("공유 설비 수정 성공했습니다!");
                location.href = "/shared-equipment";

            } catch (e) {
                console.error(e);
                if (String(e.message || "").includes("UNAUTHORIZED")) return;
                alert("서버 오류가 발생했습니다.");
            }
        });

        /* ================== 변경 감지(버튼 enable/disable) ================== */
        function hasChanged() {
            if (!originalData) return false;

            const current = {
                eqName: eqNameInput.value.trim(),
                eqId: eqIdInput.value.trim(),
                modelName: document.querySelector("[name=modelName]").value.trim(),
                location: document.querySelector("[name=location]").value.trim(),
                imageChanged: document.querySelector("[name=imageFile]").files.length > 0
            };

            return (
                current.eqName !== originalData.eqName ||
                current.eqId !== originalData.eqId ||
                current.modelName !== originalData.modelName ||
                current.location !== originalData.location ||
                current.imageChanged
            );
        }

        const submitBtn = document.querySelector(".submit");

        function updateSubmitButton() {
            if (hasChanged()) {
                submitBtn.disabled = false;
                submitBtn.classList.remove("disabled");
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add("disabled");
            }
        }

        document
            .querySelectorAll(
                "input[name=eqName], input[name=eqId], input[name=modelName], input[name=location]"
            )
            .forEach(el => el.addEventListener("input", updateSubmitButton));

        document
            .querySelector("[name=imageFile]")
            .addEventListener("change", updateSubmitButton);
    </script>
</th:block>

</body>
</html>
