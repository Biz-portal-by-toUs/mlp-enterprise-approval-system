<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Main</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
            background: #fff;
        }
        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 24px;
        }
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        button {
            padding: 12px 18px;
            font-size: 15px;
            border-radius: 14px;
            border: 1px solid #e6e6e6;
            background: #fff;
            cursor: pointer;
        }
        button:hover { background: #f7f7f7; }

        .list {
            display: grid;
            gap: 10px;
        }
        .item {
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 12px 14px;
            cursor: pointer;
        }
        .item:hover { background: #fafafa; }
        .title { font-weight: 700; }
        .meta { margin-top: 4px; font-size: 12px; color: #777; display: flex; gap: 10px; flex-wrap: wrap; }
        .empty { color: #777; padding: 18px 0; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <h2 style="margin:0;">템플릿 목록</h2>
        <button id="openEditor">템플릿 생성하기</button>
    </div>

    <div id="list" class="list"></div>
</div>

<script>
    document.getElementById('openEditor').addEventListener('click', () => {
        const w = Math.floor(window.screen.width * 0.8);
        const h = Math.floor(window.screen.height * 0.8);
        const l = Math.floor((window.screen.width - w) / 2);
        const t = Math.floor((window.screen.height - h) / 2);

        // form-list.html 과 web-editor.html이 같은 폴더라는 전제
        window.open(
            'create-docform.html',
            'templateEditor',
            `width=${w},height=${h},left=${l},top=${t},resizable=yes,scrollbars=yes`
        );
    });

    function openTemplate(id) {
        window.open(
            `/api/tiptap/templates/${encodeURIComponent(id)}/view`,
            '_blank',
            'width=1100,height=800,resizable=yes,scrollbars=yes'
        );
    }

    async function loadTemplates() {
        const listEl = document.getElementById('list');
        listEl.innerHTML = '';

        const res = await fetch('/api/tiptap/templates');
        if (!res.ok) {
            listEl.innerHTML = `<div class="empty">목록 조회 실패: ${res.status}</div>`;
            return;
        }
        const items = await res.json();

        if (!items || items.length === 0) {
            listEl.innerHTML = `<div class="empty">저장된 템플릿이 없습니다.</div>`;
            return;
        }

        listEl.innerHTML = items.map(x => {
            const title = (x.docTitle && x.docTitle.trim()) ? x.docTitle : x.id;
            const type = x.selectedType || '';
            const savedAt = x.savedAt || '';
            return `
          <div class="item" onclick="openTemplate('${x.id}')">
            <div class="title">${escapeHtml(title)}</div>
            <div class="meta">
              ${type ? `<span>유형: ${escapeHtml(type)}</span>` : ''}
              ${savedAt ? `<span>저장: ${escapeHtml(savedAt)}</span>` : ''}
              <span>ID: ${escapeHtml(x.id)}</span>
            </div>
          </div>
        `;
        }).join('');
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (m) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[m]));
    }

    loadTemplates();
</script>
</body>
</html>
