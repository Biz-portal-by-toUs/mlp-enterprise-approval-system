<!-- templates/layout.html -->
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bizportal</title>

    <style>
        :root{
            --primary:#2f6fda;
            --bg:#f3f5f9;
            --white:#fff;
            --text:#111;
            --muted:#6b7280;
            --line:#e5e7eb;

            --sidebar-w:72px;
            --topbar-h:64px;
            --footer-h:76px;
            --radius:14px;
            --shadow:0 10px 25px rgba(0,0,0,.12);
        }

        *{box-sizing:border-box}
        html,body{height:100%}
        body{
            margin:0;
            font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
            background:var(--bg);
            color:var(--text);
        }

        .app{
            min-height:100vh;
            display:grid;
            grid-template-rows: var(--topbar-h) 1fr auto;
        }

        /* ====== 상단 헤더 ====== */
        .topbar{
            height:var(--topbar-h);
            background:var(--primary);
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 16px;
            gap:12px;
        }

        /* 왼쪽: 런처 + 로고 */
        .topbar-left{
            display:flex;
            align-items:center;
            gap:12px;
            min-width:220px;
        }
        .launcher-btn{
            width:36px;height:36px;
            border:0;
            border-radius:10px;
            background:rgba(255,255,255,.16);
            color:#fff;
            cursor:pointer;
            display:grid;
            place-items:center;
        }
        .brand{
            display:flex;
            align-items:center;
            gap:10px;
            font-weight:900;
            letter-spacing:.2px;
            user-select:none;
        }
        .brand .logo-box{
            width:30px;height:30px;
            border-radius:10px;
            background:#fff;
            color:var(--primary);
            display:grid;
            place-items:center;
            font-weight:900;
        }

        /* ✅ [수정] Bizportal 글자 더 크게 */
        .brand a{
            color:#fff;
            text-decoration:none;
            font-size:20px;       /* 기존보다 크게 */
            line-height:1;
        }

        /* ====== 가운데: 검색 영역 ====== */
        .topbar-center{
            flex:1;
            display:flex;
            justify-content:flex-start;  /* ✅ [수정] 중앙정렬 → 왼쪽 붙이기 */
        }

        /* ✅ [수정] 검색바를 더 작게 + Bizportal 쪽으로 붙이기 */
        .search{
            width:min(520px, 100%);     /* 기존 720 → 520 */
            margin-left:10px;           /* 로고 쪽으로 살짝 붙이기 */
            display:flex;
            align-items:center;
            background:#fff;
            border-radius:999px;
            padding:6px 10px;           /* 살짝 슬림하게 */
            gap:8px;
            box-shadow:0 6px 16px rgba(0,0,0,.14);
        }
        .search .scope{
            border:0;
            background:#f3f4f6;
            border-radius:999px;
            padding:7px 10px;
            font-size:12px;
            color:#374151;
            outline:none;
        }
        .search input{
            border:0;
            outline:none;
            flex:1;
            font-size:13px;             /* 살짝 작게 */
            padding:7px 6px;
        }
        .search .icon{
            width:18px;height:18px;
            opacity:.7;
        }

        /* 오른쪽: 알림 + 프로필 + 로그아웃 */
        .topbar-right{
            display:flex;
            align-items:center;
            gap:10px;
            min-width:220px;
            justify-content:flex-end;
        }
        .icon-btn{
            width:38px;height:38px;
            border:0;
            border-radius:999px;
            background:rgba(255,255,255,.16);
            color:#fff;
            cursor:pointer;
            display:grid;
            place-items:center;
            position:relative;
        }
        .badge{
            position:absolute;
            right:6px; top:6px;
            width:9px;height:9px;
            background:#ef4444;
            border-radius:50%;
            border:2px solid var(--primary);
        }

        /* 프로필 이미지 */
        .avatar{
            width:38px;height:38px;
            border-radius:999px;
            background:rgba(255,255,255,.22);
            border:0;
            padding:0;
            cursor:pointer;
            user-select:none;
            overflow:hidden;
            display:grid;
            place-items:center;
            position:relative;
        }
        .avatar-img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:none;
        }
        .avatar-fallback{
            display:grid;
            place-items:center;
            width:100%;
            height:100%;
        }
        .avatar-fallback svg{
            width:18px;
            height:18px;
            opacity:.95;
        }

        .logout{
            border:0;
            border-radius:999px;
            padding:10px 14px;
            background:rgba(255,255,255,.16);
            color:#fff;
            cursor:pointer;
            font-weight:700;
        }

        /* ====== 본문 ====== */
        .body{
            display:grid;
            grid-template-columns: var(--sidebar-w) 1fr;
            min-height: calc(100vh - var(--topbar-h));
        }

        .iconbar{
            background:#f8fafc;
            border-right:1px solid var(--line);
            padding:10px 0;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:10px;
        }
        .nav-item{
            width:52px;
            padding:8px 0;
            border-radius:16px;
            text-align:center;
            text-decoration:none;
            color:#1f2937;
            font-size:12px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:6px;
        }
        .nav-item:hover{background:#eef2ff;}
        .nav-item .nav-ico{
            width:34px;height:34px;
            border-radius:999px;
            background:var(--primary);
            color:#fff;
            display:grid;
            place-items:center;
            box-shadow:0 8px 18px rgba(47,111,218,.28);
            font-weight:900;
            line-height:1;
        }
        .nav-item.active{
            background:#e8f0ff;
            outline:2px solid rgba(47,111,218,.18);
        }

        .content-wrap{
            padding:22px 26px;
            position:relative;
        }
        .content-surface{
            min-height: calc(100vh - var(--topbar-h) - var(--footer-h) - 44px);
        }

        /* ====== 하단 푸터 ====== */
        .footer{
            background:#fff;
            border-top:1px solid var(--line);
            padding:14px 18px;
        }
        .footer-inner{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:16px;
            flex-wrap:wrap;
        }

        /* ✅ 배너를 "이미지 그대로" 넣기 */
        .banners{
            display:flex;
            align-items:center;
            gap:14px;
            flex-wrap:wrap;
            margin-left:70px;
        }

        /* a 태그를 버튼처럼 */
        /* a 태그를 배너 카드처럼 */
        .banner-btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;

            width: min(240px);
            height:64px;

            padding:6px;                    /* ✅ 테두리 안쪽 여백 */
            background:#fff;                /* ✅ 바깥 배경 흰색 유지 */
            border:1px solid #d1d5db;   /* ✅ 테두리 */
            border-radius:18px;             /* ✅ 둥근 테두리 */
            box-shadow:0 8px 18px rgba(0,0,0,.06);  /* ✅ 은은한 그림자 */

            text-decoration:none;
            transition:transform .15s ease, box-shadow .15s ease;
        }

        .banner-btn:hover{
            transform:translateY(-1px);
            box-shadow:0 12px 24px rgba(0,0,0,.10);
        }

        /* PNG 이미지 */
        .banner-img{
            width:100%;
            height:100%;
            object-fit:contain;
            display:block;
            border-radius:14px;  /* ✅ 안쪽 이미지도 살짝 둥글게 (옵션) */
        }

        .footer-links{
            display:flex;
            align-items:center;
            gap:10px;
            color:var(--muted);
            font-size:12px;
            flex-wrap:wrap;
        }
        .footer-links a{
            color:var(--muted);
            text-decoration:none;
        }
        .footer-links a:hover{text-decoration:underline;}

        /* ====== 챗봇 ====== */
        .chat-fab{
            position:fixed;
            right:18px;
            bottom:18px;
            width:52px;height:52px;
            border-radius:999px;
            border:0;
            background:#e8f0ff;
            color:var(--primary);
            box-shadow:var(--shadow);
            cursor:pointer;
            display:grid;
            place-items:center;
            z-index:50;
        }
        .chat-panel{
            position:fixed;
            right:18px;
            bottom:80px;
            width:320px;
            max-width: calc(100vw - 36px);
            height:420px;
            max-height: calc(100vh - 140px);
            background:#fff;
            border:1px solid var(--line);
            border-radius:18px;
            box-shadow:var(--shadow);
            overflow:hidden;
            display:none;
            z-index:50;
        }
        .chat-panel.open{display:block;}
        .chat-head{
            padding:12px 14px;
            background:#f8fafc;
            border-bottom:1px solid var(--line);
            display:flex;
            align-items:center;
            justify-content:space-between;
            font-weight:800;
        }
        .chat-body{
            padding:12px 14px;
            font-size:13px;
            color:#374151;
        }
        .chat-close{
            border:0;
            background:transparent;
            cursor:pointer;
            font-size:18px;
            color:#6b7280;
        }

        @media (max-width: 860px){
            .topbar-left,.topbar-right{min-width:auto}
            .search{box-shadow:none; width:min(420px, 100%); margin-left:8px;}
            .brand a{font-size:18px;}
        }
    </style>
</head>

<body>

<div id="me"
     style="display:none"
     th:attr="data-emp-no=${(#authentication != null and #authentication.principal != null) ? #authentication.principal.subjectId : ''}">
</div>

<div class="app">

    <header class="topbar">
        <div class="topbar-left">
            <button class="launcher-btn" type="button" id="launcherBtn" aria-label="메뉴 열기">
                <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/>
                    <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
                    <circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
                </svg>
            </button>

            <div class="brand">
                <div class="logo-box">B</div>
                <a th:href="@{/employees}" href="/employees">Bizportal</a>
            </div>
        </div>

        <div class="topbar-center">
            <form class="search" action="#" method="get">
                <select class="scope" name="scope" aria-label="검색 범위">
                    <option value="label">Label</option>
                    <option value="all">All</option>
                </select>

                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" stroke-width="2"/>
                    <path d="M20 20L17 17" stroke-width="2" stroke-linecap="round"/>
                </svg>

                <input type="text" name="q" placeholder="Search" autocomplete="off"/>
            </form>
        </div>

        <div class="topbar-right">
            <button class="icon-btn" type="button" aria-label="알림">
                <span class="badge" aria-hidden="true"></span>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" aria-hidden="true">
                    <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7" stroke-width="2" stroke-linecap="round"/>
                    <path d="M13.73 21a2 2 0 01-3.46 0" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <button class="avatar" type="button" title="마이페이지"
                    onclick="location.href='/employees/mypage'">
                <img id="profileImg" class="avatar-img" alt="profile"/>
                <span id="profileFallback" class="avatar-fallback" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="8" r="4" stroke-width="2"/>
                        <path d="M4 21c2-4 6-6 8-6s6 2 8 6" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
            </button>

            <form id="logoutForm" th:action="@{/auth/logout}" method="post" style="display:inline;">
                <input type="hidden" id="csrfParam" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" id="csrfHeader" th:if="${_csrf != null}"
                       th:value="${_csrf.headerName}" />
                <button class="logout" type="submit">로그아웃</button>
            </form>
        </div>
    </header>

    <div class="body">
        <aside class="iconbar" aria-label="메인 메뉴">
            <a class="nav-item" th:href="@{/document-forms}" href="/document-forms">
                <div class="nav-ico">✓</div><div>결재</div>
            </a>
            <a class="nav-item" th:href="@{/meeting}" href="/meeting">
                <div class="nav-ico">💬</div><div>회의</div>
            </a>
            <a class="nav-item" th:href="@{/mail}" href="/mail">
                <div class="nav-ico">✉</div><div>메일</div>
            </a>
            <a class="nav-item" th:href="@{/form/forms}" href="/form/forms">
                <div class="nav-ico">📄</div><div>문서함</div>
            </a>
            <a class="nav-item" th:href="@{/share}" href="/share">
                <div class="nav-ico">☁</div><div>공유함</div>
            </a>
            <a class="nav-item" th:href="@{/calendar}" href="/calendar">
                <div class="nav-ico">📅</div><div>캘린더</div>
            </a>
            <a class="nav-item" th:href="@{/board/list}" href="/board/list">
                <div class="nav-ico">🧾</div><div>게시판</div>
            </a>
            <a class="nav-item" th:href="@{/reservation/meeting-rooms/meeting-room-reservation}"
               href="/reservation/meeting-rooms/meeting-room-reservation">
                <div class="nav-ico">🕒</div><div>예약</div>
            </a>
            <a class="nav-item" th:href="@{/attendance}" href="/attendance">
                <div class="nav-ico">🧳</div><div>근태</div>
            </a>
            <a class="nav-item" th:href="@{/org}" href="/org">
                <div class="nav-ico">👥</div><div>조직도</div>
            </a>

            <a class="nav-item"
               sec:authorize="hasRole('COM_ADMIN')"
               th:href="@{/admin/departments/list}" href="/admin/departments/list">
                <div class="nav-ico">⚙</div>
                <div>관리자</div>
            </a>
        </aside>

        <main class="content-wrap">
            <div class="content-surface" layout:fragment="content">
                <h2 style="margin:0 0 8px 0;">콘텐츠 영역</h2>
                <p style="margin:0;color:var(--muted);">
                    각 기능 페이지에서 <code>layout:fragment="content"</code> 로 이 영역을 덮어씌웁니다.
                </p>
            </div>
        </main>
    </div>

    <footer class="footer">
        <div class="footer-inner">
            <div class="banners">
                <a class="banner-btn" href="https://www.nts.go.kr" target="_blank" rel="noopener" aria-label="국세청">
                    <img class="banner-img"
                         th:src="@{/images/nts.png}" src="/images/nts.png"
                         alt="국세청 배너" />
                </a>

                <a class="banner-btn" href="https://www.gov.kr" target="_blank" rel="noopener" aria-label="정부24">
                    <img class="banner-img"
                         th:src="@{/images/gov25.png}" src="/images/gov25.png"
                         alt="정부24 배너" />
                </a>
            </div>

            <div class="footer-links">
                <a th:href="@{/policy/privacy}" href="/policy/privacy">개인정보 처리방침</a>
                <span>·</span>
                <span>버전: <strong>1.0.0</strong></span>
                <span>·</span>
                <a th:href="@{/policy/terms}" href="/policy/terms">이용약관</a>
            </div>
        </div>
    </footer>

</div>

<div class="chat-panel" id="chatPanel" aria-label="챗봇">
    <div class="chat-head">
        <span>챗봇</span>
        <button class="chat-close" type="button" aria-label="닫기" onclick="toggleChat(false)">×</button>
    </div>
    <div class="chat-body">
        <p style="margin:0 0 8px 0;">챗봇 위젯 영역 (예시)</p>
        <p style="margin:0;color:var(--muted);">실제 채팅 컴포넌트로 교체하세요.</p>
    </div>
</div>

<button class="chat-fab" type="button" aria-label="챗봇 열기" onclick="toggleChat()">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" aria-hidden="true">
        <path d="M21 15a4 4 0 01-4 4H8l-5 3V7a4 4 0 014-4h10a4 4 0 014 4z" stroke-width="2" stroke-linejoin="round"/>
    </svg>
</button>

<script>
    function toggleChat(force) {
        const panel = document.getElementById('chatPanel');
        const open = typeof force === 'boolean' ? force : !panel.classList.contains('open');
        panel.classList.toggle('open', open);
    }

    document.getElementById('launcherBtn')?.addEventListener('click', () => {
        alert('런처 버튼 동작은 필요 시 연결하세요.');
    });

    document.getElementById('logoutForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();

        const form = e.currentTarget;
        const url = form.getAttribute('action') || '/auth/logout';

        const csrfParamEl = document.getElementById('csrfParam');
        const csrfHeaderEl = document.getElementById('csrfHeader');

        const headers = { 'Accept': 'application/json' };
        if (csrfParamEl && csrfHeaderEl) {
            headers[csrfHeaderEl.value] = csrfParamEl.value;
        }

        try {
            await fetch(url, {
                method: 'POST',
                credentials: 'include',
                headers
            });
        } finally {
            location.href = '/auth/employee/login';
        }
    });

    async function loadProfilePhoto() {
        const meEl = document.getElementById('me');
        const empNo = meEl?.dataset?.empNo;
        if (!empNo) return;

        const BASE = '/api/v1/attachments';

        const img = document.getElementById('profileImg');
        const fallback = document.getElementById('profileFallback');
        if (!img || !fallback) return;

        function showFallback() {
            img.style.display = 'none';
            fallback.style.display = 'grid';
        }
        function showImg(url) {
            img.onload = () => {
                img.style.display = 'block';
                fallback.style.display = 'none';
            };
            img.onerror = () => showFallback();
            img.src = url;
        }

        try {
            const listRes = await fetch(`${BASE}?domain=EMPLOYEE&entityId=${encodeURIComponent(empNo)}`, {
                method: 'GET',
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            if (!listRes.ok) return showFallback();

            const listJson = await listRes.json();
            const items = Array.isArray(listJson?.data) ? listJson.data : [];
            if (!items.length) return showFallback();

            const getId = (it) => it?.attachmentId ?? it?.id ?? it?.attachmentNo ?? it?.attachment_id;
            const main = items.find(it => it?.isMain === true || it?.main === true);
            let pickedId = getId(main);

            if (!pickedId) {
                const candidates = items.map(getId).filter(v => v !== undefined && v !== null);
                if (!candidates.length) return showFallback();
                pickedId = candidates
                    .map(v => (typeof v === 'string' ? Number(v) : v))
                    .filter(v => !Number.isNaN(v))
                    .sort((a,b)=>b-a)[0];
            }

            if (!pickedId) return showFallback();

            const previewRes = await fetch(`${BASE}/${pickedId}/preview-url`, {
                method: 'GET',
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            if (!previewRes.ok) return showFallback();

            const previewJson = await previewRes.json();
            const url =
                previewJson?.data?.url ||
                previewJson?.data?.presignedUrl ||
                previewJson?.data?.previewUrl;

            if (!url) return showFallback();

            showImg(url);

        } catch (e) {
            showFallback();
        }
    }

    window.addEventListener('DOMContentLoaded', loadProfilePhoto);
</script>

</body>
</html>
