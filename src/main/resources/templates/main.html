<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bizportal - Main</title>
    <style>
        :root{
            --bg:#f3f3f3;
            --text:#111;
            --border:#d7d7d7;
            --primary:#2f66d7;

            /* ✅ 성공 포인트 컬러 */
            --success:#16a34a;
            --successBorder: rgba(22,163,74,.35);
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo",
            "Noto Sans KR", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:var(--bg);
            color:var(--text);
        }
        .page{
            min-height:100vh;
            border:2px solid #222;
            margin:12px;
            background:var(--bg);
            display:flex;
            flex-direction:column;
        }
        header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:26px 28px;
            gap:12px;
            flex-wrap:wrap;
        }
        .brand{
            font-family: Georgia, "Times New Roman", Times, serif;
            font-weight:700;
            font-size:40px;
            letter-spacing:-0.5px;
        }
        .nav-right{
            display:flex;
            gap:14px;
            align-items:center;
            flex-wrap:wrap;
        }
        .btn{
            appearance:none;
            border:1px solid var(--border);
            background:#fff;
            padding:10px 18px;
            border-radius:10px;
            font-weight:800;
            cursor:pointer;
            color:#222;
        }
        .btn.primary{
            border-color:var(--primary);
            background:var(--primary);
            color:#fff;
        }
        main{
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }
        .card{
            width:min(720px, 92vw);
            text-align:center;
            padding:40px 24px;
        }
        .title{
            font-size:54px;
            font-weight:900;
            margin:0 0 12px;
            letter-spacing:-0.5px;
        }
        .desc{
            margin:0 0 28px;
            color:#555;
            font-weight:600;
        }
        .actions{
            display:flex;
            gap:12px;
            justify-content:center;
            flex-wrap:wrap;
        }
        .actions .btn{
            min-width:220px;
            padding:14px 18px;
            border-radius:12px;
        }
        .who{
            font-weight:900;
            color:#333;
            padding:10px 14px;
            border:1px solid var(--border);
            background:#fff;
            border-radius:10px;
        }

        /* ✅ 토스트 */
        .toast{
            position:fixed;
            left:50%;
            bottom:22px;
            transform:translateX(-50%);
            background:#fff;
            border:1px solid var(--border);
            color:#111;
            padding:12px 14px 12px 12px;
            border-radius:12px;
            font-weight:900;
            box-shadow: 0 10px 22px rgba(0,0,0,.10);
            z-index:9999;
            opacity:0;
            pointer-events:none;
            transition:opacity .15s ease, transform .15s ease;
            display:flex;
            align-items:center;
            gap:10px;
        }
        .toast::before{
            content:"";
            width:4px;
            height:18px;
            border-radius:999px;
            background:#bbb;
            flex:0 0 auto;
        }
        .toast.show{
            opacity:1;
            transform:translateX(-50%) translateY(-4px);
        }
        .toast.success{
            border-color: var(--successBorder);
            color: var(--success);
        }
        .toast.success::before{
            background: var(--success);
        }

        @media (max-width:768px){
            .brand{font-size:32px}
            .title{font-size:40px}
        }
    </style>
</head>
<body>
<div class="page">
    <header>
        <div class="brand">Bizportal</div>
        <div class="nav-right" id="navRight"></div>
    </header>

    <main>
        <section class="card">
            <h1 class="title" id="mainTitle">Welcome</h1>
            <p class="desc" id="mainDesc">Bizportal에 오신 것을 환영합니다. 로그인 유형을 선택해 주세요.</p>
            <div class="actions" id="mainActions"></div>
        </section>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
    const navRight = document.getElementById('navRight');
    const mainActions = document.getElementById('mainActions');
    const mainTitle = document.getElementById('mainTitle');
    const mainDesc = document.getElementById('mainDesc');
    const toastEl = document.getElementById('toast');

    const ME_URL = "/auth/me";         // ✅ 너가 만든 API
    const LOGOUT_URL = "/auth/logout"; // ✅ 너 프로젝트 로그아웃 API(쿠키 삭제)

    function goCompanyLogin() { window.location.href = '/auth/companies/login'; }
    function goEmployeeLogin() { window.location.href = '/auth/employee/login'; }
    function goCompanySignup() { window.location.href = '/auth/companies/signup'; }

    function goDashboardBySubjectType(subjectType) {
        // ✅ subjectType: COMPANY / EMPLOYEE
        if (subjectType === 'EMPLOYEE') window.location.href = '/employee';
        else window.location.href = '/company';
    }

    function showToast(message, type = 'success', ms = 1000) {
        toastEl.textContent = message;
        toastEl.classList.remove('success');
        if (type) toastEl.classList.add(type);
        toastEl.classList.add('show');
        window.setTimeout(() => toastEl.classList.remove('show'), ms);
    }
    function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

    // ✅ ResponseDto 래핑 대비
    async function safeJson(res) {
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) return null;
        try { return await res.json(); } catch { return null; }
    }

    // ✅ /auth/me 호출해서 로그인 상태 판단
    async function fetchMe() {
        try {
            const res = await fetch(ME_URL, {
                method: "GET",
                credentials: "include" // ✅ HttpOnly 쿠키 전송 핵심
            });

            // 서버가 200으로 내려주고 body에 authenticated=false를 담는 구조라면
            const body = await safeJson(res);
            if (!body) return { authenticated: false };

            // ResponseDto<ResMeDto> 구조 가정: { status, message, data }
            const data = body.data || body.result || body.body || body; // 혹시 몰라서 방어
            // 너는 data에 ResMeDto 넣는다고 했으니:
            if (data && data.authenticated === true) return data;
            return { authenticated: false };
        } catch (e) {
            console.warn("fetchMe failed:", e);
            return { authenticated: false };
        }
    }

    // ✅ 로그아웃: 쿠키 삭제 요청
    async function doLogout() {
        try {
            const res = await fetch(LOGOUT_URL, {
                method: "POST",
                credentials: "include" // ✅ 쿠키 기반이면 무조건
            });

            if (!res.ok && res.status !== 401) {
                console.warn("logout not ok:", res.status);
            }
        } catch (e) {
            console.warn("logout failed:", e);
        } finally {
            showToast("로그아웃 성공", "success", 900);
            await sleep(900);
            window.location.href = "/";
        }
    }

    function renderLoggedOut() {
        navRight.innerHTML = `
            <button class="btn primary" type="button" id="btnCompanyHeader">회사 로그인</button>
            <button class="btn" type="button" id="btnEmployeeHeader">사원 로그인</button>
            <button class="btn" type="button" id="btnCompanySignupHeader">회원가입</button>
        `;
        document.getElementById('btnCompanyHeader').addEventListener('click', goCompanyLogin);
        document.getElementById('btnEmployeeHeader').addEventListener('click', goEmployeeLogin);
        document.getElementById('btnCompanySignupHeader').addEventListener('click', goCompanySignup);

        mainTitle.textContent = 'Welcome';
        mainDesc.textContent = 'Bizportal에 오신 것을 환영합니다. 로그인 유형을 선택해 주세요.';
        mainActions.innerHTML = `
            <button class="btn primary" type="button" id="btnCompanyMain">회사(기업) 로그인</button>
            <button class="btn" type="button" id="btnEmployeeMain">사원 로그인</button>
            <button class="btn" type="button" id="btnCompanySignupMain">회사 회원가입</button>
        `;
        document.getElementById('btnCompanyMain').addEventListener('click', goCompanyLogin);
        document.getElementById('btnEmployeeMain').addEventListener('click', goEmployeeLogin);
        document.getElementById('btnCompanySignupMain').addEventListener('click', goCompanySignup);
    }

    function renderLoggedIn(me) {
        const whoText = (me.subjectType === 'EMPLOYEE') ? '사원' : '회사';
        const idText = me.username ? ` · ${me.username}` : (me.subjectId ? ` · #${me.subjectId}` : '');

        navRight.innerHTML = `
            <span class="who">${whoText} 로그인됨${idText}</span>
            <button class="btn primary" type="button" id="btnDashboard">대시보드</button>
            <button class="btn" type="button" id="btnLogout">로그아웃</button>
        `;
        document.getElementById('btnDashboard').addEventListener('click', () => goDashboardBySubjectType(me.subjectType));
        document.getElementById('btnLogout').addEventListener('click', doLogout);

        mainTitle.textContent = 'Hello';
        mainDesc.textContent = `${whoText} 계정으로 로그인되어 있습니다. 계속 진행해 주세요.`;
        mainActions.innerHTML = `
            <button class="btn primary" type="button" id="btnDashboardMain">대시보드로 이동</button>
            <button class="btn" type="button" id="btnLogoutMain">로그아웃</button>
        `;
        document.getElementById('btnDashboardMain').addEventListener('click', () => goDashboardBySubjectType(me.subjectType));
        document.getElementById('btnLogoutMain').addEventListener('click', doLogout);
    }

    async function boot() {
        const me = await fetchMe();
        if (me && me.authenticated) renderLoggedIn(me);
        else renderLoggedOut();
    }

    document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
