<!-- templates/employee/update.html -->
<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>사원 수정</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* =========================================================
               ✅ SCOPE ROOT: 이 페이지에서만 스타일 적용
               ========================================================= */
            .emp-update-page .update-wrap{
                width:100%;
                max-width:1180px;
                margin:0 auto;
                padding:6px 26px 24px;
            }

            .emp-update-page .card{
                width:100%;
                background:var(--white);
                border:1px solid var(--line);
                border-radius:18px;
                box-shadow:var(--shadow2);
                padding:18px;
            }

            .emp-update-page .grid{
                display:grid;
                grid-template-columns:300px 1fr;
                gap:18px;
                align-items:start;
            }

            /* Upload */
            .emp-update-page .upload-label{
                font-size:13px;
                color:#374151;
                font-weight:900;
                margin:0 0 10px 0;
            }

            .emp-update-page .uploader{
                width:100%;
                background:#fff;
                border-radius:16px;
                padding:14px;
                border:1px solid var(--line);
            }

            .emp-update-page .drop{
                border:2px dashed rgba(59,130,246,.35);
                border-radius:16px;
                height:210px;
                display:grid;
                place-items:center;
                cursor:pointer;
                position:relative;
                overflow:hidden;
                background:#fff;
            }
            .emp-update-page .drop:hover{ background:rgba(59,130,246,.04); }

            .emp-update-page .drop .hint{
                text-align:center;
                color:#374151;
                display:flex;
                flex-direction:column;
                gap:8px;
                align-items:center;
                font-weight:900;
            }

            .emp-update-page .drop small{
                display:block;
                color:var(--muted);
                font-weight:700;
            }

            .emp-update-page .preview{
                position:absolute;
                inset:0;
                width:100%;
                height:100%;
                object-fit:cover;
                display:none;
            }

            .emp-update-page .file-meta{
                margin-top:10px;
                font-size:12px;
                color:var(--muted);
                font-weight:700;
            }
            .emp-update-page .file-meta b{ color:#111827; }

            .emp-update-page .remove-file{
                margin-top:10px;
                width:100%;
                height:38px;
                border-radius:12px;
                border:1px solid var(--line);
                background:#fff;
                cursor:pointer;
                font-weight:900;
            }

            /* Form */
            .emp-update-page .form{
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:14px 14px;
            }

            .emp-update-page .field{
                display:flex;
                flex-direction:column;
                gap:8px;
            }

            .emp-update-page .label{
                font-size:13px;
                color:#111827;
                font-weight:900;
            }

            .emp-update-page .req{ color:#ef4444; margin-left:4px; }

            /* ✅ 전역 input/select 금지: 반드시 스코프 */
            .emp-update-page input,
            .emp-update-page select{
                height:42px;
                border-radius:12px;
                border:1px solid var(--line);
                padding:0 12px;
                outline:none;
                background:#fff;
                font-size:14px;
            }

            .emp-update-page input:focus,
            .emp-update-page select:focus{
                border-color: rgba(59,130,246,.55);
                box-shadow: 0 0 0 4px rgba(59,130,246,.12);
            }

            .emp-update-page .full{ grid-column:1 / -1; }
            .emp-update-page .readonly{ background:#f8fafc; color:#475569; }
            .emp-update-page .help{ font-size:12px; color:var(--muted); margin-top:-4px; font-weight:700; }
            .emp-update-page .mono{ font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }

            .emp-update-page .actions{
                display:flex;
                justify-content:flex-end;
                gap:10px;
                margin-top:16px;
            }

            /* ✅ 전역 .btn 금지: 반드시 스코프 */
            .emp-update-page .btn{
                height:42px;
                min-width:110px;
                border-radius:12px;
                border:0;
                cursor:pointer;
                font-weight:900;
                padding:0 14px;
            }

            /* ✅ 수정 버튼: 연한 하늘 배경 느낌 유지하려면 var(--primary2) 그대로 */
            .emp-update-page .btn.primary{
                background:var(--primary);
                color:#fff;
            }

            /* ✅ 취소 버튼: 하얀 배경 + 검은 글자 */
            .emp-update-page .btn.ghost{
                background:#fff;
                color:#111;
                border:1px solid var(--line);
            }
            .emp-update-page .btn.ghost:hover{ background:#f8fafc; }

            /* Toast */
            .emp-update-page .toast{
                margin-top:10px;
                padding:12px 14px;
                border-radius:14px;
                display:none;
                font-size:13px;
                border:1px solid var(--line);
                background:#fff;
                font-weight:900;
            }
            .emp-update-page .toast.ok{ display:block; border-color:rgba(34,197,94,.25); background:rgba(34,197,94,.07); }
            .emp-update-page .toast.bad{ display:block; border-color:rgba(239,68,68,.25); background:rgba(239,68,68,.07); }

            /* Modal */
            .emp-update-page .modal-backdrop{
                position:fixed;
                inset:0;
                background:rgba(17,24,39,.55);
                display:none;
                align-items:center;
                justify-content:center;
                z-index:9999;
            }

            .emp-update-page .modal{
                width:min(520px, calc(100vw - 40px));
                background:#fff;
                border-radius:18px;
                border:1px solid rgba(0,0,0,.08);
                box-shadow:0 20px 60px rgba(0,0,0,.25);
                overflow:hidden;
            }

            .emp-update-page .modal-head{
                padding:16px 18px;
                display:flex;
                align-items:center;
                justify-content:space-between;
                border-bottom:1px solid var(--line);
            }

            .emp-update-page .modal-title{
                font-weight:950;
                display:flex;
                align-items:center;
                gap:10px;
            }

            .emp-update-page .modal-close{
                width:38px;
                height:38px;
                border-radius:12px;
                border:1px solid var(--line);
                background:#fff;
                cursor:pointer;
                font-weight:900;
            }

            .emp-update-page .modal-body{ padding:18px; }
            .emp-update-page .modal-body p{ margin:0; color:#111827; font-weight:900; }

            .emp-update-page .modal-actions{
                padding:16px 18px;
                border-top:1px solid var(--line);
                display:flex;
                justify-content:flex-end;
                gap:10px;
            }

            .emp-update-page .btn2{
                height:42px;
                min-width:110px;
                border-radius:14px;
                border:0;
                cursor:pointer;
                font-weight:950;
                padding:0 14px;
            }
            .emp-update-page .btn2.primary{ background:var(--primary2); color:#fff; }
            .emp-update-page .btn2.ghost{ background:#eef2ff; color:#1f3b7a; }

            @media (max-width: 980px){
                .emp-update-page .grid{ grid-template-columns:1fr; }
                .emp-update-page .update-wrap{ padding:6px 16px 24px; }
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content" class="emp-update-page">

    <section class="page-with-subbar">
        <aside th:replace="~{sidebar/admin-sidebar :: adminSidebar('emp')}"></aside>

        <div class="update-wrap">
            <!-- ✅ 상단 "사원 관리 / 사원 수정" 텍스트 제거 -->

            <section class="card" style="margin-top: 30px;">
                <div class="grid">
                    <!-- Upload -->
                    <div>
                        <div class="upload-label">사원 사진</div>

                        <div class="uploader">
                            <div class="drop" id="drop">
                                <img id="preview" class="preview" alt="preview"/>
                                <div class="hint" id="dropHint">
                                    <span id="hintTitle">사진 불러오는 중...</span>
                                    <small id="hintDesc">클릭하여 업로드 (JPG/PNG, 최대 5MB)</small>
                                </div>
                                <input id="photo" type="file" accept="image/*" hidden />
                            </div>

                            <div class="file-meta" id="fileMeta">선택된 파일: <b>불러오는 중...</b></div>
                            <button class="remove-file" id="removeFile" type="button">사진 제거</button>
                        </div>

                        <div class="toast" id="toast"></div>
                    </div>

                    <!-- Form -->
                    <div>
                        <form id="empForm" autocomplete="off">
                            <div class="form">
                                <div class="field">
                                    <div class="label">이름</div>
                                    <input id="empName" type="text" class="readonly" readonly />
                                    <div class="help">이름은 수정 불가</div>
                                </div>

                                <div class="field">
                                    <div class="label">사번</div>
                                    <input id="empId" type="text" class="readonly mono" readonly />
                                </div>

                                <div class="field">
                                    <div class="label">생년월일</div>
                                    <input id="birth" type="date" class="readonly" readonly />
                                </div>

                                <div class="field">
                                    <div class="label">입사일</div>
                                    <input id="hireDate" type="date" class="readonly" readonly />
                                </div>

                                <div class="field">
                                    <div class="label">주소<span class="req">*</span></div>
                                    <input id="addr" type="text" required />
                                </div>

                                <div class="field">
                                    <div class="label">이메일<span class="req">*</span></div>
                                    <input id="email" type="email" required />
                                </div>

                                <div class="field">
                                    <div class="label">사내번호<span class="req">*</span></div>
                                    <input id="workPhone" type="text" maxlength="10" required />
                                </div>

                                <div class="field">
                                    <div class="label">전화번호<span class="req">*</span></div>
                                    <input id="phone" type="tel" maxlength="13" required />
                                    <div class="help">입력하면 자동 하이픈</div>
                                </div>

                                <div class="field">
                                    <div class="label">성별<span class="req">*</span></div>
                                    <select id="gen" required>
                                        <option value="" selected disabled>성별 선택</option>
                                        <option value="M">남</option>
                                        <option value="F">여</option>
                                    </select>
                                </div>

                                <div class="field">
                                    <div class="label">부서<span class="req">*</span></div>
                                    <select id="depNo" required>
                                        <option value="" selected disabled>부서 선택</option>
                                        <option th:each="d : ${departments}" th:value="${d.depNo}" th:text="${d.depName}">부서</option>
                                    </select>
                                </div>

                                <div class="field">
                                    <div class="label">직급<span class="req">*</span></div>
                                    <select id="posNo" required>
                                        <option value="" selected disabled>직급 선택</option>
                                        <option th:each="p : ${positions}" th:value="${p.posNo}" th:text="${p.posName}">직급</option>
                                    </select>
                                </div>

                                <div class="field full">
                                    <div class="label">권한<span class="req">*</span></div>
                                    <select id="role" required>
                                        <option value="" selected disabled>권한 선택</option>
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROLE</option>
                                    </select>
                                    <div class="help">서버 enum(RoleType) 값 그대로</div>
                                </div>
                            </div>

                            <div class="actions">
                                <button class="btn primary" id="submitBtn" type="submit">수정</button>
                                <button class="btn ghost" id="cancelBtn" type="button">취소</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </section>

    <!-- ✅ 수정 완료 모달 -->
    <div class="modal-backdrop" id="doneBackdrop" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
        <div class="modal">
            <div class="modal-head">
                <div class="modal-title" id="doneTitle">✅ 수정 완료</div>
                <button class="modal-close" type="button" id="doneCloseBtn">✕</button>
            </div>
            <div class="modal-body">
                <p>사원 정보가 수정되었습니다.</p>
            </div>
            <div class="modal-actions">
                <button class="btn2 ghost" type="button" id="stayBtn">계속 수정</button>
                <button class="btn2 primary" type="button" id="goListBtn">목록으로</button>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="pageScripts">
    <script th:inline="javascript">
        const API_BASE = "";
        const LIST_URL = "/admin/employees/list";

        let EMP_NO = /*[[${empNo}]]*/ 0;
        if (!EMP_NO || EMP_NO === 0){
            const m = location.pathname.match(/\/employees\/(\d+)/);
            if (m) EMP_NO = Number(m[1]);
        }

        const API_DETAIL = `/api/v1/admin/employees/${EMP_NO}`;
        const API_UPDATE = `/api/v1/admin/employees/${EMP_NO}`;

        const API_ATTACH_LIST = (empNo) => `/api/v1/attachments?domain=EMPLOYEE&entityId=${empNo}`;
        const API_PREVIEW_URL = (attachmentId) => `/api/v1/attachments/${attachmentId}/preview-url`;
        const API_DELETE_ATTACHMENT = (attachmentId) => `/api/v1/attachments/${attachmentId}`;

        const API_PRESIGN = `/api/v1/attachments/presign`;
        const API_COMPLETE = `/api/v1/attachments/complete`;
        const API_PATCH_OBJECT_KEY = (empNo) => `/api/v1/admin/employees/${empNo}/object-key`;

        const $drop = document.getElementById("drop");
        const $photo = document.getElementById("photo");
        const $preview = document.getElementById("preview");
        const $dropHint = document.getElementById("dropHint");
        const $hintTitle = document.getElementById("hintTitle");
        const $hintDesc = document.getElementById("hintDesc");
        const $fileMeta = document.getElementById("fileMeta");
        const $removeFile = document.getElementById("removeFile");
        const $toast = document.getElementById("toast");

        const $form = document.getElementById("empForm");
        const $submitBtn = document.getElementById("submitBtn");
        const $cancelBtn = document.getElementById("cancelBtn");

        const $doneBackdrop = document.getElementById("doneBackdrop");
        const $doneCloseBtn = document.getElementById("doneCloseBtn");
        const $goListBtn = document.getElementById("goListBtn");
        const $stayBtn = document.getElementById("stayBtn");

        let existingAttachmentId = null;
        let removePhotoRequested = false;
        let currentObjectKey = null;

        function toast(type, msg){
            $toast.className = "toast " + (type === "ok" ? "ok" : "bad");
            $toast.textContent = msg;
            $toast.style.display = "block";
        }
        function clearToast(){
            $toast.style.display = "none";
            $toast.className = "toast";
            $toast.textContent = "";
        }

        function openDoneModal(){ $doneBackdrop.style.display = "flex"; }
        function closeDoneModal(){ $doneBackdrop.style.display = "none"; }
        $doneCloseBtn.addEventListener("click", closeDoneModal);
        $doneBackdrop.addEventListener("click", (e)=>{ if(e.target === $doneBackdrop) closeDoneModal(); });
        $goListBtn.addEventListener("click", ()=> window.location.href = LIST_URL);
        $stayBtn.addEventListener("click", ()=> closeDoneModal());

        function formatKoreanMobile(raw){
            const digits = String(raw||"").replace(/\D/g, "").slice(0, 11);
            if (digits.length <= 3) return digits;
            if (digits.length <= 7) return `${digits.slice(0,3)}-${digits.slice(3)}`;
            return `${digits.slice(0,3)}-${digits.slice(3,7)}-${digits.slice(7)}`;
        }
        document.getElementById("phone").addEventListener("input", (e)=>{ e.target.value = formatKoreanMobile(e.target.value); });
        document.getElementById("email").addEventListener("input", (e)=>{ e.target.value = e.target.value.replace(/\s/g, ""); });

        async function requestJson(method, url, body){
            const res = await fetch(`${API_BASE}${url}`, {
                method,
                headers: { "Content-Type": "application/json", "Accept":"application/json" },
                credentials: "include",
                body: body ? JSON.stringify(body) : null
            });

            const text = await res.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch(e){}
            if (!res.ok) throw new Error(`HTTP ${res.status} ${text || ""}`.trim());
            return json;
        }
        const getJson = (u)=>requestJson("GET", u, null);
        const patchJson = (u,b)=>requestJson("PATCH", u, b);
        const postJson = (u,b)=>requestJson("POST", u, b);

        function unwrap(maybe){
            if(maybe && typeof maybe === "object" && "data" in maybe) return maybe.data;
            return maybe;
        }

        function extractUrl(raw){
            const unwrapped = unwrap(raw);
            if(!unwrapped) return null;
            if(typeof unwrapped === "object"){
                if (unwrapped.url) return unwrapped.url;
                if (unwrapped.previewUrl) return unwrapped.previewUrl;
                if (unwrapped.presignedUrl) return unwrapped.presignedUrl;
                if (unwrapped.data && typeof unwrapped.data === "object"){
                    if (unwrapped.data.url) return unwrapped.data.url;
                    if (unwrapped.data.previewUrl) return unwrapped.data.previewUrl;
                    if (unwrapped.data.presignedUrl) return unwrapped.data.presignedUrl;
                }
            }
            return null;
        }

        function showNoPhoto(){
            $preview.src = "";
            $preview.style.display = "none";
            $dropHint.style.display = "flex";
            $hintTitle.textContent = "사진 없음";
            $hintDesc.textContent = "클릭하여 업로드 (JPG/PNG, 최대 5MB)";
            $fileMeta.innerHTML = `선택된 파일: <b>없음</b>`;
        }

        function showLoadingPhoto(){
            $preview.src = "";
            $preview.style.display = "none";
            $dropHint.style.display = "flex";
            $hintTitle.textContent = "사진 불러오는 중...";
            $hintDesc.textContent = "클릭하여 업로드 (JPG/PNG, 최대 5MB)";
            $fileMeta.innerHTML = `선택된 파일: <b>불러오는 중...</b>`;
        }

        function showPreview(url, label){
            $preview.onload = () => { $preview.style.display = "block"; $dropHint.style.display = "none"; };
            $preview.onerror = () => { showNoPhoto(); };

            $fileMeta.innerHTML = `선택된 파일: <b>${label || "(기존 사진)"}</b>`;
            $preview.crossOrigin = "anonymous";
            $preview.referrerPolicy = "no-referrer";
            $preview.src = url;
        }

        async function loadPhotoByAttachmentApi(preferObjectKey){
            showLoadingPhoto();
            existingAttachmentId = null;

            try{
                const listRes = await fetch(API_ATTACH_LIST(EMP_NO), {
                    method:"GET",
                    credentials:"include",
                    headers:{ "Accept":"application/json" }
                });
                if(!listRes.ok){ showNoPhoto(); return; }

                const listRaw = await listRes.json();
                const listJson = unwrap(listRaw);
                const items = Array.isArray(listJson) ? listJson : [];

                const imageItems = items.filter(x =>
                    String(x.fileType || "").toUpperCase() === "IMAGE" ||
                    String(x.contentType || "").startsWith("image/")
                );

                let photoItem = null;
                if (preferObjectKey){
                    photoItem = imageItems.find(x => x.objectKey && String(x.objectKey) === String(preferObjectKey)) || null;
                }
                if (!photoItem) photoItem = imageItems[0] || null;

                if(!photoItem || !photoItem.attachmentId){ showNoPhoto(); return; }

                existingAttachmentId = photoItem.attachmentId;

                const prevRes = await fetch(API_PREVIEW_URL(existingAttachmentId), {
                    method:"GET",
                    credentials:"include",
                    headers:{ "Accept":"application/json" }
                });
                if(!prevRes.ok){ showNoPhoto(); return; }

                const prevRaw = await prevRes.json();
                const url = extractUrl(prevRaw);
                if(!url){ showNoPhoto(); return; }

                showPreview(url, "(기존 사진)");
            }catch(e){
                console.error(e);
                showNoPhoto();
            }
        }

        async function deleteAllEmployeeImageAttachments(){
            const listRes = await fetch(API_ATTACH_LIST(EMP_NO), {
                method:"GET",
                credentials:"include",
                headers:{ "Accept":"application/json" }
            });
            if(!listRes.ok) return;

            const listRaw  = await listRes.json();
            const listJson = unwrap(listRaw);
            const items    = Array.isArray(listJson) ? listJson : [];

            const imageItems = items.filter(x =>
                String(x.fileType || "").toUpperCase() === "IMAGE" ||
                String(x.contentType || "").startsWith("image/")
            );
            if(imageItems.length === 0) return;

            await Promise.allSettled(
                imageItems
                    .filter(x => x.attachmentId)
                    .map(x => fetch(API_DELETE_ATTACHMENT(x.attachmentId), {
                        method:"DELETE",
                        credentials:"include",
                        headers:{ "Accept":"application/json" }
                    }))
            );

            existingAttachmentId = null;
        }

        async function loadPrefill(){
            const raw = await getJson(API_DETAIL);
            const d = unwrap(raw) || {};

            document.getElementById("empName").value = d.empName ?? "";
            document.getElementById("empId").value = d.empId ?? "";
            document.getElementById("birth").value = (d.birth ?? "").toString().slice(0,10);
            document.getElementById("hireDate").value = (d.hireDate ?? "").toString().slice(0,10);

            document.getElementById("addr").value = d.addr ?? "";
            document.getElementById("email").value = d.email ?? "";
            document.getElementById("phone").value = d.phone ?? "";
            document.getElementById("workPhone").value = d.workPhone ?? "";
            document.getElementById("gen").value = d.gen ?? "";
            document.getElementById("depNo").value = d.depNo ?? "";
            document.getElementById("posNo").value = d.posNo ?? "";
            document.getElementById("role").value = d.role ?? "";

            currentObjectKey = d.objectKey ?? null;

            removePhotoRequested = false;
            await loadPhotoByAttachmentApi(currentObjectKey);
        }

        // Photo UI
        $drop.addEventListener("click", () => $photo.click());

        $photo.addEventListener("change", () => {
            const file = ($photo.files && $photo.files[0]) ? $photo.files[0] : null;
            if (!file) return;

            removePhotoRequested = false;

            if (!/^image\//.test(file.type)) { toast("bad", "이미지 파일만 업로드할 수 있어."); $photo.value = ""; return; }
            if (file.size > 5 * 1024 * 1024) { toast("bad", "최대 5MB까지만 업로드 가능해."); $photo.value = ""; return; }

            $fileMeta.innerHTML = `선택된 파일: <b>${file.name}</b>`;
            const url = URL.createObjectURL(file);
            $preview.src = url;
            $preview.style.display = "block";
            $dropHint.style.display = "none";
        });

        $removeFile.addEventListener("click", () => {
            $photo.value = "";
            removePhotoRequested = true;
            showNoPhoto();
            toast("ok", "사진 제거 요청됨 (수정 버튼 누르면 반영)");
        });

        async function updateEmployee(){
            const body = {
                depNo: Number(document.getElementById("depNo").value),
                posNo: Number(document.getElementById("posNo").value),
                email: document.getElementById("email").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                workPhone: document.getElementById("workPhone").value.trim(),
                addr: document.getElementById("addr").value.trim(),
                gen: document.getElementById("gen").value,
                role: document.getElementById("role").value
            };
            const raw = await patchJson(API_UPDATE, body);
            return unwrap(raw);
        }

        async function presignForEmployee(empNo, file){
            const raw = await postJson(API_PRESIGN, {
                domain: "EMPLOYEE",
                entityId: empNo,
                fileType: "IMAGE",
                originalName: file.name,
                contentType: file.type || "application/octet-stream",
                size: file.size
            });
            const data = unwrap(raw);
            if (!data?.objectKey || !data?.uploadUrl) throw new Error("presign 응답에 objectKey/uploadUrl 없음");
            return data;
        }

        async function uploadToS3(uploadUrl, file){
            const res = await fetch(uploadUrl, {
                method: "PUT",
                headers: { "Content-Type": file.type || "application/octet-stream" },
                body: file
            });
            if (!res.ok) throw new Error("S3 업로드 실패: " + res.status);
            return { etag: res.headers.get("ETag") };
        }

        async function completeEmployee(empNo, file, objectKey, etag){
            const raw = await postJson(API_COMPLETE, {
                domain: "EMPLOYEE",
                entityId: empNo,
                fileType: "IMAGE",
                objectKey,
                originalName: file.name,
                contentType: file.type || "application/octet-stream",
                size: file.size,
                etag: etag || null
            });
            return unwrap(raw);
        }

        async function updateEmployeeObjectKey(empNo, objectKey){
            await patchJson(API_PATCH_OBJECT_KEY(empNo), { objectKey });
        }

        async function clearEmployeeObjectKey(empNo){
            await patchJson(API_PATCH_OBJECT_KEY(empNo), { objectKey: null });
        }

        $form.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearToast();

            if (!$form.checkValidity()) {
                $form.reportValidity();
                return;
            }

            try{
                $submitBtn.disabled = true;
                toast("ok", "수정 중...");

                await updateEmployee();

                const file = ($photo.files && $photo.files[0]) ? $photo.files[0] : null;

                // remove only
                if (!file && removePhotoRequested){
                    toast("ok", "사진 제거 중...");
                    await deleteAllEmployeeImageAttachments();
                    await clearEmployeeObjectKey(EMP_NO);

                    currentObjectKey = null;
                    removePhotoRequested = false;

                    await loadPhotoByAttachmentApi(null);
                }

                // new file
                if (file){
                    toast("ok", "기존 사진 삭제 중...");
                    await deleteAllEmployeeImageAttachments();

                    toast("ok", "새 사진 업로드 중...");
                    const { objectKey, uploadUrl } = await presignForEmployee(EMP_NO, file);
                    const { etag } = await uploadToS3(uploadUrl, file);
                    await completeEmployee(EMP_NO, file, objectKey, etag);
                    await updateEmployeeObjectKey(EMP_NO, objectKey);

                    currentObjectKey = objectKey;
                    removePhotoRequested = false;

                    await loadPhotoByAttachmentApi(currentObjectKey);
                }

                clearToast();
                openDoneModal();

            }catch(err){
                console.error(err);
                toast("bad", "수정 실패: " + (err.message || err));
            }finally{
                $submitBtn.disabled = false;
            }
        });

        $cancelBtn.addEventListener("click", () => { window.location.href = LIST_URL; });

        (async ()=>{
            if (!EMP_NO || EMP_NO === 0){
                toast("bad", "empNo를 못 찾았어. (모델로 내려주거나 URL이 /admin/employees/{empNo}/edit 여야 함)");
                showNoPhoto();
                return;
            }

            try{ await loadPrefill(); }
            catch(e){ console.error(e); toast("bad", "상세 조회 실패: " + (e.message || e)); showNoPhoto(); }
        })();
    </script>
</th:block>
</body>
</html>
