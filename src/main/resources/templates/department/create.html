<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Bizportal - 부서 편성(등록)</title>

    <!-- ✅ 이 페이지 전용 스타일 -->
    <th:block layout:fragment="pageStyles">
        <style>
            /* 오른쪽 콘텐츠 영역 */
            .dept-page{
                padding-top: 6px;
            }

            .dept-page .page-kicker{
                font-size:14px;
                color:var(--muted);
                margin: 0 0 10px;
            }
            .dept-page .page-title{
                font-size:34px;
                font-weight:900;
                margin: 0 0 22px;
                letter-spacing: -.2px;
            }
            .dept-page .section-title{
                font-size:22px;
                font-weight:900;
                margin: 0 0 14px;
            }

            .dept-page .card{
                background: var(--white);
                border: 1px solid var(--line);
                border-radius: 18px;
                padding: 26px;
                box-shadow: 0 10px 24px rgba(17,24,39,.06);
            }

            .dept-page .form-wrap{
                background:#f3f4f6;
                border-radius: 18px;
                padding: 26px;
            }

            .dept-page .field{ margin: 18px 0; }
            .dept-page .label{ font-weight: 800; margin-bottom: 10px; }

            .dept-page .input{
                width:100%;
                height:48px;
                border-radius: 12px;
                border: 1px solid var(--line);
                padding: 0 14px;
                font-size: 14px;
                outline: none;
                background: #fff;
            }
            .dept-page .input:focus{
                border-color: rgba(59,130,246,.55);
                box-shadow: 0 0 0 4px rgba(59,130,246,.12);
            }

            .dept-page .hint{
                margin-top: 8px;
                font-size: 12px;
                color: var(--muted);
            }

            .dept-page .actions{
                display:flex;
                justify-content:flex-end;
                margin-top: 22px;
            }
            .dept-page .btn{
                width:160px;
                height:50px;
                border:none;
                border-radius: 14px;
                background: var(--primary);
                color:#fff;
                font-weight: 900;
                cursor:pointer;
                box-shadow: 0 10px 22px rgba(59,130,246,.22);
            }
            .dept-page .btn:hover{ filter: brightness(0.98); }
            .dept-page .btn:active{ transform: translateY(1px); }

            .dept-page .msg{
                margin-top:14px;
                font-size:13px;
                display:none;
            }
            .dept-page .msg.ok{ color:#0f766e; }
            .dept-page .msg.err{ color:#b91c1c; }
        </style>
    </th:block>
</head>

<body>

<!-- ✅ layout.html의 content 영역 -->
<th:block layout:fragment="content">

    <div class="page-with-subbar">

        <!-- ✅ 관리자 사이드바 (fragment 사용) -->
        <div th:replace="~{sidebar/admin-sidebar :: adminSidebar('dept')}"></div>

        <!-- ✅ 오른쪽 콘텐츠 -->
        <section class="dept-page">
            <p class="page-kicker">부서 편성(등록)</p>
            <h1 class="page-title">부서 편성</h1>
            <h2 class="section-title">부서 등록</h2>

            <div class="card">
                <div class="form-wrap">
                    <div class="field">
                        <div class="label">부서 코드</div>
                        <input class="input" id="depId" maxlength="3" placeholder="예) A01" />
                        <div class="hint">최대 3자</div>
                    </div>

                    <div class="field">
                        <div class="label">부서 이름</div>
                        <input class="input" id="depName" maxlength="10" placeholder="예) 인사팀" />
                        <div class="hint">최대 10자</div>
                    </div>

                    <div class="actions">
                        <button class="btn" id="submitBtn" type="button">등록</button>
                    </div>

                    <div id="resultMsg" class="msg"></div>
                </div>
            </div>
        </section>

    </div>
</th:block>

<!-- ✅ 이 페이지 전용 스크립트 -->
<th:block layout:fragment="pageScripts">
    <script>
        const $ = (id) => document.getElementById(id);

        function showMsg(text, ok) {
            const el = $("resultMsg");
            if (!el) return;
            el.style.display = "block";
            el.className = "msg " + (ok ? "ok" : "err");
            el.textContent = text;
        }

        async function safeJson(res) {
            const ct = res.headers.get("content-type") || "";
            if (!ct.includes("application/json")) return {};
            try { return await res.json(); } catch { return {}; }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const btn = $("submitBtn");
            if (!btn) return;

            btn.addEventListener("click", async () => {
                const depId = $("depId")?.value?.trim() || "";
                const depName = $("depName")?.value?.trim() || "";

                if (!depId) return showMsg("부서 코드를 입력해주세요.", false);
                if (!depName) return showMsg("부서 이름을 입력해주세요.", false);
                if (depId.length > 3) return showMsg("부서 코드는 최대 3자입니다.", false);
                if (depName.length > 10) return showMsg("부서 이름은 최대 10자입니다.", false);

                try {
                    const res = await fetch("/api/v1/admin/departments", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({ depId, depName })
                    });

                    if (res.status === 401)
                        return showMsg("로그인이 필요합니다. 다시 로그인 해주세요.", false);
                    if (res.status === 403)
                        return showMsg("권한이 없습니다. (COM_ADMIN만 가능)", false);

                    if (res.ok) {
                        alert("부서 등록에 성공했습니다.");
                        window.location.href = "/admin/departments/list";
                        return;
                    }

                    const data = await safeJson(res);
                    showMsg(data?.message || "요청 처리에 실패했습니다.", false);

                } catch (e) {
                    console.error(e);
                    showMsg("서버 통신 오류가 발생했습니다.", false);
                }
            });
        });
    </script>
</th:block>

</body>
</html>
