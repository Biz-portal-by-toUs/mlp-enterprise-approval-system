<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bizportal - 결제 수단 관리</title>

  <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root{
      --bg:#f3f3f3;
      --text:#111;
      --border:#d7d7d7;
      --primary:#2f66d7;
      --danger:#ef4444;
      --white:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .page{ min-height:100vh; border:2px solid #222; margin:12px; background:var(--bg); display:flex; flex-direction:column; }
    header{ display:flex; align-items:center; justify-content:space-between; padding:26px 28px; }
    .brand{ font-family: Georgia, serif; font-weight:700; font-size:40px; cursor:pointer; }

    main{ flex:1; display:flex; flex-direction:column; align-items:center; padding:40px 24px; }
    .container{ width:min(640px, 92vw); }
    .title-section{ text-align:left; margin-bottom:32px; }
    .title{ font-size:42px; font-weight:900; margin:0; letter-spacing:-1px; }
    .desc{ color:#555; font-weight:600; margin-top:8px; }

    .payment-list{ display:flex; flex-direction:column; gap:16px; margin-bottom:32px; }
    .payment-item{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      padding:24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      transition: all 0.2s ease;
    }

    .payment-item.representative{
      border: 2px solid var(--primary);
      box-shadow: 0 4px 15px rgba(47,102,215,0.15);
    }

    .card-info{ display:flex; flex-direction:column; gap:4px; }
    .card-name{ font-size:20px; font-weight:800; display:flex; align-items:center; gap:8px; }
    .card-mask{ font-family: monospace; color:#666; font-size:16px; font-weight:600; }

    .badge{
      background:var(--primary);
      color:var(--white);
      font-size:12px;
      padding:4px 8px;
      border-radius:6px;
      font-weight:900;
    }

    .btn{
      appearance:none; border:1px solid var(--border); background:#fff;
      padding:10px 18px; border-radius:10px; font-weight:800; cursor:pointer;
      transition: opacity 0.2s;
    }
    .btn.primary{ border-color:var(--primary); background:var(--primary); color:var(--white); }
    .btn.danger{ border-color:var(--danger); background:var(--danger); color:var(--white); }
    .btn:hover{ opacity:0.9; }

    .add-section{ text-align:center; padding-top:20px; border-top:1px solid var(--border); }
    .btn-add{ width:100%; padding:16px; font-size:18px; border-radius:14px; }

    /* SweetAlert 커스텀 스타일링 */
    .swal2-popup { border-radius: 20px !important; font-family: inherit !important; }
    .swal2-styled.swal2-confirm { background-color: var(--primary) !important; border-radius: 12px !important; font-weight: 800 !important; }
    .swal2-styled.swal2-cancel { border-radius: 12px !important; font-weight: 800 !important; }
  </style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand" onclick="location.href='/'">Bizportal</div>
    <button class="btn" onclick="location.href='/company'">대시보드</button>
  </header>

  <main>
    <div class="container">
      <section class="title-section">
        <h1 class="title">결제 수단 관리</h1>
        <p class="desc">정기 구독 결제에 사용할 카드를 관리하세요.</p>
      </section>

      <div class="payment-list" id="paymentList"></div>

      <section class="add-section">
        <button class="btn primary btn-add" id="btnRegisterCard">+ 새 카드 등록하기</button>
      </section>
    </div>
  </main>
</div>

<script th:inline="javascript">
  const listEl = document.getElementById('paymentList');

  // SweetAlert를 이용한 알림 함수
  const Toast = Swal.mixin({
    toast: true,
    position: 'bottom',
    showConfirmButton: false,
    timer: 3000,
    timerProgressBar: true
  });

  // 1. 목록 조회
  async function loadCards() {
    try {
      const res = await fetch('/api/v1/company/payment-method');
      const json = await res.json();
      renderCards(json.data);
    } catch (e) {
      Toast.fire({ icon: 'error', title: '목록을 불러오지 못했습니다.' });
    }
  }

  function renderCards(cards) {
    if (!cards || cards.length === 0) {
      listEl.innerHTML = '<p style="text-align:center; padding:40px; color:#888; font-weight:600;">등록된 결제 수단이 없습니다.</p>';
      return;
    }

    listEl.innerHTML = cards.map(card => {
      const isRep = card.isRepresentative || card.representative;

      return `
        <div class="payment-item ${isRep ? 'representative' : ''}">
          <div class="card-info">
            <div class="card-name">
              ${card.cardType}
              ${isRep ? '<span class="badge">대표</span>' : ''}
            </div>
            <div class="card-mask">${card.mask}</div>
          </div>
          <div style="display:flex; gap:8px;">
            ${!isRep ? `
              <button class="btn primary" onclick="setRepresentative(${card.paymNo})">대표 설정</button>
            ` : ''}
            <button class="btn danger" onclick="deleteCard(${card.paymNo})">삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // 2. 대표 결제 수단 변경
  async function setRepresentative(paymNo) {
    const result = await Swal.fire({
      title: '대표 결제수단 변경',
      text: "정말 이 카드를 대표 결제수단으로 설정하시겠습니까?",
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: '변경하기',
      cancelButtonText: '취소'
    });

    if (result.isConfirmed) {
      try {
        const res = await fetch(`/api/v1/company/payment-method/${paymNo}/representative`, { method: 'PATCH' });
        if (res.ok) {
          Swal.fire('변경 완료', '대표 결제수단이 변경되었습니다.', 'success');
          loadCards();
        } else {
          const json = await res.json();
          Swal.fire('오류 발생', json.message || "변경에 실패했습니다.", 'error');
        }
      } catch (e) { Swal.fire('통신 오류', '서버와 연결할 수 없습니다.', 'error'); }
    }
  }

  // 3. 결제 수단 삭제
  async function deleteCard(paymNo) {
    const result = await Swal.fire({
      title: '결제 수단 삭제',
      text: "정말 이 카드를 삭제하시겠습니까?",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#ef4444',
      confirmButtonText: '삭제하기',
      cancelButtonText: '취소'
    });

    if (result.isConfirmed) {
      try {
        const res = await fetch(`/api/v1/company/payment-method/${paymNo}`, { method: 'DELETE' });
        const json = await res.json();
        if (res.ok) {
          Toast.fire({ icon: 'success', title: '삭제되었습니다.' });
          loadCards();
        } else {
          // 백엔드 ErrorResponse에서 보낸 상세 메시지 출력
          Swal.fire('삭제 실패', json.message || "카드를 삭제할 수 없습니다.", 'error');
        }
      } catch (e) { Swal.fire('통신 오류', '삭제 중 오류가 발생했습니다.', 'error'); }
    }
  }

  // 4. 카드 등록
  document.getElementById('btnRegisterCard').addEventListener('click', () => {
    const IMP = window.IMP;
    IMP.init("imp17723588");
    const customer_uid = "COM_USER_" + new Date().getTime();

    IMP.request_pay({
      pg: "tosspayments", pay_method: "card", merchant_uid: "reg_" + new Date().getTime(),
      customer_uid: customer_uid, name: "Bizportal 카드 등록", amount: 0
    }, async function (rsp) {
      if (rsp.success) {
        // 로딩 바 표시
        Swal.showLoading();
        try {
          const res = await fetch('/api/v1/company/payment-method', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ impUid: rsp.imp_uid, customerUid: rsp.customer_uid })
          });
          const json = await res.json();
          Swal.close();

          if (res.ok) {
            Swal.fire('등록 성공', '새로운 결제 수단이 등록되었습니다.', 'success');
            loadCards();
          } else {
            // 중복 카드 에러 등 처리
            Swal.fire('등록 실패', json.message || "카드 등록에 실패했습니다.", 'error');
          }
        } catch (e) { Swal.fire('서버 오류', '서버 통신 중 오류가 발생했습니다.', 'error'); }
      } else {
        Swal.fire('인증 실패', rsp.error_msg, 'error');
      }
    });
  });

  document.addEventListener('DOMContentLoaded', loadCards);
</script>
</body>
</html>
