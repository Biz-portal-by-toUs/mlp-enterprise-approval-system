<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>직급 편성</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* 공통 카드(화이트) */
            .card{
                background:var(--white);
                border:1px solid var(--line);
                border-radius:18px;
                box-shadow: var(--shadow2);
            }

            /* 관리자 서브바 레이아웃 */
            .pos-page{ display:block; }

            /* 상단 액션 바 */
            .top-row{
                display:flex;
                justify-content:flex-end;
                align-items:center;
                margin-bottom:14px;
                padding:0 26px; /* 기존 main padding 느낌 유지 */
            }

            /* 상단 등록 버튼: 작게 + 각지게 + 헤더색 맞춤 */
            .top-row .btn-primary{
                height:36px;
                min-width:96px;
                padding:0 12px;

                border:0;
                border-radius:8px;          /* ✅ 각지게 */
                background: var(--primary); /* ✅ 헤더 톤 */
                color:#fff;

                font-weight:900;
                cursor:pointer;
                box-shadow: 0 8px 16px rgba(47,111,218,.18);
            }
            .top-row .btn-primary:hover{
                filter: brightness(.97);
                transform: translateY(-1px);
            }

            /* 테이블 */
            .table-wrap{ padding:18px; }
            table{
                width:100%;
                border-collapse:separate;
                border-spacing:0;
                table-layout:fixed;
            }
            thead th{
                text-align:center;
                font-size:12px;
                color:#374151;
                background:#f8fafc;
                padding:12px 10px;
                border-bottom:1px solid var(--line);
                white-space:nowrap;
            }
            tbody td{
                text-align:center;
                padding:14px 10px;
                border-bottom:1px solid rgba(17,24,39,.06);
                font-size:14px;
                overflow:hidden;
                text-overflow:ellipsis;
                white-space:nowrap;
            }
            tbody tr:hover td{
                background: rgba(59,130,246,.04);
            }

            /* 관리 버튼: 테두리 없음 */
            .mini-btn{
                height:32px;
                padding:0 12px;
                border-radius:10px;
                border:0;                 /* ✅ 테두리 제거 */
                font-weight:900;
                cursor:pointer;
                font-size:13px;
                background:#fff;
            }
            .mini-btn.edit{
                background: rgba(59,130,246,.12);
                color: var(--primary2);
            }
            .mini-btn.del{
                background: rgba(198,40,40,.10);
                color:#c62828;
                margin-left:8px;
            }

            /* empty */
            .empty{
                display:none;
                padding:26px 10px;
                text-align:center;
                color:var(--muted);
                font-weight:900;
            }

            /* toast */
            .toast{
                position:fixed;
                left:50%;
                bottom:22px;
                transform:translateX(-50%);
                background:#111;
                color:#fff;
                padding:12px 14px;
                border-radius:12px;
                font-weight:900;
                font-size:14px;
                box-shadow:0 14px 28px rgba(0,0,0,.18);
                opacity:0;
                pointer-events:none;
                transition:opacity .18s ease, transform .18s ease;
                z-index:9999;
            }
            .toast.show{
                opacity:1;
                transform:translateX(-50%) translateY(-2px);
            }
            .toast.err{ background:#c62828; }

            /* 페이지 콘텐츠 padding (기존 main padding 대체) */
            .pos-content{
                padding:0 26px;
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <section class="page-with-subbar">

        <!-- ✅ 관리자 사이드바(fragment) -->
        <aside th:replace="~{sidebar/admin-sidebar :: adminSidebar('pos')}"></aside>

        <!-- ✅ 페이지 콘텐츠 -->
        <div class="pos-page">

            <!-- ✅ 타이틀/서브타이틀 제거(부서/사원 페이지처럼 깔끔) -->

            <!-- 상단 버튼 -->
            <div class="top-row">
                <button class="btn-primary" type="button"
                        onclick="location.href='/admin/positions/create'">직급 등록</button>
            </div>

            <!-- Table card -->
            <div class="pos-content">
                <div class="card">
                    <div class="table-wrap">
                        <table>
                            <colgroup>
                                <col style="width:20%;">
                                <col style="width:45%;">
                                <col style="width:15%;">
                                <col style="width:20%;">
                            </colgroup>
                            <thead>
                            <tr>
                                <th>번호</th>
                                <th>직급명</th>
                                <th>순서</th>
                                <th>관리</th>
                            </tr>
                            </thead>
                            <tbody id="posTbody"></tbody>
                        </table>

                        <div id="emptyBox" class="empty">등록된 직급이 없습니다.</div>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <div id="toast" class="toast" aria-live="polite"></div>
</div>

<th:block layout:fragment="pageScripts">
    <script>
        // ===== Toast =====
        let toastTimer = null;
        function showToast(text, isErr){
            const el = document.getElementById("toast");
            el.className = "toast" + (isErr ? " err" : "");
            el.textContent = text;
            el.classList.add("show");
            if(toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(()=> el.classList.remove("show"), 1800);
        }

        async function safeJson(res) {
            const ct = res.headers.get("content-type") || "";
            if (!ct.includes("application/json")) return {};
            try { return await res.json(); } catch { return {}; }
        }

        function escapeHtml(str) {
            return String(str ?? "")
                .replaceAll("&","&amp;")
                .replaceAll("<","&lt;")
                .replaceAll(">","&gt;")
                .replaceAll("\"","&quot;")
                .replaceAll("'","&#039;");
        }
        function escapeJs(str) { return String(str ?? "").replaceAll("\\","\\\\").replaceAll("'","\\'"); }

        function onEdit(posNo){ location.href = `/admin/positions/${posNo}/edit`; }

        async function onDelete(posNo, posName) {
            const ok = confirm(`정말로 '${posName}' 직급을 삭제할까요?\n(삭제 후 복구 불가)`);
            if (!ok) return;

            try {
                const res = await fetch(`/api/v1/admin/positions/${posNo}`, {
                    method: "DELETE",
                    credentials: "include",
                    headers: { "Accept": "application/json" }
                });

                if (res.status === 401) return showToast("로그인이 필요합니다. 다시 로그인 해주세요.", true);
                if (res.status === 403) return showToast("권한이 없습니다. (COM_ADMIN만 가능)", true);

                if (!res.ok) {
                    let msg = `삭제 실패 (${res.status})`;
                    const json = await safeJson(res);
                    if (json && (json.message || json.error || json.msg)) msg = json.message || json.error || json.msg;
                    return showToast(msg, true);
                }

                showToast("삭제되었습니다.");
                await loadPositions();
            } catch (e) {
                console.error(e);
                showToast("삭제 중 예외가 발생했습니다.", true);
            }
        }

        async function loadPositions() {
            const tbody = document.getElementById("posTbody");
            const emptyBox = document.getElementById("emptyBox");
            tbody.innerHTML = "";
            emptyBox.style.display = "none";

            const res = await fetch("/api/v1/positions", {
                method: "GET",
                credentials: "include",
                headers: { "Accept": "application/json" }
            });

            if (res.status === 401) { emptyBox.style.display="block"; emptyBox.textContent="로그인이 필요합니다. 다시 로그인 해주세요."; return; }
            if (res.status === 403) { emptyBox.style.display="block"; emptyBox.textContent="권한이 없습니다. (COM_ADMIN만 가능)"; return; }
            if (!res.ok) { emptyBox.style.display="block"; emptyBox.textContent="직급 조회 중 오류가 발생했습니다. ("+res.status+")"; return; }

            const json = await safeJson(res);
            const list = json.data || [];
            if (!list.length) { emptyBox.style.display="block"; emptyBox.textContent="등록된 직급이 없습니다."; return; }

            list.forEach(p => {
                const posNo = p.posNo ?? p.id ?? "";
                const posName = p.posName ?? "";
                const posOrder = p.posOrder ?? p.order ?? "-";

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${escapeHtml(posNo)}</td>
                    <td>${escapeHtml(posName)}</td>
                    <td>${escapeHtml(posOrder)}</td>
                    <td>
                      <button class="mini-btn edit" type="button" onclick="onEdit(${posNo})">수정</button>
                      <button class="mini-btn del" type="button" onclick="onDelete(${posNo}, '${escapeJs(posName)}')">삭제</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            loadPositions().catch(err => {
                console.error(err);
                const emptyBox = document.getElementById("emptyBox");
                emptyBox.style.display = "block";
                emptyBox.textContent = "직급 조회 중 예외가 발생했습니다.";
            });
        });
    </script>
</th:block>
</body>
</html>
