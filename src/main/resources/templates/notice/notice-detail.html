<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지 내용 상세</title>
    <link rel="stylesheet" th:href="@{/css/styles1.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root{
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: rgba(17, 24, 39, 0.08);
            --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            --shadow2: 0 6px 18px rgba(17, 24, 39, 0.10);

            --primary: #3b82f6;      /* blue */
            --primary2: #2563eb;
            --danger: #ef4444;
            --danger2: #dc2626;
            --chip: rgba(59, 130, 246, 0.10);
            --success: #10b981;
            --warn: #f59e0b;
        }

        * { box-sizing: border-box; }

        body{
            margin: 0;
            background: radial-gradient(1200px 600px at 15% -10%, rgba(59,130,246,.15), transparent 55%),
            radial-gradient(900px 500px at 90% 0%, rgba(16,185,129,.12), transparent 55%),
            var(--bg);
            font-family: 'Noto Sans KR', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            color: var(--text);
        }

        /* 컨테이너: 가운데 카드 느낌 */
        .container{
            max-width: 920px;
            margin: 64px auto;
            padding: 0;
            background: transparent;
            box-shadow: none;
            border: none;
        }

        /* 상단 타이틀 영역(헤더 카드) */
        .notice-detail{
            background: linear-gradient(135deg, rgba(59,130,246,.10), rgba(255,255,255,0));
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* 실제 정보 카드 */
        .notice-info{
            background: var(--card);
            padding: 28px 28px 22px;
            border-radius: 18px;
        }

        /* 제목/내용 영역 정리 */
        .notice-info p{
            margin: 0;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(17,24,39,.12);
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 14px;
            align-items: start;
        }

        .notice-info p strong{
            color: var(--muted);
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        #noticeTitle{
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text);
        }

        #noticeDescription{
            margin: 0;
            padding: 12px 0;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        /* 내용 줄은 기존에 <p><strong>내용:</strong><p id="noticeDescription"> 구조가 살짝 깨져있어서
           #noticeDescription을 카드처럼 보이게 강화 */
        #noticeDescription{
            background: rgba(17,24,39,.03);
            border: 1px solid rgba(17,24,39,.06);
            border-radius: 12px;
            padding: 14px 14px;
        }

        /* 메타 영역을 2열로 보이게 */
        .notice-info{
            position: relative;
        }
        .notice-info::after{
            content:"";
            display:block;
            margin-top: 14px;
        }

        /* 팝업 여부 배지 느낌 */
        #noticePopup{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: 800;
            font-size: .9rem;
            border: 1px solid rgba(17,24,39,.10);
            background: rgba(17,24,39,.03);
        }

        /* JS 값이 true/false로 그대로 보이면 아쉬우니,
           true면 초록/false면 회색으로 보이게 하려면 JS에서 텍스트를 Y/N로 바꾸면 베스트.
           CSS만으로도 기본 배지 제공 */
        .notice-info p:last-child{ border-bottom: none; }

        /* 탭 버튼 영역 */
        .tab-buttons{
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }

        .tab-btn{
            border: 1px solid var(--line);
            background: var(--card);
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 800;
            color: var(--muted);
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(17,24,39,.04);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
        }

        .tab-btn.active{
            background: linear-gradient(135deg, rgba(59,130,246,.12), rgba(255,255,255,0));
            color: var(--text);
            border-color: rgba(59,130,246,.25);
        }

        .tab-btn:hover{
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(17,24,39,.08);
        }

        /* 첨부파일 카드 */
        #attach.tab-content{
            margin-top: 12px;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            padding: 14px;
        }

        /* 첨부파일 테이블 */
        #attachList{
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 12px;
        }

        #attachList th{
            text-align: left;
            font-size: .9rem;
            color: var(--muted);
            background: rgba(17,24,39,.03);
            padding: 12px 12px;
            border-bottom: 1px solid rgba(17,24,39,.08);
            font-weight: 800;
        }

        #attachList td{
            padding: 12px 12px;
            border-bottom: 1px solid rgba(17,24,39,.06);
            font-size: .95rem;
            color: var(--text);
        }

        #attachList tr:hover td{
            background: rgba(59,130,246,.05);
        }

        /* 페이지네이션 */
        #pagination{
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #pagination button{
            border: 1px solid rgba(17,24,39,.10);
            background: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            color: var(--muted);
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }

        #pagination button:hover{
            transform: translateY(-1px);
            border-color: rgba(59,130,246,.35);
            background: rgba(59,130,246,.06);
        }

        #pagination button.active{
            background: rgba(59,130,246,.12);
            border-color: rgba(59,130,246,.40);
            color: var(--text);
        }

        /* 하단 버튼 그룹 */
        .mt-4{
            margin-top: 16px !important;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn{
            appearance: none;
            border: 1px solid rgba(17,24,39,.10);
            background: var(--card);
            padding: 11px 14px;
            border-radius: 12px;
            font-weight: 900;
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(17,24,39,.06);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
        }

        .btn:hover{
            transform: translateY(-1px);
            box-shadow: var(--shadow2);
            border-color: rgba(59,130,246,.25);
            background: rgba(59,130,246,.05);
        }

        /* 수정/삭제 강조 */
        #update-btn.btn{
            background: linear-gradient(135deg, rgba(59,130,246,.14), rgba(255,255,255,0));
            border-color: rgba(59,130,246,.25);
        }

        #delete-btn.btn{
            background: linear-gradient(135deg, rgba(239,68,68,.12), rgba(255,255,255,0));
            border-color: rgba(239,68,68,.25);
        }

        #delete-btn.btn:hover{
            border-color: rgba(239,68,68,.40);
            background: rgba(239,68,68,.06);
        }

        /* 홈 링크 */
        .home-link{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            color: var(--primary2);
            text-decoration: none;
            font-weight: 900;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(59,130,246,.18);
            background: rgba(59,130,246,.06);
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }

        .home-link:hover{
            transform: translateY(-1px);
            border-color: rgba(59,130,246,.35);
            background: rgba(59,130,246,.10);
        }

    </style>
</head>
<body>
<div class="header">
    <!----
    <th:block th:replace="~{common/header :: header}"/>
    ---->
</div>

<div class="container">
    <h2>공지 사항 상세</h2>
    <div class="notice-detail">
        <div class="notice-info">
            <p><strong>제 목:</strong> <span id="noticeTitle"></span></p>
            <p><strong>내용:</strong> <span id="noticeDescription"></span></p>
            <p><strong>팝업여부:</strong> <span id="noticePopup"></span></p>
            <p><strong>팝업시작일:</strong> <span id="noticeStarted"></span></p>
            <p><strong>팝업종료일:</strong> <span id="noticeEnded"></span></p>
            <p><strong>조회건수:</strong> <span id="noticeRating"></span></p>
            <p><strong>작성자:</strong> <span id="noticeWriter"></span></p>
            <p><strong>등록일:</strong> <span id="noticeCreated"></span></p>
            <p><strong>변경일:</strong> <span id="noticeUpdated"></span></p>
        </div>
    </div>

    <div id="placeFavorite" style="margin-top: 10px; text-align: left;"></div>

    <div class="tab-buttons">
        <button class="tab-btn active" data-target="review">첨부 파일</button>
    </div>

    <div id="attach" class="tab-content active">
        <table id="attachList"></table>
        <div id="pagination"></div>
    </div>

    <div class="mt-4">
        <a href="/notice/list" class="btn">목록으로</a>
        <button id="update-btn" class="btn ms-2">수정하기</button>

        <!-- 로그인 사용자 = 작성자일 때만 표시
        <a id="edit-btn" th:href="@{|/notice/edit/${review.no}|}" class="btn ms-2">수정하기</a>
        -->
        <button id="delete-btn" class="btn ms-2" onclick="deleteNotice()">삭제하기</button>
    </div>

    <a href="/main" class="home-link">← 홈으로 돌아가기</a>
</div>


<script>
    const noticeNo = [[${noticeNo}]];

    async function loadPlaceDetail() {
        try {
            const token = localStorage.getItem('accessToken');
            const response = await fetch(`http://localhost:8090/api/v1/notice/${noticeNo}`,{
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            });

            const result = await response.json();

            if (result.status === 200 && result.data) {
                const notice = result.data;
                $('#noticeTitle').text(notice.title);
                $('#noticeDescription').text(notice.contents);
                $('#noticePopup').text(notice.isPopup);
                $('#noticeStarted').text(notice.startedAt);
                $('#noticeEnded').text(notice.endedAt);
                $('#noticeRating').text(notice.rating);
                $('#noticeWriter').text(notice.empId);
                $('#noticeCreated').text(notice.createdAt);
                $('#noticeUpdated').text(notice.updatedAt);

                initAttach();
            }
        } catch (error) {
            console.error('Error loading place detail:', error);
        }
    }

    // 수정 버튼 클릭 시 화면 이동
    document.getElementById('update-btn').onclick = () => {
        location.href = `/notice/update/${noticeNo}`;
    };

    async function initAttach() {
        try {
            const token = localStorage.getItem('accessToken');
            const response = await fetch(`http://localhost:8090/api/v1/notice/`,{
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });
            const result = await response.json();

            const attachList = $('#attachList').empty();

            if (result.status === 200 && result.data?.data?.length) {
                const attachs = result.data.data;
                const pageInfo = result.data.pageInfo;

                attachList.append(`
                    <tr><th>파일명</th><th>내용</th><th>작성자</th><th>첨부일자</th></tr>
                `);

                attachs.forEach(r => {

                    attachList.append(`
                        <tr>
                            <td>${r.title}</td>
                            <td>${r.content}</td>
                            <td>${r.writerEmail}</td>

                        </tr>
                    `);
                });

                renderPagination(pageInfo);
            } else {
                reviewList.html('<tr><td colspan="4">관련 리뷰가 없습니다.</td></tr>');
            }
        } catch (error) {
            console.error('Failed to load reviews:', error);
        }
    }

    async function deleteNotice() {
        if (!confirm("정말 삭제하시겠습니까?")) return;
        console.log(noticeNo);
        try {
            const accessToken = localStorage.getItem("accessToken");
            const response = await fetch(`/api/v1/notice/${noticeNo}`, {
                method: "DELETE",
                headers: {
                    "Authorization": `Bearer ${accessToken}`
                }
            });

            console.log(response);
            const result = await response.json();

            if (response.ok) {
                alert("공지사항이 삭제되었습니다.");
                window.location.href = "/notice/list";
            } else {
                alert(result.message || '공지사항 삭제 실패');
            }
        } catch (e) {
            console.error(e);
            alert("삭제 중 오류 발생");
        }
    }

    function renderPagination(pageInfo) {
        if (!pageInfo) return;
        const pagination = $('#pagination').empty();

        if (pageInfo.pageNo > 1)
            pagination.append(`<button onclick="initReview(${pageInfo.pageNo - 1})">이전</button>`);

        for (let i = pageInfo.startPage; i <= pageInfo.endPage; i++) {
            pagination.append(`<button class="${i === pageInfo.pageNo ? 'active' : ''}" onclick="initReview(${i})">${i}</button>`);
        }

        if (pageInfo.pageNo < pageInfo.maxPage)
            pagination.append(`<button onclick="initReview(${pageInfo.pageNo + 1})">다음</button>`);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadPlaceDetail();

    });
</script>

</body>
</html>
