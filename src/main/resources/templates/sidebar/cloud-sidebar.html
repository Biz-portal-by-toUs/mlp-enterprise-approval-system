<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<aside class="subbar cloud-subbar"
       sec:authorize="isAuthenticated()"
       th:fragment="cloudSidebar(active)">

    <div class="subbar-title">파일함</div>

    <!-- ✅ 공유함/개인함 탭 -->
    <div class="cloud-scope-tabs" role="tablist" aria-label="파일함 전환">
        <a class="cloud-scope-tab"
           role="tab"
           th:href="@{/cloud/dept}" href="/cloud/dept"
           th:classappend="${active}=='dept' ? ' active' : ''"
           th:attr="aria-selected=${active}=='dept'">
            공유함
        </a>

        <a class="cloud-scope-tab"
           role="tab"
           th:href="@{/cloud/prvt}" href="/cloud/prvt"
           th:classappend="${active}=='prvt' ? ' active' : ''"
           th:attr="aria-selected=${active}=='prvt'">
            개인함
        </a>
    </div>

    <!-- ✅ 트리(스크롤 영역) -->
    <div class="cloud-tree-panel">
        <ul class="cloud-tree" id="treeRoot"></ul>
    </div>

    <!-- ✅ 맨 아래 고정 휴지통 -->
    <div class="cloud-sidebar-footer">
        <a class="cloud-footer-link"
           th:href="@{/cloud/trash(scope=${active}=='prvt' ? 'PRVT' : 'DEPT')}"
           th:classappend="${active}=='trash' ? ' active' : ''"
           href="/cloud/trash">
            <span class="cloud-footer-ico" aria-hidden="true"></span>
            <span class="cloud-footer-text">휴지통</span>
        </a>
    </div>

</aside>

</body>
</html>
