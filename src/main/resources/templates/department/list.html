<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bizportal - Positions</title>
    <style>
        :root{
            --bg:#f3f3f3;
            --card:#fff;
            --text:#111;
            --muted:#666;
            --border:#d7d7d7;
            --primary:#2563eb;
            --danger:#ef4444;
            --radius:14px;
            --shadow:0 8px 24px rgba(0,0,0,.06);
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
            background:var(--bg);
            color:var(--text);
        }
        .wrap{max-width:1100px;margin:32px auto;padding:0 16px;}
        .topbar{
            display:flex; align-items:flex-end; justify-content:space-between;
            gap:16px; margin-bottom:16px;
        }
        .title h1{margin:0;font-size:22px;letter-spacing:-.3px;}
        .title p{margin:6px 0 0;color:var(--muted);font-size:13px}
        .actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end}
        .btn{
            border:1px solid var(--border);
            background:#fff;
            color:var(--text);
            padding:10px 12px;
            border-radius:12px;
            cursor:pointer;
            font-size:13px;
            text-decoration:none;
            display:inline-flex; align-items:center; gap:8px;
        }
        .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
        .btn.danger{background:#fff;border-color:#fecaca;color:#b91c1c;}
        .btn:hover{filter:brightness(.98)}
        .card{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            overflow:hidden;
        }
        .toolbar{
            padding:14px;
            border-bottom:1px solid var(--border);
            display:flex;
            gap:12px;
            align-items:center;
            justify-content:space-between;
            flex-wrap:wrap;
        }
        .search{
            display:flex; align-items:center; gap:10px;
            min-width:260px; flex:1;
        }
        .search input{
            width:100%;
            padding:10px 12px;
            border:1px solid var(--border);
            border-radius:12px;
            outline:none;
            font-size:13px;
            background:#fff;
        }
        .hint{color:var(--muted); font-size:12px;}
        table{
            width:100%;
            border-collapse:separate;
            border-spacing:0;
            font-size:13px;
        }
        thead th{
            text-align:left;
            background:#fafafa;
            padding:12px 14px;
            border-bottom:1px solid var(--border);
            color:#333;
            font-weight:600;
        }
        tbody td{
            padding:12px 14px;
            border-bottom:1px solid #eee;
            vertical-align:middle;
        }
        tbody tr:hover{background:#fcfcfc}
        .badge{
            display:inline-flex;
            padding:4px 10px;
            border-radius:999px;
            border:1px solid var(--border);
            background:#fff;
            font-size:12px;
            color:#333;
        }
        .row-actions{
            display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap;
        }
        .row-actions form{margin:0}
        .empty{
            padding:24px;
            text-align:center;
            color:var(--muted);
        }
        .flash{
            margin:0 0 14px;
            padding:12px 14px;
            border-radius:12px;
            border:1px solid var(--border);
            background:#fff;
            font-size:13px;
        }
        .flash.ok{border-color:#bbf7d0;background:#f0fdf4;color:#166534;}
        .flash.err{border-color:#fecaca;background:#fef2f2;color:#991b1b;}
        @media (max-width:720px){
            thead{display:none;}
            table, tbody, tr, td{display:block; width:100%;}
            tbody td{border-bottom:none; padding:10px 14px;}
            tbody tr{border-bottom:1px solid #eee;}
            .row-actions{justify-content:flex-start;}
            .cell-label{display:block; color:var(--muted); font-size:12px; margin-bottom:4px;}
        }
    </style>
</head>

<body>
<div class="wrap">
    <div class="topbar">
        <div class="title">
            <h1>직급 관리</h1>
            <p>등록된 직급 목록을 확인하고 수정/삭제할 수 있어요.</p>
        </div>

        <div class="actions">
            <!-- 필요하면 "등록" 페이지가 있을 때만 사용 -->
            <a class="btn primary" th:href="@{/admin/positions/new}">
                + 직급 등록
            </a>
            <a class="btn" th:href="@{/admin}">관리자 홈</a>
        </div>
    </div>

    <!-- flash message (controller에서 redirectAttributes로 message 내려줄 때) -->
    <div th:if="${message != null}"
         class="flash ok"
         th:text="${message}">
    </div>
    <div th:if="${error != null}"
         class="flash err"
         th:text="${error}">
    </div>

    <div class="card">
        <div class="toolbar">
            <div class="search">
                <input id="q" type="text" placeholder="검색: 직급명/직급코드/회사코드" />
            </div>
            <div class="hint">
                총 <b th:text="${#lists.size(positions)}">0</b>건
            </div>
        </div>

        <div th:if="${positions == null or #lists.isEmpty(positions)}" class="empty">
            등록된 직급이 없습니다.
        </div>

        <table th:if="${positions != null and !#lists.isEmpty(positions)}">
            <thead>
            <tr>
                <th style="width:90px;">No</th>
                <th style="width:140px;">직급코드</th>
                <th>직급명</th>
                <th style="width:140px;">회사코드</th>
                <th style="width:210px; text-align:right;">관리</th>
            </tr>
            </thead>

            <tbody id="posTbody">
            <tr th:each="p : ${positions}">
                <td>
                    <span class="cell-label">No</span>
                    <span th:text="${p.posNo}">1</span>
                </td>
                <td>
                    <span class="cell-label">직급코드</span>
                    <span class="badge" th:text="${p.posId}">P01</span>
                </td>
                <td>
                    <span class="cell-label">직급명</span>
                    <span th:text="${p.posName}">매니저</span>
                </td>
                <td>
                    <span class="cell-label">회사코드</span>
                    <span class="badge" th:text="${p.comId}">C01</span>
                </td>

                <td style="text-align:right;">
                    <div class="row-actions">
                        <a class="btn"
                           th:href="@{|/admin/positions/${p.posNo}/edit|}">
                            수정
                        </a>

                        <!-- DELETE (HiddenHttpMethodFilter 필요) -->
                        <form th:action="@{|/admin/positions/${p.posNo}|}" method="post"
                              onsubmit="return confirm('정말 삭제할까요?');">
                            <input type="hidden" name="_method" value="DELETE"/>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn danger">삭제</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 프론트에서만 간단 필터링(테이블 로우 숨김)
    const q = document.getElementById('q');
    const tbody = document.getElementById('posTbody');

    function normalize(s){
        return (s || '').toString().toLowerCase().replace(/\s+/g,'');
    }

    function filterRows(){
        if(!tbody) return;
        const keyword = normalize(q.value);
        const rows = tbody.querySelectorAll('tr');

        rows.forEach(tr => {
            const text = normalize(tr.innerText);
            tr.style.display = text.includes(keyword) ? '' : 'none';
        });
    }

    q?.addEventListener('input', filterRows);
</script>
</body>
</html>
