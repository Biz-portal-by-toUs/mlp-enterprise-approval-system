<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시 내용 상세</title>
    <link rel="stylesheet" th:href="@{/css/styles1.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        :root{
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: rgba(17, 24, 39, 0.08);
            --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            --shadow2: 0 6px 18px rgba(17, 24, 39, 0.10);

            --primary: #3b82f6;
            --primary2: #2563eb;
            --danger: #ef4444;
            --danger2: #dc2626;
            --success: #10b981;
            --warn: #f59e0b;
        }

        * { box-sizing: border-box; }

        body{
            margin: 0;
            background:
                    radial-gradient(1200px 600px at 15% -10%, rgba(59,130,246,.15), transparent 55%),
                    radial-gradient(900px 500px at 90% 0%, rgba(16,185,129,.12), transparent 55%),
                    var(--bg);
            font-family: 'Noto Sans KR', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            color: var(--text);
        }

        /* 컨테이너 */
        .container{
            max-width: 1280px;
            margin: 64px auto;
            padding: 0 14px;
            background: transparent;
            box-shadow: none;
            border: none;
        }

        /* 상단 카드 */
        .notice-detail{
            background: linear-gradient(135deg, rgba(59,130,246,.10), rgba(255,255,255,0));
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .notice-info{
            background: var(--card);
            padding: 18px 18px 16px;
            border-radius: 18px;
        }

        /* 제목 */
        .title-area{
            padding: 6px 6px 12px;
            border-bottom: 1px dashed rgba(17,24,39,.12);
        }
        #noticeTitle{
            font-size: 1.35rem;
            font-weight: 1000;
            color: var(--text);
            line-height: 1.25;
        }

        /* ✅ 제목 아래 메타/카테고리/작성자/등록일/조회수: 테이블 */
        .meta-card{
            margin-top: 12px;
            border: 1px solid rgba(17,24,39,.08);
            border-radius: 14px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
        }
        .meta-table{
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .meta-table th,
        .meta-table td{
            border-top: 1px solid rgba(17,24,39,.08);
            border-right: 1px solid rgba(17,24,39,.08);
            padding: 12px 12px;
            vertical-align: middle;
        }
        .meta-table tr:first-child th,
        .meta-table tr:first-child td{ border-top: 0; }
        .meta-table th{
            width: 150px;
            background: rgba(17,24,39,.02);
            font-weight: 1000;
            color:#111827;
            text-align: center;
            letter-spacing: -0.2px;
        }
        .meta-table td{ border-right: 0; font-weight: 900; }

        /* 작성자 + 풍선(tooltip) */
        .author-line{
            display:flex;
            align-items:center;
            gap:10px;
            flex-wrap: wrap;
        }
        .author-name{
            font-weight: 1000;
            color:#111827;
        }
        .pill{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(17,24,39,.14);
            background: rgba(17,24,39,.02);
            font-weight: 1000;
            color: var(--muted);
            font-size: 12px;
            position: relative;
            cursor: help;
            user-select:none;
        }
        .pill[data-tip]::after{
            content: attr(data-tip);
            position:absolute;
            left: 50%;
            top: calc(100% + 8px);
            transform: translateX(-50%);
            background: #111827;
            color: #fff;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 1000;
            white-space: nowrap;
            opacity: 0;
            pointer-events:none;
            transition: .15s ease;
            box-shadow: 0 12px 24px rgba(17,24,39,.22);
            z-index: 50;
        }
        .pill[data-tip]::before{
            content:"";
            position:absolute;
            left:50%;
            top: 100%;
            transform: translateX(-50%);
            border: 7px solid transparent;
            border-top-color: #111827;
            opacity: 0;
            transition: .15s ease;
            z-index: 50;
        }
        .pill:hover::after,
        .pill:hover::before{
            opacity: 1;
        }

        /* ✅ 등록일/조회수 한 줄 */
        .meta-inline{
            display:flex;
            gap: 16px;
            align-items:center;
            flex-wrap: wrap;
            font-weight: 900;
        }
        .meta-inline b{
            color: var(--muted);
            font-weight: 1000;
            margin-right: 6px;
        }
        .sep{
            color: rgba(17,24,39,.25);
            font-weight: 1000;
        }

        /* ✅ JSON 내용 출력 영역 */
        .content-card{
            margin-top: 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 14px;
        }
        #noticeDescription{
            background: rgba(17,24,39,.03);
            border: 1px solid rgba(17,24,39,.06);
            border-radius: 12px;
            padding: 14px 14px;
            line-height: 1.75;
            white-space: normal;
            min-height: 220px;
            font-weight: 700;
        }

        /* TipTap 렌더 테이블 스타일 */
        #noticeDescription table{
            width:100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin: 10px 0;
            background:#fff;
        }
        #noticeDescription td,
        #noticeDescription th{
            border:1px solid rgba(17,24,39,.18);
            padding:10px;
            vertical-align: top;
            word-break: break-word;
        }
        #noticeDescription th{
            background: rgba(17,24,39,.03);
            font-weight:1000;
            color: var(--muted);
        }

        /* 탭 버튼 */
        .tab-buttons{
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }
        .tab-btn{
            border: 1px solid var(--line);
            background: var(--card);
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 900;
            color: var(--muted);
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(17,24,39,.04);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
        }
        .tab-btn.active{
            background: linear-gradient(135deg, rgba(59,130,246,.12), rgba(255,255,255,0));
            color: var(--text);
            border-color: rgba(59,130,246,.25);
        }
        .tab-btn:hover{
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(17,24,39,.08);
        }

        /* 첨부파일 카드 */
        #attach.tab-content{
            margin-top: 12px;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            padding: 14px;
        }
        #attachList{
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 12px;
        }
        #attachList th{
            text-align: left;
            font-size: .9rem;
            color: var(--muted);
            background: rgba(17,24,39,.03);
            padding: 12px 12px;
            border-bottom: 1px solid rgba(17,24,39,.08);
            font-weight: 1000;
        }
        #attachList td{
            padding: 12px 12px;
            border-bottom: 1px solid rgba(17,24,39,.06);
            font-size: .95rem;
            color: var(--text);
            font-weight: 800;
        }
        #attachList tr:hover td{ background: rgba(59,130,246,.05); }

        /* 버튼 */
        .mt-4{
            margin-top: 16px !important;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn{
            appearance: none;
            border: 1px solid rgba(17,24,39,.10);
            background: var(--card);
            padding: 11px 14px;
            border-radius: 12px;
            font-weight: 1000;
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(17,24,39,.06);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
        }
        .btn:hover{
            transform: translateY(-1px);
            box-shadow: var(--shadow2);
            border-color: rgba(59,130,246,.25);
            background: rgba(59,130,246,.05);
        }
        #delete-btn.btn{
            background: linear-gradient(135deg, rgba(239,68,68,.12), rgba(255,255,255,0));
            border-color: rgba(239,68,68,.25);
        }
        #delete-btn.btn:hover{
            border-color: rgba(239,68,68,.40);
            background: rgba(239,68,68,.06);
        }
        .btn.btn-sm{
            padding: 8px 10px;
            font-weight: 900;
            box-shadow: 0 6px 14px rgba(17,24,39,.05);
        }

        /* ✅ 댓글 등록 UI + 댓글 리스트(원본 유지) */
        .comment-editor{
            margin-top: 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 12px;
        }
        .comment-editor textarea{
            width: 100%;
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }
        .comment-editor textarea:focus{
            border-color: rgba(59,130,246,.45);
            box-shadow: 0 0 0 4px rgba(59,130,246,.12);
        }
        .comment-editor__footer{
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .comment-editor__counter{
            color: var(--muted);
            font-weight: 900;
            font-size: 12px;
        }
        .comment-editor__actions{ display: flex; gap: 8px; }

        #comment{
            margin-top: 12px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 14px;
        }
        #commentList{
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 12px;
        }
        #commentList thead th{
            text-align: left;
            font-size: .9rem;
            color: var(--muted);
            background: rgba(17,24,39,.03);
            padding: 12px 12px;
            border-bottom: 1px solid rgba(17,24,39,.08);
            font-weight: 1000;
        }
        #commentList tbody td{
            padding: 14px 12px;
            border-bottom: 1px solid rgba(17,24,39,.06);
            font-size: .95rem;
            color: var(--text);
            vertical-align: top;
            font-weight: 800;
        }
        #commentList tbody tr:hover td{ background: rgba(59,130,246,.05); }
        .comment-content{
            display: inline-block;
            max-width: 100%;
            background: rgba(17,24,39,.03);
            border: 1px solid rgba(17,24,39,.06);
            border-radius: 12px;
            padding: 10px 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            font-weight: 800;
        }
        .comment-meta{
            display: inline-flex;
            flex-direction: column;
            gap: 4px;
        }
        .comment-meta .name{ font-weight: 1000; color: var(--text); }
        .comment-meta .dept{ font-size: .85rem; font-weight: 900; color: var(--muted); }
        .comment-date{ font-size: .85rem; font-weight: 900; color: var(--muted); white-space: nowrap; }
        .comment-no{ font-weight: 1000; color: var(--muted); width: 80px; }

        @media (max-width: 720px){
            .meta-table th{ width: 120px; }
            #commentList thead{ display: none; }
            #commentList, #commentList tbody, #commentList tr, #commentList td{
                display: block;
                width: 100%;
            }
            #commentList tbody tr{
                border: 1px solid rgba(17,24,39,.06);
                border-radius: 14px;
                margin-bottom: 10px;
                overflow: hidden;
            }
            #commentList tbody td{ border-bottom: 1px solid rgba(17,24,39,.06); }
            #commentList tbody td:last-child{ border-bottom: none; }
            .comment-no{ width: auto; }
        }
    </style>
</head>

<body>
<div class="header">
    <!-- <th:block th:replace="~{common/header :: header}"/> -->
</div>

<div class="container">
    <h2>자유게시판내용 및 댓글</h2>

    <div class="notice-detail">
        <div class="notice-info">

            <!-- ✅ 제목만 크게 -->
            <div class="title-area">
                <div id="noticeTitle">제목</div>
            </div>

            <!-- ✅ 제목 아래 테이블(카테고리/작성자/등록일/조회) -->
            <div class="meta-card">
                <table class="meta-table">
                    <tr>
                        <th>카테고리</th>
                        <td><span id="noticeCategory"></span></td>
                    </tr>
                    <tr>
                        <th>작성자</th>
                        <td>
                            <div class="author-line">
                                <span class="author-name" id="noticeWriter"></span>

                                <!-- 직번/부서는 풍선(hover) -->
                                <span class="pill" id="pillEmpId" data-tip="">직번</span>
                                <span class="pill" id="pillDept" data-tip="">부서</span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <th>등록/조회</th>
                        <td>
                            <div class="meta-inline">
                                <span><b>등록일</b><span id="noticeCreated"></span></span>
                                <span class="sep">|</span>
                                <span><b>조회</b><span id="noticeRating"></span></span>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>

            <!-- ✅ 내용(JSON 렌더 결과) -->
            <div class="content-card">
                <div style="font-weight:1000; color:var(--muted); margin-bottom:10px;">📝 내용</div>
                <div id="noticeDescription"></div>
            </div>

        </div>
    </div>

    <div id="placeFavorite" style="margin-top: 10px; text-align: left;"></div>

    <div class="tab-buttons">
        <button class="tab-btn active" data-target="review">첨부 파일</button>
    </div>

    <div id="attach" class="tab-content active">

    </div>

    <h2 style="margin-top:18px;">관련 댓글</h2>
    <div id="comment">
        <table id="commentList"></table>
    </div>

    <!-- ✅ 댓글 등록 입력란 -->
    <div id="commentEditor" class="comment-editor">
        <textarea id="commentContents" placeholder="의견입력" rows="5"></textarea>
        <div class="comment-editor__footer">
            <div class="comment-editor__counter">
                <span id="commentByte">0</span>/600bytes
            </div>
            <div class="comment-editor__actions">
                <button type="button" class="btn btn-sm" id="commentSubmitBtn">등록</button>
                <button type="button" class="btn btn-sm" id="commentCancelBtn">취소</button>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a href="/board/list" class="btn">목록으로</a>
        <button id="delete-btn" class="btn ms-2" onclick="deleteBoard()">삭제하기</button>
    </div>
</div>

<!-- ✅ TipTap JSON -> HTML 변환(상세조회에서 contents를 JSON으로 렌더) -->
<script type="module">
    import { generateHTML } from "https://esm.sh/@tiptap/html@2.11.5";
    import StarterKit from "https://esm.sh/@tiptap/starter-kit@2.11.5";
    import Underline from "https://esm.sh/@tiptap/extension-underline@2.11.5";
    import TextAlign from "https://esm.sh/@tiptap/extension-text-align@2.11.5";
    import Table from "https://esm.sh/@tiptap/extension-table@2.11.5";
    import TableRow from "https://esm.sh/@tiptap/extension-table-row@2.11.5";
    import TableHeader from "https://esm.sh/@tiptap/extension-table-header@2.11.5";
    import TableCell from "https://esm.sh/@tiptap/extension-table-cell@2.11.5";

    // window.__renderBoardContentsJson(jsonStringOrObj)
    window.__renderBoardContentsJson = function(raw){
        const target = document.getElementById("noticeDescription");
        let json;

        try{
            if (!raw) {
                json = { type:"doc", content:[{ type:"paragraph" }] };
            } else if (typeof raw === "string") {
                json = JSON.parse(raw);
            } else {
                json = raw;
            }
        }catch(e){
            console.error("contents JSON 파싱 실패:", e);
            json = { type:"doc", content:[{ type:"paragraph", content:[{ type:"text", text:"(내용을 불러오지 못했습니다.)" }] }] };
        }

        const html = generateHTML(json, [
            StarterKit,
            Underline,
            TextAlign.configure({ types: ["heading", "paragraph"] }),
            Table.configure({ resizable: true }),
            TableRow,
            TableHeader,
            TableCell,
        ]);

        target.innerHTML = html;
    };
</script>

<script>
    const boardNo = [[${boardNo}]];
    const API_BASE = "http://localhost:8090";

    async function loadBoardDetail() {
        try {
            const response = await fetch(`${API_BASE}/api/v1/board/${boardNo}`, {
                method: 'GET',
                credentials: "include",
                headers: {'Content-Type': 'application/json' }
            });

            const result = await response.json();

            if (result.status === 200 && result.data) {
                const board = result.data;

                // ✅ 제목
                $('#noticeTitle').text(board.title ?? "");

                // ✅ 내용(JSON 렌더)
                // board.contents가 JSON 문자열이어야 함 (등록화면에서 JSON.stringify(editor.getJSON()) 저장한 값)
                if (window.__renderBoardContentsJson) {
                    window.__renderBoardContentsJson(board.contents);
                } else {
                    // 혹시 모듈 로드 타이밍 이슈 대비
                    $('#noticeDescription').text(board.contents ?? "");
                }

                // ✅ 카테고리
                $('#noticeCategory').text(board.catDescript ?? "-");

                // ✅ 조회수
                $('#noticeRating').text(board.rating ?? 0);

                // ✅ 작성자(이름만)
                $('#noticeWriter').text(board.empName ?? "-");

                // ✅ 직번/부서: 풍선으로
                const empId = board.empId ?? "-";
                const depName = board.depName ?? "-";
                $('#pillEmpId').attr('data-tip', `직번: ${empId}`);
                $('#pillDept').attr('data-tip', `부서: ${depName}`);

                // ✅ 등록일(기존 substring 대신 조금 더 안전)
                const createdAt = board.createdAt ? String(board.createdAt).substring(0, 10) : "-";
                $('#noticeCreated').text(createdAt);

                initAttach();
                initComment();
            }
        } catch (error) {
            console.error('Error loading board detail:', error);
        }
    }

    function unwrapMaybeResponseDto(obj) {
        if (obj && typeof obj === "object" && "data" in obj) return obj.data;
        return obj;
    }

    async function initAttach() {
        try {
            const response = await fetch(`${API_BASE}/api/v1/attachments?domain=BOARD&entityId=${boardNo}`, {
                method: 'GET',
                credentials: "include",
                headers: { 'Content-Type': 'application/json' }
            });

            const result = await response.json();
            const attachList = $('#attachList').empty();

            if (result.status === 200 && result.data?.length) {
                const attachs = result.data;

                attachList.append(`
          <tr>
            <th>일련번호</th>
            <th>파일명</th>
            <th>attachmentId</th>
            <th>displayOrder</th>
            <th>size</th>
            <th>미리보기</th>
            <th>다운로드</th>
          </tr>
        `);

                attachs.forEach((r, index) => {
                    attachList.append(`
            <tr>
              <td>${index+1}</td>
              <td>${escapeHtml(r.originalName)}</td>
              <td>${r.attachmentId}</td>
              <td>${r.displayOrder}</td>
              <td>${formatFileSize(r.size)}</td>
              <td><button type="button" class="btn btn-sm" data-view="${r.attachmentId}">미리보기</button></td>
              <td><button type="button" class="btn btn-sm" data-down="${r.attachmentId}">다운로드</button></td>
            </tr>
          `);
                });

                document.querySelectorAll("button[data-down]").forEach(btn => {
                    btn.addEventListener("click", async (e) => {
                        const attachmentId = Number(e.currentTarget.getAttribute("data-down"));
                        await downAttachment(attachmentId);
                    });
                });

                document.querySelectorAll("button[data-view]").forEach(btn => {
                    btn.addEventListener("click", async (e) => {
                        const attachmentId = Number(e.currentTarget.getAttribute("data-view"));
                        await viewAttachment(attachmentId);
                    });
                });

            } else {
                attachList.html('<tr><td colspan="7">관련 첨부파일이 없습니다.</td></tr>');
            }

        } catch (error) {
            console.error('Failed to load attachment file:', error);
        }
    }

    function escapeHtml(str){
        return String(str || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function formatFileSize(bytes) {
        if (bytes == null || isNaN(bytes)) return "-";
        if (bytes < 1024) return `${bytes} B`;

        const kb = bytes / 1024;
        if (kb < 1024) return `${kb.toFixed(1)} KB`;

        const mb = kb / 1024;
        return `${mb.toFixed(1)} MB`;
    }

    async function fetchDownloadUrl(attachmentId) {
        const res = await fetch(`${API_BASE}/api/v1/attachments/${attachmentId}/download-url`, {
            method: "GET",
            credentials: "include",
            headers: { 'Accept': 'application/json' }
        });

        if (!res.ok) throw new Error("download-url 호출 실패: " + await res.text());

        const raw = await res.json();
        const data = unwrapMaybeResponseDto(raw);
        const url = data.url;

        if (typeof url !== "string" || !url.startsWith("http")) {
            console.error("응답:", raw);
            throw new Error("응답에 url이 없습니다. (data.url 확인)");
        }
        return { url, meta: data };
    }

    async function fetchPreviewloadUrl(attachmentId) {
        const res = await fetch(`${API_BASE}/api/v1/attachments/${attachmentId}/preview-url`, {
            method: "GET",
            credentials: "include",
            headers: { 'Accept': 'application/json' }
        });

        if (!res.ok) throw new Error("preview-url 호출 실패: " + await res.text());

        const raw = await res.json();
        const data = unwrapMaybeResponseDto(raw);
        const url = data.url;

        if (typeof url !== "string" || !url.startsWith("http")) {
            console.error("응답:", raw);
            throw new Error("응답에 url이 없습니다. (data.url 확인)");
        }
        return { url, meta: data };
    }

    async function downAttachment(attachmentId) {
        if (!attachmentId) return;
        if (!confirm(`attachmentId=${attachmentId} 파일을 다운로드 할까요?`)) return;

        try {
            const { url, meta } = await fetchDownloadUrl(attachmentId);
            const a = document.createElement("a");
            a.href = url;
            a.rel = "noopener";
            a.download = meta.originalName || "";
            document.body.appendChild(a);
            a.click();
            a.remove();
        } catch (e) {
            console.error(e);
            alert("다운로드 중 오류: " + (e?.message ?? e));
        }
    }

    async function viewAttachment(attachmentId) {
        if (!attachmentId) return;

        try {
            const { url } = await fetchPreviewloadUrl(attachmentId);
            window.open(url, "_blank", "noopener");
        } catch (e) {
            console.error(e);
            alert("미리보기 중 오류: " + (e?.message ?? e));
        }
    }

    async function deleteBoard() {
        if (!confirm("정말 삭제하시겠습니까?")) return;

        try {
            const res = await fetch(`/api/v1/board/${boardNo}`, {
                method: "DELETE",
                credentials: "include"
            });

            if (res.ok) {
                alert("게시글이 삭제되었습니다.");
                window.location.href = "/board/list";
            } else {
                alert("삭제 실패했습니다.");
            }
        } catch (e) {
            console.error(e);
            alert("삭제 중 오류 발생");
        }
    }

    async function initComment() {
        try {
            const response = await fetch(`${API_BASE}/api/v1/boards/${boardNo}/comments`, {
                method: 'GET',
                credentials: "include"
            });

            const result = await response.json();
            const commentList = $('#commentList').empty();

            if (!result.data || result.data.length === 0) {
                commentList.html(`<tr><td colspan="5">등록된 댓글이 없습니다.</td></tr>`);
                return;
            }

            if (result.status === 200 && result.data) {
                const comments = result.data;

                commentList.append(`
          <thead>
            <tr>
              <th>일련번호</th>
              <th>내용</th>
              <th>작성자</th>
              <th>부서</th>
              <th>등록일자</th>
            </tr>
          </thead>
          <tbody></tbody>
        `);

                const tbody = commentList.find("tbody");
                comments.forEach((r, index) => {
                    const createdAt = r.createdAt ? String(r.createdAt).substring(0, 10) : "-";
                    tbody.append(`
            <tr>
              <td class="comment-no">${index + 1}</td>
              <td><div class="comment-content">${escapeHtml(r.contents ?? "")}</div></td>
              <td>
                <div class="comment-meta">
                  <div class="name">${escapeHtml(r.empName ?? "-")}</div>
                </div>
              </td>
              <td>
                <div class="comment-meta">
                  <div class="dept">${escapeHtml(r.depName ?? "-")}</div>
                </div>
              </td>
              <td class="comment-date">${createdAt}</td>
            </tr>
          `);
                });

            } else {
                commentList.html('<tr><td colspan="5">관련 댓글이 없습니다.</td></tr>');
            }
        } catch (error) {
            console.error('Failed to load board comments :', error);
        }
    }

    // ===== 댓글 bytes 제한(원본 유지) =====
    function getUtf8Bytes(str) {
        return new Blob([str ?? ""], { type: "text/plain; charset=UTF-8" }).size;
    }

    function enforceByteLimit(text, limitBytes = 600) {
        if (!text) return "";

        let lo = 0, hi = text.length;
        while (lo < hi) {
            const mid = Math.ceil((lo + hi) / 2);
            const sliced = text.slice(0, mid);
            if (getUtf8Bytes(sliced) <= limitBytes) lo = mid;
            else hi = mid - 1;
        }
        return text.slice(0, lo);
    }

    function updateCommentByteCounter() {
        const ta = document.getElementById("commentContents");
        const counter = document.getElementById("commentByte");

        const limited = enforceByteLimit(ta.value, 600);
        if (limited !== ta.value) ta.value = limited;

        counter.textContent = String(getUtf8Bytes(ta.value));
    }

    async function submitComment() {
        const contentsEl = document.getElementById("commentContents");
        const contents = (contentsEl.value ?? "").trim();

        if (!contents) {
            alert("댓글 내용을 입력해주세요.");
            contentsEl.focus();
            return;
        }

        const fd = new FormData();
        fd.append("boardNo", String(boardNo));
        fd.append("contents", contents);

        try {
            const res = await fetch(`${API_BASE}/api/v1/comment`, {
                method: "POST",
                credentials: "include",
                body: fd
            });

            const json = await res.json().catch(() => null);

            if (!res.ok) {
                console.error("댓글 등록 실패:", res.status, json);
                alert("댓글 등록 실패: " + (json?.message ?? res.statusText));
                return;
            }

            alert(json?.message ?? "댓글 등록 성공");
            contentsEl.value = "";
            updateCommentByteCounter();
            await initComment();

        } catch (e) {
            console.error(e);
            alert("댓글 등록 중 오류: " + (e?.message ?? e));
        }
    }

    function cancelComment() {
        const contentsEl = document.getElementById("commentContents");
        contentsEl.value = "";
        updateCommentByteCounter();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadBoardDetail();

        const ta = document.getElementById("commentContents");
        const submitBtn = document.getElementById("commentSubmitBtn");
        const cancelBtn = document.getElementById("commentCancelBtn");

        if (ta) {
            ta.addEventListener("input", updateCommentByteCounter);
            updateCommentByteCounter();
        }
        if (submitBtn) submitBtn.addEventListener("click", submitComment);
        if (cancelBtn) cancelBtn.addEventListener("click", cancelComment);
    });
</script>
