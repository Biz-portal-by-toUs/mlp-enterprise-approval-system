<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">

<th:block layout:fragment="pageStyles">
    <link rel="stylesheet" th:href="@{/css/styles1.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ❌ 기존 notice-detail의 :root, body는 layout이 담당하므로 제거 권장 (겹치면 전체 레이아웃 덮임)
           필요한 스타일만(컨텐츠 영역 클래스들) 유지 */

        *{ box-sizing:border-box; }

        .subbar-main{
            flex: 1;
            min-width: 0;
            padding: 24px; /* meeting 톤 */
        }

        .notice-detail-wrap{
            width: 100%;
            max-width: none;   /* ✅ 제한 해제 */
            margin: 0;         /* ✅ auto 제거 */
            padding: 0;        /* ✅ main이 padding 갖고 있음 */
        }


        h2{
            margin: 0 0 14px;
            font-weight: 900;
            letter-spacing: -0.3px;
        }

        .card{
            background: var(--white, #fff);
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            overflow: hidden;
            margin-bottom: 14px;
        }

        .summary-table{
            width:100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .summary-table th,
        .summary-table td{
            border-top: 1px solid rgba(17,24,39,.08);
            padding: 14px 14px;
            vertical-align: middle;
        }
        .summary-table tr:first-child th,
        .summary-table tr:first-child td{ border-top: 0; }
        .summary-table th{
            width: 160px;
            background: rgba(17,24,39,.02);
            font-weight: 900;
            color: #111827;
            text-align: center;
            letter-spacing: -0.2px;
        }
        .summary-table td{
            font-weight: 800;
            color: var(--text, #1f2937);
        }

        .badge{
            display:inline-flex;
            align-items:center;
            gap:6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 900;
            border: 1px solid transparent;
            line-height: 1;
        }
        .badge.success{
            background: rgba(16,185,129,.12);
            color: var(--success, #10b981);
            border-color: rgba(16,185,129,.30);
        }
        .badge.muted{
            background: rgba(107,114,128,.12);
            color: var(--muted, #6b7280);
            border-color: rgba(107,114,128,.30);
        }

        .period-inline{
            display:flex;
            align-items:center;
            gap:10px;
            flex-wrap: wrap;
            color: var(--muted, #6b7280);
            font-weight: 900;
        }
        .period-inline .sep{ color: var(--muted, #6b7280); }

        .contents-card{
            background: var(--white, #fff);
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            overflow: hidden;
            margin-bottom: 14px;
        }
        .contents-body{
            padding: 18px;
            background:#fff;
        }

        #noticeDescription{
            white-space: normal;
            line-height: 1.75;
        }

        #noticeDescription .ProseMirror{
            outline:none;
            white-space: pre-wrap;
            line-height: 1.75;
        }

        #noticeDescription h2{
            margin: 12px 0 8px;
            font-size: 1.25rem;
            font-weight: 900;
        }
        #noticeDescription p{ margin: 8px 0; }
        #noticeDescription ul,
        #noticeDescription ol{ padding-left: 22px; margin: 8px 0; }
        #noticeDescription blockquote{
            margin: 10px 0;
            padding: 10px 12px;
            border-left: 4px solid rgba(59,130,246,.35);
            background: rgba(59,130,246,.06);
            border-radius: 10px;
        }
        #noticeDescription pre{
            background: rgba(17,24,39,.06);
            padding: 12px;
            border-radius: 10px;
            overflow:auto;
        }
        #noticeDescription code{
            background: rgba(17,24,39,.06);
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 800;
        }
        #noticeDescription a{
            color: var(--primary2, #2563eb);
            font-weight: 900;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        #noticeDescription table{
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
            margin: 10px 0;
        }
        #noticeDescription th,
        #noticeDescription td{
            border: 1px solid rgba(17,24,39,.18);
            padding: 10px;
            vertical-align: top;
            word-break: break-word;
            position: relative;
        }
        #noticeDescription th{
            background: rgba(17,24,39,.03);
            font-weight: 900;
            color: var(--muted, #6b7280);
        }
        #noticeDescription .selectedCell:after{
            content:"";
            position:absolute;
            inset:0;
            background: rgba(59,130,246,.08);
            pointer-events:none;
        }

        .writer-wrap{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
        }
        .writer-btn{
            appearance:none;
            border: 0;
            background: transparent;
            padding: 0;
            cursor: pointer;
            color: var(--primary2, #2563eb);
            font-weight: 900;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .writer-btn:focus{ outline: none; }

        .tooltip-bubble{
            position: absolute;
            z-index: 50;
            min-width: 220px;
            max-width: 320px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #111827;
            color: #fff;
            box-shadow: 0 16px 36px rgba(0,0,0,.18);
            border: 1px solid rgba(255,255,255,.12);
            transform: translateY(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s ease, transform .15s ease;
        }
        .tooltip-bubble::before{
            content:"";
            position:absolute;
            top: -7px;
            left: 18px;
            width: 12px;
            height: 12px;
            background: #111827;
            transform: rotate(45deg);
            border-left: 1px solid rgba(255,255,255,.12);
            border-top: 1px solid rgba(255,255,255,.12);
        }
        .tooltip-title{
            font-weight: 1000;
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }
        .tooltip-row{
            display:flex;
            justify-content: space-between;
            gap: 10px;
            font-weight: 800;
            font-size: 13px;
            color: rgba(255,255,255,.92);
        }
        .tooltip-row span:first-child{ color: rgba(255,255,255,.70); }

        .tooltip-host{
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .tooltip-host.show .tooltip-bubble{
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .meta-inline{
            display:flex;
            align-items:center;
            gap: 14px;
            flex-wrap: wrap;
            color: var(--muted, #6b7280);
            font-weight: 900;
        }
        .meta-inline .meta-item{
            display:inline-flex;
            align-items:center;
            gap:8px;
        }
        .meta-inline .k{
            color: #111827;
            opacity: .65;
            font-weight: 900;
        }
        .meta-inline .v{
            color: #111827;
            font-weight: 1000;
        }

        .attach-card{
            background: var(--white, #fff);
            border: 1px solid rgba(17,24,39,.10);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            padding: 14px;
            margin-bottom: 14px;
        }
        .attach-head{
            display:flex;
            align-items:center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .attach-title{
            margin:0;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: -0.2px;
        }

        #attachList{
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 10px;
        }
        #attachList th{
            text-align:left;
            font-size: .9rem;
            color: var(--muted, #6b7280);
            background: rgba(17,24,39,.03);
            padding: 12px;
            border-bottom: 1px solid rgba(17,24,39,.08);
            font-weight: 900;
        }
        #attachList td{
            padding: 12px;
            border-bottom: 1px solid rgba(17,24,39,.06);
            font-size: .95rem;
            color: var(--text, #1f2937);
            font-weight: 700;
        }
        #attachList tr:hover td{ background: rgba(59,130,246,.05); }

        .btn{
            appearance:none;
            border: 1px solid rgba(17,24,39,.12);
            background: #fff;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 900;
            color: var(--text, #1f2937);
            text-decoration:none;
            cursor:pointer;
            box-shadow: 0 8px 18px rgba(17,24,39,.06);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
            display:inline-flex;
            align-items:center;
            gap:8px;
        }
        .btn:hover{
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(17,24,39,.10);
            border-color: rgba(59,130,246,.28);
            background: rgba(59,130,246,.05);
        }
        .btn-primary{
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-color: rgba(59,130,246,.25);
            color:#fff;
            box-shadow: 0 12px 24px rgba(59,130,246,.28);
        }
        .btn-primary:hover{
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-color: rgba(59,130,246,.35);
        }
        .btn-danger{
            background: linear-gradient(135deg, rgba(220,38,38,.14), rgba(255,255,255,0));
            border-color: rgba(220,38,38,.25);
            color: #991b1b;
        }
        .btn-danger:hover{
            background: rgba(220,38,38,.06);
            border-color: rgba(220,38,38,.40);
        }
        .btn-sm{
            padding: 8px 10px;
            font-weight: 900;
            border-radius: 8px;
            font-size: 12px;
            box-shadow: 0 6px 14px rgba(17,24,39,.05);
        }

        .actions{
            display:flex;
            justify-content:flex-end;
            gap:10px;
            flex-wrap:wrap;
            margin-top: 10px;
        }

        @media (max-width: 720px){
            .summary-table th{ width: 110px; }
            .tooltip-bubble{ left: 0 !important; right: auto !important; }
        }
    </style>
</th:block>

<div layout:fragment="content">
    <div class="page-with-subbar">
        <!-- ✅ notice-list와 동일하게 게시판 서브바 도킹 -->
        <div th:replace="~{sidebar/board-sidebar :: boardSidebar('notice')}"></div>
        <main class="subbar-main">
        <!-- ✅ 상세 본문 -->
        <div class="notice-detail-wrap">
            <h2>공지사항 상세</h2>

            <div class="card">
                <table class="summary-table">
                    <tr>
                        <th>제목</th>

                              <button type="button" class="writer-btn" id="noticeWriterBtn">
                                <span id="noticeWriter">-</span>
                              </button>

                              <div class="tooltip-bubble" id="writerTooltip">

                    <tr>
                        <th>정보</th>
                        <td>

                              <span class="meta-item">
                                <span class="k">등록일</span><span class="v" id="noticeCreated">-</span>
                              </span>
                                <span class="meta-item">
                                <span class="k">변경일</span><span class="v" id="noticeUpdated">-</span>
                              </span>
                                <span class="meta-item">

        </main>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <!-- ✅ 기존에 head에 있던 jQuery 포함(생략 X) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- ✅ TipTap viewer (원본 그대로) -->
    <script type="module">
        import { Editor } from "https://esm.sh/@tiptap/core@2.11.5";
        import StarterKit from "https://esm.sh/@tiptap/starter-kit@2.11.5";
        import Underline from "https://esm.sh/@tiptap/extension-underline@2.11.5";
        import TextAlign from "https://esm.sh/@tiptap/extension-text-align@2.11.5";
        import Table from "https://esm.sh/@tiptap/extension-table@2.11.5";
        import TableRow from "https://esm.sh/@tiptap/extension-table-row@2.11.5";
        import TableHeader from "https://esm.sh/@tiptap/extension-table-header@2.11.5";
        import TableCell from "https://esm.sh/@tiptap/extension-table-cell@2.11.5";

        let viewer = null;

        function ensureViewer(){
            if (viewer) return viewer;
            const host = document.querySelector("#noticeDescription");
            viewer = new Editor({
                element: host,
                editable: false,
                extensions: [
                    StarterKit,
                    Underline,
                    TextAlign.configure({ types: ["heading","paragraph"] }),
                    Table.configure({ resizable: true }),
                    TableRow, TableHeader, TableCell,
                ],
                content: { type:"doc", content:[{ type:"paragraph" }] },
            });
            return viewer;
        }

        function isProbablyJson(str){
            if (typeof str !== "string") return false;
            const s = str.trim();
            if (!s) return false;
            if (!(s.startsWith("{") || s.startsWith("["))) return false;
            try{
                const obj = JSON.parse(s);
                return !!obj && typeof obj === "object" && (obj.type === "doc" || obj.content);
            }catch{ return false; }
        }

        function isProbablyHtml(str){
            if (typeof str !== "string") return false;
            const s = str.trim();
            if (!s) return false;
            return /<\/?[a-z][\s\S]*>/i.test(s);
        }

        function escapeHtml(str){
            return String(str ?? "")
                .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
                .replaceAll('"',"&quot;").replaceAll("'","&#039;");
        }

        window.renderNoticeContentsAuto = (contents)=>{
            const host = document.querySelector("#noticeDescription");

            if (contents == null) {
                host.innerHTML = "<p>-</p>";
                return;
            }

            if (typeof contents === "object") {
                const ed = ensureViewer();
                ed.commands.setContent(contents);
                return;
            }

            const raw = String(contents);

            if (isProbablyJson(raw)) {
                const ed = ensureViewer();
                ed.commands.setContent(JSON.parse(raw));
                return;
            }

            if (isProbablyHtml(raw)) {
                if (viewer) { viewer.destroy(); viewer = null; host.innerHTML = ""; }
                host.innerHTML = raw; // ❗ 서버 sanitize 권장
                return;
            }

            if (viewer) { viewer.destroy(); viewer = null; host.innerHTML = ""; }
            host.innerHTML = `<p>${escapeHtml(raw).replaceAll("\n","<br>")}</p>`;
        };
    </script>

    <!-- ✅ 기존 script(원본 그대로) -->
    <script>
        const noticeNo = [[${noticeNo}]];
        const API_BASE = "http://localhost:8090";

        function setupWriterTooltip() {
            const host = document.getElementById("writerTooltipHost");
            const btn = document.getElementById("noticeWriterBtn");

            function show() { host.classList.add("show"); }
            function hide() { host.classList.remove("show"); }
            function toggle() { host.classList.toggle("show"); }

            host.addEventListener("mouseenter", show);
            host.addEventListener("mouseleave", hide);

            btn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggle();
            });

            document.addEventListener("click", (e) => {
                if (!host.contains(e.target)) hide();
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") hide();
            });
        }

        async function loadPlaceDetail(){
            try{
                const response = await fetch(`${API_BASE}/api/v1/notice/${noticeNo}`, {
                    method: 'GET',
                    credentials: "include",
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (result.status === 200 && result.data) {
                    const notice = result.data;

                    $('#noticeTitle').text(notice.title ?? "-");

                    if (window.renderNoticeContentsAuto) window.renderNoticeContentsAuto(notice.contents);
                    else $('#noticeDescription').text(notice.contents ?? "");

                    const isPopup = notice.isPopup === true || notice.isPopup === 'true';
                    $('#noticePopup').html(
                        isPopup ? `<span class="badge success">사용</span>` : `<span class="badge muted">미사용</span>`
                    );

                    $('#noticeStarted').text(notice.startedAt ? notice.startedAt.substring(0,10) : "-");
                    $('#noticeEnded').text(notice.endedAt ? notice.endedAt.substring(0,10) : "-");

                    $('#noticeWriter').text(notice.empName ?? "-");
                    $('#noticeWriterId').text(notice.empId ?? "-");
                    $('#noticeDepart').text(notice.depName ?? "-");

                    $('#noticeCreated').text(notice.createdAt ? notice.createdAt.substring(0,10) : "-");
                    $('#noticeUpdated').text(notice.updatedAt ? notice.updatedAt.substring(0,10) : "-");
                    $('#noticeRating').text(notice.rating ?? "-");

                    initAttach();
                    setupWriterTooltip();
                }
            }catch(e){
                console.error(e);
                alert("상세 로딩 중 오류가 발생했습니다.");
            }
        }

        document.getElementById('update-btn').onclick = () => {
            location.href = `/notice/update/${noticeNo}`;
        };

        function unwrapMaybeResponseDto(obj) {
            if (obj && typeof obj === "object" && "data" in obj) return obj.data;
            return obj;
        }

        async function initAttach(){
            try{
                const response = await fetch(`${API_BASE}/api/v1/attachments?domain=NOTICE&entityId=${noticeNo}`, {
                    method:'GET',
                    credentials:"include",
                    headers:{ 'Content-Type': 'application/json' }
                });

                const result = await response.json();
                const attachList = $('#attachList').empty();

                if (result.status === 200 && result.data?.length) {
                    const attachs = result.data;

                    attachList.append(`
                      <tr>
                        <th style="width:90px;">일련번호</th>
                        <th>파일명</th>
                        <th style="width:120px;">size</th>
                        <th style="width:110px;">미리보기</th>
                        <th style="width:110px;">다운로드</th>
                      </tr>
                    `);

                    attachs.forEach((r, index) => {
                        attachList.append(`
                          <tr>
                            <td>${index+1}</td>
                            <td>${r.originalName}</td>
                            <td>${formatFileSize(r.size)}</td>
                            <td><button type="button" class="btn btn-sm" data-view="${r.attachmentId}">미리보기</button></td>
                            <td><button type="button" class="btn btn-sm" data-down="${r.attachmentId}">다운로드</button></td>
                          </tr>
                        `);
                    });

                    document.querySelectorAll("button[data-down]").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            const attachmentId = Number(e.currentTarget.getAttribute("data-down"));
                            await downAttachment(attachmentId);
                        });
                    });

                    document.querySelectorAll("button[data-view]").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            const attachmentId = Number(e.currentTarget.getAttribute("data-view"));
                            await viewAttachment(attachmentId);
                        });
                    });

                } else {
                    attachList.html('<tr><td colspan="5">관련 첨부파일이 없습니다.</td></tr>');
                }
            }catch(e){
                console.error(e);
            }
        }

        function formatFileSize(bytes) {
            if (bytes == null || isNaN(bytes)) return "-";
            if (bytes < 1024) return `${bytes} B`;
            const kb = bytes / 1024;
            if (kb < 1024) return `${kb.toFixed(1)} KB`;
            const mb = kb / 1024;
            return `${mb.toFixed(1)} MB`;
        }

        async function fetchDownloadUrl(attachmentId) {
            const res = await fetch(`${API_BASE}/api/v1/attachments/${attachmentId}/download-url`, {
                method:"GET",
                credentials:"include",
                headers:{ 'Accept': 'application/json' }
            });
            if (!res.ok) throw new Error("download-url 호출 실패: " + await res.text());
            const raw = await res.json();
            const data = unwrapMaybeResponseDto(raw);
            const url = data.url;
            if (typeof url !== "string" || !url.startsWith("http")) throw new Error("응답에 url이 없습니다.");
            return { url, meta: data };
        }

        async function fetchPreviewUrl(attachmentId) {
            const res = await fetch(`${API_BASE}/api/v1/attachments/${attachmentId}/preview-url`, {
                method:"GET",
                credentials:"include",
                headers:{ 'Accept': 'application/json' }
            });
            if (!res.ok) throw new Error("preview-url 호출 실패: " + await res.text());
            const raw = await res.json();
            const data = unwrapMaybeResponseDto(raw);
            const url = data.url;
            if (typeof url !== "string" || !url.startsWith("http")) throw new Error("응답에 url이 없습니다.");
            return { url, meta: data };
        }

        async function downAttachment(attachmentId){
            if (!attachmentId) return;
            if (!confirm(`attachmentId=${attachmentId} 파일을 다운로드 할까요?`)) return;

            try{
                const { url, meta } = await fetchDownloadUrl(attachmentId);
                const a = document.createElement("a");
                a.href = url;
                a.rel = "noopener";
                a.download = meta.originalName || "";
                document.body.appendChild(a);
                a.click();
                a.remove();
            }catch(e){
                console.error(e);
                alert("다운로드 중 오류: " + (e?.message ?? e));
            }
        }

        async function viewAttachment(attachmentId){
            if (!attachmentId) return;
            try{
                const { url } = await fetchPreviewUrl(attachmentId);
                window.open(url, "_blank", "noopener");
            }catch(e){
                console.error(e);
                alert("미리보기 중 오류: " + (e?.message ?? e));
            }
        }

        async function deleteNotice(){
            if (!confirm("정말 삭제하시겠습니까?")) return;

            try{
                const res = await fetch(`/api/v1/notice/${noticeNo}`, {
                    method:"DELETE",
                    credentials:"include"
                });

                if (res.ok) {
                    alert("공지사항이 삭제되었습니다.");
                    window.location.href = "/notice/list";
                } else {
                    alert("삭제 실패했습니다.");
                }
            }catch(e){
                console.error(e);
                alert("삭제 중 오류 발생");
            }
        }

        document.addEventListener('DOMContentLoaded', loadPlaceDetail);
    </script>
</th:block>
