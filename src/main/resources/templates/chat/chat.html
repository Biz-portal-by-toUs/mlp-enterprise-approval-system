<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Chat</title>
    <style>
        body { font-family: sans-serif; margin: 0; }
        .wrap { display: flex; height: 100vh; }
        .left { width: 280px; border-right: 1px solid #ddd; overflow: auto; }
        .room { padding: 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
        .room:hover { background: #fafafa; }
        .room .name { font-weight: 700; }
        .room .meta { font-size: 12px; color: #666; margin-top: 4px; display:flex; justify-content:space-between; gap:8px;}
        .badge { background: #ff3b30; color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 12px; }

        .right { flex: 1; display: flex; flex-direction: column; }
        .top {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
        }
        .top .title { font-weight: 700; }
        .top .actions { display:flex; gap:8px; align-items:center; }
        .top .actions input { width: 220px; padding: 8px; }
        .top .actions button { padding: 8px 10px; cursor:pointer; }

        .msgs { flex: 1; overflow: auto; padding: 12px; }
        .msg { margin: 8px 0; }
        .msg .t { font-size: 12px; color: #777; }

        .bottom { display:flex; gap:8px; padding: 12px; border-top: 1px solid #ddd; }
        .bottom input { flex:1; padding: 10px; }
        .bottom button { padding: 10px 14px; cursor:pointer; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<div class="wrap">
    <div class="left">
        <div style="padding:12px; font-weight:700;">채팅방</div>
        <div id="roomList"></div>
    </div>

    <div class="right">
        <div class="top">
            <div class="title" id="roomTitle">방을 선택하세요</div>
            <div class="actions">
                <input id="inviteInput" placeholder="초대할 empId들 (예: E000003,E000004)" />
                <button onclick="inviteMembers()">초대</button>
                <button onclick="leaveRoom()">나가기</button>
            </div>
        </div>

        <div class="msgs" id="messages"></div>

        <div class="bottom">
            <input id="messageInput" placeholder="메시지 입력" onkeydown="if(event.keyCode==13){sendMessage()}" />
            <button onclick="sendMessage()">전송</button>
        </div>
    </div>
</div>

<script>
    let stompClient = null;
    let currentRoomNo = null;

    // 구독 핸들
    let roomSub = null;        // 현재 방 메시지 구독
    let roomUpdatesSub = null; // 유저 전용 방목록 업데이트 구독

    // ✅ 중복 실행/레이스 방지용
    let wsInitialized = false; // connectWs 중복 방지
    let enterToken = 0;        // enterRoom 최신 호출만 subscribe 허용
    let entering = false;      // 연타 방지(선택)

    // ✅ 메시지 중복 방지(방어)
    const seenMsgIds = new Set();

    function getAccessToken() {
        return localStorage.getItem("accessToken");
    }

    function connectWs() {
        if (wsInitialized) return;          // ✅ 중복 실행 방지
        wsInitialized = true;

        const token = getAccessToken();
        if (!token) {
            alert("accessToken 없음. 로그인 후 token 저장 로직 확인해라.");
            return;
        }

        const socket = new SockJS('/ws-chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = console.log;

        stompClient.connect(
            { Authorization: 'Bearer ' + token },
            async function(frame) {
                console.log("WS connected:", frame);

                // 최초 방 목록 로드
                await loadRooms();

                // ✅ 유저 전용 방목록 업데이트 구독 (중복 방지)
                if (roomUpdatesSub) {
                    roomUpdatesSub.unsubscribe();
                    roomUpdatesSub = null;
                }
                roomUpdatesSub = stompClient.subscribe('/user/sub/chat/room-updates', function(message) {
                    const upd = JSON.parse(message.body);
                    updateRoomCard(upd);
                });

                console.log("[WS] roomUpdatesSub=", roomUpdatesSub.id);
            },
            function(error) {
                console.error("WS connect error:", error);
                alert("WS 연결 실패(토큰/인터셉터/엔드포인트 확인)");
                wsInitialized = false; // 재시도 가능하게
            }
        );
    }

    async function loadRooms() {
        const token = getAccessToken();
        const res = await fetch('/api/v1/chat/my?size=50', {
            headers: { 'Authorization': 'Bearer ' + token }
        });

        const data = await res.json();
        const rooms = data.data || [];

        const roomList = document.getElementById("roomList");
        roomList.innerHTML = "";

        rooms.forEach(r => {
            const div = document.createElement("div");
            div.className = "room";
            div.id = "room-" + r.roomNo;
            div.dataset.roomNo = String(r.roomNo);
            div.dataset.roomName = r.roomName || "";

            const badgeHtml = (r.unreadCount && r.unreadCount > 0)
                ? `<span class="badge">${r.unreadCount}</span>` : "";

            div.innerHTML = `
        <div class="name">${escapeHtml(r.roomName)}</div>
        <div class="meta">
          <span class="last">${escapeHtml(r.lastMessage || "")}</span>
          ${badgeHtml}
        </div>
      `;

            div.onclick = () => enterRoom(r.roomNo, r.roomName);
            roomList.appendChild(div);
        });
    }

    async function enterRoom(roomNo, roomName) {
        if (!stompClient || !stompClient.connected) {
            alert("WS 아직 연결 안됨");
            return;
        }

        // ✅ 같은 방을 다시 누르면 아무 것도 안 함(선택)
        if (currentRoomNo === roomNo && roomSub) return;

        // ✅ 연타 방지(선택)
        if (entering) return;
        entering = true;

        // ✅ 이번 호출을 “최신 토큰”으로 설정
        const myToken = ++enterToken;
        console.log("[enterRoom] called token=", myToken, "roomNo=", roomNo);

        try {
            // ✅ 이전 방 구독 해제
            if (roomSub) {
                console.log("[enterRoom] UNSUB old roomSub=", roomSub.id);
                roomSub.unsubscribe();
                roomSub = null;
            }

            currentRoomNo = roomNo;
            document.getElementById("roomTitle").innerText = roomName;

            // ✅ 메시지 중복 방지 set 초기화(방 바꿀 때)
            seenMsgIds.clear();

            // ✅ 읽음 처리 + 메시지 로드
            await markRead(roomNo);
            await loadMessages(roomNo);

            // ✅ await 이후 “내가 최신 enterRoom인지” 확인
            if (myToken !== enterToken) {
                console.log("[enterRoom] stale call ignored token=", myToken, "latest=", enterToken);
                return;
            }

            // ✅ 들어온 방은 뱃지 즉시 제거
            updateRoomCard({ roomNo, lastMessage: null, lastMessageAt: null, unreadCount: 0 });

            // ✅ 현재 방 메시지 실시간 수신(딱 1번만)
            roomSub = stompClient.subscribe('/sub/chat/rooms/' + roomNo, function(message) {
                const body = JSON.parse(message.body);
                // 방어: 메시지 id로 중복 append 방지
                if (body.messageId && seenMsgIds.has(body.messageId)) return;
                if (body.messageId) seenMsgIds.add(body.messageId);

                appendMessage(body);
            });

            console.log("[enterRoom] SUB roomSub=", roomSub.id, "roomNo=", roomNo);

        } finally {
            entering = false;
        }
    }

    async function loadMessages(roomNo) {
        const token = getAccessToken();
        const res = await fetch(`/api/v1/chat/messages/${roomNo}?size=30`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });

        const data = await res.json();
        const msgs = data.data || [];

        const box = document.getElementById("messages");
        box.innerHTML = "";

        // ✅ 메시지 id set 재구축(스크롤/초기 로드시 중복 방지)
        msgs.forEach(m => { if (m.messageId) seenMsgIds.add(m.messageId); });

        msgs.slice().reverse().forEach(m => appendMessage(m));
        box.scrollTop = box.scrollHeight;
    }

    async function markRead(roomNo) {
        const token = getAccessToken();
        await fetch(`/api/v1/chat/${roomNo}/read`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        });
    }

    function sendMessage() {
        const input = document.getElementById("messageInput");
        const content = input.value.trim();
        if (!content) return;
        if (!currentRoomNo) {
            alert("방부터 선택해라");
            return;
        }

        stompClient.send("/pub/chat/message", {}, JSON.stringify({
            roomNo: currentRoomNo,
            content: content
        }));

        input.value = "";
    }

    // ✅ 초대(여러명)
    async function inviteMembers() {
        if (!currentRoomNo) {
            alert("초대할 방부터 선택해라");
            return;
        }

        const raw = document.getElementById("inviteInput").value.trim();
        if (!raw) {
            alert("초대할 empId를 입력해라 (예: E000003,E000004)");
            return;
        }

        const memberIds = raw.split(/[,\s]+/).map(s => s.trim()).filter(Boolean);
        if (memberIds.length === 0) {
            alert("초대할 empId가 없다");
            return;
        }

        const token = getAccessToken();
        const res = await fetch(`/api/v1/chat/${currentRoomNo}/invite`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ memberIds })
        });

        if (!res.ok) {
            const txt = await res.text().catch(() => "");
            console.error("invite failed:", res.status, txt);
            alert("초대 실패. 서버 로그/응답 확인해라.");
            return;
        }

        document.getElementById("inviteInput").value = "";
        alert("초대 요청 완료");

        // 내 목록도 최신화
        await loadRooms();
    }

    // ✅ 나가기
    async function leaveRoom() {
        if (!currentRoomNo) {
            alert("나갈 방부터 선택해라");
            return;
        }

        if (!confirm("정말 나갈래?")) return;

        const token = getAccessToken();
        const res = await fetch(`/api/v1/chat/${currentRoomNo}/leave`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!res.ok) {
            const txt = await res.text().catch(() => "");
            console.error("leave failed:", res.status, txt);
            alert("나가기 실패. 서버 로그/응답 확인해라.");
            return;
        }

        // ✅ 방 구독 해제 + 화면 초기화
        if (roomSub) {
            console.log("[leaveRoom] UNSUB roomSub=", roomSub.id);
            roomSub.unsubscribe();
            roomSub = null;
        }

        currentRoomNo = null;
        document.getElementById("roomTitle").innerText = "방을 선택하세요";
        document.getElementById("messages").innerHTML = "";
        document.getElementById("inviteInput").value = "";

        // ✅ 목록 재로드(active=false 된 방 숨김)
        await loadRooms();
    }

    function appendMessage(m) {
        const box = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = "msg";

        const t = m.createdAt ? new Date(m.createdAt).toLocaleString() : "";
        const sender = m.senderName || "";

        div.innerHTML = `
      <div><b>${escapeHtml(sender)}</b> : ${escapeHtml(m.content || "")}</div>
      <div class="t">${escapeHtml(t)}</div>
    `;

        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function updateRoomCard(upd) {
        const roomNo = upd.roomNo;
        if (!roomNo) return;

        const el = document.getElementById("room-" + roomNo);

        // 목록에 없는 방이면 재동기화
        if (!el) {
            loadRooms();
            return;
        }

        // 마지막 메시지 업데이트(값이 있을 때만)
        if (upd.lastMessage !== undefined && upd.lastMessage !== null) {
            const lastEl = el.querySelector(".last");
            if (lastEl) lastEl.textContent = upd.lastMessage;
        }

        // unread badge 업데이트
        const meta = el.querySelector(".meta");
        if (meta) {
            const oldBadge = meta.querySelector(".badge");
            const unread = Number(upd.unreadCount || 0);

            if (unread > 0 && roomNo !== currentRoomNo) {
                if (oldBadge) oldBadge.textContent = String(unread);
                else meta.insertAdjacentHTML("beforeend", `<span class="badge">${unread}</span>`);
            } else {
                if (oldBadge) oldBadge.remove();
            }
        }

        // 맨 위로 올리기
        const parent = el.parentNode;
        if (parent && parent.firstChild !== el) parent.prepend(el);
    }

    function escapeHtml(str) {
        return String(str ?? "").replace(/[&<>"']/g, s => ({
            "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
        }[s]));
    }

    window.addEventListener("load", connectWs);
</script>
</body>
</html>
