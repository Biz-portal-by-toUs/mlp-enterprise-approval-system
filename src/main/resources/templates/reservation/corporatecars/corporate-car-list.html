<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="utf-8" />
    <title>Bizportal - 법인 차량 조회</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* ✅ 예약 페이지 타이틀 규격 */
            h2 { margin-bottom: 16px; }

            /* ✅ 예약 페이지 오른쪽 래퍼 느낌 */
            .corpcar-page-wrap{
                font-family: Pretendard, Arial, sans-serif;
                background:#f7f8fa;
                width:100%;
            }

            /* ✅ 예약 페이지 섹션 패딩 규격 */
            .corpcar-page{
                padding: 20px 20px 32px;
            }

            .corpcar-page .error {
                margin: 12px 0;
                padding: 10px 12px;
                border: 1px solid #fecaca;
                background: #fff1f2;
                color: #991b1b;
                border-radius: 12px;
                display: none;
            }

            /* 카드 그리드 */
            .corpcar-page .grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 16px;
            }

            @media (max-width: 1100px) {
                .corpcar-page .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            }

            @media (max-width: 720px) {
                .corpcar-page .grid { grid-template-columns: 1fr; }
            }

            .corpcar-page .card {
                background: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 14px;
                overflow: hidden;
                box-shadow: 0 6px 18px rgba(0, 0, 0, .08);
                display: flex;
                flex-direction: column;
                min-height: 320px;
            }

            .corpcar-page .thumb {
                height: 160px;
                background: #e5e7eb;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .corpcar-page .thumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .corpcar-page .thumb .ph {
                color: #6b7280;
                font-size: 12px;
            }

            .corpcar-page .card-body {
                padding: 12px 14px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .corpcar-page .car-name { font-weight: 800; }

            .corpcar-page .meta {
                font-size: 12px;
                color: #6b7280;
                line-height: 1.45;
            }

            .corpcar-page .meta b {
                color: #1f2937;
                font-weight: 700;
            }

            .corpcar-page .divider {
                height: 1px;
                background: #e5e7eb;
                margin: 2px 0;
            }

            /* 페이징 */
            .corpcar-page .paging {
                margin-top: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                flex-wrap: wrap;
            }

            .corpcar-page .page-btn {
                min-width: 36px;
                height: 36px;
                border-radius: 10px;
                border: 1px solid #e5e7eb;
                background: #fff;
                cursor: pointer;
                font-size: 13px;
            }

            .corpcar-page .page-btn.active {
                background: #1677ff;
                border-color: #1677ff;
                color: #fff;
                font-weight: 700;
            }

            /* 선택 가능 카드 + 선택 상태 */
            .corpcar-page .card.selectable { cursor: pointer; }
            .corpcar-page .card.selected { outline: 3px solid #1677ff; }
            .corpcar-page .card.selectable:hover { box-shadow: 0 0 0 2px rgba(22, 119, 255, .4); }

            /* 관리자 액션 바 */
            .corpcar-page .action-bar {
                display: none; /* JS에서 제어 */
                justify-content: flex-end;
                align-items: center;
                gap: 10px;
                margin-top: 12px;
                margin-bottom: 12px;
                padding-right: 4px;
            }

            .corpcar-page .action-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 8px 14px;
                border-radius: 8px;
                border: none;
                font-size: 14px;
                cursor: pointer;
                background-color: #1677ff;
                color: #fff;
                transition: background-color 0.2s ease;
            }

            .corpcar-page .action-btn:hover:not(:disabled) { background-color: #4096ff; }
            .corpcar-page .action-btn:disabled {
                background-color: #e5e7eb;
                color: #9ca3af;
                cursor: not-allowed;
            }
            .corpcar-page .action-btn.danger:not(:disabled) { background-color: #ef4444; }

            /* 삭제 모달 */
            .modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000;
            }
            .hidden { display: none; }

            .modal-content {
                background: #fff;
                padding: 24px;
                border-radius: 10px;
                width: 360px;
                text-align: center;
            }
            .modal-title { margin-bottom: 12px; color: #d32f2f; }
            .modal-text { margin-bottom: 20px; font-size: 14px; line-height: 1.5; }

            .modal-actions {
                display: flex;
                justify-content: space-between;
                gap: 12px;
            }
            .modal-actions .btn {
                flex: 1;
                padding: 10px 0;
                border-radius: 6px;
                font-size: 14px;
                cursor: pointer;
                border: none;
                transition: background 0.2s, transform 0.1s;
            }
            .modal-actions .btn.cancel { background: #e0e0e0; color: #333; }
            .modal-actions .btn.cancel:hover { background: #cfcfcf; }
            .modal-actions .btn.delete { background: #d32f2f; color: #fff; }
            .modal-actions .btn.delete:hover { background: #b71c1c; }
            .modal-actions .btn:hover { transform: translateY(-1px); }

            /* =========================
          ✅ 버튼 통일 (저장해둔 버튼 규격)
           ========================= */
            .action-bar{
                display:none;
                justify-content:flex-end;
                align-items:center;
                gap:10px;
                margin-top:12px;
                margin-bottom:12px;
                padding-right:4px;
            }

            /* 공통 버튼 규격 = 저장해둔 .btn */
            .action-bar .action-btn{
                height: 40px;
                padding: 0 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                border: none;
                white-space: nowrap;
                transition: 0.15s;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .action-bar .action-btn:hover{ filter: brightness(0.9); }
            .action-bar .action-btn:disabled{
                opacity: .5;
                cursor: not-allowed;
                filter: none;
            }

            /* ✅ 등록(Primary) */
            .action-bar .action-btn.create{
                background: var(--primary);
                color: #fff;
            }

            /* ✅ 선택 수정(수정 버튼 색상: 연파랑 배경 + 파랑 글씨) */
            .action-bar .action-btn.edit{
                background: #eaf2ff;
                color: #2b5db8;
            }

            /* ✅ 선택 삭제(삭제 버튼 색상: 연빨강 배경 + 빨강 글씨) */
            .action-bar .action-btn.delete{
                background: #fdecec;
                color: #c62828;
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <!-- 왼쪽: 예약 사이드바 (법인 차량 메뉴 active) -->
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('car')"></aside>

        <!-- ✅ 오른쪽 래퍼를 예약 페이지랑 통일 -->
        <div class="corpcar-page-wrap">
            <div class="corpcar-page">
                <!-- ✅ 타이틀도 예약 페이지랑 통일 -->
                <h2>법인 차량</h2>
                <br><br>

                <div class="error" id="errBox"></div>

                <section class="grid" id="grid"></section>

                <div id="actionBar" class="action-bar">
                    <button id="btnCreate" class="action-btn create" type="button">등록</button>
                    <button id="btnEdit" class="action-btn edit" type="button" disabled>선택 수정</button>
                    <button id="btnDelete" class="action-btn delete" type="button" disabled>선택 삭제</button>
                </div>

                <div class="paging" id="paging"></div>
            </div>
        </div>
    </section>

    <!-- 삭제 확인 모달 -->
    <div id="deleteModal" class="modal hidden">
        <div class="modal-content">
            <h3 class="modal-title">⚠️ 법인 차량 삭제</h3>
            <p class="modal-text">
                법인 차량을 삭제하면 <b>되돌릴 수 없습니다.</b><br>
                정말 삭제하시겠습니까?
            </p>

            <div class="modal-actions">
                <button id="confirmDeleteBtn" class="btn delete">삭제</button>
                <button id="cancelDeleteBtn" class="btn cancel">취소</button>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script>
        let selectedCarNo = null;
        let isAdmin = false;

        const NO_IMAGE_URL = "/images/no-image.png";
        const API_BASE = window.location.origin;

        const grid = document.getElementById("grid");
        const paging = document.getElementById("paging");
        const errBox = document.getElementById("errBox");

        let state = {
            page: 0,
            size: 6,
            totalPages: 0
        };

        async function apiFetch(path, options = {}) {
            const url = new URL(path, API_BASE).toString();

            const res = await fetch(url, {
                ...options,
                credentials: "include",
                headers: { ...(options.headers || {}) }
            });

            if (res.status === 401 || res.status === 403) {
                throw new Error("UNAUTHORIZED");
            }
            return res;
        }

        function showError(msg) {
            errBox.style.display = "block";
            errBox.textContent = msg;
        }
        function clearError() {
            errBox.style.display = "none";
            errBox.textContent = "";
        }

        function cardTemplate(car) {
            const safe = (v) => (v === null || v === undefined || v === "") ? "-" : v;

            return `
          <article class="card ${isAdmin ? "selectable" : ""}" data-car-no="${car.carNo}">
            <div class="thumb">
              <img
                src="${car.imageUrl || NO_IMAGE_URL}"
                onerror="this.src='${NO_IMAGE_URL}'"
                alt="법인 차량 이미지"
              />
            </div>
            <div class="card-body">
              <div class="car-name">법인 차량명: ${safe(car.carName)}</div>
              <div class="divider"></div>
              <div class="meta"><b>차량번호:</b> ${safe(car.plateNo)}</div>
              <div class="meta"><b>차   종:</b> ${safe(car.carType)}</div>
              <div class="meta"><b>연   료:</b> ${safe(car.fuel)}</div>
              <div class="meta"><b>수용인원:</b> ${safe(car.capacity)}명</div>
            </div>
          </article>
        `;
        }

        function renderGrid(content) {
            grid.innerHTML = content.map(cardTemplate).join("");
        }

        function enableSelection() {
            if (!isAdmin) return;

            document.querySelectorAll(".card.selectable").forEach(card => {
                card.addEventListener("click", () => {
                    document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
                    card.classList.add("selected");

                    selectedCarNo = card.dataset.carNo;

                    document.getElementById("btnEdit").disabled = false;
                    document.getElementById("btnDelete").disabled = false;
                });
            });
        }

        function renderPaging(current, total) {
            paging.innerHTML = "";
            if (total <= 1) return;

            const mkBtn = (label, onClick, disabled = false, active = false) => {
                const b = document.createElement("button");
                b.className = "page-btn" + (active ? " active" : "");
                b.textContent = label;
                b.disabled = disabled;
                b.addEventListener("click", onClick);
                return b;
            };

            paging.appendChild(mkBtn("‹", () => loadCars(current - 1), current === 0));

            const windowSize = 5;
            const start = Math.max(0, current - Math.floor(windowSize / 2));
            const end = Math.min(total - 1, start + windowSize - 1);
            const realStart = Math.max(0, end - windowSize + 1);

            for (let p = realStart; p <= end; p++) {
                paging.appendChild(mkBtn(String(p + 1), () => loadCars(p), false, p === current));
            }

            paging.appendChild(mkBtn("›", () => loadCars(current + 1), current >= total - 1));
        }

        async function loadCars(page) {
            clearError();

            selectedCarNo = null;
            document.getElementById("btnEdit").disabled = true;
            document.getElementById("btnDelete").disabled = true;

            try {
                const res = await apiFetch(`/api/v1/corporate-cars?page=${page}&size=${state.size}`, {
                    method: "GET"
                });

                const json = await res.json();

                isAdmin = json?.data?.isAdmin === true;
                document.getElementById("actionBar").style.display = isAdmin ? "flex" : "none";

                if (!res.ok) {
                    showError(json?.message || `조회에 실패했습니다. (${res.status})`);
                    grid.innerHTML = "";
                    paging.innerHTML = "";
                    return;
                }

                const pageData = json.data.data;
                state.page = pageData.number ?? page;
                const content = pageData.content || [];

                renderGrid(content);
                enableSelection();

                state.totalPages = pageData.totalPages || 0;
                renderPaging(state.page, state.totalPages);

            } catch (e) {
                if (e.message === "UNAUTHORIZED") {
                    showError("로그인이 필요합니다.");
                    location.href = "/login";
                    return;
                }
                showError("서버 연결에 실패했습니다. (쿠키/CORS/포트 확인)");
            }
        }

        document.getElementById("btnCreate").onclick = () => {
            location.href = "/corporate-cars/register";
        };

        document.getElementById("btnEdit").onclick = () => {
            if (!selectedCarNo) return;
            location.href = `/corporate-cars/${selectedCarNo}/edit`;
        };

        const deleteModal = document.getElementById("deleteModal");
        const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
        const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

        function openDeleteModal() {
            deleteModal.classList.remove("hidden");
        }

        document.getElementById("btnDelete").onclick = () => {
            if (!selectedCarNo) return;
            openDeleteModal();
        };

        cancelDeleteBtn.addEventListener("click", () => {
            deleteModal.classList.add("hidden");
        });

        confirmDeleteBtn.addEventListener("click", async () => {
            try {
                const res = await apiFetch(`/api/v1/corporate-cars/${selectedCarNo}`, {
                    method: "DELETE"
                });

                if (!res.ok) {
                    throw new Error("삭제에 실패했습니다.");
                }

                alert("법인 차량이 삭제되었습니다.");
                deleteModal.classList.add("hidden");
                selectedCarNo = null;
                document.getElementById("btnEdit").disabled = true;
                document.getElementById("btnDelete").disabled = true;
                loadCars(state.page);

            } catch (e) {
                if (e.message === "UNAUTHORIZED") {
                    alert("로그인이 필요합니다.");
                    location.href = "/login";
                    return;
                }
                alert(e.message || "삭제 중 오류가 발생했습니다.");
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                deleteModal.classList.add("hidden");
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            loadCars(0);
        });
    </script>
</th:block>

</body>
</html>
