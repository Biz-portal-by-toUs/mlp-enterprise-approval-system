<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회의실 등록</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            width: 420px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            padding: 24px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #555;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        textarea {
            resize: none;
        }

        .btns {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .submit {
            background: #1677ff;
            color: #fff;
        }

        .cancel {
            background: #e5e7eb;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>회의실 등록</h2>

    <form id="roomForm" enctype="multipart/form-data">

        <!-- 🔥 임시 comId (JWT 전까지) -->
        <input type="hidden" name="comId" value="A03"/>

        <div class="field">
            <label>회의실명</label>
            <input type="text" name="roomName" required>
        </div>

        <div class="field">
            <label>수용 인원</label>
            <input type="number" name="capacity" required>
        </div>

        <div class="field">
            <label>위치</label>
            <input type="text" name="location">
        </div>

        <div class="field">
            <label>주요 장비</label>
            <input type="text" name="equipList">
        </div>

        <div class="field">
            <label>특이사항</label>
            <textarea name="note" rows="3"></textarea>
        </div>

        <div class="field">
            <label>회의실 이미지</label>
            <input type="file" name="imageFile" accept="image/*">
        </div>

        <div class="btns">
            <button type="submit" class="submit">등록</button>
            <button type="button" class="cancel" onclick="history.back()">취소</button>
        </div>
    </form>
</div>
<script>
    async function submitMeetingRoomForm(e) {
        e.preventDefault(); // 기본 form 제출 막기

        const form = document.getElementById("roomForm");
        const formData = new FormData(form);

        const accessToken = localStorage.getItem("accessToken");

        if (!accessToken) {
            alert("로그인이 필요합니다.");
            return;
        }

        try {
            const res = await fetch("/api/v1/meeting-rooms", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + accessToken
                    // ⚠️ Content-Type 지정하면 안 됨
                },
                body: formData
            });

            const result = await res.json();

            if (!res.ok) {
                console.error(result);
                alert(result.message || "등록 실패");
                return;
            }

            alert("회의실 등록 성공!");
            location.href = "/meeting-rooms";

        } catch (err) {
            console.error(err);
            alert("서버 오류가 발생했습니다.");
        }
    }

    document
        .getElementById("roomForm")
        .addEventListener("submit", submitMeetingRoomForm);
</script>
</body>
</html>
