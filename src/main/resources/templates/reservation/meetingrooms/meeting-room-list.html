<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8" />
    <title>회의실 조회</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* ✅ 예약/등록 페이지 톤과 통일 */
            h2 { margin-bottom: 16px; }

            .meeting-room-page{
                font-family: Pretendard, Arial, sans-serif;
                background:#f7f8fa;
                width:100%;
            }

            .timetable-section{
                padding: 20px 20px 32px;
            }

            /* SweetAlert가 다른 레이어보다 위에 뜨도록 */
            .swal2-container{
                z-index: 3000000 !important;
            }

            .grid{
                display:grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap:16px;
            }
            @media (max-width: 1100px){
                .grid{grid-template-columns: repeat(2, minmax(0,1fr));}
            }
            @media (max-width: 720px){
                .grid{grid-template-columns: 1fr;}
            }

            .card{
                background:#ffffff;
                border:1px solid #e5e7eb;
                border-radius:14px;
                overflow:hidden;
                box-shadow:0 6px 18px rgba(0,0,0,.08);
                display:flex;
                flex-direction:column;
                min-height:320px;
            }

            .thumb{
                height:160px;
                background:#e5e7eb;
                display:flex;
                align-items:center;
                justify-content:center;
            }
            .thumb img{width:100%;height:100%;object-fit:cover;display:block}
            .thumb .ph{color:#6b7280;font-size:12px}

            .card-body{
                padding:12px 14px;
                display:flex;
                flex-direction:column;
                gap:8px;
            }
            .room-name{font-weight:800}
            .meta{
                font-size:12px;
                color:#6b7280;
                line-height:1.45;
            }
            .meta b{color:#111827;font-weight:700}
            .divider{height:1px;background:#e5e7eb;margin:2px 0}

            .paging{
                margin-top:16px;
                display:flex;
                align-items:center;
                justify-content:center;
                gap:8px;
                flex-wrap:wrap;
            }
            .page-btn{
                min-width:36px;
                height:36px;
                border-radius:10px;
                border:1px solid #e5e7eb;
                background:#fff;
                cursor:pointer;
                font-size:13px;
            }
            .page-btn.active{
                background:var(--primary);
                border-color:var(--primary);
                color:#fff;
                font-weight:700;
            }

            .error{
                margin:12px 0;
                padding:10px 12px;
                border:1px solid #fecaca;
                background:#fff1f2;
                color:#991b1b;
                border-radius:12px;
                display:none;
            }

            /* ✅ 관리자 선택 UI */
            .card.selectable { cursor: pointer; }
            .card.selected { outline: 3px solid var(--primary); }
            .card.selectable:hover { box-shadow: 0 0 0 2px rgba(79,143,227,.4); }

            /* =========================
               ✅ 버튼 통일 (저장해둔 버튼 규격)
               ========================= */
            .action-bar{
                display:none;
                justify-content:flex-end;
                align-items:center;
                gap:10px;
                margin-top:12px;
                margin-bottom:12px;
                padding-right:4px;
            }

            .action-bar .action-btn{
                height: 40px;
                padding: 0 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                border: none;
                white-space: nowrap;
                transition: 0.15s;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .action-bar .action-btn:hover{ filter: brightness(0.9); }
            .action-bar .action-btn:disabled{
                opacity: .5;
                cursor: not-allowed;
                filter: none;
            }

            .action-bar .action-btn.create{
                background: var(--primary);
                color: #fff;
            }

            .action-bar .action-btn.edit{
                background: #eaf2ff;
                color: #2b5db8;
            }

            .action-bar .action-btn.delete{
                background: #fdecec;
                color: #c62828;
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <!-- 🔹 왼쪽: 예약 서브 사이드바 (회의실 조회 active) -->
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('meeting')"></aside>

        <!-- 🔹 오른쪽 -->
        <div class="meeting-room-page">
            <div class="timetable-section">
                <h2>회의실</h2>
                <br><br>

                <div class="error" id="errBox"></div>

                <section class="grid" id="grid"></section>

                <div id="actionBar" class="action-bar">
                    <button id="btnCreate" class="action-btn create" type="button">등록</button>
                    <button id="btnEdit" class="action-btn edit" type="button" disabled>선택 수정</button>
                    <button id="btnDelete" class="action-btn delete" type="button" disabled>선택 삭제</button>
                </div>

                <div class="paging" id="paging"></div>
            </div>
        </div>
    </section>
</div>

<th:block layout:fragment="pageScripts">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        /* =========================
           SweetAlert2 (예약 페이지 스타일 동일)
           ========================= */
        const SWAL_PRIMARY = getComputedStyle(document.documentElement)
            .getPropertyValue("--primary")
            .trim() || "#4f8fe3";

        const SWAL_GRAY = "#9ca3af";
        const SWAL_RED  = "#ff4d4f";

        function swalAlert({ icon="info", title="알림", text="" }) {
            return Swal.fire({ icon, title, text, confirmButtonColor: SWAL_PRIMARY });
        }
        function swalSuccess(text, title="완료") { return swalAlert({ icon:"success", title, text }); }
        function swalError(text, title="오류") { return swalAlert({ icon:"error", title, text }); }
        function swalWarn(text, title="확인") { return swalAlert({ icon:"warning", title, text }); }

        async function swalConfirm({
                                       title="확인",
                                       text="진행할까요?",
                                       icon="question",
                                       confirmText="확인",
                                       cancelText="취소",
                                       confirmColor=SWAL_PRIMARY
                                   }){
            const result = await Swal.fire({
                title, text, icon,
                showCancelButton: true,
                confirmButtonText: confirmText,
                cancelButtonText: cancelText,
                confirmButtonColor: confirmColor,
                cancelButtonColor: SWAL_GRAY,
                reverseButtons: true
            });
            return result.isConfirmed;
        }

        function swalLoading(title="처리 중...", text="잠시만 기다려 주세요.") {
            return Swal.fire({
                title,
                text,
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
        }

        /* =========================
           페이지 로직
           ========================= */
        let selectedRoomNo = null;
        let isAdmin = false;

        const NO_IMAGE_URL = "/images/no-image.png";
        const API_BASE = window.location.origin;

        let state = { page: 0, size: 6, totalPages: 0 };

        function showError(msg){
            const errBox = document.getElementById("errBox");
            errBox.style.display = "block";
            errBox.textContent = msg;
        }
        function clearError(){
            const errBox = document.getElementById("errBox");
            errBox.style.display = "none";
            errBox.textContent = "";
        }

        async function apiFetch(path, options = {}) {
            const url = API_BASE + path;
            const res = await fetch(url, {
                ...options,
                credentials: "include",
                headers: { ...(options.headers || {}) }
            });

            if (res.status === 401 || res.status === 403) {
                await swalWarn("로그인이 만료되었습니다. 다시 로그인해 주세요.", "로그인 만료");
                location.href = "/auth/employee/login";
                throw new Error("UNAUTHORIZED");
            }

            return res;
        }

        function cardTemplate(room){
            const safe = (v) => (v ?? "") === "" ? "-" : v;

            return `
              <article class="card ${isAdmin ? "selectable" : ""}" data-room-no="${room.roomNo}">
                <div class="thumb">
                  <img
                    src="${room.imageUrl || NO_IMAGE_URL}"
                    onerror="this.src='${NO_IMAGE_URL}'"
                    alt="회의실 이미지"
                  />
                </div>
                <div class="card-body">
                  <div class="room-name">회의실명: ${safe(room.roomName)}</div>
                  <div class="divider"></div>
                  <div class="meta"><b>위치:</b> ${safe(room.location)}</div>
                  <div class="meta"><b>수용인원:</b> ${safe(room.capacity)}명</div>
                  <div class="meta"><b>주요 장비:</b> ${safe(room.equipList)}</div>
                  <div class="meta"><b>특이사항:</b> ${safe(room.note)}</div>
                </div>
              </article>
            `;
        }

        function renderGrid(content){
            const grid = document.getElementById("grid");
            grid.innerHTML = content.map(cardTemplate).join("");
        }

        function setButtonsDisabled(disabled){
            const btnEdit = document.getElementById("btnEdit");
            const btnDelete = document.getElementById("btnDelete");
            btnEdit.disabled = disabled;
            btnDelete.disabled = disabled;
        }

        function enableSelection(){
            if (!isAdmin) return;

            document.querySelectorAll(".card.selectable").forEach(card => {
                card.addEventListener("click", () => {
                    // 토글 선택(같은 카드 다시 누르면 해제)
                    const already = card.classList.contains("selected");

                    document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
                    if (already) {
                        selectedRoomNo = null;
                        setButtonsDisabled(true);
                        return;
                    }

                    card.classList.add("selected");
                    selectedRoomNo = card.dataset.roomNo;
                    setButtonsDisabled(false);
                });
            });
        }

        function renderPaging(current, total){
            const paging = document.getElementById("paging");
            paging.innerHTML = "";
            if (total <= 1) return;

            const mkBtn = (label, onClick, disabled=false, active=false) => {
                const b = document.createElement("button");
                b.className = "page-btn" + (active ? " active" : "");
                b.textContent = label;
                b.disabled = disabled;
                b.addEventListener("click", onClick);
                return b;
            };

            paging.appendChild(mkBtn("‹", () => loadRooms(current - 1), current === 0));

            const windowSize = 5;
            const start = Math.max(0, current - Math.floor(windowSize/2));
            const end   = Math.min(total - 1, start + windowSize - 1);
            const realStart = Math.max(0, end - windowSize + 1);

            for(let p = realStart; p <= end; p++){
                paging.appendChild(mkBtn(String(p+1), () => loadRooms(p), false, p === current));
            }

            paging.appendChild(mkBtn("›", () => loadRooms(current + 1), current >= total - 1));
        }

        async function loadRooms(page){
            clearError();
            state.page = page;

            selectedRoomNo = null;
            setButtonsDisabled(true);

            try{
                const res = await apiFetch(`/api/v1/meeting-rooms?page=${page}&size=${state.size}`, { method: "GET" });
                if (!res.ok) { showError(`조회 실패 (${res.status})`); return; }

                const json = await res.json();

                isAdmin = json?.data?.isAdmin === true;
                document.getElementById("actionBar").style.display = isAdmin ? "flex" : "none";

                const pageData = json?.data?.data;
                const content  = pageData?.content ?? [];

                renderGrid(content);
                enableSelection();

                state.totalPages = pageData?.totalPages ?? 0;
                renderPaging(pageData?.number ?? page, state.totalPages);

            } catch(e){
                if (String(e?.message || "").includes("UNAUTHORIZED")) return;
                showError("서버 연결 실패. (네트워크 / 쿠키 / 포트 확인)");
            }
        }

        document.getElementById("btnCreate").onclick = () => {
            location.href = "/meeting-rooms/register";
        };

        document.getElementById("btnEdit").onclick = async () => {
            if (!selectedRoomNo) {
                await swalWarn("수정할 회의실을 선택하세요.");
                return;
            }
            location.href = `/meeting-rooms/${selectedRoomNo}/edit`;
        };

        document.getElementById("btnDelete").onclick = async () => {
            if (!selectedRoomNo) {
                await swalWarn("삭제할 회의실을 선택하세요.");
                return;
            }

            const ok = await swalConfirm({
                title: "회의실 삭제",
                text: "회의실을 삭제하면 되돌릴 수 없습니다.\n정말 삭제하시겠습니까?",
                icon: "warning",
                confirmText: "삭제",
                cancelText: "닫기",
                confirmColor: SWAL_RED
            });
            if (!ok) return;

            try {
                swalLoading("삭제 처리 중...", "잠시만 기다려 주세요.");

                const res = await apiFetch(`/api/v1/meeting-rooms/${selectedRoomNo}`, { method: "DELETE" });
                if (!res.ok) {
                    Swal.close();
                    await swalError("삭제에 실패했습니다. 잠시 후 다시 시도해주세요.", "삭제 실패");
                    return;
                }

                Swal.close();
                await Swal.fire({
                    icon: "success",
                    title: "삭제 완료",
                    text: "회의실이 삭제되었습니다.",
                    timer: 1100,
                    showConfirmButton: false,
                    confirmButtonColor: SWAL_PRIMARY
                });

                selectedRoomNo = null;
                setButtonsDisabled(true);
                loadRooms(state.page);

            } catch (e) {
                Swal.close();
                if (String(e?.message || "").includes("UNAUTHORIZED")) return;
                await swalError("삭제 중 오류가 발생했습니다.", "오류");
            }
        };

        window.addEventListener("DOMContentLoaded", () => loadRooms(0));
    </script>
</th:block>

</body>
</html>
