<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chat Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        #chat { width: 400px; height: 300px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        #chat div { margin-bottom: 6px; }
        .me { color: blue; }
        .other { color: green; }
    </style>
</head>
<body>

<h2>WebSocket Chat Test (Redis Pub/Sub)</h2>

<div>
    서버:
    <select id="server">
        <option value="http://localhost:8090">8090</option>
        <option value="http://localhost:8081">8081</option>
    </select>
</div>

<div id="chat"></div>

<input type="text" id="messageInput" placeholder="메시지를 입력하세요" style="width:300px;">
<button onclick="send()">Send</button>
<button onclick="connect()">Connect</button>

<script>
    let stompClient = null;
    const roomId = 1;

    function connect() {
        const serverUrl = document.getElementById("server").value;
        const socket = new SockJS(serverUrl + "/ws-chat");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            logSystem("Connected to " + serverUrl);
            console.log("CONNECTED TO:", window.location.origin);

            stompClient.subscribe(
                "/sub/chat/room/" + roomId,
                function (message) {
                    const data = JSON.parse(message.body);
                    addMessage("[" + data.senderId + "] " + data.content, "other");
                }
            );
        });
    }

    function send() {
        if (!stompClient) {
            alert("먼저 Connect 하세요");
            return;
        }

        const input = document.getElementById("messageInput");
        const content = input.value;
        if (!content) return;

        stompClient.send(
            "/pub/chat/send",
            {},
            JSON.stringify({
                roomNo: roomId,
                content: content
            })
        );

        addMessage("나: " + content, "me");
        input.value = "";
    }

    function addMessage(text, className) {
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.textContent = text;
        div.className = className;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function logSystem(text) {
        addMessage("[SYSTEM] " + text, "system");
    }
</script>

</body>
</html>
