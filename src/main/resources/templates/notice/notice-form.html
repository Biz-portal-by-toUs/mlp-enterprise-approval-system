<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공지 사항 등록</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles1.css}">
    <style>
        :root{
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: rgba(17, 24, 39, 0.08);
            --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            --shadow2: 0 6px 18px rgba(17, 24, 39, 0.10);

            --primary: #3b82f6;      /* blue */
            --primary2: #2563eb;
            --danger: #ef4444;
            --danger2: #dc2626;
            --chip: rgba(59, 130, 246, 0.10);
            --success: #10b981;
            --warn: #f59e0b;
        }

        * { box-sizing: border-box; }

        body{
            margin: 0;
            background: radial-gradient(1200px 600px at 15% -10%, rgba(59,130,246,.15), transparent 55%),
            radial-gradient(900px 500px at 90% 0%, rgba(16,185,129,.12), transparent 55%),
            var(--bg);
            font-family: 'Noto Sans KR', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            color: var(--text);
        }

        /* 컨테이너: 가운데 카드 느낌 */
        .container{
            max-width: 920px;
            margin: 64px auto;
            padding: 0;
            background: transparent;
            box-shadow: none;
            border: none;
        }

        /* 상단 타이틀 영역(헤더 카드) */
        .notice-detail{
            background: linear-gradient(135deg, rgba(59,130,246,.10), rgba(255,255,255,0));
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* 실제 정보 카드 */
        .notice-info{
            background: var(--card);
            padding: 28px 28px 22px;
            border-radius: 18px;
        }

        /* 제목/내용 영역 정리 */
        .notice-info p{
            margin: 0;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(17,24,39,.12);
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 14px;
            align-items: start;
        }

        .notice-info p strong{
            color: var(--muted);
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        #noticeTitle{
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text);
        }

        #noticeDescription{
            margin: 0;
            padding: 12px 0;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        /* 내용 줄은 기존에 <p><strong>내용:</strong><p id="noticeDescription"> 구조가 살짝 깨져있어서
           #noticeDescription을 카드처럼 보이게 강화 */
        #noticeDescription{
            background: rgba(17,24,39,.03);
            border: 1px solid rgba(17,24,39,.06);
            border-radius: 12px;
            padding: 14px 14px;
        }

        /* 메타 영역을 2열로 보이게 */
        .notice-info{
            position: relative;
        }
        .notice-info::after{
            content:"";
            display:block;
            margin-top: 14px;
        }

        /* 팝업 여부 배지 느낌 */
        #noticePopup{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: 800;
            font-size: .9rem;
            border: 1px solid rgba(17,24,39,.10);
            background: rgba(17,24,39,.03);
        }

        /* JS 값이 true/false로 그대로 보이면 아쉬우니,
           true면 초록/false면 회색으로 보이게 하려면 JS에서 텍스트를 Y/N로 바꾸면 베스트.
           CSS만으로도 기본 배지 제공 */
        .notice-info p:last-child{ border-bottom: none; }

        /* 탭 버튼 영역 */
        .tab-buttons{
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }

        .tab-btn{
            border: 1px solid var(--line);
            background: var(--card);
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 800;
            color: var(--muted);
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(17,24,39,.04);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
        }

        .tab-btn.active{
            background: linear-gradient(135deg, rgba(59,130,246,.12), rgba(255,255,255,0));
            color: var(--text);
            border-color: rgba(59,130,246,.25);
        }

        .tab-btn:hover{
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(17,24,39,.08);
        }

        /* 첨부파일 카드 */
        #attach.tab-content{
            margin-top: 12px;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            padding: 14px;
        }

        /* 첨부파일 테이블 */
        #attachList{
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 12px;
        }

        #attachList th{
            text-align: left;
            font-size: .9rem;
            color: var(--muted);
            background: rgba(17,24,39,.03);
            padding: 12px 12px;
            border-bottom: 1px solid rgba(17,24,39,.08);
            font-weight: 800;
        }

        #attachList td{
            padding: 12px 12px;
            border-bottom: 1px solid rgba(17,24,39,.06);
            font-size: .95rem;
            color: var(--text);
        }

        #attachList tr:hover td{
            background: rgba(59,130,246,.05);
        }

        /* 페이지네이션 */
        #pagination{
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #pagination button{
            border: 1px solid rgba(17,24,39,.10);
            background: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            color: var(--muted);
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }

        #pagination button:hover{
            transform: translateY(-1px);
            border-color: rgba(59,130,246,.35);
            background: rgba(59,130,246,.06);
        }

        #pagination button.active{
            background: rgba(59,130,246,.12);
            border-color: rgba(59,130,246,.40);
            color: var(--text);
        }

        /* 하단 버튼 그룹 */
        .mt-4{
            margin-top: 16px !important;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn{
            appearance: none;
            border: 1px solid rgba(17,24,39,.10);
            background: var(--card);
            padding: 11px 14px;
            border-radius: 12px;
            font-weight: 900;
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(17,24,39,.06);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
        }

        .btn:hover{
            transform: translateY(-1px);
            box-shadow: var(--shadow2);
            border-color: rgba(59,130,246,.25);
            background: rgba(59,130,246,.05);
        }

        /* 수정/삭제 강조 */
        #update-btn.btn{
            background: linear-gradient(135deg, rgba(59,130,246,.14), rgba(255,255,255,0));
            border-color: rgba(59,130,246,.25);
        }

        #delete-btn.btn{
            background: linear-gradient(135deg, rgba(239,68,68,.12), rgba(255,255,255,0));
            border-color: rgba(239,68,68,.25);
        }

        #delete-btn.btn:hover{
            border-color: rgba(239,68,68,.40);
            background: rgba(239,68,68,.06);
        }

        /* 홈 링크 */
        .home-link{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            color: var(--primary2);
            text-decoration: none;
            font-weight: 900;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(59,130,246,.18);
            background: rgba(59,130,246,.06);
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }

        .home-link:hover{
            transform: translateY(-1px);
            border-color: rgba(59,130,246,.35);
            background: rgba(59,130,246,.10);
        }

        /* 공통 input/textarea 기본 리셋 */
        #noticeForm input[type="text"],
        #noticeForm textarea {
            width: 100%;
            border-radius: 14px;
            border: 1px solid rgba(17, 24, 39, 0.12);
            background: #fff;
            color: var(--text);
            font-family: inherit;
            transition:
                    border-color .2s ease,
                    box-shadow .2s ease,
                    transform .15s ease,
                    background .2s ease;
        }

        /* 제목 입력란 */
        #title {
            font-size: 1.05rem;      /* 🔽 글자 크기 줄임 */
            font-weight: 700;
            padding: 16px 18px;
            height: 56px;
            letter-spacing: -0.2px;
            background: linear-gradient(180deg, #ffffff, #f9fafb);
        }

        /* 제목 placeholder */
        #title::placeholder {
            color: var(--muted);
            font-weight: 600;
        }

        /* 내용 textarea */
        #contents {
            min-height: 260px;
            padding: 20px 22px;
            font-size: 1rem;
            line-height: 1.7;
            resize: vertical;
            background: linear-gradient(180deg, #ffffff, #f8fafc);
        }

        /* textarea placeholder */
        #contents::placeholder {
            color: var(--muted);
            font-weight: 500;
        }

        /* 포커스 효과 (제일 중요 – 세련됨 포인트) */
        #noticeForm input:focus,
        #noticeForm textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow:
                    0 0 0 4px rgba(59, 130, 246, 0.12),
                    0 10px 25px rgba(17, 24, 39, 0.08);
            transform: translateY(-1px);
        }

        /* mb-3 전체를 카드처럼 보이게 */
        #noticeForm .mb-3 {
            background: var(--card);
            padding: 20px 22px 22px;
            border-radius: 18px;
            border: 1px solid var(--line);
            box-shadow: 0 10px 24px rgba(17, 24, 39, 0.06);
            margin-bottom: 22px;
        }

        /* label 강조 */
        #noticeForm label {
            display: block;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 10px;
            letter-spacing: -0.2px;
        }

        /* 등록 버튼도 살짝 고급스럽게 */
        .btn-submit {
            padding: 14px 22px;
            border-radius: 14px;
            font-weight: 900;
            border: 1px solid rgba(59, 130, 246, .25);
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            box-shadow: 0 12px 24px rgba(59,130,246,.35);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 32px rgba(59,130,246,.45);
        }

        /* =========================
   취소 버튼 스타일
========================= */

        .btn-cancel {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 22px;
            border-radius: 14px;
            font-weight: 800;
            color: var(--muted);
            text-decoration: none;
            background: linear-gradient(180deg, #ffffff, #f9fafb);
            border: 1px solid rgba(17, 24, 39, 0.15);
            box-shadow: 0 8px 18px rgba(17, 24, 39, 0.06);
            transition:
                    transform .15s ease,
                    box-shadow .15s ease,
                    border-color .15s ease,
                    color .15s ease,
                    background .15s ease;
        }

        /* hover 효과 */
        .btn-cancel:hover {
            color: var(--text);
            background: rgba(17, 24, 39, 0.03);
            border-color: rgba(17, 24, 39, 0.25);
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(17, 24, 39, 0.10);
        }

        /* active(클릭 시) */
        .btn-cancel:active {
            transform: translateY(0);
            box-shadow: 0 6px 14px rgba(17, 24, 39, 0.08);
        }

        /* 접근성: 포커스 표시 */
        .btn-cancel:focus-visible {
            outline: none;
            box-shadow:
                    0 0 0 4px rgba(107, 114, 128, 0.25),
                    0 10px 24px rgba(17, 24, 39, 0.10);
        }

        #noticeForm .btn-submit,g
        #noticeForm .btn-cancel {
            min-width: 120px;
        }

        /* ========= 공통 입력 컨트롤 ========= */
        #noticeForm input[type="text"],
        #noticeForm input[type="datetime-local"],
        #noticeForm textarea {
            width: 100%;
            border-radius: 14px;
            border: 1px solid rgba(17, 24, 39, 0.12);
            background: #fff;
            color: var(--text);
            font-family: inherit;
            transition: border-color .2s ease, box-shadow .2s ease, transform .15s ease, background .2s ease;
        }

        #noticeForm input:focus,
        #noticeForm textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12), 0 10px 25px rgba(17, 24, 39, 0.08);
            transform: translateY(-1px);
        }

        /* ========= 제목 100자 UI (선택) ========= */
        #title {
            font-size: 1.35rem;
            font-weight: 800;
            padding: 18px 20px;
            height: 64px;
            letter-spacing: -0.3px;
            background: linear-gradient(180deg, #ffffff, #f9fafb);
        }

        /* ========= 팝업여부 라디오: 한 줄 ========= */
        .radio-row{
            display: inline-flex;
            gap: 10px;
            margin-left: 12px;   /* label과 간격 */
            vertical-align: middle;
        }

        .radio-pill{
            padding: 6px 12px;
            font-size: .9rem;
            box-shadow: 0 6px 12px rgba(17,24,39,.05);
        }

        .radio-pill:hover{
            transform: translateY(-1px);
            border-color: rgba(59,130,246,.25);
            background: rgba(59,130,246,.05);
            box-shadow: 0 12px 22px rgba(17,24,39,.08);
        }

        .radio-pill input{
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            margin: 0;
        }

        /* ========= 팝업 시작/종료일: 한 줄(2열) ========= */
        .grid-2{
            margin-bottom: 0;
            font-weight: 800;
            color: var(--text);
        }

        /* 날짜 한 줄 정렬 */
        .grid-2 > div {
            display: grid;
            grid-template-columns: 110px 1fr; /* label | input */
            align-items: center;
            gap: 12px;
        }

        .grid-2 label{
            margin-bottom: 0;
            font-weight: 800;
            color: var(--text);
        }

        /* 팝업여부 label + 라디오 수평 정렬 */
        .mb-3 > label {
            display: inline-flex;
            align-items: center;
        }

        @media (max-width: 640px){
            .grid-2{
                grid-template-columns: 1fr;
            }
        }

        /* datetime-local 높이/패딩 정리 */
        #noticeForm input[type="datetime-local"]{
            height: 48px;
            padding: 10px 14px;
            font-size: .95rem;
        }

        /* ========= 버튼 오른쪽 정렬 ========= */
        .form-actions{
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn-submit{
            padding: 14px 22px;
            border-radius: 14px;
            font-weight: 900;
            border: 1px solid rgba(59, 130, 246, .25);
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            box-shadow: 0 12px 24px rgba(59,130,246,.35);
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .btn-submit:hover{
            transform: translateY(-1px);
            box-shadow: 0 16px 32px rgba(59,130,246,.45);
        }

        .btn-cancel{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 22px;
            border-radius: 14px;
            font-weight: 800;
            color: var(--muted);
            text-decoration: none;
            background: linear-gradient(180deg, #ffffff, #f9fafb);
            border: 1px solid rgba(17, 24, 39, 0.15);
            box-shadow: 0 8px 18px rgba(17, 24, 39, 0.06);
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, color .15s ease, background .15s ease;
        }

        .btn-cancel:hover{
            color: var(--text);
            background: rgba(17, 24, 39, 0.03);
            border-color: rgba(17, 24, 39, 0.25);
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(17, 24, 39, 0.10);
        }

        /* =========================
   ✅ 최종 정렬 오버라이드 (맨 아래에 붙이기)
========================= */

        /* 제목 크기 다시 커지는 문제 방지(중복 #title 덮어쓰기) */
        #title{
            font-size: 1.05rem !important;
            font-weight: 700 !important;
            height: 56px !important;
            padding: 16px 18px !important;
            letter-spacing: -0.2px !important;
        }

        /* ====== 팝업여부: label과 Y/N을 같은 줄로 ====== */
        /* mb-3 안에 label + radio-row가 있다고 가정 */
        #noticeForm .mb-3:has(.radio-row){
            display: grid;
            grid-template-columns: 110px 1fr; /* label | radios */
            align-items: center;
            gap: 12px;
        }

        #noticeForm .mb-3:has(.radio-row) > label{
            margin-bottom: 0 !important;
        }

        .radio-row{
            display: inline-flex !important;
            gap: 10px !important;
            margin: 0 !important;
        }

        /* ====== 시작일/종료일: 같은 줄(2칸) ====== */
        .grid-2{
            display: grid !important;
            grid-template-columns: 1fr 1fr !important; /* 시작일 | 종료일 */
            gap: 14px !important;
        }

        /* 각 칸 내부: label 옆에 input */
        .grid-2 > div{
            display: grid !important;
            grid-template-columns: 110px 1fr !important; /* label | input */
            align-items: center !important;
            gap: 12px !important;
        }

        .grid-2 label{
            margin-bottom: 0 !important;
        }

        /* datetime input 스타일 */
        #noticeForm input[type="datetime-local"]{
            height: 48px !important;
            padding: 10px 14px !important;
            font-size: .95rem !important;
        }

        /* 모바일에서는 줄바꿈 */
        @media (max-width: 640px){
            .grid-2{
                grid-template-columns: 1fr !important;
            }
        }

        /* 버튼 오른쪽 */
        .form-actions{
            display: flex !important;
            justify-content: flex-end !important;
            gap: 10px !important;
        }

        /* 첨부파일 등록 체크박스 (작게) */
        .attach-check{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(17,24,39,.10);
            background: rgba(17,24,39,.02);
            box-shadow: 0 8px 18px rgba(17,24,39,.06);
            font-weight: 800;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }

        .attach-check input{
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        /* 팝업여부 + 날짜를 한 줄에 */
        .popup-row{
            display: grid;
            grid-template-columns: 110px 160px 1fr; /* label | select | dates */
            align-items: center;
            gap: 12px;
        }

        .popup-row > label{
            margin-bottom: 0 !important;
        }

        /* 날짜 2개는 그 안에서 2열 */
        .popup-dates{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* 날짜 한 칸: label 옆 input */
        .date-field{
            display: grid;
            grid-template-columns: 70px 1fr; /* 시작일/종료일 | input */
            align-items: center;
            gap: 10px;
        }

        .date-field label{
            margin-bottom: 0 !important;
        }

        /* date input 스타일(기존 datetime-local과 톤 맞추기) */
        #noticeForm input[type="date"]{
            height: 48px;
            padding: 10px 14px;
            font-size: .95rem;
            border-radius: 14px;
            border: 1px solid rgba(17, 24, 39, 0.12);
        }

        /* 모바일에서는 세로로 */
        @media (max-width: 720px){
            .popup-row{
                grid-template-columns: 1fr;
                align-items: stretch;
            }
            .popup-dates{
                grid-template-columns: 1fr;
            }
            .date-field{
                grid-template-columns: 90px 1fr;
            }
        }


    </style>
</head>
<body>
<!----
<div th:replace="~{common/header :: header}"></div>
--->
<div class="container">
    <h2>공지사항등록 </h2>

    <div class="author-box">
        작성자 : <span id="authorEmail">확인 중...</span>
    </div>

    <form id="noticeForm" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" placeholder="공지사항 제목을 입력하세요" required maxlength="100">
        </div>

        <div class="mb-3">
            <label for="contents">내용</label>
            <textarea id="contents" name="contents" placeholder="공지 내용을 입력하세요" required></textarea>
        </div>

        <div class="mb-3 popup-row">
            <label for="isPopupSelect">팝업여부</label>

            <select id="isPopupSelect" name="isPopup" required>
                <option value="true">사용</option>
                <option value="false" selected>미사용</option>
            </select>

            <div class="popup-dates">
                <div class="date-field">
                    <label for="startedAt">시작일</label>
                    <input type="date" id="startedAt" name="startedAt">
                </div>

                <div class="date-field">
                    <label for="endedAt">종료일</label>
                    <input type="date" id="endedAt" name="endedAt">
                </div>
            </div>
        </div>


        <div class="form-actions">
            <!-- ✅ 첨부파일 등록 체크박스 -->
            <label class="attach-check">
                <input type="checkbox" id="attachAfter" name="attachAfter">
                <span>첨부파일있는경우</span>
            </label>
            <button type="submit" class="btn-submit">공지 등록</button>
            <a th:href="@{/notice/list}" class="btn-cancel">취소</a>
        </div>
    </form>
</div>

<script>
    // ✅ 페이지 진입 시 accessToken 유효성 검증 및 사용자 정보 표시
    window.addEventListener("DOMContentLoaded", async () => {
        // const token = localStorage.getItem("accessToken");
        //
        // if (!token) {
        //     // Spring Security에서 자동 리다이렉트 설정이 되어 있으면 여긴 안탐
        //     alert("로그인 후 이용해주세요.");
        //     window.location.href = "/auth/login";
        //     return;
        // }

        setupPopupToggle();
    });



    function setupPopupToggle() {
        const select = document.getElementById("isPopupSelect");
        const startAt = document.getElementById("startedAt");
        const endAt = document.getElementById("endedAt");

        function togglePopupDates(value) {
            const enabled = value === "true";

            startAt.disabled = !enabled;
            endAt.disabled = !enabled;

            startAt.required = enabled;
            endAt.required = enabled;

            if (!enabled) {
                startAt.value = "";
                endAt.value = "";
            }
        }

        select.addEventListener("change", (e) => togglePopupDates(e.target.value));

        // 최초 상태 반영
        togglePopupDates(select.value);
    }


    // ✅ 공지 등록 fetch
    document.getElementById('noticeForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        // const token = localStorage.getItem("accessToken");
        //
        // if (!token) {
        //     alert("로그인 후 이용해주세요.");
        //     window.location.href = "/auth/login";
        //     return;
        // }


        const formData = new FormData(e.target);

// ✅ date -> datetime 변환해서 넣기
        const isPopup = formData.get("isPopup");      // "true" / "false"
        const startedDate = formData.get("startedAt"); // "YYYY-MM-DD"
        const endedDate = formData.get("endedAt");     // "YYYY-MM-DD"

        if (isPopup === "true") {
            // 날짜가 비어있으면 서버가 validation에서 걸릴 수 있으니 그대로 두거나 체크
            if (startedDate) formData.set("startedAt", `${startedDate}T00:00:00`);
            if (endedDate) formData.set("endedAt", `${endedDate}T23:59:59`);
        } else {
            // 미사용이면 서버에 안 보내는 게 깔끔 (null 처리/검증 회피)
            formData.delete("startedAt");
            formData.delete("endedAt");
        }


        try {


            const response = await fetch('/api/v1/notice', {
                method: 'POST',
                credentials: "include",
                body: formData
            });

            const result = await response.json();
            const notice = result.data;
            console.log(notice.noticeNo);

            if (!response.ok) {
                alert(result.message || '공지 등록 실패');
                return;
            }

            alert('공지 등록 성공!');

            //const noticeNo = result?.data?.notice.noticeNo;
            const attachChecked = document.getElementById('attachAfter')?.checked;

            // ✅ 체크되어 있으면 새창 오픈(팝업)
            if (attachChecked && notice) {
                const w = 1100, h = 800;
                const left = Math.max(0, (window.screen.width - w) / 2);
                const top = Math.max(0, (window.screen.height - h) / 2);

                // Thymeleaf의 <a th:href="...">와 같은 URL 구조를 JS에서 그대로 사용:
                const attachUrl = `/notice/Attachment-notice/${notice.noticeNo}`;

                const popup = window.open(
                    attachUrl,
                    "attachPopup",
                    `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`
                );

                // 팝업 차단 시 안내
                if (!popup) {
                    alert("팝업이 차단되었습니다. 브라우저 팝업 허용 후 다시 시도해주세요.");
                }
            }

            // ✅ 부모창은 무조건 리스트로 이동
            window.location.href = "/notice/list";


        } catch (error) {
            console.error('공지사항 등록 중 오류 발생:', error);
            alert('공지사항 등록 중 오류가 발생했습니다.');
        }
    });
</script>
</body>
</html>
