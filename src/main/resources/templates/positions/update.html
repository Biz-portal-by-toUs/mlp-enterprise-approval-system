<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>직급 수정</title>

    <th:block layout:fragment="pageStyles">
        <style>
            .pos-edit .title-group{ margin: 6px 0 22px; }
            .pos-edit .title-group h1{ font-size:34px; margin:0 0 8px; font-weight:900; letter-spacing:-.2px; }
            .pos-edit .title-group h2{ font-size:18px; margin:0; font-weight:800; color:#555; }

            .pos-edit .edit-card{
                max-width: 760px;
                background: #f9fbff;
                border-radius: 24px;
                padding: 40px;
                border: 1px solid #e1e8f5;
                box-shadow: 0 10px 24px rgba(17,24,39,.06);
            }

            .pos-edit .meta-info{
                margin-bottom: 26px;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .pos-edit .label-sm{ font-weight: 800; color: var(--muted); font-size: 13px; }
            .pos-edit .chip{
                background: #eef4ff;
                color: var(--primary);
                padding: 6px 14px;
                border-radius: 20px;
                font-size: 13px;
                font-weight: 900;
                border: 1px solid rgba(59,130,246,.18);
            }

            .pos-edit .input-group{ margin-bottom: 22px; }
            .pos-edit .input-label{ font-weight: 900; margin-bottom: 10px; display: block; color: #222; }
            .pos-edit .form-control{
                width: 100%;
                height: 54px;
                border-radius: 14px;
                border: 1px solid var(--line);
                padding: 0 18px;
                font-size: 15px;
                outline: none;
                background: #fff;
            }
            .pos-edit .form-control:focus{
                border-color: rgba(59,130,246,.55);
                box-shadow: 0 0 0 4px rgba(59,130,246,.12);
            }
            .pos-edit .helper-text{
                font-size: 12px;
                color: var(--muted);
                margin-top: 8px;
                font-weight: 800;
            }

            .pos-edit .form-actions{
                display: flex;
                justify-content: flex-end;
                gap: 12px;
                margin-top: 28px;
            }
            .pos-edit .btn{
                height: 52px;
                min-width: 140px;
                border: none;
                border-radius: 14px;
                font-size: 15px;
                font-weight: 900;
                cursor: pointer;
                transition: transform .08s ease;
            }
            .pos-edit .btn:active{ transform: translateY(1px); }
            .pos-edit .btn-submit{
                background: var(--primary);
                color: #fff;
                box-shadow: 0 10px 22px rgba(59,130,246,.22);
            }
            .pos-edit .btn-cancel{
                background: #eef2f7;
                color: #374151;
                border: 1px solid rgba(17,24,39,.10);
            }

            .pos-edit .status-msg{
                margin-top: 18px;
                text-align: center;
                font-weight: 900;
                display: none;
                padding: 12px 14px;
                border-radius: 12px;
                border: 1px solid var(--line);
                background: #fff;
            }
            .pos-edit .status-msg.ok{ background:#f3fff6; border-color:#bfe7c9; color:#1b7f3a; }
            .pos-edit .status-msg.err{ background:#fff5f4; border-color:#ffd0cc; color:#b42318; }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="page-with-subbar">
        <!-- ✅ 관리자 사이드바(fragment) -->
        <div th:replace="~{sidebar/admin-sidebar :: adminSidebar('pos')}"></div>

        <main class="pos-edit" style="padding: 0 26px;">
            <div class="title-group">
                <h1>직급 편성</h1>
                <h2>직급 정보 수정</h2>
            </div>

            <div class="edit-card">
                <input type="hidden" id="posNo" th:value="${posNo}"/>

                <div class="meta-info">
                    <span class="label-sm">고유 번호</span>
                    <span class="chip" th:text="'No. ' + ${posNo}">No. -</span>
                </div>

                <div class="input-group">
                    <label class="input-label" for="posName">직급명</label>
                    <input type="text" id="posName" class="form-control"
                           th:value="${posName}" placeholder="수정할 직급명을 입력하세요" maxlength="30" />
                    <p class="helper-text">조직도에 표시될 직급의 이름입니다.</p>
                </div>

                <div class="input-group">
                    <label class="input-label" for="posOrder">직급 순서 (정렬)</label>
                    <select id="posOrder" class="form-control">
                        <option th:each="i : ${#numbers.sequence(1, 50)}"
                                th:value="${i}"
                                th:text="${i}"
                                th:selected="${i == posOrder}"></option>
                    </select>
                    <p class="helper-text">낮은 숫자일수록 상위 직급으로 정렬됩니다.</p>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-cancel"
                            onclick="location.href='/admin/positions/list'">취소 및 목록</button>
                    <button type="button" class="btn btn-submit" id="saveBtn">수정 사항 저장</button>
                </div>

                <div id="statusMsg" class="status-msg"></div>
            </div>
        </main>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:inline="javascript">
        const API_BASE = "/api/v1/admin/positions";

        function showStatus(isOk, text) {
            const el = document.getElementById("statusMsg");
            el.textContent = text;
            el.className = "status-msg " + (isOk ? "ok" : "err");
            el.style.display = "block";
            clearTimeout(window.__posStatusTimer);
            window.__posStatusTimer = setTimeout(() => { el.style.display = "none"; }, 2500);
        }

        async function safeJson(res) {
            const ct = res.headers.get("content-type") || "";
            if (!ct.includes("application/json")) return {};
            try { return await res.json(); } catch { return {}; }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("saveBtn");
            if (!btn) return;

            btn.addEventListener("click", async () => {
                const posNo = document.getElementById("posNo")?.value;
                const posName = document.getElementById("posName")?.value?.trim() || "";
                const posOrder = parseInt(document.getElementById("posOrder")?.value || "0", 10);

                if (!posNo) return showStatus(false, "직급 번호를 찾을 수 없습니다.");
                if (!posName) return showStatus(false, "직급명을 입력해주세요.");
                if (!Number.isInteger(posOrder) || posOrder < 1 || posOrder > 50) return showStatus(false, "직급 순서는 1~50 사이로 선택해주세요.");

                const payload = { posName, posOrder };

                try {
                    const response = await fetch(`${API_BASE}/${posNo}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json", "Accept":"application/json" },
                        credentials: "include",
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        showStatus(true, "성공적으로 반영되었습니다. 목록으로 이동합니다.");
                        setTimeout(() => location.href = "/admin/positions/list", 800);
                        return;
                    }

                    if (response.status === 401) return showStatus(false, "로그인이 필요합니다. 다시 로그인 해주세요.");
                    if (response.status === 403) return showStatus(false, "수정 권한이 없습니다 (관리자 전용).");

                    const data = await safeJson(response);
                    showStatus(false, data.message || data.msg || `수정 실패 (HTTP ${response.status})`);

                } catch (error) {
                    console.error("Fetch Error:", error);
                    showStatus(false, "서버 연결 실패. 네트워크를 확인하세요.");
                }
            });
        });
    </script>
</th:block>
</body>
</html>
