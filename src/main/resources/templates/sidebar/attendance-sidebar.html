<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="subbar" th:fragment="attendanceSidebar(active)">
    <div class="subbar-title">근태 관리</div>

    <nav class="subbar-nav" aria-label="근태 메뉴">
        <a class="subbar-item"
           th:href="@{/attendances/me/vacations}" href="/attendances/me/vacations"
           th:classappend="${active}=='vacations' ? ' active' : ''">
            내 휴가 관리
        </a>

        <a class="subbar-item"
           th:href="@{/attendances/me/business-trips}" href="/attendances/me/business-trips"
           th:classappend="${active}=='business-trips' ? ' active' : ''">
            내 출장 관리
        </a>
    </nav>
</aside>
</body>
</html>
