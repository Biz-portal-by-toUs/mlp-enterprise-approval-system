<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<head>
    <meta charset="utf-8" />
    <title>Bizportal - 공유 설비 조회</title>

    <!-- 이 페이지 전용 CSS -->
    <th:block layout:fragment="pageStyles">
        <style>
            /* ✅ 예약 페이지 타이틀 규격 */
            h2 { margin-bottom: 16px; }

            /* ✅ 예약 페이지 오른쪽 래퍼 느낌 */
            .shared-eq-page-wrap{
                font-family: Pretendard, Arial, sans-serif;
                background:#f7f8fa;
                width:100%;
            }

            /* ✅ 예약 페이지 섹션 패딩 규격 */
            .shared-eq-page{
                padding: 20px 20px 32px;
            }

            /* ✅ SweetAlert가 다른 레이어보다 위에 뜨도록 */
            .swal2-container{
                z-index: 3000000 !important;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 16px;
            }

            @media (max-width: 1100px){
                .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
            }
            @media (max-width: 720px){
                .grid { grid-template-columns: 1fr; }
            }

            .card {
                background: #ffffff;
                border: 1px solid rgba(17,24,39,0.08);
                border-radius: 14px;
                overflow: hidden;
                box-shadow: 0 6px 18px rgba(0,0,0,.08);
                display: flex;
                flex-direction: column;
                min-height: 320px;
            }

            .thumb {
                height: 160px;
                background: #e5e7eb;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .thumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .thumb .ph {
                color: #6b7280;
                font-size: 12px;
            }

            .card-body {
                padding: 12px 14px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .eq-name { font-weight: 800; }

            .meta {
                font-size: 12px;
                color: #6b7280;
                line-height: 1.45;
            }

            .meta b {
                color: #111827;
                font-weight: 700;
            }

            .divider {
                height: 1px;
                background: rgba(17,24,39,0.08);
                margin: 2px 0;
            }

            .paging {
                margin-top: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                flex-wrap: wrap;
            }

            .page-btn {
                min-width: 36px;
                height: 36px;
                border-radius: 10px;
                border: 1px solid rgba(17,24,39,0.08);
                background: #ffffff;
                cursor: pointer;
                font-size: 13px;
            }

            /* ✅ primary로 통일 */
            .page-btn.active {
                background: var(--primary);
                border-color: var(--primary);
                color: #fff;
                font-weight: 700;
            }

            .error {
                margin: 12px 0;
                padding: 10px 12px;
                border: 1px solid #fecaca;
                background: #fff1f2;
                color: #991b1b;
                border-radius: 12px;
                display: none;
                font-size: 13px;
            }

            /* 카드 선택 */
            .card.selectable { cursor: pointer; }
            .card.selected { outline: 3px solid var(--primary); }
            .card.selectable:hover { box-shadow: 0 0 0 2px rgba(79,143,227,.4); }

            /* =========================
               ✅ 버튼 통일 (저장해둔 버튼 규격)
               ========================= */
            .action-bar{
                display:none;
                justify-content:flex-end;
                align-items:center;
                gap:10px;
                margin-top:12px;
                margin-bottom:12px;
                padding-right:4px;
            }

            .action-bar .action-btn{
                height: 40px;
                padding: 0 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                border: none;
                white-space: nowrap;
                transition: 0.15s;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .action-bar .action-btn:hover{ filter: brightness(0.9); }
            .action-bar .action-btn:disabled{
                opacity: .5;
                cursor: not-allowed;
                filter: none;
            }

            .action-bar .action-btn.create{
                background: var(--primary);
                color: #fff;
            }
            .action-bar .action-btn.edit{
                background: #eaf2ff;
                color: #2b5db8;
            }
            .action-bar .action-btn.delete{
                background: #fdecec;
                color: #c62828;
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <!-- 🔹 왼쪽: 예약 서브 사이드바 (공유 설비 예약 active) -->
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('equipment')"></aside>

        <!-- ✅ 오른쪽 -->
        <div class="shared-eq-page-wrap">
            <main class="shared-eq-page">
                <h2>공유 설비</h2>
                <br><br>

                <div class="error" id="errBox"></div>

                <section class="grid" id="grid"></section>

                <div id="actionBar" class="action-bar">
                    <button id="btnCreate" class="action-btn create" type="button">등록</button>
                    <button id="btnEdit" class="action-btn edit" type="button" disabled>선택 수정</button>
                    <button id="btnDelete" class="action-btn delete" type="button" disabled>선택 삭제</button>
                </div>

                <div class="paging" id="paging"></div>
            </main>
        </div>
    </section>
</div>

<!-- 이 페이지 전용 JS -->
<th:block layout:fragment="pageScripts">
    <!-- ✅ SweetAlert2 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        /* =========================
           SweetAlert2 (회의실 조회와 동일)
           ========================= */
        const SWAL_PRIMARY = getComputedStyle(document.documentElement)
            .getPropertyValue("--primary")
            .trim() || "#4f8fe3";

        const SWAL_GRAY = "#9ca3af";
        const SWAL_RED  = "#ff4d4f";

        function swalAlert({ icon="info", title="알림", text="" }) {
            return Swal.fire({ icon, title, text, confirmButtonColor: SWAL_PRIMARY });
        }
        function swalSuccess(text, title="완료") { return swalAlert({ icon:"success", title, text }); }
        function swalError(text, title="오류") { return swalAlert({ icon:"error", title, text }); }
        function swalWarn(text, title="확인") { return swalAlert({ icon:"warning", title, text }); }

        async function swalConfirm({
                                       title="확인",
                                       text="진행할까요?",
                                       icon="question",
                                       confirmText="확인",
                                       cancelText="취소",
                                       confirmColor=SWAL_PRIMARY
                                   }){
            const result = await Swal.fire({
                title, text, icon,
                showCancelButton: true,
                confirmButtonText: confirmText,
                cancelButtonText: cancelText,
                confirmButtonColor: confirmColor,
                cancelButtonColor: SWAL_GRAY,
                reverseButtons: true
            });
            return result.isConfirmed;
        }

        function swalLoading(title="처리 중...", text="잠시만 기다려 주세요.") {
            return Swal.fire({
                title,
                text,
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
        }

        /* =========================
           페이지 로직
           ========================= */
        let selectedEqNo = null;
        let isAdmin = false;

        const NO_IMAGE_URL = "/images/no-image.png";
        const API_BASE = window.location.origin;

        const grid   = document.getElementById("grid");
        const paging = document.getElementById("paging");
        const errBox = document.getElementById("errBox");

        let state = { page: 0, size: 6, totalPages: 0 };

        function showError(msg){
            errBox.style.display = "block";
            errBox.textContent = msg;
        }
        function clearError(){
            errBox.style.display = "none";
            errBox.textContent = "";
        }

        function setButtonsDisabled(disabled){
            document.getElementById("btnEdit").disabled = disabled;
            document.getElementById("btnDelete").disabled = disabled;
        }

        async function apiFetch(path, options = {}) {
            const url = API_BASE + path;

            const res = await fetch(url, {
                ...options,
                credentials: "include",
                headers: { ...(options.headers || {}) }
            });

            if (res.status === 401 || res.status === 403) {
                await swalWarn("로그인이 만료되었습니다. 다시 로그인해 주세요.", "로그인 만료");
                location.href = "/auth/employee/login";
                throw new Error("UNAUTHORIZED");
            }
            return res;
        }

        function cardTemplate(eq){
            const safe = (v) => (v === null || v === undefined || v === "") ? "-" : v;

            return `
              <article class="card ${isAdmin ? "selectable" : ""}" data-eq-no="${eq.eqNo}">
                <div class="thumb">
                  <img
                    src="${eq.imageUrl || NO_IMAGE_URL}"
                    onerror="this.src='${NO_IMAGE_URL}'"
                    alt="공유 설비 이미지"
                  />
                </div>
                <div class="card-body">
                  <div class="eq-name">설비명: ${safe(eq.eqName)}</div>
                  <div class="divider"></div>
                  <div class="meta"><b>설비번호:</b> ${safe(eq.eqId)}</div>
                  <div class="meta"><b>모델명:</b> ${safe(eq.modelName)}</div>
                  <div class="meta"><b>보관위치:</b> ${safe(eq.location)}</div>
                </div>
              </article>
            `;
        }

        function renderGrid(content){
            grid.innerHTML = content.map(cardTemplate).join("");
        }

        function enableSelection(){
            if (!isAdmin) return;

            document.querySelectorAll(".card.selectable").forEach(card => {
                card.addEventListener("click", () => {
                    // ✅ 회의실/법인차량 조회처럼 토글 선택
                    const already = card.classList.contains("selected");

                    document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));

                    if (already) {
                        selectedEqNo = null;
                        setButtonsDisabled(true);
                        return;
                    }

                    card.classList.add("selected");
                    selectedEqNo = card.dataset.eqNo;
                    setButtonsDisabled(false);
                });
            });
        }

        function renderPaging(current, total){
            paging.innerHTML = "";
            if (total <= 1) return;

            const mkBtn = (label, onClick, disabled=false, active=false) => {
                const b = document.createElement("button");
                b.className = "page-btn" + (active ? " active" : "");
                b.textContent = label;
                b.disabled = disabled;
                b.addEventListener("click", onClick);
                return b;
            };

            paging.appendChild(mkBtn("‹", () => loadEq(current - 1), current === 0));

            const windowSize = 5;
            const start = Math.max(0, current - Math.floor(windowSize/2));
            const end = Math.min(total - 1, start + windowSize - 1);
            const realStart = Math.max(0, end - windowSize + 1);

            for(let p = realStart; p <= end; p++){
                paging.appendChild(mkBtn(String(p+1), () => loadEq(p), false, p === current));
            }

            paging.appendChild(mkBtn("›", () => loadEq(current + 1), current >= total - 1));
        }

        async function loadEq(page){
            clearError();

            state.page = page;
            selectedEqNo = null;
            setButtonsDisabled(true);

            try {
                const res = await apiFetch(`/api/v1/shared-equipment?page=${page}&size=${state.size}`, { method: "GET" });
                if (!res.ok) {
                    showError(`조회 실패 (${res.status})`);
                    grid.innerHTML = "";
                    paging.innerHTML = "";
                    return;
                }

                const json = await res.json();

                isAdmin = json?.data?.isAdmin === true;
                document.getElementById("actionBar").style.display = isAdmin ? "flex" : "none";

                const pageData = json?.data?.data;
                const content = pageData?.content || [];

                renderGrid(content);
                enableSelection();

                state.totalPages = pageData?.totalPages || 0;
                renderPaging(pageData?.number ?? page, state.totalPages);

            } catch (e) {
                console.error(e);
                if (String(e?.message || "").includes("UNAUTHORIZED")) return;
                showError("조회에 실패했습니다. (서버/쿠키/권한 확인)");
                grid.innerHTML = "";
                paging.innerHTML = "";
            }
        }

        document.getElementById("btnCreate").onclick = () => {
            location.href = "/shared-equipment/register";
        };

        document.getElementById("btnEdit").onclick = async () => {
            if (!selectedEqNo) {
                await swalWarn("수정할 설비를 선택하세요.");
                return;
            }
            location.href = `/shared-equipment/${selectedEqNo}/edit`;
        };

        document.getElementById("btnDelete").onclick = async () => {
            if (!selectedEqNo) {
                await swalWarn("삭제할 설비를 선택하세요.");
                return;
            }

            const ok = await swalConfirm({
                title: "공유 설비 삭제",
                text: "공유 설비를 삭제하면 되돌릴 수 없습니다.\n정말 삭제하시겠습니까?",
                icon: "warning",
                confirmText: "삭제",
                cancelText: "닫기",
                confirmColor: SWAL_RED
            });
            if (!ok) return;

            try {
                swalLoading("삭제 처리 중...", "잠시만 기다려 주세요.");

                const res = await apiFetch(`/api/v1/shared-equipment/${selectedEqNo}`, { method: "DELETE" });

                // 서버가 json/text 에러메시지 주는 경우도 대비
                if (!res.ok) {
                    Swal.close();
                    let msg = "삭제에 실패했습니다. 잠시 후 다시 시도해주세요.";
                    try {
                        const ct = res.headers.get("content-type") || "";
                        if (ct.includes("application/json")) {
                            const payload = await res.json();
                            msg = payload?.message || msg;
                        } else {
                            const t = await res.text();
                            if (t) msg = t;
                        }
                    } catch {}
                    await swalError(msg, "삭제 실패");
                    return;
                }

                Swal.close();
                await Swal.fire({
                    icon: "success",
                    title: "삭제 완료",
                    text: "공유 설비가 삭제되었습니다.",
                    timer: 1100,
                    showConfirmButton: false,
                    confirmButtonColor: SWAL_PRIMARY
                });

                selectedEqNo = null;
                setButtonsDisabled(true);
                loadEq(state.page);

            } catch (e) {
                Swal.close();
                console.error(e);
                if (String(e?.message || "").includes("UNAUTHORIZED")) return;
                await swalError("삭제 중 오류가 발생했습니다.", "오류");
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            loadEq(0);
        });
    </script>
</th:block>

</body>
</html>
