<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>회사 비밀번호 변경</title>
    <style>
        :root{
            --primary:#2f6fda;
            --bg:#f3f5f9;
            --card:#ffffff;
            --text:#111;
            --muted:#6b7280;
            --line:#e5e7eb;
            --shadow:0 18px 50px rgba(17,24,39,.08);
            --radius:16px;
            --danger:#ef4444;
            --ok:#22c55e;
        }
        *{box-sizing:border-box}
        body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text)}
        .shell{min-height:100vh;padding:22px}
        .frame{background:#fff;border:1px solid #e6e6e6;border-radius:8px; padding:22px; min-height:calc(100vh - 44px);}
        .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 6px;}
        .brand{font-weight:800;font-size:34px;letter-spacing:-.4px}
        .nav{display:flex;gap:16px;color:var(--text);font-weight:600}
        .nav a{color:inherit;text-decoration:none}
        .right{display:flex;gap:10px}
        .btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid #cfd6e4;background:#fff;font-weight:600;cursor:pointer;}

        .center{display:flex;align-items:center;justify-content:center;padding:50px 0 40px;}
        .card{
            width:min(700px, 92vw);
            background:var(--card);
            border:1px solid var(--line);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:28px 26px 24px;
        }
        .title{font-size:40px;font-weight:900;text-align:center;margin:0 0 10px;}
        .sub{font-size:13px;color:var(--muted);text-align:center;margin:0 0 18px;}

        .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0 18px;}
        .chip{
            display:inline-flex;align-items:center;gap:10px;
            padding:10px 14px;border-radius:999px;
            background:#ffecec;color:#d94a3a;font-weight:800;font-size:14px;
        }
        .chip.ok{background:#eafaf0;color:#16a34a}
        .chip .x{font-weight:900}

        .field{margin:14px 0;}
        .label{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.4px;margin:0 0 6px;}
        .input-wrap{
            width:100%;height:48px;border-radius:12px;border:1px solid var(--line);
            display:flex;align-items:center;overflow:hidden;background:#fff;
        }
        .input{
            flex:1;height:48px;border:0;outline:none;padding:0 14px;font-size:15px;background:transparent;
        }
        .icon-btn{
            width:52px;height:48px;border:0;background:#fff;border-left:1px solid var(--line);
            cursor:pointer;display:flex;align-items:center;justify-content:center;
        }
        .input-wrap:focus-within{border-color:#b7c9f5;box-shadow:0 0 0 4px rgba(47,111,218,.12);}

        .hintline{
            margin-top:8px;
            font-size:12.5px;
            font-weight:800;
            text-align:left;
            display:none;
        }
        .hintline.ok{color:var(--ok)}
        .hintline.bad{color:var(--danger)}

        .actions{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px;}
        .primary{
            width:320px;height:50px;border-radius:12px;border:0;background:var(--primary);color:#fff;
            font-weight:800;cursor:pointer;
        }
        .msg{margin-top:8px;font-size:13px;text-align:center}
        .msg.ok{color:var(--ok)}
        .msg.bad{color:var(--danger)}
        svg{width:20px;height:20px;opacity:.72}
    </style>
</head>

<body>
<div class="shell">
    <div class="frame">
        <div class="topbar">
            <div class="brand">Bizportal</div>
            <div class="nav">
                <a href="#">요금제</a>
                <a href="#">마이페이지</a>
            </div>
            <div class="right">
                <button class="btn" type="button" onclick="location.href='/'">메인</button>
            </div>
        </div>

        <div class="center">
            <div class="card">
                <div class="title">Change Password</div>
                <div class="sub">회사 인증 완료 후 비밀번호를 변경하세요.</div>

                <div class="chips">
                    <div id="cUpper" class="chip"><span class="x">✕</span> 영어 대문자</div>
                    <div id="cLower" class="chip"><span class="x">✕</span> 영어 소문자</div>
                    <div id="cNum"   class="chip"><span class="x">✕</span> 숫자</div>
                    <div id="cSp"    class="chip"><span class="x">✕</span> 특수문자</div>
                    <div id="cLen"   class="chip"><span class="x">✕</span> 8자 이상 20자 이내</div>
                </div>

                <div class="field">
                    <div class="label">CURRENT PASSWORD</div>
                    <div class="input-wrap">
                        <input id="currentPwd" class="input" type="password" placeholder="현재 비밀번호" maxlength="20"/>
                        <button class="icon-btn" type="button" data-target="currentPwd" aria-label="toggle password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <div class="label">NEW PASSWORD</div>
                    <div class="input-wrap">
                        <input id="newPwd" class="input" type="password" placeholder="새 비밀번호" maxlength="20"/>
                        <button class="icon-btn" type="button" data-target="newPwd" aria-label="toggle password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <div class="label">CONFIRM PASSWORD</div>
                    <div class="input-wrap">
                        <input id="confirmPwd" class="input" type="password" placeholder="비밀번호 확인" maxlength="20"/>
                        <button class="icon-btn" type="button" data-target="confirmPwd" aria-label="toggle password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <!-- ✅ 실시간 일치 여부 표시 -->
                    <div id="matchHint" class="hintline"></div>
                </div>

                <div class="actions">
                    <button id="submitBtn" class="primary" type="button">변경하기</button>
                    <div id="msg" class="msg"></div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    const CHANGE_URL = "/auth/password";

    // 인증 성공 시: sessionStorage.setItem("companyPwSubjectId", data.subjectId)
    function getSubjectId() {
        const v = sessionStorage.getItem("companyPwSubjectId");
        return v ? Number(v) : null;
    }

    function showMsg(text, ok){
        const el = document.getElementById("msg");
        el.textContent = text;
        el.className = "msg " + (ok ? "ok" : "bad");
    }

    function chip(el, ok){
        const label = el.textContent.replace(/^✕\s|^✓\s/, '').trim();
        el.classList.toggle("ok", ok);
        el.innerHTML = (ok ? '<span class="x">✓</span> ' : '<span class="x">✕</span> ') + label;
    }

    const cUpper = document.getElementById("cUpper");
    const cLower = document.getElementById("cLower");
    const cNum   = document.getElementById("cNum");
    const cSp    = document.getElementById("cSp");
    const cLen   = document.getElementById("cLen");

    function validatePwd(pwd){
        const upper = /[A-Z]/.test(pwd);
        const lower = /[a-z]/.test(pwd);
        const num   = /[0-9]/.test(pwd);
        const sp    = /[^A-Za-z0-9]/.test(pwd);
        const len   = pwd.length >= 8 && pwd.length <= 20;

        chip(cUpper, upper);
        chip(cLower, lower);
        chip(cNum,   num);
        chip(cSp,    sp);
        chip(cLen,   len);

        return upper && lower && num && sp && len;
    }

    // ✅ 실시간 "새 비밀번호" == "확인" 체크
    const matchHint = document.getElementById("matchHint");
    function updateMatchHint(){
        const newPwd = document.getElementById("newPwd").value;
        const confirmPwd = document.getElementById("confirmPwd").value;

        // 둘 다 비어있으면 표시 안 함
        if (!newPwd && !confirmPwd) {
            matchHint.style.display = "none";
            matchHint.textContent = "";
            matchHint.className = "hintline";
            return;
        }

        // 확인이 아직 비어있으면 안내만
        if (newPwd && !confirmPwd) {
            matchHint.style.display = "block";
            matchHint.textContent = "비밀번호 확인을 입력해주세요.";
            matchHint.className = "hintline bad";
            return;
        }

        // 비교
        const ok = newPwd === confirmPwd;
        matchHint.style.display = "block";
        matchHint.textContent = ok ? "비밀번호가 일치합니다." : "비밀번호가 일치하지 않습니다.";
        matchHint.className = "hintline " + (ok ? "ok" : "bad");
    }

    document.getElementById("newPwd").addEventListener("input", (e) => {
        validatePwd(e.target.value);
        updateMatchHint();
    });
    document.getElementById("confirmPwd").addEventListener("input", () => {
        updateMatchHint();
    });

    document.querySelectorAll(".icon-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-target");
            const input = document.getElementById(id);
            input.type = (input.type === "password") ? "text" : "password";
        });
    });

    document.getElementById("submitBtn").addEventListener("click", async () => {
        const subjectId = getSubjectId();
        if (!subjectId) {
            showMsg("인증 정보가 없습니다. 회사 인증 페이지에서 다시 진행해주세요.", false);
            setTimeout(() => location.href = "/auth/companies/verify", 700);
            return;
        }

        const currentPassword = document.getElementById("currentPwd").value;
        const newPassword = document.getElementById("newPwd").value;
        const newPasswordConfirm = document.getElementById("confirmPwd").value;

        if (!currentPassword) return showMsg("현재 비밀번호를 입력해주세요.", false);
        if (!validatePwd(newPassword)) return showMsg("비밀번호 정책을 만족해주세요.", false);
        if (newPassword !== newPasswordConfirm) return showMsg("비밀번호 확인이 일치하지 않습니다.", false);

        try {
            const res = await fetch(CHANGE_URL, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    subjectId,
                    subjectType: "COMPANY",
                    currentPassword,
                    newPassword,
                    newPasswordConfirm
                })
            });

            if (!res.ok) {
                let err = `변경 실패 (${res.status})`;
                try { err = (await res.json()).message || err; } catch(e) {}
                showMsg(err, false);
                return;
            }

            showMsg("비밀번호 변경 완료! 회사 로그인 페이지로 이동합니다.", true);

            sessionStorage.removeItem("companyPwSubjectId");

            setTimeout(() => location.href = "/auth/companies/login", 700);

        } catch (e) {
            showMsg("요청 실패: " + e.message, false);
        }
    });
</script>
</body>
</html>
