<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">

<div layout:fragment="content">

    <h1> 메인 페이지 </h1>

    <!-----
    <a th:href="@{/notice/list}" class="nav-item">공지사항목록</a>
    <a th:href="@{/boards/list}" class="nav-item">자유게시판목록</a>
    <a th:href="@{/notice/files}">파일 다운로드/보기</a>
    ---->

    <!--
      ✅ 아래부터는 네가 준 팝업 코드 "그대로" 붙여넣은 것
      ✅ layout.html이 body/head를 갖고 있으니, 이 페이지에서는 body/head를 만들지 않고
         content fragment 안에만 넣는다.
      ✅ <style>, <script>는 body 안에 있어도 동작함(레이아웃 확인용으로는 충분)
    -->

    <style>
        :root{
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: rgba(17, 24, 39, 0.08);
            --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            --shadow2: 0 6px 18px rgba(17, 24, 39, 0.10);

            --primary: #3b82f6;
            --primary2: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --warn: #f59e0b;
        }

        /* ===== Modal Overlay ===== */
        .popup-overlay{
            position: fixed;
            inset: 0;
            display: none;                /* JS에서 flex로 열림 */
            align-items: center;
            justify-content: center;
            z-index: 9999;

            background:
                    radial-gradient(900px 600px at 20% 10%, rgba(59,130,246,.25), transparent 55%),
                    radial-gradient(800px 500px at 85% 0%, rgba(16,185,129,.20), transparent 55%),
                    rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            padding: 18px;
        }

        /* ===== Modal Card ===== */
        .popup-modal{
            width: min(640px, 92vw);
            background: var(--card);
            border-radius: 18px;
            box-shadow: 0 30px 80px rgba(0,0,0,.35);
            border: 1px solid rgba(255,255,255,.25);
            overflow: hidden;
            transform: translateY(6px);
            animation: popupIn .18s ease-out forwards;
            font-family: 'Noto Sans KR', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }

        @keyframes popupIn{
            from { opacity: 0; transform: translateY(14px) scale(.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== Header ===== */
        .popup-header{
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            background: linear-gradient(135deg, rgba(59,130,246,.14), rgba(255,255,255,0));
            border-bottom: 1px solid var(--line);
        }

        .popup-title{
            margin: 0;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: -0.2px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 제목 왼쪽 작은 점(포인트) */
        .popup-title::before{
            content:"";
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: rgba(59,130,246,.65);
            box-shadow: 0 0 0 4px rgba(59,130,246,.15);
        }

        /* ===== Body ===== */
        .popup-body{
            padding: 16px;
            max-height: 56vh;
            overflow: auto;

            color: var(--text);
            line-height: 1.7;
            white-space: pre-wrap;

            /* 내용 카드 느낌 */
            background: rgba(17,24,39,.02);
            border-top: 1px solid rgba(17,24,39,.04);
        }

        /* 스크롤바(선택) */
        .popup-body::-webkit-scrollbar{ width: 10px; }
        .popup-body::-webkit-scrollbar-thumb{
            background: rgba(31,41,55,.18);
            border-radius: 999px;
            border: 3px solid rgba(255,255,255,.65);
        }
        .popup-body::-webkit-scrollbar-track{ background: transparent; }

        /* ===== Footer ===== */
        .popup-footer{
            padding: 12px 16px;
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--card);
        }

        .popup-meta{
            font-size: 12px;
            font-weight: 900;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* 카운터 칩 */
        #popupCounter{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(59,130,246,.08);
            border: 1px solid rgba(59,130,246,.18);
            color: rgba(31,41,55,.85);
        }

        /* ===== Buttons ===== */
        .popup-actions{
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn{
            appearance: none;
            border: 1px solid rgba(17,24,39,.10);
            background: #fff;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 900;
            color: var(--text);
            box-shadow: 0 10px 20px rgba(17,24,39,.06);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
        }

        .btn:hover{
            transform: translateY(-1px);
            box-shadow: var(--shadow2);
            border-color: rgba(59,130,246,.25);
            background: rgba(59,130,246,.05);
        }

        /* primary */
        .btn.primary{
            border-color: rgba(59,130,246,.35);
            background: linear-gradient(135deg, rgba(59,130,246,.18), rgba(255,255,255,0));
        }

        /* close X */
        .btn.close-x{
            border: 1px solid rgba(17,24,39,.10);
            background: rgba(255,255,255,.85);
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 12px;
            font-size: 20px;
            line-height: 1;
            display: grid;
            place-items: center;
            color: rgba(31,41,55,.85);
        }

        .btn.close-x:hover{
            border-color: rgba(239,68,68,.30);
            background: rgba(239,68,68,.06);
        }

        /* ===== Mobile ===== */
        @media (max-width: 520px){
            .popup-modal{ width: min(560px, 94vw); }
            .popup-footer{
                flex-direction: column;
                align-items: stretch;
            }
            .popup-actions{
                width: 100%;
                justify-content: stretch;
            }
            .popup-actions .btn{
                flex: 1 1 auto;
                justify-content: center;
            }
            #popupCounter{
                width: 100%;
                justify-content: center;
            }
        }

        .btn.danger{
            border-color: rgba(239,68,68,.25);
            background: linear-gradient(135deg, rgba(239,68,68,.12), rgba(255,255,255,0));
        }
        .btn.danger:hover{
            border-color: rgba(239,68,68,.40);
            background: rgba(239,68,68,.06);
        }
    </style>

    <!-- Modal -->
    <div id="popupOverlay" class="popup-overlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
        <div class="popup-modal">
            <div class="popup-header">
                <h3 id="popupTitle" class="popup-title">공지</h3>
                <button class="btn close-x" type="button" aria-label="Close" onclick="closePopup()">×</button>
            </div>

            <div id="popupBody" class="popup-body">
                <!-- contents -->
            </div>

            <div class="popup-footer">
                <div class="popup-meta">
                    <span id="popupCounter"></span>
                </div>

                <div class="popup-actions">
                    <button class="btn danger" type="button" onclick="hideToday()">오늘 하루 보지 않기</button>
                    <button class="btn" type="button" onclick="nextPopup()">다음</button>
                    <button class="btn primary" type="button" onclick="closePopup()">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ====== config ======
        const API_URL = "http://localhost:8090/api/v1/notices-popup";

        // ====== state ======
        let popupList = [];
        let currentIndex = 0;

        // 유틸: 오늘 끝(23:59:59)까지의 epoch(ms)
        function endOfTodayMs() {
            const now = new Date();
            const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
            return end.getTime();
        }

        // 유틸: noticeNo별 오늘 하루 숨김 체크
        function isHiddenToday(noticeNo) {
            const key = `popup_notice_${noticeNo}_hide_until`;
            const until = Number(localStorage.getItem(key) || "0");
            return Date.now() < until;
        }

        // 유틸: startedAt/endedAt 범위 필터(선택)
        function isWithinPeriod(item) {
            if (!item.startedAt || !item.endedAt) return true;
            const now = Date.now();
            const start = new Date(item.startedAt).getTime();
            const end = new Date(item.endedAt).getTime();
            return now >= start && now <= end;
        }

        function openPopup() {
            document.getElementById("popupOverlay").style.display = "flex";
        }

        function closePopup() {
            document.getElementById("popupOverlay").style.display = "none";
            // 필요하면 상태 초기화
            // popupList = []; currentIndex = 0;
        }

        function renderPopup(index) {
            if (!popupList.length) {
                closePopup();
                return;
            }
            if (index < 0 || index >= popupList.length) {
                closePopup();
                return;
            }

            const item = popupList[index];

            // contents가 문자열 JSON 형태: "{\"text\": \"공지 내용6\"}"
            let text = "";
            try {
                const obj = (typeof item.contents === "string") ? JSON.parse(item.contents) : item.contents;
                text = obj?.text ?? String(item.contents ?? "");
            } catch (e) {
                // 파싱 실패 시 원문 출력
                text = String(item.contents ?? "");
            }

            document.getElementById("popupTitle").textContent = item.title ?? `공지 #${item.noticeNo}`;
            document.getElementById("popupBody").textContent = text;

            document.getElementById("popupCounter").textContent =
                `${index + 1} / ${popupList.length} (noticeNo: ${item.noticeNo})`;

            openPopup();
        }

        function nextPopup() {
            // 다음 보여줄 항목 찾기
            for (let i = currentIndex + 1; i < popupList.length; i++) {
                currentIndex = i;
                renderPopup(currentIndex);
                return;
            }
            // 끝이면 닫기
            closePopup();
        }

        function hideToday() {
            const item = popupList[currentIndex];
            if (!item) return;

            const key = `popup_notice_${item.noticeNo}_hide_until`;
            localStorage.setItem(key, String(endOfTodayMs()));

            // 현재 팝업은 넘기기
            nextPopup();
        }

        async function loadPopups() {
            try {

                const res = await fetch(API_URL, {
                    method: "GET",
                    credentials: "include",
                    headers: { "Accept": "application/json" }
                });

                if (!res.ok) {
                    console.error("API error:", res.status);
                    return;
                }

                const json = await res.json();
                const data = Array.isArray(json.data) ? json.data : [];

                // 1) isPopup=true 2) 기간 내 3) 오늘 숨김 제외
                popupList = data
                    .filter(item => item && item.isPopup === true)
                    .filter(isWithinPeriod)
                    .filter(item => !isHiddenToday(item.noticeNo));

                if (!popupList.length) return;

                // 첫 항목부터 보여주기
                currentIndex = 0;
                renderPopup(currentIndex);

            } catch (err) {
                console.error("Failed to load popups:", err);
            }
        }

        // 페이지 로드 시 자동 실행
        window.addEventListener("DOMContentLoaded", loadPopups);

        // overlay 클릭 시 닫기(원하면)
        document.getElementById("popupOverlay").addEventListener("click", (e) => {
            if (e.target.id === "popupOverlay") closePopup();
        });

        // ESC로 닫기
        window.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closePopup();
        });
    </script>

</div>
</html>
