<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 규정 어시스턴트</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --bot-bubble: #f3f4f6;
            --user-bubble: #4f46e5;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
        }

        .wrap {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        .top {
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .title { display: flex; align-items: center; gap: 12px; }
        .bot-logo {
            width: 32px; height: 32px;
            background: var(--primary-color);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 18px;
        }
        .title-text h1 { margin: 0; font-size: 18px; font-weight: 700; }

        .status-area { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; }
        .status-dot.on { background: #10b981; box-shadow: 0 0 8px #10b981; }

        .msgs {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .msg-group {
            display: flex;
            gap: 14px;
            max-width: 85%;
            animation: fadeInUp 0.3s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-group.me { flex-direction: row-reverse; align-self: flex-end; }

        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #eef2ff;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 18px;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .msg-group.bot .bubble { background-color: var(--bot-bubble); border-top-left-radius: 2px; }
        .msg-group.me .bubble { background-color: var(--user-bubble); color: white; border-top-right-radius: 2px; }

        .msg-group.guide .bubble {
            background: linear-gradient(135deg, #f5f7ff 0%, #ffffff 100%);
            border: 1px solid #e0e7ff;
            color: var(--primary-color);
            font-weight: 600;
        }

        .time-info { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: block; }
        .me .time-info { text-align: right; }

        .bottom-area { padding: 24px; background: white; border-top: 1px solid var(--border-color); }
        .input-wrapper {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex; align-items: flex-end; gap: 12px;
        }
        textarea { flex: 1; border: none; background: transparent; outline: none; font-size: 15px; padding: 8px 0; resize: none; max-height: 150px; }
        .send-btn {
            background: var(--primary-color); color: white; border: none;
            width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .system-msg { align-self: center; font-size: 12px; color: var(--text-muted); background: #f3f4f6; padding: 4px 12px; border-radius: 99px; margin: 10px 0; }
    </style>
</head>

<body>
<div class="wrap">
    <div class="top">
        <div class="title">
            <div class="bot-logo">AI</div>
            <div class="title-text">
                <h1>사내 규정 어시스턴트</h1>
                <div class="status-area">
                    <span id="connDot" class="status-dot"></span>
                    <span id="statusText">연결 대기 중</span>
                </div>
            </div>
        </div>
        <div class="actions">
            <button style="border:none; background:none; color:var(--text-muted); font-size:12px; cursor:pointer;" onclick="location.reload()">새로고침</button>
        </div>
    </div>

    <div class="msgs" id="messages">
    </div>

    <div class="bottom-area">
        <div class="input-wrapper">
            <textarea id="messageInput" placeholder="궁금한 규정에 대해 물어보세요..." rows="1" autocomplete="off"></textarea>
            <button id="sendBtn" class="send-btn" onclick="sendQuestion()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:11px; color:#9ca3af; padding: 0 4px;">
            <span id="byteInfo">0 / 61440 bytes</span>
            <span>대화 맥락은 세션 동안 유지됩니다.</span>
        </div>
    </div>
</div>

<script>
    /**
     * 세션 ID 관리 (sessionStorage 사용)
     * 탭을 닫거나 새로고침하면 초기화되어 '초기 진입' 상태를 만듭니다.
     */
    function getSessionId() {
        // 1. 우선 URL 주소창에서 sessionId가 있는지 확인합니다.
        const urlParams = new URLSearchParams(window.location.search);
        let sessionId = urlParams.get('sessionId');

        // 2. 만약 URL에 없다면(직접 접속 등), 현재 창의 sessionStorage를 확인합니다.
        if (!sessionId) {
            sessionId = sessionStorage.getItem("CHAT_SESSION_ID");
        }

        // 3. 둘 다 없으면 최후의 수단으로 새로 생성합니다.
        if (!sessionId) {
            sessionId = crypto.randomUUID();
        }

        // 4. 가져온 ID를 현재 창의 세션스토리지에 저장하여 새로고침 시에도 유지되게 합니다.
        sessionStorage.setItem("CHAT_SESSION_ID", sessionId);
        return sessionId;
    }

    function authHeaders() {
        return {
            'Content-Type': 'application/json',
            'X-Session-Id': getSessionId()
        };
    }

    function escapeHtml(str) { return String(str ?? "").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[s])); }
    function linkify(text) { return text.replace(/(https?:\/\/[^\s]+)/g, url => `<a href="${url}" target="_blank" style="color:inherit; font-weight:600;">${url}</a>`); }
    function nowTime() { return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

    const msgDomMap = new Map();

    function appendBubble({ role, senderLabel, content, messageId, createdAt }) {
        const box = document.getElementById("messages");
        const group = document.createElement("div");

        const isGuide = senderLabel === "시스템 가이드";
        group.className = (role === "USER") ? "msg-group me" : (isGuide ? "msg-group bot guide" : "msg-group bot");

        let html = "";
        if (role !== "USER") {
            html += `<div class="avatar">${isGuide ? '📍' : '🤖'}</div>`;
        }

        const safeContent = linkify(escapeHtml(content ?? ""));
        const time = createdAt ? new Date(createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : nowTime();

        html += `
            <div class="msg-content">
                <div class="bubble">${safeContent}</div>
                <span class="time-info">${time}</span>
            </div>
        `;

        group.innerHTML = html;
        box.appendChild(group);

        if (messageId) {
            msgDomMap.set(messageId, { bubbleEl: group.querySelector(".bubble"), timeEl: group.querySelector(".time-info") });
        }

        box.scrollTop = box.scrollHeight;
        return group;
    }

    // [시스템 가이드] 탭 진입 시 최초 노출
    async function showDocumentGuide() {
        try {
            const res = await fetch("/api/v1/prov-documents/chatbot?size=100", { method: "GET", headers: authHeaders() });
            if (!res.ok) return;
            const raw = await res.json();
            const docs = raw?.data?.content ?? [];
            if (docs.length > 0) {
                const listText = docs.map(d => `• ${d.docTitle}`).join("\n");
                appendBubble({
                    role: "ASSISTANT",
                    senderLabel: "시스템 가이드",
                    content: `안녕하세요! 😊 현재 아래 규정들에 대해 질문하실 수 있습니다.\n\n${listText}\n\n무엇이 궁금하신가요?`
                });
            }
        } catch (e) { console.error("가이드 로드 실패:", e); }
    }

    async function sendQuestion() {
        const input = document.getElementById("messageInput");
        const question = input.value.trim();
        if (!question) return;

        appendBubble({ role: "USER", content: question });
        input.value = "";
        input.style.height = "auto";

        try {
            const res = await fetch("/api/v1/chatbot/messages", {
                method: "POST",
                headers: authHeaders(),
                body: JSON.stringify({ question })
            });
            const raw = await res.json();
            if(raw.data?.assistantMessageId) {
                // 답변을 위한 빈 버블 미리 생성
                appendBubble({role:"ASSISTANT", messageId:raw.data.assistantMessageId, content:""});
            }
        } catch (e) { console.error("전송 오류:", e); }
    }

    let es = null;
    function connectSse() {
        const sId = getSessionId();
        es = new EventSource(`/api/v1/chatbot/stream?sessionId=${sId}`, { withCredentials: true });

        es.addEventListener("connected", () => {
            document.getElementById("statusText").innerText = "온라인";
            document.getElementById("connDot").classList.add("on");
        });

        es.addEventListener("chunk", (e) => {
            const data = JSON.parse(e.data);
            const ref = msgDomMap.get(data.messageId);
            if(ref) {
                ref.bubbleEl.innerText += data.delta;
                const msgsContainer = document.getElementById("messages");
                msgsContainer.scrollTop = msgsContainer.scrollHeight;
            }
        });

        es.addEventListener("done", (e) => {
            const data = JSON.parse(e.data);
            const ref = msgDomMap.get(data.messageId);
            if(ref) ref.timeEl.innerText = nowTime();
        });
    }

    window.addEventListener("load", () => {
        connectSse();
        showDocumentGuide();

        const input = document.getElementById("messageInput");

        // 자동 높이 조절 및 바이트 체크
        input.addEventListener("input", function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            document.getElementById("byteInfo").innerText = `${new TextEncoder().encode(this.value).length} / 61440 bytes`;
        });

        // [수정된 부분] 한글 입력 중복 방지 로직 (e.isComposing)
        input.addEventListener("keydown", e => {
            // 한글 조합 중일 때는 엔터 이벤트를 무시하여 중복 전송 방지
            if (e.isComposing) return;

            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuestion();
            }
        });
    });
</script>
</body>
</html>
