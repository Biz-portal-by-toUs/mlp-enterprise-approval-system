apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizportal-api
  namespace: bizportal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bizportal-api
  template:
    metadata:
      labels:
        app: bizportal-api
    spec:
      containers:
        - name: api
          image: 118320467932.dkr.ecr.us-west-1.amazonaws.com/terraform-ecr:6
          imagePullPolicy: Always
          ports:
            - containerPort: 8090

          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: bizportal-config
                  key: SPRING_PROFILES_ACTIVE

            # ✅ RDS (기존 local 변수명 그대로)
            - name: DB_PROD_URL
              valueFrom:
                secretKeyRef:
                  name: bizportal-secrets
                  key: DB_PROD_URL
            - name: DB_PROD_USER
              valueFrom:
                secretKeyRef:
                  name: bizportal-secrets
                  key: DB_PROD_USER
            - name: DB_PROD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bizportal-secrets
                  key: DB_PROD_PASSWORD

            # ✅ Mongo/Redis/ES/Weaviate: localhost → 클러스터 DNS
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: bizportal-config
                  key: MONGODB_URI

            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: bizportal-config
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: bizportal-config
                  key: REDIS_PORT

            # 너희 yml이 app.elasticsearch.host 라서 env로 덮을 수 있게 별도 키를 하나 더 주입
            - name: APP_ELASTICSEARCH_HOST
              valueFrom:
                configMapKeyRef:
                  name: bizportal-config
                  key: ELASTIC_HOST

            # Weaviate도 동일하게 앱에서 읽는 키에 맞춰야 함(아래는 예시)
            - name: WEAVIATE_URL
              valueFrom:
                configMapKeyRef:
                  name: bizportal-config
                  key: WEAVIATE_URL

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bizportal-api-svc
  namespace: bizportal
spec:
  selector:
    app: bizportal-api
  ports:
    - name: http
      port: 80
      targetPort: 8090
  type: ClusterIP