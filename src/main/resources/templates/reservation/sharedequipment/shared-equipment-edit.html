<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>공유 설비 수정</title>

    <!-- 이 페이지 전용 CSS -->
    <th:block layout:fragment="pageStyles">
        <style>
            .shared-eq-edit-page {
                padding: 24px 26px;
                background: #f4f6f8;
                min-height: 100%;
                display: flex;
                justify-content: center;
                align-items: flex-start;
            }

            .shared-eq-edit-page .card {
                width: 520px;
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.12);
                padding: 28px;
            }

            .shared-eq-edit-page .form-inner {
                max-width: 420px;
                margin: 0 auto;
            }

            .shared-eq-edit-page input,
            .shared-eq-edit-page textarea {
                width: 100%;
                box-sizing: border-box;
            }

            .shared-eq-edit-page .image-preview {
                width: 100%;
                height: 220px;
                background: #e5e7eb;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .shared-eq-edit-page .image-preview img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }

            .shared-eq-edit-page h2 {
                margin-top: 0;
                text-align: center;
            }

            .shared-eq-edit-page .field {
                margin-bottom: 14px;
            }

            .shared-eq-edit-page label {
                display: block;
                font-size: 13px;
                margin-bottom: 6px;
                color: #555;
            }

            .shared-eq-edit-page input,
            .shared-eq-edit-page textarea {
                width: 100%;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #ddd;
                font-size: 14px;
            }

            .shared-eq-edit-page textarea { resize: none; }

            .shared-eq-edit-page .btns {
                display: flex;
                gap: 10px;
                margin-top: 18px;
            }

            .shared-eq-edit-page button {
                flex: 1;
                padding: 10px;
                border-radius: 8px;
                border: none;
                font-size: 14px;
                cursor: pointer;
            }

            .shared-eq-edit-page .submit {
                background: #1677ff;
                color: #fff;
                cursor: pointer;
            }

            .shared-eq-edit-page .submit.disabled {
                background: #a5c8ff;
                cursor: not-allowed;
            }

            .shared-eq-edit-page .cancel {
                background: #e5e7eb;
            }

            .shared-eq-edit-page .preview-box {
                width: 100%;
                height: 220px;
                background: #e5e7eb;
                border-radius: 12px;
                overflow: hidden;
                margin-top: 10px;
            }

            .shared-eq-edit-page .preview-box img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: none;
            }

            /* ===== 설비명/설비번호만: 힌트/카운터/에러/UI ===== */
            .hint-row{
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-top:6px;
                gap:10px;
            }

            .hint{
                color:#6b7280;
                font-size:12px;
            }

            .counter{
                color:#6b7280;
                font-size:12px;
                font-variant-numeric: tabular-nums;
            }

            .error{
                display:block;
                margin-top:6px;
                color:#ef4444;
                font-size:12px;
                font-weight:600;
            }

            .input-invalid{
                border-color:#ef4444 !important;
                box-shadow: 0 0 0 3px rgba(239,68,68,.12);
            }

            /* ✅ SweetAlert가 다른 레이어보다 위에 뜨도록 */
            .swal2-container{
                z-index: 3000000 !important;
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <!-- 🔹 왼쪽: 예약 서브 사이드바 (공유 설비 예약 active) -->
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('equipment')"></aside>

        <!-- 🔹 오른쪽: 공유 설비 수정 화면 -->
        <div class="shared-eq-edit-page">
            <div class="card">
                <h2>공유 설비 수정</h2>

                <form id="editForm" enctype="multipart/form-data">

                    <div class="field">
                        <label>설비명</label>
                        <input type="text" name="eqName" id="eqName" maxlength="20" required>
                        <div class="hint-row">
                            <small class="hint">최대 20자까지 입력 가능</small>
                            <small class="counter" id="eqNameCounter">0 / 20</small>
                        </div>
                        <small class="error" id="eqNameError" style="display:none;"></small>
                    </div>

                    <div class="field">
                        <label>설비번호</label>
                        <input type="text" name="eqId" id="eqId" maxlength="20">
                        <div class="hint-row">
                            <small class="hint">최대 20자까지 입력 가능</small>
                            <small class="counter" id="eqIdCounter">0 / 20</small>
                        </div>
                        <small class="error" id="eqIdError" style="display:none;"></small>
                    </div>

                    <div class="field">
                        <label>모델명</label>
                        <input type="text" name="modelName" id="modelName" maxlength="20">
                    </div>

                    <div class="field">
                        <label>보관위치</label>
                        <input type="text" name="location" id="location" maxlength="50">
                    </div>

                    <div class="field">
                        <label>공유 설비 이미지</label>
                        <input type="file"
                               name="imageFile"
                               id="imageFile"
                               accept="image/*"
                               onchange="previewImage(this)">
                    </div>

                    <div class="preview-box">
                        <img id="imagePreview" alt="미리보기 이미지" />
                    </div>

                    <div class="btns">
                        <button type="submit" class="submit disabled" disabled>수정</button>
                        <button type="button" class="cancel" onclick="history.back()">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>

<!-- 이 페이지 전용 JS -->
<th:block layout:fragment="pageScripts">
    <!-- ✅ SweetAlert2 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script th:inline="javascript">
        /* =========================
           SweetAlert2 (회의실 수정과 동일)
           ========================= */
        const SWAL_PRIMARY = getComputedStyle(document.documentElement)
            .getPropertyValue("--primary")
            .trim() || "#4f8fe3";

        const SWAL_GRAY = "#9ca3af";
        const SWAL_RED  = "#ff4d4f";

        function swalAlert({ icon="info", title="알림", text="" }) {
            return Swal.fire({ icon, title, text, confirmButtonColor: SWAL_PRIMARY });
        }
        function swalSuccess(text, title="완료") { return swalAlert({ icon:"success", title, text }); }
        function swalError(text, title="오류") { return swalAlert({ icon:"error", title, text }); }
        function swalWarn(text, title="확인") { return swalAlert({ icon:"warning", title, text }); }

        async function swalConfirm({
                                       title="확인",
                                       text="진행할까요?",
                                       icon="question",
                                       confirmText="확인",
                                       cancelText="취소",
                                       confirmColor=SWAL_PRIMARY
                                   }){
            const result = await Swal.fire({
                title, text, icon,
                showCancelButton: true,
                confirmButtonText: confirmText,
                cancelButtonText: cancelText,
                confirmButtonColor: confirmColor,
                cancelButtonColor: SWAL_GRAY,
                reverseButtons: true
            });
            return result.isConfirmed;
        }

        function swalLoading(title="처리 중...", text="잠시만 기다려 주세요.") {
            return Swal.fire({
                title,
                text,
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
        }

        /* ================== 공통 변수 ================== */
        const eqNo = /*[[${eqNo}]]*/ null;
        const API_BASE = window.location.origin;

        async function apiFetch(path, options = {}) {
            const url = API_BASE + path;

            const res = await fetch(url, {
                ...options,
                credentials: "include",
                headers: { ...(options.headers || {}) }
            });

            if (res.status === 401 || res.status === 403) {
                await swalWarn("로그인이 만료되었습니다. 다시 로그인해 주세요.", "로그인 만료");
                location.href = "/auth/employee/login";
                throw new Error("UNAUTHORIZED");
            }
            return res;
        }

        if (!eqNo) {
            swalWarn("잘못된 접근입니다. 목록으로 이동합니다.").then(() => {
                location.href = "/shared-equipment";
            });
        }

        /* ================== 이미지 미리보기 ================== */
        function previewImage(input) {
            const preview = document.getElementById("imagePreview");

            if (!input.files || !input.files[0]) {
                preview.style.display = "none";
                preview.src = "";
                updateSubmitButton();
                return;
            }

            const file = input.files[0];

            if (!file.type.startsWith("image/")) {
                swalWarn("이미지 파일만 업로드 가능합니다.");
                input.value = "";
                preview.style.display = "none";
                preview.src = "";
                updateSubmitButton();
                return;
            }

            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);

            updateSubmitButton();
        }
        window.previewImage = previewImage;

        /* ================== 설비명/설비번호: 카운터/에러 UI ================== */
        const eqNameInput   = document.getElementById("eqName");
        const eqNameCounter = document.getElementById("eqNameCounter");
        const eqNameError   = document.getElementById("eqNameError");

        const eqIdInput   = document.getElementById("eqId");
        const eqIdCounter = document.getElementById("eqIdCounter");
        const eqIdError   = document.getElementById("eqIdError");

        const submitBtn = document.querySelector(".submit");

        function setError(inputEl, errorEl, msg) {
            if (!errorEl) return;

            if (msg) {
                errorEl.textContent = msg;
                errorEl.style.display = "block";
                inputEl?.classList.add("input-invalid");
            } else {
                errorEl.textContent = "";
                errorEl.style.display = "none";
                inputEl?.classList.remove("input-invalid");
            }
        }

        function updateEqNameUI() {
            const len = eqNameInput.value.length;
            if (eqNameCounter) eqNameCounter.textContent = `${len} / 20`;

            if (!eqNameInput.value.trim()) {
                setError(eqNameInput, eqNameError, "");
                return;
            }

            if (len > 20) setError(eqNameInput, eqNameError, "설비명은 20자 이내여야 합니다.");
            else setError(eqNameInput, eqNameError, "");
        }

        function updateEqIdUI() {
            const len = eqIdInput.value.length;
            if (eqIdCounter) eqIdCounter.textContent = `${len} / 20`;

            if (!eqIdInput.value.trim()) {
                setError(eqIdInput, eqIdError, "");
                return;
            }

            if (len > 20) setError(eqIdInput, eqIdError, "설비번호는 20자 이내여야 합니다.");
            else setError(eqIdInput, eqIdError, "");
        }

        eqNameInput?.addEventListener("input", () => {
            updateEqNameUI();
            updateSubmitButton();
        });

        eqIdInput?.addEventListener("input", () => {
            updateEqIdUI();
            updateSubmitButton();
        });

        /* ================== 유효성 검사 (인라인 에러 유지) ================== */
        function validateEditForm() {
            const name = eqNameInput.value.trim();
            const id   = eqIdInput.value.trim();

            updateEqNameUI();
            updateEqIdUI();

            if (!name) {
                setError(eqNameInput, eqNameError, "설비명을 입력해주세요.");
                eqNameInput.focus();
                return false;
            }
            if (name.length > 20) {
                setError(eqNameInput, eqNameError, "설비명은 20자 이내여야 합니다.");
                eqNameInput.focus();
                return false;
            }
            if (id.length > 20) {
                setError(eqIdInput, eqIdError, "설비번호는 20자 이내여야 합니다.");
                eqIdInput.focus();
                return false;
            }
            return true;
        }

        /* ================== 변경 감지(버튼 enable/disable) ================== */
        let originalData = null;

        function hasChanged() {
            if (!originalData) return false;

            const current = {
                eqName: eqNameInput.value.trim(),
                eqId: eqIdInput.value.trim(),
                modelName: document.querySelector("[name=modelName]").value.trim(),
                location: document.querySelector("[name=location]").value.trim(),
                imageChanged: document.querySelector("[name=imageFile]").files.length > 0
            };

            return (
                current.eqName !== originalData.eqName ||
                current.eqId !== originalData.eqId ||
                current.modelName !== originalData.modelName ||
                current.location !== originalData.location ||
                current.imageChanged
            );
        }

        function updateSubmitButton() {
            if (!submitBtn) return;

            if (hasChanged()) {
                submitBtn.disabled = false;
                submitBtn.classList.remove("disabled");
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add("disabled");
            }
        }

        document
            .querySelectorAll("input[name=modelName], input[name=location]")
            .forEach(el => el.addEventListener("input", updateSubmitButton));

        document
            .querySelector("[name=imageFile]")
            ?.addEventListener("change", updateSubmitButton);

        /* ================== 페이지 로드시 데이터 조회 ================== */
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                swalLoading("불러오는 중...", "공유 설비 정보를 불러오고 있어요.");

                const res = await apiFetch(`/api/v1/shared-equipment/${eqNo}`, { method: "GET" });

                if (!res.ok) {
                    Swal.close();
                    await swalError("공유 설비 정보를 불러오지 못했습니다.", "조회 실패");
                    return;
                }

                const json = await res.json();
                const eq = json?.data ?? json;

                eqNameInput.value = eq.eqName ?? "";
                eqIdInput.value   = eq.eqId ?? "";
                document.querySelector("[name=modelName]").value = eq.modelName ?? "";
                document.querySelector("[name=location]").value  = eq.location ?? "";

                originalData = {
                    eqName: (eq.eqName ?? "").trim(),
                    eqId: (eq.eqId ?? "").trim(),
                    modelName: (eq.modelName ?? "").trim(),
                    location: (eq.location ?? "").trim()
                };

                if (eq.imageUrl) {
                    const preview = document.getElementById("imagePreview");
                    preview.src = eq.imageUrl;
                    preview.style.display = "block";
                }

                Swal.close();

                // 초기 UI 동기화
                updateEqNameUI();
                updateEqIdUI();
                updateSubmitButton();

            } catch (e) {
                Swal.close();
                if (String(e?.message || "").includes("UNAUTHORIZED")) return;
                console.error(e);
                await swalError("서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.", "오류");
            }
        });

        /* ================== 수정 submit ================== */
        document.getElementById("editForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!validateEditForm()) return;

            if (!hasChanged()) {
                await swalWarn("변경된 내용이 없습니다.");
                return;
            }

            const ok = await swalConfirm({
                title: "공유 설비 수정",
                text: "공유 설비 정보를 수정하시겠습니까?",
                icon: "question",
                confirmText: "수정",
                cancelText: "닫기",
                confirmColor: SWAL_PRIMARY
            });
            if (!ok) return;

            try {
                swalLoading("수정 중...", "공유 설비 정보를 수정하고 있습니다.");

                const formData = new FormData(e.target);

                const res = await apiFetch(`/api/v1/shared-equipment/${eqNo}`, {
                    method: "PUT",
                    body: formData
                });

                if (!res.ok) {
                    Swal.close();

                    let msg = "공유 설비 수정에 실패했습니다.";
                    try {
                        const ct = res.headers.get("content-type") || "";
                        if (ct.includes("application/json")) {
                            const payload = await res.json();
                            msg = payload?.message || msg;
                        } else {
                            const t = await res.text();
                            if (t) msg = t;
                        }
                    } catch {}

                    await swalError(msg, "수정 실패");
                    return;
                }

                Swal.close();
                await Swal.fire({
                    icon: "success",
                    title: "수정 완료",
                    text: "공유 설비 정보가 수정되었습니다.",
                    timer: 1200,
                    showConfirmButton: false,
                    confirmButtonColor: SWAL_PRIMARY
                });

                location.href = "/shared-equipment";

            } catch (e2) {
                Swal.close();
                if (String(e2?.message || "").includes("UNAUTHORIZED")) return;
                console.error(e2);
                await swalError("서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.", "오류");
            }
        });
    </script>
</th:block>

</body>
</html>
