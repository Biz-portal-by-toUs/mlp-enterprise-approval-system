<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>내 출장 조회 - 기업용 전자결재시스템</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* ✅ 여백 및 컨테이너 최적화 (다른 페이지들과 통일) */
            .detail-content-area {
                background: white;
                padding: 40px;
                min-height: 850px;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            }

            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 30px;
                border-bottom: 2px solid #339af0;
                padding-bottom: 15px;
            }

            .page-title { font-size: 24px; font-weight: bold; color: #333; margin: 0; }

            .btn-close {
                padding: 10px 24px; background: #fff; color: #495057;
                border: 1px solid #dee2e6; border-radius: 6px; cursor: pointer; font-size: 14px;
                transition: all 0.2s;
            }
            .btn-close:hover { background: #f8f9fa; border-color: #adb5bd; }

            /* 테이블 스타일 */
            .doc-table { width: 100%; border-collapse: collapse; table-layout: auto; }
            .doc-table th { background-color: #f8f9fa; color: #495057; font-size: 14px; padding: 15px 12px; border-bottom: 1px solid #dee2e6; white-space: nowrap; }
            .doc-table td { padding: 15px 12px; text-align: center; border-bottom: 1px solid #eee; font-size: 14px; color: #333; vertical-align: middle; line-height: 1.4; }

            /* 배지 및 버튼 */
            .doc-badge { display: inline-block !important; padding: 4px 10px !important; border-radius: 4px !important; font-size: 12px !important; font-weight: bold !important; position: static !important; border: none !important; }
            .doc-badge-trip { background: #e7f5ff !important; color: #228be6 !important; }

            /* ✅ 아이콘을 제거하고 심플하게 변경된 버튼 스타일 */
            .btn-view {
                padding: 8px 16px;
                background: #339af0;
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
                text-align: center;
            }
            .btn-view:hover { background: #228be6; }

            .loading, .no-data { text-align: center; padding: 100px; color: #868e96; font-size: 16px; }

            /* ✅ 레이아웃 상속 시 콘텐츠 영역 배경 및 패딩 정의 */
            .page-with-subbar > div:last-child { background: #f6f7fb; padding: 22px 26px; }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <section class="page-with-subbar">
        <aside th:replace="~{sidebar/attendance-sidebar :: attendanceSidebar('business-trips')}"></aside>

        <div>
            <div id="trip-container" class="detail-content-area">
                <div class="page-header">
                    <h1 class="page-title">내 출장 관리</h1>
                </div>

                <div id="loading" class="loading">출장 정보를 불러오는 중...</div>

                <table class="doc-table" id="attendance-table" style="display: none;">
                    <thead>
                    <tr>
                        <th style="width: 50px;">NO</th>
                        <th style="width: 80px;">타입</th>
                        <th style="width: 140px;">시작일</th>
                        <th style="width: 140px;">종료일</th>
                        <th style="width: 60px;">일수</th>
                        <th style="width: 120px;">대직자</th>
                        <th style="width: 130px;">문서번호</th>
                        <th>문서제목</th>
                        <th style="width: 90px;">문서보기</th>
                    </tr>
                    </thead>
                    <tbody id="attendance-list"></tbody>
                </table>

                <div id="no-data" class="no-data" style="display: none;">출장 정보가 없습니다.</div>
            </div>
        </div>
    </section>
</div>

<th:block layout:fragment="pageScripts">
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            loadMyBusinessTrips();
        });

        async function loadMyBusinessTrips() {
            try {
                const response = await fetch('/api/v1/attendances/me/business-trips', {
                    credentials: 'include'
                });

                const result = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (result.status === 200 && result.data && result.data.length > 0) {
                    renderAttendances(result.data);
                    document.getElementById('attendance-table').style.display = 'table';
                } else {
                    document.getElementById('no-data').style.display = 'block';
                }
            } catch (error) {
                console.error('출장 조회 실패:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('no-data').style.display = 'block';
            }
        }

        function renderAttendances(attendances) {
            const tbody = document.getElementById('attendance-list');
            tbody.innerHTML = '';

            attendances.forEach((att, index) => {
                const no = index + 1;
                const tr = document.createElement('tr');

                tr.innerHTML = `
                    <td>${no}</td>
                    <td><span class="doc-badge doc-badge-trip">출장</span></td>
                    <td>${formatDate(att.startAt)}</td>
                    <td>${formatDate(att.endAt)}</td>
                    <td>${att.day}일</td>
                    <td>${att.delegateEmpName ? `${att.delegateEmpName}<br><small>${att.delegateEmpId}</small>` : '-'}</td>
                    <td>${att.docId || '-'}</td>
                    <td style="text-align: left;">${att.docTitle || '-'}</td>
                    <td>
                        ${att.docNo ? `<button class="btn-view" onclick="viewDocument(${att.docNo})">보기</button>` : '-'}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // 10줄 고정 디자인을 위한 빈 행 추가
            for (let i = attendances.length; i < 10; i++) {
                tbody.innerHTML += '<tr style="height: 57px;"><td colspan="9"></td></tr>';
            }
        }

        function viewDocument(docNo) {
            location.href = `/documents/${docNo}?status=SUBMITTED`;
        }

        function formatDate(str) {
            if (!str) return '-';
            const d = new Date(str);
            return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}<br><small>${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}</small>`;
        }
    </script>
</th:block>
</body>
</html>
