                    empId: selectedDelegate.empId,
                    empName: selectedDelegate.empName,
                    posName: selectedDelegate.posName,
                    depName: selectedDelegate.depName
                };
            }
        }

        try {
            const payload = {
                comId: myInfo.comId,
                writerId: myInfo.empId,
                docfoNo: currentDocfoNo,
                docfoCatNo: parseInt(checkedRadio.value, 10),
                title: title,
                content: JSON.stringify(contentJson),
                cnttHtml: contentHtml,
                temp: isTemp,
                aiSumm: includeAiSummary ? aiSummText : "",
                approvalLines: selectedApprovers.map((a, i) => ({
                    approverId: a.approverId,
                    seq: i + 1,
                    apprStat: isTemp ? "W" : (i === 0 ? "I" : "W")
                }))
            };

            const response = await fetch(`/api/v1/documents/${originalDocNo}/resubmit`, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const result = await response.json();
                const newDocNo = result.data?.docNo || result.data;

                // ✅ 2. 병렬 처리 태스크 생성
                const uploadTasks = [];

                const activeExistingFiles = existingFiles.filter(file =>
                    !filesToDelete.includes(file.attachmentId)
                );

                if (activeExistingFiles.length > 0) {
                    uploadTasks.push(copyExistingFiles(activeExistingFiles, newDocNo));
                }

                if (newFiles.length > 0) {
                    uploadTasks.push(uploadFiles(newDocNo));
                }

                if ((normalized === '휴가신청' || normalized === '휴가수정신청') && selectedDelegate && newDocNo) {
                    uploadTasks.push(registerDelegate(newDocNo, selectedDelegate.empId));
                }

                // 모든 태스크 완료 대기
                await Promise.all(uploadTasks);

                Swal.close();
                const successMessage = isTemp ? "임시 저장되었습니다." : "문서가 재상신되었습니다.";
                const targetUrl = isTemp ? "/documents/me?status=UNSUBMITTED" : "/documents/me?status=SUBMITTED";

                Swal.fire({
                    icon: 'success',
                    title: '완료',
                    text: successMessage,
                    confirmButtonColor: '#339af0'
                }).then(() => {
                    location.href = targetUrl;
                });
            } else {
                throw new Error('문서 저장 실패');
            }
        } catch (e) {
            Swal.close();
            Swal.fire({
                icon: 'error',
                title: '오류 발생',
                text: e.message || '처리 중 문제가 발생했습니다.',
                confirmButtonColor: '#339af0'
            });
        }
    }

    async function registerDelegate(docNo, delegateEmpId) {
        try {
            const response = await fetch('/api/v1/delegates', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ docNo: docNo, delegateEmpId: delegateEmpId })
            });
            if (response.ok) {
                console.log('✅ 대직자 등록 성공');
            }
        } catch (e) {
            console.warn('⚠️ 대직자 등록 실패:', e);
        }
    }

    // ✅ 기존 파일 복사 병렬 처리 수정
    async function copyExistingFiles(files, newDocNo) {
        const tasks = files.map(async (file) => {
            try {
                const fileId = file.attachmentId;
                if (!fileId) return;

                const downloadUrlRes = await fetch(`/api/v1/attachments/${fileId}/download-url`, {
                    credentials: 'include'
                });
                if (!downloadUrlRes.ok) return;

                const downloadUrlData = await downloadUrlRes.json();
                const downloadUrl = downloadUrlData.data.url;

                const downloadRes = await fetch(downloadUrl);
                if (!downloadRes.ok) return;

                const blob = await downloadRes.blob();

                const presignRes = await fetch('/api/v1/attachments/presign', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        domain: 'APPROVAL',
                        entityId: newDocNo,
                        fileType: file.fileType,
                        originalName: file.originalName,
                        contentType: file.contentType,
                        size: file.size
                    })
                });
                if (!presignRes.ok) return;

                const presignData = await presignRes.json();
                const { objectKey, uploadUrl } = presignData.data;

                const uploadRes = await fetch(uploadUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': file.contentType },
                    body: blob
                });
                if (!uploadRes.ok) return;

                const etag = uploadRes.headers.get('ETag');

                await fetch('/api/v1/attachments/complete', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        domain: 'APPROVAL',
                        entityId: newDocNo,
                        fileType: file.fileType,
                        objectKey: objectKey,
                        originalName: file.originalName,
                        contentType: file.contentType,
                        size: file.size,
                        etag: etag ? etag.replace(/"/g, '') : null
                    })
                });
            } catch (e) {
                console.error('파일 복사 오류:', e);
                throw e;
            }
        });
        await Promise.all(tasks);
    }

    // ✅ 신규 파일 업로드 병렬 처리 수정
    async function uploadFiles(docNo) {
        const tasks = newFiles.map(async (file) => {
            try {
                const presignRes = await fetch('/api/v1/attachments/presign', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        domain: 'APPROVAL',
                        entityId: docNo,
                        fileType: getFileType(file.type),
                        originalName: file.name,
                        contentType: file.type,
                        size: file.size
                    })
                });
                if (!presignRes.ok) return;

                const presignData = await presignRes.json();
                const { objectKey, uploadUrl } = presignData.data;

                const uploadRes = await fetch(uploadUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': file.type },
                    body: file
                });
                if (!uploadRes.ok) return;

                const etag = uploadRes.headers.get('ETag');

                await fetch('/api/v1/attachments/complete', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        domain: 'APPROVAL',
                        entityId: docNo,
                        fileType: getFileType(file.type),
                        objectKey: objectKey,
                        originalName: file.name,
                        contentType: file.type,
                        size: file.size,
                        etag: etag ? etag.replace(/"/g, '') : null
                    })
                });
            } catch (e) {
                console.error('파일 업로드 오류:', e);
                throw e;
            }
        });
        await Promise.all(tasks);
    }

    async function fetchMyEmployeeInfo() {
        try {
            const response = await fetch('/api/v1/employees/me', { credentials: 'include' });
            const result = await response.json();

            if (response.ok && result.data) {
                myInfo = {
                    empId: result.data.empId,
                    comId: result.data.comId || "C01",
                    posOrder: result.data.position?.posOrder || 999
                };

                document.getElementById('writer-name').value = result.data.empName;
                document.getElementById('writer-dept').value = result.data.department?.depName || "총무팀";
                document.getElementById('writer-phone').value = result.data.workPhone || "-";
            }
        } catch (e) {
            console.error('❌ 내 정보 로드 실패:', e);
        }
    }

    async function searchEmployees(keyword = '') {
        try {
            let url = `/api/v1/employees?size=20&excludeMe=true`;
            if (keyword && keyword.trim().length > 0) url += `&keyword=${encodeURIComponent(keyword.trim())}`;
            const res = await fetch(url, { credentials: 'include' });
            const result = await res.json();
            renderSearchResults(result.data?.items || []);
        } catch (e) { renderSearchResults([]); }
    }

    function initApproverSearch() {
        const searchInput = document.getElementById('approver-search');
        const searchResults = document.getElementById('search-results');

        searchInput.addEventListener('input', (e) => {
            if (e.target.value.length > 20) {
                e.target.value = e.target.value.substring(0, 20);
            }
            if (searchTimeout) clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => searchEmployees(e.target.value), 300);
        });

        searchInput.addEventListener('focus', () => searchEmployees(searchInput.value));
        document.addEventListener('click', (e) => {
            if (!document.querySelector('.search-container').contains(e.target)) {
                searchResults.innerHTML = '<div style="padding: 20px; text-align: center; color: #adb5bd; font-size: 12px;">검색창을 클릭하면 전체 사원이 조회됩니다.</div>';
            }
        });
    }

    function initDelegateSearch() {
        const searchInput = document.getElementById('delegate-search');
        const searchResults = document.getElementById('delegate-search-results');

        searchInput.addEventListener('focus', () => {
            searchDelegates(searchInput.value);
            searchResults.classList.add('show');
        });

        searchInput.addEventListener('input', (e) => {
            if (delegateSearchTimeout) clearTimeout(delegateSearchTimeout);
            delegateSearchTimeout = setTimeout(() => {
                searchDelegates(e.target.value);
                searchResults.classList.add('show');
            }, 300);
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.delegate-search-wrapper')) {
                searchResults.classList.remove('show');
            }
        });
    }

    async function searchDelegates(keyword = '') {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;

        if (!startDate || !endDate) return;

        try {
            const startAt = startDate + 'T00:00:00';
            const endAt = endDate + 'T23:59:59';

            const url = `/api/v1/delegates/available?startAt=${startAt}&endAt=${endAt}`;
            const res = await fetch(url, { credentials: 'include' });
            const result = await res.json();

            let employees = result.data || [];

            if (keyword && keyword.trim().length > 0) {
                const k = keyword.toLowerCase();
                employees = employees.filter(emp =>
                    emp.empName.toLowerCase().includes(k) ||
                    emp.empId.toLowerCase().includes(k)
                );
            }

            renderDelegateResults(employees);
        } catch (e) {
            console.error('대직자 조회 실패:', e);
            renderDelegateResults([]);
        }
    }

    function renderDelegateResults(employees) {
        const container = document.getElementById('delegate-search-results');

        if (employees.length === 0) {
            container.innerHTML = '<div class="delegate-result-item" style="color: #adb5bd; cursor: default;">조회된 대직자가 없습니다.</div>';
            return;
        }

        container.innerHTML = employees.map(emp => {
            const isSelected = selectedDelegate && selectedDelegate.empId === emp.empId;
            const isAvailable = emp.available !== false;
            const statusMessage = emp.statusMessage || "휴가";
            const isDisabled = isSelected || !isAvailable;

            let statusHtml = '';
            if (isSelected) {
                statusHtml = '<span style="float: right; color: #40c057;">✓ 선택됨</span>';
            } else if (!isAvailable) {
                statusHtml = `<span style="float: right; color: #fa5252; font-size: 11px;">${statusMessage}</span>`;
            }

            return `
            <div class="delegate-result-item"
                 onclick="${isDisabled ? '' : `selectDelegate('${emp.empId}', '${emp.empName}', '${emp.posName || '사원'}', '${emp.depName || ''}', ${emp.posOrder})`}"
                 style="${isDisabled ? 'opacity: 0.5; cursor: not-allowed; background: #f8f9fa;' : ''}">
                <strong>${emp.empName}</strong> | ${emp.posName || '사원'}
                <br><small style="color: #868e96;">${emp.depName || '-'} | ${emp.empId}</small>
                ${statusHtml}
            </div>
        `;
        }).join('');
    }

    function selectDelegate(empId, empName, posName, depName, posOrder) {
        selectedDelegate = {
            empId: empId,
            empName: empName,
            posName: posName,
            depName: depName,
            posOrder: posOrder
        };

        renderSelectedDelegate();
        updateTableDelegate();

        document.getElementById('delegate-search').value = '';
        document.getElementById('delegate-search-results').classList.remove('show');
    }

    function renderSelectedDelegate() {
        const container = document.getElementById('selected-delegate-display');
        const section = document.getElementById('selected-delegate-section');

        if (!selectedDelegate) {
            container.innerHTML = '';
            section.style.display = 'none';
            return;
        }

        section.style.display = 'flex';
        container.innerHTML = `
            <div class="selected-delegate">
                <span class="delegate-icon">👤</span>
                <div class="delegate-info">
                    <span class="delegate-name">${selectedDelegate.empName} | ${selectedDelegate.posName}</span>
                    <span class="delegate-detail">${selectedDelegate.depName} | ${selectedDelegate.empId}</span>
                </div>
                <span class="delegate-remove" onclick="removeDelegate()">×</span>
            </div>
        `;
    }

    function removeDelegate() {
        selectedDelegate = null;
        renderSelectedDelegate();
        updateTableDelegate();
    }

    function renderSearchResults(employees) {
        const container = document.getElementById('search-results');
        if (employees.length === 0) {
            container.innerHTML = '<div style="padding:20px; text-align:center; font-size:12px; color:#adb5bd;">검색 결과 없음</div>';
            return;
        }

        const highestSelectedPosOrder = selectedApprovers.length > 0
            ? Math.min(...selectedApprovers.map(a => a.posOrder))
            : Infinity;

        container.innerHTML = employees.map(emp => {
            const isAdded = selectedApprovers.some(a => a.approverId === emp.empId);
            const isSameOrLowerRank = emp.posOrder >= myInfo.posOrder;
            const hasSameRank = selectedApprovers.some(a => a.posOrder === emp.posOrder);
            const isLowerThanSelected = emp.posOrder > highestSelectedPosOrder;
            const isDisabled = isAdded || isSameOrLowerRank || hasSameRank || isLowerThanSelected;

            let delegateHtml = '';
            if (emp.delegateName) {
                const isMe = emp.delegateId === myInfo.empId;
                const color = isMe ? '#339af0' : '#868e96';
                delegateHtml = `<span style="color: ${color}; font-weight: ${isMe ? 'bold' : 'normal'}; font-size: 11px; margin-left: 8px;">
                    (대직자: ${isMe ? '본인' : emp.delegateName})
                </span>`;
            }

            let statusText = isAdded ? '추가됨' : (isSameOrLowerRank ? '직급낮음' : (hasSameRank ? '중복직급' : (isLowerThanSelected ? '순서오류' : '+')));
            let statusColor = isAdded ? '#adb5bd' : (isDisabled ? '#fa5252' : 'var(--primary-color)');

            return `
                <div class="result-item"
                     onclick="${isDisabled ? '' : `checkAndAddApprover('${emp.empId}', '${emp.empName}', '${emp.posName || '사원'}', '${emp.depName || ''}', ${emp.posOrder}, '${emp.delegateId || ''}')`}"
                     style="${isDisabled ? 'opacity:0.5; cursor:not-allowed; background:#f8f9fa;' : ''}">
                    <div>
                        <strong>${emp.empName}</strong> <span>| ${emp.posName || '사원'}</span>
                        ${delegateHtml}
                        <br><small>${emp.depName || '-'} | ${emp.empId}</small>
                    </div>
                    <div style="color:${statusColor}; font-weight:bold; font-size:${statusText === '+' ? '20px' : '11px'};">${statusText}</div>
                </div>`;
        }).join('');
    }

    function checkAndAddApprover(id, name, pos, dept, posOrder, delegateId) {
        if (delegateId === myInfo.empId) {
            Swal.fire({
                title: '대직자 확인',
                html: `선택하신 <b>${name} ${pos}</b>님의 현재 대직자는 <b style="color:#339af0;">본인</b>입니다.<br>정말 결재자로 지정하시겠습니까?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#339af0',
                cancelButtonColor: '#adb5bd',
                confirmButtonText: '네, 지정합니다',
                cancelButtonText: '취소',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    addApprover(id, name, pos, dept, posOrder);
                }
            });
        } else {
            addApprover(id, name, pos, dept, posOrder);
        }
    }

    function addApprover(id, name, pos, dept, posOrder) {
        if (selectedApprovers.some(a => a.approverId === id)) return;
        if (selectedApprovers.length >= 5) {
            return Swal.fire({
                icon: 'warning',
                title: '최대 인원 초과',
                text: '결재선은 최대 5명까지만 지정할 수 있습니다.',
                confirmButtonColor: '#339af0'
            });
        }
        if (posOrder >= myInfo.posOrder) {
            Swal.fire({
                icon: 'warning',
                title: '직급 제한',
                text: '자신보다 높은 직급만 결재선으로 지정할 수 있습니다.',
                confirmButtonColor: '#339af0'
            });
            return;
        }
        if (selectedApprovers.some(a => a.posOrder === posOrder)) {
            Swal.fire({
                icon: 'warning',
                title: '중복 직급',
                text: '같은 직급은 1명만 결재선으로 지정할 수 있습니다.',
                confirmButtonColor: '#339af0'
            });
            return;
        }
        if (selectedApprovers.length > 0) {
            const highestSelectedPosOrder = Math.min(...selectedApprovers.map(a => a.posOrder));
            if (posOrder > highestSelectedPosOrder) {
                const highestRankName = selectedApprovers.find(a => a.posOrder === highestSelectedPosOrder).posName;
                Swal.fire({
                    icon: 'warning',
                    title: '직급 순서 오류',
                    text: `현재 선택된 가장 높은 직급(${highestRankName})보다\n낮은 직급은 추가할 수 없습니다.\n\n선택하려는 직급: ${pos}`,
                    confirmButtonColor: '#339af0'
                });
                return;
            }
        }

        selectedApprovers.push({
            approverId: id,
            approverName: name,
            posName: pos || '사원',
            depName: dept,
            posOrder: posOrder
        });

        renderSelectedTags();
        document.getElementById('approver-search').value = '';

        const currentResults = Array.from(document.getElementById('search-results').children);
        if (currentResults.length > 0 && !currentResults[0].innerText.includes('검색창을 클릭')) {
            searchEmployees(document.getElementById('approver-search').value);
        } else {
            document.getElementById('search-results').innerHTML = '<div style="padding: 20px; text-align: center; color: #adb5bd; font-size: 12px;">검색창을 클릭하면 전체 사원이 조회됩니다.</div>';
        }
    }

    function renderSelectedTags() {
        const container = document.getElementById('selected-list');
        if (selectedApprovers.length === 0) {
            container.innerHTML = '<span style="color: #adb5bd; font-size: 12px;">지정된 결재자가 없습니다.</span>';
            return;
        }
        container.innerHTML = selectedApprovers.map((a, i) => `
            <span class="approver-tag">
                <span class="seq-badge">${i + 1}</span>
                <span class="info">
                    <span class="name-pos">${a.approverName} | ${a.posName}</span>
                    <span class="dept-id">${a.depName} | ${a.approverId}</span>
                </span>
                <span class="remove-btn" onclick="event.stopPropagation(); removeApprover('${a.approverId}')">×</span>
            </span>`).join('');
    }

    function removeApprover(id) {
        selectedApprovers = selectedApprovers.filter(a => a.approverId !== id);
        renderSelectedTags();
        const currentResults = Array.from(document.getElementById('search-results').children);
        if (currentResults.length > 0 && !currentResults[0].innerText.includes('검색창을 클릭')) {
            searchEmployees(document.getElementById('approver-search').value);
        }
    }
</script>
