<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>Chat Main</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #ddd;
            background: #fff;
            flex-shrink: 0;
        }

        .tab {
            padding: 12px 14px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .tab.active {
            font-weight: 700;
            border-bottom: 2px solid #007bff;
            color: #007bff;
        }

        .content {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid #eee;
            align-items: center;
            flex-shrink: 0;
        }

        .toolbar input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .toolbar button {
            padding: 10px 12px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .list {
            flex: 1;
            overflow-y: auto;
        }

        .row {
            padding: 14px 12px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .row:hover {
            background: #fafafa;
        }

        .row-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .room-info {
            flex: 1;
            min-width: 0;
        }

        .row .title {
            font-weight: 700;
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 4px;
        }

        .row .sub {
            font-size: 13px;
            color: #666;
            display: flex;
            min-width: 0;
        }

        .last-msg-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
            width: 100%;
        }

        .room-meta {
            margin-left: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            flex-shrink: 0;
            min-width: 70px; /* 날짜 포맷이 길어질 수 있어 약간 넓힘 */
        }

        .last-msg-time {
            font-size: 11px;
            color: #999;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        .badge {
            background: #ff3b30;
            color: #fff;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
        }

        .hint {
            padding: 10px 12px;
            font-size: 12px;
            color: #777;
            border-bottom: 1px solid #f7f7f7;
            background: #fafafa;
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        .status-online { background-color: #28a745; border: 1px solid #28a745; }
        .status-offline { background-color: transparent; border: 1px solid #ccc; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<div class="app">
    <div class="tabs">
        <div class="tab active" id="tabEmployees" onclick="switchTab('employees')">사원 목록</div>
        <div class="tab" id="tabChats" onclick="switchTab('chats')">채팅 목록</div>
    </div>

    <div class="content">
        <div class="panel" id="employeesPanel">
            <div id="myProfile" style="padding: 14px; background: #f8f9fa; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px;">
                <div style="width: 42px; height: 42px; background: #007bff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px;">👤</div>
                <div style="flex: 1;">
                    <div id="myName" style="font-weight: 700; font-size: 15px; color: #333;">로딩 중...</div>
                    <div id="myDept" style="font-size: 12px; color: #777;">부서 정보 로딩 중</div>
                </div>
                <div style="font-size: 11px; color: #007bff; border: 1px solid #007bff; padding: 2px 6px; border-radius: 4px;">나</div>
            </div>
            <div class="toolbar">
                <input id="empKeyword" placeholder="이름/ID/부서 검색..." oninput="onEmpSearchInput()"/>
            </div>
            <div class="hint">💡 사원 더블클릭: 1:1 채팅 시작</div>
            <div class="list" id="empList"></div>
        </div>

        <div class="panel" id="chatsPanel" style="display:none;">
            <div class="toolbar">
                <input id="roomKeyword" placeholder="방 이름 또는 메시지 검색..." oninput="onRoomSearchInput()"/>
                <button onclick="openCreateRoom()">방 만들기</button>
            </div>
            <div class="hint">💡 채팅방 클릭: 대화창 열기</div>
            <div class="list" id="roomList"></div>
        </div>
    </div>
</div>

<script>
    // ---------------- 공통 유틸 ----------------
    function getAccessToken() { return localStorage.getItem("accessToken"); }
    function authHeaders() { return {'Authorization': 'Bearer ' + getAccessToken()}; }
    function escapeHtml(str) {
        return String(str ?? "").replace(/[&<>"']/g, s => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
        }[s]));
    }

    // ✅ 오늘 날짜가 아니면 "M월 D일" 형식으로 반환하도록 수정
    function formatTime(dateStr) {
        if (!dateStr) return "";
        const date = new Date(dateStr);
        const now = new Date();
        const isToday = date.toDateString() === now.toDateString();

        if (isToday) {
            return date.getHours().toString().padStart(2, '0') + ":" +
                date.getMinutes().toString().padStart(2, '0');
        } else {
            // "10월 20일" 형식
            return (date.getMonth() + 1) + "월 " + date.getDate() + "일";
        }
    }

    // ---------------- 웹소켓 ----------------
    let stompClient = null;
    let wsInitialized = false;

    function connectWs() {
        if (wsInitialized) return;
        const token = getAccessToken();
        if (!token) return;
        const socket = new SockJS('/ws-chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({Authorization: 'Bearer ' + token}, function () {
            wsInitialized = true;
            stompClient.subscribe('/user/sub/chat/room-updates', function (message) {
                handleRealtimeUpdate(JSON.parse(message.body));
            });
        }, function (err) {
            wsInitialized = false;
            setTimeout(connectWs, 5000);
        });
    }

    // ---------------- 탭 전환 ----------------
    function switchTab(tab) {
        document.getElementById("tabEmployees").classList.toggle("active", tab === "employees");
        document.getElementById("tabChats").classList.toggle("active", tab === "chats");
        document.getElementById("employeesPanel").style.display = tab === "employees" ? "flex" : "none";
        document.getElementById("chatsPanel").style.display = tab === "chats" ? "flex" : "none";
        if (tab === "employees") initEmployees();
        else initRooms();
    }

    // ---------------- 사원 목록 ----------------
    let empCursor = null, empHasNext = true, empLoading = false, empKwTimer = null;
    async function initEmployees() { resetEmployees(); await loadMoreEmployees(); }
    function resetEmployees() { empCursor = null; empHasNext = true; document.getElementById("empList").innerHTML = ""; }
    async function loadMoreEmployees() {
        if (empLoading || !empHasNext) return;
        empLoading = true;
        const keyword = document.getElementById("empKeyword").value.trim();
        const qs = new URLSearchParams({size: "30", excludeMe: "true"});
        if (keyword) qs.set("keyword", keyword);
        if (empCursor) qs.set("cursor", empCursor);
        const res = await fetch("/api/v1/employees?" + qs.toString(), {headers: authHeaders()});
        const result = await res.json();
        const payload = result.data || result;
        empCursor = payload.nextCursor;
        empHasNext = !!payload.hasNext;
        payload.items.forEach(e => {
            const div = document.createElement("div");
            div.className = "row";
            const statusClass = (e.msgStat === 'C') ? 'status-online' : 'status-offline';
            div.innerHTML = `
                <div class="title"><span class="status-dot ${statusClass}"></span>${escapeHtml(e.empName)}</div>
                <div class="sub">${escapeHtml(e.depName)} · ${escapeHtml(e.posName)}</div>
            `;
            div.ondblclick = () => openOneToOneChat(e.empId, e.empName);
            document.getElementById("empList").appendChild(div);
        });
        empLoading = false;
    }
    function onEmpSearchInput() { clearTimeout(empKwTimer); empKwTimer = setTimeout(initEmployees, 300); }
    async function loadMyInfo() {
        try {
            const res = await fetch("/api/v1/employees/me", {headers: authHeaders()});
            const result = await res.json();
            const me = result.data;
            const statusClass = (me.msgStat === 'C') ? 'status-online' : 'status-offline';
            document.getElementById("myName").innerHTML = `<span class="status-dot ${statusClass}"></span>${escapeHtml(me.empName)}`;
            document.getElementById("myDept").innerText = `${me.depName} · ${me.posName}`;
        } catch (err) { console.error(err); }
    }

    // ---------------- 채팅방 목록 ----------------
    let roomCursor = null, roomHasNext = true, roomLoading = false, roomKwTimer = null;
    async function initRooms() { resetRooms(); await loadMoreRooms(); }
    function resetRooms() { roomCursor = null; roomHasNext = true; document.getElementById("roomList").innerHTML = ""; }
    async function loadMoreRooms() {
        if (roomLoading || !roomHasNext) return;
        roomLoading = true;
        const keyword = document.getElementById("roomKeyword").value.trim();
        const qs = new URLSearchParams({size: "20"});
        if (keyword) qs.set("keyword", keyword);
        if (roomCursor) qs.set("lastMessageAt", roomCursor);
        try {
            const res = await fetch("/api/v1/chat/my?" + qs.toString(), {headers: authHeaders()});
            const result = await res.json();
            const rooms = result.data || [];
            if (rooms.length > 0) {
                roomCursor = rooms[rooms.length - 1].lastMessageAt;
                roomHasNext = rooms.length === 20;
            } else { roomHasNext = false; }
            rooms.forEach(r => appendRoomRow(r));
        } finally { roomLoading = false; }
    }

    function appendRoomRow(r) {
        const div = document.createElement("div");
        div.className = "row";
        div.id = "room-row-" + r.roomNo;
        div.onclick = () => openRoomWindow(r.roomNo, r.roomName);
        updateRoomUI(div, r);
        document.getElementById("roomList").appendChild(div);
    }

    function updateRoomUI(div, r) {
        const badgeHtml = (r.unreadCount > 0)
            ? `<span class="badge">${r.unreadCount > 999 ? "999+" : r.unreadCount}</span>` : "";
        const timeHtml = r.lastMessageAt ? `<div class="last-msg-time">${formatTime(r.lastMessageAt)}</div>` : "";

        const memberCountHtml = (r.roomType === 'GROUP' && r.memberCount > 0)
            ? `<span style="color: #999; font-size: 13px; font-weight: normal; margin-left: 6px; display: inline-flex; align-items: center; gap: 3px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-top: -1px;">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            ${r.memberCount}
           </span>`
            : "";

        div.innerHTML = `
        <div class="row-content">
            <div class="room-info">
                <div class="title" style="display: flex; align-items: center;">
                    ${escapeHtml(r.roomName)}${memberCountHtml}
                </div>
                <div class="sub">
                    <span class="last-msg-text">
                        ${escapeHtml(r.lastMessage || "대화 내용이 없습니다.")}
                    </span>
                </div>
            </div>
            <div class="room-meta">
                ${timeHtml}
                ${badgeHtml}
            </div>
        </div>
    `;
    }

    function onRoomSearchInput() { clearTimeout(roomKwTimer); roomKwTimer = setTimeout(initRooms, 300); }

    function handleRealtimeUpdate(upd) {
        if (upd && upd.removed === true) {
            const row = document.getElementById("room-row-" + upd.roomNo);
            if (row) row.remove();
            return;
        }
        const row = document.getElementById("room-row-" + upd.roomNo);
        if (row) {
            const currentText = row.querySelector(".last-msg-text")?.innerText || "";
            const newText = upd.lastMessage || "대화 내용이 없습니다.";
            updateRoomUI(row, upd);
            if (currentText !== newText) document.getElementById("roomList").prepend(row);
        } else { initRooms(); }
    }

    window.handleReadRoom = function (roomNo) {
        const row = document.getElementById("room-row-" + roomNo);
        if (row) { const badge = row.querySelector(".badge"); if (badge) badge.remove(); }
    };
    window.handleLeaveRoom = function (roomNo) {
        const row = document.getElementById("room-row-" + roomNo);
        if (row) row.remove();
    };

    document.getElementById("empList").addEventListener("scroll", (e) => {
        if (e.target.scrollTop + e.target.clientHeight >= e.target.scrollHeight - 50) loadMoreEmployees();
    });
    document.getElementById("roomList").addEventListener("scroll", (e) => {
        if (e.target.scrollTop + e.target.clientHeight >= e.target.scrollHeight - 50) loadMoreRooms();
    });

    const empIdToRoomNoMap = {};
    const pendingRequests = new Set();
    async function openOneToOneChat(targetId, targetName) {
        if (pendingRequests.has(targetId)) return;
        if (empIdToRoomNoMap[targetId] && activeChatWindows[String(empIdToRoomNoMap[targetId])] && !activeChatWindows[String(empIdToRoomNoMap[targetId])].closed) {
            activeChatWindows[String(empIdToRoomNoMap[targetId])].focus();
            return;
        }
        pendingRequests.add(targetId);
        try {
            const res = await fetch("/api/v1/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json", ...authHeaders()},
                body: JSON.stringify({roomType: "ONE", memberIds: [targetId]})
            });
            const result = await res.json();
            const room = result.data;
            empIdToRoomNoMap[targetId] = room.roomNo;
            openRoomWindow(room.roomNo, room.roomName || targetName);
        } catch (err) { console.error(err); }
        finally { pendingRequests.delete(targetId); }
    }

    const activeChatWindows = {};
    function openRoomWindow(no, name) {
        const roomId = String(no);
        if (activeChatWindows[roomId] && !activeChatWindows[roomId].closed) {
            activeChatWindows[roomId].focus();
        } else {
            activeChatWindows[roomId] = window.open(`/chat/room/${roomId}`, "ChatRoomWindow_" + roomId, "width=420,height=740");
        }
    }
    function openCreateRoom() { window.open("/chat/new", "_blank", "width=520,height=740"); }

    window.addEventListener("load", () => { initEmployees(); connectWs(); loadMyInfo(); });
</script>
</body>
</html>
