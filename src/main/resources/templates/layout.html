<!-- templates/layout.html -->
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bizportal</title>

    <style>
        :root{
            --bg: #f6f7fb;
            --white:#fff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: rgba(17, 24, 39, 0.08);

            --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            --shadow2: 0 6px 18px rgba(17, 24, 39, 0.10);

            --primary: #3b82f6;
            --primary2: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --warn: #f59e0b;

            --sidebar-w:72px;
            --topbar-h:64px;
            --footer-h:76px;
            --radius:14px;

            /* ✅ 추가: "각지게" 라운드 값 */
            --radius-sq: 10px;    /* 검색바/버튼 라운드 */
        }

        *{box-sizing:border-box}
        html,body{height:100%}
        body{
            margin:0;
            font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
            background:var(--bg);
            color:var(--text);
        }

        .app{
            min-height:100vh;
            display:grid;
            grid-template-rows: var(--topbar-h) 1fr auto;
        }

        /* ====== 상단 헤더 ====== */
        .topbar{
            height:var(--topbar-h);
            background:var(--primary);
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 16px;
            gap:12px;
        }

        .topbar-left{
            display:flex;
            align-items:center;
            gap:12px;
            min-width:220px;
        }
        .launcher-btn{
            width:36px;height:36px;
            border:0;
            border-radius:10px;
            background:rgba(255,255,255,.16);
            color:#fff;
            cursor:pointer;
            display:grid;
            place-items:center;
        }
        .launcher-btn:hover{ background:rgba(255,255,255,.22); }

        .brand{
            display:flex;
            align-items:center;
            gap:10px;
            font-weight:900;
            letter-spacing:.2px;
            user-select:none;
        }
        .brand .logo-box{
            width:30px;height:30px;
            border-radius:10px;
            background:#fff;
            color:var(--primary);
            display:grid;
            place-items:center;
            font-weight:900;
        }
        .brand a{
            color:#fff;
            text-decoration:none;
            font-size:20px;
            line-height:1;
        }

        .topbar-center{
            flex:1;
            display:flex;
            justify-content:flex-start;
        }

        /* ✅ 검색바: 둥근 pill -> 각진 라운드 */
        .search{
            width:min(520px, 100%);
            margin-left:10px;
            display:flex;
            align-items:center;
            background:#fff;

            border-radius: var(--radius-sq);              /* ✅ 변경 */
            padding:6px 10px;
            gap:8px;
            box-shadow:0 6px 16px rgba(0,0,0,.14);
        }
        .search .scope{
            border:0;
            background:#f3f4f6;

            border-radius: 8px;                          /* ✅ 변경 */
            padding:7px 10px;
            font-size:12px;
            color:#374151;
            outline:none;
        }
        .search input{
            border:0;
            outline:none;
            flex:1;
            font-size:13px;
            padding:7px 6px;
        }
        .search .icon{ width:18px;height:18px; opacity:.7; }

        .topbar-right{
            display:flex;
            align-items:center;
            gap:10px;
            min-width:220px;
            justify-content:flex-end;
        }
        .icon-btn{
            width:38px;height:38px;
            border:0;
            border-radius:999px;
            background:rgba(255,255,255,.16);
            color:#fff;
            cursor:pointer;
            display:grid;
            place-items:center;
            position:relative;
        }
        .badge{
            position:absolute;
            right:6px; top:6px;
            width:9px;height:9px;
            background:#ef4444;
            border-radius:50%;
            border:2px solid var(--primary);
        }

        .avatar{
            width:38px;height:38px;
            border-radius:999px;
            background:rgba(255,255,255,.22);
            border:0;
            padding:0;
            cursor:pointer;
            user-select:none;
            overflow:hidden;
            display:grid;
            place-items:center;
            position:relative;
        }
        .avatar-img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:none;
        }
        .avatar-fallback{
            display:grid;
            place-items:center;
            width:100%;
            height:100%;
        }
        .avatar-fallback svg{ width:18px; height:18px; opacity:.95; }

        /* ✅ 로그아웃 버튼: 둥근 pill -> 각진 라운드 */
        .logout{
            border:0;
            border-radius: var(--radius-sq);              /* ✅ 변경 */
            padding:10px 14px;
            background:rgba(255,255,255,.16);
            color:#fff;
            cursor:pointer;
            font-weight:700;
        }
        .logout:hover{
            background:rgba(255,255,255,.22);
        }

        /* ====== 본문 ====== */
        .body{
            display:grid;
            grid-template-columns: var(--sidebar-w) 1fr;
            min-height: calc(100vh - var(--topbar-h));
        }

        /* ====== 메뉴바(아이콘바) ====== */
        .iconbar{
            width:var(--sidebar-w);
            background:#fff;
            border-right:1px solid var(--line);
            padding:10px 0;
            display:flex;
            flex-direction:column;
            align-items:stretch;
            gap:6px;

            overflow:visible;
            position:relative;
            z-index:40;
        }

        .nav-item{
            position:relative;
            width:100%;
            min-height:56px;
            padding:8px 0;
            text-decoration:none;
            color:var(--text);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            user-select:none;
            transition: background .12s ease;
        }
        .nav-item:hover{ background:rgba(17,24,39,.04); }

        .nav-item .nav-ico{
            width:26px; height:26px;
            border-radius:8px;
            background:transparent;
            box-shadow:none;
            display:grid;
            place-items:center;
            font-weight:900;
            line-height:1;
            font-size:20px;
            color:var(--text);
        }

        .nav-item.active{
            background:transparent;
        }
        .nav-item.active::before{
            content:"";
            position:absolute;
            left:0;
            top:50%;
            transform:translateY(-50%);
            width:3px;
            height:26px;
            border-radius:999px;
            background:var(--primary);
        }

        /* ✅ hover 툴팁 */
        .nav-item::after{
            content: attr(data-tip);
            position:absolute;
            left: calc(100% + 12px);
            top: 50%;
            transform: translateY(-50%) translateX(-4px);
            background: rgba(17,24,39,.92);
            color:#fff;
            font-size:12px;
            font-weight:900;
            padding:7px 10px;
            border-radius:10px;
            white-space:nowrap;
            opacity:0;
            pointer-events:none;
            transition: opacity .12s ease, transform .12s ease;
            z-index:9999;
            box-shadow: 0 14px 30px rgba(0,0,0,.18);
        }
        .nav-item:hover::after{
            opacity:1;
            transform: translateY(-50%) translateX(0);
        }

        .sr-only{
            position:absolute;
            width:1px;height:1px;
            padding:0;margin:-1px;
            overflow:hidden;
            clip:rect(0,0,0,0);
            white-space:nowrap;
            border:0;
        }

        .content-wrap{
            padding:22px 26px;
            position:relative;
        }
        .content-surface{
            min-height: calc(100vh - var(--topbar-h) - var(--footer-h) - 44px);
        }

        /* ✅ subbar가 있는 페이지는 "도킹" 느낌으로: 좌우 padding 제거 */
        .content-wrap:has(.page-with-subbar){
            padding: 0;
        }

        /* ====== 하단 푸터 ====== */
        .footer{
            background:#fff;
            border-top:1px solid var(--line);
            padding:14px 18px;
        }
        .footer-inner{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:16px;
            flex-wrap:wrap;
        }
        .banners{
            display:flex;
            align-items:center;
            gap:14px;
            flex-wrap:wrap;
            margin-left:70px;
        }
        .banner-btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width: min(240px);
            height:64px;
            padding:6px;
            background:#fff;
            border:1px solid #d1d5db;
            border-radius:18px;
            box-shadow:0 8px 18px rgba(0,0,0,.06);
            text-decoration:none;
            transition:transform .15s ease, box-shadow .15s ease;
        }
        .banner-btn:hover{
            transform:translateY(-1px);
            box-shadow:0 12px 24px rgba(0,0,0,.10);
        }
        .banner-img{
            width:100%;
            height:100%;
            object-fit:contain;
            display:block;
            border-radius:14px;
        }
        .footer-links{
            display:flex;
            align-items:center;
            gap:10px;
            color:var(--muted);
            font-size:12px;
            flex-wrap:wrap;
        }
        .footer-links a{
            color:var(--muted);
            text-decoration:none;
        }
        .footer-links a:hover{text-decoration:underline;}

        /* ====== 챗봇 ====== */
        .chat-fab{
            position:fixed;
            right:18px;
            bottom:18px;
            width:52px;height:52px;
            border-radius:999px;
            border:0;
            background:#e8f0ff;
            color:var(--primary);
            box-shadow:var(--shadow);
            cursor:pointer;
            display:grid;
            place-items:center;
            z-index:50;
        }
        /* layout.html의 스타일 영역 수정 */
        .chat-panel {
            position: fixed;
            right: 18px;
            bottom: 80px;
            width: 350px; /* 기존 320px에서 약간 넓게 조정 추천 */
            height: 500px; /* 기존 420px에서 높게 조정 추천 */
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: none;
            z-index: 50;
            /* ✅ 추가: 유연한 높이 관리를 위해 flex 설정 */
            flex-direction: column;
        }

        .chat-panel.open { display: flex; } /* block 대신 flex로 변경 */

        .chat-head {
            padding: 12px 14px;
            background: #f8fafc;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 800;
            flex-shrink: 0; /* 헤더 크기 고정 */
        }

        .chat-body {
            flex: 1; /* 남은 영역 전체 차지 */
            padding: 0 !important; /* ✅ 중요: iframe이 꽉 차도록 패딩 제거 */
            overflow: hidden;
        }

        .chat-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .chat-close{
            border:0;
            background:transparent;
            cursor:pointer;
            font-size:18px;
            color:#6b7280;
        }

        @media (max-width: 860px){
            .topbar-left,.topbar-right{min-width:auto}
            .search{box-shadow:none; width:min(420px, 100%); margin-left:8px;}
            .brand a{font-size:18px;}
        }

        /* ====== 서브 사이드바(관리자 메뉴) - "메뉴바에 붙는" 도킹 스타일 ====== */
        .page-with-subbar{
            display:grid;
            grid-template-columns: 220px 1fr;
            gap:0;
            align-items: stretch;
            min-height: calc(100vh - var(--topbar-h) - var(--footer-h) - 44px);
        }

        .page-with-subbar > :nth-child(2){
            padding: 0 26px;
        }

        .subbar{
            height:100%;
            align-self:stretch;
            background: rgba(59,130,246,.08);
            border-right: 1px solid rgba(59,130,246,.14);
            border-top: 0;
            border-left: 0;
            border-bottom: 0;
            border-radius: 0;
            box-shadow: 10px 0 24px rgba(17,24,39,.10);
            overflow:hidden;
        }

        .subbar-title{
            font-weight:700;
            font-size:12px;
            color: rgba(31,41,55,.72);
            padding: 12px 14px 10px;
            margin:0;
            border-bottom: 1px solid rgba(59,130,246,.14);
            background: rgba(255,255,255,.30);
        }

        .subbar-nav{
            display:flex;
            flex-direction:column;
            gap:0;
            padding: 10px 0;
        }

        .subbar-item{
            position:relative;
            display:flex;
            align-items:center;
            height:44px;
            padding: 0 14px 0 20px;
            border-radius: 0;
            text-decoration:none;
            font-size:13px;
            font-weight:600;
            color: var(--primary2);
            transition: background .12s ease, color .12s ease;
        }

        .subbar-item:hover{
            background: rgba(59,130,246,.08);
        }

        .subbar-item.active{
            background: rgba(59,130,246,.14);
            color:#1d4ed8;
        }

        .subbar-item.active::before{
            content:"";
            position:absolute;
            left:10px;
            top:50%;
            transform:translateY(-50%);
            width:3px;
            height:26px;
            border-radius:999px;
            background: var(--primary);
        }

        /* ✅ content padding은 nth-child보다 안전하게: "subbar 다음 요소" */
        .page-with-subbar > .subbar + *{
            padding: 22px 26px;
            min-width: 0;
        }

        /* ✅ 접힘 상태: 첫 컬럼을 0으로, subbar는 grid에 남겨둔 채로 숨김 */
        html.subbar-collapsed .page-with-subbar{
            grid-template-columns: 0 minmax(0, 1fr);
        }

        /* ❗️display:none 금지 (grid에서 빠지면 콘텐츠가 0폭 컬럼으로 들어감) */
        html.subbar-collapsed .page-with-subbar > .subbar{
            overflow: hidden;
            opacity: 0;
            pointer-events: none;

            /* 접힌 상태에서 남는 선/그림자 제거 */
            border-right: 0;
            box-shadow: none;
        }

        /* (선택) 애니메이션 주고 싶으면 */
        .page-with-subbar{
            transition: grid-template-columns .18s ease;
        }
        .subbar{
            transition: opacity .18s ease;
        }

    </style>

    <th:block layout:fragment="pageStyles"></th:block>
</head>

<body>

<div id="me"
     style="display:none"
     th:attr="data-emp-no=${(#authentication != null and #authentication.principal != null) ? #authentication.principal.subjectId : ''}">
</div>

<div class="app">

    <header class="topbar">
        <div class="topbar-left">
            <button class="launcher-btn" type="button" id="launcherBtn" aria-label="사이드바 토글" aria-pressed="false">
                <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/>
                    <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
                    <circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
                </svg>
            </button>

            <div class="brand">
                <div class="logo-box">B</div>
                <a th:href="@{/employees}" href="/employees">Bizportal</a>
            </div>
        </div>

        <div class="topbar-center">
            <form class="search" action="#" method="get">
                <select class="scope" name="scope" aria-label="검색 범위">
                    <option value="label">Label</option>
                    <option value="all">All</option>
                </select>

                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" stroke-width="2"/>
                    <path d="M20 20L17 17" stroke-width="2" stroke-linecap="round"/>
                </svg>

                <input type="text" name="q" placeholder="Search" autocomplete="off"/>
            </form>
        </div>

        <div class="topbar-right">
            <button class="icon-btn" type="button" aria-label="알림">
                <span class="badge" aria-hidden="true"></span>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" aria-hidden="true">
                    <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7" stroke-width="2" stroke-linecap="round"/>
                    <path d="M13.73 21a2 2 0 01-3.46 0" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <button class="avatar" type="button" title="마이페이지"
                    onclick="location.href='/employees/mypage'">
                <img id="profileImg" class="avatar-img" alt="profile"/>
                <span id="profileFallback" class="avatar-fallback" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="8" r="4" stroke-width="2"/>
                        <path d="M4 21c2-4 6-6 8-6s6 2 8 6" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
            </button>

            <form id="logoutForm" th:action="@{/auth/logout}" method="post" style="display:inline;">
                <input type="hidden" id="csrfParam" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" id="csrfHeader" th:if="${_csrf != null}"
                       th:value="${_csrf.headerName}" />
                <button class="logout" type="submit">로그아웃</button>
            </form>
        </div>
    </header>

    <div class="body">
        <aside class="iconbar" aria-label="메인 메뉴">
            <a class="nav-item" th:href="@{/document-forms}" href="/document-forms" data-tip="결재" aria-label="결재">
                <div class="nav-ico">✓</div>
                <span class="sr-only">결재</span>
            </a>

            <a class="nav-item" th:href="@{/meeting}" href="/meeting" data-tip="회의" aria-label="회의">
                <div class="nav-ico">💬</div>
                <span class="sr-only">회의</span>
            </a>

            <a class="nav-item" th:href="@{/mail}" href="/mail" data-tip="메일" aria-label="메일">
                <div class="nav-ico">📧</div>
                <span class="sr-only">메일</span>
            </a>

            <a class="nav-item" th:href="@{/form/forms}" href="/form/forms" data-tip="문서함" aria-label="문서함">
                <div class="nav-ico">📄</div>
                <span class="sr-only">문서함</span>
            </a>

            <a class="nav-item" th:href="@{/share}" href="/share" data-tip="공유함" aria-label="공유함">
                <div class="nav-ico">☁</div>
                <span class="sr-only">공유함</span>
            </a>

            <a class="nav-item" th:href="@{/calendar}" href="/calendar" data-tip="캘린더" aria-label="캘린더">
                <div class="nav-ico">📅</div>
                <span class="sr-only">캘린더</span>
            </a>

            <a class="nav-item" th:href="@{/board/list}" href="/board/list" data-tip="게시판" aria-label="게시판">
                <div class="nav-ico">🧾</div>
                <span class="sr-only">게시판</span>
            </a>

            <a class="nav-item"
               th:href="@{/meeting-rooms/reservation}"
               href="/meeting-rooms/reservation"
               data-tip="예약" aria-label="예약">
                <div class="nav-ico">🕒</div>
                <span class="sr-only">예약</span>
            </a>

            <a class="nav-item" th:href="@{/attendance}" href="/attendance" data-tip="근태" aria-label="근태">
                <div class="nav-ico">🧳</div>
                <span class="sr-only">근태</span>
            </a>

            <a class="nav-item" th:href="@{/org}" href="/org" data-tip="조직도" aria-label="조직도">
                <div class="nav-ico">👥</div>
                <span class="sr-only">조직도</span>
            </a>

            <a class="nav-item"
               sec:authorize="hasRole('COM_ADMIN')"
               th:href="@{/admin/departments/list}" href="/admin/departments/list"
               data-tip="관리자" aria-label="관리자"
               data-active-prefix="/admin">
                <div class="nav-ico">⚙</div>
                <span class="sr-only">관리자</span>
            </a>
        </aside>

        <main class="content-wrap">
            <div class="content-surface" layout:fragment="content">
                <h2 style="margin:0 0 8px 0;">콘텐츠 영역</h2>
                <p style="margin:0;color:var(--muted);">
                    각 기능 페이지에서 <code>layout:fragment="content"</code> 로 이 영역을 덮어씌웁니다.
                </p>
            </div>
        </main>
    </div>

    <footer class="footer">
        <div class="footer-inner">
            <div class="banners">
                <a class="banner-btn" href="https://www.nts.go.kr" target="_blank" rel="noopener" aria-label="국세청">
                    <img class="banner-img"
                         th:src="@{/images/nts.png}" src="/images/nts.png"
                         alt="국세청 배너" />
                </a>

                <a class="banner-btn" href="https://www.gov.kr" target="_blank" rel="noopener" aria-label="정부24">
                    <img class="banner-img"
                         th:src="@{/images/gov24.png}" src="/images/gov24.png"
                         alt="정부24 배너" />
                </a>
            </div>

            <div class="footer-links">
                <a th:href="@{/policy/privacy}" href="/policy/privacy">개인정보 처리방침</a>
                <span>·</span>
                <span>버전: <strong>1.0.0</strong></span>
                <span>·</span>
                <a th:href="@{/policy/terms}" href="/policy/terms">이용약관</a>
            </div>
        </div>
    </footer>

</div>

<div class="chat-panel" id="chatPanel" aria-label="챗봇">
    <div class="chat-head">
        <span>비즈포탈 메신저</span>
        <button class="chat-close" type="button" aria-label="닫기" onclick="toggleChat(false)">×</button>
    </div>
    <div class="chat-body">
        <iframe src="/chat" class="chat-iframe" id="chatIframe"></iframe>
    </div>
</div>

<button class="chat-fab" type="button" aria-label="챗봇 열기" onclick="toggleChat()">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" aria-hidden="true">
        <path d="M21 15a4 4 0 01-4 4H8l-5 3V7a4 4 0 014-4h10a4 4 0 014 4z" stroke-width="2" stroke-linejoin="round"/>
    </svg>
</button>

<script>
    function toggleChat(force) {
        const panel = document.getElementById('chatPanel');
        const open = typeof force === 'boolean' ? force : !panel.classList.contains('open');
        panel.classList.toggle('open', open);
    }

    const SUBBAR_KEY = 'bizportal_subbar_collapsed';

    function setSubbarCollapsed(collapsed){
        document.documentElement.classList.toggle('subbar-collapsed', collapsed);

        const btn = document.getElementById('launcherBtn');
        if (btn) btn.setAttribute('aria-pressed', String(!collapsed));

        try { localStorage.setItem(SUBBAR_KEY, collapsed ? '1' : '0'); } catch (e) {}
    }

    function toggleSubbar(){
        const collapsed = document.documentElement.classList.contains('subbar-collapsed');
        setSubbarCollapsed(!collapsed);
    }

    document.getElementById('launcherBtn')?.addEventListener('click', toggleSubbar);

    document.getElementById('logoutForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();

        const form = e.currentTarget;
        const url = form.getAttribute('action') || '/auth/logout';

        const csrfParamEl = document.getElementById('csrfParam');
        const csrfHeaderEl = document.getElementById('csrfHeader');

        const headers = { 'Accept': 'application/json' };
        if (csrfParamEl && csrfHeaderEl) {
            headers[csrfHeaderEl.value] = csrfParamEl.value;
        }

        try {
            await fetch(url, {
                method: 'POST',
                credentials: 'include',
                headers
            });
        } finally {
            location.href = '/auth/employee/login';
        }
    });

    async function loadProfilePhoto() {
        const meEl = document.getElementById('me');
        const empNo = meEl?.dataset?.empNo;
        if (!empNo) return;

        const BASE = '/api/v1/attachments';

        const img = document.getElementById('profileImg');
        const fallback = document.getElementById('profileFallback');
        if (!img || !fallback) return;

        function showFallback() {
            img.style.display = 'none';
            fallback.style.display = 'grid';
        }
        function showImg(url) {
            img.onload = () => {
                img.style.display = 'block';
                fallback.style.display = 'none';
            };
            img.onerror = () => showFallback();
            img.src = url;
        }

        try {
            const listRes = await fetch(`${BASE}?domain=EMPLOYEE&entityId=${encodeURIComponent(empNo)}`, {
                method: 'GET',
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            if (!listRes.ok) return showFallback();

            const listJson = await listRes.json();
            const items = Array.isArray(listJson?.data) ? listJson.data : [];
            if (!items.length) return showFallback();

            const getId = (it) => it?.attachmentId ?? it?.id ?? it?.attachmentNo ?? it?.attachment_id;
            const main = items.find(it => it?.isMain === true || it?.main === true);
            let pickedId = getId(main);

            if (!pickedId) {
                const candidates = items.map(getId).filter(v => v !== undefined && v !== null);
                if (!candidates.length) return showFallback();
                pickedId = candidates
                    .map(v => (typeof v === 'string' ? Number(v) : v))
                    .filter(v => !Number.isNaN(v))
                    .sort((a,b)=>b-a)[0];
            }

            if (!pickedId) return showFallback();

            const previewRes = await fetch(`${BASE}/${pickedId}/preview-url`, {
                method: 'GET',
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            if (!previewRes.ok) return showFallback();

            const previewJson = await previewRes.json();
            const url =
                previewJson?.data?.url ||
                previewJson?.data?.presignedUrl ||
                previewJson?.data?.previewUrl;

            if (!url) return showFallback();

            showImg(url);

        } catch (e) {
            showFallback();
        }
    }

    function normalizePath(p){
        if (!p) return '/';
        // trailing slash 제거(단, 루트는 제외)
        return (p.length > 1 && p.endsWith('/')) ? p.slice(0, -1) : p;
    }

    function pathMatches(current, candidate){
        current = normalizePath(current);
        candidate = normalizePath(candidate);
        return current === candidate || (candidate !== '/' && current.startsWith(candidate + '/'));
    }

    function setActiveIconbarMenu() {
        const currentPath = normalizePath(window.location.pathname);
        const links = Array.from(document.querySelectorAll('.iconbar a.nav-item'));
        if (!links.length) return;

        links.forEach(a => a.classList.remove('active'));

        let best = null;
        let bestLen = -1;

        links.forEach(a => {
            const candidates = [];

            // 1) 기본 href 경로
            try {
                const hrefPath = new URL(a.href, window.location.origin).pathname;
                candidates.push(hrefPath);
            } catch (e) {}

            // 2) data-active-prefix 경로(여러 개면 콤마로)
            const pref = a.getAttribute('data-active-prefix');
            if (pref) {
                pref.split(',')
                    .map(s => s.trim())
                    .filter(Boolean)
                    .forEach(p => candidates.push(p));
            }

            // 후보들 중 가장 “긴” 매칭이 이기게(더 구체적인 메뉴 우선)
            candidates.forEach(c => {
                if (pathMatches(currentPath, c)) {
                    const len = normalizePath(c).length;
                    if (len > bestLen) {
                        bestLen = len;
                        best = a;
                    }
                }
            });
        });

        if (best) best.classList.add('active');
    }


    window.addEventListener('DOMContentLoaded', () => {
        try {
            const saved = localStorage.getItem(SUBBAR_KEY);
            if (saved === '1') setSubbarCollapsed(true);
        } catch (e) {}

        loadProfilePhoto();
        setActiveIconbarMenu();
    });
</script>

<th:block layout:fragment="pageScripts"></th:block>
</body>
</html>
