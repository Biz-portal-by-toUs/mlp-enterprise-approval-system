<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside class="subbar"
       th:fragment="reservationSidebar(active)">
  <div class="subbar-title">예약</div>

  <nav class="subbar-nav" aria-label="예약 메뉴">
    <!-- 회의실 예약 -->
    <a class="subbar-item"
       th:href="@{/meeting-rooms/reservation}"
       href="/meeting-rooms/reservation"
       th:classappend="${active}=='meeting' ? ' active' : ''">
      회의실 예약
    </a>

    <!-- 법인 차량 예약 -->
    <a class="subbar-item"
       th:href="@{/corporate-cars/reservation}"
       href="/corporate-cars/reservation"
       th:classappend="${active}=='car' ? ' active' : ''">
      법인 차량 예약
    </a>

    <!-- 공유 설비 예약 -->
    <a class="subbar-item"
       th:href="@{/shared-equipment/reservation}"
       href="/shared-equipments/reservation"
       th:classappend="${active}=='equipment' ? ' active' : ''">
      공유 설비 예약
    </a>

    <!-- 내 예약 조회 -->
    <a class="subbar-item"
       th:href="@{/my-reservations}"
       href="/my-reservations"
       th:classappend="${active}=='my' ? ' active' : ''">
      내 예약 조회
    </a>

    <!-- 공유 시설 조회 -->
    <a class="subbar-item"
       th:href="@{/meeting-rooms}"
       href="/meeting-rooms"
       th:classappend="${active}=='facility' ? ' active' : ''">
      공유 시설 조회
    </a>
  </nav>
</aside>
</body>
</html>
