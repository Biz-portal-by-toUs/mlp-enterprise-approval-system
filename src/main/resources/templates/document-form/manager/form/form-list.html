<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>문서양식 목록</title>

    <style>
        :root{
            --bg:#f4f6fb; --card:#fff; --line:#e1e3ea; --text:#111827; --muted:#6b7280; --primary:#2c5cff;
            --danger:#ff4d4f;
        }
        *{box-sizing:border-box}
        body{margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif; background:var(--bg); color:var(--text);}
        .wrap{width:min(1100px, calc(100% - 32px)); margin:28px auto;}
        .card{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.06);}
        .header{display:flex; align-items:flex-start; justify-content:space-between; padding:18px 18px 12px;}
        .title{font-size:18px; font-weight:900; margin:0;}
        .sub{margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.4;}
        .actions{display:flex; gap:10px; align-items:center;}
        .btn{border:1px solid var(--line); background:#fff; padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:800;}
        .btn.primary{background:var(--primary); color:#fff; border-color:transparent;}
        .btn.danger{background:var(--danger); color:#fff; border-color:transparent;}
        .btn:disabled{opacity:.5; cursor:not-allowed}

        .toolbar{display:flex; gap:10px; flex-wrap:wrap; padding:0 18px 14px; align-items:center;}
        .input, .select{border:1px solid var(--line); background:#fff; padding:10px 12px; border-radius:10px; outline:none;}
        .input{min-width:260px;}
        .select{min-width:140px;}
        .rightHint{margin-left:auto; color:var(--muted); font-size:13px;}
        code.k{background:#1118270d; padding:2px 6px; border-radius:6px;}

        .table-wrap{padding:0 18px 18px;}
        table{width:100%; border-collapse:separate; border-spacing:0; overflow:hidden; border:1px solid var(--line); border-radius:12px;}
        thead th{background:#fafbff; text-align:left; font-size:13px; color:#374151; padding:12px 10px; border-bottom:1px solid var(--line);}
        tbody td{padding:12px 10px; border-bottom:1px solid #f0f1f6; font-size:14px; vertical-align:middle;}
        tbody tr:hover{background:#fbfcff;}
        .muted{color:var(--muted); font-size:13px;}

        /* 제목 hover: 파란색 + 밑줄 */
        .titleLink{
            color: inherit;
            text-decoration: none;
            font-weight: 900;
            cursor: pointer;
        }
        .titleLink:hover{
            color: var(--primary);
            text-decoration: underline;
        }

        /* pager */
        .pager{display:flex; gap:8px; align-items:center; justify-content:flex-end; padding:10px 18px 18px;}
        .pager .info{margin-right:auto; color:var(--muted); font-size:13px;}
        .pager-controls{display:flex; gap:8px; align-items:center;}
        .pager-controls .num{min-width:42px; text-align:center;}
        .pager-controls .num.active{background:var(--primary); color:#fff; border-color:transparent;}

        .toast{position:fixed; right:18px; bottom:18px; background:#111827; color:#fff; padding:10px 12px; border-radius:10px; opacity:0; transform:translateY(8px); transition:.18s;}
        .toast.show{opacity:1; transform:translateY(0);}
    </style>
</head>

<body>
<div class="wrap card">
    <div class="header">
        <div>
            <h1 class="title">문서양식 목록</h1>
            <p class="sub">
                목록 조회는 REST API로 가져오고, 화면 이동은 ViewController로 이동해.<br/>
                상세는 <code class="k">/document-form/manager/form/{docfoNo}</code>, 생성은 <code class="k">/document-form/manager/form/make-form</code><br/>
                * 이 목록은 승인(A) 양식만 보여주는 페이지로 사용
            </p>
        </div>
        <div class="actions">
            <button class="btn" id="btnRefresh">새로고침</button>
            <button class="btn primary" id="btnCreate">+ 새 양식 만들기</button>
        </div>
    </div>

    <div class="toolbar">
        <input class="input" id="q" placeholder="검색(양식명)" />
        <select class="select" id="size">
            <option value="15" selected>15개</option>
            <option value="30">30개</option>
        </select>
        <button class="btn" id="btnSearch">검색</button>

        <!-- 선택 삭제(체크 1개 이상이면 표시) -->
        <button class="btn danger" id="btnBulkDelete" style="display:none;">선택 삭제</button>

        <div class="rightHint">
            API: <code class="k" id="apiLabel">/api/forms</code>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th style="width:140px;">선택/번호</th>
                <th>제목</th>
            </tr>
            </thead>
            <tbody id="tbody">
            <tr><td colspan="2" class="muted">로딩 중...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pager">
        <div class="info" id="pageInfo">-</div>
        <div class="pager-controls" id="pagerControls"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API_BASE  = '/api/v1/forms';
    const VIEW_BASE = '/document-form/manager/form';
    document.getElementById('apiLabel').textContent = API_BASE;

    const elTbody   = document.getElementById('tbody');
    const elInfo    = document.getElementById('pageInfo');
    const elPager   = document.getElementById('pagerControls');

    const elQ       = document.getElementById('q');
    const elSize    = document.getElementById('size');

    const elBulkDel = document.getElementById('btnBulkDelete');
    const elToast   = document.getElementById('toast');

    const selected = new Set(); // 체크된 docfoNo 저장

    let page = 0;
    let totalPages = 1;
    let totalElements = 0;

    function toast(msg){
        elToast.textContent = msg;
        elToast.classList.add('show');
        window.clearTimeout(toast._t);
        toast._t = window.setTimeout(() => elToast.classList.remove('show'), 1400);
    }

    function esc(s){
        return String(s ?? '')
            .replaceAll('&','&amp;')
            .replaceAll('<','&lt;')
            .replaceAll('>','&gt;')
            .replaceAll('"','&quot;')
            .replaceAll("'",'&#39;');
    }

    function openDetail(docfoNo){
        if(docfoNo == null) return;
        const id = String(docfoNo);
        window.open(`${VIEW_BASE}/${encodeURIComponent(id)}`, '_blank',
            'width=1100,height=820,resizable=yes,scrollbars=yes'
        );
    }

    function updateBulkDeleteUI(){
        if(selected.size > 0){
            elBulkDel.style.display = '';
            elBulkDel.textContent = `선택 삭제 (${selected.size})`;
        }else{
            elBulkDel.style.display = 'none';
            elBulkDel.textContent = '선택 삭제';
        }
    }

    function normalizePage(data){
        if(data && Array.isArray(data.content)){
            return {
                items: data.content,
                page: data.number ?? 0,
                size: data.size ?? Number(elSize.value),
                totalPages: data.totalPages ?? 1,
                totalElements: data.totalElements ?? data.content.length
            };
        }
        if(Array.isArray(data)){
            return { items: data, page: 0, size: data.length, totalPages: 1, totalElements: data.length };
        }
        if(data && data.data && Array.isArray(data.data.content)){
            return {
                items: data.data.content,
                page: data.data.number ?? 0,
                size: data.data.size ?? Number(elSize.value),
                totalPages: data.data.totalPages ?? 1,
                totalElements: data.data.totalElements ?? data.data.content.length
            };
        }
        return { items: [], page: 0, size: Number(elSize.value), totalPages: 1, totalElements: 0 };
    }

    function buildUrl(){
        const params = new URLSearchParams();
        params.set('page', String(page));
        params.set('size', String(Number(elSize.value) || 15));

        const q = elQ.value.trim();
        if(q){
            // 백엔드 파라미터가 q/docfoName 중 뭐든 받을 수 있게 둘 다
            params.set('q', q);
            params.set('docfoName', q);
        }

        // 상태 파라미터(stat)는 보내지 않음 (A 고정 페이지)
        return `${API_BASE}?${params.toString()}`;
    }

    function render(rows){
        if(!rows || rows.length === 0){
            elTbody.innerHTML = `<tr><td colspan="2" class="muted">조회 결과가 없어요.</td></tr>`;
            return;
        }

        const startNo = page * (Number(elSize.value) || 15);

        elTbody.innerHTML = rows.map((r, idx) => {
            const docfoNo   = r.docfoNo ?? r.id ?? r.docfo_no;
            const docfoName = r.docfoName ?? r.name ?? r.docfo_name ?? '-';

            const idStr = String(docfoNo ?? '');
            const checked = selected.has(idStr) ? 'checked' : '';
            const rowNo = startNo + idx + 1;

            return `
        <tr>
          <td>
            <label style="display:flex; gap:10px; align-items:center;">
              <input type="checkbox" data-role="rowCheck" data-id="${esc(idStr)}" ${checked}/>
              <span>${rowNo}</span>
            </label>
          </td>
          <td>
            <a class="titleLink" href="javascript:void(0)" onclick="openDetail('${esc(idStr)}')">
              ${esc(docfoName)}
            </a>
          </td>
        </tr>
      `;
        }).join('');

        updateBulkDeleteUI();
    }

    async function load(){
        elTbody.innerHTML = `<tr><td colspan="2" class="muted">로딩 중...</td></tr>`;

        try{
            const url = buildUrl();
            const res = await fetch(url, { headers: { 'Accept':'application/json' } });

            if(!res.ok){
                const t = await res.text().catch(()=> '');
                throw new Error(`HTTP ${res.status} ${t}`);
            }

            const json = await res.json();
            const pg = normalizePage(json);

            totalPages = pg.totalPages ?? 1;
            totalElements = pg.totalElements ?? 0;
            page = pg.page ?? page;

            elInfo.textContent = `page ${page + 1} / ${totalPages}  ·  total ${totalElements}`;

            renderPager();
            render(pg.items);

        }catch(err){
            console.error(err);
            elTbody.innerHTML = `<tr><td colspan="2" class="muted">불러오기 실패: ${esc(err?.message || err)}</td></tr>`;
            renderPager();
        }
    }

    function renderPager(){
        if(!elPager) return;

        const tp = Math.max(1, Number(totalPages) || 1);
        const p = Math.min(Math.max(0, Number(page) || 0), tp - 1);

        if(tp <= 1){
            elPager.innerHTML = '';
            return;
        }

        let start = p - 2;
        let end   = p + 2;

        if(start < 0){
            end += (0 - start);
            start = 0;
        }
        if(end > tp - 1){
            start -= (end - (tp - 1));
            end = tp - 1;
        }
        start = Math.max(0, start);

        const nums = [];
        for(let i = start; i <= end; i++) nums.push(i);

        const disableFirstPrev = (p <= 0);
        const disableNextLast  = (p >= tp - 1);

        const btn = (label, disabled, go, extra='') =>
            `<button class="btn ${extra}" ${disabled ? 'disabled' : ''} data-go="${go}">${label}</button>`;

        const numBtn = (i) => {
            const active = i === p ? 'active' : '';
            return `<button class="btn num ${active}" ${i===p?'disabled':''} data-page="${i}">${i+1}</button>`;
        };

        elPager.innerHTML = [
            btn('&laquo;', disableFirstPrev, 'first'),
            btn('&lsaquo;', disableFirstPrev, 'prev'),
            ...nums.map(numBtn),
            btn('&rsaquo;', disableNextLast, 'next'),
            btn('&raquo;', disableNextLast, 'last')
        ].join('');
    }

    // 체크박스 change (tbody 이벤트 위임)
    elTbody.addEventListener('change', (e) => {
        const cb = e.target;
        if(!(cb instanceof HTMLInputElement)) return;
        if(cb.dataset.role !== 'rowCheck') return;

        const id = cb.dataset.id;
        if(!id) return;

        if(cb.checked) selected.add(id);
        else selected.delete(id);

        updateBulkDeleteUI();
    });

    // ✅ 페이지네이션 클릭(이벤트 위임)
    elPager.addEventListener('click', (e) => {
        const t = e.target;
        if(!(t instanceof HTMLElement)) return;

        const pageAttr = t.getAttribute('data-page');
        if(pageAttr != null){
            const nextPage = Number(pageAttr);
            if(Number.isFinite(nextPage)){
                page = nextPage;
                load();
            }
            return;
        }

        const go = t.getAttribute('data-go');
        if(!go) return;

        if(go === 'first') page = 0;
        else if(go === 'prev') page = Math.max(0, page - 1);
        else if(go === 'next') page = Math.min(totalPages - 1, page + 1);
        else if(go === 'last') page = Math.max(0, totalPages - 1);

        load();
    });

    // 선택 삭제(B안: softDelete 없음)
    elBulkDel.addEventListener('click', async () => {
        if(selected.size === 0) return;

        const ids = Array.from(selected);
        if(!confirm(`선택한 ${ids.length}개를 삭제 처리할까요? (stat만 D로 변경)`)) return;

        try{
            elBulkDel.disabled = true;

            for(const docfoNo of ids){
                const res = await fetch(`${API_BASE}/${encodeURIComponent(docfoNo)}`, {
                    method: 'DELETE',
                    headers: {'Content-Type':'application/json'},
                });
                if(!res.ok){
                    const t = await res.text().catch(()=> '');
                    throw new Error(`삭제 실패(docfoNo=${docfoNo}) HTTP ${res.status} ${t}`);
                }
            }

            toast('선택 삭제 완료');
            selected.clear();
            updateBulkDeleteUI();
            await load();

        }catch(err){
            console.error(err);
            alert('선택 삭제 실패: ' + (err?.message || err));
        }finally{
            elBulkDel.disabled = false;
        }
    });

    // events
    document.getElementById('btnCreate').addEventListener('click', () => {
        window.open(`${VIEW_BASE}/make-form`, '_blank',
            'width=1100,height=820,resizable=yes,scrollbars=yes'
        );
    });

    document.getElementById('btnRefresh').addEventListener('click', () => load());
    document.getElementById('btnSearch').addEventListener('click', () => { page = 0; load(); });

    elQ.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){ page = 0; load(); }
    });

    elSize.addEventListener('change', () => { page = 0; load(); });

    // expose for inline onclick (제목 클릭)
    window.openDetail = openDetail;

    // init
    load();
</script>
</body>
</html>
