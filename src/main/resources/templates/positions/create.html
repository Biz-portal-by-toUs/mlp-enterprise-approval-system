<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>직급 등록</title>

    <th:block layout:fragment="pageStyles">
        <style>
            .pos-create .page-kicker{font-size:14px;color:var(--muted);margin:0 0 10px}
            .pos-create .page-title{font-size:34px;font-weight:900;margin:0 0 22px}
            .pos-create .section-title{font-size:22px;font-weight:900;margin:0 0 14px}

            .pos-create .card{
                background: var(--white);
                border: 1px solid var(--line);
                border-radius: 18px;
                padding: 26px;
                box-shadow: 0 10px 24px rgba(17,24,39,.06);
            }
            .pos-create .form-wrap{
                background:#f3f4f6;
                border-radius: 18px;
                padding: 26px;
            }
            .pos-create .field{ margin: 18px 0; }
            .pos-create .label{ font-weight: 900; margin-bottom: 10px; }

            .pos-create .input{
                width:100%;
                height:48px;
                border-radius: 12px;
                border: 1px solid var(--line);
                padding: 0 14px;
                font-size: 14px;
                outline: none;
                background: #fff;
            }
            .pos-create .input:focus{
                border-color: rgba(59,130,246,.55);
                box-shadow: 0 0 0 4px rgba(59,130,246,.12);
            }
            .pos-create .hint{
                margin-top: 8px;
                font-size: 12px;
                color: var(--muted);
                font-weight: 800;
            }

            .pos-create .actions{
                display:flex;
                justify-content:flex-end;
                gap:10px;
                margin-top: 22px;
            }
            .pos-create .btn{
                width:160px;
                height:50px;
                border:none;
                border-radius: 14px;
                background: var(--primary);
                color:#fff;
                font-weight: 900;
                cursor:pointer;
                box-shadow: 0 10px 22px rgba(59,130,246,.22);
            }
            .pos-create .btn.ghost{
                background:#eef4ff;
                color:#2b5db8;
                box-shadow:none;
                border:1px solid rgba(59,130,246,.18);
            }

            .pos-create .msg{
                margin-top:14px;
                font-size:13px;
                display:none;
                font-weight:900;
            }
            .pos-create .msg.ok{ color:#0f766e; }
            .pos-create .msg.err{ color:#b91c1c; }
        </style>
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="page-with-subbar">
        <!-- ✅ 관리자 사이드바(fragment) -->
        <div th:replace="~{sidebar/admin-sidebar :: adminSidebar('pos')}"></div>

        <section class="pos-create" style="padding: 0 26px;">
            <p class="page-kicker">직급 편성(등록)</p>
            <h1 class="page-title">직급 편성</h1>
            <h2 class="section-title">직급 등록</h2>

            <div class="card">
                <div class="form-wrap">
                    <div class="field">
                        <div class="label">직급명</div>
                        <input class="input" id="posName" maxlength="30" placeholder="예) 대리, 과장, 팀장" />
                        <div class="hint">최대 30자</div>
                    </div>

                    <div class="field">
                        <div class="label">직급 순서</div>
                        <select class="input" id="posOrder" aria-label="직급 순서">
                            <!-- JS로 1~50 생성 -->
                        </select>
                        <div class="hint">1 ~ 50</div>
                    </div>

                    <div class="actions">
                        <button class="btn ghost" type="button" onclick="location.href='/admin/positions/list'">취소</button>
                        <button class="btn" id="submitBtn" type="button">등록</button>
                    </div>

                    <div id="resultMsg" class="msg"></div>
                </div>
            </div>
        </section>
    </div>
</th:block>

<th:block layout:fragment="pageScripts">
    <script>
        const $ = (id) => document.getElementById(id);

        function showMsg(text, ok) {
            const el = $("resultMsg");
            if (!el) return;
            el.style.display = "block";
            el.className = "msg " + (ok ? "ok" : "err");
            el.textContent = text;
        }

        async function safeJson(res) {
            const ct = res.headers.get("content-type") || "";
            if (!ct.includes("application/json")) return {};
            try { return await res.json(); } catch { return {}; }
        }

        function initPosOrder() {
            const select = $("posOrder");
            if (!select) return;
            select.innerHTML = "";
            for (let i = 1; i <= 50; i++) {
                const opt = document.createElement("option");
                opt.value = String(i);
                opt.textContent = String(i);
                select.appendChild(opt);
            }
            select.value = "1";
        }

        window.addEventListener("DOMContentLoaded", () => {
            initPosOrder();

            const btn = $("submitBtn");
            if (!btn) return;

            btn.addEventListener("click", async () => {
                const posName = $("posName")?.value?.trim() || "";
                const posOrder = parseInt($("posOrder")?.value || "0", 10);

                if (!posName) return showMsg("직급명을 입력해주세요.", false);
                if (!Number.isInteger(posOrder) || posOrder < 1 || posOrder > 50) return showMsg("직급 순서는 1~50 사이로 선택해주세요.", false);

                const headers = { "Content-Type": "application/json", "Accept": "application/json" };

                try {
                    const res = await fetch("/api/v1/admin/positions", {
                        method: "POST",
                        headers,
                        credentials: "include",
                        body: JSON.stringify({ posName, posOrder })
                    });

                    if (res.status === 401) return showMsg("로그인이 필요합니다. 다시 로그인 해주세요.", false);
                    if (res.status === 403) return showMsg("권한이 없습니다. (COM_ADMIN만 가능)", false);

                    if (res.ok) {
                        let msg = "직급 등록에 성공했습니다.";
                        const data = await safeJson(res);
                        if (data?.message) msg = data.message;

                        alert(msg);
                        showMsg(msg, true);
                        setTimeout(() => window.location.href = "/admin/positions/list", 300);
                        return;
                    }

                    let errMsg = "요청 처리에 실패했습니다.";
                    const data = await safeJson(res);
                    if (data?.message) errMsg = data.message;
                    else errMsg = `요청 실패 (HTTP ${res.status})`;

                    showMsg(errMsg, false);
                } catch (e) {
                    console.error(e);
                    showMsg("서버 통신 오류가 발생했습니다.", false);
                }
            });
        });
    </script>
</th:block>
</body>
</html>
