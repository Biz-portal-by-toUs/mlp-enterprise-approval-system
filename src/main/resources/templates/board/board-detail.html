<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">

<th:block layout:fragment="pageStyles">
    <link rel="stylesheet" th:href="@{/css/styles1.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* (원본 CSS 그대로) */
        * { box-sizing: border-box; }
        .subbar-main { flex: 1; min-width: 0; padding: 24px; }
        h2 { margin: 0 0 14px; font-weight: 900; letter-spacing: -0.3px; }
        .card { background: var(--card, #ffffff); border: 1px solid rgba(17, 24, 39, .10); border-radius: 10px; box-shadow: 0 10px 24px rgba(17, 24, 39, .06); overflow: hidden; margin-bottom: 14px; }
        .summary-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .summary-table th, .summary-table td { border-top: 1px solid rgba(17, 24, 39, .08); padding: 14px 14px; vertical-align: middle; }
        .summary-table tr:first-child th, .summary-table tr:first-child td { border-top: 0; }
        .summary-table th { width: 160px; background: rgba(17, 24, 39, .02); font-weight: 900; color: #111827; text-align: center; letter-spacing: -0.2px; }
        .summary-table td { font-weight: 800; color: var(--text, #1f2937); }

        .contents-card { background: var(--card, #ffffff); border: 1px solid rgba(17, 24, 39, .10); border-radius: 10px; box-shadow: 0 10px 24px rgba(17, 24, 39, .06); overflow: hidden; margin-bottom: 14px; }
        .contents-body { padding: 18px; background: #fff; }
        #boardDescription { white-space: normal; line-height: 1.75; }
        #boardDescription .ProseMirror { outline: none; white-space: pre-wrap; line-height: 1.75; }
        #boardDescription h2 { margin: 12px 0 8px; font-size: 1.25rem; font-weight: 900; }
        #boardDescription p { margin: 8px 0; }
        #boardDescription ul, #boardDescription ol { padding-left: 22px; margin: 8px 0; }
        #boardDescription blockquote { margin: 10px 0; padding: 10px 12px; border-left: 4px solid rgba(59, 130, 246, .35); background: rgba(59, 130, 246, .06); border-radius: 10px; }
        #boardDescription pre { background: rgba(17, 24, 39, .06); padding: 12px; border-radius: 10px; overflow: auto; }
        #boardDescription code { background: rgba(17, 24, 39, .06); padding: 2px 6px; border-radius: 8px; font-weight: 800; }
        #boardDescription a { color: var(--primary2, #2563eb); font-weight: 900; text-decoration: underline; text-underline-offset: 3px; }
        #boardDescription table { border-collapse: collapse; width: 100%; table-layout: fixed; margin: 10px 0; }
        #boardDescription th, #boardDescription td { border: 1px solid rgba(17, 24, 39, .18); padding: 10px; vertical-align: top; word-break: break-word; position: relative; }
        #boardDescription th { background: rgba(17, 24, 39, .03); font-weight: 900; color: var(--muted, #6b7280); }
        #boardDescription .selectedCell:after { content: ""; position: absolute; inset: 0; background: rgba(59, 130, 246, .08); pointer-events: none; }

        .writer-wrap { display: inline-flex; align-items: center; gap: 8px; font-weight: 900; }
        .writer-btn { appearance: none; border: 0; background: transparent; padding: 0; cursor: pointer; color: var(--primary2, #2563eb); font-weight: 900; text-decoration: underline; text-underline-offset: 3px; }
        .writer-btn:focus { outline: none; }
        .tooltip-bubble { position: absolute; z-index: 50; min-width: 220px; max-width: 320px; padding: 10px 12px; border-radius: 12px; background: #111827; color: #fff; box-shadow: 0 16px 36px rgba(0, 0, 0, .18); border: 1px solid rgba(255, 255, 255, .12); transform: translateY(6px); opacity: 0; pointer-events: none; transition: opacity .15s ease, transform .15s ease; }
        .tooltip-bubble::before { content: ""; position: absolute; top: -7px; left: 18px; width: 12px; height: 12px; background: #111827; transform: rotate(45deg); border-left: 1px solid rgba(255, 255, 255, .12); border-top: 1px solid rgba(255, 255, 255, .12); }
        .tooltip-title { font-weight: 1000; margin-bottom: 6px; letter-spacing: -0.2px; }
        .tooltip-row { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; font-size: 13px; color: rgba(255, 255, 255, .92); }
        .tooltip-row span:first-child { color: rgba(255, 255, 255, .70); }
        .tooltip-host { position: relative; display: inline-flex; align-items: center; }
        .tooltip-host.show .tooltip-bubble { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .meta-inline { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: var(--muted, #6b7280); font-weight: 900; }
        .meta-inline .meta-item { display: inline-flex; align-items: center; gap: 8px; }
        .meta-inline .k { color: #111827; opacity: .65; font-weight: 900; }
        .meta-inline .v { color: #111827; font-weight: 1000; }

        .attach-card { background: var(--card, #ffffff); border: 1px solid rgba(17, 24, 39, .10); border-radius: 10px; box-shadow: 0 10px 24px rgba(17, 24, 39, .06); padding: 14px; margin-bottom: 14px; }
        .attach-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        .attach-title { margin: 0; font-size: 1.05rem; font-weight: 900; letter-spacing: -0.2px; }
        #attachList { width: 100%; border-collapse: separate; border-spacing: 0; overflow: hidden; border-radius: 10px; }
        #attachList th { text-align: left; font-size: .9rem; color: var(--muted, #6b7280); background: rgba(17, 24, 39, .03); padding: 12px; border-bottom: 1px solid rgba(17, 24, 39, .08); font-weight: 900; }
        #attachList td { padding: 12px; border-bottom: 1px solid rgba(17, 24, 39, .06); font-size: .95rem; color: var(--text, #1f2937); font-weight: 700; }
        #attachList tr:hover td { background: rgba(59, 130, 246, .05); }

        .btn { appearance: none; border: 1px solid rgba(17, 24, 39, .12); background: #fff; padding: 12px 18px; border-radius: 10px; font-weight: 900; color: var(--text, #1f2937); text-decoration: none; cursor: pointer; box-shadow: 0 8px 18px rgba(17, 24, 39, .06); transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease; display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(17, 24, 39, .10); border-color: rgba(59, 130, 246, .28); background: rgba(59, 130, 246, .05); }
        .btn-danger { background: linear-gradient(135deg, rgba(220, 38, 38, .14), rgba(255, 255, 255, 0)); border-color: rgba(220, 38, 38, .25); color: #991b1b; }
        .btn-danger:hover { background: rgba(220, 38, 38, .06); border-color: rgba(220, 38, 38, .40); }
        .btn-sm { padding: 8px 10px; font-weight: 900; border-radius: 8px; font-size: 12px; box-shadow: 0 6px 14px rgba(17, 24, 39, .05); }
        .actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

        @media (max-width: 720px) {
            .summary-table th { width: 110px; }
            .tooltip-bubble { left: 0 !important; right: auto !important; }
        }

        .comment-editor { background: var(--card, #ffffff); border: 1px solid rgba(17, 24, 39, .10); border-radius: 10px; box-shadow: 0 10px 24px rgba(17, 24, 39, .06); overflow: hidden; margin: 12px 0 14px; }
        .comment-editor textarea#commentContents { width: 100%; min-height: 120px; resize: vertical; border: 0; outline: none; padding: 14px 14px; background: #fff; color: var(--text, #1f2937); font-weight: 700; line-height: 1.65; }
        .comment-editor textarea#commentContents::placeholder { color: rgba(107, 114, 128, .9); font-weight: 800; }
        .comment-editor:focus-within { border-color: rgba(59, 130, 246, .35); box-shadow: 0 10px 24px rgba(17, 24, 39, .06), 0 0 0 4px rgba(59, 130, 246, .12); }

        .comment-editor__footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-top: 1px solid rgba(17, 24, 39, .10); background: rgba(17, 24, 39, .02); }
        .comment-editor__counter { font-weight: 900; color: var(--muted, #6b7280); letter-spacing: -0.1px; white-space: nowrap; }
        .comment-editor__counter #commentByte { color: #111827; font-weight: 1000; }
        .comment-editor__actions { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .comment-editor__actions .btn.btn-sm { padding: 8px 12px; min-height: 34px; }

        .comment-editor textarea#commentContents {
            width: 100%;
            height: 40px;
            min-height: 40px;
            max-height: 240px;
            resize: none;
            overflow: hidden;
            border: 0;
            outline: none;
            padding: 10px 14px;
            background: #fff;
            color: var(--text, #1f2937);
            font-weight: 700;
            line-height: 1.6;
            transition: height .18s ease, padding .18s ease;
        }
        .comment-editor textarea#commentContents:focus { height: 96px; }

        .card.card--overflow-visible{ overflow: visible; }
        #delete-btn{ display:none; }

        /* ==========================
           ✅ 댓글 카드형 UI 추가 (테이블 헤더 제거 + 작성자/부서 상단, 내용 아래)
           ========================== */
        #comment { background: var(--card, #ffffff); border: 1px solid rgba(17, 24, 39, .10); border-radius: 10px; box-shadow: 0 10px 24px rgba(17, 24, 39, .06); overflow: hidden; margin: 12px 0 14px; }

        #commentList { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

        .comment-item {
            border: 1px solid rgba(17, 24, 39, .10);
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 18px rgba(17, 24, 39, .04);
            padding: 12px 12px;
        }
        .comment-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }
        .comment-who {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .comment-who .name {
            font-weight: 1000;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .comment-who .dept {
            font-size: 12px;
            font-weight: 900;
            color: var(--muted, #6b7280);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .comment-date {
            font-size: 12px;
            font-weight: 900;
            color: var(--muted, #6b7280);
            white-space: nowrap;
        }
        .comment-actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .comment-body {
            margin-top: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            font-weight: 700;
            color: var(--text, #1f2937);
        }
        .comment-empty {
            padding: 18px 12px;
            color: var(--muted, #6b7280);
            font-weight: 900;
            text-align: center;
        }

        /* ============================================================
           ✅ PRINT: 인쇄 시 "게시글 상세 + 첨부 + 댓글"만, 용지 폭 꽉 채워 출력
           ============================================================ */
        @page{
            size: auto;
            margin: 3mm;
        }
        @media print{
            *{
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            html, body{
                background:#fff !important;
                margin:0 !important;
                padding:0 !important;
                width:100% !important;
            }

            body *{
                visibility: hidden !important;
            }

            #print-area,
            #print-area *{
                visibility: visible !important;
            }

            #print-area{
                position: fixed !important;
                left: 0 !important;
                top: 0 !important;
                right: 0 !important;
                width: 100vw !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
            }

            header, nav, footer, aside{ display:none !important; }
            [class*="sidebar" i],
            [class*="side-bar" i],
            [class*="sidenav" i],
            [class*="lnb" i],
            [class*="gnb" i],
            [id*="sidebar" i],
            [id*="side" i]{
                display:none !important;
            }

            .subbar-main,
            .container{
                width:100% !important;
                max-width:none !important;
                margin:0 !important;
                padding:0 !important;
                display:block !important;
            }

            #print-area .page-title{
                display:none !important;
            }

            .card, .contents-card, .attach-card, #comment{
                width:100% !important;
                max-width:none !important;
                box-shadow:none !important;
                border:1px solid #d1d5db !important;
                border-radius:0 !important;
                margin:0 0 4mm 0 !important;
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .contents-body{ padding:4mm !important; }
            .attach-card{ padding:4mm !important; }

            .summary-table,
            #attachList,
            #boardDescription table{
                width:100% !important;
                max-width:none !important;
                table-layout:fixed !important;
            }

            #boardWriter,
            #boardWriterBtn,
            .writer-btn{
                writing-mode: horizontal-tb !important;
                white-space: nowrap !important;
                word-break: keep-all !important;
                display: inline-block !important;
            }

            .tooltip-bubble{ display:none !important; }

            #attachList th:nth-child(4),
            #attachList td:nth-child(4),
            #attachList th:nth-child(5),
            #attachList td:nth-child(5){
                display:none !important;
            }

            /* 댓글 카드도 인쇄에 잘 나오게 */
            #commentList { padding: 0 !important; }
            .comment-item{
                border:1px solid #d1d5db !important;
                border-radius:0 !important;
                box-shadow:none !important;
                break-inside: avoid;
                page-break-inside: avoid;
            }
            /* 인쇄 시 삭제 버튼 숨김 */
            .comment-delete-btn{ display:none !important; }

            #commentEditor{ display:none !important; }
            .actions{ display:none !important; }

            #boardDescription .selectedCell:after{ background:transparent !important; }
            #boardDescription a{
                color:#111827 !important;
                text-decoration: underline !important;
            }
        }

        /* ✅ 부서 + 등록일을 같은 줄로 */
        .comment-sub{
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            font-size: 12px;
            font-weight: 900;
            color: var(--muted, #6b7280);
            white-space: nowrap;
        }

        .comment-sub .dot{
            opacity: .7;
        }

        /* ✅ 댓글 내용: 사원명 아래에서 살짝 오른쪽으로 들여쓰기 */
        .comment-body{
            margin-top: 8px;
            padding-left: 14px;   /* 여기 수치만 조절하면 됨(예: 10~18px) */
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            font-weight: 700;
            color: var(--text, #1f2937);
        }

        /* ✅ 사원명 · 부서 · 등록일 한 줄 */
        .comment-who-line{
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 900;
            color: #111827;
            white-space: nowrap;
        }

        .comment-who-line .comment-dept,
        .comment-who-line .comment-date{
            font-size: 12px;
            font-weight: 900;
            color: var(--muted, #6b7280);
        }

        .comment-who-line .dot{
            opacity: .6;
        }

        /* ✅ 댓글 내용: 바로 아래 + 살짝 들여쓰기 */
        .comment-body{
            margin-top: 0;        /* ⬇ 위쪽 여백 줄임 */
            padding-left: 18px;     /* ⬅ 들여쓰기는 유지 */
            padding-top: 0;       /* ⬇ 내부 세로 여백 최소화 */
            padding-bottom: 0;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.2;      /* ⬇ 줄간격 살짝 압축 */
            font-weight: 700;
            color: var(--text, #1f2937);
        }

        /* ✅ 사원명 · 부서 · 등록일 라인 여백 최소화 */
        .comment-who-line{
            margin-bottom: 0;   /* 🔥 기본 여백 제거 */
            padding-bottom: 0;
            line-height: 1.1;
        }

        .comment-top{
            margin-bottom: 0 !important;
            padding-bottom: 0 !important;
            align-items: flex-start; /* baseline 간격 제거 */
        }




    </style>
</th:block>

<div layout:fragment="content">
    <div class="page-with-subbar">
        <div th:replace="~{sidebar/board-sidebar :: boardSidebar('board')}"></div>
        <main class="subbar-main">
            <div class="container">
                <h2 class="page-title">자유게시판 상세</h2>

                <div id="print-area">
                    <div class="card">
                        <table class="summary-table">
                            <tr>
                                <th>제목</th>
                                <td><span id="boardTitle"></span></td>
                            </tr>
                            <tr>
                                <th>카테고리</th>
                                <td><span id="boardCategory"></span></td>
                            </tr>
                        </table>
                    </div>

                    <div class="contents-card">
                        <div class="contents-body">
                            <div id="boardDescription"></div>
                        </div>
                    </div>

                    <div class="card">
                        <table class="summary-table">
                            <tr>
                                <th>작성자</th>
                                <td>
                                  <span class="writer-wrap">
                                    <span class="tooltip-host" id="writerTooltipHost">
                                      <button type="button" class="writer-btn" id="boardWriterBtn">
                                        <span id="boardWriter">-</span>
                                      </button>
                                      <div class="card card--overflow-visible">
                                        <div class="tooltip-bubble" id="writerTooltip">
                                          <div class="tooltip-title">작성자 정보</div>
                                          <div class="tooltip-row"><span>부서</span><span id="boardDepart">-</span></div>
                                          <div class="tooltip-row" style="margin-top:6px;">
                                            <span>직번</span><span id="boardWriterId">-</span>
                                          </div>
                                        </div>
                                      </div>
                                    </span>
                                  </span>
                                </td>
                            </tr>
                            <tr>
                                <th>정보</th>
                                <td>
                                    <div class="meta-inline">
                                      <span class="meta-item">
                                        <span class="k">등록일</span><span class="v" id="boardCreated">-</span>
                                      </span>
                                        <span class="meta-item">
                                        <span class="k">조회</span><span class="v" id="boardRating">-</span>
                                      </span>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <div class="attach-card">
                        <div class="attach-head">
                            <h3 class="attach-title">첨부 파일</h3>
                        </div>
                        <table id="attachList"></table>
                    </div>

                    <h2 style="margin-top:18px;">관련 댓글</h2>
                    <div id="comment">
                        <!-- ✅ table 대신 div 컨테이너로 변경 (id 유지) -->
                        <div id="commentList"></div>
                    </div>
                </div>

                <div id="commentEditor" class="comment-editor">
                    <textarea id="commentContents" placeholder="의견입력" rows="5"></textarea>
                    <div class="comment-editor__footer">
                        <div class="comment-editor__counter">
                            <span id="commentByte">0</span>/600bytes
                        </div>
                        <div class="comment-editor__actions">
                            <button type="button" class="btn btn-sm" id="commentSubmitBtn">등록</button>
                            <button type="button" class="btn btn-sm" id="commentCancelBtn">취소</button>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button id="print-btn" class="btn" type="button" title="현재 게시글을 인쇄합니다">
                        <i class="fa-solid fa-print"></i> 프린트
                    </button>

                    <a href="/board/list" class="btn"><i class="fa-solid fa-list"></i> 목록</a>
                    <button id="delete-btn" class="btn btn-danger" type="button" style="display:none" onclick="deleteBoard()">
                        삭제
                    </button>
                </div>
            </div>
        </main>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- TipTap viewer (원본 그대로) -->
    <script type="module">
        import {Editor} from "https://esm.sh/@tiptap/core@2.11.5";
        import StarterKit from "https://esm.sh/@tiptap/starter-kit@2.11.5";
        import Underline from "https://esm.sh/@tiptap/extension-underline@2.11.5";
        import TextAlign from "https://esm.sh/@tiptap/extension-text-align@2.11.5";
        import Table from "https://esm.sh/@tiptap/extension-table@2.11.5";
        import TableRow from "https://esm.sh/@tiptap/extension-table-row@2.11.5";
        import TableHeader from "https://esm.sh/@tiptap/extension-table-header@2.11.5";
        import TableCell from "https://esm.sh/@tiptap/extension-table-cell@2.11.5";

        let viewer = null;

        function ensureViewer() {
            if (viewer) return viewer;
            const host = document.querySelector("#boardDescription");
            viewer = new Editor({
                element: host,
                editable: false,
                extensions: [
                    StarterKit,
                    Underline,
                    TextAlign.configure({types: ["heading", "paragraph"]}),
                    Table.configure({resizable: true}),
                    TableRow, TableHeader, TableCell,
                ],
                content: {type: "doc", content: [{type: "paragraph"}]},
            });
            return viewer;
        }

        function isProbablyJson(str) {
            if (typeof str !== "string") return false;
            const s = str.trim();
            if (!s) return false;
            if (!(s.startsWith("{") || s.startsWith("["))) return false;
            try {
                const obj = JSON.parse(s);
                return !!obj && typeof obj === "object" && (obj.type === "doc" || obj.content);
            } catch {
                return false;
            }
        }

        function isProbablyHtml(str) {
            if (typeof str !== "string") return false;
            const s = str.trim();
            if (!s) return false;
            return /<\/?[a-z][\s\S]*>/i.test(s);
        }

        function escapeHtml(str) {
            return String(str ?? "")
                .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        }

        window.renderBoardContentsAuto = (contents) => {
            const host = document.querySelector("#boardDescription");

            if (contents == null) {
                host.innerHTML = "<p>-</p>";
                return;
            }

            if (typeof contents === "object") {
                const ed = ensureViewer();
                ed.commands.setContent(contents);
                return;
            }

            const raw = String(contents);

            if (isProbablyJson(raw)) {
                const ed = ensureViewer();
                ed.commands.setContent(JSON.parse(raw));
                return;
            }

            if (isProbablyHtml(raw)) {
                if (viewer) {
                    viewer.destroy();
                    viewer = null;
                    host.innerHTML = "";
                }
                host.innerHTML = raw; // 서버 sanitize 권장
                return;
            }

            if (viewer) {
                viewer.destroy();
                viewer = null;
                host.innerHTML = "";
            }
            host.innerHTML = `<p>${escapeHtml(raw).replaceAll("\n", "<br>")}</p>`;
        };
    </script>

    <script th:inline="javascript">
        const boardNo = [[${boardNo}]];
        const API_BASE = "http://localhost:8090";

        const currentEmpId = /*[[${loginEmpId}]]*/ null;
        const isAdmin = /*[[${isAdmin}]]*/ false;

        console.log("currentEmpId", currentEmpId, "isAdmin", isAdmin);

        function setupWriterTooltip() {
            const host = document.getElementById("writerTooltipHost");
            const btn = document.getElementById("boardWriterBtn");

            function show() { host.classList.add("show"); }
            function hide() { host.classList.remove("show"); }
            function toggle() { host.classList.toggle("show"); }

            host.addEventListener("mouseenter", show);
            host.addEventListener("mouseleave", hide);

            btn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggle();
            });

            document.addEventListener("click", (e) => {
                if (!host.contains(e.target)) hide();
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") hide();
            });
        }

        async function loadBoardDetail() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/board/${boardNo}`, {
                    method: 'GET',
                    credentials: "include",
                    headers: {'Content-Type': 'application/json'}
                });

                const result = await response.json();

                if (result.status === 200 && result.data) {
                    const board = result.data;

                    $('#boardTitle').text(board.title ?? "-");
                    $('#boardCategory').text(board.catDescript ?? "-");

                    if (window.renderBoardContentsAuto) window.renderBoardContentsAuto(board.contents);
                    else $('#boardDescription').text(board.contents ?? "");

                    $('#boardWriter').text(board.empName ?? "-");
                    $('#boardWriterId').text(board.empId ?? "-");
                    $('#boardDepart').text(board.depName ?? "-");

                    $('#boardCreated').text(board.createdAt ? String(board.createdAt).substring(0, 10) : "-");
                    $('#boardRating').text(board.rating ?? "-");

                    initAttach();
                    initComment();
                    setupWriterTooltip();
                    updateDeleteButtonVisibility(board);
                }
            } catch (e) {
                console.error(e);
                alert("상세 로딩 중 오류가 발생했습니다.");
            }
        }

        function updateDeleteButtonVisibility(board) {
            const deleteBtn = document.getElementById("delete-btn");
            if (!deleteBtn) return;

            const isWriter =
                currentEmpId != null &&
                String(board.empId) === String(currentEmpId);

            if (isAdmin === true || isWriter) {
                deleteBtn.style.display = "inline-flex";
            } else {
                deleteBtn.style.display = "none";
            }
        }

        function unwrapMaybeResponseDto(obj) {
            if (obj && typeof obj === "object" && "data" in obj) return obj.data;
            return obj;
        }

        async function initAttach() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/attachments?domain=BOARD&entityId=${boardNo}`, {
                    method: 'GET',
                    credentials: "include",
                    headers: {'Content-Type': 'application/json'}
                });

                const result = await response.json();
                const attachList = $('#attachList').empty();

                if (result.status === 200 && result.data?.length) {
                    const attachs = result.data;

                    attachList.append(`
                      <tr>
                        <th style="width:90px;">번호</th>
                        <th>파일명</th>
                        <th style="width:120px;">size</th>
                        <th style="width:110px;">미리보기</th>
                        <th style="width:110px;">다운로드</th>
                      </tr>
                    `);

                    attachs.forEach((r, index) => {
                        attachList.append(`
                          <tr>
                            <td>${index + 1}</td>
                            <td>${escapeHtml(r.originalName)}</td>
                            <td>${formatFileSize(r.size)}</td>
                            <td><button type="button" class="btn btn-sm" data-view="${r.attachmentId}">미리보기</button></td>
                            <td><button type="button" class="btn btn-sm" data-down="${r.attachmentId}">다운로드</button></td>
                          </tr>
                        `);
                    });

                    document.querySelectorAll("button[data-down]").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            const attachmentId = Number(e.currentTarget.getAttribute("data-down"));
                            await downAttachment(attachmentId);
                        });
                    });

                    document.querySelectorAll("button[data-view]").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            const attachmentId = Number(e.currentTarget.getAttribute("data-view"));
                            await viewAttachment(attachmentId);
                        });
                    });

                } else {
                    attachList.html('<tr><td colspan="5">관련 첨부파일이 없습니다.</td></tr>');
                }
            } catch (e) {
                console.error(e);
            }
        }

        function escapeHtml(str) {
            return String(str ?? "")
                .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        }

        function formatFileSize(bytes) {
            if (bytes == null || isNaN(bytes)) return "-";
            if (bytes < 1024) return `${bytes} B`;
            const kb = bytes / 1024;
            if (kb < 1024) return `${kb.toFixed(1)} KB`;
            const mb = kb / 1024;
            return `${mb.toFixed(1)} MB`;
        }

        async function fetchDownloadUrl(attachmentId) {
            const res = await fetch(`${API_BASE}/api/v1/attachments/${attachmentId}/download-url`, {
                method: "GET",
                credentials: "include",
                headers: {'Accept': 'application/json'}
            });
            if (!res.ok) throw new Error("download-url 호출 실패: " + await res.text());
            const raw = await res.json();
            const data = unwrapMaybeResponseDto(raw);
            const url = data.url;
            if (typeof url !== "string" || !url.startsWith("http")) throw new Error("응답에 url이 없습니다.");
            return {url, meta: data};
        }

        async function fetchPreviewUrl(attachmentId) {
            const res = await fetch(`${API_BASE}/api/v1/attachments/${attachmentId}/preview-url`, {
                method: "GET",
                credentials: "include",
                headers: {'Accept': 'application/json'}
            });
            if (!res.ok) throw new Error("preview-url 호출 실패: " + await res.text());
            const raw = await res.json();
            const data = unwrapMaybeResponseDto(raw);
            const url = data.url;
            if (typeof url !== "string" || !url.startsWith("http")) throw new Error("응답에 url이 없습니다.");
            return {url, meta: data};
        }

        async function downAttachment(attachmentId) {
            if (!attachmentId) return;
            if (!confirm(`attachmentId=${attachmentId} 파일을 다운로드 할까요?`)) return;

            try {
                const {url, meta} = await fetchDownloadUrl(attachmentId);
                const a = document.createElement("a");
                a.href = url;
                a.rel = "noopener";
                a.download = meta.originalName || "";
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) {
                console.error(e);
                alert("다운로드 중 오류: " + (e?.message ?? e));
            }
        }

        async function viewAttachment(attachmentId) {
            if (!attachmentId) return;
            try {
                const {url} = await fetchPreviewUrl(attachmentId);
                window.open(url, "_blank", "noopener");
            } catch (e) {
                console.error(e);
                alert("미리보기 중 오류: " + (e?.message ?? e));
            }
        }

        async function deleteBoard() {
            if (!confirm("정말 삭제하시겠습니까?")) return;

            try {
                const res = await fetch(`/api/v1/board/${boardNo}`, {
                    method: "DELETE",
                    credentials: "include"
                });

                if (res.ok) {
                    alert("게시글이 삭제되었습니다.");
                    window.location.href = "/board/list";
                } else {
                    alert("삭제 실패했습니다.");
                }
            } catch (e) {
                console.error(e);
                alert("삭제 중 오류 발생");
            }
        }

        function canDeleteComment(c) {
            if (typeof c?.canDelete === "boolean") return c.canDelete;
            return (currentEmpId != null && String(c.empId) === String(currentEmpId)) || isAdmin === true;
        }

        /* ✅ 댓글 렌더링: 테이블 헤더 제거 + 작성자/부서 1줄 + 내용 아래 */
        async function initComment() {
            try {
                const res = await fetch(`${API_BASE}/api/v1/boards/${boardNo}/comments`, {
                    method: "GET",
                    credentials: "include",
                    headers: {"Accept": "application/json"}
                });

                const result = await res.json().catch(() => null);
                const commentList = $("#commentList").empty();

                if (!result?.data || result.data.length === 0) {
                    commentList.append(`<div class="comment-empty">등록된 댓글이 없습니다.</div>`);
                    return;
                }

                if (result.status === 200 && Array.isArray(result.data)) {
                    result.data.forEach((r) => {
                        const createdAt = r.createdAt ? String(r.createdAt).substring(0, 10) : "-";

                        const deleteBtnHtml = canDeleteComment(r)
                            ? `
                              <button type="button"
                                      class="btn btn-danger btn-sm comment-delete-btn"
                                      data-comment-no="${r.commentNo}">
                                   삭제
                              </button>
                            `
                            : ``;

                        commentList.append(`
                  <div class="comment-item">
    <div class="comment-top">
      <div class="comment-who-line">
        <span class="comment-name">${escapeHtml(r.empName ?? "-")}</span>
        <span class="dot">·</span>
        <span class="comment-dept">${escapeHtml(r.depName ?? "-")}</span>
        <span class="dot">·</span>
        <span class="comment-date">${createdAt}</span>
      </div>

      <div class="comment-actions">
        ${deleteBtnHtml}
      </div>
    </div>

    <div class="comment-body">
      ${escapeHtml(r.contents ?? "")}
    </div>
  </div>
                `);

                    });
                } else {
                    commentList.append(`<div class="comment-empty">댓글 로딩에 실패했습니다.</div>`);
                }
            } catch (e) {
                console.error("Failed to load board comments:", e);
                const commentList = $("#commentList").empty();
                commentList.append(`<div class="comment-empty">댓글 로딩 중 오류가 발생했습니다.</div>`);
            }
        }

        async function deleteComment(commentNo) {
            if (!commentNo) return;
            if (!confirm("정말 삭제하시겠습니까?")) return;

            try {
                const res = await fetch(`${API_BASE}/api/v1/comment/${commentNo}`, {
                    method: "DELETE",
                    credentials: "include"
                });

                if (res.ok) {
                    alert("댓글이 삭제되었습니다.");
                    await initComment();
                } else {
                    const msg = await res.text().catch(() => "");
                    if (res.status === 401) alert("로그인이 필요합니다.");
                    else if (res.status === 403) alert("삭제 권한이 없습니다.");
                    else alert("댓글 삭제 실패: " + (msg || res.status));
                }
            } catch (e) {
                console.error(e);
                alert("삭제 중 오류 발생");
            }
        }

        function bindCommentEvents() {
            $("#commentList").off("click", ".comment-delete-btn");
            $("#commentList").on("click", ".comment-delete-btn", function () {
                const commentNo = Number($(this).data("comment-no"));
                deleteComment(commentNo);
            });
        }

        function getUtf8Bytes(str) {
            return new Blob([str ?? ""], {type: "text/plain; charset=UTF-8"}).size;
        }

        function enforceByteLimit(text, limitBytes = 600) {
            if (!text) return "";
            let lo = 0, hi = text.length;
            while (lo < hi) {
                const mid = Math.ceil((lo + hi) / 2);
                const sliced = text.slice(0, mid);
                if (getUtf8Bytes(sliced) <= limitBytes) lo = mid;
                else hi = mid - 1;
            }
            return text.slice(0, lo);
        }

        function updateCommentByteCounter() {
            const ta = document.getElementById("commentContents");
            const counter = document.getElementById("commentByte");

            const limited = enforceByteLimit(ta.value, 600);
            if (limited !== ta.value) ta.value = limited;

            counter.textContent = String(getUtf8Bytes(ta.value));
        }

        async function submitComment() {
            const contentsEl = document.getElementById("commentContents");
            const contents = (contentsEl.value ?? "").trim();

            if (!contents) {
                alert("댓글 내용을 입력해주세요.");
                contentsEl.focus();
                return;
            }

            const fd = new FormData();
            fd.append("boardNo", String(boardNo));
            fd.append("contents", contents);

            try {
                const res = await fetch(`${API_BASE}/api/v1/comment`, {
                    method: "POST",
                    credentials: "include",
                    body: fd
                });

                const json = await res.json().catch(() => null);

                if (!res.ok) {
                    console.error("댓글 등록 실패:", res.status, json);
                    alert("댓글 등록 실패: " + (json?.message ?? res.statusText));
                    return;
                }

                alert(json?.message ?? "댓글 등록 성공");
                contentsEl.value = "";
                updateCommentByteCounter();
                await initComment();
            } catch (e) {
                console.error(e);
                alert("댓글 등록 중 오류: " + (e?.message ?? e));
            }
        }

        function cancelComment() {
            const contentsEl = document.getElementById("commentContents");
            contentsEl.value = "";
            updateCommentByteCounter();
        }

        function setupPrintButton(){
            const btn = document.getElementById("print-btn");
            if (!btn) return;
            btn.addEventListener("click", () => window.print());
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadBoardDetail();

            const ta = document.getElementById("commentContents");
            const submitBtn = document.getElementById("commentSubmitBtn");
            const cancelBtn = document.getElementById("commentCancelBtn");

            if (ta) {
                ta.addEventListener("input", updateCommentByteCounter);
                updateCommentByteCounter();
            }
            if (submitBtn) submitBtn.addEventListener("click", submitComment);
            if (cancelBtn) cancelBtn.addEventListener("click", cancelComment);

            bindCommentEvents();
            setupPrintButton();
        });

        (function autoGrowCommentTextarea() {
            const ta = document.getElementById("commentContents");
            if (!ta) return;

            const COLLAPSED = 40;
            const EXPANDED = 96;
            const MAX = 240;

            function resize() {
                ta.style.height = "auto";
                ta.style.height = Math.min(ta.scrollHeight, MAX) + "px";
            }

            ta.addEventListener("focus", () => {
                if (!ta.value.trim()) ta.style.height = EXPANDED + "px";
            });

            ta.addEventListener("input", resize);

            ta.addEventListener("blur", () => {
                if (!ta.value.trim()) ta.style.height = COLLAPSED + "px";
            });
        })();
    </script>
</th:block>

</html>
