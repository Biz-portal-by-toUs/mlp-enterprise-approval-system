<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>결재함 (대기/반려)</title>

    <style>
        :root {
            --bg: #f4f6fb;
            --card: #fff;
            --line: #e1e3ea;
            --text: #111827;
            --muted: #6b7280;
            --primary: #2c5cff;
            --danger: #ff4d4f;
            --ok: #16a34a;
            --warn: #f59e0b;
        }
        * { box-sizing: border-box }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .wrap { width: min(1250px, calc(100% - 32px)); margin: 28px auto; }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .06);
        }
        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 18px 18px 12px;
        }
        .title { font-size: 18px; font-weight: 900; margin: 0; }
        .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
        .actions { display: flex; gap: 10px; align-items: center; }
        .btn {
            border: 1px solid var(--line);
            background: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 800;
            white-space: nowrap;
        }
        .btn.primary { background: var(--primary); color: #fff; border-color: transparent; }
        .btn.ok { background: var(--ok); color: #fff; border-color: transparent; }
        .btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
        .btn.warn { background: var(--warn); color: #111827; border-color: transparent; }
        .btn.sm { padding: 7px 10px; border-radius: 9px; font-weight: 900; font-size: 12px; }
        .btn:disabled { opacity: .55; cursor: not-allowed }
        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 0 18px 14px;
            align-items: center;
        }
        .select {
            border: 1px solid var(--line);
            background: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            outline: none;
            min-width: 160px;
        }
        .rightHint { margin-left: auto; color: var(--muted); font-size: 13px; }
        code.k { background: #1118270d; padding: 2px 6px; border-radius: 6px; }

        .table-wrap { padding: 0 18px 18px; }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 12px;
        }
        thead th {
            background: #fafbff;
            text-align: left;
            font-size: 13px;
            color: #374151;
            padding: 12px 10px;
            border-bottom: 1px solid var(--line);
        }
        tbody td {
            padding: 12px 10px;
            border-bottom: 1px solid #f0f1f6;
            font-size: 14px;
            vertical-align: middle;
        }
        tbody tr:hover { background: #fbfcff; }
        .muted { color: var(--muted); font-size: 13px; }
        .titleLink {
            color: inherit;
            text-decoration: none;
            font-weight: 900;
            cursor: pointer;
        }
        .titleLink:hover { color: var(--primary); text-decoration: underline; }

        .statPill {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 999px;
            font-weight: 900;
            font-size: 12px;
            border: 1px solid var(--line);
        }
        .statPill.P { background: #fff7ed; border-color: #fed7aa; color: #9a3412; } /* pending */
        .statPill.R { background: #fff1f2; border-color: #fecdd3; color: #9f1239; } /* reject */
        .statPill.A { background: #f0fdf4; border-color: #bbf7d0; color: #166534; } /* approve */

        .row-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
        }

        .pager {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: flex-end;
            padding: 10px 18px 18px;
        }
        .pager .info { margin-right: auto; color: var(--muted); font-size: 13px; }
        .pager-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .pager-controls .num { min-width: 42px; text-align: center; }
        .pager-controls .num.active {
            background: var(--primary);
            color: #fff;
            border-color: transparent;
        }

        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            background: #111827;
            color: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            opacity: 0;
            transform: translateY(8px);
            transition: .18s;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>

<body>
<div class="wrap card">
    <div class="header">
        <div>
            <h1 class="title">결재함 (대기/반려)</h1>
            <p class="sub">
                이 페이지는 <code class="k">P(대기)</code> 와 <code class="k">R(반려)</code> 문서를 조회해요.<br/>
                승인/반려 처리 후에는 목록이 자동 갱신됩니다.
            </p>
        </div>
        <div class="actions">
            <button class="btn" id="btnRefresh">새로고침</button>
        </div>
    </div>

    <div class="toolbar">
        <select class="select" id="statMode">
            <option value="PR" selected>대기(P) + 반려(R)</option>
            <option value="P">대기(P)만</option>
            <option value="R">반려(R)만</option>
        </select>

        <select class="select" id="size">
            <option value="15" selected>15개</option>
            <option value="30">30개</option>
        </select>

        <div class="rightHint">
            API: <code class="k" id="apiLabel">/api/v1/forms</code>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th style="width:120px;">번호</th>
                <th>제목</th>
                <th style="width:220px;">작성자</th>
                <th style="width:120px;">상태</th>
                <th style="width:260px; text-align:right;">처리</th>
            </tr>
            </thead>
            <tbody id="tbody">
            <tr>
                <td colspan="5" class="muted">로딩 중...</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pager">
        <div class="info" id="pageInfo">-</div>
        <div class="pager-controls" id="pagerControls"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- ✅ 스크립트 분리 -->
<script src="/js/document-form/pending-list.js"></script>
</body>
</html>
