<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Cloud</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* ✅ subbar 도킹 페이지처럼 padding 제거 */
            .content-wrap:has(.cloud-page) {
                padding: 0;
            }

            .cloud-page {
                height: calc(100vh - var(--topbar-h) - var(--footer-h));
                background: var(--bg);
            }

            .cloud-page .page-with-subbar {
                display: grid;
                grid-template-columns: 220px 1fr;
                min-height: calc(100vh - var(--topbar-h) - var(--footer-h));
            }

            /* ✅ subbar를 cloud 페이지에서만 flex column으로 */
            .cloud-page .subbar {
                display: flex;
                flex-direction: column;
            }

            .cloud-page .page-with-subbar > .subbar + * {
                padding: 0;
                min-width: 0;
            }

            /* ====== sidebar: 탭 ====== */
            .cloud-scope-tabs {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                padding: 10px 12px 12px;
                border-bottom: 1px solid rgba(59, 130, 246, .14);
                background: rgba(255, 255, 255, .30);
            }

            .cloud-scope-tab {
                height: 34px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 10px;
                text-decoration: none;
                font-weight: 900;
                font-size: 13px;
                color: #1d4ed8;
                background: rgba(59, 130, 246, .12);
                border: 1px solid rgba(59, 130, 246, .10);
            }

            .cloud-scope-tab:hover {
                background: rgba(59, 130, 246, .18);
            }

            .cloud-scope-tab.active {
                background: var(--primary);
                color: #fff;
                border-color: transparent;
            }

            .cloud-page .label {
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                min-width: 0;
            }

            .cloud-page .node,
            .cloud-page .file-node {
                min-width: 0;
            }

            /* ====== ✅ sidebar footer(휴지통) 고정 ====== */
            .cloud-subbar {
                display: flex;
                flex-direction: column;
                height: 100%;
                min-height: 0;
            }

            .cloud-tree-panel {
                flex: 1;
                overflow: auto;
                min-height: 0;
                padding: 10px 10px 12px;
            }

            .cloud-sidebar-footer {
                flex: 0 0 auto;
                padding: 10px 12px 12px;
                border-top: 1px solid rgba(59, 130, 246, .14);
                background: rgba(255, 255, 255, .30);
            }

            .cloud-footer-link {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 36px;
                border-radius: 10px;
                text-decoration: none;
                font-weight: 900;
                font-size: 13px;
                color: #1d4ed8;
                background: rgba(59, 130, 246, .12);
                border: 1px solid rgba(59, 130, 246, .10);
            }

            .cloud-footer-link:hover {
                background: rgba(59, 130, 246, .18);
            }

            /* ====== sidebar: 트리 ====== */
            .cloud-tree {
                list-style: none;
                margin: 0;
                padding: 0;
            }

            .cloud-tree li {
                list-style: none;
                margin: 0;
            }

            .cloud-tree .children {
                padding-left: 14px;
                margin: 0;
            }

            .cloud-page .node {
                display: grid;
                grid-template-columns: 12px 26px 1fr;
                align-items: center;
                gap: 1px;
                padding: 5px 5px;
                border-radius: 10px;
                cursor: pointer;
                color: rgba(31, 41, 55, .88);
                font-weight: 800;
                user-select: none;
            }

            .cloud-page .node > :nth-child(3) {
                margin-left: 3px;
            }

            .cloud-page .node:hover {
                background: rgba(59, 130, 246, .10);
            }

            .cloud-page .node.selected {
                background: rgba(59, 130, 246, .16);
                color: #1d4ed8;
            }

            .cloud-page .caret {
                font-size: 17px;
                opacity: .85;
            }

            .cloud-page .folder-ico {
                width: 30px;
                height: 30px;
                background: url("/images/icons/folder-small.png") center/contain no-repeat;
            }

            /* ====== 오른쪽(상단 바 + 본문) ====== */
            .cloud-main {
                display: flex;
                flex-direction: column;
                min-width: 0;
                background: var(--bg);
            }

            .cloud-topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 16px 18px;
                background: #fff;
                border-bottom: 1px solid rgba(17, 24, 39, .08);
            }

            .cloud-title {
                font-size: 24px;
                font-weight: 900;
                color: var(--text);
                margin: 0;
            }

            .cloud-actions {
                display: flex;
                gap: 10px;
                align-items: center;
            }

            .cloud-actions .btn {
                height: 34px;
                padding: 0 12px;
                border-radius: 10px;
                border: 1px solid rgba(17, 24, 39, .10);
                background: #fff;
                font-weight: 900;
                cursor: pointer;
                color: var(--text);
            }

            .cloud-actions .btn.primary {
                border: 0;
                background: var(--primary);
                color: #fff;
            }

            .cloud-actions .btn.primary:hover {
                background: var(--primary2);
            }

            .cloud-actions .btn:disabled {
                opacity: .5;
                cursor: not-allowed;
            }

            .cloud-body {
                flex: 1;
                overflow: auto;
                padding: 18px;
            }

            /* ====== 파일/폴더 영역 ====== */
            .file-grid {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-content: flex-start;
            }

            .folder-card, .file-card {
                width: 110px;
                padding: 8px 6px;
                border: 1px solid transparent;
                border-radius: 10px;
                background: transparent;
                text-align: center;
                cursor: pointer;
            }

            .folder-card:hover, .file-card:hover {
                background: rgba(59, 130, 246, .10);
                border-color: rgba(59, 130, 246, .18);
            }

            .file-card.selected {
                background: rgba(59, 130, 246, .16);
                border-color: rgba(59, 130, 246, .45);
            }

            .folder-card.drop {
                background: rgba(59, 130, 246, .10);
                border-color: rgba(59, 130, 246, .35);
            }

            .folder-ico-large, .file-ico {
                width: 84px;
                height: 84px;
                margin: 0 auto 6px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .folder-ico-large {
                background: url("/images/icons/folder-large.png") center/contain no-repeat;
            }

            .file-ico img {
                width: 180%;
                height: 180%;
                object-fit: contain;
                display: block;
            }

            .folder-name, .file-name {
                font-size: 12px;
                font-weight: 800;
                color: #111827;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .file-size {
                margin-top: 2px;
                font-size: 11px;
                color: var(--muted);
                font-weight: 700;
            }

            .file-name-edit {
                width: 100%;
                margin-top: 6px;
                font-size: 12px;
                padding: 5px 6px;
                border-radius: 8px;
                border: 1px solid rgba(17, 24, 39, .14);
                outline: none;
                background: #fff;
            }

            .empty {
                color: var(--muted);
                font-weight: 800;
                padding: 10px 0;
            }

            /* ====== ✅ 우클릭 컨텍스트 메뉴 ====== */
            .cloud-ctx {
                position: fixed;
                z-index: 9999;
                min-width: 170px;
                background: #fff;
                border: 1px solid rgba(17, 24, 39, .10);
                border-radius: 12px;
                box-shadow: 0 14px 30px rgba(0, 0, 0, .16);
                padding: 6px;
                display: none;
            }

            .cloud-ctx.open {
                display: block;
            }

            .cloud-ctx button {
                width: 100%;
                border: 0;
                background: transparent;
                text-align: left;
                padding: 10px 10px;
                border-radius: 10px;
                font-weight: 900;
                cursor: pointer;
                color: #111827;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
            }

            .cloud-ctx button:hover {
                background: rgba(59, 130, 246, .10);
            }

            .cloud-ctx button:disabled {
                opacity: .45;
                cursor: not-allowed;
            }

            .cloud-ctx .danger {
                color: #b91c1c;
            }

            .cloud-ctx .sep {
                height: 1px;
                background: rgba(17, 24, 39, .08);
                margin: 6px 4px;
                border-radius: 999px;
            }

            /* ✅ 트리 안 파일 노드 */
            .cloud-page .file-node {
                display: grid;
                grid-template-columns: 12px 26px 1fr;
                align-items: center;
                gap: 1px;
                padding: 5px 5px;
                border-radius: 10px;
                cursor: pointer;
                color: rgba(31, 41, 55, .88);
                font-weight: 800;
                user-select: none;
            }

            .cloud-page .file-node:hover {
                background: rgba(59, 130, 246, .10);
            }

            .cloud-page .file-node.selected {
                background: rgba(59, 130, 246, .16);
                color: #1d4ed8;
            }

            .cloud-page .file-ico-small {
                width: 22px;
                height: 22px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .cloud-page .file-ico-small img {
                width: 44px;
                height: 44px;
                object-fit: contain;
                display: block;
            }

            .cloud-page .node.drop {
                background: rgba(59, 130, 246, .10);
                border: 1px solid rgba(59, 130, 246, .35);
            }

            .folder-card.selected {
                background: rgba(59, 130, 246, .16);
                border-color: rgba(59, 130, 246, .45);
            }

            /* ====== ✅ 그리드 선택 체크박스(hover/selected 시 표시) ====== */
            .folder-card, .file-card {
                position: relative; /* 체크박스 absolute 기준 */
            }

            /* 체크 UI */
            .card-check {
                position: absolute;
                top: 6px;
                left: 6px;
                width: 18px;
                height: 18px;
                border-radius: 6px;
                border: 2px solid rgba(59, 130, 246, .55);
                background: rgba(255, 255, 255, .92);
                display: none; /* 기본 숨김 */
                align-items: center;
                justify-content: center;
                box-shadow: 0 6px 14px rgba(0, 0, 0, .12);
                pointer-events: none; /* 클릭 방해 X */
            }

            /* 체크 표시 */
            .card-check::after {
                content: "✓";
                font-size: 12px;
                font-weight: 900;
                line-height: 1;
                color: #fff;
                opacity: 0; /* 선택 안되면 체크 숨김 */
            }

            /* hover면 박스만 보임 */
            .folder-card:hover .card-check,
            .file-card:hover .card-check {
                display: flex;
            }

            /* selected면 박스 + 체크 표시 */
            .folder-card.selected .card-check,
            .file-card.selected .card-check {
                display: flex;
                background: var(--primary);
                border-color: transparent;
            }

            .folder-card.selected .card-check::after,
            .file-card.selected .card-check::after {
                opacity: 1;
            }

            .cloud-tree-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                padding: 8px 10px;
            }

            .cloud-tree-tools {
                display: flex;
                gap: 6px;
            }

            .tree-tool {
                height: 26px;
                width: 26px;
                border-radius: 8px;
                border: 1px solid rgba(17, 24, 39, .12);
                background: #fff;
                font-weight: 900;
                cursor: pointer;
            }

            .tree-tool:hover {
                background: rgba(59, 130, 246, .10);
            }

            /* ✅ 폴더 children 애니메이션 */
            .cloud-tree .children {
                overflow: hidden;
                max-height: 0;
                opacity: 0;
                transition: max-height .20s ease, opacity .15s ease;
                will-change: max-height, opacity;
            }

            /* 열렸을 때 opacity만 1로 (max-height는 JS에서 scrollHeight로 설정) */
            .cloud-tree .children.open {
                opacity: 1;
            }

            /* ✅ 그리드 컨테이너가 내용만큼 늘어나지 않게 "높이 고정" */
            .cloud-page .page-with-subbar{
                height: calc(100vh - var(--topbar-h) - var(--footer-h));
                min-height: 0;
            }

            /* ✅ Grid item들이 overflow를 허용하도록(기본 min-height:auto 때문에 스크롤이 안 생기는 케이스 방지) */
            .cloud-page .page-with-subbar > .subbar,
            .cloud-page .page-with-subbar > .cloud-main{
                min-height: 0;
            }

            /* ✅ 사이드바 내부에서만 스크롤이 생기도록 부모는 overflow 숨김 */
            .cloud-page .subbar{
                height: 100%;
                min-height: 0;
                overflow: hidden;
            }

            /* ✅ 트리 영역: 세로/가로 스크롤 */
            .cloud-tree-panel{
                overflow-y: auto;
                overflow-x: auto;
                min-height: 0;
            }

            /* ✅ 깊은 폴더(들여쓰기 누적)에서 가로 스크롤이 뜨게 */
            .cloud-tree{
                min-width: max-content; /* 내용이 넓어지면 가로 스크롤 */
            }

            /* (선택) 스크롤 튐 방지 느낌 */
            .cloud-tree-panel{
                overscroll-behavior: contain;
            }

            /* ✅ SweetAlert가 컨텍스트 메뉴/레이어보다 위에 뜨도록 */
            .swal2-container{
                z-index: 3000000 !important;
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content" class="cloud-page">
    <div class="page-with-subbar">

        <!-- ✅ 왼쪽 sidebar -->
        <th:block th:replace="~{sidebar/cloud-sidebar :: cloudSidebar(${active})}"></th:block>

        <!-- ✅ 오른쪽 -->
        <section class="cloud-main">
            <div class="cloud-topbar">
                <h1 class="cloud-title" id="breadcrumb"
                    th:text="${active}=='prvt' ? '개인함' : '공유함'">공유함</h1>

                <div class="cloud-actions">
                    <button class="btn primary" id="btnUpload">파일 업로드</button>
                    <button class="btn" id="btnDownload" disabled>파일 다운로드</button>
                    <button class="btn" id="btnDeleteSelected" disabled>선택 삭제</button>
                    <input type="file" id="fileInput" multiple style="display:none"/>
                </div>
            </div>

            <div class="cloud-body">
                <div class="file-grid" id="fileGrid"></div>
            </div>
        </section>

    </div>

    <!-- ✅ 우클릭 메뉴 DOM -->
    <div class="cloud-ctx" id="cloudCtx" role="menu" aria-label="폴더 메뉴">
        <button type="button" id="ctxCreate" role="menuitem">
            <span id="ctxCreateLabel">폴더 생성</span>
            <span style="opacity:.6;font-weight:800;">+</span>
        </button>
        <div class="sep"></div>
        <button type="button" id="ctxRename" role="menuitem">이름 변경</button>
        <button type="button" id="ctxDelete" role="menuitem" class="danger">삭제</button>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">

        /* =========================
           SweetAlert2 helpers
           ========================= */
        const SWAL_PRIMARY = getComputedStyle(document.documentElement)
            .getPropertyValue("--primary")
            .trim() || "#4f8fe3";

        function swalInfo(text, title="알림") {
            return Swal.fire({ icon: "info", title, text, confirmButtonColor: SWAL_PRIMARY });
        }
        function swalSuccess(text, title="완료") {
            return Swal.fire({ icon: "success", title, text, confirmButtonColor: SWAL_PRIMARY });
        }
        function swalWarn(text, title="확인") {
            return Swal.fire({ icon: "warning", title, text, confirmButtonColor: SWAL_PRIMARY });
        }
        function swalError(text, title="오류") {
            return Swal.fire({ icon: "error", title, text, confirmButtonColor: SWAL_PRIMARY });
        }
        function swalLoading(title="처리 중...", text="잠시만 기다려 주세요.") {
            return Swal.fire({
                title,
                text,
                allowOutsideClick: false,
                allowEscapeKey: false,
                didOpen: () => Swal.showLoading()
            });
        }

        async function swalConfirm({
                                       title="진행할까요?",
                                       text="",
                                       icon="warning",
                                       confirmText="확인",
                                       cancelText="취소"
                                   } = {}) {
            const res = await Swal.fire({
                icon,
                title,
                text,
                showCancelButton: true,
                confirmButtonText: confirmText,
                cancelButtonText: cancelText,
                confirmButtonColor: SWAL_PRIMARY
            });
            return res.isConfirmed;
        }

        async function swalPrompt({
                                      title="입력",
                                      text="",
                                      inputValue="",
                                      placeholder="",
                                      confirmText="확인",
                                      cancelText="취소",
                                      required=true
                                  } = {}) {
            const res = await Swal.fire({
                title,
                text,
                input: "text",
                inputValue,
                inputPlaceholder: placeholder,
                showCancelButton: true,
                confirmButtonText: confirmText,
                cancelButtonText: cancelText,
                confirmButtonColor: SWAL_PRIMARY,
                inputValidator: (v) => {
                    if (!required) return null;
                    if (!v || !String(v).trim()) return "값을 입력해주세요.";
                    return null;
                }
            });
            return res.isConfirmed ? String(res.value ?? "").trim() : null;
        }

        function toastSuccess(title) {
            return Swal.fire({
                toast: true,
                position: "top-end",
                icon: "success",
                title,
                showConfirmButton: false,
                timer: 1400,
                timerProgressBar: true
            });
        }

        // ✅ 공유함 페이지 단위 fetch 관리
        const PAGE = {
            alive: true,
            ac: new AbortController()
        };

        // 페이지를 떠나는 순간: 진행중 요청 취소
        window.addEventListener('pagehide', () => {
            PAGE.alive = false;
            try { PAGE.ac.abort(); } catch(e) {}
        });

        // fetch 래퍼
        function pageFetch(url, opts = {}) {
            return fetch(url, { ...opts, signal: PAGE.ac.signal });
        }

        // 이동/취소로 생기는 에러면 무시
        function isAbortLike(err){
            if (!err) return false;
            if (err.name === 'AbortError') return true;
            const msg = String(err.message || '');
            return !PAGE.alive && (
                msg.includes('Failed to fetch') ||
                msg.includes('Load failed') ||
                msg.includes('NetworkError') ||
                msg.includes('The operation was aborted')
            );
        }

        /* ==========================================================
           ✅ 1) 이 페이지에서만 fetch를 자동으로 PAGE.ac.signal에 묶기
              - try/catch 없는 기존 fetch들도 자동으로 abort됨
           ========================================================== */
        (() => {
            const _fetch = window.fetch.bind(window);

            window.fetch = (input, init = {}) => {
                // 이미 signal 있으면 존중
                if (init && init.signal) return _fetch(input, init);

                // 이 페이지의 AbortController signal 주입
                return _fetch(input, { ...init, signal: PAGE.ac.signal });
            };
        })();

        /* ==========================================================
           ✅ 2) try/catch 없는 fetch에서 터지는 unhandled rejection 처리
              - "페이지 떠나는 중 abort성 실패"만 조용히 무시
              - 진짜 오류는 그대로 남김(알림/콘솔 유지)
           ========================================================== */
        window.addEventListener('unhandledrejection', (ev) => {
            const err = ev.reason;
            if (isAbortLike(err)) {
                ev.preventDefault(); // 콘솔에 Uncaught(…)/Failed to fetch 뜨는거 방지
                return;
            }
        });

        window.addEventListener('error', (ev) => {
            // 일부 브라우저는 네트워크 실패를 error 이벤트로도 던짐
            const msg = String(ev.message || '');
            if (!PAGE.alive && (msg.includes('Failed to fetch') || msg.includes('Load failed'))) {
                ev.preventDefault();
            }
        }, true);

        /** ====== 상태 ====== */
        const state = {
            scope: /*[[${scope}]]*/ "dept",
            selectedFolderNo: null,
            selectedFolderName: null,
            selectedAttachmentId: null,

            ctxFolderNo: null,
            ctxFolderName: null,
            ctxOriginalName: null,

            treeIndex: {
                nodeById: new Map(),
                caretById: new Map(),
                childrenById: new Map(),
                parentById: new Map(),
            },

            selection: {
                folderNos: new Set(),      // 현재 그리드에서 선택된 폴더들
                attachmentIds: new Set(),  // 현재 그리드에서 선택된 파일들
                lastClickedIndex: null,    // SHIFT range 선택용
            },

            ctxKind: null,              // "blank" | "folder" | "file"
            ctxAttachmentId: null,
        };

        /** ====== 엘리먼트 ====== */
        const el = {
            treeRoot: document.getElementById("treeRoot"),

            breadcrumb: document.getElementById("breadcrumb"),
            btnUpload: document.getElementById("btnUpload"),
            btnDownload: document.getElementById("btnDownload"),
            btnDeleteSelected: document.getElementById("btnDeleteSelected"),
            fileInput: document.getElementById("fileInput"),
            fileGrid: document.getElementById("fileGrid"),

            ctx: document.getElementById("cloudCtx"),
            ctxCreate: document.getElementById("ctxCreate"),
            ctxCreateLabel: document.getElementById("ctxCreateLabel"),
            ctxRename: document.getElementById("ctxRename"),
            ctxDelete: document.getElementById("ctxDelete"),
        };

        /** ====== fetch helper ====== */
        async function apiJson(url, opt = {}) {
            console.log("[API] request", opt?.method || "GET", url, opt?.body || "");

            const res = await fetch(url, {
                credentials: "include",
                headers: { "Content-Type": "application/json", ...(opt.headers || {}) },
                ...opt,
            });

            const text = await res.text();

            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch (e) {}

            console.log("[API] response", res.status, url, json);

            if (res.status === 401) {
                await swalWarn("로그인이 만료되었습니다. 다시 로그인해 주세요.", "로그인 필요");
                location.href = "/auth/employee/login";
                throw new Error("UNAUTHORIZED");
            }

            if (res.status === 403) {
                const code = json?.code || json?.errorCode;
                const msg  = json?.message || json?.error || text || "";

                // ✅ 폴더 삭제 금지 케이스만 메시지 커스텀
                if (code === "FOLDER_DELETE_FORBIDDEN" || msg.includes("FOLDER_DELETE_FORBIDDEN")) {
                    throw new Error("폴더를 만든 사람만 삭제가 가능합니다.");
                }

                // (선택) 폴더 rename도 같이
                if (code === "FOLDER_RENAME_FORBIDDEN" || msg.includes("FOLDER_RENAME_FORBIDDEN")) {
                    throw new Error("폴더를 만든 사람만 이름 변경이 가능합니다.");
                }

                // ✅ CSRF 느낌이면 따로 안내(선택)
                if (String(msg).toLowerCase().includes("csrf")) {
                    throw new Error("보안 토큰(CSRF) 검증에 실패했습니다. 새로고침 후 다시 시도해 주세요.");
                }

                // 나머지 403은 서버 메시지 우선
                throw new Error(msg || "권한이 없습니다.");
            }

            if (!res.ok) {
                throw new Error(json?.message || json?.error || text || res.statusText);
            }

            return json && "data" in json ? json.data : json;
        }

        /** ====== URL helpers ====== */
        function folderBase() {
            return state.scope === "dept" ? "/api/v1/folders/dept" : "/api/v1/folders/prvt";
        }

        function folderListUrl(parentId) {
            const qs = parentId == null ? "" : `?parentId=${encodeURIComponent(parentId)}`;
            return folderBase() + qs;
        }

        function attachmentListUrl(folderNo) {
            return `/api/v1/attachments?domain=CLOUD&entityId=${encodeURIComponent(folderNo)}`;
        }

        const UPLOAD = {
            presign: "/api/v1/attachments/presign",
            complete: "/api/v1/attachments/complete",
        };

        /** ====== 유틸 ====== */
        function short20(name) {
            const s = String(name ?? "");
            return s.length > 20 ? s.slice(0, 20) + "…" : s;
        }

        function humanBytes(n) {
            if (n == null) return "";
            let v = Number(n);
            const units = ["B", "KB", "MB", "GB", "TB"];
            let i = 0;
            while (v >= 1024 && i < units.length - 1) {
                v /= 1024;
                i++;
            }
            return `${v.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
        }


        /** ====== breadcrumb ====== */
        function setBreadcrumbFromNode(nodeEl) {
            const rootLabel = state.scope === "dept" ? "공유함" : "개인함";
            const folders = [];
            let cur = nodeEl;

            while (cur && cur.classList.contains("node")) {
                const name = cur.dataset.folderName;
                if (name) folders.push(name);
                cur = cur.parentElement?.parentElement?.parentElement?.querySelector(":scope > .node");
            }

            folders.reverse();
            el.breadcrumb.textContent = [rootLabel, ...folders].join(" > ");
        }

        state.gridLoadSeq = 0;

        /** ====== 오른쪽: 폴더/파일 렌더 ====== */
        async function loadFolderContent(folderNo) {
            if (!folderNo) return;

            const seq = ++state.gridLoadSeq;   // 이번 요청 번호(최신)

            el.fileGrid.innerHTML = "";
            clearGridSelection();


            const [folders, files] = await Promise.all([
                apiJson(folderListUrl(folderNo)),
                apiJson(attachmentListUrl(folderNo)),
            ]);

            console.log("[LIST grid] folders", folderNo, folders?.map(x => x.folderNo));
            // 중복 체크
            const ids = (folders || []).map(x => x.folderNo);
            const dup = ids.filter((v, i) => ids.indexOf(v) !== i);
            if (dup.length) console.warn("[LIST grid] DUP folderNo", dup);

            // ✅ 내가 최신 요청이 아니면 렌더하지 않고 종료
            if (seq !== state.gridLoadSeq) return;

            const hasFolders = folders && folders.length > 0;
            const hasFiles = files && files.length > 0;

            if (!hasFolders && !hasFiles) {
                const div = document.createElement("div");
                div.className = "empty";
                div.textContent = "파일이 없습니다.";
                el.fileGrid.appendChild(div);
                return;
            }

            if (hasFolders) renderFolderCards(folders);
            if (hasFiles) renderFileCards(files);
        }

        function renderFolderCards(folders) {
            console.log("[RENDER grid] count", folders?.length, folders?.map(f => f.folderNo));

            folders.forEach(f => {
                const card = document.createElement("div");
                card.className = "folder-card";
                card.dataset.folderNo = f.folderNo;

                const check = document.createElement("div");
                check.className = "card-check";
                card.appendChild(check);

                card.addEventListener("contextmenu", (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    // 우클릭한 폴더를 단일 선택으로 맞춤
                    clearGridSelection();
                    card.classList.add("selected");
                    state.selection.folderNos.add(Number(card.dataset.folderNo));
                    updateActionButtons();

                    // rename/delete 대상(폴더)
                    state.selectedFolderNo = f.folderNo;
                    state.selectedFolderName = f.folderName;

                    openCtxMenu(e.clientX, e.clientY, {
                        kind: "folder",
                        folderNo: f.folderNo,
                        folderName: f.folderName,
                    });
                });

                const ico = document.createElement("div");
                ico.className = "folder-ico-large";

                const name = document.createElement("div");
                name.className = "folder-name";
                name.textContent = f.folderName;

                card.appendChild(ico);
                card.appendChild(name);

                card.addEventListener("click", (e) => {
                    e.stopPropagation();

                    // ✅ 더블클릭이면 "열기"
                    if (e.detail === 2) {
                        (async () => {
                            state.treeIndex.parentById.set(f.folderNo, state.selectedFolderNo);

                            state.selectedFolderNo = f.folderNo;
                            state.selectedFolderName = f.folderName;

                            await loadFolderContent(f.folderNo);
                            await syncTreeToFolder(f.folderNo);
                        })().catch(err => swalError(err.message || "오류"));
                        return;
                    }

                    // ✅ 단일클릭이면 "선택 토글"
                    const isToggle = e.ctrlKey || e.metaKey;
                    const isRange = e.shiftKey;

                    const cards = Array.from(el.fileGrid.querySelectorAll(".folder-card, .file-card"));
                    const idx = cards.indexOf(card);

                    if (!isToggle && !isRange) {
                        clearGridSelection();
                    }

                    if (isRange && state.selection.lastClickedIndex != null) {
                        const [a, b] = [state.selection.lastClickedIndex, idx].sort((x, y) => x - y);
                        for (let i = a; i <= b; i++) {
                            const c = cards[i];
                            if (!c) continue;
                            if (c.classList.contains("folder-card")) {
                                c.classList.add("selected");
                                state.selection.folderNos.add(Number(c.dataset.folderNo));
                            } else if (c.classList.contains("file-card")) {
                                c.classList.add("selected");
                                state.selection.attachmentIds.add(Number(c.dataset.attachmentId));
                            }
                        }
                    } else {
                        const id = Number(card.dataset.folderNo);
                        if (state.selection.folderNos.has(id)) {
                            state.selection.folderNos.delete(id);
                            card.classList.remove("selected");
                        } else {
                            state.selection.folderNos.add(id);
                            card.classList.add("selected");
                        }
                    }

                    state.selection.lastClickedIndex = idx;
                    updateActionButtons();
                });

                card.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    card.classList.add("drop");
                });
                card.addEventListener("dragleave", () => card.classList.remove("drop"));

                card.addEventListener("drop", async (e) => {
                    e.preventDefault();
                    card.classList.remove("drop");

                    const attachmentId = Number(e.dataTransfer.getData("text/plain"));
                    const dragScope = e.dataTransfer.getData("cloud-scope");
                    const fromFolderNoRaw = e.dataTransfer.getData("fromFolderNo");
                    const fromFolderNo = fromFolderNoRaw ? Number(fromFolderNoRaw) : null;

                    if (!attachmentId) return;

                    if (dragScope && dragScope !== state.scope) {
                        swalWarn("공유함 파일은 공유함에서만, 개인함 파일은 개인함에서만 이동 가능합니다.");
                        return;
                    }

                    const toFolderNo = f.folderNo;

                    try {
                        await apiJson(`/api/v1/attachments/${attachmentId}/move?toFolderNo=${toFolderNo}`, {method: "POST"});
                        if (state.selectedFolderNo) await loadFolderContent(state.selectedFolderNo);
                        if (fromFolderNo != null) await refreshTreeChildren(fromFolderNo);
                        await refreshTreeChildren(toFolderNo);
                    } catch (err) {
                        if (String(err.message || "").includes("UNAUTHORIZED")) return;
                        swalError(err.message || "이동 실패");
                    }
                });

                el.fileGrid.appendChild(card);
            });
        }

        function clearGridSelection() {
            state.selection.folderNos.clear();
            state.selection.attachmentIds.clear();
            state.selection.lastClickedIndex = null;

            el.fileGrid.querySelectorAll(".selected").forEach(x => x.classList.remove("selected"));
            updateActionButtons();
        }

        function updateActionButtons() {
            const fileCount = state.selection.attachmentIds.size;
            const anySelected = fileCount > 0 || state.selection.folderNos.size > 0;

            // 다운로드: 파일이 1개 이상 선택돼야 가능
            el.btnDownload.disabled = fileCount < 1;
            el.btnDownload.textContent = (fileCount <= 1)
                ? "파일 다운로드"
                : `ZIP 다운로드 (${fileCount})`;

            // 선택 삭제: 뭐라도 선택되면
            el.btnDeleteSelected.disabled = !anySelected;
        }

        // 기존 clearFileSelection()은 멀티 선택과 충돌나서, 아래처럼 "그리드 선택 초기화"로 대체 추천
        function clearFileSelection() {
            // (호환용) 기존 코드가 호출하니까 내부는 멀티 선택 초기화로 연결
            clearGridSelection();
        }

                        for (let i = aIdx; i <= bIdx; i++) {

                            if (c.classList.contains("folder-card")) {

        /** ====== 왼쪽 트리 로딩 ====== */
        async function loadChildren(parentId, containerUl) {
            const folders = await apiJson(folderListUrl(parentId));
            console.log("[LIST tree] parentId", parentId, folders?.map(x => x.folderNo));

            const ids = (folders || []).map(x => x.folderNo);
            const dup = ids.filter((v, i) => ids.indexOf(v) !== i);
            if (dup.length) console.warn("[LIST tree] DUP folderNo", dup);

            const files = parentId == null ? [] : await apiJson(attachmentListUrl(parentId));

            containerUl.innerHTML = "";

            const hasFolders = Array.isArray(folders) && folders.length > 0;
            const hasFiles = Array.isArray(files) && files.length > 0;

            if (!hasFolders && !hasFiles) {
                const li = document.createElement("li");
                li.className = "empty";
                li.textContent = parentId == null ? "폴더가 없습니다." : "파일이 없습니다.";
                containerUl.appendChild(li);

                containerUl.dataset.loaded = "1";
                return;
            }

            // ===== 폴더 렌더 =====
            if (hasFolders) {
                for (const f of folders) {
                    const li = document.createElement("li");

                    const node = document.createElement("div");
                    node.className = "node";
                    node.dataset.folderNo = f.folderNo;
                    node.dataset.folderName = f.folderName;

                    const caret = document.createElement("div");
                    caret.className = "caret";
                    caret.textContent = "▸";

                    const ico = document.createElement("div");
                    ico.className = "folder-ico";

                    const label = document.createElement("div");
                    label.className = "label";
                    label.textContent = f.folderName;

                    node.appendChild(caret);
                    node.appendChild(ico);
                    node.appendChild(label);

                    const children = document.createElement("ul");
                    children.className = "children";
                    children.style.display = "none";
                    children.style.maxHeight = "0px";
                    children.classList.remove("open");

                    state.treeIndex.nodeById.set(f.folderNo, node);
                    state.treeIndex.caretById.set(f.folderNo, caret);
                    state.treeIndex.childrenById.set(f.folderNo, children);
                    state.treeIndex.parentById.set(f.folderNo, parentId);

                    // ✅ 클릭: 폴더 열기/닫기 + lazy load
                    node.addEventListener("click", (e) => {
                        e.stopPropagation();
                        closeCtxMenu();

                        document.querySelectorAll(".node.selected, .file-node.selected")
                            .forEach(x => x.classList.remove("selected"));
                        node.classList.add("selected");

                        state.selectedFolderNo = f.folderNo;
                        state.selectedFolderName = f.folderName;
                        setBreadcrumbFromNode(node);

                        loadFolderContent(f.folderNo).catch(err => swalError(err.message || "조회 실패"));

                        const opened = children.classList.contains("open");
                        if (opened) {
                            closeChildren(children, caret);
                            return;
                        }

                        // 1) UI는 즉시 열기
                        openChildren(children, caret);

                        // 2) 내용은 비동기로 채움
                        (async () => {
                            if (children.dataset.loaded !== "1") {
                                children.innerHTML = `<li class="empty">로딩중…</li>`;
                                await loadChildren(f.folderNo, children);
                            }
                            openChildren(children, caret);
                        })().catch(err => {
                            closeChildren(children, caret);
                            swalError(err.message || "조회 실패");
                        });
                    });

                    // ✅ 우클릭(컨텍스트 메뉴) — 반드시 루프 안!
                    node.addEventListener("contextmenu", async (e) => {
                        e.preventDefault();
                        e.stopPropagation();

                        document.querySelectorAll(".node.selected, .file-node.selected")
                            .forEach(x => x.classList.remove("selected"));
                        node.classList.add("selected");

                        state.selectedFolderNo = f.folderNo;
                        state.selectedFolderName = f.folderName;

                        setBreadcrumbFromNode(node);
                        await loadFolderContent(f.folderNo);

                        openCtxMenu(e.clientX, e.clientY, {
                            kind: "folder",
                            folderNo: f.folderNo,
                            folderName: f.folderName,
                        });
                    });

                    // ✅ 드래그 드롭(파일 이동)
                    node.addEventListener("dragover", (e) => { e.preventDefault(); node.classList.add("drop"); });
                    node.addEventListener("dragleave", () => node.classList.remove("drop"));
                    node.addEventListener("drop", async (e) => {
                        e.preventDefault();
                        node.classList.remove("drop");

                        const attachmentId = Number(e.dataTransfer.getData("text/plain"));
                        const dragScope = e.dataTransfer.getData("cloud-scope");
                        const fromFolderNoRaw = e.dataTransfer.getData("fromFolderNo");
                        const fromFolderNo = fromFolderNoRaw ? Number(fromFolderNoRaw) : null;

                        if (!attachmentId) return;

                        if (dragScope && dragScope !== state.scope) {
                            await swalWarn("공유함 파일은 공유함에서만, 개인함 파일은 개인함에서만 이동 가능합니다.");
                            return;
                        }

                        const toFolderNo = f.folderNo;

                        try {
                            await apiJson(`/api/v1/attachments/${attachmentId}/move?toFolderNo=${toFolderNo}`, { method: "POST" });
                            if (state.selectedFolderNo) await loadFolderContent(state.selectedFolderNo);
                            if (fromFolderNo != null) await refreshTreeChildren(fromFolderNo);
                            await refreshTreeChildren(toFolderNo);
                        } catch (err) {
                            if (String(err.message || "").includes("UNAUTHORIZED")) return;
                            swalError(err.message || "이동 실패");
                        }
                    });

                    li.appendChild(node);
                    li.appendChild(children);
                    containerUl.appendChild(li);
                }
            }

            // ===== 파일 렌더(폴더 안) =====
            if (hasFiles) {
                for (const a of files) {
                    const li = document.createElement("li");
                    const fileNode = document.createElement("div");
                    fileNode.className = "file-node";
                    fileNode.draggable = true;
                    fileNode.dataset.attachmentId = a.attachmentId;

                    const blank = document.createElement("div");
                    blank.className = "caret";
                    blank.textContent = "";

                    const ico = document.createElement("div");
                    ico.className = "file-ico-small";
                    const img = document.createElement("img");
                    img.src = resolveFileIcon(a);
                    img.alt = "파일";
                    ico.appendChild(img);

                    const fullName = a.originalName || ("file-" + a.attachmentId);
                    const label = document.createElement("div");
                    label.className = "label";
                    label.textContent = short20(fullName);

                    fileNode.addEventListener("click", (e) => {
                        e.stopPropagation();

                        document.querySelectorAll(".node.selected, .file-node.selected")
                            .forEach(x => x.classList.remove("selected"));
                        fileNode.classList.add("selected");

                        clearGridSelection();
                        state.selection.attachmentIds.add(Number(a.attachmentId));
                        updateActionButtons();

                        if (parentId != null) state.selectedFolderNo = parentId;

                        swalInfo(fullName, "파일명");
                    });

                    fileNode.addEventListener("dragstart", (e) => {
                        e.dataTransfer.setData("text/plain", String(a.attachmentId));
                        e.dataTransfer.setData("cloud-scope", state.scope);
                        e.dataTransfer.setData("fromFolderNo", String(parentId ?? ""));
                    });

                    fileNode.appendChild(blank);
                    fileNode.appendChild(ico);
                    fileNode.appendChild(label);

                    li.appendChild(fileNode);
                    containerUl.appendChild(li);
                }
            }
            containerUl.dataset.loaded = "1";
        }


        async function initTree() {
            state.selectedFolderNo = null;
            state.selectedFolderName = null;
            state.treeIndex.nodeById.clear();
            state.treeIndex.caretById.clear();
            state.treeIndex.childrenById.clear();
            state.treeIndex.parentById.clear();

            el.breadcrumb.textContent = state.scope === "dept" ? "공유함" : "개인함";
            clearFileSelection();
            el.fileGrid.innerHTML = "";
            await loadChildren(null, el.treeRoot);
        }

        async function refreshTreeChildren(folderNo) {
            if (folderNo == null) {
                await refreshRootPreserveOpen();
                return;
            }

            const childrenUl = state.treeIndex.childrenById.get(folderNo);
            if (!childrenUl) return;

            const caret = state.treeIndex.caretById.get(folderNo);
            const wasOpen = childrenUl.classList.contains("open");

            await loadChildren(folderNo, childrenUl);

            if (wasOpen) {
                openChildren(childrenUl, caret);
            } else {
                // 닫힌 상태 유지(표시만)
                if (caret) caret.textContent = "▸";
                childrenUl.style.display = "none";
                childrenUl.style.maxHeight = "0px";
                childrenUl.classList.remove("open");
            }
        }

        /** ====== 폴더 CRUD ====== */
        async function createFolder() {
            const name = await swalPrompt({
                title: "폴더 생성",
                text: "새 폴더명을 입력해주세요.",
                placeholder: "폴더 이름"
            });
            if (!name) return;

            const parent = state.selectedFolderNo;

            swalLoading("생성 중...");
            try {
                await apiJson(folderBase(), {
                    method: "POST",
                    body: JSON.stringify({ parentId: parent, folderName: name }),
                });

                Swal.close();
                await refreshTreeChildren(parent);

        /** ====== zip 다운로드 헬퍼 ====== */
        function filenameFromDisposition(disposition) {
            if (!disposition) return null;
            let m = disposition.match(/filename\*\=UTF-8''([^;]+)/i);
            if (m && m[1]) return decodeURIComponent(m[1]);
            m = disposition.match(/filename="?([^"]+)"?/i);
            if (m && m[1]) return m[1];
            return null;
        }

        async function downloadZip(fileIds) {
            const res = await fetch("/api/files/download-zip", {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fileIds, zipName: null }),
            });

            if (!res.ok) {
                const text = await res.text();
                throw new Error(text || res.statusText);
            }

            const blob = await res.blob();
            const cd = res.headers.get("Content-Disposition");
            const filename = filenameFromDisposition(cd) || "files.zip";

            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function uploadOneFile(file) {
            const fileType = file.type && file.type.startsWith("image") ? "IMAGE" : "DOC";

            const presign = await apiJson(UPLOAD.presign, {
                method: "POST",
                body: JSON.stringify({
                    domain: "CLOUD",
                    entityId: state.selectedFolderNo,
                    originalName: file.name,
                    contentType: file.type || "application/octet-stream",
                    size: file.size,
                    fileType,
                }),
            });

            const putRes = await fetch(presign.uploadUrl, {
                method: "PUT",
                headers: {"Content-Type": file.type || "application/octet-stream"},
                body: file,
            });
            if (!putRes.ok) throw new Error("S3 업로드 실패");

            await apiJson(UPLOAD.complete, {
                method: "POST",
                body: JSON.stringify({
                    domain: "CLOUD",
                    entityId: state.selectedFolderNo,
                    fileType,
                    objectKey: presign.objectKey,
                    originalName: file.name,
                    contentType: file.type || "application/octet-stream",
                    size: file.size,
                    etag: null,
                }),
            });
        }

        /** ====== 아이콘 결정 ====== */
        function resolveFileIcon(a) {
            const ICONS = {
                word: "/images/icons/word.png",
                excel: "/images/icons/excel.png",
                ppt: "/images/icons/PPT.png",
                pdf: "/images/icons/PDF.png",
                image: "/images/icons/image-large.png",
                zip: "/images/icons/zip.png",
                code: "/images/icons/code.png",
                unknown: "/images/icons/unknown.png",
            };

            const EXT_GROUPS = {
                word: ["doc", "docx"],
                excel: ["xls", "xlsx", "csv"],
                ppt: ["ppt", "pptx"],
                pdf: ["pdf"],
                image: ["png", "jpg", "jpeg", "gif", "webp", "svg", "bmp", "tif", "tiff", "heic"],
                zip: ["zip", "rar", "7z", "tar", "gz", "bz2", "xz"],
                code: ["js", "ts", "jsx", "tsx", "html", "css", "scss", "less", "json", "xml", "yml", "yaml", "md",
                    "py", "java", "c", "cpp", "h", "hpp", "go", "rs", "php", "rb", "kt", "swift", "sh", "ps1", "sql"],
            };

            const name = (a?.originalName || "").trim();
            let ext = (a?.ext || "").toLowerCase();
            if (!ext && name.includes(".")) ext = name.split("?")[0].split("#")[0].split(".").pop().toLowerCase();

            let type = "unknown";
            for (const [k, arr] of Object.entries(EXT_GROUPS)) {
                if (arr.includes(ext)) {
                    type = k;
                    break;
                }
            }
            return ICONS[type] || ICONS.unknown;
        }

        function openChildren(ul, caret) {
            if (!ul) return;

            // display를 block으로 만들어야 scrollHeight 측정 가능
            ul.style.display = "block";
            ul.classList.add("open");

            // max-height가 none이면(완전 열린 상태) 다시 닫고 열 때를 위해 초기화
            if (ul.style.maxHeight === "none") ul.style.maxHeight = "0px";

            // 다음 프레임에 높이 적용 → transition 동작
            requestAnimationFrame(() => {
                ul.style.maxHeight = ul.scrollHeight + "px";
            });

            // 열림 표시
            if (caret) caret.textContent = "▾";

            // 트랜지션 끝나면 max-height를 none으로 풀어줘야
            // 안에서 더 로드/추가될 때 잘 늘어남
            const onEnd = (e) => {
                if (e.propertyName !== "max-height") return;
                ul.style.maxHeight = "none";
                ul.removeEventListener("transitionend", onEnd);
            };
            ul.addEventListener("transitionend", onEnd);
        }

        function closeChildren(ul, caret) {
            if (!ul) return;

            // max-height가 none이면 현재 높이로 고정 후 0으로 내려야 애니메이션 됨
            const currentH = ul.scrollHeight;

            ul.style.maxHeight = currentH + "px";
            ul.classList.remove("open");

            requestAnimationFrame(() => {
                ul.style.maxHeight = "0px";
            });

            if (caret) caret.textContent = "▸";

            // 닫힘 애니메이션 끝나면 display none 처리
            const onEnd = (e) => {
                if (e.propertyName !== "max-height") return;
                ul.style.display = "none";
                ul.removeEventListener("transitionend", onEnd);
            };
            ul.addEventListener("transitionend", onEnd);
        }

        // ✅ 확장자 추출 유틸
        function getExt(filename) {
            const s = String(filename ?? "").trim();
            const base = s.split("?")[0].split("#")[0];
            const dot = base.lastIndexOf(".");
            // ".gitignore" 같이 맨 앞 점만 있는 케이스는 확장자 취급 안 함
            if (dot <= 0 || dot === base.length - 1) return "";
            return base.slice(dot + 1).toLowerCase();
        }

        async function ensureExpanded(folderNo) {
            const childrenUl = state.treeIndex.childrenById.get(folderNo);

            if (!childrenUl || !caret) return;

            if (childrenUl.classList.contains("open")) return;

            }
            openChildren(childrenUl, caret);

        async function syncTreeToFolder(targetFolderNo) {
            if (!targetFolderNo) return;

            const path = [];
            let cur = targetFolderNo;
            const seen = new Set();

            while (cur != null && !seen.has(cur)) {
                seen.add(cur);
                path.push(cur);
                cur = state.treeIndex.parentById.get(cur);
            }
            path.reverse();

            for (let i = 0; i < path.length - 1; i++) {
                await ensureExpanded(path[i]);
            }

            document.querySelectorAll(".node.selected, .file-node.selected")
                .forEach(x => x.classList.remove("selected"));

            const node = state.treeIndex.nodeById.get(targetFolderNo);
            if (node) {
                await ensureExpanded(targetFolderNo);
                node.classList.add("selected");
                node.scrollIntoView({block: "nearest"});
                setBreadcrumbFromNode(node);
            }
        }

        function snapshotExpanded() {
            const expanded = [];
            for (const [id, ul] of state.treeIndex.childrenById.entries()) {
                if (ul && ul.classList.contains("open")) expanded.push(id);
            }
            return expanded;
        }

        async function restoreExpanded(expanded) {
            for (const id of expanded) {
                await ensureExpanded(id);
            }
        }

        async function refreshRootPreserveOpen() {
            const expanded = snapshotExpanded();
            const selected = state.selectedFolderNo;

            await loadChildren(null, el.treeRoot);

            await restoreExpanded(expanded);
            if (selected) await syncTreeToFolder(selected);
        }

        /** ====== 초기화 ====== */
        window.addEventListener("DOMContentLoaded", () => {
            initTree().catch(e => swalError(e.message || "초기화 실패"));
        });
    </script>
</th:block>

</body>
</html>
