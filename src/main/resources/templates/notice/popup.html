<!DOCTYPE html>
<html lang="en">
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <title>Main</title>
    <style>
        /* --- modal basic styles --- */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .popup-modal {
            width: min(520px, 92vw);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            overflow: hidden;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }
        .popup-header {
            padding: 14px 16px;
            background: #f6f7f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid #e7e9ee;
        }
        .popup-title {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #111;
        }
        .popup-body {
            padding: 16px;
            max-height: 55vh;
            overflow: auto;
            color: #222;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .popup-footer {
            padding: 12px 16px;
            border-top: 1px solid #e7e9ee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #fff;
        }
        .popup-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .btn {
            border: 1px solid #d0d7de;
            background: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn.primary {
            border-color: #2563eb;
            background: #2563eb;
            color: #fff;
        }
        .btn.close-x {
            border: none;
            background: transparent;
            font-size: 18px;
            cursor: pointer;
            color: #444;
        }
        .popup-meta {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

<a th:href="@{/notice/list}" class="nav-item">공지사항목록</a>
<a th:href="@{/boards/list}" class="nav-item">자유게시판목록</a>
<a th:href="@{/notice/files}">파일 다운로드/보기</a>

<!-- Modal -->
<div id="popupOverlay" class="popup-overlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div class="popup-modal">
        <div class="popup-header">
            <h3 id="popupTitle" class="popup-title">공지</h3>
            <button class="btn close-x" type="button" aria-label="Close" onclick="closePopup()">×</button>
        </div>

        <div id="popupBody" class="popup-body">
            <!-- contents -->
        </div>

        <div class="popup-footer">
            <div class="popup-meta">
                <span id="popupCounter"></span>
            </div>

            <div class="popup-actions">
                <button class="btn" type="button" onclick="hideToday()">오늘 하루 보지 않기</button>
                <button class="btn" type="button" onclick="nextPopup()">다음</button>
                <button class="btn primary" type="button" onclick="closePopup()">닫기</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ====== config ======
    const API_URL = "http://localhost:8090/api/v1/notices-popup";

    // ====== state ======
    let popupList = [];
    let currentIndex = 0;

    // 유틸: 오늘 끝(23:59:59)까지의 epoch(ms)
    function endOfTodayMs() {
        const now = new Date();
        const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        return end.getTime();
    }

    // 유틸: noticeNo별 오늘 하루 숨김 체크
    function isHiddenToday(noticeNo) {
        const key = `popup_notice_${noticeNo}_hide_until`;
        const until = Number(localStorage.getItem(key) || "0");
        return Date.now() < until;
    }

    // 유틸: startedAt/endedAt 범위 필터(선택)
    function isWithinPeriod(item) {
        if (!item.startedAt || !item.endedAt) return true;
        const now = Date.now();
        const start = new Date(item.startedAt).getTime();
        const end = new Date(item.endedAt).getTime();
        return now >= start && now <= end;
    }

    function openPopup() {
        document.getElementById("popupOverlay").style.display = "flex";
    }

    function closePopup() {
        document.getElementById("popupOverlay").style.display = "none";
        // 필요하면 상태 초기화
        // popupList = []; currentIndex = 0;
    }

    function renderPopup(index) {
        if (!popupList.length) {
            closePopup();
            return;
        }
        if (index < 0 || index >= popupList.length) {
            closePopup();
            return;
        }

        const item = popupList[index];

        // contents가 문자열 JSON 형태: "{\"text\": \"공지 내용6\"}"
        let text = "";
        try {
            const obj = (typeof item.contents === "string") ? JSON.parse(item.contents) : item.contents;
            text = obj?.text ?? String(item.contents ?? "");
        } catch (e) {
            // 파싱 실패 시 원문 출력
            text = String(item.contents ?? "");
        }

        document.getElementById("popupTitle").textContent = item.title ?? `공지 #${item.noticeNo}`;
        document.getElementById("popupBody").textContent = text;

        document.getElementById("popupCounter").textContent =
            `${index + 1} / ${popupList.length} (noticeNo: ${item.noticeNo})`;

        openPopup();
    }

    function nextPopup() {
        // 다음 보여줄 항목 찾기
        for (let i = currentIndex + 1; i < popupList.length; i++) {
            currentIndex = i;
            renderPopup(currentIndex);
            return;
        }
        // 끝이면 닫기
        closePopup();
    }

    function hideToday() {
        const item = popupList[currentIndex];
        if (!item) return;

        const key = `popup_notice_${item.noticeNo}_hide_until`;
        localStorage.setItem(key, String(endOfTodayMs()));

        // 현재 팝업은 넘기기
        nextPopup();
    }

    async function loadPopups() {
        try {
            const token = localStorage.getItem('accessToken');
            const res = await fetch(API_URL, {
                method: "GET",
                headers: { 'Authorization': `Bearer ${token}`, "Accept": "application/json" }
            });

            if (!res.ok) {
                console.error("API error:", res.status);
                return;
            }

            const json = await res.json();
            const data = Array.isArray(json.data) ? json.data : [];

            // 1) isPopup=true 2) 기간 내 3) 오늘 숨김 제외
            popupList = data
                .filter(item => item && item.isPopup === true)
                .filter(isWithinPeriod)
                .filter(item => !isHiddenToday(item.noticeNo));

            if (!popupList.length) return;

            // 첫 항목부터 보여주기
            currentIndex = 0;
            renderPopup(currentIndex);

        } catch (err) {
            console.error("Failed to load popups:", err);
        }
    }

    // 페이지 로드 시 자동 실행
    window.addEventListener("DOMContentLoaded", loadPopups);

    // overlay 클릭 시 닫기(원하면)
    document.getElementById("popupOverlay").addEventListener("click", (e) => {
        if (e.target.id === "popupOverlay") closePopup();
    });

    // ESC로 닫기
    window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closePopup();
    });
</script>
</body>
</html>
</html>
