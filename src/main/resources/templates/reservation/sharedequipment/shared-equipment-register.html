<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>공유 설비 등록</title>

    <!-- 이 페이지 전용 CSS -->
    <th:block layout:fragment="pageStyles">
        <style>
            .shared-eq-create-page {
                padding: 24px 26px;
                background: #f4f6f8;
                min-height: 100%;
                display: flex;
                justify-content: center;
                align-items: flex-start;
            }

            .shared-eq-create-page .card {
                width: 520px;
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.12);
                padding: 28px;
            }

            .shared-eq-create-page .form-inner {
                max-width: 420px;
                margin: 0 auto;
            }

            .shared-eq-create-page input,
            .shared-eq-create-page textarea {
                width: 100%;
                box-sizing: border-box;
            }

            .shared-eq-create-page h2 {
                margin-top: 0;
                text-align: center;
            }

            .shared-eq-create-page .field {
                margin-bottom: 14px;
            }

            .shared-eq-create-page label {
                display: block;
                font-size: 13px;
                margin-bottom: 6px;
                color: #555;
            }

            .shared-eq-create-page input,
            .shared-eq-create-page textarea {
                width: 100%;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #ddd;
                font-size: 14px;
            }

            .shared-eq-create-page textarea { resize: none; }

            .shared-eq-create-page .btns {
                display: flex;
                gap: 10px;
                margin-top: 18px;
            }

            .shared-eq-create-page button {
                flex: 1;
                padding: 10px;
                border-radius: 8px;
                border: none;
                font-size: 14px;
                cursor: pointer;
            }

            .shared-eq-create-page .submit {
                background: #1677ff;
                color: #fff;
            }

            .shared-eq-create-page .cancel {
                background: #e5e7eb;
            }

            .shared-eq-create-page .preview-box {
                width: 100%;
                height: 220px;
                background: #e5e7eb;
                border-radius: 12px;
                overflow: hidden;
                margin-top: 10px;
            }

            .shared-eq-create-page .preview-box img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: none;
            }

            /* ===== 회의실 등록 페이지 방식 참고: 힌트/카운터/에러/UI ===== */
            .hint-row{
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-top:6px;
                gap:10px;
            }

            .hint{
                color:#6b7280;
                font-size:12px;
            }

            .counter{
                color:#6b7280;
                font-size:12px;
                font-variant-numeric: tabular-nums;
            }

            .error{
                display:block;
                margin-top:6px;
                color:#ef4444;
                font-size:12px;
                font-weight:600;
            }

            .input-invalid{
                border-color:#ef4444 !important;
                box-shadow: 0 0 0 3px rgba(239,68,68,.12);
            }

            /* ✅ SweetAlert가 다른 레이어보다 위에 뜨도록 */
            .swal2-container{
                z-index: 3000000 !important;
            }

            /* 버튼 톤 통일(회의실 등록과 동일하게 primary 사용) */
            .shared-eq-create-page .submit{
                background: var(--primary);
                color:#fff;
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <!-- 🔹 왼쪽: 예약 서브 사이드바 (공유 설비 예약 active) -->
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('equipment')"></aside>

        <!-- 🔹 오른쪽: 공유 설비 등록 화면 -->
        <div class="shared-eq-create-page">
            <div class="card">
                <h2>공유 설비 등록</h2>

                <form id="eqForm" enctype="multipart/form-data">

                    <!-- ✅ 설비명: 카운터+에러 적용 -->
                    <div class="field">
                        <label>설비명</label>
                        <input type="text" name="eqName" id="eqName" maxlength="20" required>
                        <div class="hint-row">
                            <small class="hint">최대 20자까지 입력 가능</small>
                            <small class="counter" id="eqNameCounter">0 / 20</small>
                        </div>
                        <small class="error" id="eqNameError" style="display:none;"></small>
                    </div>

                    <!-- ✅ 설비번호: 카운터+에러 적용 -->
                    <div class="field">
                        <label>설비번호</label>
                        <input type="text" name="eqId" id="eqId" maxlength="20">
                        <div class="hint-row">
                            <small class="hint">최대 20자까지 입력 가능</small>
                            <small class="counter" id="eqIdCounter">0 / 20</small>
                        </div>
                        <small class="error" id="eqIdError" style="display:none;"></small>
                    </div>

                    <div class="field">
                        <label>모델명</label>
                        <input type="text" name="modelName" maxlength="20">
                    </div>

                    <div class="field">
                        <label>보관위치</label>
                        <input type="text" name="location" maxlength="50">
                    </div>

                    <div class="field">
                        <label>공유 설비 이미지</label>
                        <input
                                type="file"
                                name="imageFile"
                                id="imageFile"
                                accept="image/*"
                                onchange="previewImage(this)"
                        >
                    </div>

                    <div class="preview-box">
                        <img id="imagePreview" alt="미리보기 이미지" />
                    </div>

                    <div class="btns">
                        <button type="submit" class="submit">등록</button>
                        <button type="button" class="cancel" onclick="history.back()">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>

<!-- 이 페이지 전용 JS -->
<th:block layout:fragment="pageScripts">
    <!-- ✅ SweetAlert2 추가 (회의실 등록과 동일) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const API_BASE = window.location.origin;

        /* =========================
           SweetAlert2 helpers (회의실 등록과 동일 톤)
           ========================= */
        const SWAL_PRIMARY = getComputedStyle(document.documentElement)
            .getPropertyValue("--primary")
            .trim() || "#4f8fe3";

        const SWAL_GRAY = "#9ca3af";
        const SWAL_RED  = "#ff4d4f";

        function swalAlert({ icon="info", title="알림", text="" }) {
            return Swal.fire({
                icon, title, text,
                confirmButtonColor: SWAL_PRIMARY
            });
        }

        function swalSuccess(text, title="완료") {
            return swalAlert({ icon: "success", title, text });
        }

        function swalError(text, title="오류") {
            return swalAlert({ icon: "error", title, text });
        }

        function swalWarn(text, title="확인") {
            return swalAlert({ icon: "warning", title, text });
        }

        function swalInfo(text, title="알림") {
            return swalAlert({ icon: "info", title, text });
        }

        async function swalConfirm({
                                       title="확인",
                                       text="진행할까요?",
                                       icon="question",
                                       confirmText="확인",
                                       cancelText="취소",
                                       confirmColor=SWAL_PRIMARY
                                   }){
            const result = await Swal.fire({
                title, text, icon,
                showCancelButton: true,
                confirmButtonText: confirmText,
                cancelButtonText: cancelText,
                confirmButtonColor: confirmColor,
                cancelButtonColor: SWAL_GRAY,
                reverseButtons: true
            });
            return result.isConfirmed;
        }

        function swalLoading(title="처리 중...", text="잠시만 기다려 주세요.") {
            return Swal.fire({
                title,
                text,
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
        }

        // ✅ httpOnly cookie 기반 공통 fetch (alert -> SweetAlert)
        async function apiFetch(path, options = {}) {
            const url = API_BASE + path;

            const res = await fetch(url, {
                ...options,
                credentials: "include",
                headers: { ...(options.headers || {}) }
            });

            if ((res.redirected && res.url.includes("/auth/employee/login")) || res.status === 401 || res.status === 403) {
                await swalWarn("로그인이 만료되었습니다. 다시 로그인 해 주세요.", "로그인 만료");
                location.href = "/auth/employee/login";
                throw new Error("UNAUTHORIZED");
            }

            return res;
        }

        /* ---------- image preview (alert -> SweetAlert) ---------- */
        function previewImage(input) {
            const preview = document.getElementById("imagePreview");
            if (!input.files || !input.files[0]) {
                preview.style.display = "none";
                preview.src = "";
                return;
            }

            const file = input.files[0];
            if (!file.type.startsWith("image/")) {
                swalWarn("이미지 파일만 업로드 가능합니다.");
                input.value = "";
                preview.style.display = "none";
                preview.src = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        }

        /* ===== inline validation UI (eqName, eqId만) ===== */
        const eqNameInput   = document.getElementById("eqName");
        const eqNameCounter = document.getElementById("eqNameCounter");
        const eqNameError   = document.getElementById("eqNameError");

        const eqIdInput   = document.getElementById("eqId");
        const eqIdCounter = document.getElementById("eqIdCounter");
        const eqIdError   = document.getElementById("eqIdError");

        function setError(inputEl, errorEl, msg) {
            if (!errorEl) return;

            if (msg) {
                errorEl.textContent = msg;
                errorEl.style.display = "block";
                inputEl?.classList.add("input-invalid");
            } else {
                errorEl.textContent = "";
                errorEl.style.display = "none";
                inputEl?.classList.remove("input-invalid");
            }
        }

        function updateEqNameUI() {
            if (!eqNameInput) return;

            const len = eqNameInput.value.length;
            if (eqNameCounter) eqNameCounter.textContent = `${len} / 20`;

            if (!eqNameInput.value.trim()) {
                setError(eqNameInput, eqNameError, "");
                return;
            }

            if (len > 20) setError(eqNameInput, eqNameError, "설비명은 20자 이내여야 합니다.");
            else setError(eqNameInput, eqNameError, "");
        }

        function updateEqIdUI() {
            if (!eqIdInput) return;

            const len = eqIdInput.value.length;
            if (eqIdCounter) eqIdCounter.textContent = `${len} / 20`;

            if (!eqIdInput.value.trim()) {
                setError(eqIdInput, eqIdError, "");
                return;
            }

            if (len > 20) setError(eqIdInput, eqIdError, "설비번호는 20자 이내여야 합니다.");
            else setError(eqIdInput, eqIdError, "");
        }

        eqNameInput?.addEventListener("input", updateEqNameUI);
        eqIdInput?.addEventListener("input", updateEqIdUI);

        // 초기 표시
        updateEqNameUI();
        updateEqIdUI();

        async function submitSharedEquipmentForm(e) {
            e.preventDefault();

            const name = eqNameInput.value.trim();
            const eqId = eqIdInput.value.trim();

            updateEqNameUI();
            updateEqIdUI();

            if (!name) {
                setError(eqNameInput, eqNameError, "설비명을 입력해주세요.");
                eqNameInput.focus();
                return;
            }
            if (name.length > 20) {
                setError(eqNameInput, eqNameError, "설비명은 20자 이내여야 합니다.");
                eqNameInput.focus();
                return;
            }
            if (eqId.length > 20) {
                setError(eqIdInput, eqIdError, "설비번호는 20자 이내여야 합니다.");
                eqIdInput.focus();
                return;
            }

            const form = document.getElementById("eqForm");
            const formData = new FormData(form);

            try {
                // ✅ 로딩 표시
                swalLoading("등록 중...", "공유 설비를 등록하고 있어요.");

                const res = await apiFetch("/api/v1/shared-equipment", {
                    method: "POST",
                    body: formData
                });

                // 응답 파싱
                let payload = null;
                try { payload = await res.json(); } catch { payload = { message: await res.text() }; }

                if (!res.ok) {
                    Swal.close();
                    const msg = payload?.message || "등록에 실패했습니다.";
                    await swalError(msg, "등록 실패");
                    return;
                }

                Swal.close();
                await Swal.fire({
                    icon: "success",
                    title: "등록 완료",
                    text: "공유 설비 등록이 완료되었습니다.",
                    timer: 1200,
                    showConfirmButton: false,
                    confirmButtonColor: SWAL_PRIMARY
                });

                location.href = "/shared-equipment";
            } catch (err) {
                Swal.close();
                if (err.message === "UNAUTHORIZED") return;
                console.error(err);
                await swalError("서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.", "오류");
            }
        }

        document.getElementById("eqForm")?.addEventListener("submit", submitSharedEquipmentForm);
    </script>
</th:block>

</body>
</html>
