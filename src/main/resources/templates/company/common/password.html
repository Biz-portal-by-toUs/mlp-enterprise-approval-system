<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bizportal - Change Password</title>
    <style>
        :root {
            --bg: #f3f3f3;
            --text: #111;
            --border: #d7d7d7;
            --primary: #2f66d7;
            --input-bg: #fff;
            --error: #e74c3c;
            --errorBg: #f8d7da;
            --success: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo",
            "Noto Sans KR", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* 공통 페이지 레이아웃: 검정 테두리 및 마진 */
        .page {
            min-height: 100vh;
            border: 2px solid #222;
            margin: 12px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .card {
            width: min(640px, 92vw);
            text-align: center;
            padding: 40px 24px;
        }

        .title {
            font-size: 52px;
            font-weight: 900;
            margin: 0 0 12px;
            letter-spacing: -0.5px;
        }

        .desc {
            margin: 0 0 24px;
            color: #555;
            font-weight: 600;
            font-size: 15px;
        }

        /* 폼 스타일 */
        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .label {
            font-size: 13px;
            font-weight: 800;
            color: #777;
            margin: 0 0 8px 10px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        /* 입력 박스 스타일 통일 */
        .input-wrap {
            position: relative;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            transition: border-color 0.2s;
            min-height: 54px;
        }

        .input-wrap:focus-within {
            border-color: var(--primary);
        }

        input {
            border: 0;
            outline: none;
            width: 100%;
            font-size: 16px;
            background: transparent;
            font-weight: 500;
        }

        /* 비밀번호 토글 버튼 */
        .icon-btn {
            border: 0;
            background: transparent;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .icon-btn:hover { opacity: 1; }
        .icon-btn svg { width: 22px; height: 22px; }

        /* 비밀번호 규칙 (Signup과 동일) */
        .pwd-rules {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0 18px 6px;
            justify-content: center;
        }
        .pwd-rule {
            font-size: 12px;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 8px;
            background: #eee;
            color: #888;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .pwd-rule.ok {
            background: #eaf7ef;
            color: var(--success);
        }

        /* 버튼 스타일 */
        .btn-primary {
            appearance: none;
            border: 0;
            background: var(--primary);
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 17px;
            transition: opacity 0.2s;
            margin-top: 10px;
            width: 100%;
        }
        .btn-primary:hover { opacity: 0.9; }

        /* 메시지 스타일 */
        .msg {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            display: none;
            text-align: left;
        }
        .msg.bad {
            display: block;
            color: var(--error);
            border: 1px solid rgba(231, 76, 60, 0.2);
            background-color: var(--errorBg);
        }
        .msg.ok {
            display: block;
            color: var(--success);
            border: 1px solid rgba(22, 163, 74, 0.2);
            background-color: #eaf7ef;
        }

        /* 하단 힌트라인 */
        .hintline {
            margin-top: 8px;
            font-size: 12.5px;
            font-weight: 800;
            text-align: left;
            display: none;
        }
        .hintline.ok { color: var(--success); }
        .hintline.bad { color: var(--error); }

        @media (max-width: 768px) {
            .title { font-size: 40px; }
        }
    </style>
</head>
<body>
<div class="page">
    <div th:replace="~{company/common/company-header :: companyHeader}"></div>

    <main>
        <section class="card">
            <h1 class="title">Change Password</h1>
            <p class="desc">회사 인증 완료 후 새로운 비밀번호를 설정하세요.</p>

            <div class="pwd-rules">
                <span class="pwd-rule" id="cUpper"><span class="x">✕</span> 대문자</span>
                <span class="pwd-rule" id="cLower"><span class="x">✕</span> 소문자</span>
                <span class="pwd-rule" id="cNum"><span class="x">✕</span> 숫자</span>
                <span class="pwd-rule" id="cSp"><span class="x">✕</span> 특수문자</span>
                <span class="pwd-rule" id="cLen"><span class="x">✕</span> 8~20자</span>
            </div>

            <form class="form" onsubmit="return false;">
                <div class="field">
                    <div class="label">Current Password</div>
                    <div class="input-wrap">
                        <input id="currentPwd" type="password" placeholder="현재 비밀번호를 입력하세요" maxlength="20"/>
                        <button class="icon-btn" type="button" data-target="currentPwd">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <div class="label">New Password</div>
                    <div class="input-wrap">
                        <input id="newPwd" type="password" placeholder="새 비밀번호를 입력하세요" maxlength="20"/>
                        <button class="icon-btn" type="button" data-target="newPwd">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <div class="label">Confirm New Password</div>
                    <div class="input-wrap">
                        <input id="confirmPwd" type="password" placeholder="새 비밀번호를 한 번 더 입력하세요" maxlength="20"/>
                        <button class="icon-btn" type="button" data-target="confirmPwd">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div id="matchHint" class="hintline"></div>
                </div>

                <button id="submitBtn" class="btn-primary" type="button">비밀번호 변경하기</button>
            </form>

            <div id="msg" class="msg"></div>
        </section>
    </main>
</div>

<script>
    const CHANGE_URL = "/auth/password";

    function getSubjectId() {
        const v = sessionStorage.getItem("companyPwSubjectId");
        return v ? Number(v) : null;
    }

    function showMsg(text, ok){
        const el = document.getElementById("msg");
        el.textContent = text;
        el.className = "msg " + (ok ? "ok" : "bad");
    }

    function chip(el, ok){
        const label = el.textContent.replace(/^[✕✓]\s/, '').trim();
        el.classList.toggle("ok", ok);
        el.innerHTML = `<span class="x">${ok ? '✓' : '✕'}</span> ${label}`;
    }

    const cUpper = document.getElementById("cUpper");
    const cLower = document.getElementById("cLower");
    const cNum   = document.getElementById("cNum");
    const cSp    = document.getElementById("cSp");
    const cLen   = document.getElementById("cLen");

    function validatePwd(pwd){
        const upper = /[A-Z]/.test(pwd);
        const lower = /[a-z]/.test(pwd);
        const num   = /[0-9]/.test(pwd);
        const sp    = /[^A-Za-z0-9]/.test(pwd);
        const len   = pwd.length >= 8 && pwd.length <= 20;

        chip(cUpper, upper);
        chip(cLower, lower);
        chip(cNum,   num);
        chip(cSp,    sp);
        chip(cLen,   len);

        return upper && lower && num && sp && len;
    }

    const matchHint = document.getElementById("matchHint");
    function updateMatchHint(){
        const newPwd = document.getElementById("newPwd").value;
        const confirmPwd = document.getElementById("confirmPwd").value;

        if (!newPwd && !confirmPwd) {
            matchHint.style.display = "none";
            return;
        }
        if (newPwd && !confirmPwd) {
            matchHint.style.display = "block";
            matchHint.textContent = "비밀번호 확인을 입력해주세요.";
            matchHint.className = "hintline bad";
            return;
        }

        const ok = newPwd === confirmPwd;
        matchHint.style.display = "block";
        matchHint.textContent = ok ? "✓ 비밀번호가 일치합니다." : "✕ 비밀번호가 일치하지 않습니다.";
        matchHint.className = "hintline " + (ok ? "ok" : "bad");
    }

    document.getElementById("newPwd").addEventListener("input", (e) => {
        validatePwd(e.target.value);
        updateMatchHint();
    });
    document.getElementById("confirmPwd").addEventListener("input", updateMatchHint);

    document.querySelectorAll(".icon-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-target");
            const input = document.getElementById(id);
            input.type = (input.type === "password") ? "text" : "password";
        });
    });

    document.getElementById("submitBtn").addEventListener("click", async () => {
        const subjectId = getSubjectId();
        if (!subjectId) {
            showMsg("인증 정보가 없습니다. 회사 인증 페이지에서 다시 진행해주세요.", false);
            setTimeout(() => location.href = "/auth/companies/verify", 1200);
            return;
        }

        const currentPassword = document.getElementById("currentPwd").value;
        const newPassword = document.getElementById("newPwd").value;
        const newPasswordConfirm = document.getElementById("confirmPwd").value;

        if (!currentPassword) return showMsg("현재 비밀번호를 입력해주세요.", false);
        if (!validatePwd(newPassword)) return showMsg("비밀번호 정책을 만족해주세요.", false);
        if (newPassword !== newPasswordConfirm) return showMsg("비밀번호 확인이 일치하지 않습니다.", false);

        try {
            const res = await fetch(CHANGE_URL, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    subjectId,
                    subjectType: "COMPANY",
                    currentPassword,
                    newPassword,
                    newPasswordConfirm
                })
            });

            if (!res.ok) {
                let err = `변경 실패 (${res.status})`;
                try { err = (await res.json()).message || err; } catch(e) {}
                showMsg(err, false);
                return;
            }

            showMsg("비밀번호 변경 완료! 회사 로그인 페이지로 이동합니다.", true);
            sessionStorage.removeItem("companyPwSubjectId");
            setTimeout(() => location.href = "/auth/companies/login", 1500);

        } catch (e) {
            showMsg("요청 실패: " + e.message, false);
        }
    });
</script>
</body>
</html>
