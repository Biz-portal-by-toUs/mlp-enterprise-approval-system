<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>관리자 삭제 로그</title>

    <th:block layout:fragment="pageStyles">
        <style>
            /* ===== cloud 공통 레이아웃 ===== */
            .content-wrap:has(.cloud-page) { padding: 0; }

            .cloud-page {
                height: calc(100vh - var(--topbar-h) - var(--footer-h));
                background: #f7f8fa; /* 예약페이지 톤 */
            }

            .cloud-page .page-with-subbar {
                display: grid;
                grid-template-columns: 220px 1fr;
                min-height: calc(100vh - var(--topbar-h) - var(--footer-h));
            }

            .cloud-page .subbar {
                display: flex;
                flex-direction: column;
            }

            /* ===== sidebar에서 쓰는 클래스들 (admin-log에서도 스타일 먹게) ===== */
            .cloud-scope-tabs {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                padding: 10px 12px 12px;
                border-bottom: 1px solid rgba(59, 130, 246, .14);
                background: rgba(255, 255, 255, .30);
            }

            .cloud-scope-tab {
                height: 38px; /* 휴지통 버튼급 */
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 12px;
                text-decoration: none;
                font-weight: 900;
                font-size: 13px;
                color: #1d4ed8;
                background: rgba(59, 130, 246, .12);
                border: 1px solid rgba(59, 130, 246, .10);
                box-sizing: border-box;
            }

            .cloud-scope-tab:hover { background: rgba(59, 130, 246, .18); }

            .cloud-scope-tab.active {
                background: var(--primary);
                color: #fff;
                border-color: transparent;
            }

            /* ===== 오른쪽 본문 ===== */
            .cloud-main {
                display: flex;
                flex-direction: column;
                min-width: 0;
                background: #f7f8fa;
            }

            .cloud-topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 16px 18px;
                background: #fff;
                border-bottom: 1px solid #eef2f7;
            }

            .cloud-title {
                font-size: 24px;
                font-weight: 900;
                margin: 0;
                color: #111;
            }

            .cloud-body {
                flex: 1;
                overflow: auto;
                padding: 20px 20px 32px;
            }

            /* ✅ 화면 꽉 차게 */
            .log-wrap { width: 100%; max-width: none; }

            .hint {
                font-weight: 800;
                color: #666;
                margin: 0 0 12px;
            }

            /* ===== 예약 페이지 스타일(필터바) ===== */
            .table-top {
                display: flex;
                justify-content: flex-end;
                align-items: center;
                margin: 10px 0 14px;
            }

            .filter-bar {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }

            .input {
                height: 40px;
                border: 1px solid #dfe3ea;
                border-radius: 10px;
                padding: 0 12px;
                background: #fff;
                font-size: 14px;
                outline: none;
                box-sizing: border-box;
                font-weight: 800;
                min-width: 320px;
            }

            .input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(26, 115, 232, .12);
            }

            .reserve-action-btn {
                height: 40px;
                padding: 0 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                border: none;
                background: var(--primary);
                color: #fff;
                white-space: nowrap;
                transition: 0.15s;
            }

            .reserve-action-btn:hover { filter: brightness(0.9); }
            .reserve-action-btn:active { transform: translateY(1px); }

            .btn-lite {
                height: 40px;
                padding: 0 16px;
                border-radius: 10px;
                border: 1px solid #dfe3ea;
                background: #fff;
                font-weight: 800;
                cursor: pointer;
                color: #111;
            }

            /* ===== 테이블(예약 페이지 톤) ===== */
            table {
                width: 100%;
                border-collapse: collapse;
                background: #fff;
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid #eef2f7;
            }

            thead th {
                text-align: left;
                padding: 12px 16px;
                white-space: nowrap;
                font-size: 14px;
                font-weight: 800;
                color: #111;
                border-bottom: 1px solid #eef2f7;
                background: #f9fafb;
            }

            tbody td {
                padding: 14px 16px;
                font-size: 14px;
                border-top: 1px solid #f4f6f9;
                vertical-align: middle;
                font-weight: 800;
                color: #111827;
            }

            tbody tr:hover { background: rgba(59, 130, 246, .06); }

            .pill {
                display: inline-block;
                padding: 3px 8px;
                border-radius: 999px;
                font-size: 11px;
                font-weight: 900;
                border: 1px solid rgba(17, 24, 39, .10);
                background: rgba(17, 24, 39, .03);
            }

            .muted { color: #666; font-weight: 800; }

            .empty {
                padding: 24px 10px;
                color: #777;
                text-align: center;
                font-weight: 800;
            }

            /* ===== 회의실 페이징 스타일 ===== */
            .paging {
                margin-top: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                flex-wrap: wrap;
            }

            .page-btn {
                min-width: 36px;
                height: 36px;
                border-radius: 10px;
                border: 1px solid #e5e7eb;
                background: #fff;
                cursor: pointer;
                font-size: 13px;
                font-weight: 800;
            }

            .page-btn.active {
                background: var(--primary);
                border-color: var(--primary);
                color: #fff;
                font-weight: 900;
            }

            .page-btn:disabled { opacity: .5; cursor: not-allowed }

            /* 폴더명 클릭(링크처럼) */
            .link-folder {
                background: none;
                border: none;
                padding: 0;
                cursor: pointer;
                font-weight: 900;
                color: #1d4ed8;
            }

            .link-folder:hover { text-decoration: underline; }

            /* 폴더 상세(토글 영역) */
            .child-row td {
                background: #fbfcfe;
                padding: 12px 16px;
            }

            .child-list {
                display: flex;
                flex-direction: column;
                gap: 6px;
                font-weight: 800;
                color: #111827;
            }

            .child-item {
                display: flex;
                gap: 8px;
                align-items: center;
            }

            .child-item .icon { width: 18px; text-align: center; }
            .child-item .name { color: #111827; }

            /* ✅ SweetAlert가 다른 레이어보다 위에 뜨도록 */
            .swal2-container{
                z-index: 3000000 !important;
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content" class="cloud-page">
    <div class="page-with-subbar">

        <!-- ✅ 왼쪽 sidebar -->
        <th:block th:replace="~{sidebar/cloud-sidebar :: cloudSidebar(${active})}"></th:block>

        <!-- ✅ 오른쪽 -->
        <section class="cloud-main">
            <div class="cloud-topbar">
                <h1 class="cloud-title">관리자 삭제 로그</h1>
            </div>

            <div class="cloud-body">
                <div class="log-wrap">

                    <div class="table-top">
                        <div class="filter-bar">
                            <input type="date" id="fromDate" class="input-date">
                            <span class="tilde">~</span>
                            <input type="date" id="toDate" class="input-date">

                            <input class="input" id="q" placeholder="파일/폴더명 검색"/>
                            <button id="btnSearch" type="button" class="reserve-action-btn">조회</button>
                        </div>
                    </div>

                    <table>
                        <thead>
                        <tr>
                            <th style="width:110px;">상태</th>
                            <th style="width:160px;">일시</th>
                            <th style="width:90px;">유형</th>
                            <th>이름</th>
                            <th style="width:140px;">사용자</th>
                            <th style="width:260px;">batchId</th>
                        </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>

                    <div class="paging" id="paging"></div>
                </div>
            </div>
        </section>

    </div>
</div>

<th:block layout:fragment="pageScripts">
    <!-- ✅ SweetAlert2 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script th:inline="javascript">
        /* =========================
           SweetAlert2 (예약 페이지 스타일 동일)
           ========================= */
        const SWAL_PRIMARY = getComputedStyle(document.documentElement)
            .getPropertyValue("--primary")
            .trim() || "#4f8fe3";
        const SWAL_GRAY = "#9ca3af";

        function swalAlert({ icon="info", title="알림", text="" }) {
            return Swal.fire({ icon, title, text, confirmButtonColor: SWAL_PRIMARY });
        }
        function swalSuccess(text, title="완료") { return swalAlert({ icon:"success", title, text }); }
        function swalError(text, title="오류") { return swalAlert({ icon:"error", title, text }); }
        function swalWarn(text, title="확인") { return swalAlert({ icon:"warning", title, text }); }

        function swalLoading(title="불러오는 중...", text="잠시만 기다려 주세요.") {
            return Swal.fire({
                title,
                text,
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
        }

        // scope: URL에서 읽기 (없으면 DEPT)
        const scope = new URLSearchParams(window.location.search).get("scope") || "DEPT";
        console.log("[admin-log] scope(from url):", scope);

        const size = 10;          // 페이지당 10개
        const MAX_PAGES = 5;      // 서버 정책(최대 5페이지)과 맞춤
        let totalPages = 1;       // 확정된 총 페이지 수(1~5)
        let lastQueryKey = "";    // 검색조건 바뀌었는지 판별
        let page = 0;             // 0-base page

        const el = {
            tbody: document.getElementById("tbody"),
            q: document.getElementById("q"),
            fromDate: document.getElementById("fromDate"),
            toDate: document.getElementById("toDate"),
            btnSearch: document.getElementById("btnSearch"),
            paging: document.getElementById("paging"),
        };

        async function apiJson(url, opt = {}) {
            const res = await fetch(url, {
                credentials: "include",
                headers: { "Content-Type": "application/json", ...(opt.headers || {}) },
                ...opt,
            });

            const text = await res.text();

            // ✅ JSON 파싱 안전 처리
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch (e) {
                console.error("[apiJson] JSON parse error:", text);
                throw new Error("서버 응답 형식이 올바르지 않습니다.");
            }

            if (res.status === 401 || res.status === 403) {
                await swalWarn("로그인이 만료되었습니다. 다시 로그인해 주세요.", "로그인 만료");
                location.href = "/login";
                throw new Error("UNAUTHORIZED");
            }

            if (!res.ok) {
                console.error("[apiJson] Error response:", json);
                throw new Error(json?.message || json?.error || res.statusText);
            }

            // ResponseDto { data: ... } 래핑이면 data 언랩
            return json && "data" in json ? json.data : json;
        }

        function buildQueryKey({ q, from, to }) {
            return `${scope}|${from}|${to}|${q}`;
        }

        async function fetchSlice(p, { q, from, to }) {
            const limit = size;
            const offset = p * size;

            const url =
                `/api/v1/cloud/trash/admin-log?scope=${encodeURIComponent(scope)}`
                + `&limit=${limit}&offset=${offset}`
                + `&q=${encodeURIComponent(q)}`
                + `&from=${encodeURIComponent(from)}`
                + `&to=${encodeURIComponent(to)}`;

            return await apiJson(url); // { items, hasNext, limit, offset }
        }

        // ✅ 0페이지 기준으로 hasNext를 따라가며 총 페이지(최대 5) 확정
        async function detectTotalPages(firstSlice, params) {
            if (!firstSlice || !Array.isArray(firstSlice.items) || firstSlice.items.length === 0) return 1;

            let total = 1;
            let cur = firstSlice;
            let nextPage = 1;

            while (cur.hasNext && total < MAX_PAGES) {
                const next = await fetchSlice(nextPage, params);
                if (!next || !Array.isArray(next.items) || next.items.length === 0) break;

                total++;
                cur = next;
                nextPage++;
            }

            return total;
        }

        function fmtYMD(d){
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            return `${yyyy}-${mm}-${dd}`;
        }

        function parseYMD(s){
            if (!s) return null;
            const [y,m,d] = s.split("-").map(Number);
            if (!y || !m || !d) return null;
            return new Date(y, m - 1, d); // 로컬 00:00
        }

        function addMonths(date, months){
            const d = new Date(date);
            const day = d.getDate();
            d.setMonth(d.getMonth() + months);
            if (d.getDate() !== day) d.setDate(0);
            return d;
        }

        // ✅ 날짜 제약 적용: (1) to < from 금지 (2) 기간 3개월 초과 금지
        function normalizeDateRange({ silent = false } = {}){
            const from = parseYMD(el.fromDate.value);
            const to   = parseYMD(el.toDate.value);

            if (!from || !to) return;

            // 1) 역전 방지: to >= from
            if (to < from) {
                el.toDate.value = el.fromDate.value;
                if (!silent) swalWarn("종료 날짜는 시작 날짜보다 빠를 수 없습니다.");
            }

            // 2) 3개월 제한: from >= (to - 3개월)
            const to2 = parseYMD(el.toDate.value);
            const minFrom = addMonths(to2, -3);
            const from2 = parseYMD(el.fromDate.value);

            if (from2 < minFrom) {
                el.fromDate.value = fmtYMD(minFrom);
                if (!silent) swalWarn("조회 기간은 최대 3개월까지만 가능합니다.");
            }

            // date picker 자체 제한도 같이 갱신
            el.toDate.min = el.fromDate.value;
            el.fromDate.max = el.toDate.value;

            // 오늘 이후 선택 금지
            const todayStr = fmtYMD(new Date());
            el.fromDate.max = Math.min(el.fromDate.max || todayStr, todayStr);
            el.toDate.max = todayStr;
        }

        function bindDateGuards(){
            const todayStr = fmtYMD(new Date());
            el.fromDate.max = todayStr;
            el.toDate.max = todayStr;

            el.fromDate.addEventListener("change", () => normalizeDateRange());
            el.toDate.addEventListener("change", () => normalizeDateRange());
        }

        function actionLabel(a) {
            const v = String(a || "").toUpperCase();
            if (v === "DELETE") return "삭제";
            if (v === "RESTORE") return "복구";
            if (v === "PURGE") return "영구삭제";
            return v || "-";
        }

        function fmtDT(dt) {
            if (!dt) return "";
            return String(dt).replace("T", " ").slice(0, 19);
        }

        function render(rows) {
            el.tbody.innerHTML = "";

            if (!rows || rows.length === 0) {
                el.tbody.innerHTML = `<tr><td class="empty" colspan="6">조회 결과가 없습니다.</td></tr>`;
                return;
            }

            for (const it of rows) {
                const tr = document.createElement("tr");
                const isFolder = String(it.itemType || "").toUpperCase() === "FOLDER";

                tr.innerHTML = `
                    <td><span class="pill">${actionLabel(it.action)}</span></td>
                    <td>${fmtDT(it.actionAt)}</td>
                    <td><span class="pill">${isFolder ? "폴더" : "파일"}</span></td>
                    <td>
                        ${
                    isFolder
                        ? `<button type="button"
                                          class="link-folder"
                                          data-folder-no="${it.itemId ?? ""}"
                                          data-batch-id="${it.batchId ?? ""}">
                                        ${it.itemName || "-"}
                                   </button>`
                        : `${it.itemName || "-"}`
                }
                    </td>
                    <td>${it.actor || "-"}</td>
                    <td>${it.batchId || "-"}</td>
                `;

                el.tbody.appendChild(tr);
            }

            el.tbody.querySelectorAll(".link-folder").forEach(btn => {
                btn.addEventListener("click", () => toggleFolderDetail(btn));
            });
        }

        function renderPaging(current, total) {
            el.paging.innerHTML = "";
            if (!total || total <= 1) return;

            const mkBtn = (label, onClick, disabled = false, active = false) => {
                const b = document.createElement("button");
                b.className = "page-btn" + (active ? " active" : "");
                b.textContent = label;
                b.disabled = disabled;
                b.addEventListener("click", onClick);
                return b;
            };

            el.paging.appendChild(mkBtn("‹", () => loadLogs(current - 1), current === 0));

            const windowSize = 5;
            const start = Math.max(0, current - Math.floor(windowSize / 2));
            const end = Math.min(total - 1, start + windowSize - 1);
            const realStart = Math.max(0, end - windowSize + 1);

            for (let p = realStart; p <= end; p++) {
                el.paging.appendChild(mkBtn(String(p + 1), () => loadLogs(p), false, p === current));
            }

            el.paging.appendChild(mkBtn("›", () => loadLogs(current + 1), current >= total - 1));
        }

        async function loadLogs(p = 0) {
            page = p;

            normalizeDateRange({ silent: true });

            const q = (el.q?.value || "").trim();
            const from = el.fromDate.value;
            const to = el.toDate.value;

            // ✅ 날짜 미선택 방지(초기값 세팅 못된 경우)
            if (!from || !to) {
                await swalWarn("조회 기간(시작/종료 날짜)을 선택해주세요.");
                return;
            }

            const params = { q, from, to };
            const key = buildQueryKey(params);

            const queryChanged = (key !== lastQueryKey);
            if (queryChanged) {
                lastQueryKey = key;
                totalPages = 1;
            }

            try {
                swalLoading("조회 중...", "관리자 삭제 로그를 불러오고 있어요.");

                const slice = await fetchSlice(page, params);
                const rows = slice.items;
                render(rows);

                if (queryChanged) {
                    const first = (page === 0) ? slice : await fetchSlice(0, params);
                    totalPages = await detectTotalPages(first, params);
                }

                Swal.close();
                renderPaging(page, totalPages);

            } catch (e) {
                Swal.close();

                if (String(e?.message || "").includes("UNAUTHORIZED")) return;

                console.error(e);
                await swalError(e.message || "조회 중 오류가 발생했습니다.", "오류");
            }
        }

        async function toggleFolderDetail(btn) {
            const tr = btn.closest("tr");
            const next = tr.nextElementSibling;

            // 열려있으면 닫기
            if (next && next.classList.contains("child-row")) {
                next.remove();
                return;
            }

            const folderNo = btn.dataset.folderNo;
            const batchId = btn.dataset.batchId;

            if (!folderNo || !batchId) {
                const detailTr = document.createElement("tr");
                detailTr.className = "child-row";
                detailTr.innerHTML = `<td colspan="6"><div class="muted">상세 조회에 필요한 값이 없습니다.</div></td>`;
                tr.insertAdjacentElement("afterend", detailTr);
                return;
            }

            const detailTr = document.createElement("tr");
            detailTr.className = "child-row";
            detailTr.innerHTML = `<td colspan="6">불러오는 중...</td>`;
            tr.insertAdjacentElement("afterend", detailTr);

            try {
                // ✅ 여기만 로딩을 따로 띄우면 과해져서(토글 UX), 행 내부 "불러오는 중..."만 유지
                const items = await apiJson(
                    `/api/v1/cloud/trash/admin-log/children?batchId=${encodeURIComponent(batchId)}&folderNo=${encodeURIComponent(folderNo)}`
                );

                if (!items || items.length === 0) {
                    detailTr.innerHTML = `<td colspan="6"><div class="muted">하위 항목이 없습니다.</div></td>`;
                    return;
                }

                const html = items.map(x => {
                    const isFolder = String(x.itemType || "").toUpperCase() === "FOLDER";
                    return `
                        <div class="child-item">
                          <div class="icon">${isFolder ? "📁" : "📄"}</div>
                          <div class="name">${x.itemName || "-"}</div>
                        </div>
                    `;
                }).join("");

                detailTr.innerHTML = `<td colspan="6"><div class="child-list">${html}</div></td>`;
            } catch (e) {
                detailTr.innerHTML = `<td colspan="6"><div class="muted">상세 조회 실패: ${e.message}</div></td>`;
                // ✅ 토글 상세 실패는 팝업까지 띄우면 과해서, 행에만 표시(원하면 swalError로 바꿔도 됨)
            }
        }

        // 조회 버튼
        el.btnSearch?.addEventListener("click", () => {
            loadLogs(0);
        });

        // 초기 로딩: 최근 7일
        window.addEventListener("DOMContentLoaded", () => {
            const today = new Date();
            const weekAgo = new Date(today);
            weekAgo.setDate(today.getDate() - 7);

            el.fromDate.value = fmtYMD(weekAgo);
            el.toDate.value = fmtYMD(today);

            bindDateGuards();
            normalizeDateRange({ silent: true });

            loadLogs(0);
        });
    </script>
</th:block>

</body>
</html>
