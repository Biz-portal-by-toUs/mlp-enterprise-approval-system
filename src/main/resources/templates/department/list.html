<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>부서 편성</title>
    <style>
        :root{
            --primary:#2f6fda;
            --bg:#f3f5f9;
            --card:#f1f3f6;
            --text:#111;
            --muted:#6b7280;
            --line:#e5e7eb;
            --white:#fff;
        }
        *{box-sizing:border-box}
        body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text)}
        .topbar{
            height:64px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;
            padding:0 20px; box-shadow:0 10px 25px rgba(0,0,0,.12);
        }
        .brand{font-weight:800;font-size:24px;letter-spacing:.3px}
        .wrap{display:flex;min-height:calc(100vh - 64px)}
        .sidenav{width:84px;background:#fff;border-right:1px solid var(--line);padding:14px 10px}
        .sidenav .item{height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:8px 0;color:var(--muted);font-size:12px}
        .sidenav .item.active{background:#eef4ff;color:var(--primary);font-weight:700}
        .subnav{width:220px;background:#fbfcfe;border-right:1px solid var(--line);padding:18px}
        .subnav .title{font-weight:800;margin:10px 0 18px 0}
        .subnav a{display:block;padding:12px 10px;border-radius:10px;color:#2b5db8;text-decoration:none;margin:6px 0}
        .subnav a.active{background:#eef4ff;font-weight:700}
        .content{flex:1;padding:30px 32px}
        .page-title{font-size:34px;font-weight:900;margin:10px 0 8px}
        .page-sub{font-size:18px;font-weight:800;margin:0 0 20px;color:#111}
        .actions{display:flex;justify-content:flex-end;margin:0 0 14px}
        .btn{
            border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;
            background:var(--primary);color:#fff;box-shadow:0 10px 20px rgba(47,111,218,.25);
        }
        .card{
            background:var(--card); border-radius:18px; padding:22px; min-height:520px;
        }
        .table{
            width:100%; border-collapse:separate; border-spacing:0 14px;
        }
        .thead{
            background:#fff;border-radius:14px;
        }
        .thead th{
            text-align:left; padding:14px 18px; font-size:14px; color:#111;
        }
        .row{
            background:#fff;border-radius:14px;
        }
        .row td{
            padding:18px; font-size:14px; color:#111;
        }
        .row td:first-child{border-top-left-radius:14px;border-bottom-left-radius:14px}
        .row td:last-child{border-top-right-radius:14px;border-bottom-right-radius:14px}
        .muted{color:var(--muted)}
        .pill-btn{
            padding:8px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:800;font-size:13px;
        }
        .pill-edit{background:#eaf2ff;color:#2b5db8}
        .pill-del{background:#fdecec;color:#c62828;margin-left:10px}
        .empty{
            padding:40px 10px;text-align:center;color:var(--muted);font-weight:700
        }
        .toast{
            display:none;
            margin-top:14px;
            padding:12px 14px;
            border-radius:12px;
            background:#fff;
            border:1px solid var(--line);
            font-weight:800;
        }
        .toast.ok{color:#1b7f3a;border-color:#bfe7c9;background:#f3fff6}
        .toast.err{color:#b42318;border-color:#ffd0cc;background:#fff5f4}
    </style>
</head>
<body>
<header class="topbar">
    <div class="brand">Bizportal</div>
    <div class="muted" style="color:#eaf2ff;font-weight:700;">부서 편성</div>
</header>

<div class="wrap">
    <aside class="sidenav">
        <div class="item">결재</div>
        <div class="item">회의</div>
        <div class="item">메일</div>
        <div class="item">문서함</div>
        <div class="item">공유함</div>
        <div class="item">캘린더</div>
        <div class="item">게시판</div>
        <div class="item">예약</div>
        <div class="item">근태</div>
        <div class="item">조직도</div>
        <div class="item active">관리자</div>
    </aside>

    <aside class="subnav">
        <div class="title">부서 편성</div>
        <a class="active" href="/admin/departments/list">부서 편성</a>
        <a href="/admin/positions/list">직급 편성</a>
        <a href="/admin/employees/list">사원 관리</a>
        <a href="/admin/rules">사내 규정 관리</a>
    </aside>

    <main class="content">
        <div class="page-title">부서 편성</div>
        <div class="page-sub">부서 조회</div>

        <div class="actions">
            <button class="btn" type="button" onclick="location.href='/admin/departments/create'">부서 등록</button>
        </div>

        <section class="card">
            <table class="table">
                <thead class="thead">
                <tr>
                    <th style="width:28%;">부서 코드</th>
                    <th style="width:34%;">부서명</th>
                    <th style="width:18%;">사원 수</th>
                    <th style="width:20%;">관리</th>
                </tr>
                </thead>

                <tbody id="deptTbody">
                <!-- JS로 렌더링 -->
                </tbody>
            </table>

            <div id="emptyBox" class="empty" style="display:none;">등록된 부서가 없습니다.</div>
            <div id="toast" class="toast"></div>
        </section>
    </main>
</div>

<script>
    function showToast(msg, type) {
        const toast = document.getElementById("toast");
        toast.className = "toast " + (type || "");
        toast.textContent = msg;
        toast.style.display = "block";
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => {
            toast.style.display = "none";
        }, 2500);
    }

    async function safeJson(res) {
        const ct = res.headers.get("content-type") || "";
        if (!ct.includes("application/json")) return {};
        try { return await res.json(); } catch { return {}; }
    }

    async function loadDepartments() {
        const tbody = document.getElementById("deptTbody");
        const emptyBox = document.getElementById("emptyBox");

        tbody.innerHTML = "";
        emptyBox.style.display = "none";

        const res = await fetch("/api/v1/admin/departments", {
            method: "GET",
            credentials: "include", // ✅ accessToken 쿠키 자동 전송
            headers: {
                "Accept": "application/json"
            }
        });

        if (res.status === 401) {
            emptyBox.style.display = "block";
            emptyBox.textContent = "로그인이 필요합니다. 다시 로그인 해주세요.";
            return;
        }
        if (res.status === 403) {
            emptyBox.style.display = "block";
            emptyBox.textContent = "권한이 없습니다. (COM_ADMIN만 가능)";
            return;
        }
        if (!res.ok) {
            emptyBox.style.display = "block";
            emptyBox.textContent = "부서 조회 중 오류가 발생했습니다. (" + res.status + ")";
            return;
        }

        const json = await safeJson(res);
        const list = json.data || [];

        if (!list.length) {
            emptyBox.style.display = "block";
            emptyBox.textContent = "등록된 부서가 없습니다.";
            return;
        }

        list.forEach(d => {
            const depNo = d.depNo;
            const depId = d.depId ?? "";
            const depName = d.depName ?? "";
            const empCount = Number(d.empCount ?? 0).toLocaleString();

            const tr = document.createElement("tr");
            tr.className = "row";
            tr.innerHTML = `
                <td>${escapeHtml(depId)}</td>
                <td>${escapeHtml(depName)}</td>
                <td>${empCount}</td>
                <td>
                    <button class="pill-btn pill-edit" type="button"
                        onclick="onEdit(${depNo})">수정</button>
                    <button class="pill-btn pill-del" type="button"
                        onclick="onDelete(${depNo}, '${escapeJs(depName)}')">삭제</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function onEdit(depNo) {
        location.href = `/admin/departments/${depNo}/edit`;
    }

    async function onDelete(depNo, depName) {
        const ok = confirm(`정말로 '${depName}' 부서를 삭제할까요?\n(삭제 후 복구 불가)`);
        if (!ok) return;

        try {
            const res = await fetch(`/api/v1/admin/departments/${depNo}`, {
                method: "DELETE",
                credentials: "include", // ✅ accessToken 쿠키 자동 전송
                headers: {
                    "Accept": "application/json"
                }
            });

            if (res.status === 401) {
                showToast("로그인이 필요합니다. 다시 로그인 해주세요.", "err");
                return;
            }
            if (res.status === 403) {
                showToast("권한이 없습니다. (COM_ADMIN만 가능)", "err");
                return;
            }

            if (!res.ok) {
                let msg = `삭제 실패 (${res.status})`;
                const json = await safeJson(res);
                if (json && (json.message || json.error)) {
                    msg = json.message || json.error;
                }
                showToast(msg, "err");
                return;
            }

            showToast("삭제되었습니다.", "ok");
            await loadDepartments();
        } catch (e) {
            console.error(e);
            showToast("삭제 중 예외가 발생했습니다.", "err");
        }
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll("&","&amp;")
            .replaceAll("<","&lt;")
            .replaceAll(">","&gt;")
            .replaceAll("\"","&quot;")
            .replaceAll("'","&#039;");
    }
    function escapeJs(str) {
        return String(str).replaceAll("\\","\\\\").replaceAll("'","\\'");
    }

    loadDepartments().catch(err => {
        console.error(err);
        const emptyBox = document.getElementById("emptyBox");
        emptyBox.style.display = "block";
        emptyBox.textContent = "부서 조회 중 예외가 발생했습니다.";
    });
</script>
</body>
</html>
