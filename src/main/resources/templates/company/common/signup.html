<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bizportal - Company Sign Up</title>
    <style>
        :root {
            --bg: #f3f3f3;
            --text: #111;
            --border: #d7d7d7;
            --primary: #2f66d7;
            --input-bg: #fff;
            --disabled: #9fb2e6;
            --success: #16a34a;
            --error: #e74c3c;
            --errorBg: #f8d7da;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo",
            "Noto Sans KR", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .page {
            min-height: 100vh;
            border: 2px solid #222;
            margin: 12px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .card { width: min(720px, 92vw); text-align: center; }
        .title { font-size: 52px; font-weight: 900; margin: 0 0 24px; letter-spacing: -0.5px; }

        .form { display: flex; flex-direction: column; gap: 20px; margin-top: 24px; }
        .field { text-align: left; }
        .label { font-size: 13px; font-weight: 800; color: #777; margin: 0 0 8px 10px; letter-spacing: 0.6px; text-transform: uppercase; }
        .req { color: var(--error); margin-left: 2px; }

        .input-wrap {
            position: relative;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s;
            min-height: 54px;
        }
        .input-wrap:focus-within { border-color: var(--primary); }
        input { border: 0; outline: none; width: 100%; font-size: 16px; background: transparent; font-weight: 500; }

        .btn {
            appearance: none; border: 1px solid var(--border); background: #fff;
            padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer;
            color: #222; transition: all 0.2s; font-size: 14px;
        }

        .inline-btn {
            border: 0; background: var(--primary); color: #fff; font-weight: 800;
            padding: 0 16px; height: 44px; border-radius: 10px; cursor: pointer;
            white-space: nowrap; font-size: 14px; flex: 0 0 auto;
        }
        .inline-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .form .primary-btn {
            margin-top: 10px; border: 0; background: var(--primary); color: #fff;
            font-size: 18px; font-weight: 800; padding: 16px 18px; border-radius: 12px;
            cursor: pointer; width: 100%;
        }
        .form .primary-btn:disabled { background: var(--disabled); cursor: not-allowed; }

        .brn-wrap, .addr-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .brn-segs { display: flex; align-items: center; gap: 8px; flex: 1; }
        .dash { font-weight: 900; color: #bbb; }
        .seg-wrap { padding: 8px 10px; min-height: 48px; flex: 1; justify-content: center; }
        .seg-wrap input { text-align: center; }

        .pwd-rules { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0 6px; }
        .pwd-rule {
            font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 8px;
            background: #eee; color: #888; display: flex; align-items: center; gap: 5px;
        }
        .pwd-rule.ok { background: #eaf7ef; color: var(--success); }

        .error {
            display: none; color: var(--error); border: 1px solid rgba(231, 76, 60, 0.2);
            background-color: var(--errorBg); padding: 14px; margin-bottom: 20px;
            border-radius: 10px; text-align: left; font-weight: 700; font-size: 14px;
        }
        .note { font-size: 13px; margin: 6px 0 0 10px; font-weight: 600; color: #888; }
        .note-success { color: var(--success); }

        /* 아이콘 버튼 스타일 */
        .icon-btn { border: 0; background: transparent; cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; }
        .icon-btn svg { width: 22px; height: 22px; opacity: 0.5; }

        /* 모달 및 복사 버튼 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .modal-overlay.show { display: flex; }
        .modal { width: min(500px, 92vw); background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .modal-title { font-size: 22px; font-weight: 900; }
        .modal-x { border: 0; background: transparent; font-size: 20px; cursor: pointer; }
        .cred-box { background: #f8f9fa; border: 1px solid var(--border); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        code { font-weight: 800; color: var(--primary); font-size: 16px; }
        .copy-btn { background: var(--primary); border: 0; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 800; cursor: pointer; }
        .copy-msg { font-size: 11px; color: var(--success); margin-top: 4px; font-weight: 800; min-height: 14px; }

        #addrSearchBtn { height: 54px; padding: 0 20px; display: flex; align-items: center; justify-content: center; }
        @media (max-width: 768px) { .title { font-size: 40px; } }
    </style>
</head>
<body>
<div class="page">
    <div th:replace="~{company/common/company-header :: companyHeader}"></div>
    <main>
        <section class="card">
            <h1 class="title">Sign Up</h1>
            <div id="serverError" class="error"></div>
            <form id="company-signup-form" class="form" enctype="multipart/form-data">
                <div class="field">
                    <div class="label">기업 이름<span class="req">*</span></div>
                    <div class="input-wrap"><input name="comName" id="comName" type="text" placeholder="예) Samsung" maxlength="50" required /></div>
                    <div id="comNameWarn" class="note"></div>
                </div>

                <div class="field">
                    <div class="label">회사코드 (3글자)<span class="req">*</span></div>
                    <div class="input-wrap">
                        <input name="comId" id="comId" type="text" placeholder="SAM" maxlength="3" required />
                        <button class="inline-btn" id="comIdCheckBtn" type="button">중복확인</button>
                    </div>
                    <div id="comIdMsg" class="note"></div>
                </div>

                <div class="field">
                    <div class="label">사업자 등록번호<span class="req">*</span></div>
                    <div class="brn-wrap">
                        <div class="brn-segs">
                            <div class="input-wrap seg-wrap"><input id="brn1" type="text" inputmode="numeric" placeholder="101" maxlength="3" required /></div>
                            <span class="dash">-</span>
                            <div class="input-wrap seg-wrap"><input id="brn2" type="text" inputmode="numeric" placeholder="20" maxlength="2" required /></div>
                            <span class="dash">-</span>
                            <div class="input-wrap seg-wrap"><input id="brn3" type="text" inputmode="numeric" placeholder="03030" maxlength="5" required /></div>
                        </div>
                        <button class="inline-btn" id="brnVerifyBtn" type="button">인증하기</button>
                    </div>
                    <input name="brn" id="brn" type="hidden" />
                    <div id="brnMsg" class="note"></div>
                </div>

                <div class="field">
                    <div class="label">회사 이메일<span class="req">*</span></div>
                    <div class="input-wrap">
                        <input name="email" id="email" type="email" placeholder="admin@company.com" maxlength="50" required />
                        <button class="inline-btn" id="emailCheckBtn" type="button">중복확인</button>
                    </div>
                    <div id="emailMsg" class="note"></div>
                </div>

                <div class="field">
                    <div class="label">비밀번호<span class="req">*</span></div>
                    <div class="input-wrap">
                        <input name="pwd" id="pwd" type="password" placeholder="••••••••" required />
                        <button class="icon-btn" id="togglePwdBtn" type="button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <div class="pwd-rules">
                        <span class="pwd-rule" id="ruleUpper"><span class="pwd-icon">✗</span>대문자</span>
                        <span class="pwd-rule" id="ruleLower"><span class="pwd-icon">✗</span>소문자</span>
                        <span class="pwd-rule" id="ruleNumber"><span class="pwd-icon">✗</span>숫자</span>
                        <span class="pwd-rule" id="ruleSpecial"><span class="pwd-icon">✗</span>특수문자</span>
                        <span class="pwd-rule" id="ruleLen"><span class="pwd-icon">✗</span>8~20자</span>
                    </div>
                </div>

                <div class="field">
                    <div class="label">비밀번호 확인<span class="req">*</span></div>
                    <div class="input-wrap">
                        <input id="pwdConfirm" type="password" placeholder="••••••••" required />
                        <button class="icon-btn" id="togglePwdConfirmBtn" type="button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <div id="pwdMatchMsg" class="note"></div>
                </div>

                <div class="field">
                    <div class="label">주소<span class="req">*</span></div>
                    <div class="addr-top">
                        <div class="input-wrap" style="flex:1;"><input id="zipNo" name="zipNo" type="text" placeholder="우편번호" readonly /></div>
                        <button class="btn" id="addrSearchBtn" type="button">주소 검색</button>
                    </div>
                    <div style="height:10px;"></div>
                    <div class="input-wrap"><input name="addr" id="addr" type="text" placeholder="도로명 주소" readonly required /></div>
                    <div style="height:10px;"></div>
                    <div class="input-wrap"><input name="addrDetail" id="addrDetail" type="text" placeholder="상세 주소" /></div>
                </div>

                <div class="field">
                    <div class="label">로고 파일</div>
                    <div class="input-wrap"><input name="logo" id="logo" type="file" accept="image/*" /></div>
                </div>

                <button class="primary-btn" id="signupBtn" type="submit" disabled>Create Account</button>
                <div class="note" id="brnNote" style="text-align:center; margin-top:10px;"></div>
            </form>
        </section>
    </main>
</div>

<div id="adminModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-head">
            <div class="modal-title">관리자 계정 발급 완료</div>
            <button type="button" class="modal-x" id="adminModalClose">✕</button>
        </div>
        <p style="font-size:13px; color:#666; margin-bottom:20px;">최초 로그인 후 비밀번호를 변경해주세요.</p>

        <div class="label" style="margin-left:0;">관리자 사번</div>
        <div class="cred-box">
            <code id="adminEmpIdText">-</code>
            <button type="button" class="copy-btn" id="copyEmpIdBtn">복사</button>
        </div>
        <div class="copy-msg" id="copyEmpIdMsg"></div>

        <div class="label" style="margin-left:0; margin-top:10px;">임시 비밀번호</div>
        <div class="cred-box">
            <code id="adminPwdText">-</code>
            <button type="button" class="copy-btn" id="copyPwdBtn">복사</button>
        </div>
        <div class="copy-msg" id="copyPwdMsg"></div>

        <button class="primary-btn" id="goLoginBtn" style="margin-top:20px; border:0; background:var(--primary); color:#fff; padding:14px; border-radius:12px; font-weight:800; cursor:pointer; width:100%;">로그인하러 가기</button>
    </div>
</div>

<script>
    const form = document.getElementById('company-signup-form');
    const serverError = document.getElementById('serverError');

    const signupBtn = document.getElementById('signupBtn');
    const brnNote = document.getElementById('brnNote');

    const comNameInput = document.getElementById('comName');
    const comNameWarn = document.getElementById('comNameWarn');

    const comIdInput = document.getElementById('comId');
    const comIdCheckBtn = document.getElementById('comIdCheckBtn');
    const comIdMsg = document.getElementById('comIdMsg');
    const comIdWarn = document.getElementById('comIdWarn');

    const emailInput = document.getElementById('email');
    const emailCheckBtn = document.getElementById('emailCheckBtn');
    const emailMsg = document.getElementById('emailMsg');

    const pwdInput = document.getElementById('pwd');
    const pwdConfirmInput = document.getElementById('pwdConfirm');
    const pwdMatchMsg = document.getElementById('pwdMatchMsg');

    const togglePwdBtn = document.getElementById('togglePwdBtn');
    const togglePwdConfirmBtn = document.getElementById('togglePwdConfirmBtn');

    const ruleUpper = document.getElementById('ruleUpper');
    const ruleLower = document.getElementById('ruleLower');
    const ruleNumber = document.getElementById('ruleNumber');
    const ruleSpecial = document.getElementById('ruleSpecial');
    const ruleLen = document.getElementById('ruleLen');

    const brn1Input = document.getElementById('brn1');
    const brn2Input = document.getElementById('brn2');
    const brn3Input = document.getElementById('brn3');
    const brnHidden = document.getElementById('brn');
    const brnVerifyBtn = document.getElementById('brnVerifyBtn');
    const brnMsg = document.getElementById('brnMsg');

    const zipNoInput = document.getElementById('zipNo');
    const addrInput = document.getElementById('addr');
    const addrDetailInput = document.getElementById('addrDetail');
    const addrSearchBtn = document.getElementById('addrSearchBtn');
    const addrMsg = document.getElementById('addrMsg');

    const logoInput = document.getElementById('logo');
    const logoPreview = document.getElementById('logoPreview');
    const logoImg = document.getElementById('logoImg');
    const logoMeta = document.getElementById('logoMeta');

    let brnVerified = false;
    let comIdChecked = false;
    let emailChecked = false;

    function showError(msg) {
        serverError.textContent = msg || '요청 처리 중 오류가 발생했습니다.';
        serverError.style.display = 'block';
    }

    async function readJsonSafely(res) {
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) return await res.json();
        const text = await res.text();
        try { return JSON.parse(text); } catch { return { message: text }; }
    }

    function setNote(el, msg, ok) {
        el.textContent = msg || '';
        el.classList.remove('note-success');
        el.style.color = ok ? 'var(--success)' : 'var(--error)';
        if (ok) el.classList.add('note-success');
    }

    function isFilled(v) { return (v || '').trim().length > 0; }

    function normalizeComId() {
        return (comIdInput.value || '').trim().toUpperCase();
    }

    function normalizeBrn() {
        const b1 = (brn1Input.value || '').replace(/\D/g, '');
        const b2 = (brn2Input.value || '').replace(/\D/g, '');
        const b3 = (brn3Input.value || '').replace(/\D/g, '');
        const combined = (b1 + b2 + b3).trim();
        brnHidden.value = combined;
        return combined;
    }

    function setBrnMsg(msg, ok) {
        brnMsg.textContent = msg || '';
        brnMsg.style.color = ok ? 'var(--success)' : 'var(--error)';
    }

    function resetBrnVerifyState() {
        if (!brnVerified) return;
        brnVerified = false;
        brnVerifyBtn.disabled = false;
        brnVerifyBtn.textContent = '인증하기';
        brnMsg.textContent = '';
        brnMsg.style.color = '';
        updateSignupButtonState();
    }

    function handleBrnInput(current, next, maxLen) {
        current.addEventListener('input', () => {
            current.value = (current.value || '').replace(/\D/g, '').slice(0, maxLen);
            normalizeBrn();
            resetBrnVerifyState();
            if (current.value.length === maxLen && next) next.focus();
        });

        current.addEventListener('beforeinput', (e) => {
            if (!e.inputType || !e.inputType.startsWith('insert')) return;
            const data = e.data ?? '';
            if (data && /\D/.test(data)) {
                e.preventDefault();
                setBrnMsg('사업자등록번호는 숫자만 입력 가능합니다.', false);
            }
        });
    }

    handleBrnInput(brn1Input, brn2Input, 3);
    handleBrnInput(brn2Input, brn3Input, 2);
    handleBrnInput(brn3Input, null, 5);

    function isValidEmailFormat(v) {
        const email = (v || '').trim();
        return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
    }

    function setRule(el, ok){
        el.classList.toggle('ok', ok);
        const icon = el.querySelector('.pwd-icon');
        if (icon) icon.textContent = ok ? '✓' : '✗';
    }

    function checkPwdRules(pwd){
        const hasUpper = /[A-Z]/.test(pwd);
        const hasLower = /[a-z]/.test(pwd);
        const hasNumber = /[0-9]/.test(pwd);
        const hasSpecial = /[^A-Za-z0-9]/.test(pwd);
        const len = (pwd || '').length;
        const hasLen = len >= 8 && len <= 20;

        setRule(ruleUpper, hasUpper);
        setRule(ruleLower, hasLower);
        setRule(ruleNumber, hasNumber);
        setRule(ruleSpecial, hasSpecial);
        setRule(ruleLen, hasLen);

        return hasUpper && hasLower && hasNumber && hasSpecial && hasLen;
    }

    function isBasicFieldsReady() {
        const comNameOk = isFilled(comNameInput.value);
        const addrOk = isFilled(addrInput.value);
        const pwdOk = isFilled(pwdInput.value);
        const pwdConfirmOk = isFilled(pwdConfirmInput.value);

        const pwdMatch = pwdOk && pwdConfirmOk && (pwdInput.value === pwdConfirmInput.value);
        const rulesOk = checkPwdRules(pwdInput.value);

        return comNameOk && addrOk && pwdOk && pwdConfirmOk && pwdMatch && rulesOk;
    }

    function updateSignupButtonState() {
        const basicReady = isBasicFieldsReady();
        const ready = basicReady && brnVerified && comIdChecked && emailChecked;
        signupBtn.disabled = !ready;

        if (!ready) {
            brnNote.classList.remove('note-success');
            const missing = [];

            if (!isFilled(comNameInput.value)) missing.push('기업 이름');
            if (!isFilled(pwdInput.value)) missing.push('비밀번호');
            if (!isFilled(addrInput.value)) missing.push('주소');
            if (!comIdChecked) missing.push('회사코드 중복확인');
            if (!emailChecked) missing.push('이메일 중복확인');
            if (!brnVerified) missing.push('사업자등록번호 인증');

            const pwd = pwdInput.value || '';
            if (pwd) {
                if (!/[A-Z]/.test(pwd)) missing.push('영어 대문자');
                if (!/[a-z]/.test(pwd)) missing.push('영어 소문자');
                if (!/[0-9]/.test(pwd)) missing.push('숫자');
                if (!/[^A-Za-z0-9]/.test(pwd)) missing.push('특수문자');
                if (pwd.length < 8 || pwd.length > 20) missing.push('8자 이상 20자 이내');
            } else {
                missing.push('비밀번호 조건');
            }

            if (!isFilled(pwdConfirmInput.value)) missing.push('비밀번호 확인');
            if (isFilled(pwdInput.value) && isFilled(pwdConfirmInput.value) && pwdInput.value !== pwdConfirmInput.value) {
                missing.push('비밀번호 일치');
            }

            brnNote.textContent = '* 다음 항목을 완료해야 회원가입 버튼이 활성화됩니다: ' + missing.join(', ');
        } else {
            brnNote.classList.add('note-success');
            brnNote.textContent = '✓ 모든 입력/검증이 완료되었습니다. 회원가입을 진행할 수 있습니다.';
        }
    }

    /* =====================
     * 기업명 50자 초과 차단 + warn
     * ===================== */
    let comNameWarnTimer = null;

    function showComNameWarn(msg) {
        comNameWarn.textContent = msg;
        comNameWarn.style.color = 'var(--error)';
        comNameWarn.classList.remove('note-success');

        if (comNameWarnTimer) clearTimeout(comNameWarnTimer);
        comNameWarnTimer = setTimeout(() => {
            comNameWarn.textContent = '';
            comNameWarn.style.color = '';
            comNameWarnTimer = null;
        }, 1500);
    }

    comNameInput.addEventListener('beforeinput', (e) => {
        if (!e.inputType || !e.inputType.startsWith('insert')) return;
        const data = e.data ?? '';
        if (!data) return;

        const start = comNameInput.selectionStart ?? comNameInput.value.length;
        const end = comNameInput.selectionEnd ?? comNameInput.value.length;
        const nextLen = comNameInput.value.length - (end - start) + data.length;

        if (nextLen > 50) {
            e.preventDefault();
            showComNameWarn('기업 이름은 최대 50자까지 가능합니다.');
        }
    });

    /* =====================
     * 회사코드 warn (영문만 / 3글자)
     * ===================== */
    let comIdWarnTimer = null;

    function showComIdWarn(msg) {
        comIdWarn.textContent = msg;
        comIdWarn.style.color = 'var(--error)';
        comIdWarn.classList.remove('note-success');

        if (comIdWarnTimer) clearTimeout(comIdWarnTimer);
        comIdWarnTimer = setTimeout(() => {
            comIdWarn.textContent = '';
            comIdWarn.style.color = '';
            comIdWarnTimer = null;
        }, 1500);
    }

    comIdInput.addEventListener('beforeinput', (e) => {
        if (!e.inputType || !e.inputType.startsWith('insert')) return;

        const data = e.data ?? '';
        if (!data) return;

        if (/[^a-zA-Z]/.test(data)) {
            e.preventDefault();
            showComIdWarn('영문(A-Z)만 입력 가능합니다.');
            return;
        }

        const start = comIdInput.selectionStart ?? comIdInput.value.length;
        const end = comIdInput.selectionEnd ?? comIdInput.value.length;
        const nextLen = comIdInput.value.length - (end - start) + data.length;

        if (nextLen > 3) {
            e.preventDefault();
            showComIdWarn('회사 코드는 최대 3글자까지 가능합니다.');
        }
    });

    comIdInput.addEventListener('paste', (e) => {
        const text = (e.clipboardData || window.clipboardData).getData('text') || '';
        if (!text) return;

        if (/[^a-zA-Z]/.test(text)) {
            e.preventDefault();
            showComIdWarn('영문(A-Z)만 입력 가능합니다.');
            return;
        }

        const start = comIdInput.selectionStart ?? comIdInput.value.length;
        const end = comIdInput.selectionEnd ?? comIdInput.value.length;
        const nextLen = comIdInput.value.length - (end - start) + text.length;

        if (nextLen > 3) {
            e.preventDefault();
            showComIdWarn('회사 코드는 최대 3글자까지 가능합니다.');
        }
    });

    comIdInput.addEventListener('input', () => {
        const normalized = (comIdInput.value || '')
            .replace(/[^a-zA-Z]/g, '')
            .toUpperCase()
            .slice(0, 3);

        if (comIdInput.value !== normalized) {
            comIdInput.value = normalized;
        }

        if (comIdChecked) {
            comIdChecked = false;
            comIdCheckBtn.disabled = false;
            comIdCheckBtn.textContent = '중복확인';
            setNote(comIdMsg, '회사코드가 변경되었습니다. 다시 중복확인 해주세요.', false);
        }

        updateSignupButtonState();
    });

    /* =====================
     * 이메일 50자 초과 입력 차단 + warn
     * ===================== */
    let emailWarnTimer = null;

    function showEmailWarn(msg) {
        setNote(emailMsg, msg, false);
        if (emailWarnTimer) clearTimeout(emailWarnTimer);
        emailWarnTimer = setTimeout(() => {
            if (emailMsg.textContent === msg) {
                emailMsg.textContent = '';
                emailMsg.style.color = '';
                emailMsg.classList.remove('note-success');
            }
            emailWarnTimer = null;
        }, 1500);
    }

    emailInput.addEventListener('beforeinput', (e) => {
        if (!e.inputType || !e.inputType.startsWith('insert')) return;

        const data = e.data ?? '';
        if (!data) return;

        const start = emailInput.selectionStart ?? emailInput.value.length;
        const end = emailInput.selectionEnd ?? emailInput.value.length;
        const nextLen = emailInput.value.length - (end - start) + data.length;

        if (nextLen > 50) {
            e.preventDefault();
            showEmailWarn('이메일은 최대 50자까지 가능합니다.');
        }
    });

    /* =====================
     * 비밀번호 규칙/일치
     * ===================== */
    function checkPasswordMatch() {
        const pwd = pwdInput.value;
        const confirm = pwdConfirmInput.value;

        checkPwdRules(pwd);

        if (!confirm) {
            pwdMatchMsg.textContent = '';
            pwdMatchMsg.className = '';
            updateSignupButtonState();
            return;
        }

        if (pwd === confirm) {
            pwdMatchMsg.textContent = '✓ 비밀번호가 일치합니다.';
            pwdMatchMsg.className = 'match-success';
        } else {
            pwdMatchMsg.textContent = '✗ 비밀번호가 일치하지 않습니다.';
            pwdMatchMsg.className = 'match-error';
        }

        updateSignupButtonState();
    }

    togglePwdBtn.addEventListener('click', () => {
        pwdInput.type = (pwdInput.type === 'password') ? 'text' : 'password';
    });

    togglePwdConfirmBtn.addEventListener('click', () => {
        pwdConfirmInput.type = (pwdConfirmInput.type === 'password') ? 'text' : 'password';
    });

    /* =====================
     * 주소 팝업 + 콜백
     * ===================== */
    addrSearchBtn.addEventListener('click', () => {
        window.open('/auth/juso/popup', 'jusoPopup', 'width=570,height=420,scrollbars=yes,resizable=yes');
    });

    window.jusoCallBack = function(roadAddrPart1, addrDetail, zipNo){
        zipNoInput.value = zipNo || '';
        addrInput.value = (roadAddrPart1 || '').trim();
        if (addrDetail) addrDetailInput.value = addrDetail;
        addrDetailInput.focus();

        addrMsg.textContent = '✓ 주소가 입력되었습니다.';
        addrMsg.style.color = 'var(--success)';
        addrMsg.classList.add('note-success');

        updateSignupButtonState();
    };

    /* =====================
     * 입력 감지 -> 버튼 상태 갱신
     * ===================== */
    comNameInput.addEventListener('input', updateSignupButtonState);
    addrDetailInput.addEventListener('input', updateSignupButtonState);
    pwdInput.addEventListener('input', checkPasswordMatch);
    pwdConfirmInput.addEventListener('input', checkPasswordMatch);

    /* =====================
     * 회사코드 중복확인
     * ===================== */
    comIdCheckBtn.addEventListener('click', async () => {
        serverError.style.display = 'none';
        serverError.textContent = '';
        comIdMsg.textContent = '';

        const comId = normalizeComId();
        if (!comId || comId.length !== 3) {
            setNote(comIdMsg, '회사코드는 3글자로 입력해주세요.', false);
            comIdInput.focus();
            return;
        }

        try {
            comIdCheckBtn.disabled = true;
            comIdCheckBtn.textContent = '확인중...';

            const fd = new FormData();
            fd.set('comId', comId);

            const res = await fetch('/auth/companies/check-comid', { method: 'POST', body: fd });
            const result = await readJsonSafely(res);

            if (res.ok) {
                comIdChecked = true;
                setNote(comIdMsg, result?.message || '✓ 사용 가능한 회사코드입니다.', true);
                comIdCheckBtn.textContent = '확인완료';
                comIdCheckBtn.disabled = true;
            } else {
                comIdChecked = false;
                setNote(comIdMsg, result?.message || '이미 사용 중인 회사코드입니다.', false);
                comIdCheckBtn.disabled = false;
                comIdCheckBtn.textContent = '중복확인';
            }
            updateSignupButtonState();
        } catch (e) {
            console.error(e);
            comIdChecked = false;
            setNote(comIdMsg, '회사코드 중복확인 중 오류가 발생했습니다.', false);
            comIdCheckBtn.disabled = false;
            comIdCheckBtn.textContent = '중복확인';
            updateSignupButtonState();
        }
    });

    /* =====================
     * 이메일 변경 시 체크 해제 + 유효성
     * ===================== */
    emailInput.addEventListener('input', () => {
        const value = (emailInput.value || '').trim();

        if (emailChecked) {
            emailChecked = false;
            emailCheckBtn.disabled = false;
            emailCheckBtn.textContent = '중복확인';
            setNote(emailMsg, '이메일이 변경되었습니다. 다시 중복확인 해주세요.', false);
            updateSignupButtonState();
            return;
        }

        if (!value) { emailMsg.textContent=''; updateSignupButtonState(); return; }
        if (value.length > 50) { setNote(emailMsg, '이메일은 50자 이내여야 합니다.', false); updateSignupButtonState(); return; }
        if (!isValidEmailFormat(value)) { setNote(emailMsg, '이메일 형식이 올바르지 않습니다. 예) admin@company.com', false); updateSignupButtonState(); return; }

        emailMsg.textContent = '';
        emailMsg.classList.remove('note-success');
        updateSignupButtonState();
    });

    /* =====================
     * 이메일 중복확인
     * ===================== */
    emailCheckBtn.addEventListener('click', async () => {
        serverError.style.display = 'none';
        serverError.textContent = '';
        emailMsg.textContent = '';

        const value = (emailInput.value || '').trim();

        if (!value) { setNote(emailMsg, '이메일을 입력해주세요.', false); emailInput.focus(); return; }
        if (value.length > 50) { setNote(emailMsg, '이메일은 50자 이내여야 합니다.', false); emailInput.focus(); return; }
        if (!isValidEmailFormat(value)) { setNote(emailMsg, '이메일 형식이 올바르지 않습니다. 예) admin@company.com', false); emailInput.focus(); return; }

        try {
            emailCheckBtn.disabled = true;
            emailCheckBtn.textContent = '확인중...';

            const fd = new FormData();
            fd.set('email', value);

            const res = await fetch('/auth/companies/check-email', { method: 'POST', body: fd });
            const result = await readJsonSafely(res);

            if (res.ok) {
                emailChecked = true;
                setNote(emailMsg, result?.message || '✓ 사용 가능한 이메일입니다.', true);
                emailCheckBtn.textContent = '확인완료';
                emailCheckBtn.disabled = true;
            } else {
                emailChecked = false;
                setNote(emailMsg, result?.message || '이미 사용 중인 이메일입니다.', false);
                emailCheckBtn.disabled = false;
                emailCheckBtn.textContent = '중복확인';
            }
            updateSignupButtonState();
        } catch (e) {
            console.error(e);
            emailChecked = false;
            setNote(emailMsg, '이메일 중복확인 중 오류가 발생했습니다.', false);
            emailCheckBtn.disabled = false;
            emailCheckBtn.textContent = '중복확인';
            updateSignupButtonState();
        }
    });
    /* =====================
       * [LOCAL ONLY] BRN 인증 스킵 토글
       * - 로컬 테스트용: true
       * - 운영/실서버: false (원래 API 인증 로직 사용)
       * ===================== */
    const SKIP_BRN_VERIFY_FOR_LOCAL = false;
    /* =====================
     * 사업자 인증
     * ===================== */
    brnVerifyBtn.addEventListener('click', async () => {
        serverError.style.display = 'none';
        serverError.textContent = '';
        brnMsg.textContent = '';
        brnMsg.style.color = '';

        const brn = normalizeBrn();

        if (brn.length !== 10) {
            setBrnMsg('사업자등록번호를 3-2-5 자리로 모두 입력해주세요.', false);
            if (brn1Input.value.length < 3) brn1Input.focus();
            else if (brn2Input.value.length < 2) brn2Input.focus();
            else brn3Input.focus();
            return;
        }

        // :흰색_확인_표시: 로컬 테스트용: 버튼 누르면 바로 인증완료 처리
        if (SKIP_BRN_VERIFY_FOR_LOCAL) {
            brnVerified = true;
            brnVerifyBtn.textContent = '인증완료';
            brnVerifyBtn.disabled = true;
            setBrnMsg('✓ (로컬 테스트) 사업자등록번호 인증이 완료되었습니다.', true);
            updateSignupButtonState();
            return;
        }

        try {
            brnVerifyBtn.disabled = true;
            brnVerifyBtn.textContent = '인증중...';

            const fd = new FormData();
            fd.set('brn', brn);

            const comId = normalizeComId();
            if (comId) fd.set('comId', comId);

            const res = await fetch('/auth/companies/verify-brn', { method: 'POST', body: fd });
            const result = await readJsonSafely(res);

            if (!res.ok) {
                brnVerified = false;
                setBrnMsg(result?.message || '✗ 사업자 인증에 실패했습니다.', false);
                brnVerifyBtn.disabled = false;
                brnVerifyBtn.textContent = '인증하기';
                updateSignupButtonState();
                return;
            }

            const verified = (typeof result === 'boolean')
                ? result
                : (result?.verified !== undefined ? !!result.verified : true);

            if (!verified) {
                brnVerified = false;
                setBrnMsg(result?.message || '✗ 사업자 인증에 실패했습니다.', false);
                brnVerifyBtn.disabled = false;
                brnVerifyBtn.textContent = '인증하기';
                updateSignupButtonState();
                return;
            }

            brnVerified = true;
            brnVerifyBtn.textContent = '인증완료';
            brnVerifyBtn.disabled = true;

            setBrnMsg(result?.message || '✓ 사업자등록번호 인증이 완료되었습니다.', true);
            updateSignupButtonState();
        } catch (err) {
            console.error(err);
            brnVerified = false;
            setBrnMsg('✗ 사업자 인증 요청 중 오류가 발생했습니다.', false);
            brnVerifyBtn.disabled = false;
            brnVerifyBtn.textContent = '인증하기';
            updateSignupButtonState();
        }
    });

    /* =====================
     * 로고 프리뷰
     * ===================== */
    logoInput.addEventListener('change', () => {
        const file = logoInput.files?.[0];
        if (!file) {
            logoPreview.style.display = 'none';
            return;
        }
        const url = URL.createObjectURL(file);
        logoImg.src = url;
        logoMeta.textContent = `${file.name} (${Math.round(file.size / 1024)} KB)`;
        logoPreview.style.display = 'flex';
    });

    /* =====================
     * ✅ 관리자 계정 모달 + 복사(아이콘 -> ✓로 잠깐 변경)
     * ResponseDto<>(HttpStatus.CREATED, "회사 회원가입 성공", createEmployee)
     * -> result.data.empId / result.data.pwd
     * ===================== */
    const adminModal = document.getElementById('adminModal');
    const adminModalClose = document.getElementById('adminModalClose');
    const goLoginBtn = document.getElementById('goLoginBtn');

    const adminEmpIdText = document.getElementById('adminEmpIdText');
    const adminPwdText = document.getElementById('adminPwdText');

    const copyEmpIdBtn = document.getElementById('copyEmpIdBtn');
    const copyPwdBtn = document.getElementById('copyPwdBtn');
    const copyEmpIdMsg = document.getElementById('copyEmpIdMsg');
    const copyPwdMsg = document.getElementById('copyPwdMsg');

    function openAdminModal(empId, pwd){
        adminEmpIdText.textContent = empId || '-';
        adminPwdText.textContent = pwd || '-';
        copyEmpIdMsg.textContent = '';
        copyPwdMsg.textContent = '';
        resetCopyButton(copyEmpIdBtn);
        resetCopyButton(copyPwdBtn);
        adminModal.classList.add('show');
        adminModal.setAttribute('aria-hidden', 'false');
    }

    function closeAdminModal(){
        adminModal.classList.remove('show');
        adminModal.setAttribute('aria-hidden', 'true');
    }

    adminModalClose.addEventListener('click', closeAdminModal);
    adminModal.addEventListener('click', (e) => {
        if (e.target === adminModal) closeAdminModal();
    });
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && adminModal.classList.contains('show')) closeAdminModal();
    });

    function setCopiedUI(btn, msgEl){
        const copyIcon = btn.querySelector('.icon-copy');
        const checkIcon = btn.querySelector('.icon-check');
        if (copyIcon) copyIcon.style.display = 'none';
        if (checkIcon) checkIcon.style.display = 'block';
        btn.classList.add('copied');
        msgEl.textContent = '✓ 복사되었습니다.';

        clearTimeout(btn._copiedTimer);
        btn._copiedTimer = setTimeout(() => {
            resetCopyButton(btn);
            msgEl.textContent = '';
        }, 1200);
    }

    function resetCopyButton(btn){
        const copyIcon = btn.querySelector('.icon-copy');
        const checkIcon = btn.querySelector('.icon-check');
        if (copyIcon) copyIcon.style.display = 'block';
        if (checkIcon) checkIcon.style.display = 'none';
        btn.classList.remove('copied');
    }

    async function copyTextWithFeedback(text, btn, msgEl){
        try{
            await navigator.clipboard.writeText(text);
            setCopiedUI(btn, msgEl);
        }catch(err){
            // fallback
            try{
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                setCopiedUI(btn, msgEl);
            }catch(e){
                msgEl.textContent = '복사에 실패했습니다.';
                setTimeout(() => msgEl.textContent = '', 1200);
            }
        }
    }

    copyEmpIdBtn.addEventListener('click', () => {
        const v = adminEmpIdText.textContent || '';
        if (v && v !== '-') copyTextWithFeedback(v, copyEmpIdBtn, copyEmpIdMsg);
    });

    copyPwdBtn.addEventListener('click', () => {
        const v = adminPwdText.textContent || '';
        if (v && v !== '-') copyTextWithFeedback(v, copyPwdBtn, copyPwdMsg);
    });

    goLoginBtn.addEventListener('click', () => {
        window.location.href = '/auth/companies/login';
    });

    /* =====================
     * submit
     * ===================== */
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        serverError.style.display = 'none';
        serverError.textContent = '';

        if (!isBasicFieldsReady()) {
            showError('기업 이름, 비밀번호 조건/일치, 주소를 모두 입력해주세요.');
            return;
        }

        if (!(brnVerified && comIdChecked && emailChecked)) {
            showError('사업자 인증, 회사코드 중복확인, 이메일 중복확인을 모두 완료해주세요.');
            return;
        }

        const fd = new FormData(form);
        fd.set('comId', normalizeComId());
        fd.set('brn', normalizeBrn());

        const road = (addrInput.value || '').trim();
        const detail = (addrDetailInput.value || '').trim();
        fd.set('addr', detail ? `${road} ${detail}` : road);

        try {
            signupBtn.disabled = true;

            const res = await fetch('/auth/companies/signup', { method: 'POST', body: fd });
            const result = await readJsonSafely(res);

            if (res.ok) {
                // ✅ 응답: new ResponseDto<>(HttpStatus.CREATED, "회사 회원가입 성공", createEmployee)
                const admin = result?.data ?? null;
                const empId = admin?.empId;
                const pwd = admin?.pwd;

                if (!empId || !pwd) {
                    alert((result?.message || '회사 회원가입 성공') + '\n(관리자 계정 정보가 응답에 없습니다. ResponseDto의 data 필드를 확인해주세요.)');
                    window.location.href = '/auth/employee/login';
                    return;
                }

                openAdminModal(empId, pwd);
                // 모달에서 복사 후 로그인 이동
            } else {
                showError(result?.message || '회원가입에 실패했습니다.');
                signupBtn.disabled = false;
            }
        } catch (err) {
            console.error(err);
            showError('회원가입 요청 중 오류가 발생했습니다.');
            signupBtn.disabled = false;
        }
    });

    // 최초 렌더
    checkPwdRules(pwdInput.value || '');
    updateSignupButtonState();
</script>
</body>
</html>
