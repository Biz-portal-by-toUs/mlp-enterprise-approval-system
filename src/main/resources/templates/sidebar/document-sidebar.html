<!-- templates/sidebar/document-sidebar.html -->
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="subbar" th:fragment="documentSidebar(active)">
    <div class="subbar-title">문서</div>

    <nav class="subbar-nav" aria-label="문서 메뉴">
        <a class="subbar-item"
           th:href="@{/document-forms}" href="/document-forms"
           th:classappend="${active}=='create' ? ' active' : ''">
            문서 작성
        </a>

        <a class="subbar-item"
           th:href="@{/documents/me(status='UNSUBMITTED')}" href="/documents/me?status=UNSUBMITTED"
           th:classappend="${active}=='unsubmitted' ? ' active' : ''">
            임시저장 문서
        </a>

        <a class="subbar-item"
           th:href="@{/documents/me(status='SUBMITTED')}" href="/documents/me?status=SUBMITTED"
           th:classappend="${active}=='submitted' ? ' active' : ''">
            상신한 문서
        </a>

        <a class="subbar-item"
           th:href="@{/documents/me(status='AWAITING')}" href="/documents/me?status=AWAITING"
           th:classappend="${active}=='awaiting' ? ' active' : ''">
            결재할 문서
        </a>

        <a class="subbar-item"
           th:href="@{/documents/me(status='PROCESSED')}" href="/documents/me?status=PROCESSED"
           th:classappend="${active}=='processed' ? ' active' : ''">
            결재한 문서
        </a>

        <a class="subbar-item"
           th:href="@{/documents(status='FINALIZED')}" href="/documents?status=FINALIZED"
           th:classappend="${active}=='finalized' ? ' active' : ''">
            최종승인 문서
        </a>
    </nav>

</aside>
</body>
</html>
