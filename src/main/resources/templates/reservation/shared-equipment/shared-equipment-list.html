<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bizportal - 공유 설비 조회</title>
    <style>
        :root{
            --blue:#1677ff;
            --bg:#f4f6f8;
            --sidebar:#ffffff;
            --text:#1f2937;
            --muted:#6b7280;
            --card:#ffffff;
            --border:#e5e7eb;
            --shadow: 0 6px 18px rgba(0,0,0,.08);
            --radius:14px;
        }
        *{box-sizing:border-box}
        body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Malgun Gothic,sans-serif;color:var(--text);background:var(--bg)}
        .app{min-height:100vh;display:flex;flex-direction:column}
        .topbar{
            height:56px;background:var(--blue);color:#fff;display:flex;align-items:center;
            padding:0 16px;gap:16px;
        }
        .logo{font-weight:800;letter-spacing:.2px}
        .search{
            flex:1;max-width:680px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);
            border:1px solid rgba(255,255,255,.22);padding:8px 12px;border-radius:999px;
        }
        .search input{
            border:none;outline:none;background:transparent;color:#fff;width:100%;
        }
        .search input::placeholder{color:rgba(255,255,255,.75)}
        .top-actions{display:flex;align-items:center;gap:10px;font-size:13px;opacity:.95}
        .layout{flex:1;display:flex}
        .sidebar{
            width:92px;background:var(--sidebar);border-right:1px solid var(--border);
            padding:12px 8px;
        }
        .nav-item{
            width:100%;border-radius:12px;padding:10px 6px;margin-bottom:6px;
            display:flex;flex-direction:column;align-items:center;gap:6px;
            color:var(--muted);font-size:12px;
            cursor:default;
        }
        .nav-item.active{background:#eaf2ff;color:var(--blue);font-weight:700}
        .nav-ico{
            width:34px;height:34px;border-radius:10px;background:#f3f4f6;
            display:flex;align-items:center;justify-content:center;
            font-weight:800;
        }

        .content{flex:1;padding:18px 20px;}
        .page-title{font-size:20px;font-weight:800;margin:2px 0 14px}

        .field label{font-size:12px;color:var(--muted)}
        .field input{
            border:none;outline:none;font-size:13px;width:110px;
        }
        .btn{
            border:1px solid var(--border);background:#fff;border-radius:12px;padding:9px 12px;
            cursor:pointer;font-size:13px;
        }
        .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
        .btn:disabled{opacity:.5;cursor:not-allowed}

        .grid{
            display:grid;
            grid-template-columns: repeat(3, minmax(0, 1fr)); /* 3개씩 */
            gap:16px;
        }
        @media (max-width: 1100px){
            .grid{grid-template-columns: repeat(2, minmax(0,1fr));}
        }
        @media (max-width: 720px){
            .sidebar{display:none}
            .grid{grid-template-columns: 1fr;}
        }
        .card{
            background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
            overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
            min-height:320px;
        }
        .thumb{
            height:160px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;
        }
        .thumb img{width:100%;height:100%;object-fit:cover;display:block}
        .thumb .ph{color:#6b7280;font-size:12px}
        .card-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
        .eq-name{font-weight:800}
        .meta{font-size:12px;color:var(--muted);line-height:1.45}
        .meta b{color:var(--text);font-weight:700}
        .divider{height:1px;background:var(--border);margin:2px 0}
        .paging{
            margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
        }
        .page-btn{
            min-width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:#fff;
            cursor:pointer;font-size:13px;
        }
        .page-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
        .error{margin:12px 0;padding:10px 12px;border:1px solid #fecaca;background:#fff1f2;color:#991b1b;border-radius:12px;display:none}

        /* 카드 선택 */
        .card.selectable {
            cursor: pointer;
        }
        .card.selected {
            outline: 3px solid var(--blue);
        }

        /* 하단 우측 액션 버튼 */
        .fab {
            position: fixed;
            right: 24px;
            bottom: 24px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .card.selectable:hover {
            box-shadow: 0 0 0 2px rgba(22,119,255,.4);
        }
        /* 관리자 액션 바 */
        .action-bar {
            display: none;                 /* JS에서 제어 */
            justify-content: flex-end;     /* 🔥 오른쪽 정렬 */
            align-items: center;
            gap: 10px;

            margin-top: 12px;              /* 카드와 거리 */
            margin-bottom: 12px;           /* 페이지네이션과 거리 */
            padding-right: 4px;            /* 화면 끝과 살짝 여백 */
        }

        /* 버튼 공통 */
        .action-bar .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            cursor: pointer;

            background-color: #1677ff;
            color: #fff;
            transition: background-color 0.2s ease;
        }

        /* hover */
        .action-bar .action-btn:hover:not(:disabled) {
            background-color: #4096ff;
        }

        /* disabled */
        .action-bar .action-btn:disabled {
            background-color: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
        }

        /* 삭제 버튼 */
        .action-bar .action-btn.danger:not(:disabled) {
            background-color: #ef4444;
        }

        /* 모달 배경 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .hidden {
            display: none;
        }

        /* 모달 박스 */
        .modal-content {
            background: #fff;
            padding: 24px;
            border-radius: 10px;
            width: 360px;
            text-align: center;
        }

        .modal-title {
            margin-bottom: 12px;
            color: #d32f2f;
        }

        .modal-text {
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        /* 버튼 영역 */
        .modal-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        /* 공통 버튼 */
        .btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: background 0.2s, transform 0.1s;
        }

        /* 취소 버튼 */
        .btn.cancel {
            background: #e0e0e0;
            color: #333;
        }

        .btn.cancel:hover {
            background: #cfcfcf;
        }

        /* 삭제 버튼 (경고) */
        .btn.delete {
            background: #d32f2f;
            color: #fff;
        }

        .btn.delete:hover {
            background: #b71c1c;
        }

        /* 버튼 hover 시 살짝 떠오르는 느낌 */
        .btn:hover {
            transform: translateY(-1px);
        }

    </style>
</head>

<body>
<div class="app">
    <!-- 상단 바(배너) -->
    <header class="topbar">
        <div class="logo">B Bizportal</div>
        <div class="search" title="검색은 UI만(조회 기능만 구현)">
            <span style="opacity:.9">🔍</span>
            <input placeholder="Search" disabled />
        </div>
        <div class="top-actions">
            <span>근무중</span>
            <span>🔔</span>
            <span>🙂</span>
            <span style="border:1px solid rgba(255,255,255,.35);padding:6px 10px;border-radius:999px;">로그아웃</span>
        </div>
    </header>

    <div class="layout">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="nav-item"><div class="nav-ico">📄</div>결재</div>
            <div class="nav-item active"><div class="nav-ico">📅</div>예약</div>
            <div class="nav-item"><div class="nav-ico">👥</div>조직</div>
            <div class="nav-item"><div class="nav-ico">💬</div>채팅</div>
        </aside>

        <!-- 메인 -->
        <main class="content">
            <div class="page-title">공유 설비</div>

            <div class="error" id="errBox"></div>

            <section class="grid" id="grid"></section>

            <div id="actionBar" class="action-bar">
                <button id="btnCreate" class="action-btn primary">등록</button>
                <button id="btnEdit" class="action-btn primary" disabled>선택 수정</button>
                <button id="btnDelete" class="action-btn danger" disabled>선택 삭제</button>
            </div>

            <div class="paging" id="paging"></div>


        </main>
    </div>
</div>

<!-- 삭제 확인 모달 -->
<div id="deleteModal" class="modal hidden">
    <div class="modal-content">
        <h3 class="modal-title">⚠️ 공유 설비 삭제</h3>
        <p class="modal-text">
            공유 설비 삭제하면 <b>되돌릴 수 없습니다.</b><br>
            정말 삭제하시겠습니까?
        </p>

        <div class="modal-actions">
            <button id="confirmDeleteBtn" class="btn delete">삭제</button>
            <button id="cancelDeleteBtn" class="btn cancel">취소</button>
        </div>
    </div>
</div>

<script>

    let selectedEqNo = null;
    let isAdmin = false;
    // 이미지 없을 때 띄워줄 이미지
    const NO_IMAGE_URL = "/images/no-image.png";
    // ✅ 필요하면 여기만 바꿔
    // 같은 서버(스프링)에서 정적 페이지를 서빙하면 "" 로 둬도 됨.
    const API_BASE = "http://localhost:8090"; // 또는 ""

    const grid = document.getElementById("grid");
    const paging = document.getElementById("paging");
    const errBox = document.getElementById("errBox");
    const accessToken = localStorage.getItem("accessToken");

    let state = {
        page: 0,      // 0부터 시작 (Spring PageRequest)
        size: 6,
        totalPages: 0
    };

    function showError(msg){
        errBox.style.display = "block";
        errBox.textContent = msg;
    }
    function clearError(){
        errBox.style.display = "none";
        errBox.textContent = "";
    }

    function cardTemplate(eq){
        const safe = (v) => (v === null || v === undefined || v === "") ? "-" : v;

        return `
      <article class="card ${isAdmin ? "selectable" : ""}" data-eq-no="${eq.eqNo}">
        <div class="thumb">
          <img
            src="${eq.imageUrl || NO_IMAGE_URL}"
            onerror="this.src='${NO_IMAGE_URL}'"
            alt="공유 설비 이미지"
          />
        </div>
        <div class="card-body">
          <div class="eq-name">설비명: ${safe(eq.eqName)}</div>
          <div class="divider"></div>
          <div class="meta"><b>설비번호:</b> ${safe(eq.eqId)}</div>
          <div class="meta"><b>모델명:</b> ${safe(eq.modelName)}</div>
          <div class="meta"><b>보관위치:</b> ${safe(eq.loc)}</div>
        </div>
      </article>
    `;
    }

    function renderGrid(content){
        grid.innerHTML = content.map(cardTemplate).join("");
    }

    function enableSelection(){
        if (!isAdmin) return;

        document.querySelectorAll(".card.selectable").forEach(card => {
            card.addEventListener("click", () => {
                document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
                card.classList.add("selected");

                selectedEqNo = card.dataset.eqNo;

                document.getElementById("btnEdit").disabled = false;
                document.getElementById("btnDelete").disabled = false;
            });
        });
    }

    function renderPaging(current, total){
        paging.innerHTML = "";
        if (total <= 1) return;

        const mkBtn = (label, onClick, disabled=false, active=false) => {
            const b = document.createElement("button");
            b.className = "page-btn" + (active ? " active" : "");
            b.textContent = label;
            b.disabled = disabled;
            b.addEventListener("click", onClick);
            return b;
        };

        paging.appendChild(mkBtn("‹", () => loadEq(current - 1), current === 0));

        // 페이지 버튼 너무 많으면 1~5개만 보여주는 간단 버전
        const windowSize = 5;
        const start = Math.max(0, current - Math.floor(windowSize/2));
        const end = Math.min(total - 1, start + windowSize - 1);
        const realStart = Math.max(0, end - windowSize + 1);

        for(let p = realStart; p <= end; p++){
            paging.appendChild(mkBtn(String(p+1), () => loadEq(p), false, p === current));
        }

        paging.appendChild(mkBtn("›", () => loadEq(current + 1), current >= total - 1));
    }

    async function loadEq(page){
        clearError();

        selectedEqNo = null;
        document.getElementById("btnEdit").disabled = true;
        document.getElementById("btnDelete").disabled = true;

        // 1. accessToken 여기서 꺼냄
        if (!accessToken) {
            showError("로그인이 필요합니다.");
            return;
        }

        // 2. comId 제거 (JWT에서 서버가 꺼냄)
        const url = `${API_BASE}/api/v1/shared-equipment?page=${page}&size=${state.size}`;

        try{
            // ⭐ 3. fetch에 Authorization 헤더 추가
            const res = await fetch(url, {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + accessToken
                }
            });

            const json = await res.json();
            // 관리자 여부 세팅
            isAdmin = json.data.isAdmin === true;

            // 관리자면 하단 버튼 보이기
            if (isAdmin) {
                document.getElementById("actionBar").style.display = "flex";
            } else {
                document.getElementById("actionBar").style.display = "none";
            }
            if(!res.ok){
                showError(json?.message || `조회에 실패했습니다. (${res.status})`);
                grid.innerHTML = "";
                paging.innerHTML = "";
                return;
            }

            const pageData = json.data.data;   // Page 객체
            const content = pageData.content || [];

            renderGrid(content);
            enableSelection();

            state.totalPages = pageData.totalPages || 0;
            renderPaging(pageData.number ?? page, state.totalPages);


        }catch(e){
            showError("서버 연결에 실패했습니다. 토큰/포트/CORS 확인해주세요.");
        }
    }
    document.getElementById("btnCreate").onclick = () => {
        location.href = "/reservation/shared-equipment/shared-equipment-register";
    };

    document.getElementById("btnEdit").onclick = () => {
        if (!selectedEqNo) return;
        location.href = `/reservation/shared-equipment/${selectedEqNo}/shared-equipment-edit`;
    };

    const deleteModal = document.getElementById("deleteModal");
    const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
    const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");


    // 삭제 버튼 클릭 시 (조회 페이지의 삭제 버튼)
    function openDeleteModal() {
        deleteModal.classList.remove("hidden");
    }

    document.getElementById("btnDelete").onclick = () => {
        if (!selectedEqNo) return;
        openDeleteModal();
    };

    // 취소
    cancelDeleteBtn.addEventListener("click", () => {
        deleteModal.classList.add("hidden");
    });

    // 삭제 확정
    confirmDeleteBtn.addEventListener("click", async () => {
        try {
            const res = await fetch(`${API_BASE}/api/v1/shared-equipment/${selectedEqNo}`, {
                method: "DELETE",
                headers: {
                    Authorization: "Bearer " + accessToken
                }
            });

            if (!res.ok) {
                throw new Error("삭제에 실패했습니다.");
            }

            alert("공유 설비가 삭제되었습니다.");
            deleteModal.classList.add("hidden");
            // 선택 표시 초기화
            selectedEqNo = null;
            document.getElementById("btnEdit").disabled = true;
            document.getElementById("btnDelete").disabled = true;
            loadEq(state.page); // 현재 페이지 다시 조회

        } catch (e) {
            alert("삭제 중 오류가 발생했습니다.");
        }
    });

    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
            deleteModal.classList.add("hidden");
        }
    });

    // 처음 로드
    loadEq(0);
</script>
</body>
</html>
