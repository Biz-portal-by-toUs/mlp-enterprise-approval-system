<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bizportal - Company Login</title>
    <style>
        :root {
            --bg: #f3f3f3;
            --text: #111;
            --border: #d7d7d7;
            --primary: #2f66d7;
            --input-bg: #fff;
            --error: #e74c3c;
            --errorBg: #f8d7da;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo",
            "Noto Sans KR", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .page {
            min-height: 100vh;
            border: 2px solid #222;
            margin: 12px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: min(560px, 92vw);
            text-align: center;
            padding: 40px 24px;
        }

        .title {
            font-size: 52px;
            font-weight: 900;
            margin: 0 0 18px;
            letter-spacing: -0.5px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 24px;
        }

        .field { text-align: left; }

        .label {
            font-size: 13px;
            font-weight: 800;
            color: #777;
            margin: 0 0 8px 10px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .input-wrap {
            position: relative;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .input-wrap:focus-within {
            border-color: var(--primary);
        }

        input {
            border: 0;
            outline: none;
            width: 100%;
            font-size: 17px;
            background: transparent;
            font-weight: 500;
        }

        .eye-btn {
            width: 40px;
            height: 36px;
            border: 0;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            opacity: 0.5;
            flex: 0 0 auto;
            transition: opacity 0.2s;
        }
        .eye-btn:hover { opacity: 1; }
        .eye-btn svg { width: 20px; height: 20px; }

        /* ✅ 수정: .btn 스타일이 헤더에 영향을 주지 않도록 card 내부로 한정하거나 속성 분리 */
        .card .btn {
            appearance: none;
            border: 1px solid var(--border);
            background: #fff;
            padding: 14px 18px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            color: #222;
            transition: all 0.2s;
            font-size: 16px;
            width: 100%; /* 로그인 버튼은 가득 차게 */
        }

        /* ✅ 핵심 수정: margin-top이 헤더 버튼에 적용되지 않도록 .form 내부의 버튼으로 한정 */
        .form .btn.primary {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
            margin-top: 8px;
        }

        .form .btn.primary:hover {
            opacity: 0.9;
        }

        .error {
            display: none;
            color: var(--error);
            border: 1px solid rgba(231, 76, 60, 0.2);
            background-color: var(--errorBg);
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 10px;
            text-align: left;
            font-weight: 700;
            font-size: 14px;
        }

        .hint {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            font-weight: 600;
        }
        .hint a { color: var(--primary); text-decoration: none; margin-left: 4px; }
        .hint a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .title { font-size: 40px; }
        }
    </style>
</head>

<body>
<div class="page">
    <div th:replace="~{company/common/company-header :: companyHeader}"></div>

    <main>
        <section class="card">
            <h1 class="title">Company Login</h1>

            <div id="serverError" class="error"></div>

            <form id="company-login-form" class="form">
                <div class="field">
                    <div class="label">Email Address</div>
                    <div class="input-wrap">
                        <input id="email" name="email" type="email" placeholder="name@company.com" autocomplete="username" required />
                    </div>
                </div>

                <div class="field">
                    <div class="label">Password</div>
                    <div class="input-wrap">
                        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
                        <button class="eye-btn" type="button" aria-label="toggle password" data-target="password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button class="btn primary" type="submit">Login</button>
            </form>

            <div class="hint">
                사원 계정이신가요? <a th:href="@{/auth/employee/login}">사원 로그인으로 이동</a>
            </div>
            <div class="hint" style="margin-top:10px;">
                <a th:href="@{/auth/companies/verify}">비밀번호를 잊으셨나요?</a>
            </div>
        </section>
    </main>
</div>

<script>
    // 비밀번호 보기/숨기기 토글
    document.querySelectorAll('.eye-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-target');
            const input = document.getElementById(id);
            if (!input) return;
            input.type = (input.type === 'password') ? 'text' : 'password';
        });
    });

    const form = document.getElementById('company-login-form');
    const serverError = document.getElementById('serverError');

    async function safeJson(res) {
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) return {};
        try { return await res.json(); } catch { return {}; }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        serverError.style.display = 'none';
        serverError.textContent = '';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/auth/companies/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email, password })
            });

            const result = await safeJson(res);

            if (res.ok) {
                window.location.href = '/';
            } else {
                serverError.textContent = result?.message || `로그인 실패 (${res.status})`;
                serverError.style.display = 'block';
            }
        } catch (err) {
            console.error(err);
            serverError.textContent = '로그인 요청 중 오류가 발생했습니다.';
            serverError.style.display = 'block';
        }
    });
</script>
</body>
</html>
