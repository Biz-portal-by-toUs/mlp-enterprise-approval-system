<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">

<th:block layout:fragment="pageStyles">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles1.css}">

    <style>
        :root{
            --card:#ffffff;
            --text:#1f2937;
            --muted:#6b7280;
            --line:rgba(17,24,39,.10);
            --primary:#3b82f6;
            --danger:#dc2626;
        }
        *{box-sizing:border-box}

        .subbar-main{
            flex: 1;
            min-width: 0;
            padding: 24px;
        }
        h2{
            font-weight: 900;
            letter-spacing: -0.3px;
            margin: 0 0 14px;
        }

        /* ====== Summary table ====== */
        .summary-card{
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            overflow: hidden;
            margin-bottom: 14px;
        }
        .summary-table{ width:100%; border-collapse: collapse; table-layout: fixed; }
        .summary-table th,
        .summary-table td{
            border-top: 1px solid rgba(17,24,39,.08);
            border-right: 1px solid rgba(17,24,39,.08);
            padding: 14px 14px;
            vertical-align: middle;
        }
        .summary-table tr:first-child th,
        .summary-table tr:first-child td{ border-top: 0; }
        .summary-table th{
            width: 160px;
            background: rgba(17,24,39,.02);
            font-weight: 900;
            color: #111827;
            text-align: center;
            letter-spacing: -0.2px;
        }
        .summary-table td{ border-right: 0; }

        .summary-input{
            width: 100%;
            height: 42px;
            border-radius: 8px;
            border: 1px solid rgba(17,24,39,.14);
            padding: 0 12px;
            font-weight: 800;
            outline: none;
            background: #fff;
        }
        .summary-input:focus{
            border-color: rgba(59,130,246,.55);
            box-shadow: 0 0 0 4px rgba(59,130,246,.12);
        }
        .summary-select{
            width: 160px;
            height: 42px;
            border-radius: 8px;
            border: 1px solid rgba(17,24,39,.14);
            padding: 0 10px;
            font-weight: 900;
            outline: none;
            background: #fff;
        }
        .summary-select:focus{
            border-color: rgba(59,130,246,.55);
            box-shadow: 0 0 0 4px rgba(59,130,246,.12);
        }
        .period-inline{
            display:flex;
            align-items:center;
            gap:10px;
            flex-wrap: wrap;
        }
        .period-inline .sep{
            color: var(--muted);
            font-weight: 900;
            font-size: 12px;
            padding: 0 2px;
        }
        .summary-date{
            height: 42px;
            width: 180px;
            border-radius: 8px;
            border: 1px solid rgba(17,24,39,.14);
            padding: 0 10px;
            font-weight: 800;
            outline:none;
            background:#fff;
        }
        .summary-date:focus{
            border-color: rgba(59,130,246,.55);
            box-shadow: 0 0 0 4px rgba(59,130,246,.12);
        }
        .hint{
            color: var(--muted);
            font-weight: 800;
            font-size: 12px;
            margin-left: 6px;
        }

        /* ====== Editor ====== */
        .editor-wrap{
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            overflow: hidden;
            margin-bottom: 14px;
        }
        .office-toolbar{
            display:flex;
            flex-wrap: nowrap;
            align-items:center;
            gap: 6px;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(17,24,39,.10);
            background:#fff;

            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .office-toolbar::-webkit-scrollbar{ height: 0; }
        .office-toolbar{ scrollbar-width: none; }

        .tb-select{
            height: 32px;
            min-width: 86px;
            border: 1px solid rgba(17,24,39,.14);
            border-radius: 4px;
            padding: 0 8px;
            font-weight: 900;
            font-size: 13px;
            background:#fff;
            flex: 0 0 auto;
        }
        .tb-btn{
            height: 32px;
            padding: 0 8px;
            border: 1px solid rgba(17,24,39,.14);
            border-radius: 4px;
            background:#fff;
            font-weight: 900;
            font-size: 13px;
            cursor:pointer;
            user-select:none;
            flex: 0 0 auto;
            letter-spacing: -0.2px;
        }
        .tb-btn:hover{
            background: rgba(59,130,246,.06);
            border-color: rgba(59,130,246,.35);
        }
        .tb-btn.is-active{
            background: #3b82f6;
            border-color:#3b82f6;
            color:#fff;
        }
        .tb-btn:disabled{ opacity:.55; cursor:not-allowed; }

        .tb-sep{
            width:1px;
            height:20px;
            background:rgba(17,24,39,.12);
            margin: 0 1px;
            flex: 0 0 auto;
        }

        .office-editor{
            min-height: 520px;
            padding: 18px;
            background:#fff;
        }
        .office-editor .ProseMirror{
            outline:none;
            min-height: 520px;
            line-height: 1.75;
            font-size: 1rem;
            color: var(--text);
            white-space: pre-wrap;
        }

        .office-editor .ProseMirror table{
            width:100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin: 10px 0;
        }
        .office-editor .ProseMirror td,
        .office-editor .ProseMirror th{
            border:1px solid rgba(17,24,39,.18);
            padding:10px;
            vertical-align: top;
            word-break: break-word;
        }
        .office-editor .ProseMirror th{
            background: rgba(17,24,39,.03);
            font-weight:900;
            color: var(--muted);
        }
        .office-editor .ProseMirror .selectedCell:after{
            content:"";
            position:absolute;
            inset:0;
            background: rgba(59,130,246,.10);
            pointer-events:none;
        }
        .office-editor .ProseMirror td,
        .office-editor .ProseMirror th{ position:relative; }

        .office-counter{
            padding: 8px 12px;
            border-top: 1px solid rgba(17,24,39,.10);
            text-align:right;
            font-weight: 900;
            color: var(--muted);
            background:#fff;
        }
        .office-counter.over{ color: var(--danger); }

        /* ===== 첨부(통합) ===== */
        .file-attach-section{
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(17,24,39,.06);
            padding: 16px;
            margin-bottom: 14px;
        }
        .file-attach-header{
            font-weight: 900;
            margin-bottom: 10px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:12px;
            flex-wrap:wrap;
        }
        .file-attach-sub{
            color: var(--muted);
            font-weight: 800;
            font-size: 12px;
        }

        .file-input-wrapper{ position: relative; display: inline-block; }
        .file-input-wrapper input[type="file"]{ position:absolute; opacity:0; width:0; height:0; }
        .file-upload-btn{
            display:inline-flex; align-items:center; gap:8px;
            padding: 10px 14px;
            border: 1px solid rgba(17,24,39,.14);
            border-radius: 8px;
            background:#fff;
            font-weight: 900;
            cursor:pointer;
            user-select:none;
            font-size: 13px;
        }

        /* 드롭존 */
        .dropzone{
            margin-top: 10px;
            padding: 18px 14px;
            border: 2px dashed rgba(17,24,39,.18);
            border-radius: 10px;
            background: rgba(59,130,246,.03);
            color: var(--muted);
            font-weight: 900;
            text-align: center;
            user-select: none;
        }
        .dropzone .dropzone-hint{
            margin-top: 6px;
            font-size: 12px;
            font-weight: 800;
            opacity: .9;
        }
        .dropzone.is-dragover{
            border-color: rgba(59,130,246,.55);
            background: rgba(59,130,246,.08);
            color: var(--text);
            box-shadow: 0 0 0 4px rgba(59,130,246,.10);
        }

        /* 단일 목록 */
        .file-list{
            margin-top: 12px;
            display:flex;
            flex-direction:column;
            gap:8px;
        }
        .file-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
            padding: 10px 12px;
            border: 1px solid rgba(17,24,39,.12);
            border-radius: 8px;
            background:#fff;
            font-size: 13px;
        }
        .file-item-left{
            display:flex;
            align-items:center;
            gap:10px;
            min-width:0;
            flex:1;
        }
        .file-item-name{
            font-weight: 900;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }
        .file-item-meta{
            font-size:12px;
            color: var(--muted);
            font-weight:800;
            margin-top:2px;
        }
        .tag{
            display:inline-flex;
            align-items:center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 1000;
            border: 1px solid rgba(17,24,39,.12);
            background: rgba(17,24,39,.02);
            color: var(--muted);
            flex:0 0 auto;
        }
        .tag.existing{
            background: rgba(16,185,129,.08);
            border-color: rgba(16,185,129,.22);
            color: #059669;
        }
        .tag.new{
            background: rgba(59,130,246,.08);
            border-color: rgba(59,130,246,.22);
            color: #2563eb;
        }

        .file-actions{
            display:flex;
            align-items:center;
            gap:8px;
            flex:0 0 auto;
        }
        .btn-mini{
            border: 1px solid rgba(17,24,39,.14);
            background:#fff;
            border-radius: 8px;
            padding: 6px 10px;
            font-weight: 900;
            font-size: 12px;
            cursor:pointer;
        }
        .btn-mini:hover{ background: rgba(59,130,246,.06); border-color: rgba(59,130,246,.35); }
        .btn-mini.danger{
            border-color: rgba(220,38,38,.22);
            color: var(--danger);
        }
        .btn-mini.danger:hover{
            background: rgba(220,38,38,.08);
            border-color: rgba(220,38,38,.35);
        }

        .form-actions{
            display:flex;
            justify-content:flex-end;
            gap:10px;
            flex-wrap:wrap;
            margin-top: 10px;
        }
        .btn-submit{
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 900;
            border: 1px solid rgba(59,130,246,.25);
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color:#fff;
            box-shadow: 0 12px 24px rgba(59,130,246,.30);
            cursor:pointer;
        }
        .btn-submit:disabled{ opacity:.7; cursor:not-allowed; }
        .btn-cancel{
            display:inline-flex; align-items:center; justify-content:center;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 900;
            color: var(--muted);
            text-decoration:none;
            background: linear-gradient(180deg, #ffffff, #f9fafb);
            border: 1px solid rgba(17,24,39,.15);
            box-shadow: 0 8px 18px rgba(17,24,39,.06);
        }

        @media (max-width: 720px){
            .summary-table th{ width: 110px; }
            .summary-select{ width: 100%; }
            .summary-date{ width: 100%; }
            .period-inline{ width:100%; }
        }

        /* (선택) 등록 화면에서 겪었던 bootstrap .badge 충돌 방지 필요 시 */
        header .topbar-right .icon-btn > .badge{
            position: absolute;
            right: 6px;
            top: 6px;
            width: 9px;
            height: 9px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid var(--primary);
            padding: 0 !important;
            min-width: 0 !important;
            font-size: 0 !important;
            line-height: 0 !important;
            display: block !important;
        }
    </style>
</th:block>

<div layout:fragment="content">
    <div class="page-with-subbar">
        <div th:replace="~{sidebar/board-sidebar :: boardSidebar('notice')}"></div>

        <main class="subbar-main">
            <div class="container">
                <h2>공지사항 수정</h2>

                <form id="updateForm" enctype="multipart/form-data">
                    <input type="hidden" id="noticeNo" name="noticeNo" th:value="${noticeNo}">

                    <div class="summary-card">
                        <table class="summary-table">
                            <tr>
                                <th>제목</th>
                                <td>
                                    <input type="text" id="title" name="title" class="summary-input" required maxlength="100">
                                </td>
                            </tr>
                            <tr>
                                <th>팝업여부</th>
                                <td style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                                    <select id="isPopupSelect" name="isPopup" class="summary-select" required>
                                        <option value="true">사용</option>
                                        <option value="false">미사용</option>
                                    </select>
                                    <span class="hint">사용 선택 시 아래 ‘팝업기간’ 입력</span>
                                </td>
                            </tr>
                            <tr>
                                <th>팝업기간</th>
                                <td>
                                    <div class="period-inline">
                                        <input type="date" id="startedAt" name="startedAt" class="summary-date">
                                        <span class="sep">~</span>
                                        <input type="date" id="endedAt" name="endedAt" class="summary-date">
                                        <span class="hint">(미사용이면 자동 비활성)</span>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <div class="editor-wrap">
                        <div class="office-toolbar" id="ttToolbar">
                            <select class="tb-select" id="headingSelect" title="서식">
                                <option value="h2" selected>제목2</option>
                                <option value="p">본문</option>
                            </select>

                            <button type="button" class="tb-btn" data-cmd="bold">굵게</button>
                            <button type="button" class="tb-btn" data-cmd="italic">기울임</button>
                            <button type="button" class="tb-btn" data-cmd="underline">밑줄</button>
                            <button type="button" class="tb-btn" data-cmd="strike">취소선</button>

                            <span class="tb-sep"></span>

                            <button type="button" class="tb-btn" data-cmd="alignLeft">왼쪽</button>
                            <button type="button" class="tb-btn" data-cmd="alignCenter">가운데</button>
                            <button type="button" class="tb-btn" data-cmd="alignRight">오른쪽</button>

                            <span class="tb-sep"></span>

                            <button type="button" class="tb-btn" data-cmd="bulletList">글머리</button>
                            <button type="button" class="tb-btn" data-cmd="orderedList">번호</button>

                            <span class="tb-sep"></span>

                            <button type="button" class="tb-btn" data-cmd="insertTable">표 삽입</button>
                            <button type="button" class="tb-btn" data-cmd="rowPlus">행 +</button>
                            <button type="button" class="tb-btn" data-cmd="colPlus">열 +</button>
                            <button type="button" class="tb-btn" data-cmd="rowMinus">행 -</button>
                            <button type="button" class="tb-btn" data-cmd="colMinus">열 -</button>
                            <button type="button" class="tb-btn" data-cmd="deleteTable">표 삭제</button>

                            <span class="tb-sep"></span>

                            <button type="button" class="tb-btn" data-cmd="undo">실행취소</button>
                            <button type="button" class="tb-btn" data-cmd="redo">다시실행</button>
                        </div>

                        <div id="contentsEditor" class="office-editor"></div>

                        <div class="office-counter">
                            <span id="charCount">0</span> / <span id="charLimit">1000</span>
                        </div>

                        <input type="hidden" id="contents" name="contents" required>
                    </div>

                    <!-- ✅ 통합 첨부 영역 -->
                    <div class="file-attach-section">
                        <div class="file-attach-header">
                            <div>
                                <div style="font-weight:900;">📎 첨부파일</div>
                                <div class="file-attach-sub">최대 5개, 개당 10MB (기존 첨부 + 새 첨부 합산)</div>
                            </div>

                            <div class="file-input-wrapper">
                                <input type="file" id="file-input" multiple accept="*/*" onchange="handleFileSelect(event)">
                                <label for="file-input" class="file-upload-btn">📁 파일 선택</label>
                            </div>
                        </div>

                        <div class="dropzone" id="dropzone">
                            여기로 파일을 드래그해서 놓으세요
                            <div class="dropzone-hint">또는 “파일 선택”을 눌러 첨부</div>
                        </div>

                        <!-- ✅ 단일 목록(기존+신규) -->
                        <div class="file-list" id="file-list">
                            <div style="color:#adb5bd; font-size:12px; padding:10px;">첨부된 파일이 없습니다.</div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit" id="submitBtn">수정</button>
                        <a th:href="@{/notice/list}" class="btn-cancel">취소</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- TipTap -->
    <script type="module">
        const LIMIT = 1000;

        import { Editor } from "https://esm.sh/@tiptap/core@2.11.5";
        import StarterKit from "https://esm.sh/@tiptap/starter-kit@2.11.5";
        import Underline from "https://esm.sh/@tiptap/extension-underline@2.11.5";
        import TextAlign from "https://esm.sh/@tiptap/extension-text-align@2.11.5";
        import CharacterCount from "https://esm.sh/@tiptap/extension-character-count@2.11.5";
        import Table from "https://esm.sh/@tiptap/extension-table@2.11.5";
        import TableRow from "https://esm.sh/@tiptap/extension-table-row@2.11.5";
        import TableHeader from "https://esm.sh/@tiptap/extension-table-header@2.11.5";
        import TableCell from "https://esm.sh/@tiptap/extension-table-cell@2.11.5";

        const hidden = document.getElementById("contents");
        const editorEl = document.getElementById("contentsEditor");
        const toolbar = document.getElementById("ttToolbar");
        const headingSelect = document.getElementById("headingSelect");

        const charCountEl = document.getElementById("charCount");
        const charLimitEl = document.getElementById("charLimit");
        const counterWrap = document.querySelector(".office-counter");

        charLimitEl.textContent = String(LIMIT);

        const editor = new Editor({
            element: editorEl,
            extensions: [
                StarterKit,
                Underline,
                TextAlign.configure({ types: ["heading", "paragraph"] }),
                CharacterCount.configure({ limit: LIMIT }),
                Table.configure({ resizable: true }),
                TableRow,
                TableHeader,
                TableCell,
            ],
            content: { type: "doc", content: [{ type: "paragraph" }] },
            onCreate(){ syncHidden(); refreshToolbar(); refreshCount(); },
            onUpdate(){ syncHidden(); refreshToolbar(); refreshCount(); },
            onSelectionUpdate(){ refreshToolbar(); }
        });

        function syncHidden(){ hidden.value = JSON.stringify(editor.getJSON()); }
        function refreshCount(){
            const count = editor.storage.characterCount.characters();
            charCountEl.textContent = String(count);
            counterWrap.classList.toggle("over", count > LIMIT);
        }
        function setActive(btn, on){ btn.classList.toggle("is-active", !!on); }
        function ensureTable(){
            if (editor.isActive("table")) return;
            editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run();
        }
        function refreshToolbar(){
            const inTable = editor.isActive("table");

            toolbar.querySelectorAll(".tb-btn").forEach(btn=>{
                const cmd = btn.dataset.cmd;
                if (!cmd) return;

                const activeMap = {
                    bold: editor.isActive("bold"),
                    italic: editor.isActive("italic"),
                    underline: editor.isActive("underline"),
                    strike: editor.isActive("strike"),
                    bulletList: editor.isActive("bulletList"),
                    orderedList: editor.isActive("orderedList"),
                    alignLeft: editor.isActive({ textAlign: "left" }) || (!editor.getAttributes("paragraph").textAlign && !editor.getAttributes("heading").textAlign),
                    alignCenter: editor.isActive({ textAlign: "center" }),
                    alignRight: editor.isActive({ textAlign: "right" }),
                };

                setActive(btn, activeMap[cmd]);

                if (cmd === "undo") btn.disabled = !editor.can().chain().focus().undo().run();
                if (cmd === "redo") btn.disabled = !editor.can().chain().focus().redo().run();
                if (cmd === "rowMinus") btn.disabled = !inTable;
                if (cmd === "colMinus") btn.disabled = !inTable;
                if (cmd === "deleteTable") btn.disabled = !inTable;
            });

            if (editor.isActive("heading", { level: 2 })) headingSelect.value = "h2";
            else headingSelect.value = "p";
        }

        headingSelect.addEventListener("change", ()=>{
            const v = headingSelect.value;
            const chain = editor.chain().focus();
            if (v === "h2") chain.setHeading({ level: 2 }).run();
            else chain.setParagraph().run();
            refreshToolbar(); syncHidden(); refreshCount();
        });

        toolbar.addEventListener("click", (e)=>{
            const btn = e.target.closest(".tb-btn");
            if (!btn) return;
            const cmd = btn.dataset.cmd;
            if (!cmd) return;

            const chain = editor.chain().focus();

            switch(cmd){
                case "bold": chain.toggleBold().run(); break;
                case "italic": chain.toggleItalic().run(); break;
                case "underline": chain.toggleUnderline().run(); break;
                case "strike": chain.toggleStrike().run(); break;

                case "alignLeft": chain.setTextAlign("left").run(); break;
                case "alignCenter": chain.setTextAlign("center").run(); break;
                case "alignRight": chain.setTextAlign("right").run(); break;

                case "bulletList": chain.toggleBulletList().run(); break;
                case "orderedList": chain.toggleOrderedList().run(); break;

                case "insertTable":
                    chain.insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run();
                    break;

                case "rowPlus":
                    ensureTable();
                    editor.chain().focus().addRowAfter().run();
                    break;

                case "colPlus":
                    ensureTable();
                    editor.chain().focus().addColumnAfter().run();
                    break;

                case "rowMinus": chain.deleteRow().run(); break;
                case "colMinus": chain.deleteColumn().run(); break;
                case "deleteTable": chain.deleteTable().run(); break;

                case "undo": chain.undo().run(); break;
                case "redo": chain.redo().run(); break;
                default: break;
            }

            refreshToolbar();
            syncHidden();
            refreshCount();
        });

        // 외부에서 기존 contents 자동 로딩(JSON/HTML/텍스트)
        function isProbablyJson(str){
            if (typeof str !== "string") return false;
            const s = str.trim();
            if (!s) return false;
            if (!(s.startsWith("{") || s.startsWith("["))) return false;
            try {
                const obj = JSON.parse(s);
                return !!obj && typeof obj === "object" && (obj.type === "doc" || obj.content);
            } catch { return false; }
        }
        function isProbablyHtml(str){
            if (typeof str !== "string") return false;
            const s = str.trim();
            if (!s) return false;
            return /<\/?[a-z][\s\S]*>/i.test(s);
        }
        function escapeHtml(str){
            return String(str ?? "")
                .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
                .replaceAll('"',"&quot;").replaceAll("'","&#039;");
        }

        window.__setEditorContentAuto = (contents)=>{
            if (contents == null) {
                editor.commands.setContent({ type:"doc", content:[{ type:"paragraph"}] });
                syncHidden(); refreshCount(); refreshToolbar();
                return;
            }
            if (typeof contents === "object") {
                editor.commands.setContent(contents);
                syncHidden(); refreshCount(); refreshToolbar();
                return;
            }
            const raw = String(contents);
            if (isProbablyJson(raw)) editor.commands.setContent(JSON.parse(raw));
            else if (isProbablyHtml(raw)) editor.commands.setContent(raw);
            else editor.commands.setContent(`<p>${escapeHtml(raw).replaceAll("\n","<br>")}</p>`);
            syncHidden(); refreshCount(); refreshToolbar();
        };

        window.__editorGetText = () => editor.getText();
        window.__editorGetCount = () => editor.storage.characterCount.characters();
    </script>

    <!-- Update + 첨부(통합) -->
    <script th:inline="javascript">
        const noticeNo = [[${noticeNo}]];
        const API_BASE = "http://localhost:8090";

        // ✅ 기존 첨부(서버) + 신규 첨부(로컬) 통합 렌더링용
        let existingAttachments = []; // [{attachmentId, originalName, size, displayOrder, ...}]
        let newFiles = [];            // [File]

        function toDateOnly(value){
            if (!value) return "";
            return String(value).substring(0,10);
        }

        function setupPopupToggle(){
            const select = document.getElementById("isPopupSelect");
            const startAt = document.getElementById("startedAt");
            const endAt = document.getElementById("endedAt");

            function toggle(v){
                const enabled = String(v) === "true";
                startAt.disabled = !enabled;
                endAt.disabled = !enabled;
                startAt.required = enabled;
                endAt.required = enabled;
                if (!enabled) { startAt.value=""; endAt.value=""; }
            }
            select.addEventListener("change",(e)=>toggle(e.target.value));
            toggle(select.value);
        }

        // ===== 드롭/선택 공통 =====
        function totalCount(){
            return existingAttachments.length + newFiles.length;
        }

        function addFiles(files){
            const maxSize = 10 * 1024 * 1024;
            const maxCount = 5;

            for (const file of files) {
                if (totalCount() >= maxCount) {
                    alert(`최대 ${maxCount}개까지만 첨부할 수 있습니다. (기존 첨부 포함)`);
                    break;
                }
                if (file.size > maxSize) {
                    alert(`${file.name}은(는) 10MB를 초과합니다.`);
                    continue;
                }

                // 중복 체크: 기존 첨부(originalName, size) + 신규(file.name, size)
                const dupExisting = existingAttachments.some(a => (a.originalName === file.name) && (Number(a.size) === Number(file.size)));
                const dupNew = newFiles.some(f => (f.name === file.name) && (Number(f.size) === Number(file.size)));
                if (dupExisting || dupNew) {
                    alert(`${file.name}은(는) 이미 첨부되었습니다.`);
                    continue;
                }

                newFiles.push(file);
            }
            renderUnifiedList();
        }

        function handleFileSelect(event){
            addFiles(Array.from(event.target.files || []));
            event.target.value = "";
        }

        function setupDropzone(){
            const dz = document.getElementById("dropzone");
            if (!dz) return;

            const prevent = (e) => { e.preventDefault(); e.stopPropagation(); };

            ["dragenter","dragover"].forEach(evt =>
                dz.addEventListener(evt, (e)=>{
                    prevent(e);
                    dz.classList.add("is-dragover");
                })
            );

            ["dragleave","dragend","drop"].forEach(evt =>
                dz.addEventListener(evt, (e)=>{
                    prevent(e);
                    dz.classList.remove("is-dragover");
                })
            );

            dz.addEventListener("drop", (e)=>{
                const files = Array.from(e.dataTransfer?.files || []);
                addFiles(files);
            });
        }

        // ===== 통합 목록 렌더링 =====
        function formatFileSize(bytes) {
            if (!bytes) return "0 Bytes";
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function escapeHtml(str){
            return String(str ?? "")
                .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
                .replaceAll('"',"&quot;").replaceAll("'","&#039;");
        }

        function renderUnifiedList(){
            const container = document.getElementById("file-list");

            if (existingAttachments.length === 0 && newFiles.length === 0) {
                container.innerHTML = '<div style="color:#adb5bd; font-size:12px; padding:10px;">첨부된 파일이 없습니다.</div>';
                return;
            }

            const rows = [];

            // 기존 첨부
            existingAttachments.forEach((a) => {
                rows.push(`
                  <div class="file-item">
                    <div class="file-item-left">
                      <span class="tag existing">기존</span>
                      <div style="min-width:0;">
                        <div class="file-item-name" title="${escapeHtml(a.originalName)}">${escapeHtml(a.originalName)}</div>
                        <div class="file-item-meta">${formatFileSize(Number(a.size || 0))}</div>
                      </div>
                    </div>
                    <div class="file-actions">
                      <button type="button" class="btn-mini danger" onclick="deleteExisting(${a.attachmentId})">삭제</button>
                    </div>
                  </div>
                `);
            });

            // 신규 첨부
            newFiles.forEach((f, idx) => {
                rows.push(`
                  <div class="file-item">
                    <div class="file-item-left">
                      <span class="tag new">신규</span>
                      <div style="min-width:0;">
                        <div class="file-item-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
                        <div class="file-item-meta">${formatFileSize(Number(f.size || 0))}</div>
                      </div>
                    </div>
                    <div class="file-actions">
                      <button type="button" class="btn-mini danger" onclick="removeNew(${idx})">✕</button>
                    </div>
                  </div>
                `);
            });

            container.innerHTML = rows.join("");
        }

        // 신규 삭제(로컬)
        function removeNew(index){
            newFiles.splice(index, 1);
            renderUnifiedList();
        }
        window.removeNew = removeNew;

        // 기존 삭제(서버)
        async function deleteExisting(attachmentId){
            if (!attachmentId) return;
            if (!confirm("기존 첨부파일을 삭제할까요?")) return;

            try {
                const res = await fetch(`${API_BASE}/api/v1/attachments/${attachmentId}`, {
                    method: "DELETE",
                    credentials: "include"
                });

                if (!res.ok) throw new Error("삭제 실패: " + await res.text());
                await res.json().catch(()=>({}));

                // 목록에서 제거
                existingAttachments = existingAttachments.filter(a => a.attachmentId !== attachmentId);
                renderUnifiedList();
            } catch (e) {
                console.error(e);
                alert("첨부 삭제 중 오류");
            }
        }
        window.deleteExisting = deleteExisting;

        // ===== 업로드(신규만) =====
        function getFileType(mimeType) {
            const t = mimeType || "";
            if (t.startsWith('image/')) return 'IMAGE';
            if (t.startsWith('audio/')) return 'AUDIO';
            return 'DOC';
        }

        async function uploadNewFiles(entityId){
            if (newFiles.length === 0) return;

            for (const file of newFiles) {
                try {
                    const presignRes = await fetch('/api/v1/attachments/presign', {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            domain: 'NOTICE',
                            entityId: entityId,
                            fileType: getFileType(file.type),
                            originalName: file.name,
                            contentType: file.type || 'application/octet-stream',
                            size: file.size
                        })
                    });
                    if (!presignRes.ok) continue;

                    const presignData = await presignRes.json();
                    const { objectKey, uploadUrl } = presignData.data;

                    const uploadRes = await fetch(uploadUrl, {
                        method: 'PUT',
                        headers: { 'Content-Type': file.type || 'application/octet-stream' },
                        body: file
                    });
                    if (!uploadRes.ok) continue;

                    const etag = uploadRes.headers.get('ETag');

                    await fetch('/api/v1/attachments/complete', {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            domain: 'NOTICE',
                            entityId: entityId,
                            fileType: getFileType(file.type),
                            objectKey,
                            originalName: file.name,
                            contentType: file.type || 'application/octet-stream',
                            size: file.size,
                            etag: etag ? etag.replace(/"/g, '') : null
                        })
                    });
                } catch (e) {
                    console.error(`[${file.name}] 업로드 오류:`, e);
                }
            }
        }

        // ===== 데이터 로드 =====
        async function loadExistingAttachments(){
            try {
                const response = await fetch(`${API_BASE}/api/v1/attachments?domain=NOTICE&entityId=${noticeNo}`, {
                    method: 'GET',
                    credentials: "include",
                    headers: {'Content-Type': 'application/json'}
                });
                const result = await response.json().catch(()=>({}));

                if (result.status === 200 && Array.isArray(result.data)) {
                    existingAttachments = result.data.map(r => ({
                        attachmentId: r.attachmentId,
                        originalName: r.originalName,
                        size: r.size,
                        displayOrder: r.displayOrder
                    }));
                } else {
                    existingAttachments = [];
                }
                renderUnifiedList();
            } catch (e) {
                console.error("Failed to load attachments:", e);
                existingAttachments = [];
                renderUnifiedList();
            }
        }

        async function loadNoticeDetails(){
            try {
                const response = await fetch(`${API_BASE}/api/v1/notice/${noticeNo}`, {
                    method: 'GET',
                    credentials: "include",
                    headers: {'Content-Type': 'application/json'}
                });

                const result = await response.json().catch(()=>({}));

                if (result.status === 200 && result.data) {
                    const notice = result.data;

                    document.getElementById('title').value = notice.title ?? "";
                    document.getElementById("isPopupSelect").value = String(notice.isPopup);

                    document.getElementById("startedAt").value = toDateOnly(notice.startedAt);
                    document.getElementById("endedAt").value = toDateOnly(notice.endedAt);

                    if (window.__setEditorContentAuto) {
                        window.__setEditorContentAuto(notice.contents ?? "");
                    }

                    setupPopupToggle();
                    await loadExistingAttachments();
                } else {
                    alert('공지사항을 불러오는 데 실패했습니다.');
                }
            } catch (error) {
                console.error('Error loading notice details:', error);
                alert('공지사항을 불러오는 중 오류가 발생했습니다.');
            }
        }

        // ===== submit =====
        document.getElementById('updateForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const text = (window.__editorGetText ? window.__editorGetText() : "").trim();
            const count = window.__editorGetCount ? window.__editorGetCount() : 0;

            if (!text) { alert("공지 내용을 입력하세요."); return; }
            if (count > 1000) { alert("공지 내용은 최대 1000자까지 입력 가능합니다."); return; }

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;

            const formData = new FormData(this);

            // 팝업기간 처리
            const isPopup = formData.get("isPopup");
            const startedDate = formData.get("startedAt");
            const endedDate = formData.get("endedAt");

            // ✅ [추가] 팝업 기간 validation
            if (isPopup === "true" && startedDate && endedDate) {
                if (startedDate > endedDate) {
                    alert("팝업 시작일은 종료일보다 클 수 없습니다.");
                    submitBtn.disabled = false;
                    return;
                }
            }

            if (isPopup === "true") {
                if (startedDate) formData.set("startedAt", `${startedDate}T00:00:00`);
                if (endedDate) formData.set("endedAt", `${endedDate}T23:59:59`);
            } else {
                formData.delete("startedAt");
                formData.delete("endedAt");
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/notice/${noticeNo}`, {
                    method: 'PUT',
                    credentials: "include",
                    body: formData,
                });

                const result = await response.json().catch(()=>({}));

                if (!response.ok) {
                    alert(result.message || '공지사항 수정 실패');
                    return;
                }

                // 신규만 업로드
                await uploadNewFiles(noticeNo);

                alert('공지사항이 수정되었습니다.');
                window.location.href = '/notice/list';
            } catch (error) {
                console.error('Error updating notice:', error);
                alert('공지사항 수정 중 오류가 발생했습니다.');
            } finally {
                submitBtn.disabled = false;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            setupPopupToggle();
            setupDropzone();
            loadNoticeDetails();
            renderUnifiedList();
        });
    </script>
</th:block>
