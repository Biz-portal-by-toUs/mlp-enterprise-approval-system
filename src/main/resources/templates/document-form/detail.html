<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 서버에서 docfoNo 주입 -->
    <meta name="template-id" th:content="${docfoNo}" />
    <title>문서양식 상세</title>

    <link rel="stylesheet" href="/css/editor-preset-header.css" />

    <style>
        /* =========================
   Header Layout
========================= */
        .tpl-header { max-width: 980px; margin: 0 auto 18px; }

        .tpl-titleLine{ display:flex; justify-content:center; margin: 6px 0 18px; }
        .tpl-title{
            margin:0;
            font-size:36px;
            font-weight:900;
            line-height:1.2;
            text-align:center;
            white-space:nowrap;
        }

        /* =========================
           Preset Header Tables (좌/우)
        ========================= */
        .tpl-presetHeader{
            max-width: 980px;
            margin: 0 auto 18px;
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 28px;
            align-items: flex-start;
        }

        /* 오른쪽 표를 페이지 우측으로 */
        .tpl-presetRight{ justify-self: end; }

        /* 테이블 공통 테두리 */
        .tpl-presetHeader table{
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #d7dbe3;
        }

        .tpl-presetHeader td,
        .tpl-presetHeader th{
            border: 1px solid #d7dbe3;
            padding: 8px 10px;
            vertical-align: top;
        }

        /* 왼쪽 표: 2번째 열 넓히기 */
        .tpl-presetLeft td:first-child{
            width: 30%;
            white-space: nowrap;
        }
        .tpl-presetLeft td:last-child{
            width: 70%;
        }

        /* 오른쪽 표: 헤더 무게감 + 서명행 높이 */
        .tpl-presetRight tr:first-child th{
            background:#f4f6fb;
            font-weight:600;
            padding: 10px 8px;
            text-align:center;
        }

        .tpl-presetRight tr:nth-child(2) th,
        .tpl-presetRight tr:nth-child(2) td{
            height: 100px;
            vertical-align: middle;
        }

        /* 오른쪽 표 '서명' 셀도 헤더처럼 보이게 */
        .tpl-presetRight tr:nth-child(2) th{
            background:#f4f6fb;
            font-weight:600;
            text-align:center;
        }

        /* =========================
           Categories Box
        ========================= */
        .tpl-catsBox{
            margin-top:12px;
            border:1px solid #e6e6e6;
            border-radius:14px;
            background:#fff;
            padding:10px 12px;
        }

        .tpl-cats{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            align-items:center;
        }

        /* 카테고리 라디오 비활성(상세에서 클릭 방지) */
        .tpl-catRadio{ pointer-events: none; }

        .tpl-catItem{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:4px 2px;
        }

        .tpl-catItem input[type="radio"]{ transform: translateY(1px); }

        .tpl-pill{
            border:0;
            border-radius:0;
            padding:0;
            background:transparent;
            font-size:13px;
        }

        .tpl-muted{ color:#777; font-size:13px; }

        /* (선택) 카테고리 라벨 느낌: "카테고리 없음" 같은 텍스트가 더 안정적으로 보이게 */
        .tpl-cats .tpl-muted{
            font-weight: 700;
        }

        /* =========================
           Body (JSON content)
        ========================= */
        #templateMount{ max-width:980px; margin:0 auto; }

        #templateMount .tpl-bodyBox{
            background:#fff;
            border:1px solid #e1e3ea;
            border-radius:14px;
            padding:24px 28px;
            overflow-x:auto;
            font-family: inherit;
        }

        /* 본문 정렬 데이터 속성 */
        #templateMount .tpl-bodyBox [data-ta="left"]   { text-align:left !important; }
        #templateMount .tpl-bodyBox [data-ta="center"] { text-align:center !important; }
        #templateMount .tpl-bodyBox [data-ta="right"]  { text-align:right !important; }
        #templateMount .tpl-bodyBox [data-ta="justify"]{ text-align:justify !important; }

        /* 본문 기본 간격 */
        .tpl-bodyBox p,
        .tpl-bodyBox h1,
        .tpl-bodyBox h2,
        .tpl-bodyBox h3{ margin: 8px 0; }

        /* 본문 헤딩 크기 다운(메인 제목과 경쟁 방지) */
        .tpl-bodyBox h1{ font-size: 28px; line-height: 1.25; }
        .tpl-bodyBox h2{ font-size: 22px; line-height: 1.28; }
        .tpl-bodyBox h3{ font-size: 18px; line-height: 1.3; }

        /* 본문 테이블(내용 테이블) */
        .tpl-bodyBox table{
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
            border: 1px solid #d7dbe3;
        }

        .tpl-bodyBox td,
        .tpl-bodyBox th{
            border: 1px solid #d7dbe3;
            padding: 8px 10px;
            vertical-align: top;
        }

        .tpl-bodyBox th{
            background:#f4f6fb;
            font-weight:700;
            text-align:center;
        }

        /* 입력칸(빈 입력 필드) 스타일 */
        #templateMount .tpl-bodyBox .input-field-outside-empty{
            display:inline-block;
            min-width:90px;
            padding:6px 10px;
            border:1px solid #e0e0e0;
            border-radius:10px;
            background:#fafafa;
            vertical-align: baseline;
        }

        /* =========================
           Footer Buttons
        ========================= */
        body{ padding-bottom: 92px; }

        .tpl-footer{
            position:fixed;
            left:0; right:0; bottom:0;
            background:rgba(255,255,255,0.92);
            backdrop-filter: blur(6px);
            border-top:1px solid #e6e6e6;
            padding:12px 0;
            z-index:9999;
        }

        .tpl-footerInner{
            max-width:980px;
            margin:0 auto;
            padding:0 16px;
            display:flex;
            justify-content:flex-end;
            gap:10px;
        }

        .tpl-footerBtn{
            padding:10px 16px;
            border-radius:12px;
            border:1px solid #e6e6e6;
            background:#fff;
            cursor:pointer;
            font-size:14px;
            font-weight:700;
        }

        .tpl-danger{
            background:#fff;
            border-color:#ff4d4f;
            color:#ff4d4f;
        }

        .tpl-danger:hover{
            background:#ff4d4f;
            color:#fff;
        }

        /* 수정하기 버튼 강조 */
        #tplEditBtn{
            background:#2c5cff;
            border-color:#2c5cff;
            color:#fff;
        }
        #tplEditBtn:hover{ filter: brightness(0.95); }

    </style>
</head>
<template id="presetLeftTemplate">
    <table class="preset-no-col-resize preset-left">
        <tbody>
        <tr><td>부서명</td><td></td></tr>
        <tr><td>작성자</td><td></td></tr>
        <tr><td>제목</td><td></td></tr>
        <tr><td>작성일</td><td></td></tr>
        </tbody>
    </table>
</template>

<template id="presetRightTemplate">
    <table class="preset-no-col-resize preset-right">
        <tr>
            <th>결재자</th>
            <th>결재자1</th>
            <th>결재자2</th>
            <th>결재자3</th>
            <th>결재자4</th>
            <th>결재자5</th>
        </tr>
        <tr>
            <th>서명</th>
            <td></td><td></td><td></td><td></td><td></td>
        </tr>
    </table>
</template>
<body>
<div id="tplHeaderRoot" class="tpl-header">
    <div class="tpl-titleLine">
        <h1 class="tpl-title" id="tplTitle">-</h1>
    </div>

    <div class="tpl-presetHeader">
        <div class="tpl-presetLeft" id="presetLeftMount"></div>
        <div class="tpl-presetRight" id="presetRightMount"></div>
    </div>

    <div class="tpl-catsBox">
        <div class="tpl-cats" id="tplCats">
            <span class="tpl-muted">카테고리 없음</span>
        </div>
    </div>
</div>

<div id="templateMount">로딩 중...</div>

<div id="tplFooterRoot" class="tpl-footer">
    <div class="tpl-footerInner">
        <button type="button" class="tpl-footerBtn" id="tplEditBtn">수정하기</button>
        <button type="button" class="tpl-footerBtn tpl-danger" id="tplDeleteBtn">삭제하기</button>
        <button type="button" class="tpl-footerBtn" id="tplCloseBtn">닫기</button>
    </div>
</div>
<script type="importmap">
    {
      "imports": {
        "@tiptap/core": "https://esm.sh/@tiptap/core@2.11.2?target=es2020",
        "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@2.11.2?target=es2020",

        "@tiptap/extension-table": "https://esm.sh/@tiptap/extension-table@2.11.2?target=es2020",
        "@tiptap/extension-table-row": "https://esm.sh/@tiptap/extension-table-row@2.11.2?target=es2020",
        "@tiptap/extension-table-cell": "https://esm.sh/@tiptap/extension-table-cell@2.11.2?target=es2020",
        "@tiptap/extension-table-header": "https://esm.sh/@tiptap/extension-table-header@2.11.2?target=es2020",

        "@tiptap/extension-underline": "https://esm.sh/@tiptap/extension-underline@2.11.2?target=es2020",
        "@tiptap/extension-text-align": "https://esm.sh/@tiptap/extension-text-align@2.11.2?target=es2020",
        "@tiptap/extension-text-style": "https://esm.sh/@tiptap/extension-text-style@2.11.2?target=es2020"
      }
    }
</script>
<script type="module">
    import '/js/document-form/detail-form.js';
</script>
</body>
</html>
