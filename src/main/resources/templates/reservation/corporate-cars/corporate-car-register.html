<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>법인 차량 등록</title>

    <!-- 이 페이지 전용 CSS만 pageStyles로 -->
    <th:block layout:fragment="pageStyles">
        <style>
            .corpcar-register-page {
                padding: 24px 0;
                display: flex;
                justify-content: center;
            }

            .corpcar-register-page .card {
                width: 520px;
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
                padding: 28px;
            }

            .corpcar-register-page h2 {
                margin-top: 0;
                text-align: center;
            }

            .corpcar-register-page .form-inner {
                max-width: 420px;
                margin: 0 auto;
            }

            .corpcar-register-page .field {
                margin-bottom: 14px;
            }

            .corpcar-register-page label {
                display: block;
                font-size: 13px;
                margin-bottom: 6px;
                color: #555;
            }

            .corpcar-register-page input,
            .corpcar-register-page textarea {
                width: 100%;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #ddd;
                font-size: 14px;
                box-sizing: border-box;
            }

            .corpcar-register-page textarea {
                resize: none;
            }

            .corpcar-register-page .preview-box {
                width: 100%;
                height: 220px;
                background: #e5e7eb;
                border-radius: 12px;
                overflow: hidden;
                margin-top: 10px;
            }

            .corpcar-register-page .preview-box img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: none;
            }

            .corpcar-register-page .btns {
                display: flex;
                gap: 10px;
                margin-top: 18px;
            }

            .corpcar-register-page .btns button {
                flex: 1;
                padding: 10px;
                border-radius: 8px;
                border: none;
                font-size: 14px;
                cursor: pointer;
            }

            .corpcar-register-page .btns .submit {
                background: #1677ff;
                color: #fff;
            }

            .corpcar-register-page .btns .cancel {
                background: #e5e7eb;
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="page-with-subbar">
        <!-- 🔹 왼쪽: 예약 사이드바 (법인 차량 active) -->
        <aside th:replace="sidebar/reservation-sidebar :: reservationSidebar('car')"></aside>

        <!-- 🔹 오른쪽: 실제 등록 폼 -->
        <div class="corpcar-register-page">
            <div class="card">
                <h2>법인 차량 등록</h2>

                <form id="carForm" enctype="multipart/form-data" class="form-inner">

                    <div class="field">
                        <label>차량명</label>
                        <input type="text" name="carName" maxlength="20" required>
                    </div>

                    <div class="field">
                        <label>차량번호</label>
                        <input type="text" name="plateNo" maxlength="20" required>
                    </div>

                    <div class="field">
                        <label>차종</label>
                        <input type="text" name="carType" maxlength="20">
                    </div>

                    <div class="field">
                        <label>연료</label>
                        <input type="text" name="fuel" maxlength="10">
                    </div>

                    <div class="field">
                        <label>수용 인원</label>
                        <input type="number" name="capacity" id="capacity" min="1" max="8" required>
                    </div>

                    <div class="field">
                        <label>법인 차량 이미지</label>
                        <input
                                type="file"
                                name="imageFile"
                                id="imageFile"
                                accept="image/*"
                                onchange="previewImage(this)"
                        >
                    </div>

                    <div class="preview-box">
                        <img id="imagePreview" alt="미리보기 이미지"/>
                    </div>

                    <div class="btns">
                        <button type="submit" class="submit">등록</button>
                        <button type="button" class="cancel" onclick="history.back()">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>

<th:block layout:fragment="pageScripts">
    <script>
        // httpOnly 쿠키 기반 공통 fetch
        async function apiFetch(path, options = {}) {
            const res = await fetch(path, {
                ...options,
                credentials: "include",
                headers: {...(options.headers || {})},
            });

            if (res.status === 401 || res.status === 403) {
                alert("로그인이 필요합니다.");
                location.href = "/login";
                throw new Error("UNAUTHORIZED");
            }
            return res;
        }

        function previewImage(input) {
            const preview = document.getElementById("imagePreview");

            if (!input.files || !input.files[0]) {
                preview.style.display = "none";
                preview.src = "";
                return;
            }

            const file = input.files[0];

            if (!file.type.startsWith("image/")) {
                alert("이미지 파일만 업로드 가능합니다.");
                input.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.style.display = "block";
            };

            reader.readAsDataURL(file);
        }

        async function submitCorporateCarForm(e) {
            e.preventDefault();

            const name = document.querySelector("[name=carName]").value.trim();
            const capacity = Number(document.querySelector("[name=capacity]").value);
            const form = document.getElementById("carForm");
            const formData = new FormData(form);

            if (!name) return alert("차량명을 입력해주세요.");
            if (name.length > 20) return alert("차량명은 20자 이내여야 합니다.");
            if (!capacity || capacity < 1 || capacity > 8) {
                return alert("수용 인원은 1~8명 사이여야 합니다.");
            }

            try {
                const res = await apiFetch("/api/v1/corporate-cars", {
                    method: "POST",
                    body: formData
                });

                let result = null;
                const ct = res.headers.get("content-type") || "";
                if (ct.includes("application/json")) {
                    result = await res.json();
                }

                if (!res.ok) {
                    console.error(result);
                    alert(result?.message || "등록 실패");
                    return;
                }

                alert("법인 차량 등록 성공!");
                location.href = "/corporate-cars";

            } catch (err) {
                if (err.message !== "UNAUTHORIZED") {
                    console.error(err);
                    alert("서버 오류가 발생했습니다.");
                }
            }
        }

        const capacityInput = document.getElementById("capacity");
        capacityInput.addEventListener("input", () => {
            let value = capacityInput.value;

            if (value === "") return;

            value = Number(value);

            if (isNaN(value)) {
                capacityInput.value = "";
                return;
            }

            if (value < 1) {
                capacityInput.value = 1;
                return;
            }

            if (value > 8) {
                capacityInput.value = 8;
            }
        });

        document
            .getElementById("carForm")
            .addEventListener("submit", submitCorporateCarForm);
    </script>
</th:block>

</body>
</html>
