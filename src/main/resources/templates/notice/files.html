<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>File Upload/Download</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 16px; }
        .row { display:flex; gap: 8px; align-items:center; }
        .card { border:1px solid #ddd; border-radius:12px; padding:12px; margin:12px 0; }
        table { width:100%; border-collapse: collapse; }
        th, td { border-bottom:1px solid #eee; padding:8px; text-align:left; }
        button { cursor:pointer; padding:6px 10px; }
        input[type="file"] { padding:6px; }
        .muted { color:#666; font-size: 12px; }
    </style>
</head>
<body>
<h2>파일 업로드 / 다운로드</h2>

<div class="card">
    <div class="row">
        <input id="fileInput" type="file" />
        <button onclick="upload()">업로드</button>
    </div>
    <div id="uploadResult" class="muted" style="margin-top:8px;"></div>
</div>

<div class="card">
    <div class="row" style="justify-content: space-between;">
        <h3 style="margin:0;">파일 목록</h3>
        <button onclick="loadFiles()">새로고침</button>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>원본 파일명</th>
            <th>사이즈</th>
            <th>업로드 시각</th>
            <th>다운로드</th>
        </tr>
        </thead>
        <tbody id="filesTbody"></tbody>
    </table>
</div>

<script>
    const API_BASE = "/api/v1/files";

    function formatBytes(bytes) {
        if (bytes == null) return "-";
        const units = ["B","KB","MB","GB"];
        let i = 0, v = bytes;
        while (v >= 1024 && i < units.length-1) { v /= 1024; i++; }
        return `${v.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    async function upload() {
        const input = document.getElementById("fileInput");
        const file = input.files?.[0];
        const resultEl = document.getElementById("uploadResult");
        resultEl.textContent = "";

        if (!file) {
            resultEl.textContent = "파일을 선택하세요.";
            return;
        }

        const form = new FormData();
        form.append("file", file);

        const res = await fetch(API_BASE, { method: "POST", body: form });
        if (!res.ok) {
            resultEl.textContent = `업로드 실패: HTTP ${res.status}`;
            return;
        }
        const json = await res.json();
        resultEl.textContent = `업로드 성공: id=${json.id}, name=${json.originalFilename}`;
        input.value = "";
        await loadFiles();
    }

    async function loadFiles() {
        const tbody = document.getElementById("filesTbody");
        tbody.innerHTML = "";

        const res = await fetch(API_BASE, { method: "GET" });
        if (!res.ok) {
            tbody.innerHTML = `<tr><td colspan="5">목록 조회 실패 (HTTP ${res.status})</td></tr>`;
            return;
        }
        const list = await res.json();

        if (!list.length) {
            tbody.innerHTML = `<tr><td colspan="5">업로드된 파일이 없습니다.</td></tr>`;
            return;
        }

        for (const f of list) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
        <td>${f.id}</td>
        <td>${f.originalFilename}</td>
        <td>${formatBytes(f.size)}</td>
        <td>${f.createdAt ?? "-"}</td>
        <td><a href="${API_BASE}/${encodeURIComponent(f.id)}/download">다운로드</a></td>


      `;
            tbody.appendChild(tr);
        }
    }

    window.addEventListener("DOMContentLoaded", loadFiles);
</script>
</body>
</html>
