<div id="chat-container">

    <!-- 탭 -->
    <div class="chat-tabs">
        <button hx-get="/chat/employees" hx-target="#chat-body">사원</button>
        <button hx-get="/chat/rooms" hx-target="#chat-body">채팅</button>
        <button>챗봇</button>
    </div>

    <!-- 내용 -->
    <div id="chat-body">
        <!-- 기본은 채팅방 목록 -->
        <div hx-get="/chat/rooms"
             hx-trigger="load"
             hx-target="#chat-body"></div>
    </div>

</div>
