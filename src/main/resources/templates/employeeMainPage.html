<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<th:block layout:fragment="pageStyles">
    <div class="notice-popup-scope">

        <style>
            .popup-overlay {
                position: fixed;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                background: radial-gradient(900px 600px at 20% 10%, rgba(59, 130, 246, .18), transparent 60%),
                radial-gradient(800px 500px at 85% 0%, rgba(16, 185, 129, .14), transparent 60%),
                rgba(255, 255, 255, 0.72);
                backdrop-filter: blur(6px);
                -webkit-backdrop-filter: blur(6px);
                padding: 18px;
            }

            .popup-modal {
                width: min(640px, 92vw);
                background: #ffffff;
                border-radius: 18px;
                box-shadow: 0 24px 60px rgba(17, 24, 39, .18);
                border: 1px solid rgba(17, 24, 39, .10);
                overflow: hidden;
                transform: translateY(6px);
                animation: popupIn .18s ease-out forwards;
                font-family: 'Noto Sans KR', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            }

            @keyframes popupIn {
                from {
                    opacity: 0;
                    transform: translateY(14px) scale(.98);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            .popup-header {
                padding: 14px 16px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                background: linear-gradient(135deg, rgba(59, 130, 246, .14), rgba(255, 255, 255, 0));
                border-bottom: 1px solid var(--line);
            }

            .popup-title {
                margin: 0;
                font-size: 1.05rem;
                font-weight: 900;
                letter-spacing: -0.2px;
                color: var(--text);
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .popup-title::before {
                content: "";
                width: 10px;
                height: 10px;
                border-radius: 999px;
                background: rgba(59, 130, 246, .65);
                box-shadow: 0 0 0 4px rgba(59, 130, 246, .15);
            }

            .popup-body {
                padding: 16px;
                max-height: 56vh;
                overflow: auto;
                color: var(--text);
                line-height: 1.7;
                white-space: normal;
                background: rgba(255, 255, 255, .92);
                border-top: 1px solid rgba(17, 24, 39, .06);
            }

            .popup-body::-webkit-scrollbar {
                width: 10px;
            }

            .popup-body::-webkit-scrollbar-thumb {
                background: rgba(31, 41, 55, .18);
                border-radius: 999px;
                border: 3px solid rgba(255, 255, 255, .65);
            }

            .popup-body::-webkit-scrollbar-track {
                background: transparent;
            }

            .popup-footer {
                padding: 12px 16px;
                border-top: 1px solid var(--line);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                background: var(--card);
            }

            .popup-meta {
                font-size: 12px;
                font-weight: 900;
                color: var(--muted);
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }

            #popupCounter {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 7px 10px;
                border-radius: 999px;
                background: rgba(59, 130, 246, .08);
                border: 1px solid rgba(59, 130, 246, .18);
                color: rgba(31, 41, 55, .85);
            }

            .popup-actions {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .btn {
                appearance: none;
                border: 1px solid rgba(17, 24, 39, .10);
                background: #fff;
                padding: 10px 12px;
                border-radius: 12px;
                cursor: pointer;
                font-size: 13px;
                font-weight: 900;
                color: var(--text);
                box-shadow: 0 10px 20px rgba(17, 24, 39, .06);
                transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
            }

            .btn:hover {
                transform: translateY(-1px);
                box-shadow: var(--shadow2);
                border-color: rgba(59, 130, 246, .25);
                background: rgba(59, 130, 246, .05);
            }

            .btn.primary {
                border-color: rgba(59, 130, 246, .35);
                background: linear-gradient(135deg, rgba(59, 130, 246, .18), rgba(255, 255, 255, 0));
            }

            .btn.close-x {
                border: 1px solid rgba(17, 24, 39, .10);
                background: rgba(255, 255, 255, .85);
                width: 38px;
                height: 38px;
                padding: 0;
                border-radius: 12px;
                font-size: 20px;
                line-height: 1;
                display: grid;
                place-items: center;
                color: rgba(31, 41, 55, .85);
            }

            .btn.close-x:hover {
                border-color: rgba(239, 68, 68, .30);
                background: rgba(239, 68, 68, .06);
            }

            .btn.danger {
                border-color: rgba(239, 68, 68, .25);
                background: linear-gradient(135deg, rgba(239, 68, 68, .12), rgba(255, 255, 255, 0));
            }

            .btn.danger:hover {
                border-color: rgba(239, 68, 68, .40);
                background: rgba(239, 68, 68, .06);
            }

            /* TipTap popup viewer */
            #popupBody .ProseMirror {
                outline: none;
                white-space: pre-wrap;
                line-height: 1.75;
            }

            #popupBody h2 {
                margin: 12px 0 8px;
                font-size: 1.15rem;
                font-weight: 900;
            }

            #popupBody p {
                margin: 8px 0;
            }

            #popupBody ul, #popupBody ol {
                padding-left: 22px;
                margin: 8px 0;
            }

            #popupBody blockquote {
                margin: 10px 0;
                padding: 10px 12px;
                border-left: 4px solid rgba(59, 130, 246, .35);
                background: rgba(59, 130, 246, .06);
                border-radius: 12px;
            }

            #popupBody pre {
                background: rgba(17, 24, 39, .06);
                padding: 12px;
                border-radius: 14px;
                overflow: auto;
            }

            #popupBody code {
                background: rgba(17, 24, 39, .06);
                padding: 2px 6px;
                border-radius: 8px;
                font-weight: 800;
            }

            #popupBody table {
                border-collapse: collapse;
                width: 100%;
                table-layout: fixed;
                margin: 10px 0;
                border: 1px solid rgba(17, 24, 39, .10);
                border-radius: 12px;
                overflow: hidden;
            }

            #popupBody th, #popupBody td {
                border: 1px solid rgba(17, 24, 39, .10);
                padding: 10px 12px;
                vertical-align: top;
                word-break: break-word;
                position: relative;
            }

            #popupBody th {
                background: rgba(17, 24, 39, .03);
                font-weight: 900;
                color: var(--muted);
            }

            #popupBody .selectedCell:after {
                content: "";
                position: absolute;
                inset: 0;
                background: rgba(59, 130, 246, .08);
                pointer-events: none;
            }

            @media (max-width: 520px) {
                .popup-modal {
                    width: min(560px, 94vw);
                }

                .popup-footer {
                    flex-direction: column;
                    align-items: stretch;
                }

                .popup-actions {
                    width: 100%;
                    justify-content: stretch;
                }

                .popup-actions .btn {
                    flex: 1 1 auto;
                    justify-content: center;
                }

                #popupCounter {
                    width: 100%;
                    justify-content: center;
                }
            }

        </style>

        <div id="popupOverlay" class="popup-overlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
            <div class="popup-modal">
                <div class="popup-header">
                    <h3 id="popupTitle" class="popup-title">공지</h3>
                    <button class="btn close-x" type="button" aria-label="Close" onclick="closePopup()">×</button>
                </div>

                <div id="popupBody" class="popup-body"></div>

                <div class="popup-footer">
                    <div class="popup-meta">
                        <span id="popupCounter"></span>
                    </div>
                    <div class="popup-actions">
                        <button class="btn danger" type="button" onclick="hideToday()">오늘 하루 보지 않기</button>
                        <button class="btn" id="btnPrev" type="button" onclick="prevPopup()">이전</button>
                        <button class="btn" id="btnNext" type="button" onclick="nextPopup()">다음</button>
                        <button class="btn primary" type="button" onclick="closePopup()">닫기</button>
                    </div>
                </div>
            </div>
        </div>

        <script type="module">
            import {Editor} from "https://esm.sh/@tiptap/core@2.11.5";
            import StarterKit from "https://esm.sh/@tiptap/starter-kit@2.11.5";
            import Underline from "https://esm.sh/@tiptap/extension-underline@2.11.5";
            import TextStyle from "https://esm.sh/@tiptap/extension-text-style@2.11.5";
            import Color from "https://esm.sh/@tiptap/extension-color@2.11.5";
            import Highlight from "https://esm.sh/@tiptap/extension-highlight@2.11.5";
            import Table from "https://esm.sh/@tiptap/extension-table@2.11.5";
            import TableRow from "https://esm.sh/@tiptap/extension-table-row@2.11.5";
            import TableHeader from "https://esm.sh/@tiptap/extension-table-header@2.11.5";
            import TableCell from "https://esm.sh/@tiptap/extension-table-cell@2.11.5";

            let popupViewer = null;

            function ensurePopupViewer() {
                if (popupViewer) return popupViewer;
                const host = document.querySelector("#popupBody");
                popupViewer = new Editor({
                    element: host,
                    editable: false,
                    extensions: [
                        StarterKit,
                        Underline,
                        TextStyle,
                        Color,
                        Highlight.configure({multicolor: true}),
                        Table.configure({resizable: true}),
                        TableRow,
                        TableHeader,
                        TableCell,
                    ],
                    content: "<p></p>",
                });
                return popupViewer;
            }

            function parseJsonSafely(str) {
                try {
                    return JSON.parse(str);
                } catch {
                    return null;
                }
            }

            function isTipTapDoc(obj) {
                return !!obj && typeof obj === "object" && (obj.type === "doc" || Array.isArray(obj.content));
            }

            function isTextEnvelope(obj) {
                return !!obj && typeof obj === "object" && typeof obj.text === "string";
            }

            function isProbablyJson(str) {
                if (typeof str !== "string") return false;
                const s = str.trim();
                if (!s) return false;
                if (!(s.startsWith("{") || s.startsWith("["))) return false;
                return parseJsonSafely(s) !== null;
            }

            function isProbablyHtml(str) {
                if (typeof str !== "string") return false;
                const s = str.trim();
                if (!s) return false;
                return /<\/?[a-z][\s\S]*>/i.test(s);
            }

            function escapeHtml(str) {
                return String(str ?? "")
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }

            window.renderPopupContentsAuto = (contents) => {
                const host = document.querySelector("#popupBody");

                if (contents == null) {
                    if (popupViewer) {
                        popupViewer.destroy();
                        popupViewer = null;
                    }
                    host.innerHTML = "<p>-</p>";
                    return;
                }

                if (typeof contents === "object") {
                    if (isTipTapDoc(contents)) {
                        const ed = ensurePopupViewer();
                        ed.commands.setContent(contents);
                        return;
                    }
                    if (isTextEnvelope(contents)) {
                        if (popupViewer) {
                            popupViewer.destroy();
                            popupViewer = null;
                            host.innerHTML = "";
                        }
                        host.innerHTML = `<p>${escapeHtml(contents.text).replaceAll("\n", "<br>")}</p>`;
                        return;
                    }
                    if (popupViewer) {
                        popupViewer.destroy();
                        popupViewer = null;
                        host.innerHTML = "";
                    }
                    host.innerHTML = `<p>${escapeHtml(JSON.stringify(contents)).replaceAll("\n", "<br>")}</p>`;
                    return;
                }

                const raw = String(contents).trim();

                if (isProbablyJson(raw)) {
                    const obj = parseJsonSafely(raw);
                    if (isTipTapDoc(obj)) {
                        const ed = ensurePopupViewer();
                        ed.commands.setContent(obj);
                        return;
                    }
                    if (isTextEnvelope(obj)) {
                        if (popupViewer) {
                            popupViewer.destroy();
                            popupViewer = null;
                            host.innerHTML = "";
                        }
                        host.innerHTML = `<p>${escapeHtml(obj.text).replaceAll("\n", "<br>")}</p>`;
                        return;
                    }
                    if (popupViewer) {
                        popupViewer.destroy();
                        popupViewer = null;
                        host.innerHTML = "";
                    }
                    host.innerHTML = `<p>${escapeHtml(raw).replaceAll("\n", "<br>")}</p>`;
                    return;
                }

                if (isProbablyHtml(raw)) {
                    if (popupViewer) {
                        popupViewer.destroy();
                        popupViewer = null;
                        host.innerHTML = "";
                    }
                    host.innerHTML = raw;
                    return;
                }

                if (popupViewer) {
                    popupViewer.destroy();
                    popupViewer = null;
                    host.innerHTML = "";
                }
                host.innerHTML = `<p>${escapeHtml(raw).replaceAll("\n", "<br>")}</p>`;
            };
        </script>

        <script>
            const API_URL = "http://localhost:8090/api/v1/notices-popup";
            let popupList = [];
            let currentIndex = 0;

            function endOfTodayMs() {
                const now = new Date();
                const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
                return end.getTime();
            }

            function isHiddenToday(noticeNo) {
                const key = `popup_notice_${noticeNo}_hide_until`;
                const until = Number(localStorage.getItem(key) || "0");
                return Date.now() < until;
            }

            function safeTime(v) {
                if (!v) return NaN;
                const s = String(v).replace(" ", "T");
                const t = Date.parse(s);
                return Number.isFinite(t) ? t : NaN;
            }

            function isWithinPeriod(item) {
                if (!item.startedAt || !item.endedAt) return true;
                const start = safeTime(item.startedAt);
                const end = safeTime(item.endedAt);
                if (!Number.isFinite(start) || !Number.isFinite(end)) return true;
                const now = Date.now();
                return now >= start && now <= end;
            }

            function openPopup() {
                document.getElementById("popupOverlay").style.display = "flex";
            }

            function closePopup() {
                document.getElementById("popupOverlay").style.display = "none";
            }

            function renderPopup(index) {
                const btnPrev = document.getElementById("btnPrev");
                const btnNext = document.getElementById("btnNext");
                if (btnPrev) btnPrev.disabled = (currentIndex <= 0);
                if (btnNext) btnNext.disabled = (currentIndex >= popupList.length - 1);

                if (!popupList.length) {
                    closePopup();
                    return;
                }
                if (index < 0 || index >= popupList.length) {
                    closePopup();
                    return;
                }

                const item = popupList[index];
                document.getElementById("popupTitle").textContent = item.title ?? `공지 #${item.noticeNo}`;

                if (window.renderPopupContentsAuto) window.renderPopupContentsAuto(item.contents);
                else document.getElementById("popupBody").textContent = String(item.contents ?? "");

                document.getElementById("popupCounter").textContent =
                    `${index + 1} / ${popupList.length} (noticeNo: ${item.noticeNo})`;

                openPopup();
            }

            function prevPopup() {
                if (!popupList.length) {
                    closePopup();
                    return;
                }
                for (let i = currentIndex - 1; i >= 0; i--) {
                    currentIndex = i;
                    renderPopup(currentIndex);
                    return;
                }
                renderPopup(currentIndex);
            }

            function nextPopup() {
                for (let i = currentIndex + 1; i < popupList.length; i++) {
                    currentIndex = i;
                    renderPopup(currentIndex);
                    return;
                }
                closePopup();
            }

            function hideToday() {
                const item = popupList[currentIndex];
                if (!item) return;
                const key = `popup_notice_${item.noticeNo}_hide_until`;
                localStorage.setItem(key, String(endOfTodayMs()));
                nextPopup();
            }

            function isPopupTrue(v) {
                return v === true || v === "true" || v === 1 || v === "1";
            }

            async function loadPopups() {
                try {
                    const res = await fetch(API_URL, {
                        method: "GET",
                        credentials: "include",
                        headers: {"Accept": "application/json"}
                    });
                    if (!res.ok) return;

                    const json = await res.json();
                    const data = Array.isArray(json.data) ? json.data : [];

                    popupList = data
                        .filter(item => item && isPopupTrue(item.isPopup))
                        .filter(isWithinPeriod)
                        .filter(item => !isHiddenToday(item.noticeNo));

                    if (!popupList.length) return;
                    currentIndex = 0;
                    renderPopup(currentIndex);
                } catch (err) {
                    console.error("Failed to load popups:", err);
                }
            }

            window.addEventListener("DOMContentLoaded", loadPopups);

            document.getElementById("popupOverlay").addEventListener("click", (e) => {
                if (e.target.id === "popupOverlay") closePopup();
            });

            window.addEventListener("keydown", (e) => {
                if (e.key === "Escape") closePopup();
            });
        </script>
    </div>

    <style>
        /* =========================
        Portal Dashboard Base (기존 유지)
        ========================== */

        /* 1. 최상단에 전역 박스 모델 설정 추가 (패딩 때문에 너비가 넓어지는 현상 방지) */
        .portal, .portal * {
            box-sizing: border-box;
        }

        .portal {
            --gap: 16px;
            --bd: 1px solid rgba(0, 0, 0, 0.12);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --radius: 8px;
            --card: #ffffff;
            --text: #333333;
            --accent-red: #d9534f;
            --accent-purple: #6f42c1;
            --line: #eeeeee;

            /* 2. 전체 너비 설정 최적화 */
            max-width: 1760px;
            width: 100%; /* 100vw 대신 100% 사용 */
            margin: 0 auto;
            padding: 16px;
            color: var(--text);
            font-family: 'Malgun Gothic', 'dotum', sans-serif;
            overflow-x: hidden; /* 가로 스크롤 방지 강제화 */
        }

        /* 3. 그리드 컬럼을 유연하게 변경 (핵심 수정) */
        .portal-grid {
            display: grid;
            /* 고정 380px 대신 minmax를 사용하여 화면이 좁아지면 컬럼도 같이 줄어들게 함 */
            grid-template-columns: minmax(300px, 380px) 1fr minmax(300px, 380px);
            gap: var(--gap);
            align-items: start;
        }

        .col {
            display: grid;
            gap: var(--gap);
        }

        .portlet {
            background: var(--card);
            border: var(--bd);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .portlet-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            background: #fafafa;
            font-weight: bold;
        }

        .portlet-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .portlet-body {
            padding: 12px;
            height: calc(100% - 45px);
            overflow-y: auto;
        }

        /* 1. 요약 카드 / 2. 결재함 스타일 (기존 유지) */
        .h-summary {
            height: 160px;
        }

        .summary-card {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .summary-row {
            display: flex;
            flex: 1;
            padding: 0 30px;
            border-bottom: 1px solid #f0f0f0;
            align-items: center;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            border: 1px solid #eee;
            font-size: 18px;
        }

        .summary-row.mail .summary-icon {
            color: var(--accent-red);
            background: #fff5f5;
        }

        .summary-row.appr .summary-icon {
            color: var(--accent-purple);
            background: #f8f5ff;
        }

        .summary-label {
            width: 70px;
            font-weight: bold;
            font-size: 15px;
            color: #555;
        }

        .summary-content {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        .summary-item {
            text-decoration: none;
            color: #444;
            font-size: 14px;
        }

        .summary-item .count {
            color: var(--accent-red);
            font-weight: bold;
            font-size: 20px;
            margin-left: 15px;
        }

        .h-appr {
            height: 400px;
        }

        .appr-tabs {
            display: flex;
            border-bottom: 2px solid #ddd;
            margin-bottom: 10px;
        }

        .appr-tab {
            padding: 8px 15px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #666;
            background: #f4f4f4;
            border: 1px solid #ddd;
            border-bottom: none;
            margin-right: 2px;
        }

        .appr-tab.active {
            background: #fff;
            color: #333;
            border-bottom: 2px solid #fff;
            margin-bottom: -2px;
        }

        .appr-row {
            display: flex;
            padding: 12px 8px;
            border-bottom: 1px solid #eee;
            align-items: flex-start;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .appr-info .title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #444;
        }

        .appr-info .meta {
            font-size: 12px;
            color: #888;
        }

        /* ============================================================
[주간 일정] 진짜 달력형 그리드 (세로선 투과형)
============================================================ */
        .h-combined {
            height: 560px;
            display: flex;
            flex-direction: column;
        }

        /* 월/일 버튼 스타일 유지 */
        .calendar-controls {
            margin-bottom: 12px;
            display: flex;
            justify-content: flex-start;
        }

        .segmented-control {
            display: flex;
            border: 1px solid #ccc;
            border-radius: 3px;
            overflow: hidden;
        }

        .segmented-control button {
            padding: 4px 12px;
            border: none;
            background: #f8f8f8;
            color: #444;
            cursor: pointer;
            font-size: 12px;
        }

        .segmented-control button.active {
            background: #fff;
            font-weight: bold;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .segmented-control button:not(:last-child) {
            border-right: 1px solid #ccc;
        }

        /* ❗ 핵심: 달력 전체 틀 설정 */
        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            /* 가로선을 없애도 달력의 전체 테두리는 유지되도록 함 */
            border: 1px solid #eee;
            border-bottom: 2px solid #eee; /* 하단 밑선 강조 */
        }

        /* 헤더 부분 */
        .calendar-table thead th {
            border: 1px solid #eee;
            background: #fafafa;
            padding: 10px 0;
            font-weight: normal;
        }

        .calendar-table thead th.today {
            background: #fffcf0;
            border-bottom: 2px solid #007bff;
        }

        /* [주간 일정] 배경 격자 설정 */
        .calendar-table tbody {
            /* 1. 배경에 세로선을 그립니다 (1px 선, 나머지는 투명) */
            background-image: linear-gradient(to right, #f0f0f0 1px, transparent 1px);

            /* 2. 가로 길이를 7등분(100% / 7)하여 배경이 반복되게 합니다 */
            background-size: calc(100% / 7) 100%;

            /* 3. 첫 번째 선이 왼쪽 끝에 딱 붙도록 위치 조정 */
            background-position: -1px 0;

            background-color: #ffffff; /* 달력 바탕색 */
        }

        /* 2. td에 position: relative를 주어 호버 시 절대 위치의 기준이 되게 함 */
        .calendar-table td {
            position: relative;
            border: none !important;
            padding: 2px 0;
            height: 42px; /* 일정 바 높이에 맞게 살짝 조절 */
            vertical-align: top;
        }

        /* 2. 일정 바 스타일 (이어져 보이게) */
        .cal-event.bar-style {
            display: flex; /* 시간 양쪽 배치를 위해 Flex 사용 */
            justify-content: space-between;
            align-items: center;
            position: relative;
            margin: 2px 0; /* 좌우 마진을 없애야 옆 칸과 딱 붙습니다 */
            padding: 5px 10px;
            border-radius: 0px;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 1;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* 🔥 4. 호버 시: 내용이 주변을 무시하고 최상단으로 떠오르며 전체 출력 */
        .cal-event.bar-style:hover {
            position: absolute; /* 주변 칸에 구애받지 않고 떠오름 */
            top: 0;
            left: 0;
            width: auto; /* 내용에 맞춰 너비 확장 */
            min-width: 100%; /* 최소 현재 칸 너비 유지 */
            max-width: 350px; /* 너무 길어지는 것 방지 */
            height: auto; /* 내용에 맞춰 높이 확장 */
            white-space: normal; /* 줄바꿈 허용 */
            overflow: visible; /* 잘린 내용 보이기 */
            z-index: 999; /* 최상단 레이어로 이동 */
            background: #fff !important; /* 배경을 불투명하게 하여 가독성 확보 */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25); /* 입체감 부여 */
            border: 1px solid currentColor;
            padding: 10px; /* 여유로운 패딩 */
        }

        /* 할 일 목록 (기존 스타일 유지) */
        .todo-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
        }

        .todo-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #d9534f;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #444;
        }

        .todo-item.done span {
            text-decoration: line-through;
            color: #bbb;
        }


        /* ============================================================
           기타 스타일 (기존 유지)
        ============================================================ */
        .h-mail-list {
            height: 800px;
        }

        .h-clock {
            height: 80px;
        }

        .h-notice, .h-board {
            height: 432px;
        }

        .simple-list-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f9f9f9;
            font-size: 13px;
            text-decoration: none;
            color: #444;
        }

        .simple-list-item .date {
            color: #bbb;
            font-size: 12px;
        }

        .clock-mini {
            background: #333;
            color: #fff;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

        .clock-mini .time {
            font-size: 28px;

        }

        .clock-mini .date {
            font-size: 13px;
            opacity: 0.8;
        }

        /* 4. 브레이크포인트 조정 (반응형 시점) */
        @media (max-width: 1400px) {
            /* 1300px에서 1400px로 상향 조정 */

                grid-template-columns: minmax(300px, 380px) 1fr minmax(300px, 380px);

    </style>

<th:block layout:fragment="pageScripts">
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. 실시간 시계 시작
            updateClock();
            setInterval(updateClock, 1000);

            // 2. 결재함 탭 이벤트 바인딩
            bindApprovalTabs();

            // 3. 모든 API 데이터 로드 실행
            loadAllDashboardData();
        });

        // 공통 API 호출 함수
        async function apiGet(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`API 호출 실패: ${url}`);
                const result = await response.json();
                return result.data; // ResponseDto의 data 필드 반환
            } catch (error) {
                console.error("데이터 로드 중 오류 발생:", error);
                return null;
            }
        }

        /**
         * 전역 데이터 로드 함수
         */
        async function loadAllDashboardData() {
            // 1. 대시보드 요약 (메일/결재 카운트)
            const summary = await apiGet('/api/v1/dashboard/summary');
            if (summary) {
                document.getElementById('mailNew').textContent = summary.newMail || 0;
            }

            // ✅ 수정: 결재할 문서 개수 - Page 객체의 totalElements 활용
            const awaitingResult = await apiGet('/api/v1/documents/me?status=AWAITING');
            if (awaitingResult && awaitingResult.totalElements !== undefined) {
                document.getElementById('needApprove').textContent = awaitingResult.totalElements;
            }

            // 2. 메일 목록 (Inbox - Page 객체라면 .content 사용 필요 확인)
            const mailResult = await apiGet('/api/v1/mails/inbox');
            const mails = mailResult && mailResult.content ? mailResult.content : mailResult; // Page 대응
            renderList('mailList', mails, (item) => `
        <a href="/mail/${item.mailNo}" class="simple-list-item">
            <span>${item.title}</span> <span class="date">${formatDate(item.createdAt)}</span>
        </a>
    `, 10);

            // 3. 결재함 초기 로드 (AWAITING)
            loadApprovalList('AWAITING');

            // 4. 공지사항 (Page 객체라면 .content 사용)
            const noticeResult = await apiGet('/api/v1/notices-all');
            const notices = noticeResult && noticeResult.content ? noticeResult.content : noticeResult;
            renderList('noticeList', notices, (item) => `
        <a href="/notice/${item.noticeNo}" class="simple-list-item">
            <span>${item.title}</span> <span class="date">${formatDate(item.createdAt)}</span>
        </a>
    `, 10);

            // 5. 주간 일정 (통합 API 호출)
            const baseDate = formatYmdLocal(currentBaseDate);
            const events = await apiGet(`/api/v1/dashboard/summary/calendar?baseDate=${encodeURIComponent(baseDate)}`);
            renderCalendar(Array.isArray(events) ? events : []);

            // 6. 할 일 (Todo) - ✅ 필드명을 title로 수정
            const todos = await apiGet('/api/v1/todos');
            renderList('todoList', todos, (item) => `
        <div class="todo-item ${item.isDone ? 'done' : ''}" id="todo-row-${item.todoNo}">
            <input type="checkbox" ${item.isDone ? 'checked' : ''} onchange="toggleTodoStatus(${item.todoNo}, this.checked)">
            <span class="todo-text">${item.title}</span> </div>
    `);

            // 7. 자유게시판
            const boards = await apiGet('/api/v1/boards/top-view');
            renderList('boardList', boards, (item) => `
        <a href="/board/${item.boardNo}" class="simple-list-item">
            <span>${item.title}</span> <span class="date">${item.rating}회</span>
        </a>
    `);
        }

        /**
         * 결재함 리스트 로드 (Page 객체 대응)
         */
        async function loadApprovalList(type) {
            const target = document.getElementById('approvalList');
            if (!target) return;

            target.innerHTML = '<div style="text-align:center; padding:20px; color:#bbb;">불러오는 중...</div>';

            // ✅ 수정: 백엔드 컨트롤러 사양에 맞춘 엔드포인트 및 상세 페이지 이동용 status 설정
            let endpoint = '';
            let viewStatus = '';

            if (type === 'AWAITING') {
                endpoint = '/api/v1/documents/me?status=AWAITING';
                viewStatus = 'AWAITING';
            } else if (type === 'SUBMITTED') {
                endpoint = '/api/v1/documents/me?status=SUBMITTED';
                viewStatus = 'SUBMITTED';
            } else if (type === 'REJECTED') {
                // 반려된 문서는 내가 상신한 문서(SUBMITTED) 목록 중 docStat이 RJ인 것만 요청
                endpoint = '/api/v1/documents/me?status=SUBMITTED&docStat=RJ';
                viewStatus = 'SUBMITTED';
            }

            const result = await apiGet(endpoint);

            // ✅ Page 객체의 content 배열을 가져옴
            let data = (result && result.content) ? result.content : (Array.isArray(result) ? result : []);

            if (data.length === 0) {
                target.innerHTML = '<div style="text-align:center; padding:20px; color:#bbb;">문서가 없습니다.</div>';
                return;
            }

            // ✅ 수정: 제목 옆 (AW) 제거 및 하단 메타 정보(작성자, 사번, 상신일 시:분까지) 명확히 표시
            target.innerHTML = data.map(doc => {
                const cleanTitle = (doc.title || '').replace(' (AW)', '');

                // ✅ 수정: DTO에 있는 submittedAt을 사용 (없을 경우 createdAt 사용)
                const dateSource = doc.submittedAt || doc.createdAt;
                const d = new Date(dateSource);
                const formattedDateTime = `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

                // ✅ 수정: 작성자 명칭 및 포맷 (ResDocumentDto 필드 매칭: doc.writer(이름), doc.writerId(사번))
                return `
                <a href="/documents/${doc.docNo}?status=${viewStatus}" class="appr-row">
                    <span class="arrow">▶</span>
                    <div class="appr-info">
                        <div class="title">${cleanTitle}</div>
                        <div class="meta">작성자:${doc.writer || ''} (${doc.writerId || ''}) | 상신일: ${formattedDateTime}</div>
                    </div>
                </a>
            `
            }).join('');
        }

        /**
         * ✅ Todo 상태 변경 API 호출 함수
         * @param {number} todoNo - 할 일 번호
         * @param {boolean} isChecked - 체크 여부 (isDone)
         */
        async function toggleTodoStatus(todoNo, isChecked) {
            try {
                const response = await fetch(`/api/v1/todos/${todoNo}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({isDone: isChecked})
                });

                if (!response.ok) throw new Error('상태 변경 업데이트 실패');

                // ✅ 서버 업데이트 성공 시 UI 즉시 반영
                const row = document.getElementById(`todo-row-${todoNo}`);
                if (row) {
                    if (isChecked) row.classList.add('done');
                    else row.classList.remove('done');
                }

                console.log(`${todoNo}번 할 일 상태가 ${isChecked}로 변경되었습니다.`);
            } catch (error) {
                alert('상태 변경 중 오류가 발생했습니다.');
                console.error(error);

                // 에러 발생 시 체크박스 원복 (선택 사항)
                event.target.checked = !isChecked;
            }
        }

        function bindApprovalTabs() {
            const tabs = document.querySelectorAll('.appr-tab');
            const types = ['AWAITING', 'SUBMITTED', 'REJECTED'];

            tabs.forEach((tab, index) => {
                tab.addEventListener('click', function () {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    loadApprovalList(types[index]);
                });
            });
        }

        /**
         * 리스트 렌더링 보조 함수
         */
        function renderList(targetId, data, templateFn, limit = null) {
            const target = document.getElementById(targetId);
            if (!target) return;
            if (!data || data.length === 0) {
                target.innerHTML = '<div style="color:#bbb; text-align:center; padding:20px;">데이터가 없습니다.</div>';
                return;
            }
            if (!Array.isArray(data) || data.length === 0) {
                target.innerHTML = '<div style="color:#bbb; text-align:center; padding:20px;">데이터가 없습니다.</div>';
                return;
            }

            const displayData = limit ? data.slice(0, limit) : data;
            target.innerHTML = displayData.map(templateFn).join('');
        }

        let currentStartDay = 1;

        // ✅ 대시보드 주간 캘린더가 “현재 보고 있는 주”의 기준일
        let currentBaseDate = new Date(); // 처음엔 오늘
        /*<![CDATA[*/


        function formatYmdLocal(d) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function moveWeek(step) {
            // step: -1 이전주, +1 다음주
            const d = new Date(currentBaseDate);
            d.setDate(d.getDate() + (step * 7));
            d.setHours(0, 0, 0, 0);
            currentBaseDate = d;
            loadAllDashboardData();
        }

        /**
         * 날짜 포맷 (MM.DD)
         */

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
        }

        /* 🔥 핵심: 일정 유형에 따른 표시 텍스트 생성 로직 */
        function getEventDisplayText(e, startOfWeek, endOfWeek) {
            if (e.allDay) return e.title;

            const s = new Date(e.startAt);
            const en = new Date(e.endedAt);
            const sTime = formatTimeOnly(e.startAt);
            const eTime = formatTimeOnly(e.endedAt);

            // 1. 당일 종료 일정
            if (s.toDateString() === en.toDateString()) {
                return `<b>${sTime} ~ ${eTime}</b> ${e.title}`;
            }

            // 2. 여러 날에 걸친 일정
            const isStartInThisWeek = s >= startOfWeek && s < endOfWeek;
            const isEndInThisWeek = en > startOfWeek && en <= endOfWeek;

            if (isStartInThisWeek && isEndInThisWeek) {
                // 이번 주 안에 시작과 끝이 다 있는 경우 (하지만 날짜는 다름)
                return `<b>${sTime}</b> ${e.title} <b>~ ${eTime}</b>`;
            } else if (isStartInThisWeek) {
                // 이번 주에 시작만 하는 경우
                return `<b>${sTime}</b> ${e.title} `;
            } else if (isEndInThisWeek) {
                // 이번 주에 종료만 하는 경우
                return `<b>~ ${eTime}</b> ${e.title}`;
            } else {
                // 이번 주는 그냥 지나가는 기간인 경우
                return ` ${e.title} `;
            }
        }

        /* 보조 함수: 시간 포맷 (00:00이면 빈 값 반환) */
        function formatTimeOnly(dateTimeStr) {
            if (!dateTimeStr) return "";
            const date = new Date(dateTimeStr);
            const hh = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');
            const timeStr = `${hh}:${mm}`;

            // 00:00 이면 보이지 않게 처리
            return timeStr === "00:00" ? "" : timeStr;
        }

        function renderCalendar(items) {
            const grid = document.getElementById('weekGrid');
            if (!grid) return;
            grid.innerHTML = '';

            const safeItems = Array.isArray(items) ? items : [];
            const now = new Date(currentBaseDate); // ✅ 내가 보고 있는 주 기준
            const startOfWeek = new Date(now);

            const dayNum = now.getDay();
            // 월요일 시작: 일(0)이면 -6, 그 외에는 1 - dayNum
            const diff = (dayNum === 0 ? -6 : 1 - dayNum);
            startOfWeek.setDate(now.getDate() + diff);
            startOfWeek.setHours(0, 0, 0, 0);

            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 7);

            const table = document.createElement('table');
            table.className = 'calendar-table';
            const thead = document.createElement('thead');
            const tbody = document.createElement('tbody');

            // 1. 헤더 생성
            const hRow = document.createElement('tr');
            const baseDayNames = ['일', '월', '화', '수', '목', '금', '토'];
            for (let i = 0; i < 7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(startOfWeek.getDate() + i);
                const th = document.createElement('th');
                if (d.toDateString() === now.toDateString()) th.className = 'today';
                th.innerHTML = `<div style="font-size:11px; color:#888;">${baseDayNames[d.getDay()]}</div>
                        <div style="font-size:14px; font-weight:bold;">${d.getDate()}</div>`;
                hRow.appendChild(th);
            }
            thead.appendChild(hRow);

            // 2. 데이터 가공
            const processed = safeItems.filter(e => new Date(e.startAt) < endOfWeek && new Date(e.endedAt) > startOfWeek)
                .map(e => {
                    const s = new Date(e.startAt);
                    const en = new Date(e.endedAt);
                    const sIdx = Math.max(0, Math.floor((s - startOfWeek) / 86400000));
                    const eIdx = Math.min(6, Math.floor((en - 1 - startOfWeek) / 86400000));
                    return {
                        data: e,
                        sIdx,
                        colspan: Math.max(1, eIdx - sIdx + 1),
                        eIdx: sIdx + Math.max(1, eIdx - sIdx + 1)
                    };
                }).sort((a, b) => a.sIdx - b.sIdx || b.colspan - a.colspan);

            const rows = [];
            processed.forEach(ev => {
                let row = rows.find(r => !r.some(re => ev.sIdx < re.eIdx && ev.eIdx > re.sIdx));
                if (!row) {
                    row = [];
                    rows.push(row);
                }
                row.push(ev);
            });

            // 3. 메인 렌더링 로직 (시간 및 물결표 처리)
            rows.forEach(row => {
                const tr = document.createElement('tr');
                let curIdx = 0;
                row.sort((a, b) => a.sIdx - b.sIdx).forEach(ev => {
                    while (curIdx < ev.sIdx) {
                        tr.appendChild(document.createElement('td'));
                        curIdx++;
                    }

                    const td = document.createElement('td');
                    td.colSpan = ev.colspan;
                    const e = ev.data;
                    const color = e.color || '#007bff';

                    const sTime = formatTimeOnly(e.startAt);
                    const eTime = formatTimeOnly(e.endedAt);

                    let timeContent = "";
                    if (ev.colspan > 1) {
                        // 다일 일정: 시작/끝이 00:00이면 해당 쪽의 시간과 ~를 세트로 관리
                        const startLabel = sTime ? `<b>${sTime}</b> ${e.title}` : `${e.title}`;
                        const endLabel = eTime ? `~ <b>${eTime}</b>` : ``;

                        timeContent = `
                    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                        <span style="white-space: nowrap; flex-shrink: 0;">${startLabel}</span>
                        <span style="white-space: nowrap; flex-shrink: 0;">${endLabel}</span>
                    </div>`;
                    } else {
                        // 단일 일정: 🔥 시간이 둘 다 없으면 물결표 없이 제목만
                        if (!sTime && !eTime) {
                            timeContent = `<span style="white-space: nowrap;">${e.title}</span>`;
                        } else if (sTime && eTime) {
                            timeContent = `<span style="white-space: nowrap;"><b>${sTime} ~ ${eTime}</b> ${e.title}</span>`;
                        } else {
                            // 한쪽만 시간이 있는 경우 (거의 없겠지만 예외 처리)
                            const singleTime = sTime || eTime;
                            timeContent = `<span style="white-space: nowrap;"><b>${singleTime}</b> ${e.title}</span>`;
                        }
                    }

                    const transparentBg = color + "15";
                    const scope = String(e.scope || 'PERSONAL').toUpperCase(); // ✅ 추가


                    td.innerHTML = `<div class="cal-event bar-style" data-sch-no="${e.schNo}"data-scope="${scope}" title="${e.title}"
                                 style="border-left:4px solid ${color}; background:${transparentBg}; color:${color}; cursor:pointer;">
                                 ${timeContent}
                            </div>`;
                    tr.appendChild(td);
                    curIdx += ev.colspan;
                });
                while (curIdx < 7) {
                    tr.appendChild(document.createElement('td'));
                    curIdx++;
                }
                tbody.appendChild(tr);
            });

            for (let i = rows.length; i < 5; i++) {
                const tr = document.createElement('tr');
                for (let j = 0; j < 7; j++) tr.appendChild(document.createElement('td'));
                tbody.appendChild(tr);
            }

            table.appendChild(thead);
            table.appendChild(tbody);
            grid.innerHTML = '';
            grid.appendChild(table);
        }

        (function bindWeekEventClick() {
            const grid = document.getElementById('weekGrid');
            if (!grid || grid.dataset.bound === '1') return;
            grid.dataset.bound = '1';

            grid.addEventListener('click', (e) => {
                const el = e.target.closest('.cal-event[data-sch-no]');
                if (!el) return;

                const schNo = el.dataset.schNo;
                const scope = el.dataset.scope || 'PERSONAL';

                // ✅ 캘린더 페이지로 이동 + 상세 자동 오픈용 파라미터 전달
                window.location.href = `/schedule/calendar?open=1&schNo=${encodeURIComponent(schNo)}&scope=${encodeURIComponent(scope)}`;
            });
        })();

        /*]]>*/

        function updateClock() {
            const now = new Date();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} (${days[now.getDay()]})`;
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const dateEl = document.getElementById('clockDate');
            const timeEl = document.getElementById('clockTime');
            if (dateEl) dateEl.textContent = dateStr;
            if (timeEl) timeEl.textContent = timeStr;
        }
    </script>
</th:block>
</html>
